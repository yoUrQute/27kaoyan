<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>考研政治 · 核心记忆与2027时政微闯关</title>
  <style>
    /* ==========================================================================
       1. 温润纸质设计系统（适配 iPhone Safari 与主屏幕全屏）
       ========================================================================== */
    :root {
      --bg-paper: #FAF8F5;
      --bg-card: #FFFFFF;
      --bg-subtle: #F2EFE9;
      --bg-hover: #E7E2D8;

      --ink: #1D232A;
      --ink-secondary: #4A5460;
      --ink-muted: #78828E;

      --crimson: #B83B2B;
      --crimson-soft: #FDF2F0;
      --crimson-border: rgba(184, 59, 43, 0.24);

      --slate: #2B5B6C;
      --slate-soft: #EFF5F7;
      --slate-border: rgba(43, 91, 108, 0.24);

      --forest: #2E6F40;
      --forest-soft: #EEF7F1;
      --forest-border: rgba(46, 111, 64, 0.26);

      --amber: #B45309;
      --amber-soft: #FEF6E7;
      --amber-border: rgba(180, 83, 9, 0.32);

      --err: #B42318;
      --err-soft: #FEF3F2;
      --err-border: rgba(180, 35, 24, 0.28);

      --border: #E5E0D6;
      --shadow-sm: 0 2px 6px rgba(29, 35, 42, 0.04);
      --shadow-md: 0 10px 26px rgba(29, 35, 42, 0.07);

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 18px;

      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-serif: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100dvh;
      background-color: var(--bg-paper);
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.56;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea {
      font-family: inherit;
      outline: none;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
      transition: transform 0.12s ease, background-color 0.16s ease, border-color 0.16s ease, opacity 0.16s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.975);
    }

    button:disabled {
      cursor: not-allowed;
    }

    .app-shell {
      max-width: 700px;
      margin: 0 auto;
      padding: 12px 14px calc(26px + env(safe-area-inset-bottom, 0px));
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ==========================================================================
       2. 顶部栏 & 双主赛道切换
       ========================================================================== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--crimson) 0%, var(--slate) 100%);
      color: #FFFFFF;
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .brand-sub {
      margin: 0;
      font-size: 11px;
      color: var(--ink-muted);
    }

    .top-btns {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-secondary);
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
    }

    .pill-btn.slate { background: var(--slate-soft); border-color: var(--slate-border); color: var(--slate); }
    .pill-btn.crimson { background: var(--crimson-soft); border-color: var(--crimson-border); color: var(--crimson); }
    .pill-btn.amber { background: var(--amber-soft); border-color: var(--amber-border); color: var(--amber); }

    .track-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--bg-subtle);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .track-tab {
      padding: 8px 8px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      color: var(--ink-secondary);
      font-weight: 700;
      font-size: 13px;
    }

    .track-tab .sub {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--ink-muted);
    }

    .track-tab.active {
      background: var(--bg-card);
      box-shadow: var(--shadow-sm);
    }

    .track-tab[data-track="ca"].active { color: var(--slate); }
    .track-tab[data-track="core"].active { color: var(--crimson); }
    .track-tab.active .sub { color: var(--ink-secondary); }

    /* ==========================================================================
       3. 进度条 & 子工具条
       ========================================================================== */
    .goal-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 12px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .goal-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .goal-metrics {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12px;
      font-weight: 700;
    }

    .goal-metrics span.lbl {
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-muted);
      margin-right: 3px;
    }

    .goal-track {
      width: 100%;
      height: 6px;
      background: var(--bg-subtle);
      border-radius: 999px;
      overflow: hidden;
    }

    .goal-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--slate) 0%, var(--forest) 100%);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .mini-btn {
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      background: var(--bg-subtle);
      color: var(--ink-secondary);
    }

    .mini-btn:hover { background: var(--bg-hover); color: var(--ink); }
    .mini-btn.danger { background: var(--crimson-soft); color: var(--crimson); }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .seg-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .seg-btn {
      padding: 6px 10px;
      border-radius: 9px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-secondary);
    }

    .seg-btn.active { background: var(--slate); border-color: var(--slate); color: #FFFFFF; }
    .seg-btn.active-crimson { background: var(--crimson); border-color: var(--crimson); color: #FFFFFF; }
    .seg-btn.active-forest { background: var(--forest); border-color: var(--forest); color: #FFFFFF; }

    /* ==========================================================================
       4. Track B：2027时政微闯关（轻量化微提示 + 1题即测 + 折叠速览）
       ========================================================================== */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }

    @keyframes slideUp {
      0% { transform: translateY(10px); opacity: 0.4; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .anim-in {
      animation: slideUp 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge.slate { background: var(--slate-soft); color: var(--slate); border: 1px solid var(--slate-border); }
    .badge.crimson { background: var(--crimson-soft); color: var(--crimson); border: 1px solid var(--crimson-border); }
    .badge.forest { background: var(--forest-soft); color: var(--forest); border: 1px solid var(--forest-border); }
    .badge.amber { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber-border); }
    .badge.muted { background: var(--bg-subtle); color: var(--ink-muted); border: 1px solid var(--border); }

    /* 微提示切片卡片 */
    .micro-tip-card {
      background: var(--bg-card);
      border: 1.5px solid var(--slate-border);
      border-radius: var(--radius-lg);
      padding: 13px 15px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .micro-tip-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .micro-tip-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }

    .chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .kw-chip {
      background: var(--slate-soft);
      border: 1px solid var(--slate-border);
      color: var(--ink);
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 12.5px;
      line-height: 1.42;
      font-weight: 600;
    }

    .kw-chip strong {
      color: var(--slate);
      font-weight: 800;
    }

    .micro-full-text {
      margin: 0;
      padding: 8px 10px;
      border-radius: 9px;
      background: var(--bg-paper);
      border: 1px solid var(--border);
      font-size: 12.5px;
      color: var(--ink-secondary);
      line-height: 1.55;
    }

    /* 做题卡片 */
    .quiz-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 15px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .q-stem {
      font-family: var(--font-serif);
      font-size: 15.5px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.58;
    }

    .opt-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .opt-btn {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: 11px;
      border: 1.5px solid var(--border);
      background: var(--bg-paper);
      font-size: 13.5px;
      line-height: 1.48;
      color: var(--ink);
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--slate);
      background: var(--slate-soft);
    }

    .opt-btn.selected {
      border-color: var(--slate);
      background: var(--slate-soft);
      font-weight: 700;
    }

    .opt-btn.opt-right {
      border-color: var(--forest);
      background: var(--forest-soft);
      color: var(--forest);
      font-weight: 700;
    }

    .opt-btn.opt-wrong {
      border-color: var(--err);
      background: var(--err-soft);
      color: var(--err);
      font-weight: 700;
    }

    .opt-key {
      font-family: var(--font-mono);
      font-weight: 800;
      flex-shrink: 0;
    }

    .feedback-box {
      border-radius: 11px;
      padding: 10px 12px;
      font-size: 12.8px;
      line-height: 1.55;
    }

    .feedback-box.right {
      background: var(--forest-soft);
      border: 1px solid var(--forest-border);
      color: var(--forest);
    }

    .feedback-box.wrong {
      background: var(--err-soft);
      border: 1px solid var(--err-border);
      color: var(--err);
    }

    /* 折叠速览目录（手风琴，绝不一次性摊开长文） */
    .acc-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .acc-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .acc-item.done {
      border-color: var(--forest-border);
    }

    .acc-head {
      width: 100%;
      padding: 11px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
    }

    .acc-title {
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
    }

    .acc-body {
      padding: 0 13px 12px;
      border-top: 1px solid var(--border);
      background: var(--bg-paper);
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 10px;
    }

    /* ==========================================================================
       5. Track A：32核心会议 + 25毛选著作（干净两态切换：签面 / 考点解析）
       ========================================================================== */
    .card-panel {
      width: 100%;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-front-view {
      padding: 20px 18px;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      gap: 16px;
      cursor: pointer;
    }

    .card-back-view {
      display: flex;
      flex-direction: column;
    }

    .face-top {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .front-year {
      font-family: var(--font-mono);
      font-size: clamp(38px, 9.5vw, 52px);
      font-weight: 800;
      line-height: 1.08;
      margin-bottom: 10px;
    }

    .front-year.meeting { color: var(--crimson); }
    .front-year.work { color: var(--forest); }
    .front-year.blind { color: var(--slate); }

    .front-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: clamp(20px, 5.2vw, 27px);
      font-weight: 700;
      color: var(--ink);
      line-height: 1.38;
    }

    .front-tip {
      font-size: 12px;
      color: var(--ink-muted);
      background: var(--bg-paper);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
    }

    .back-top {
      padding: 12px 15px;
      background: #FCFBF8;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .back-body {
      padding: 13px 15px 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .layer-box {
      border-radius: 10px;
      padding: 10px 12px;
    }

    .layer-box.core { background: #FFFFFF; border: 1px solid var(--border); border-left: 3.5px solid var(--slate); }
    .layer-box.sec { background: var(--bg-paper); border: 1px solid var(--border); }
    .layer-box.trap { background: var(--amber-soft); border: 1px solid var(--amber-border); border-left: 3.5px solid var(--amber); }
    .layer-box.link { background: var(--slate-soft); border: 1px solid var(--slate-border); }

    .layer-lbl {
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .layer-box.core .layer-lbl { color: var(--slate); }
    .layer-box.sec .layer-lbl { color: var(--ink-secondary); }
    .layer-box.trap .layer-lbl { color: var(--amber); }
    .layer-box.link .layer-lbl { color: var(--slate); }

    .layer-txt {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.6;
      word-break: break-word;
    }

    .kw-hl {
      font-weight: 700;
      padding: 0 3px;
      border-radius: 4px;
    }

    .kw-hl.meeting { background: var(--crimson-soft); color: var(--crimson); }
    .kw-hl.work { background: var(--forest-soft); color: var(--forest); }

    .cloze-pill {
      display: inline-block;
      padding: 1px 8px;
      margin: 0 2px;
      border-radius: 5px;
      font-weight: 700;
      cursor: pointer;
    }

    .cloze-pill.masked {
      background: var(--slate);
      color: var(--slate);
      user-select: none;
    }

    .cloze-pill.shown {
      background: var(--forest-soft);
      color: var(--forest);
      border: 1px solid var(--forest-border);
    }

    .back-bottom {
      padding: 9px 15px;
      background: #FCFBF8;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      color: var(--ink-muted);
    }

    /* ==========================================================================
       6. 底部按钮、空态卡 & 弹窗（严格关闭时隐藏，打开时独立流式排列不叠层）
       ========================================================================== */
    .empty-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 26px 18px;
      text-align: center;
      box-shadow: var(--shadow-md);
    }

    .empty-card h3 {
      margin: 0 0 8px;
      font-family: var(--font-serif);
      font-size: 18.5px;
    }

    .empty-card p {
      margin: 0 0 16px;
      font-size: 13.5px;
      color: var(--ink-secondary);
    }

    .lock-tip {
      text-align: center;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--amber);
      background: var(--amber-soft);
      border: 1px solid var(--amber-border);
      border-radius: 9px;
      padding: 5px 10px;
      margin-bottom: 6px;
    }

    .btn-row {
      display: flex;
      gap: 9px;
      width: 100%;
    }

    .btn-main {
      flex: 1;
      min-height: 48px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      background: var(--slate);
      color: #FFFFFF;
      font-size: 14.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(43, 91, 108, 0.2);
    }

    .btn-main:disabled {
      background: #D8D4CA;
      color: #8A867C;
      box-shadow: none;
    }

    .btn-err {
      flex: 1;
      min-height: 50px;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      background: var(--crimson-soft);
      border: 1.5px solid var(--crimson);
      color: var(--crimson);
      font-size: 14px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .btn-ok {
      flex: 1;
      min-height: 50px;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      background: var(--forest);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(46, 111, 64, 0.2);
    }

    .btn-err span.sub, .btn-ok span.sub {
      font-size: 10.5px;
      font-weight: 400;
      opacity: 0.9;
    }

    .btn-err:disabled, .btn-ok:disabled {
      background: #E8E5DC;
      border-color: #DAD6CC;
      color: #969288;
      box-shadow: none;
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(29, 35, 42, 0.52);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      padding: 12px 12px 0;
    }

    @media (min-width: 640px) {
      .modal-bg { align-items: center; padding: 18px; }
    }

    .modal-bg.open { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 660px;
      max-height: 85dvh;
      background: var(--bg-paper);
      border-radius: 18px 18px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    @media (min-width: 640px) {
      .modal-box { border-radius: 18px; max-height: 84dvh; }
    }

    .modal-box.narrow {
      max-width: 440px;
      border-radius: 16px;
      margin-bottom: 16px;
    }

    .modal-head {
      padding: 13px 16px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;

  <script>
    /* ==========================================================================
       1. TRACK A：32 核心会议 + 25 篇毛泽东著作（保留会著联动与三层解析）

    const CORE_CARDS = [
      { id: "m01", kind: "meeting", order: 1921.07, year: "1921", title: "中共一大", tag: "建党开天辟地", linkIds: ["m02"], linkNote: "一大宣告建党并提出最高奋斗目标，次年二大补齐反帝反封建民主革命纲领。", core: "通过党纲，确定推翻资产阶级、建立{{无产阶级专政}}；确定党名为中国共产党；宣告{{中国共产党成立}}。", sec: "确定中心工作为组织和领导工人运动。", trap: "未提出反帝反封建民主革命纲领（1922中共二大）。", q: { stem: "中共一大首次明确提出了反帝反封建的民主革命纲领。", ans: false, exp: "错误。反帝反封建民主革命纲领首提于1922年中共二大。" } },
      { id: "m02", kind: "meeting", order: 1922.07, year: "1922", title: "中共二大", tag: "首提反帝反封建纲领", linkIds: ["m01", "m03"], linkNote: "二大首提反帝反封建纲领，三大据此决定党内合作建立统一战线。", core: "首次提出明确的{{反帝反封建}}民主革命纲领；区分{{最低纲领}}与{{最高纲领}}。", sec: "开始采取群众路线方法；决定加入共产国际。", trap: "未提出无产阶级领导权与工农联盟（1925中共四大）。", q: { stem: "中共二大首次区分并制定了党的最低纲领和最高纲领。", ans: true, exp: "正确。最低纲领反帝反封建，最高纲领实现共产主义。" } },
      { id: "m03", kind: "meeting", order: 1923.06, year: "1923", title: "中共三大", tag: "决定党内合作", linkIds: ["m02", "m04"], linkNote: "三大决定个人名义加入国民党，四大进一步明确无产阶级领导权。", core: "决定全体共产党员以{{个人名义加入国民党}}（党内合作），建立{{革命统一战线}}；保持党在政治、思想、组织上的{{独立性}}。", sec: "正确估计孙中山和国民党的革命立场。", trap: "第一次国共合作正式形成标志为1924年国民党一大。", q: { stem: "中共三大的召开标志着第一次国共合作正式形成。", ans: false, exp: "错误。正式形成标志是1924年国民党一大。" } },
      { id: "m04", kind: "meeting", order: 1925.01, year: "1925", title: "中共四大", tag: "首提领导权与工农联盟", linkIds: ["w01", "w02"], linkNote: "四大首提无产阶级领导权与工农联盟，年底《中国社会各阶级的分析》系统论证这一思想。", core: "明确提出{{无产阶级在民主革命中的领导权}}问题；明确提出{{工农联盟}}问题，指出农民是天然同盟军。", sec: "对民主革命内容作了更完整规定。", trap: "“农民问题乃国民革命的中心问题”出自1926《国民革命与农民运动》。", q: { stem: "中共四大首次明确提出了无产阶级领导权和工农联盟问题。", ans: true, exp: "正确。这是中共四大核心历史贡献。" } },
      { id: "m05", kind: "meeting", order: 1927.08, year: "1927", title: "八七会议", tag: "土地革命与武装反抗", linkIds: ["w03", "m06"], linkNote: "大革命失败后八七会议提出“枪杆子出政权”，1929古田会议定型“党指挥枪”。", core: "清算陈独秀{{右倾机会主义}}；确定{{土地革命}}和{{武装反抗国民党反动统治}}总方针；提出“{{政权是由枪杆子中取得的}}”。", sec: "决定发动秋收起义。", trap: "思想建党、政治建军原则确立于1929古田会议。", q: { stem: "八七会议确立了思想建党、政治建军的建党建军原则。", ans: false, exp: "错误。思想建党、政治建军原则确立于1929年古田会议。" } },
      { id: "m06", kind: "meeting", order: 1929.12, year: "1929", title: "古田会议", tag: "思想建党·政治建军", linkIds: ["m05", "w04"], linkNote: "围绕井冈山与赣南闽西根据地建设，古田会议确立思想建党、政治建军原则。", core: "确立{{思想建党、政治建军}}原则；规定红军是执行革命政治任务的武装集团；使{{党对军队绝对领导}}根本原则定型。", sec: "通过《古田会议决议》，肃清非无产阶级思想。", trap: "党指挥枪发端于南昌起义、奠基于三湾改编、定型于古田会议。", q: { stem: "古田会议确立了思想建党、政治建军原则，使党对军队绝对领导定型。", ans: true, exp: "正确。古田会议定型党对军队绝对领导根本原则。" } },
      { id: "m07", kind: "meeting", order: 1931.11, year: "1931", title: "中华苏维埃第一次全国代表大会", tag: "工农民主专政建立", linkIds: ["w04", "w05"], linkNote: "“工农武装割据”发展到建立全国性红色政权——中华苏维埃共和国临时中央政府。", core: "在瑞金召开，通过《{{中华苏维埃共和国宪法大纲}}》；宣告{{中华苏维埃共和国临时中央政府}}成立，建立{{工农民主专政}}政权。", sec: "实行工农兵代表大会制度。", trap: "“三三制”政权属抗战时期，非苏维埃工农民主专政政权。", q: { stem: "中华苏维埃第一次全国代表大会实行“三三制”抗日民主政权原则。", ans: false, exp: "错误。苏维埃实行工农兵代表大会制度，“三三制”属抗战时期。" } },
      { id: "m08", kind: "meeting", order: 1935.01, year: "1935", title: "遵义会议", tag: "生死攸关转折点", linkIds: ["w08", "m09"], linkNote: "遵义会议解决军事和组织问题，会后《中国革命战争的战略问题》从理论上总结土地革命军事经验。", core: "集中解决最具决定意义的{{军事问题和组织问题}}；开始确立以毛泽东为主要代表的正确路线在党中央的{{领导地位}}；{{生死攸关的转折点}}。", sec: "成立周恩来、毛泽东、王稼祥三人军事指挥小组。", trap: "未将毛泽东思想写入党章（1945中共七大）。", q: { stem: "遵义会议彻底清算了王明“左”倾教条主义在思想路线和政治路线上的错误。", ans: false, exp: "错误。遵义会议集中解决军事问题和组织问题。" } },
      { id: "m09", kind: "meeting", order: 1935.121, year: "1935", title: "瓦窑堡会议", tag: "抗日民族统一战线", linkIds: ["w07", "m10"], linkNote: "瓦窑堡会议后毛泽东作《论反对日本帝国主义的策略》，系统阐明抗日民族统一战线理论。", core: "确立{{抗日民族统一战线}}策略方针；批判“左”倾{{关门主义}}；将“工农共和国”改为“{{人民共和国}}”。", sec: "系统解决党的政治路线问题。", trap: "《抗日救国十大纲领》与全面抗战路线出自1937洛川会议。", q: { stem: "瓦窑堡会议确立了抗日民族统一战线策略方针，并将“工农共和国”改为“人民共和国”。", ans: true, exp: "正确。这是瓦窑堡会议核心决议。" } },
      { id: "m10", kind: "meeting", order: 1937.082, year: "1937", title: "洛川会议", tag: "全面抗战路线·十大纲领", linkIds: ["m09", "w11"], linkNote: "洛川会议制定全面抗战路线，次年《论持久战》科学预见抗战三阶段发展进程。", core: "制定《{{抗日救国十大纲领}}》；提出{{全面抗战路线}}；确定{{独立自主的山地游击战}}方针；实行{{减租减息}}农民政策。", sec: "改组中央军委，毛泽东任书记。", trap: "非“耕者有其田”（抗战实行减租减息）。", q: { stem: "洛川会议决定抗战时期实行没收地主土地的“耕者有其田”政策。", ans: false, exp: "错误。洛川会议决定实行减租减息政策。" } },
      { id: "m11", kind: "meeting", order: 1938.101, year: "1938", title: "六届六中全会", tag: "首提马克思主义中国化", linkIds: ["w12", "w13"], linkNote: "毛泽东在六届六中全会作《论新阶段》报告，首次明确提出“马克思主义中国化”命题。", core: "毛泽东作《论新阶段》报告，首次明确提出“{{马克思主义中国化}}”重大命题；基本克服王明{{右倾错误}}。", sec: "重申独立自主领导抗日武装斗争原则。", trap: "毛泽东思想写入党章确立为指导思想在1945中共七大。", q: { stem: "六届六中全会上毛泽东首次明确提出了“马克思主义中国化”的重大命题。", ans: true, exp: "正确。1938年六届六中全会首提马克思主义中国化。" } },
      { id: "m12", kind: "meeting", order: 1945.041, year: "1945", title: "六届七中全会", tag: "第一个历史决议", linkIds: ["w17", "m13"], linkNote: "延安整风（《改造我们的学习》等）后，六届七中全会通过第一个历史决议，为七大召开奠定思想基础。", core: "原则通过《{{关于若干历史问题的决议}}》（党的{{第一个历史决议}}）；清算历次“左”右倾特别是王明“左”倾教条主义。", sec: "标志延安整风胜利结束。", trap: "第二个历史决议为1981十一届六中全会《关于建国以来党的若干历史问题的决议》。", q: { stem: "六届七中全会通过了《关于建国以来党的若干历史问题的决议》。", ans: false, exp: "错误。“建国以来”属1981年十一届六中全会。" } },
      { id: "m13", kind: "meeting", order: 1945.042, year: "1945", title: "中共七大", tag: "毛泽东思想写入党章", linkIds: ["w20", "m14"], linkNote: "七大上毛泽东作《论联合政府》政治报告，大会将毛泽东思想写入党章确立为指导思想。", core: "将{{毛泽东思想}}写入党章并确立为党的指导思想；制定建立{{新民主主义中国}}政治路线；概括党的{{三大优良作风}}。", sec: "毛泽东作《论联合政府》政治报告。", trap: "勿混“三大优良作风”与1939《发刊词》“三大法宝”。", q: { stem: "中共七大将毛泽东思想写入党章并确立为党的指导思想。", ans: true, exp: "正确。这是中共七大核心贡献。" } },
      { id: "m14", kind: "meeting", order: 1949.03, year: "1949", title: "七届二中全会", tag: "工作重心转城·两个务必", linkIds: ["w22", "m15"], linkNote: "七届二中全会描绘新中国蓝图并提出“两个务必”，6月《论人民民主专政》阐明国体，9月一届政协正式建国。", core: "工作重心由{{乡村转移到城市}}；提出“{{两个务必}}”；提出由农业国转变为工业国、由新民主主义转变为社会主义总任务。", sec: "分析五种经济成分；规定全国胜利后基本政策。", trap: "提出的是“两个务必”（二十大为“三个务必”）。", q: { stem: "党的七届二中全会提出了“三个务必”的政治要求。", ans: false, exp: "错误。七届二中全会提出“两个务必”，二十大提出“三个务必”。" } },
      { id: "m15", kind: "meeting", order: 1949.09, year: "1949", title: "中国人民政治协商会议第一届全体会议", tag: "通过共同纲领", linkIds: ["w22", "m16"], linkNote: "一届政协将《论人民民主专政》阐明的国体原则载入《共同纲领》，代行全国人大职权。", core: "通过《{{共同纲领}}》（起{{临时宪法}}作用）；选举中央人民政府委员会；标志{{多党合作和政治协商制度}}正式确立。", sec: "确定国名、国都、纪年、国旗、代国歌。", trap: "《共同纲领》非第一部社会主义类型宪法（1954年宪法为第一部）。", q: { stem: "一届政协通过的《共同纲领》是新中国第一部社会主义类型的宪法。", ans: false, exp: "错误。《共同纲领》起临时宪法作用，第一部社会主义类型宪法是1954年宪法。" } },
      { id: "m16", kind: "meeting", order: 1950.06, year: "1950", title: "七届三中全会", tag: "财政经济基本好转", linkIds: ["m15", "w23"], linkNote: "建国初期七届三中全会聚焦国民经济恢复（不要四面出击），1956《论十大关系》开启社会主义建设探索。", core: "国民经济恢复时期任务是争取国家{{财政经济状况基本好转}}；提出{{三个条件}}；提出“{{不要四面出击}}”战略策略方针。", sec: "毛泽东作《为争取国家财政经济状况的基本好转而斗争》报告。", trap: "过渡时期总路线提出于1953年。", q: { stem: "七届三中全会提出了“不要四面出击”的战略策略方针。", ans: true, exp: "正确。1950年七届三中全会提出“不要四面出击”。" } },
      { id: "m17", kind: "meeting", order: 1956.09, year: "1956", title: "中共八大", tag: "社会主义主要矛盾论断", linkIds: ["w23", "w24"], linkNote: "4月《论十大关系》开启探索，9月八大正确分析主要矛盾，次年2月《正处》系统阐述两类矛盾学说。", core: "指出{{社会主义制度}}基本建立；分析国内{{主要矛盾}}；主要任务是集中力量{{发展社会生产力}}；陈云提出“{{三个主体、三个补充}}”。", sec: "经济方针：既反保守又反冒进，在综合平衡中稳步前进。", trap: "“社会主义初级阶段”概念首提于1981十一届六中全会。", q: { stem: "中共八大首次提出了我国处于“社会主义初级阶段”的科学论断。", ans: false, exp: "错误。“社会主义初级阶段”概念首提于1981年十一届六中全会。" } },
      { id: "m18", kind: "meeting", order: 1978.12, year: "1978", title: "十一届三中全会", tag: "改革开放伟大转折", linkIds: ["m19", "m20"], linkNote: "十一届三中全会开启改革开放，十一届六中全会完成指导思想拨乱反正，十二大提出建设有中国特色社会主义。", core: "重新确立{{解放思想、实事求是}}思想路线；停止“以阶级斗争为纲”，工作重点转移到{{社会主义现代化建设}}；作出{{改革开放}}决策。", sec: "形成以邓小平为核心的第二代中央领导集体。", trap: "指导思想拨乱反正胜利完成标志为1981十一届六中全会。", q: { stem: "十一届三中全会标志着党在指导思想上的拨乱反正胜利完成。", ans: false, exp: "错误。完成标志是1981年十一届六中全会。" } },
      { id: "m19", kind: "meeting", order: 1981.06, year: "1981", title: "十一届六中全会", tag: "第二个历史决议", linkIds: ["m12", "m18"], linkNote: "与1945六届七中全会第一个历史决议前后呼应，科学评价毛泽东和毛泽东思想历史地位。", core: "通过《{{关于建国以来党的若干历史问题的决议}}》（第二个历史决议）；科学评价{{毛泽东和毛泽东思想}}；标志{{指导思想上的拨乱反正胜利完成}}。", sec: "首次提出我国处于“初级阶段”；概括毛泽东思想活的灵魂。", trap: "系统阐述初级阶段理论在1987十三大。", q: { stem: "十一届六中全会通过第二个历史决议，标志着党在指导思想上的拨乱反正胜利完成。", ans: true, exp: "正确。十一届六中全会完成指导思想拨乱反正。" } },
      { id: "m20", kind: "meeting", order: 1982.09, year: "1982", title: "中共十二大", tag: "首提中国特色社会主义", linkIds: ["m18", "m22"], linkNote: "十二大首提“建设有中国特色的社会主义”主题，十三大系统阐述社会主义初级阶段理论与基本路线。", core: "邓小平开幕词首次正式提出“{{建设有中国特色的社会主义}}”重大命题，成为全部理论和实践主题。", sec: "提出全面开创社会主义现代化建设新局面。", trap: "“一个中心、两个基本点”完整概括在1987十三大。", q: { stem: "邓小平在中共十二大开幕词中首次正式提出“建设有中国特色的社会主义”重大命题。", ans: true, exp: "正确。1982年中共十二大确立全部理论和实践主题。" } },
      { id: "m21", kind: "meeting", order: 1984.10, year: "1984", title: "十二届三中全会", tag: "有计划的商品经济", linkIds: ["m24", "m25"], linkNote: "改革定性三步跃升：十二届三中“有计划商品经济”→十四大“市场经济目标”→十四届三中“基本框架”。", core: "确认我国社会主义经济是“{{公有制基础上的有计划的商品经济}}”；改革重点从{{农村转向城市}}。", sec: "增强企业活力是经济体制改革中心环节。", trap: "市场经济体制改革目标确立于1992十四大。", q: { stem: "十二届三中全会首次明确提出建立社会主义市场经济体制的改革目标。", ans: false, exp: "错误。十二届三中全会提出“有计划的商品经济”。" } },
      { id: "m22", kind: "meeting", order: 1987.10, year: "1987", title: "中共十三大", tag: "初级阶段理论与基本路线", linkIds: ["m19", "m20"], linkNote: "承接十一届六中全会“初级阶段”提法与十二大主题，系统阐述初级阶段理论与“三步走”战略。", core: "系统阐述{{社会主义初级阶段理论}}；完整概括“{{一个中心、两个基本点}}”基本路线；提出“{{三步走}}”战略。", sec: "首次概括中特理论轮廓。", trap: "邓小平理论写入党章在1997十五大。", q: { stem: "中共十三大完整概括了党在社会主义初级阶段“一个中心、两个基本点”的基本路线。", ans: true, exp: "正确。这是中共十三大核心考点。" } },
      { id: "m23", kind: "meeting", order: 1992.01, year: "1992", title: "南方谈话", tag: "社会主义本质·计划市场都是手段", linkIds: ["m24", "m26"], linkNote: "南方谈话打破姓“资”姓“社”束缚，直接推动同年10月十四大确立社会主义市场经济体制目标。", core: "阐明{{社会主义本质}}；指出{{计划和市场都是经济手段}}；提出“{{三个有利于}}”标准和“发展才是硬道理”。", sec: "推动改革开放进入新阶段。", trap: "确立市场经济体制目标的正式会议是同年10月中共十四大。", q: { stem: "邓小平在南方谈话中指出，计划经济等于社会主义，市场经济等于资本主义。", ans: false, exp: "错误。计划和市场都是经济手段。" } },
      { id: "m24", kind: "meeting", order: 1992.10, year: "1992", title: "中共十四大", tag: "确立市场经济体制目标", linkIds: ["m23", "m25"], linkNote: "吸收南方谈话精髓确立市场经济目标，次年十四届三中全会勾画基本框架。", core: "明确经济体制改革目标是建立{{社会主义市场经济体制}}；确立邓小平建设有中国特色社会主义理论在全党指导地位。", sec: "形成以江泽民为核心的第三代中央领导集体。", trap: "正式使用“邓小平理论”并写入党章在1997十五大。", q: { stem: "中共十四大将“邓小平理论”正式命名并写入党章确立为指导思想。", ans: false, exp: "错误。正式命名“邓小平理论”并写入党章的是1997年中共十五大。" } },
      { id: "m25", kind: "meeting", order: 1993.11, year: "1993", title: "十四届三中全会", tag: "勾画市场经济基本框架", linkIds: ["m24", "m29"], linkNote: "十四届三中全会搭起市场经济基本框架，2013十八届三中全会进一步明确市场起“决定性作用”。", core: "勾画{{社会主义市场经济体制基本框架}}，使十四大目标具体化；明确建立{{现代企业制度}}是国企改革方向。", sec: "通过《关于建立社会主义市场经济体制若干问题的决定》。", trap: "市场“决定性作用”在2013十八届三中全会。", q: { stem: "十四届三中全会勾画了社会主义市场经济体制的基本框架，明确了现代企业制度方向。", ans: true, exp: "正确。十四届三中全会勾画市场经济体制基本框架。" } },
      { id: "m26", kind: "meeting", order: 1997.09, year: "1997", title: "中共十五大", tag: "邓小平理论写入党章", linkIds: ["m23", "m27"], linkNote: "十五大确立基本经济制度，十六大进一步提出“两个毫不动摇”。", core: "正式使用“{{邓小平理论}}”并写入党章；确立{{公有制为主体、多种所有制经济共同发展}}为基本经济制度；提出{{依法治国}}基本方略。", sec: "明确非公有制经济是社会主义市场经济重要组成部分。", trap: "“两个毫不动摇”首提于2002十六大。", q: { stem: "中共十五大确立公有制为主体、多种所有制经济共同发展为基本经济制度，并提出依法治国。", ans: true, exp: "正确。这是中共十五大核心考点。" } },
      { id: "m27", kind: "meeting", order: 2002.11, year: "2002", title: "中共十六大", tag: "三个代表写入党章·全面建设小康", linkIds: ["m26", "m28"], linkNote: "十六大提出全面“建设”小康社会，十八大升级为全面“建成”小康社会。", core: "将“{{三个代表}}”重要思想写入党章；提出{{全面建设小康社会}}目标；首次提出“{{两个毫不动摇}}”。", sec: "提出本世纪头二十年重要战略机遇期。", trap: "十六大是全面“建设”小康社会，十八大改为全面“建成”小康社会。", q: { stem: "中共十六大明确提出了“全面建成小康社会”的奋斗目标。", ans: false, exp: "错误。十六大是全面“建设”，十八大改为全面“建成”。" } },
      { id: "m28", kind: "meeting", order: 2012.11, year: "2012", title: "中共十八大", tag: "科学发展观·五位一体", linkIds: ["m27", "m29"], linkNote: "十八大开启新时代并确立“五位一体”总体布局，次年十八届三中全会开启全面深化改革。", core: "将{{科学发展观}}确立为党的指导思想；提出{{全面建成小康社会}}；确立“{{五位一体}}”总体布局（增生态文明）；倡导24字{{社会主义核心价值观}}。", sec: "中国特色社会主义进入新时代的历史起点。", trap: "新思想写入党章在2017十九大。", q: { stem: "中共十八大确立了“五位一体”总体布局，并将科学发展观确立为党的指导思想。", ans: true, exp: "正确。十八大新增生态文明确立“五位一体”。" } },
      { id: "m29", kind: "meeting", order: 2013.11, year: "2013", title: "十八届三中全会", tag: "全面深化改革·市场决定性作用", linkIds: ["m25", "m32"], linkNote: "十八届三中全会开启全面深化改革（市场决定性作用），2024二十届三中全会部署进一步全面深化改革。", core: "提出全面深化改革总目标（完善中特制度、推进{{国家治理体系和治理能力现代化}}）；首次提出市场在资源配置中起“{{决定性作用}}”。", sec: "开启新时代全面深化改革新征程。", trap: "市场作用由“基础性”改为“决定性”；“进一步全面深化改革”属2024二十届三中全会。", q: { stem: "十八届三中全会首次提出使市场在资源配置中起“基础性作用”。", ans: false, exp: "错误。改为“决定性作用”。" } },
      { id: "m30", kind: "meeting", order: 2017.10, year: "2017", title: "中共十九大", tag: "新时代·主要矛盾转化·新思想入党章", linkIds: ["m28", "m31"], linkNote: "十九大确立新思想为指导思想并作出“两步走”安排，二十大系统阐述中国式现代化与“六个必须坚持”。", core: "将{{习近平新时代中国特色社会主义思想}}写入党章；作出中国特色社会主义{{进入新时代}}论断；指出主要矛盾转化为人民美好生活需要同{{不平衡不充分的发展}}之间矛盾。", sec: "作出“两步走”战略安排。", trap: "中国式现代化五个中国特色与本质要求系统阐述在2022二十大。", q: { stem: "中共十九大指出我国社会主要矛盾已转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。", ans: true, exp: "正确。这是中共十九大重大政治论断。" } },
      { id: "m31", kind: "meeting", order: 2022.10, year: "2022", title: "中共二十大", tag: "中国式现代化·六个必须坚持", linkIds: ["m14", "m32"], linkNote: "二十大将七届二中全会“两个务必”升华为“三个务必”，并开启以中国式现代化推进复兴的新征程。", core: "明确中心任务（以{{中国式现代化}}全面推进中华民族伟大复兴）；阐明“{{两个结合}}”与“{{六个必须坚持}}”；提出“{{三个务必}}”。", sec: "高质量发展是首要任务；教育科技人才是基础性、战略性支撑。", trap: "“两个务必”属七届二中全会，二十大为“三个务必”。", q: { stem: "中共二十大深刻阐述了“六个必须坚持”的世界观和方法论，并提出了“三个务必”。", ans: true, exp: "正确。这是中共二十大核心理论创新。" } },
      { id: "m32", kind: "meeting", order: 2024.07, year: "2024", title: "二十届三中全会", tag: "进一步全面深化改革·2029完成", linkIds: ["m29", "m31"], linkNote: "围绕二十大中国式现代化中心任务，对进一步全面深化改革作出系统部署。", core: "通过《关于{{进一步全面深化改革}}、推进中国式现代化的决定》；提出“{{七个聚焦}}”与“{{六个坚持}}”；明确到{{2029年}}完成本决定改革任务。", sec: "以经济体制改革为牵引；2035年全面建成高水平社会主义市场经济体制。", trap: "完成本决定改革任务节点为2029年（非2035年）。", q: { stem: "二十届三中全会明确到2035年完成本《决定》提出的全部改革任务。", ans: false, exp: "错误。明确到2029年完成本决定改革任务。" } },

      // ---- 25 毛著 ----
      { id: "w01", kind: "work", order: 1925.12, year: "1925", title: "《中国社会各阶级的分析》", tag: "萌芽起点·首辨敌友", linkIds: ["m04", "w02"], linkNote: "回应中共四大提出的无产阶级领导权与工农联盟问题，科学分析各阶级地位。", core: "指出分清敌友是革命的{{首要问题}}；阐明{{无产阶级领导权}}与{{农民同盟军}}思想；工业无产阶级是领导力量，贫农是最接近的朋友。", sec: "区分民族资产阶级两面性与买办官僚资产阶级。", trap: "“农民问题乃国民革命的中心问题”出自1926《国民革命与农民运动》。", q: { stem: "《中国社会各阶级的分析》指出分清敌友是革命的首要问题，阐明了无产阶级领导权与农民同盟军。", ans: true, exp: "正确。这是1925年该文核心论断。" } },
      { id: "w02", kind: "work", order: 1926.09, year: "1926", title: "《国民革命与农民运动》", tag: "农民中心论", linkIds: ["w01", "w03"], linkNote: "上承阶级分析，下启1927《湖南农民运动考察报告》，突出农民运动核心地位。", core: "明确指出“{{农民问题乃国民革命的中心问题}}”；农民不起来参加并拥护国民革命，国民革命不会成功。", sec: "强调农村革命对推翻帝国主义和封建军阀的决定性意义。", trap: "赞扬农民运动“好得很”出自1927《湖南农民运动考察报告》。", q: { stem: "毛泽东在《国民革命与农民运动》中明确指出“农民问题乃国民革命的中心问题”。", ans: true, exp: "正确。该文核心论断即农民问题乃国民革命的中心问题。" } },
      { id: "w03", kind: "work", order: 1927.03, year: "1927", title: "《湖南农民运动考察报告》", tag: "农民运动“好得很”", linkIds: ["w02", "m05"], linkNote: "大革命危机关头回应党内外对农民运动的指责，主张放手发动群众、建立农民政权和武装。", core: "赞扬农民运动“{{好得很}}”；主张建立{{农民政权}}和{{农民武装}}，放手发动群众、组织群众、依靠群众。", sec: "总结湖南农民运动十四件大事。", trap: "“政权是由枪杆子中取得的”提出于同年8月八七会议。", q: { stem: "毛泽东在《湖南农民运动考察报告》中首次提出“政权是由枪杆子中取得的”论断。", ans: false, exp: "错误。“枪杆子里面出政权”提出于1927年8月八七会议。" } },
      { id: "w04", kind: "work", order: 1928.10, year: "1928", title: "《中国的红色政权为什么能够存在？》《井冈山的斗争》", tag: "工农武装割据", linkIds: ["m06", "w05"], linkNote: "井冈山时期两篇著作提出“工农武装割据”，1930《星星之火，可以燎原》进一步提出“以乡村为中心”。", core: "提出“{{工农武装割据}}”思想（武装斗争、土地革命、根据地建设结合）；红色政权存在根本原因是{{近代中国政治经济发展极不平衡}}。", sec: "提出红色政权存在发展的五个条件。", trap: "“以乡村为中心”思想提出于1930.1《星星之火，可以燎原》。", q: { stem: "《中国的红色政权为什么能够存在？》指出红色政权存在的根本原因是近代中国政治经济发展极不平衡。", ans: true, exp: "正确。政治经济发展极不平衡是根本原因。" } },
      { id: "w05", kind: "work", order: 1930.01, year: "1930.1", title: "《星星之火，可以燎原》", tag: "道路理论初步形成", linkIds: ["w04", "w06"], linkNote: "突破“城市中心论”提出“以乡村为中心”，标志毛泽东思想初步形成。", core: "批评“红旗到底打得多久”悲观思想；提出“{{以乡村为中心}}”思想，标志{{毛泽东思想初步形成}}。", sec: "阐明红军、游击队和红色区域建立发展促进革命高潮。", trap: "“没有调查，没有发言权”出自同年5月《反对本本主义》。", q: { stem: "《星星之火，可以燎原》提出“以乡村为中心”的思想，标志着毛泽东思想的初步形成。", ans: true, exp: "正确。1930年1月该文标志毛泽东思想初步形成。" } },
      { id: "w06", kind: "work", order: 1930.05, year: "1930.5", title: "《反对本本主义》", tag: "思想路线初提", linkIds: ["w05", "w09"], linkNote: "首次提出“思想路线”概念，后来《实践论》《矛盾论》从哲学高度系统论证这一思想路线。", core: "提出“{{没有调查，没有发言权}}”；首次提出“{{思想路线}}”概念；初步阐明实事求是、群众路线、独立自主基本思想。", sec: "批判党内教条主义，提出“本本主义”概念。", trap: "对“实事求是”作出马克思主义科学界定在1941.5《改造我们的学习》。", q: { stem: "《反对本本主义》首次对“实事求是”作出了马克思主义的科学界定。", ans: false, exp: "错误。首次科学界定在1941年《改造我们的学习》。" } },
      { id: "w07", kind: "work", order: 1935.122, year: "1935.12", title: "《论反对日本帝国主义的策略》", tag: "瓦窑堡会议理论阐发", linkIds: ["m09", "w11"], linkNote: "瓦窑堡会议后作此报告，阐明抗日民族统一战线政策，解决党的政治路线问题。", core: "系统阐明党的{{抗日民族统一战线}}策略方针；批判“左”倾{{关门主义}}；阐明将“工农共和国”改为“{{人民共和国}}”依据。", sec: "分析日本侵华后国内阶级关系新变动。", trap: "第二次国共合作正式形成标志为1937年9月公布国共合作宣言。", q: { stem: "《论反对日本帝国主义的策略》系统阐明了抗日民族统一战线策略方针，批判了“左”倾关门主义。", ans: true, exp: "正确。该报告系统阐发瓦窑堡会议政治路线。" } },
      { id: "w08", kind: "work", order: 1936.12, year: "1936.12", title: "《中国革命战争的战略问题》", tag: "土地革命军事总结", linkIds: ["m08", "w11"], linkNote: "遵义会议纠正军事错误后，系统总结土地革命战争经验，阐明中国革命战争四个特点。", core: "阐明中国革命战争{{四个特点}}与{{积极防御}}战略方针，总结土地革命战争经验。", sec: "批判“左”倾军事教条主义。", trap: "抗战“战略防御、相持、反攻”三阶段预见出自1938.5《论持久战》。", q: { stem: "《中国革命战争的战略问题》科学预见了抗日战争将经过战略防御、相持、反攻三个阶段。", ans: false, exp: "错误。抗战三阶段论出自1938年5月《论持久战》。" } },
      { id: "w09", kind: "work", order: 1937.07, year: "1937.7", title: "《实践论》", tag: "哲学认识论奠基", linkIds: ["w06", "w10"], linkNote: "《实践论》与《矛盾论》并称“两论”，从哲学认识论和辩证法高度彻底清算教条主义根源。", core: "揭露教条主义和经验主义认识论根源；阐明{{实践是认识的基础}}及认识从感性到理性再到实践的辩证规律。", sec: "为实事求是思想路线奠定哲学认识论基础。", trap: "共性个性、绝对相对是矛盾问题精髓出自同年8月《矛盾论》。", q: { stem: "《实践论》从认识论高度揭露教条主义根源，阐明了实践是认识的基础及认识辩证发展规律。", ans: true, exp: "正确。《实践论》系统阐述马克思主义认识论。" } },
      { id: "w10", kind: "work", order: 1937.081, year: "1937.8", title: "《矛盾论》", tag: "唯物辩证法核心阐发", linkIds: ["w09", "w24"], linkNote: "《矛盾论》奠定一般矛盾学说，1957《正处》将其创造性运用于社会主义社会。", core: "阐明{{对立统一规律}}是唯物辩证法最根本规律；共性与个性、绝对与相对道理是矛盾问题{{精髓}}。", sec: "从唯物辩证法高度批判“左”倾教条主义形而上学。", trap: "社会主义社会基本矛盾非对抗性学说提出于1957.2《关于正确处理人民内部矛盾的问题》。", q: { stem: "《矛盾论》首次系统提出了社会主义社会基本矛盾是非对抗性矛盾的学说。", ans: false, exp: "错误。社会主义基本矛盾非对抗性学说提出于1957年《正处》。" } },
      { id: "w11", kind: "work", order: 1938.05, year: "1938.5", title: "《论持久战》", tag: "抗战三阶段与兵民胜利之本", linkIds: ["m10", "w13"], linkNote: "落实洛川会议全面抗战路线，科学论证抗日持久战规律并预见三阶段进程。", core: "批驳“{{亡国论}}”和“{{速胜论}}”；预见抗战经{{战略防御、战略相持、战略反攻}}三阶段；提出“{{兵民是胜利之本}}”。", sec: "分析中日双方四个基本特点。", trap: "全面抗战路线与《抗日救国十大纲领》出自1937年8月洛川会议。", q: { stem: "《论持久战》批驳了亡国论和速胜论，预见抗战三阶段，并提出“兵民是胜利之本”。", ans: true, exp: "正确。这是《论持久战》核心考点。" } },
      { id: "w12", kind: "work", order: 1938.102, year: "1938.10", title: "《论新阶段》", tag: "首提马克思主义中国化", linkIds: ["m11", "w16"], linkNote: "在六届六中全会上作此报告首提“马克思主义中国化”，随后《新民主主义论》等形成完整理论成果。", core: "毛泽东在{{六届六中全会}}政治报告；首次明确提出“{{马克思主义中国化}}”重大命题。", sec: "强调使马克思主义在中国具体化。", trap: "毛泽东思想写入党章确立为指导思想在1945中共七大。", q: { stem: "毛泽东在《论新阶段》报告中首次明确提出了“马克思主义中国化”的重大命题。", ans: true, exp: "正确。1938年六届六中全会《论新阶段》首提马克思主义中国化。" } },
      { id: "w13", kind: "work", order: 1938.11, year: "1938.11", title: "《战争和战略问题》", tag: "道路理论成熟定型", linkIds: ["w05", "w11"], linkNote: "由1930《星星之火》初步形成，到1938《战争和战略问题》把游击战提到战略地位，标志道路理论成熟。", core: "指出中国革命中心任务和最高形式是{{武装夺取政权}}；把游击战争提到战略地位；标志道路理论成熟定型。", sec: "重申“枪杆子里面出政权”与党指挥枪原则。", trap: "“枪杆子里面出政权”首提于1927年八七会议。", q: { stem: "《战争和战略问题》首次提出了“政权是由枪杆子中取得的”著名论断。", ans: false, exp: "错误。首提在1927年八七会议。" } },
      { id: "w14", kind: "work", order: 1939.10, year: "1939.10", title: "《〈共产党人〉发刊词》", tag: "三大法宝与伟大工程", linkIds: ["w15", "w16"], linkNote: "与《中国革命和中国共产党》《新民主主义论》构成新民主主义理论成熟三大标志文献。", core: "首次提出{{统一战线、武装斗争、党的建设}}是三大法宝；把党的建设称为“{{伟大的工程}}”。", sec: "阐明统一战线、武装斗争与党组织关系。", trap: "勿混“三大法宝”与1945《论联合政府》“三大优良作风”。", q: { stem: "《〈共产党人〉发刊词》首次概括了理论联系实际、密切联系群众、批评与自我批评三大优良作风。", ans: false, exp: "错误。《发刊词》提出“三大法宝”，三大优良作风出自1945《论联合政府》。" } },
      { id: "w15", kind: "work", order: 1939.12, year: "1939.12", title: "《中国革命和中国共产党》", tag: "首提新民主主义革命概念", linkIds: ["w16", "w21"], linkNote: "1939首提“新民主主义革命”概念，1948《在晋绥干部会议上的讲话》把官僚资本主义列入总路线。", core: "首次明确提出“{{新民主主义革命}}”科学概念；指出认清{{中国国情}}是认清一切革命问题的基本根据。", sec: "明确民主主义革命与社会主义革命“两步走”。", trap: "总路线完整表述（含官僚资本主义）在1948.4《在晋绥干部会议上的讲话》。", q: { stem: "《中国革命和中国共产党》首次明确提出了“新民主主义革命”的科学概念。", ans: true, exp: "正确。1939年12月该文首提“新民主主义革命”概念。" } },
      { id: "w16", kind: "work", order: 1940.01, year: "1940.1", title: "《新民主主义论》", tag: "毛泽东思想成熟标志", linkIds: ["w14", "w15"], linkNote: "系统阐述新民主主义政治、经济、文化三大纲领，标志新民主主义理论完整形成和毛泽东思想成熟。", core: "系统阐述新民主主义{{政治、经济、文化纲领}}；指明前途是社会主义；标志新民主主义理论完整形成、{{毛泽东思想成熟}}。", sec: "阐明民族的、科学的、大众的新民主主义文化。", trap: "首提“新民主主义革命”概念在1939.12《中国革命和中国共产党》。", q: { stem: "《新民主主义论》系统阐述了新民主主义政治、经济、文化纲领，标志着毛泽东思想的成熟。", ans: true, exp: "正确。1940年《新民主主义论》标志毛泽东思想成熟。" } },
      { id: "w17", kind: "work", order: 1941.05, year: "1941.5", title: "《改造我们的学习》", tag: "整风开端·实事求是科学界定", linkIds: ["w18", "m12"], linkNote: "延安整风三篇基本文献之一（改造学风），首次对“实事求是”作出马克思主义科学解释。", core: "首次对“{{实事求是}}”作出马克思主义科学解释；标志延安整风在高级干部中开始。", sec: "批判主观主义，提倡理论联系实际。", trap: "全党范围整风普遍展开标志为1942.2《整顿党的作风》。", q: { stem: "《改造我们的学习》首次对“实事求是”作出了马克思主义的科学解释。", ans: true, exp: "正确。1941年5月该文对实事求是作出科学界定。" } },
      { id: "w18", kind: "work", order: 1942.021, year: "1942.2", title: "《整顿党的作风》", tag: "全党整风普遍展开", linkIds: ["w17", "w19"], linkNote: "与《改造我们的学习》《反对党八股》共同构成延安整风运动三篇基本文献。", core: "反主观主义整学风、反宗派主义整党风、反党八股整文风，以{{反对主观主义}}为最主要任务；方针为“{{惩前毖后、治病救人}}”。", sec: "标志延安整风在全党普遍展开。", trap: "首次科学界定“实事求是”在1941.5《改造我们的学习》。", q: { stem: "《整顿党的作风》提出延安整风的方针是“惩前毖后、治病救人”，中心任务是反对主观主义。", ans: true, exp: "正确。这是《整顿党的作风》必背核心。" } },
      { id: "w19", kind: "work", order: 1942.022, year: "1942.2", title: "《反对党八股》", tag: "整顿文风", linkIds: ["w18", "w17"], linkNote: "直指主观主义和宗派主义的表现形式——党八股，倡导生动活泼新鲜有力的文风。", core: "揭露党八股八大罪状，指出党八股是主观主义和宗派主义的{{宣传工具和表现形式}}，主张生动活泼新鲜有力的文风。", sec: "构成延安整风基本文献。", trap: "延安整风中心任务是反对主观主义，非反对党八股。", q: { stem: "《反对党八股》指出反对党八股以整顿文风是延安整风运动的中心任务。", ans: false, exp: "错误。延安整风最主要任务是反对主观主义以整顿学风。" } },
      { id: "w20", kind: "work", order: 1945.043, year: "1945.4", title: "《论联合政府》", tag: "七大报告·三大优良作风", linkIds: ["m13", "w14"], linkNote: "中共七大政治报告，首次概括党的三大优良作风，与七大将毛泽东思想写入党章相辅相成。", core: "中共七大政治报告；首次概括党的{{理论联系实际、密切联系群众、批评与自我批评}}三大优良作风；提出建立民主联合政府。", sec: "提出“全心全意为人民服务”根本宗旨。", trap: "勿混“三大优良作风”与1939“三大法宝”或1949“两个务必”。", q: { stem: "《论联合政府》首次概括了中国共产党的三大优良作风，并提出建立民主联合政府。", ans: true, exp: "正确。这是中共七大政治报告核心要点。" } },
