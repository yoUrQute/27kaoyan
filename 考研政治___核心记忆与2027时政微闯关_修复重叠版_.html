    /* ==========================================================================
       4. 持久化存储与状态（兼容旧版本存储，互不冲突）
       ========================================================================== */
    const STORAGE_KEY = "kaoyan_pol_micro_v1";
    const LEGACY_KEYS = ["kaoyan_pol_trilogy_v1", "party_meetings_draw_v4", "party_meetings_draw_v3"];

    const CORE_SORTED = [...CORE_CARDS].sort((a, b) => a.order - b.order);
    const CORE_MAP = Object.fromEntries(CORE_CARDS.map(c => [c.id, c]));
    const CA_TOPIC_MAP = Object.fromEntries(CA_TOPICS.map(t => [t.id, t]));
    const CA_Q_MAP = Object.fromEntries(CA_QUESTIONS.map(q => [q.id, q]));

    function getCorePool(scope) {
      if (scope === "meeting") return CORE_SORTED.filter(c => c.kind === "meeting").map(c => c.id);
      if (scope === "work") return CORE_SORTED.filter(c => c.kind === "work").map(c => c.id);
      return CORE_SORTED.map(c => c.id);
    }

    function fisherYates(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function sameArr(a, b) {
      if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
      return true;
    }

    function shuffleDistinct(pool, prevOrder) {
      let out = fisherYates(pool);
      let tries = 0;
      while (sameArr(out, prevOrder) && tries < 24) {
        out = fisherYates(pool);
        tries++;
      }
      if (sameArr(out, prevOrder) && out.length >= 2) {
        [out[0], out[1]] = [out[1], out[0]];
      }
      return out;
    }

    function makeRoundState(scope, prevOrder = []) {
      const pool = getCorePool(scope);
      const ord = shuffleDistinct(pool, prevOrder);
      return {
        roundNo: 1,
        order: ord,
        remaining: [...ord],
        drawn: [],
        currentId: null,
        done: false,
        lastOrder: prevOrder,
        undoStack: []
      };
    }

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    }

    const defaultState = () => ({
      activeTrack: "ca",        // 默认进入最轻快的「2027时政 · 微闯关」
      antiLock: true,
      clozeOn: false,
      blindOn: false,
      wrongMap: {},

      // Track A（32会议 + 25毛著）
      coreScope: "all",
      coreMode: "round",
      rounds: {
        all: makeRoundState("all"),
        meeting: makeRoundState("meeting"),
        work: makeRoundState("work")
      },
      box: {
        masteredIds: [],
        unfamHits: {},
        curByScope: { all: null, meeting: null, work: null },
        lastByScope: { all: null, meeting: null, work: null },
        undoStack: []
      },

      // Track B（2027时政 · 微闯关）
      caMode: "micro",          // 'micro'（微提示+1题即测） | 'blind'（盲刷挑战） | 'index'（折叠速览目录）
      caArea: "all",            // 'all' | 'dom' | 'intl' | 'wrong'
      caCurQId: "q01",
      caDoneQIds: [],           // 已做对过的题目ID
      caWrongQIds: [],          // 错题回炉ID列表
      caFamiliarIds: [],        // 标为“已读熟”的考点ID
      caStreak: 0,
      todayDate: todayStr(),
      todayDone: 0,
      todayGoal: 15
    });

    let st = defaultState();

    let ui = {
      flipped: false,
      viewedBack: false,
      cooldownUntil: 0,
      animNext: false,
      shownCloze: new Set(),
      coreQuizPicked: null,
      caPicked: [],
      caSubmitted: false,
      caShowFullTip: false,
      openAccId: null
    };

    function loadSaved() {
      try {
        let raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          for (const k of LEGACY_KEYS) {
            const old = localStorage.getItem(k);
            if (old) { raw = old; break; }
          }
        }
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return;
        st = {
          ...defaultState(),
          ...parsed,
          wrongMap: { ...(parsed.wrongMap || {}) },
          rounds: { ...defaultState().rounds, ...(parsed.rounds || {}) },
          box: { ...defaultState().box, ...(parsed.box || {}) }
        };
        if (st.todayDate !== todayStr()) {
          st.todayDate = todayStr();
          st.todayDone = 0;
        }
      } catch (e) {
        console.warn("读取存档失败：", e);
      }
    }

    function persist() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(st));
      } catch (e) {
        console.warn("写入存档失败：", e);
      }
    }

    let toastTimer = null;
    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 1900);
    }

    function cooling() { return Date.now() < ui.cooldownUntil; }
    function setCool(ms = 320) { ui.cooldownUntil = Date.now() + ms; }

    /* ==========================================================================
       5. Track B 时政微闯关逻辑（微步流：扫关键词 -> 做1题 -> 错题回炉）
       ========================================================================== */
    function getCaQuestionPool() {
      if (st.caArea === "wrong") {
        return CA_QUESTIONS.filter(q => st.caWrongQIds.includes(q.id));
      }
      const allowedTopics = new Set(
        CA_TOPICS.filter(t => st.caArea === "all" || t.area === st.caArea).map(t => t.id)
      );
      return CA_QUESTIONS.filter(q => allowedTopics.has(q.topicId));
    }

    function pickNextCaQuestion(preferTopicId = null) {
      let pool = preferTopicId
        ? CA_QUESTIONS.filter(q => q.topicId === preferTopicId)
        : getCaQuestionPool();

      if (!pool.length) {
        st.caCurQId = null;
        ui.caPicked = [];
        ui.caSubmitted = false;
        ui.caShowFullTip = false;
        return;
      }

      // 1. 优先从当前池里的错题回炉中抽（60%概率）
      const wrongPool = pool.filter(q => st.caWrongQIds.includes(q.id) && q.id !== st.caCurQId);
      if (wrongPool.length > 0 && Math.random() < 0.6) {
        st.caCurQId = wrongPool[Math.floor(Math.random() * wrongPool.length)].id;
      } else {
        // 2. 其次从未做对过的新题里顺序推进，让知识按主题块连贯推进，不跳来跳去
        const undone = pool.filter(q => !st.caDoneQIds.includes(q.id) && q.id !== st.caCurQId);
        if (undone.length > 0) {
          st.caCurQId = undone[0].id;
        } else {
          const rest = pool.filter(q => q.id !== st.caCurQId);
          const pickFrom = rest.length ? rest : pool;
          st.caCurQId = pickFrom[Math.floor(Math.random() * pickFrom.length)].id;
        }
      }

      ui.caPicked = [];
      ui.caSubmitted = false;
      ui.caShowFullTip = false;
      ui.animNext = true;
    }

    function submitCaQuiz() {
      const q = CA_Q_MAP[st.caCurQId];
      if (!q || !ui.caPicked.length || ui.caSubmitted) return;

      const isRight = [...q.ans].sort().join(",") === [...ui.caPicked].sort().join(",");
      ui.caSubmitted = true;

      if (st.todayDate !== todayStr()) {
        st.todayDate = todayStr();
        st.todayDone = 0;
      }
      st.todayDone += 1;

      if (isRight) {
        st.caStreak += 1;
        if (!st.caDoneQIds.includes(q.id)) st.caDoneQIds.push(q.id);
        st.caWrongQIds = st.caWrongQIds.filter(id => id !== q.id);
        if (st.todayDone === st.todayGoal) {
          toast(`🎉 达成今日 ${st.todayGoal} 关小目标！`);
        } else {
          toast(st.caStreak >= 3 ? `🔥 连对 ${st.caStreak} 关！` : "✓ 过关！眼熟度 +1");
        }
      } else {
        st.caStreak = 0;
        st.wrongMap[q.id] = (st.wrongMap[q.id] || 0) + 1;
        if (!st.caWrongQIds.includes(q.id)) st.caWrongQIds.push(q.id);
        toast("已记入错题回炉，稍后自动重练");
      }

      persist();
      render();
    }

    /* ==========================================================================
       6. Track A 核心背诵逻辑（轮抽 / 双盒加权 / 会著联动）
       ========================================================================== */
    function curRound() { return st.rounds[st.coreScope]; }

    function resetCoreTransient(anim = true) {
      ui.flipped = false;
      ui.viewedBack = false;
      ui.animNext = anim;
      ui.shownCloze = new Set();
      ui.coreQuizPicked = null;
    }

    function drawRoundCard() {
      if (cooling()) return;
      const r = curRound();
      r.undoStack.push({
        remaining: [...r.remaining],
        drawn: [...r.drawn],
        currentId: r.currentId,
        done: r.done
      });
      if (r.undoStack.length > 25) r.undoStack.shift();

      if (r.remaining.length === 0) {
        r.currentId = null;
        r.done = true;
        persist();
        setCool();
        render();
        return;
      }
      const next = r.remaining.shift();
      r.drawn.push(next);
      r.currentId = next;
      r.done = false;
      resetCoreTransient(true);
      persist();
      setCool();
      render();
    }

    function startNextRound() {
      if (cooling()) return;
      const sc = st.coreScope;
      const r = st.rounds[sc];
      const pool = getCorePool(sc);
      const prev = r.order.length === pool.length ? r.order : r.drawn;
      const ord = shuffleDistinct(pool, prev);

      r.roundNo += 1;
      r.lastOrder = [...prev];
      r.order = ord;
      r.remaining = [...ord];
      r.drawn = [];
      r.undoStack = [];
      r.done = false;

      const first = r.remaining.shift();
      r.drawn.push(first);
      r.currentId = first;
      resetCoreTransient(true);
      persist();
      setCool();
      toast(`开启第 ${r.roundNo} 轮（全新随机顺序）`);
      render();
    }

    function undoRoundCard() {
      if (cooling()) return;
      const r = curRound();
      if (!r.undoStack.length) return;
      Object.assign(r, r.undoStack.pop());
      resetCoreTransient(true);
      ui.viewedBack = true;
      persist();
      setCool(220);
      toast("已撤回上一签");
      render();
    }

    function unfamPool(sc = st.coreScope) {
      const mSet = new Set(st.box.masteredIds);
      return getCorePool(sc).filter(id => !mSet.has(id));
    }

    function boxWeight(id) {
      const w = st.wrongMap[id] || 0;
      const u = st.box.unfamHits[id] || 0;
      if (w > 0) return 4 * (1 + Math.min(w - 1, 3) * 0.25);
      if (u > 0) return 2.5 * (1 + Math.min(u - 1, 3) * 0.2);
      return 1;
    }

    function pickBoxId(sc = st.coreScope, avoidId = null) {
      const pool = unfamPool(sc);
      if (!pool.length) return null;
      if (pool.length === 1) return pool[0];
      const cands = avoidId ? pool.filter(x => x !== avoidId) : pool;
      const list = cands.length ? cands : pool;
      let sum = 0;
      const ws = list.map(id => { const wt = boxWeight(id); sum += wt; return wt; });
      let r = Math.random() * sum;
      for (let i = 0; i < list.length; i++) {
        r -= ws[i];
        if (r <= 0) return list[i];
      }
      return list[list.length - 1];
    }

    function saveBoxUndo() {
      st.box.undoStack.push({
        masteredIds: [...st.box.masteredIds],
        unfamHits: { ...st.box.unfamHits },
        curByScope: { ...st.box.curByScope },
        lastByScope: { ...st.box.lastByScope }
      });
      if (st.box.undoStack.length > 25) st.box.undoStack.shift();
    }

    function drawBoxCard() {
      if (cooling()) return;
      const sc = st.coreScope;
      const id = pickBoxId(sc, st.box.lastByScope[sc]);
      if (!id) return;
      st.box.curByScope[sc] = id;
      st.box.lastByScope[sc] = id;
      resetCoreTransient(true);
      persist();
      setCool();
      render();
    }

    function boxStillUnfam() {
      if (cooling()) return;
      const sc = st.coreScope;
      const cur = st.box.curByScope[sc];
      if (!cur) return;
      saveBoxUndo();
      st.box.unfamHits[cur] = (st.box.unfamHits[cur] || 0) + 1;
      const next = pickBoxId(sc, cur);
      st.box.curByScope[sc] = next;
      st.box.lastByScope[sc] = next;
      resetCoreTransient(true);
      persist();
      setCool();
      toast("已留陌生盒（加权高频重抽）");
      render();
    }

    function boxMarkMastered() {
      if (cooling()) return;
      const sc = st.coreScope;
      const cur = st.box.curByScope[sc];
      if (!cur) return;
      saveBoxUndo();
      if (!st.box.masteredIds.includes(cur)) st.box.masteredIds.push(cur);
      ["all", "meeting", "work"].forEach(k => {
        if (k !== sc && st.box.curByScope[k] === cur) st.box.curByScope[k] = null;
      });
      const next = pickBoxId(sc, cur);
      st.box.curByScope[sc] = next;
      if (next) st.box.lastByScope[sc] = next;
      resetCoreTransient(Boolean(next));
      persist();
      setCool();
      toast(next ? "已归档熟练盒" : "当前板块已全部熟练！");
      render();
    }

    function undoBoxStep() {
      if (cooling() || !st.box.undoStack.length) return;
      Object.assign(st.box, st.box.undoStack.pop());
      resetCoreTransient(true);
      ui.viewedBack = true;
      persist();
      setCool(220);
      toast("已撤回上一步");
      render();
    }

    function openLinkModal(cardId) {
      const c = CORE_MAP[cardId];
      if (!c) return;
      document.getElementById("linkModalTitle").textContent = `🔗 关联速览 · ${c.year} ${c.title}`;
      document.getElementById("linkModalBody").innerHTML = `
        <div class="layer-box core">
          <div class="layer-lbl">【必背核心】</div>
          <p class="layer-txt">${c.core.replace(/\{\{([^}]+)\}\}/g, (_, w) => `<span class="kw-hl ${c.kind}">${w}</span>`)}</p>
        </div>
        <div class="layer-box trap">
          <div class="layer-lbl">【陷阱干扰项】</div>
          <p class="layer-txt" style="font-size:13px;">${c.trap}</p>
        </div>
      `;
      document.getElementById("linkModal").classList.add("open");
    }

    /* ==========================================================================
       7. 界面渲染
       ========================================================================== */
    function renderClozeHtml(raw, kind) {
      let idx = 0;
      return raw.replace(/\{\{([^}]+)\}\}/g, (_, word) => {
        const n = idx++;
        if (!st.clozeOn) return `<span class="kw-hl ${kind}">${word}</span>`;
        const open = ui.shownCloze.has(n);
        return `<span class="cloze-pill no-flip ${open ? "shown" : "masked"}" data-cidx="${n}">${word}</span>`;
      });
    }

    function renderGoalBar() {
      const bar = document.getElementById("goalBar");
      if (st.activeTrack === "ca") {
        const pct = Math.min(100, Math.round((st.todayDone / st.todayGoal) * 100));
        bar.innerHTML = `
          <div class="goal-row">
            <div class="goal-metrics">
              <span style="color:var(--slate);"><span class="lbl">今日小目标</span>${st.todayDone} / ${st.todayGoal} 关</span>
              <span style="color:var(--forest);"><span class="lbl">已掌握</span>${st.caDoneQIds.length} / ${CA_QUESTIONS.length} 题</span>
              ${st.caWrongQIds.length > 0 ? `<span style="color:var(--crimson);"><span class="lbl">回炉</span>${st.caWrongQIds.length}</span>` : ""}
              ${st.caStreak >= 2 ? `<span style="color:var(--amber);">🔥 ${st.caStreak}连对</span>` : ""}
            </div>
            <button id="btnResetTrack" class="mini-btn danger" type="button">↺ 重置</button>
          </div>
          <div class="goal-track"><div class="goal-fill" style="width:${pct}%;"></div></div>
        `;
      } else {
        const sc = st.coreScope;
        const tot = getCorePool(sc).length;
        if (st.coreMode === "round") {
          const r = curRound();
          const doneCnt = r.drawn.length;
          const pct = Math.round((doneCnt / tot) * 100);
          bar.innerHTML = `
            <div class="goal-row">
              <div class="goal-metrics">
                <span style="color:var(--slate);"><span class="lbl">当前轮次</span>第 ${r.roundNo} 轮</span>
                <span style="color:var(--crimson);"><span class="lbl">剩余</span>${r.remaining.length} / ${tot} 签</span>
              </div>
              <button id="btnResetTrack" class="mini-btn danger" type="button">↺ 重置本轮</button>
            </div>
            <div class="goal-track"><div class="goal-fill" style="width:${pct}%;"></div></div>
          `;
        } else {
          const uf = unfamPool(sc).length;
          const ms = tot - uf;
          const pct = Math.round((ms / tot) * 100);
          bar.innerHTML = `
            <div class="goal-row">
              <div class="goal-metrics">
                <span style="color:var(--crimson);"><span class="lbl">陌生盒</span>${uf} 签</span>
                <span style="color:var(--forest);"><span class="lbl">熟练盒</span>${ms} / ${tot} 签</span>
              </div>
              <button id="btnResetTrack" class="mini-btn danger" type="button">↺ 重置双盒</button>
            </div>
            <div class="goal-track"><div class="goal-fill" style="width:${pct}%;"></div></div>
          `;
        }
      }

      document.getElementById("btnResetTrack").addEventListener("click", handleResetTrack);
    }

    function renderSubBar() {
      const bar = document.getElementById("subBar");
      if (st.activeTrack === "ca") {
        bar.innerHTML = `
          <div class="seg-group">
            <button class="seg-btn ${st.caMode === "micro" ? "active" : ""}" data-camode="micro" type="button">⚡ 微提示闯关</button>
            <button class="seg-btn ${st.caMode === "blind" ? "active" : ""}" data-camode="blind" type="button">🎯 直接盲刷</button>
            <button class="seg-btn ${st.caMode === "index" ? "active" : ""}" data-camode="index" type="button">📑 折叠速览(20专题)</button>
          </div>
          <div class="seg-group">
            <button class="seg-btn ${st.caArea === "all" ? "active-forest" : ""}" data-caarea="all" type="button">全部</button>
            <button class="seg-btn ${st.caArea === "dom" ? "active-forest" : ""}" data-caarea="dom" type="button">国内</button>
            <button class="seg-btn ${st.caArea === "intl" ? "active-forest" : ""}" data-caarea="intl" type="button">国际</button>
            <button class="seg-btn ${st.caArea === "wrong" ? "active-crimson" : ""}" data-caarea="wrong" type="button">错题(${st.caWrongQIds.length})</button>
          </div>
        `;

        bar.querySelectorAll("[data-camode]").forEach(b => {
          b.addEventListener("click", () => {
            st.caMode = b.dataset.camode;
            if (st.caMode !== "index" && !st.caCurQId) pickNextCaQuestion();
            persist();
            render();
          });
        });

        bar.querySelectorAll("[data-caarea]").forEach(b => {
          b.addEventListener("click", () => {
            st.caArea = b.dataset.caarea;
            if (st.caMode !== "index") pickNextCaQuestion();
            persist();
            render();
          });
        });
      } else {
        bar.innerHTML = `
          <div class="seg-group">
            <button class="seg-btn ${st.coreScope === "all" ? "active" : ""}" data-cscope="all" type="button">全部(57)</button>
            <button class="seg-btn ${st.coreScope === "meeting" ? "active-crimson" : ""}" data-cscope="meeting" type="button">会议(32)</button>
            <button class="seg-btn ${st.coreScope === "work" ? "active-forest" : ""}" data-cscope="work" type="button">毛著(25)</button>
          </div>
          <div class="seg-group">
            <button class="seg-btn ${st.coreMode === "round" ? "active" : ""}" data-cmode="round" type="button">全量轮抽</button>
            <button class="seg-btn ${st.coreMode === "box" ? "active" : ""}" data-cmode="box" type="button">双盒记忆</button>
          </div>
          <div class="seg-group" style="width:100%;justify-content:flex-end;">
            <button id="btnCloze" class="pill-btn ${st.clozeOn ? "slate" : ""}" type="button">🧩 挖空:${st.clozeOn ? "开" : "关"}</button>
            <button id="btnBlind" class="pill-btn ${st.blindOn ? "crimson" : ""}" type="button">🙈 盲测:${st.blindOn ? "开" : "关"}</button>
            <button id="btnLock" class="pill-btn ${st.antiLock ? "amber" : ""}" type="button">🔒 防误触:${st.antiLock ? "开" : "关"}</button>
          </div>
        `;

        bar.querySelectorAll("[data-cscope]").forEach(b => {
          b.addEventListener("click", () => {
            st.coreScope = b.dataset.cscope;
            resetCoreTransient(false);
            persist();
            render();
          });
        });
        bar.querySelectorAll("[data-cmode]").forEach(b => {
          b.addEventListener("click", () => {
            st.coreMode = b.dataset.cmode;
            resetCoreTransient(false);
            persist();
            render();
          });
        });
        document.getElementById("btnCloze").addEventListener("click", () => {
          st.clozeOn = !st.clozeOn;
          ui.shownCloze = new Set();
          persist();
          render();
        });
        document.getElementById("btnBlind").addEventListener("click", () => {
          st.blindOn = !st.blindOn;
          persist();
          render();
        });
        document.getElementById("btnLock").addEventListener("click", () => {
          st.antiLock = !st.antiLock;
          persist();
          toast(st.antiLock ? "防误触锁已开" : "防误触锁已关");
          render();
        });
      }
    }

    function renderStage() {
      const stage = document.getElementById("stage");
      const bottom = document.getElementById("bottomBar");
      bottom.innerHTML = "";

      if (st.activeTrack === "ca") {
        renderCaStage(stage, bottom);
      } else {
        renderCoreStage(stage, bottom);
      }
    }

    function renderCaStage(stage, bottom) {
      // 1. 折叠速览目录（点哪个展开哪个，绝不堆长文）
      if (st.caMode === "index") {
        const list = CA_TOPICS.filter(t => {
          if (st.caArea === "dom") return t.area === "dom";
          if (st.caArea === "intl") return t.area === "intl";
          if (st.caArea === "wrong") {
            return CA_QUESTIONS.some(q => q.topicId === t.id && st.caWrongQIds.includes(q.id));
          }
          return true;
        });

        if (!list.length) {
          stage.innerHTML = `
            <div class="empty-card">
              <h3>当前筛选下暂无专题</h3>
              <p>${st.caArea === "wrong" ? "错题回炉已清空，继续保持！" : "请切换其他分类。"}</p>
              <button id="btnBackAllCa" class="btn-main" style="max-width:220px;margin:0 auto;" type="button">返回全部专题</button>
            </div>
          `;
          document.getElementById("btnBackAllCa").addEventListener("click", () => {
            st.caArea = "all";
            persist();
            render();
          });
          return;
        }

        stage.innerHTML = `
          <div class="acc-list">
            ${list.map(t => {
              const isOpen = ui.openAccId === t.id;
              const isFam = st.caFamiliarIds.includes(t.id);
              const qCnt = CA_QUESTIONS.filter(q => q.topicId === t.id).length;
              return `
                <div class="acc-item ${isFam ? "done" : ""}">
                  <button class="acc-head" data-acctoggle="${t.id}" type="button">
                    <div style="display:flex;align-items:center;gap:7px;min-width:0;">
                      <span class="badge ${t.area === "dom" ? "slate" : "forest"}">${t.code.replace("重点 ", "")}</span>
                      <span class="acc-title">${t.title}</span>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                      ${isFam ? `<span class="badge forest">✓ 已熟</span>` : ""}
                      <span style="font-size:12px;color:var(--ink-muted);">${isOpen ? "▲" : "▼"}</span>
                    </div>
                  </button>
                  ${isOpen ? `
                    <div class="acc-body">
                      <div class="chip-wrap">
                        ${t.chips.map(ch => `<div class="kw-chip">${ch}</div>`).join("")}
                      </div>
                      <p class="micro-full-text">${t.full}</p>
                      <div style="background:var(--amber-soft);border:1px solid var(--amber-border);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--amber);">
                        <strong>⚠️ 避坑：</strong>${t.trap}
                      </div>
                      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                        <button class="mini-btn" style="background:var(--slate-soft);color:var(--slate);" data-jumpq="${t.id}" type="button">
                          ✍️ 练本专题 (${qCnt}题)
                        </button>
                        <button class="mini-btn" style="${isFam ? "background:var(--forest-soft);color:var(--forest);" : ""}" data-togglefam="${t.id}" type="button">
                          ${isFam ? "✓ 已读熟" : "标为已读熟"}
                        </button>
                      </div>
                    </div>
                  ` : ""}
                </div>
              `;
            }).join("")}
          </div>
        `;

        stage.querySelectorAll("[data-acctoggle]").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.dataset.acctoggle;
            ui.openAccId = ui.openAccId === id ? null : id;
            render();
          });
        });

        stage.querySelectorAll("[data-jumpq]").forEach(btn => {
          btn.addEventListener("click", () => {
            st.caMode = "micro";
            st.caArea = "all";
            pickNextCaQuestion(btn.dataset.jumpq);
            persist();
            render();
          });
        });

        stage.querySelectorAll("[data-togglefam]").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.dataset.togglefam;
            if (st.caFamiliarIds.includes(id)) {
              st.caFamiliarIds = st.caFamiliarIds.filter(x => x !== id);
            } else {
              st.caFamiliarIds.push(id);
              toast("✓ 已标为读熟");
            }
            persist();
            render();
          });
        });

        bottom.innerHTML = `
          <button id="btnGoMicro" class="btn-main" type="button">返回微提示闯关 →</button>
        `;
        document.getElementById("btnGoMicro").addEventListener("click", () => {
          st.caMode = "micro";
          if (!st.caCurQId) pickNextCaQuestion();
          persist();
          render();
        });
        return;
      }

      // 2. 微提示闯关 / 直接盲刷
      const pool = getCaQuestionPool();
      if (!pool.length) {
        stage.innerHTML = `
          <div class="empty-card">
            <h3>${st.caArea === "wrong" ? "错题回炉已全部清空！" : "暂无可用题目"}</h3>
            <p>${st.caArea === "wrong" ? "做错的题目都已经重新练对过关啦，切回全部继续刷吧。" : "请切换其他时政范围。"}</p>
            <button id="btnSwitchAllCa" class="btn-main" style="max-width:220px;margin:0 auto;" type="button">切回全部时政</button>
          </div>
        `;
        document.getElementById("btnSwitchAllCa").addEventListener("click", () => {
          st.caArea = "all";
          pickNextCaQuestion();
          persist();
          render();
        });
        return;
      }

      if (!st.caCurQId || !pool.some(q => q.id === st.caCurQId)) {
        pickNextCaQuestion();
      }

      const q = CA_Q_MAP[st.caCurQId];
      const topic = CA_TOPIC_MAP[q.topicId];
      const isMulti = q.type === "multi";
      const inWrong = st.caWrongQIds.includes(q.id);
      const animCls = ui.animNext ? "anim-in" : "";
      ui.animNext = false;

      let isRight = false;
      if (ui.caSubmitted) {
        isRight = [...q.ans].sort().join(",") === [...ui.caPicked].sort().join(",");
      }

      const showTipCard = st.caMode === "micro" || ui.caSubmitted;

      stage.innerHTML = `
        ${showTipCard && topic ? `
          <section class="micro-tip-card ${animCls}">
            <div class="micro-tip-head">
              <div style="display:flex;align-items:center;gap:6px;min-width:0;">
                <span class="badge ${topic.area === "dom" ? "slate" : "forest"}">${topic.code}</span>
                <h3 class="micro-tip-title">${topic.title}</h3>
              </div>
              <button id="btnToggleFullTip" class="mini-btn" style="flex-shrink:0;" type="button">
                ${ui.caShowFullTip ? "收起完整表述" : "展开完整句"}
              </button>
            </div>
            <div class="chip-wrap">
              ${topic.chips.map(ch => `<div class="kw-chip">${ch}</div>`).join("")}
            </div>
            ${ui.caShowFullTip ? `<p class="micro-full-text">${topic.full}</p>` : ""}
          </section>
        ` : ""}

        <section class="quiz-card ${!showTipCard ? animCls : ""}">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
            <span class="badge ${isMulti ? "amber" : "slate"}">${isMulti ? "多选题（选出所有正确项）" : "单选题"}</span>
            ${inWrong ? `<span class="badge crimson">🔥 错题回炉</span>` : `<span style="font-size:11.5px;color:var(--ink-muted);">看眼熟直接选</span>`}
          </div>

          <div class="q-stem">${q.stem}</div>

          <div class="opt-list">
            ${Object.entries(q.opts).map(([k, txt]) => {
              const picked = ui.caPicked.includes(k);
              const isAns = q.ans.includes(k);
              let cls = "";
              if (ui.caSubmitted) {
                if (isAns) cls = "opt-right";
                else if (picked) cls = "opt-wrong";
              } else if (picked) {
                cls = "selected";
              }
              return `
                <button class="opt-btn ${cls}" data-opt="${k}" type="button" ${ui.caSubmitted ? "disabled" : ""}>
                  <span class="opt-key">${k}.</span>
                  <span>${txt}</span>
                </button>
              `;
            }).join("")}
          </div>

          ${ui.caSubmitted ? `
            <div class="feedback-box ${isRight ? "right" : "wrong"}">
              <strong>${isRight ? "✓ 选对了！" : `✗ 正确答案：${q.ans.join("、")}`}</strong><br/>
              ${q.exp}
            </div>
          ` : ""}
        </section>
      `;

      document.getElementById("btnToggleFullTip")?.addEventListener("click", () => {
        ui.caShowFullTip = !ui.caShowFullTip;
        render();
      });

      if (!ui.caSubmitted) {
        stage.querySelectorAll("[data-opt]").forEach(btn => {
          btn.addEventListener("click", () => {
            const k = btn.dataset.opt;
            if (isMulti) {
              if (ui.caPicked.includes(k)) ui.caPicked = ui.caPicked.filter(x => x !== k);
              else ui.caPicked.push(k);
            } else {
              ui.caPicked = [k];
            }
            render();
          });
        });
      }

      bottom.innerHTML = `
        <div class="btn-row">
          ${!ui.caSubmitted ? `
            <button id="btnSubmitCa" class="btn-main" type="button" ${ui.caPicked.length ? "" : "disabled"}>
              确认提交（已选 ${ui.caPicked.sort().join("") || "无"}）
            </button>
          ` : `
            <button id="btnNextCa" class="btn-main" style="background:var(--forest);" type="button">
              下一关 →
            </button>
          `}
        </div>
      `;

      if (!ui.caSubmitted) {
        document.getElementById("btnSubmitCa").addEventListener("click", submitCaQuiz);
      } else {
        document.getElementById("btnNextCa").addEventListener("click", () => {
          pickNextCaQuestion();
          persist();
          render();
        });
      }
    }

    function renderCoreStage(stage, bottom) {
      const sc = st.coreScope;
      const tot = getCorePool(sc).length;
      const animCls = ui.animNext ? "anim-in" : "";
      ui.animNext = false;

      if (st.coreMode === "round") {
        const r = curRound();
        if (r.done) {
          stage.innerHTML = `
            <div class="empty-card">
              <h3>第 ${r.roundNo} 轮已全部抽完 (${tot} 签)</h3>
              <p>开启新一轮将自动打乱顺序，保证与上一轮排列不同。</p>
              <button id="btnNextR" class="btn-main" style="max-width:230px;margin:0 auto;" type="button">开启第 ${r.roundNo + 1} 轮</button>
            </div>
          `;
          document.getElementById("btnNextR").addEventListener("click", startNextRound);
          return;
        }
        if (!r.currentId) {
          stage.innerHTML = `
            <div class="empty-card">
              <h3>全量轮抽 · 抽完即换新顺序</h3>
              <p>先看正面年份与名称回忆，点击翻面核对核心考点与会著联动。</p>
              <button id="btnFirstR" class="btn-main" style="max-width:230px;margin:0 auto;" type="button">抽取第一签</button>
            </div>
          `;
          document.getElementById("btnFirstR").addEventListener("click", drawRoundCard);
          return;
        }
      } else {
        const uf = unfamPool(sc).length;
        if (uf === 0) {
          stage.innerHTML = `
            <div class="empty-card">
              <h3>当前板块已全部归档熟练盒！</h3>
              <p>所有 ${tot} 张卡片均已标记熟练，可在右上角「检索」随时移回。</p>
              <button id="btnOpenBoxList" class="btn-main" style="background:var(--forest);max-width:230px;margin:0 auto;" type="button">查看熟练列表</button>
            </div>
          `;
          document.getElementById("btnOpenBoxList").addEventListener("click", () => openSearchModal("MASTERED"));
          return;
        }
        if (!st.box.curByScope[sc]) {
          stage.innerHTML = `
            <div class="empty-card">
              <h3>双盒记忆 · 陌生盒剩 ${uf} 签</h3>
              <p>错题权重×4、手动陌生×2.5、常规×1；熟练后归档不再抽取。</p>
              <button id="btnFirstBox" class="btn-main" style="max-width:230px;margin:0 auto;" type="button">从陌生盒抽签</button>
            </div>
          `;
          document.getElementById("btnFirstBox").addEventListener("click", drawBoxCard);
          return;
        }
      }

      const cardId = st.coreMode === "round" ? curRound().currentId : st.box.curByScope[sc];
      const c = CORE_MAP[cardId];
      const wCnt = st.wrongMap[c.id] || 0;
      const counterTxt = st.coreMode === "round" ? `已抽 ${curRound().drawn.length} / ${tot}` : `陌生盒余 ${unfamPool(sc).length}`;
      const qPicked = ui.coreQuizPicked;
      const qDone = qPicked !== null;
      const qOk = qDone && qPicked === c.q.ans;

      stage.innerHTML = `
        <div id="coreScene" class="card-panel ${animCls}">
          ${!ui.flipped ? `
            <div id="cardFrontView" class="card-front-view">
              <div class="face-top">
                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                  ${st.blindOn ? `<span class="badge muted">盲测</span>` : `<span class="badge ${c.kind === "meeting" ? "crimson" : "forest"}">${c.kind === "meeting" ? "核心会议" : "毛选著作"}</span>`}
                  ${wCnt > 0 ? `<span class="badge amber">🔥 错×${wCnt}</span>` : ""}
                </div>
                <span style="font-size:11.5px;color:var(--ink-muted);font-weight:600;">${counterTxt}</span>
              </div>

              <div>
                <div class="front-year ${st.blindOn ? "blind" : c.kind}">${c.year}</div>
                <h2 class="front-title">${c.title}</h2>
                <div style="margin-top:10px;font-size:12px;color:var(--ink-muted);">${st.blindOn ? "先回忆再看解析" : c.tag}</div>
              </div>

              <div class="front-tip">点击签面查看考点解析</div>
            </div>
          ` : `
            <div id="cardBackView" class="card-back-view">
              <div class="back-top">
                <div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0;">
                  <span style="font-family:var(--font-mono);font-size:13px;font-weight:800;color:${c.kind === "meeting" ? "var(--crimson)" : "var(--forest)"};">${c.year}</span>
                  <strong style="font-family:var(--font-serif);font-size:15.5px;">${c.title}</strong>
                </div>
                <span class="badge ${c.kind === "meeting" ? "crimson" : "forest"}">${c.tag}</span>
              </div>

              <div class="back-body">
                <div class="layer-box core">
                  <div class="layer-lbl">
                    <span>①【必背核心】</span>
                    ${st.clozeOn ? `<button id="btnRevealCloze" class="mini-btn" style="padding:3px 9px;font-size:11px;" type="button">全部揭晓</button>` : ""}
                  </div>
                  <p class="layer-txt">${renderClozeHtml(c.core, c.kind)}</p>
                </div>

                <div class="layer-box sec">
                  <div class="layer-lbl">②【次要要点】</div>
                  <p class="layer-txt" style="font-size:13px;color:var(--ink-secondary);">${c.sec}</p>
                </div>

                <div class="layer-box trap">
                  <div class="layer-lbl">③【陷阱干扰项】</div>
                  <p class="layer-txt" style="font-size:13px;">${c.trap}</p>
                </div>

                ${c.linkIds && c.linkIds.length ? `
                  <div class="layer-box link">
                    <div class="layer-lbl">🔗【会著联动】点击对比</div>
                    <p class="layer-txt" style="font-size:12.5px;margin-bottom:7px;">${c.linkNote}</p>
                    <div class="chip-wrap">
                      ${c.linkIds.map(lid => {
                        const lc = CORE_MAP[lid];
                        if (!lc) return "";
                        return `<button class="mini-btn" style="background:#FFFFFF;border:1px solid var(--slate-border);color:var(--slate);" data-linkid="${lid}" type="button">${lc.year} ${lc.title} →</button>`;
                      }).join("")}
                    </div>
                  </div>
                ` : ""}

                <div class="layer-box sec" style="background:#FFFFFF;">
                  <div class="layer-lbl" style="color:var(--ink);">✦ 随堂判断</div>
                  <p class="layer-txt" style="font-size:13px;font-weight:600;margin-bottom:8px;">${c.q.stem}</p>
                  <div class="btn-row">
                    <button id="btnCardT" class="opt-btn ${qDone && qPicked === true ? (qOk ? "opt-right" : "opt-wrong") : ""}" style="padding:8px;justify-content:center;font-size:13px;font-weight:700;" type="button" ${qDone ? "disabled" : ""}>✓ 正确</button>
                    <button id="btnCardF" class="opt-btn ${qDone && qPicked === false ? (qOk ? "opt-right" : "opt-wrong") : ""}" style="padding:8px;justify-content:center;font-size:13px;font-weight:700;" type="button" ${qDone ? "disabled" : ""}>✗ 错误</button>
                  </div>
                  ${qDone ? `<div class="feedback-box ${qOk ? "right" : "wrong"}" style="margin-top:8px;font-size:12.5px;">${c.q.exp}</div>` : ""}
                </div>
              </div>

              <div class="back-bottom">
                <span>考点解析已展开</span>
                <button id="btnFlipFront" class="mini-btn" style="color:var(--slate);background:var(--slate-soft);" type="button">↻ 切回签面</button>
              </div>
            </div>
          `}
        </div>
      `;

      document.getElementById("cardFrontView")?.addEventListener("click", () => {
        ui.flipped = true;
        ui.viewedBack = true;
        render();
        renderCoreBottom(bottom);
      });

      document.getElementById("btnFlipFront")?.addEventListener("click", () => {
        ui.flipped = false;
        render();
        renderCoreBottom(bottom);
      });

      document.getElementById("btnRevealCloze")?.addEventListener("click", () => {
        document.querySelectorAll("#cardBackView .cloze-pill").forEach(el => {
          ui.shownCloze.add(Number(el.dataset.cidx));
        });
        render();
        renderCoreBottom(bottom);
      });

      document.querySelectorAll("#cardBackView .cloze-pill").forEach(pill => {
        pill.addEventListener("click", () => {
          const n = Number(pill.dataset.cidx);
          if (ui.shownCloze.has(n)) ui.shownCloze.delete(n);
          else ui.shownCloze.add(n);
          render();
          renderCoreBottom(bottom);
        });
      });

      document.querySelectorAll("#cardBackView [data-linkid]").forEach(linkBtn => {
        linkBtn.addEventListener("click", () => {
          openLinkModal(linkBtn.dataset.linkid);
        });
      });

      if (!qDone) {
        const judge = val => {
          ui.coreQuizPicked = val;
          ui.flipped = true;
          ui.viewedBack = true;
          if (val !== c.q.ans) {
            st.wrongMap[c.id] = (st.wrongMap[c.id] || 0) + 1;
            st.box.masteredIds = st.box.masteredIds.filter(x => x !== c.id);
            toast("🔥 答错已标高优复习");
          }
          persist();
          render();
          renderCoreBottom(bottom);
        };
        document.getElementById("btnCardT")?.addEventListener("click", () => judge(true));
        document.getElementById("btnCardF")?.addEventListener("click", () => judge(false));
      }

      renderCoreBottom(bottom);
    }

    function renderCoreBottom(bottom) {
      const locked = st.antiLock && !ui.viewedBack;
      const tip = locked ? `<div class="lock-tip">🔒 防误触锁：请先点击签面翻看背面考点</div>` : "";

      if (st.coreMode === "round") {
        const r = curRound();
        bottom.innerHTML = `
          ${tip}
          <div class="btn-row">
            <button id="btnDrawR" class="btn-main" type="button" ${locked ? "disabled" : ""}>
              ${r.remaining.length === 0 ? "完成本轮 ✓" : `下一签（余 ${r.remaining.length}）`}
            </button>
          </div>
          <div style="margin-top:6px;display:flex;justify-content:space-between;align-items:center;">
            <button id="btnUndoR" class="mini-btn" type="button" ${r.undoStack.length ? "" : "disabled"}>↩ 撤回上一签</button>
            <span style="font-size:11px;color:var(--ink-muted);">第 ${r.roundNo} 轮</span>
          </div>
        `;
        document.getElementById("btnDrawR").addEventListener("click", drawRoundCard);
        document.getElementById("btnUndoR").addEventListener("click", undoRoundCard);
      } else {
        bottom.innerHTML = `
          ${tip}
          <div class="btn-row">
            <button id="btnUnfam" class="btn-err" type="button" ${locked ? "disabled" : ""}>
              <span>仍陌生 · 高频重抽</span>
              <span class="sub">留陌生盒 · 权重×2.5</span>
            </button>
            <button id="btnMast" class="btn-ok" type="button" ${locked ? "disabled" : ""}>
              <span>已熟练 · 归档熟练盒</span>
              <span class="sub">不再抽取 · 随时可移回</span>
            </button>
          </div>
          <div style="margin-top:6px;display:flex;justify-content:space-between;align-items:center;">
            <button id="btnUndoB" class="mini-btn" type="button" ${st.box.undoStack.length ? "" : "disabled"}>↩ 撤回上一步</button>
            <span style="font-size:11px;color:var(--ink-muted);">熟练 ${st.box.masteredIds.length} / 57</span>
          </div>
        `;
        document.getElementById("btnUnfam").addEventListener("click", boxStillUnfam);
        document.getElementById("btnMast").addEventListener("click", boxMarkMastered);
        document.getElementById("btnUndoB").addEventListener("click", undoBoxStep);
      }
    }

    function render() {
      document.getElementById("tabCa").classList.toggle("active", st.activeTrack === "ca");
      document.getElementById("tabCore").classList.toggle("active", st.activeTrack === "core");
      renderGoalBar();
      renderSubBar();
      renderStage();
    }

    /* ==========================================================================
       8. 检索抽屉、存档备份与二次确认
       ========================================================================== */
    function openSearchModal(flt = "ALL") {
      document.getElementById("searchInput").value = "";
      document.getElementById("searchFilter").value = flt;
      document.getElementById("searchModal").classList.add("open");
      renderSearchList();
    }

    function renderSearchList() {
      const kw = document.getElementById("searchInput").value.trim().toLowerCase();
      const flt = document.getElementById("searchFilter").value;
      const listEl = document.getElementById("searchList");
      const mSet = new Set(st.box.masteredIds);

      const rows = [
        ...CA_TOPICS.map(t => ({
          kind: "ca", id: t.id,
          badge: t.code, badgeCls: t.area === "dom" ? "slate" : "forest",
          title: t.title,
          sub: t.chips.map(x => x.replace(/<[^>]+>/g, "")).join(" ｜ "),
          isMast: st.caFamiliarIds.includes(t.id),
          w: CA_QUESTIONS.filter(q => q.topicId === t.id && (st.wrongMap[q.id] || 0) > 0).length
        })),
        ...CORE_SORTED.map(c => ({
          kind: "core", id: c.id,
          badge: c.kind === "meeting" ? "会议" : "毛著",
          badgeCls: c.kind === "meeting" ? "crimson" : "forest",
          title: `${c.year} ${c.title}`,
          sub: `${c.tag} · ${c.core.replace(/\{\{|\}\}/g, "")}`,
          isMast: mSet.has(c.id),
          w: st.wrongMap[c.id] || 0
        }))
      ].filter(r => {
        if (flt === "UNFAMILIAR" && r.isMast) return false;
        if (flt === "MASTERED" && !r.isMast) return false;
        if (flt === "WRONG" && r.w <= 0) return false;
        if (!kw) return true;
        return r.title.toLowerCase().includes(kw) || r.sub.toLowerCase().includes(kw);
      });

      if (!rows.length) {
        listEl.innerHTML = `<div style="text-align:center;padding:26px;color:var(--ink-muted);font-size:13px;">未找到匹配条目</div>`;
        return;
      }

      listEl.innerHTML = rows.map(r => `
        <div class="search-row-card ${r.isMast ? "done" : ""}">
          <div class="search-row-top">
            <div class="search-row-meta">
              <span class="badge ${r.badgeCls}">${r.badge}</span>
              <strong style="font-size:13.5px;line-height:1.4;">${r.title}</strong>
              ${r.w > 0 ? `<span class="badge amber">🔥 错×${r.w}</span>` : ""}
            </div>
            <button class="mini-btn" style="flex-shrink:0;${r.isMast ? "background:var(--amber-soft);color:var(--amber);" : "background:var(--forest-soft);color:var(--forest);"}" data-srid="${r.id}" data-srkind="${r.kind}" type="button">
              ${r.isMast ? "移回未熟" : "标为已熟"}
            </button>
          </div>
          <div class="search-row-sub">${r.sub}</div>
        </div>
      `).join("");

      listEl.querySelectorAll("[data-srid]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.srid;
          if (btn.dataset.srkind === "core") {
            saveBoxUndo();
            if (st.box.masteredIds.includes(id)) st.box.masteredIds = st.box.masteredIds.filter(x => x !== id);
            else st.box.masteredIds.push(id);
          } else {
            if (st.caFamiliarIds.includes(id)) st.caFamiliarIds = st.caFamiliarIds.filter(x => x !== id);
            else st.caFamiliarIds.push(id);
          }
          persist();
          render();
          renderSearchList();
        });
      });
    }

    let confirmCallback = null;
    function openConfirm(title, msg, fn) {
      document.getElementById("confirmTitle").textContent = title;
      document.getElementById("confirmMsg").textContent = msg;
      confirmCallback = fn;
      document.getElementById("confirmModal").classList.add("open");
    }

    function handleResetTrack() {
      if (st.activeTrack === "ca") {
        openConfirm("重置时政闯关进度", "确定清空时政已刷题目、错题回炉与今日目标统计？", () => {
          st.caDoneQIds = [];
          st.caWrongQIds = [];
          st.caFamiliarIds = [];
          st.caStreak = 0;
          st.todayDone = 0;
          st.caCurQId = "q01";
          ui.caPicked = [];
          ui.caSubmitted = false;
          persist();
          toast("时政进度已重置");
          render();
        });
      } else {
        const sc = st.coreScope;
        if (st.coreMode === "round") {
          openConfirm("重置当前轮抽", "确定重置当前板块的轮抽进度并重新洗牌？", () => {
            st.rounds[sc] = makeRoundState(sc, st.rounds[sc].order);
            resetCoreTransient(false);
            persist();
            toast("本轮已重置");
            render();
          });
        } else {
          openConfirm("重置当前板块双盒", "确定将当前板块的熟练卡片全部移回陌生盒？", () => {
            const setIds = new Set(getCorePool(sc));
            st.box.masteredIds = st.box.masteredIds.filter(id => !setIds.has(id));
            st.box.curByScope[sc] = null;
            resetCoreTransient(false);
            persist();
            toast("双盒已重置");
            render();
          });
        }
      }
    }

    function bindEvents() {
      document.getElementById("tabCa").addEventListener("click", () => {
        st.activeTrack = "ca";
        persist();
        render();
      });
      document.getElementById("tabCore").addEventListener("click", () => {
        st.activeTrack = "core";
        persist();
        render();
      });

      // 联动弹窗
      document.getElementById("btnCloseLink").addEventListener("click", () => document.getElementById("linkModal").classList.remove("open"));
      document.getElementById("linkModal").addEventListener("click", e => {
        if (e.target === e.currentTarget) document.getElementById("linkModal").classList.remove("open");
      });

      // 检索弹窗
      document.getElementById("btnOpenSearch").addEventListener("click", () => openSearchModal("ALL"));
      document.getElementById("btnCloseSearch").addEventListener("click", () => document.getElementById("searchModal").classList.remove("open"));
      document.getElementById("searchModal").addEventListener("click", e => {
        if (e.target === e.currentTarget) document.getElementById("searchModal").classList.remove("open");
      });
      document.getElementById("searchInput").addEventListener("input", renderSearchList);
      document.getElementById("searchFilter").addEventListener("change", renderSearchList);

      // 存档弹窗
      document.getElementById("btnOpenBackup").addEventListener("click", () => document.getElementById("backupModal").classList.add("open"));
      document.getElementById("btnCloseBackup").addEventListener("click", () => document.getElementById("backupModal").classList.remove("open"));
      document.getElementById("backupModal").addEventListener("click", e => {
        if (e.target === e.currentTarget) document.getElementById("backupModal").classList.remove("open");
      });
      document.getElementById("btnExport").addEventListener("click", () => {
        document.getElementById("backupArea").value = JSON.stringify(st);
        toast("已生成备份码");
      });
      document.getElementById("btnCopy").addEventListener("click", () => {
        const ta = document.getElementById("backupArea");
        if (!ta.value.trim()) ta.value = JSON.stringify(st);
        ta.select();
        try {
          document.execCommand("copy");
          toast("已复制到剪贴板");
        } catch (_) {
          toast("请长按文本框手动复制");
        }
      });
      document.getElementById("btnImport").addEventListener("click", () => {
        const raw = document.getElementById("backupArea").value.trim();
        if (!raw) return toast("请先粘贴备份码");
        try {
          const obj = JSON.parse(raw);
          st = { ...defaultState(), ...obj };
          persist();
          document.getElementById("backupModal").classList.remove("open");
          toast("✓ 进度恢复成功");
          render();
        } catch (_) {
          toast("备份码格式错误");
        }
      });

      // 二次确认弹窗
      const closeC = () => {
        document.getElementById("confirmModal").classList.remove("open");
        confirmCallback = null;
      };
      document.getElementById("btnCloseConfirm").addEventListener("click", closeC);
      document.getElementById("btnCancelConfirm").addEventListener("click", closeC);
      document.getElementById("confirmModal").addEventListener("click", e => {
        if (e.target === e.currentTarget) closeC();
      });
      document.getElementById("btnOkConfirm").addEventListener("click", () => {
        const fn = confirmCallback;
        closeC();
        if (typeof fn === "function") fn();
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadSaved();
      bindEvents();
      render();
    });
  </script>
</body>
</html>
