润或利息，例如在华设厂、开矿，或向清政府贷款并取得附加权益。②目的：把中国变成资本主义世界体系的附庸。西方殖民主义势力来到东方，并不是为了使东方国家成为独立的资本主义国家，而是为了把它们纳入资本主义的世界体系，成为殖民地、半殖民地，成为自己在经济上、政治上、文化上的附庸③后果：中国自然经济的基础受到破坏，外国资本主义在华势力扩大，中国经济的依附性加深。（2）半殖民地与半封建各从哪里判断【详见：第1 套，第10 题。手册第118 页：考点2】。"},{"id":"苏一-3-11","source":"苏一六套卷 第3套","qno":11,"type":"单选","subject":"史纲","stem":"1929 年12 月，古田会议通过了毛泽东起草的决议，其中最重要的是关于纠正党内错误思想的决议案。决议阐述了加强党的思想建设的极端重要性，指明党内各种非无产阶级思想的表现、来源及纠正办法。这些规定着重解决的是","options":{"A":"如何在革命低潮中确定土地革命和武装起义的方针","B":"如何在党和军队以农民为主要成分的条件下保持其政治性质","C":"如何在长征途中解决具有决定意义的军事和组织问题","D":"如何在民族危机加深的条件下建立抗日民族统一战线"},"answer":"B","analysis":"古田会议决议是中国共产党和红军建设的纲领性文献，是党和人民军队建设史上的重要里程碑。古田会议确立了马克思主义建党建军原则，创造性地解决了在农村环境中、在党组织和军队以农民为主要成分的条件下，如何保持党的无产阶级先锋队性质和建设党领导的新型人民军队的重大问题。题干强调纠正各种非无产阶级思想、加强党的思想建设，所要解决的正是在党和军队以农民为主要成分的条件下，如何保持党的无产阶级先锋队性质和建设党领导的新型人民军队的问题。B 正确。","distractors":"A 选项，是1927 年八七会议解决的问题。C 选项是1935 年遵义会议解决的问题。D 选项是1935 年瓦窑堡会议解决的问题。","extra":"从大革命失败到抗日民族统一战线方针的提出【《手册》第134、135、136、138、214 页】会议 为什么召开 解决了什么问题①彻底清算大革命后期的陈独秀右倾机会八七会议 主义错误。②确定土地革命和武装起义的大革命失败，革命力量遭受严重损失，（1927 年8 月7 日，汉 方针。③毛泽东提出“须知政权是由枪杆党迫切需要确定新的斗争方针口） 子中取得的”。会议给正处于思想混乱和组织涣散中的党指明了新的出路。确立思想建党、政治建军原则，强调红军是执行革命政治任务的武装集团，必须绝古田会议 在农村环境中，党员和红军战士多出身 对服从党的领导。创造性地解决了在农村（1929 年12 月，福建 于农民，红四军党内存在各种非无产阶 环境中、在党组织和军队以农民为主要成上杭） 级思想 分的条件下，如何保持党的无产阶级先锋队性质和建设党领导的新型人民军队的重大问题①集中解决具有决定意义的军事问题和组织问题。②开始确立以毛泽东同志为主要遵义会议第五次反“围剿”失败，长征初期红军 代表的马克思主义正确路线在党中央的领（1935 年1 月，贵州遵又遭受严重损失。 导地位。③在极端危急关头挽救了党、挽义）救了红军、挽救了中国革命，是党的历史上生死攸关的转折点。①提出建立抗日民族统一战线的策略方瓦窑堡会议 针。②批评“左”倾关门主义，强调在统华北事变后民族危机加深，需要解决团（1935 年12 月，陕北 一战线中坚持无产阶级领导权。③为迎接结哪些力量共同抗日的问题。瓦窑堡） 全国抗日新高潮到来作了理论和政治上的准备。"},{"id":"苏一-3-12","source":"苏一六套卷 第3套","qno":12,"type":"单选","subject":"史纲","stem":"1937 年卢沟桥事变爆发后，中华民族面临空前严重的民族危机，如何动员和组织全国人民争取抗战胜利，成为中国共产党面临的重大任务。同年8 月，中共中央在陕北洛川召开政治局扩大会议，通过抗日救国十大纲领，强调打倒日本帝国主义的关键在于","options":{"A":"反对主观主义以整顿学风","B":"加强根据地的政权建设","C":"废除封建性及半封建性剥削的土地制度，实行耕者有其田","D":"使已经发动的抗战成为全面的全民族抗战"},"answer":"D","analysis":"全国性抗战开始后，国共两党虽然共同抗日，但实行的是两条不同的抗战路线。国民党实行片面抗战路线，主要依靠政府和军队抗战；中国共产党实行全面抗战路线，即人民战争路线。两条不同抗战路线的存在，是中国一切问题的关键。1937 年8 月，中国共产党在陕北召开洛川会议，制定了抗日救国十大纲领，强调要打倒日本帝国主义，关键在于使已经发动的抗战成为全面的全民族抗战。为此，必须实行全国军事总动员、全国人民总动员；必须改革政治机构，给人民以充分的抗日民主权利，并适当改善工农大众生活。D 正确。","distractors":"A 选项，反对主观主义以整顿学风，是延安整风运动最主要的任务，不是洛川会议提出的内容。B 选项，加强政权建设，是抗日根据地建设的首要的、根本的任务。C选项，废除封建剥削制度、实行耕者有其田，是解放战争时期确立的土地政策。","extra":"（1）洛川会议（1937 年8 月）【《手册》第139 页：考点3】。七七事变后，全国性抗战已经开始。怎样把各阶层人民的力量动员起来，成了迫切问题。洛川会议制定抗日救国十大纲领。强调打倒日本帝国主义，关键在于使已经发动的抗战成为全面的全民族抗战。②实行全国军事总动员、全国人民总动员。③改革政治机构，给人民以充分的抗日民主权利，并适当改善工农大众生活。④坚持统一战线中无产阶级的领导权，在敌后发动独立自主的山地游击战争，在国民党统治区发动抗日群众运动。（2）土地政策怎样随革命任务变化 【《手册》第212 页】时间 土地政策及变化1928 年：《井冈山土地法》是党历史上第一个土地法。1929 年：《兴国土地法》把“没收一切土地”改为“没收一切公共土地及地主阶级土地革命战争时期的土地”，保护中农利益。（1927-1937）1931 年：坚定地依靠贫农、雇农，联合中农，限制富农，保护中小工商业者，消灭地主阶级。分配土地实行抽多补少、抽肥补瘦。【《手册》第135 页】全民族抗日战争时期 地主减租减息、农民交租交息。一方面减轻农民负担，另一方面联合地主阶级中的（1937-1945） 抗日力量，服务于团结抗日。【《手册》第141 页考点6】1946 年《五四指示》推动解放区由减租减息转向实现耕者有其田。1947 年《中国解放战争时期（1945-土地法大纲》明确废除封建性及半封建性剥削的土地制度，实行耕者有其田的土地1949）制度。【《手册》第146 页考点5】《中华人民共和国土地改革法》规定废除地主阶级封建剥削的土地所有制，实行农新中国成立初期 民的土地所有制。分得土地后归农民个人所有，农业合作化才涉及向集体所有转变。【《手册》第150 页考点2】"},{"id":"苏一-3-13","source":"苏一六套卷 第3套","qno":13,"type":"单选","subject":"史纲","stem":"1949 年10 月1 日下午，首都北京30 万军民在天安门广场隆重举行开国大典。开国大典之前，毛泽东主持召开中央人民政府委员会第一次会议。会议一致决议接受《中国人民政治协商会议共同纲领》为中央人民政府施政纲领。构成《中国人民政治协商会议共同纲领》的基础是①中共七届二中全会的决议②《新民主主义论》③《论人民民主专政》④《论联合政府》","options":{"A":"①②","B":"①③","C":"②③","D":"③④"},"answer":"B","analysis":"随着人民解放战争的胜利发展，建立新中国的任务被提上日程。1949 年3 月召开的中共七届二中全会，规定了党在全国胜利后应当采取的基本政策，指出了新中国的发展方向。1949 年6 月30 日，毛泽东发表《论人民民主专政》，系统阐明人民民主专政的领导力量、阶级基础以及各阶级在国家政权中的地位，为即将成立的新中国作了政治理论准备。中共七届二中全会的决议和毛泽东的《论人民民主专政》，共同构成了《中国人民政治协商会议共同纲领》的基础。B 正确。","distractors":"对于②，《新民主主义论》发表于1940 年，系统阐述新民主主义理论，但并非起草《共同纲领》的基础。对于④，《论联合政府》是毛泽东在1945 年中共七大上所作的政治报告，系统阐述了中国共产党的政治主张和建立民主联合政府的要求，不是制定《共同纲领》的直接基础。","extra":"（1）从建国准备到国家根本大法【《手册》第148 页】①基础：七届二中全会的决议和《论人民民主专政》。②通过：1949 年9 月，中国人民政治协商会议第一届全体会议。③作用：《共同纲领》在一个时期内起着新中国临时宪法的作用。④施政纲领：1949 年10 月1 日，中央人民政府委员会第一次会议决定接受《共同纲领》为施政纲领。1954 年第一届全国人民代表大会第一次会议通过新中国第一部宪法。（2）为新中国绘制蓝图【《手册》第148 页】1949 年3 月，中国共产党在河北省平山县西柏坡村召开中共七届二中全会：①提出了迅速夺取全国胜利的方针②提出党的工作重心必须由乡村转移到城市（注意是“提出”）中共七届二中全会 ③规定了党在全国胜利后在政治、经济、外交方面应当采取的基本政策（1949 年3 月） ④指出了中国由农业国转变为工业国、由新民主主义社会转变为社会主义社会的发展方向⑤提出了“两个务必”的思想：务必使同志们继续地保持谦虚、谨慎、不骄、不躁的作风；务必使同志们继续地保持艰苦奋斗的作风1949 年3 月25 日，毛泽东等中央领导人与中央机关、人民解放军总部进驻北平香历史标志山，标志着中国革命重心从农村转向城市1949 年6 月，毛泽东发表了《论人民民主专政》一文：①对新民主主义革命的基本经验作了集中概括②丰富和发展了马克思主义关于无产阶级领导人民革命的理论《论人民民主专政》③为新中国的建立奠定了理论基础和政策基础④中共七届二中全会的决议和《论人民民主专政》，构成了《中国人民政治协商会议共同纲领》的基础完成创建新中国的任务，是由中国人民政治协商会议第一届全体会议来承担的。1949 年9 月21 日，中国人民政治协商会议第一届全体会议在北平隆重开幕：①会议通过了《中国人民政治协商会议组织法》《中华人民共和国中央人民政府组织法》和《中国人民政治协商会议共同纲领》人民政协与《共同纲领》②《中国人民政治协商会议共同纲领》成为中国人民的大宪章，在一个时期内起着新中国临时宪法的作用③人民政协会议的召开，标志着中国的新型政党制度——中国共产党领导的多党合作和政治协商制度的确立"},{"id":"苏一-3-14","source":"苏一六套卷 第3套","qno":14,"type":"单选","subject":"思修","stem":"青年马克思在谈到职业选择时写道：“如果我们选择了最能为人类而工作的职业，那么，重担就不能把我们压倒，因为这是为大家作出的牺牲；那时我们所享受的就不是可怜的、有限的、自私的乐趣，我们的幸福将属于千百万人。”这一职业追求充分体现，社会主义职业道德的最高层次要求是","options":{"A":"爱岗敬业","B":"办事公道","C":"热情服务","D":"奉献社会"},"answer":"D","analysis":"奉献社会是社会主义职业道德的最高层次要求。把为人类工作、为众人谋幸福作为职业追求，体现了职业劳动的社会意义。D 正确。","distractors":"A 选项，爱岗敬业强调对岗位和职责的态度；B 选项，办事公道强调公正处理职业事务；C 选项，热情服务强调对待服务对象的态度。ABC 均不符合题意。","extra":"职业道德的主要内容【《手册》第167 页】①爱岗敬业：热爱岗位、认真履职。②诚实守信：履约守诺。③办事公道：公正处理职业事务。④热情服务：主动服务、尊重服务对象。⑤奉献社会：社会主义职业道德中最高层次的要求，体现了社会主义职业道德的最高目标指向。社会主义道德建设的核心“为人民服务”【详见：第1 套，第14 题】。"},{"id":"苏一-3-15","source":"苏一六套卷 第3套","qno":15,"type":"单选","subject":"时政","stem":"新一轮科技革命和产业变革加速突破，全球科技竞争更加聚焦基础前沿领域，原创性颠覆性创新的重要性日益凸显。2026 年4 月，习近平总书记在上海指出，要进一步打牢科技强国建设根基。在整个科学体系中，居于源头地位的是","options":{"A":"应用开发","B":"基础研究","C":"中试验证","D":"成果转化"},"answer":"B","analysis":"习近平总书记在加强基础研究座谈会上指出：“基础研究是整个科学体系的源头，是所有技术问题的总机关，是全球科技竞争的前沿阵地。”B 正确，ACD 不符合题意。","distractors":"","extra":"2026 年4 月30 日上海加强基础研究座谈会（1）定位与要求。基础研究是整个科学体系的源头，是所有技术问题的总机关，是全球科技竞争的前沿阵地。要以更大力度、更实举措加强基础研究，提升我国原始创新能力，进一步打牢科技强国建设根基。（2）会议围绕四方面作出部署方面 可以直接辨认的举措坚持四个面向（世界科技前沿、经济主战场、国家重大需求、人民生命健康）。国家科研机科研布局 构、高水平研究型大学发挥引领作用，企业主导产学研用深度融合。打通基础研究、应用开发、成果转化的创新链条。教育、科技、人才一体推进。在科研一线发现和培养人才，通过任务牵引、以老带新，大力扶人才队伍持青年人才。逐步提高基础研究经费占比，形成多元化投入格局。健全符合基础研究特点的分类评价体系。支持保障营造开放包容、宽容失败的创新环境。加强科研诚信建设。融入全球创新网络，对气候变化、能源环境、生命健康等共同问题开展联合攻关，积极参与全国际合作球科技治理。"},{"id":"苏一-3-16","source":"苏一六套卷 第3套","qno":16,"type":"单选","subject":"时政","stem":"2026 年10 月，新中国迎来恢复联合国合法席位55 周年。1971 年10 月25 日，第二十六届联合国大会以压倒性多数通过第2758 号决议，决定恢复中华人民共和国在联合国的一切权利，承认中华人民共和国政府代表是中国在联合国的唯一合法代表。这标志着占世界人口四分之一的中国人民重返联合国舞台。于联合国而言，这一历史性事件的重大意义主要在于","options":{"A":"有力巩固国际社会坚持一个中国原则的格局","B":"显著增强联合国的普遍性、代表性与权威性","C":"中国对外交往格局豁然打开","D":"壮大广大发展中国家维护国际公道正义的力量二、多项选择题：17～33 小题，每小题2 分，共34 分。下列每题给出的四个选项中，至少有两个选项是符合题目要求的。"},"answer":"B","analysis":"拥有世界近1/4 人口、代表世界进步力量的最大发展中国家重返联合国，补齐了联合国代表性上最大的一块短板，显著增强这一国际组织的普遍性、代表性与权威性，巩固联合国在全球治理体系的中心地位，开启中国与联合国携手同行的崭新篇章。B 正确。","distractors":"A 选项和C 选项，属于对中国而言的意义；D 选项，属于对世界而言的意义；题干考查的是“于联合国而言”的意义，ACD 均不符合题意。二、多项选择题：17～33 小题，每小题2 分，共34 分。下列每题给出的四个选项中，至少有两个选项是符合题目要求的。","extra":"联合国大会第2758 号决议（1）1971 年10 月25 日，第二十六届联合国大会通过第2758 号决议，恢复中华人民共和国在联合国的一切权利。此处考“恢复合法席位”，中国是联合国创始会员国。（2）于联合国而言，第2758 号决议绝非普通的席位调整，而是国际组织合法性的一次重要完善。中国重返联合国：显著增强这一国际组织的普遍性、代表性与权威性，巩固联合国在全球治理体系的中心地位，开启中国与联合国携手同行的崭新篇章。全球治理【《手册》第114 页】（1）中国提出全球治理倡议，旨在推动构建更加公正合理的全球治理体系。（2）落实全球治理倡议：①最根本的是坚定维护联合国的权威和地位②最关键的是大国展现责任担当③最需要的是各国团结合作④最紧迫的是弥补和平与发展赤字（3）必须毫不动摇地维护以联合国为核心的国际体系，维护以国际法为基础的国际秩序，维护以联合国宪章宗旨和原则为基础的国际关系基本准则（4）习近平总书记指出，“提出构建人类命运共同体理念和四大全球倡议，一个重要考虑就是维护联合国地位和权威”"},{"id":"苏一-3-17","source":"苏一六套卷 第3套","qno":17,"type":"多选","subject":"马原","stem":"面对不断变异的植物病原物，研究人员尝试借助人工智能设计新的植物免疫受体。他们利用模型预测病原蛋白结构，生成并筛选候选方案，再据此构建新的免疫受体，通过植物实验检验其识别病原蛋白、激活免疫反应的功能。人工智能在这一研究中的应用表明，它","options":{"A":"能够作为实践中介连接研究主体与研究对象","B":"能够将人类的直觉思维化约为数字信号","C":"能够在承担科研功能的过程中获得人类意识的社会属性","D":"能够模拟和扩展人的部分认识功能"},"answer":"AD","analysis":"实践中介是主体和客体相互作用所借助的工具、手段，以及运用、操作这些工具和手段的程序和方法。研究人员借助人工智能预测病原蛋白结构、设计免疫受体，并据此开展植物实验，人工智能作为研究工具连接了研究主体与研究对象，A 正确。人工智能是对人脑组织结构与思维运行机制的模仿，是人类智能的物化，能够模拟和扩展人的部分认识功能。模型预测结构、生成并筛选候选方案，扩展了研究人员处理信息和研究设计的能力，但仍须由研究人员组织实验、检验结果，D 正确。","distractors":"B 错误，人工智能能够获得人类意识中可以化约为数字信号的内容，但人脑中仍有无法被化约的内容。教材指出，直觉思维是瞬间完成的对事物本质特征的直接领悟，由于绕开了逻辑推理，人们往往只能描述其心理状态，而无法将其化约为数字信号。模型能够生成候选方案，不等于把人类直觉思维本身化约为数字信号。C 错误，意识是社会的产物，具有社会性；人工智能是人造机器，不可能真正具备人类的社会属性。在人的组织下承担科研功能，并不意味着人工智能因此获得人的意识及其社会属性。","extra":"（1）实践的基本结构：主体、客体和中介【《手册》第14 页：考点1】①实践主体是从事实践活动的人②实践客体是实践活动所指向的对象③实践中介包括各种形式的工具、手段以及运用、操作这些工具和手段的程序和方法。①实践的主体和客体相互作用的关系包括：实践关系（最根本的关系）、认识关系、价值关系三者关系②实践的主体和客体正是依靠中介系统才能够相互作用③人类一切实践活动的结果都是主体客体化的结果（2）人工智能为什么不能取代人类智能【《手册》第7 页】人工智能是人的意识能动性的一种特殊表现，是人的本质力量的对象化、现实化。科研人员确定研究目的、选择方法，人工智能作为实践中介协助处理数据。①情感、信念、意志。人工智能只是对人类的理性智能的模拟和扩展，不具备情感、信念、意志等人类意识形式。②社会属性。人工智能不可能真正具备人类的社会属性。③语言的真实意义。人类的自然语言是思维的物质外壳和意识的现实形式，而人工智能难以完全具备理解自然语言真实意义的能力。④数字信号的限度。人工智能能够获得人类意识中可以化约为数字信号的内容，但人脑中总有许多东西是无法被化约的。比如潜意识。"},{"id":"苏一-3-18","source":"苏一六套卷 第3套","qno":18,"type":"多选","subject":"马原","stem":"从用手机控制单件家电，到灯光、空调等设备联动，智能家居产品为消费者提供了新的生活体验。消费者不再满足于购买一台台独立的家电，对整套家居服务的需求日益增长，又推动企业改进产品和服务，从销售单件产品转向提供整体解决方案。这一过程蕴含的哲学道理有","options":{"A":"矛盾双方相互依存，一方的发展以另一方的发展为条件","B":"矛盾的主要方面和次要方面在一定条件下相互转化","C":"矛盾双方相互依存意味着双方在事物发展中具有同等地位","D":"矛盾双方能够在相互作用中各自得到发展"},"answer":"AD","analysis":"矛盾的同一性是矛盾双方相互依存、相互贯通的性质和趋势。同一性是事物存在和发展的前提，一方的发展以另一方的发展为条件。智能家居产品为消费提供新的对象和方式，消费需求又为生产改进提出要求，说明生产与消费相互依存、互为发展条件，A 正确。同一性还使矛盾双方能够相互吸取有利于自身的因素，在相互作用中各自得到发展。新的产品和服务提升了消费体验，增长的整体服务需求又推动企业由销售单件产品转向提供整体解决方案，体现了双方在相互作用中得到发展，D 正确。","distractors":"B 选项，矛盾的主要方面和次要方面在一定条件下可以相互转化，即双方的支配地位与非支配地位发生改变。材料呈现的是生产与消费相互促进，没有说明二者的主次地位发生互换，与题意不相符合。C 错误，矛盾双方相互依存，不等于双方处于同等地位。矛盾发展具有不平衡性，主要方面居于支配地位，次要方面居于被支配地位，不能由相互依存推出地位相同。","extra":"矛盾的同一性与斗争性【《手册》第9 页】比较 同一性 斗争性对立面相互依存、相互贯通，在一定条件下可以相互区别 对立面相互排斥、相互分离。相互转化。①同一性是事物存在和发展的前提，一方的发展 ①促进矛盾双方力量的变化，为对立面的作用以另一方的发展为条件。②双方相互吸取有利于 转化、事物的质变创造条件。②是一种矛自身的因素，各自得到发展。③规定事物转化的 盾统一体向另一种矛盾统一体过渡的决定可能和发展的趋势。 性力量。斗争性寓于同一性之中，同一性通过斗争性来体现。二者相结合，推动事物变化发展。（3）在事物发展过程中，条件不同，矛盾的同一性和斗争性所处的地位会有所不同：①在一定的条件下，矛盾的斗争性可能处于主要方面②在另外的条件下，矛盾的同一性可能处于主要方面如斗争性/同一性在事物发展中始终处于主要地位（×）（4）内因和外因：①内因（内部矛盾）是事物发展的根本原因，是事物发展的根据②外因（外部矛盾）是事物发展的条件，影响事物的发展，外因必须通过内因起作用（4）矛盾双方主次地位及其方法论【详见：第2 套，第17 题、手册第10 页】。"},{"id":"苏一-3-19","source":"苏一六套卷 第3套","qno":19,"type":"多选","subject":"马原","stem":"马克思、恩格斯在《德意志意识形态》中分析大工业的作用时指出，理论力学的发展是大工业兴起的条件之一。大工业创造了交通工具和世界市场，使各国逐渐摆脱原有的孤立状态，人们需要的满足日益依赖整个世界。与此同时，大工业发展起来的生产力又受到资本主义私有制的束缚。这一分析表明","options":{"A":"生产方式的发展变革是世界历史形成和发展的基础","B":"普遍交往是世界历史的基本特征","C":"生产关系能够对生产力的发展起阻碍作用","D":"科学技术进步是社会形态更替的决定性力量"},"answer":"ABC","analysis":"生产方式的发展变革是世界历史形成和发展的基础。大工业创造交通工具和世界市场，推动各国逐渐摆脱孤立状态，说明生产方式的变革推动了历史向世界历史的转变，A 正确。普遍交往是世界历史的基本特征。人们需要的满足日益依赖整个世界，体现了交往范围的扩展以及各国之间联系和依赖的加强，B 正确。生产关系对生产力具有反作用，适合生产力发展要求时起推动作用，不适合时起阻碍作用。大工业形成的生产力受到资本主义私有制束缚，说明一定的生产关系能够阻碍生产力发展，C 正确。","distractors":"D 错误，科学技术是生产力中的重要因素，是推动经济和社会发展的强大杠杆，但不能把科学技术进步单独视为社会形态更替的决定性力量。社会形态更替归根到底是社会基本矛盾运动的结果，其中生产力的发展具有最终的决定意义。材料既说明理论力学的积极作用，又说明生产关系的制约，不能由前者推出科技进步决定社会形态更替。","extra":"（1）交往与世界历史【《手册》第25 页：考点3】①交往类型：物质交往和精神交往。②交往的作用：促进生产力的发展，促进社会关系的进步，促进文化的发展与传播，促进人的全面发展。③世界历史形成和发展的基础：生产方式的发展变革。④世界历史的基本特征：普遍交往。（2）生产关系对生产力的反作用【详见：第2 套，第19 题。手册第24 页】。（3）对于D 选项：【《手册》第26 页：社会形态更替的必然性】（4）科学技术：①科学技术是生产力中的重要因素，是推动社会文明进步的重要力量②科学技术对于生产发展的作用越来越大，日益成为生产发展的决定性因素③科学技术是先进生产力的集中体现和主要标志，是第一生产力④科技革命是推动经济和社会发展的强大杠杆。科学革命引起了生产方式、生活方式和思维方式的深刻变化和社会的巨大进步⑤科学技术有时表现为异己的、敌对的和统治的权力科学技术⑥正确认识和运用科学技术，首要的就是有合理的社会制度保障科学技术的正确运用【注意】①科技不能脱离人而独立存在、独立发挥作用②不能把科学技术进步单独视为社会形态更替的决定性力量③科技必须通过人来掌握和运用，才能转化为现实力量。离开人的实践活动，科技只是潜在的东西，自己不会自动起作用。所以科技不能离开人"},{"id":"苏一-3-20","source":"苏一六套卷 第3套","qno":20,"type":"多选","subject":"马原","stem":"随着大数据、云计算等技术广泛应用于生产过程，当代资本主义企业中从事数据采集、分析和管理的劳动日益增多。生产环节之间的协作更加紧密，企业也相应调整了生产管理方式，吸收职工参与生产决策。这表明","options":{"A":"数字技术的应用改变了人们的劳动形式","B":"职工参与生产决策改变了资本主义生产资料所有制的性质","C":"资本主义生产关系也要适应生产力发展要求而调整","D":"职工参与决策是资本主义企业协调劳资关系的一种形式"},"answer":"ACD","analysis":"科学技术革命和生产力的发展，是当代资本主义发生变化的根本推动力量。题干中数据采集、分析等工作增加，表明数字技术的应用改变了劳动形式。生产力决定生产关系，生产关系必须适应生产力发展的要求。企业针对生产协作的变化调整管理方式，体现生产关系要适应生产力发展的要求。职工参与决策是缓和劳资矛盾、协调劳资关系的一种形式。ACD 正确。","distractors":"B 错误，参与企业决策不等于取得生产资料所有权，资本主义所有制的性质（即生产资料私有制）没有因此改变，资本主义生产关系的根本性质也没有改变。","extra":"第二次世界大战后资本主义的变化（5 个表现） 【《手册》第47 页：考点4】变化 具体表现①国家资本所有制形成并发挥重要作用生产资料所有制的变化②法人资本所有制崛起并成为居主导地位的资本所有制形式（1）缓和劳资关系的三种激励制度：①职工参与决策，职工通过一定形式参与企业管理。职工参与决策、持有少量股劳资关系和分配关系的变 份，改变的是管理和利益分配的具体方式，资本主义雇佣劳动关系依然存在。化 ②终身雇佣，企业以较稳定的雇佣关系增强职工对企业的认同。③职工持股，职工持有本企业部分股份，分享部分收益。（2）建立并实施了普及化、全民化的社会福利制度，改善劳动者的生活状况①资本家的地位和作用已经发生很大变化。社会阶层和阶级结构 ②高级职业经理成为大公司经营活动的实际控制者。③知识型和服务型劳动者数量不断增加，劳动方式发生了新变化。（1）经济调节机制的变化：西方国家普遍走上强化市场调节、弱化政府干预的道路（2）经济危机呈现新的特点：经济调节机制和经济危机 ①去工业化和产业空心化日趋严重，产业竞争力下降形态的变化 ②经济高度金融化，虚拟经济与实体经济严重脱节③财政严重债务化，债务危机频繁爆发④两极分化和社会对立加剧，经济增长乏力，周期性危机与结构性危机交织在一起⑤金融危机频发，全球经济屡受打击①政治制度出现多元化的趋势，公民权利有所扩大政治制度②资本主义国家普遍加强了法治建设，以便协调社会各阶级、阶层的利益的变化③改良主义政党在政治舞台上的影响日益扩大"},{"id":"苏一-3-21","source":"苏一六套卷 第3套","qno":21,"type":"多选","subject":"马原","stem":"在垄断资本主义条件下，银行垄断资本和工业垄断资本相互融合，形成金融资本。在金融资本形成的基础上，产生了操纵国民经济命脉并在实际上控制国家政权的金融寡头。金融寡头在经济和政治上实行统治的主要方式有","options":{"A":"通过“参与制”实现对经济领域的统治","B":"通过人事参与实现银行垄断资本与工业垄断资本的融合","C":"通过同政府的“个人联合”实现对国家机器的控制","D":"通过资本参与加强银行垄断资本与工业垄断资本的联系"},"answer":"AC","analysis":"①金融寡头在经济领域中的统治主要是通过“参与制”实现的。所谓参与制，即金融寡头通过掌握一定数量的股票来层层控制企业的制度。②在政治上，金融寡头对国家机器的控制，主要是通过同政府的“个人联合”来实现的。这种联合有多种途径，如金融寡头直接把自己的代理人送进政府或议会，通过掌握政权，利用政治力量为其垄断统治服务；收买政府高官或国会议员，让他们在其政治活动中为金融寡头的利益服务；聘请曾在政府任职的高官到公司担任高级职务等。③金融寡头还通过建立政策咨询机构等方式对政府的政策施加影响，并通过掌握新闻出版、广播电视、科学教育、文化体育等上层建筑的各个领域，左右国家的内政外交及社会生活。AC 正确。","distractors":"B、D 选项，人事参与和资本参与是银行垄断资本与工业垄断资本相互融合、形成金融资本的重要方式，说明的是金融资本的形成，不是金融寡头实行经济和政治统治的主要方式。","extra":"金融资本与金融寡头【《手册》第44 页】（1）金融资本的形成。工业垄断资本和银行垄断资本融合在一起，形成金融资本。三条途径是①金融联系（如银行向工业企业提供信贷），②资本参与（如彼此参股），③人事参与（如董事相互兼任）。在金融资本形成的基础上，产生了金融寡头。（2）金融寡头的控制方式领域 方式经济上 参与制。金融寡头通过掌握一定数量的股票来层层控制企业的制度领域 方式同政府的个人联合。①把自己的代理人送进政府或议会。②收买政府高官或国会议员，使其政治上为金融寡头的利益服务。③聘请曾在政府任职的高官到公司担任高级职务通过建立政策咨询机构等方式对政府的政策施加影响，并通过掌握新闻出版、广播电视等领政策和社会生活域影响内政外交及社会生活。毛中特（5—6 单选；22 多选）"},{"id":"苏一-3-22","source":"苏一六套卷 第3套","qno":22,"type":"多选","subject":"毛中特","stem":"2026 年8 月17 日，习近平在纪念江泽民同志诞辰100 周年大会上指出，江泽民同志为捍卫中国特色社会主义伟大事业、开创全面改革开放新局面、实现人民生活总体小康、成功把中国特色社会主义推向二十一世纪作出了不可磨灭的贡献。从党的十三届四中全会到党的十六大，以江泽民同志为主要代表的中国共产党人推动党和国家事业取得的重要成就有","options":{"A":"实现香港、澳门顺利回归，打开外交工作崭新局面","B":"确立社会主义初级阶段的基本经济制度和分配制度","C":"实施依法治国基本方略，推进党的建设新的伟大工程","D":"确立社会主义市场经济体制的改革目标和基本框架，形成对外开放新格局"},"answer":"ABCD","analysis":"从党的十三届四中全会（1989 年）到党的十六大（2002 年），以江泽民同志为主要代表的中国共产党人推动党和国家事业取得了一系列重要成就。①中共十四大（1992年10 月），明确我国经济体制改革的目标是建立社会主义市场经济体制，要求更好地发挥计划和市场两种手段的长处。②党的十四届三中全会（1993 年11 月），通过了《中共中央关于建立社会主义市场经济体制若干问题的决定》，将党的十四大提出的社会主义市场经济体制改革的目标和基本原则具体化，进一步勾画了建立社会主义市场经济体制的基本框架。③香港于1997 年、澳门于1999 年顺利回归祖国，外交工作打开崭新局面。④党的十五大（1997 年）确立了社会主义初级阶段的基本经济制度和分配制度，即公有制为主体、多种所有制经济共同发展，按劳分配为主体、多种分配方式并存。十五大还提出实施依法治国基本方略，继续推进党的建设新的伟大工程。ABCD 正确。","distractors":"","extra":"（1）社会主义市场经济体制的建立与对外开放【《手册》第73 页、第216-217 页】①1992 年党的十四大：明确建立社会主义市场经济体制的改革目标。②1993 年十四届三中全会：进一步勾画社会主义市场经济体制的基本框架。③1997 年党的十五大：明确社会主义初级阶段的基本经济制度，强调坚持按劳分配为主体、多种分配方式并存，把依法治国确定为党领导人民治理国家的基本方略。④1997 年香港回归、1999 年澳门回归。（2）会议详细内容 【《手册》第216-217 页】党的十三大 ①系统阐述了社会主义初级阶段理论（1987 年） ②明确概括了党在社会主义初级阶段的基本路线①全会分析国内发生政治风波的性质和原因，初步总结了经验教训党的十三届四中全会 ②全会选举江泽民为中共中央委员会总书记（1989 年） （党的十三届四中全会以后，以江泽民同志为主要代表的中国共产党人形成了“三个代表”重要思想）①突破了计划经济和市场经济是制度属性的观念，从理论上深刻回答了长期困扰和束缚人们思想的许多重大问题南方谈话 ②标志着邓小平的社会主义市场经济理论的形成（1992 年1 月） ③为党的十四大明确把建立社会主义市场经济体制作为我国经济体制改革的目标奠定了理论基础④是把改革开放和现代化建设推向新阶段的又一个解放思想、实事求是的宣言书党的十四大会议确定了我国经济体制的改革目标是建立社会主义市场经济体制（1992 年10 月）通过了《中共中央关于建立社会主义市场经济体制若干问题的决定》，将党的十四党的十四届三中全会大提出的社会主义市场经济体制改革的目标和基本原则具体化，进一步勾画了建立（1993 年）社会主义市场经济体制的基本框架①正式提出“邓小平理论”这一概念，把邓小平理论确立为党的指导思想并写入党章②提出了党在社会主义初级阶段的基本纲领，阐明了建设有中国特色社会主义的经济、政治和文化的基本要求党的十五大 ③经济上，大会指出：公有制为主体、多种所有制经济共同发展，是我国社会主义（1997 年） 初级阶段的一项基本经济制度。要坚持按劳分配为主体、多种分配方式并存的制度，把按劳分配和按生产要素分配结合起来，坚持效率优先、兼顾公平④政治上，大会指出：依法治国，是党领导人民治理国家的基本方略，是发展社会主义市场经济的客观需要，是社会文明进步的重要标志，是国家长治久安的重要保障①大会对党的十三届四中全会以来13 年的奋斗历程和基本经验进行系统总结②大会提出了全面建设小康社会的奋斗目标党的十六大 ③把“三个代表”重要思想同马克思列宁主义、毛泽东思想、邓小平理论一道确立（2002 年） 为党必须长期坚持的指导思想，并写入党章（党的十六大以后，以胡锦涛同志为主要代表的中国共产党人形成了科学发展观。党的十六届一中全会选举胡锦涛为中央委员会总书记）（3）中国加入世界贸易组织25 周年（2001—2026 年）考点 速背世界贸易组织（WTO）于1995 年成立，前身是关税与贸易总协定。它为成员处理贸是什么组织 易关系提供共同的规则和谈判场所，主要职能包括管理贸易协定、组织贸易谈判、解决贸易争端、审议成员贸易政策。2001 年12 月11 日，中国正式加入世界贸易组织，成为第143 个成员。这是我国改中国何时加入革开放和社会主义现代化建设进程中的一个重要里程碑。①对外贸易。企业利用更稳定、可预期的贸易规则开拓国际市场，更深地参与国际分工。②国内改革。履行入世承诺推动法律法规和政策调整，提高透明度，激发市给中国带来什么场主体活力。③全球治理。中国参与多边贸易谈判和规则制定，并可运用争端解决机制维护自身合法权益。新思想（7—9 单选；23—26 多选）"},{"id":"苏一-3-23","source":"苏一六套卷 第3套","qno":23,"type":"多选","subject":"毛中特","stem":"推进国有经济布局优化和结构调整，是做强做优做大国有资本和国有企业的内在要求。“十五五”规划纲要提出，推动国有资本向关系国家安全、国民经济命脉的重要行业和关键领域等集中，加强战略性重组和专业化整合。上述部署的意义在于","options":{"A":"增强国有企业核心功能、提升核心竞争力","B":"推动国有资本在各行业均衡布局","C":"更好发挥国有经济战略支撑作用","D":"增强国有经济对国民经济命脉的控制力"},"answer":"ACD","analysis":"战略性重组和专业化整合有利于国有企业聚焦主责主业、集中优势资源，提高资源配置效率，增强核心功能、提升核心竞争力，A 正确。推动国有资本向重要行业和关键领域集中，有利于国有经济更好服务国家战略、保障国计民生，发挥战略支撑作用，C 正确。国有资本进一步向关系国家安全、国民经济命脉的重要行业和关键领域集中，有利于增强国有经济对国民经济命脉的控制力，D 正确。ACD 正确。","distractors":"B 错误，推进国有经济布局优化和结构调整，要坚持有进有退、有所为有所不为，围绕国家战略需要推动国有资本向重要行业和关键领域集中，而不是均衡布局。","extra":"两组容易混淆的所有制表述【《手册》第89 页】（1）公有制经济与非公有制经济。共同点是两者都是社会主义市场经济的重要组成部分，都是我国经济社会发展的重要基础。各类所有制经济依法平等使用生产要素、公平参与市场竞争、同等受到法律保护。比较 公有制经济 非公有制经济比较 公有制经济 非公有制经济个体经济、私营经济、港澳台投资经济、国有经济、集体经济，以及混合所有制范围 外商投资经济，以及混合所有制经济中的经济中的国有成分和集体成分。非国有成分和非集体成分。在所有制结构中居主体地位。就全国而 是社会主义市场经济的重要组成部分，在地位 言，公有资产在社会总资产中占优势， 稳定经济、扩大就业、促进创新等方面发国有经济控制国民经济命脉。 挥重要作用。方针 毫不动摇巩固和发展。 毫不动摇鼓励、支持、引导其发展。（2）国有经济与民营经济国有经济 民营经济在国民经济中发挥主导作用，主要体现在控制力上。 是非公有制经济的主要经济组织形式，是推进中国式国有企业是中国特色社会主义的重要物质基础和政治 现代化的生力军，是高质量发展的重要基础，是我国基础。 经济制度的内在要素。（3）国有资本布局的三个集中。①向关系国家安全、国民经济命脉的重要行业和关键领域集中。②向关系国计民生的公共服务、应急能力、公益性领域等集中。③向前瞻性战略性新兴产业集中。国有企业要增强核心功能、提升核心竞争力。"},{"id":"苏一-3-24","source":"苏一六套卷 第3套","qno":24,"type":"多选","subject":"毛中特","stem":"从新中国成立前夕各党派团体和各族各界人士共商建国大计，到2026 年全国两会期间政协委员围绕“十五五”规划纲要草案建言献策，人民政协履职的具体任务随时代而变化，始终不变的是","options":{"A":"坚持中国共产党对人民政协的全面领导","B":"聚焦党和国家中心任务履职尽责","C":"坚持团结和民主两大主题","D":"发挥国家权力机关的作用"},"answer":"ABC","analysis":"人民政协履职的具体任务随着党和国家事业的发展而变化，但坚持党的领导、围绕中心服务大局、坚持团结和民主两大主题，是贯穿履职实践的基本要求。①坚持中国共产党对人民政协的全面领导，保证人民政协事业发展的正确政治方向，A 正确。②党和国家在不同历史时期的中心任务有所不同，但人民政协始终围绕中心、服务大局，聚焦党和国家中心任务履职尽责，B 正确。③团结和民主是人民政协的两大主题，人民政协通过协商议政、凝聚共识，把各党派团体和各族各界人士的智慧和力量汇聚起来，C 正确。具体任务的变化，不等于这些基本要求发生改变。","distractors":"D 选项，人民政协是中国人民爱国统一战线的组织，是中国共产党领导的多党合作和政治协商的重要机构，是社会主义协商民主的重要渠道和专门协商机构，不是国家权力机关。我国的国家权力机关是全国人民代表大会和地方各级人民代表大会。","extra":"人民代表大会与人民政协【《手册》第97 页】比较 人民代表大会 人民政协全国人大和地方各级人大是人民行使国 爱国统一战线的组织，中国共产党领导的性质 家权力的机关。全国人大是最高国家权 多党合作和政治协商的重要机构，社会主力机关。 义协商民主的重要渠道和专门协商机构。人民代表大会制度是我国的根本政治制 中国共产党领导的多党合作和政治协商制对应制度度。 度是我国的一项基本政治制度。以全国人大为例，依法行使立法权、决 政治协商、民主监督、参政议政。团结和行使职权或履行职能定权、任免权、监督权。 民主是两大主题。人大代表审议政府工作报告，全国人大 政协委员讨论政府工作报告，提出意见建两会中的具体活动依法作出相应决议。 议，通过提案等形式建言献策。历史限定：1949 年人民政协第一届全体会议曾代行全国人民代表大会的职权。1954 年第一届全国人民代表大会召开后，人民政协继续作为统一战线组织发挥作用。（2026 年）全国政协十四届四次会议提出：①人民政协要立足自身性质定位和职责使命，坚持中国共产党的领导，加强理论武装，更好发挥人民政协的：政治组织作用、建言资政作用、凝心聚力作用②把服务和助力“十五五”规划实施作为履职主线"},{"id":"苏一-3-25","source":"苏一六套卷 第3套","qno":25,"type":"多选","subject":"毛中特","stem":"“十四五”时期，我国最终消费支出对经济增长的平均贡献率达到58.8%，比“十三五”时期提高10 个百分点。进入“十五五”，我国在扩大服务消费、升级商品消费的同时，把提升消费能力、优化消费环境、健全制度政策纳入扩大居民消费的长效机制。我国把扩大消费摆在更加突出的位置，有利于","options":{"A":"发挥消费在优化供给结构中的关键作用","B":"增强国内大循环内生动力和可靠性","C":"更好发挥消费对经济发展的基础性作用","D":"更好满足人民日益增长的美好生活需要"},"answer":"BCD","analysis":"扩大消费能够释放国内市场需求，促进供需良性互动，增强国内大循环内生动力和可靠性，B 正确。“十四五”时期最终消费支出对经济增长的平均贡献率达到58.8%，体现了消费对经济增长的拉动作用，把扩大消费摆在更加突出的位置，有利于更好发挥消费对经济发展的基础性作用，C 正确。扩大服务消费、升级商品消费，有利于让居民获得更多优质、多样的商品和服务，更好满足人民日益增长的美好生活需要，D 正确。BCD 正确。","distractors":"A 错误，对优化供给结构起关键作用的是投资。","extra":"扩大内需与新发展格局【《手册》第91 页】（1）消费与投资各起什么作用消费 投资增强消费对经济发展的基础性作用。提高居民消费能 发挥投资对优化供给结构的关键作用。把资金投向群力，改善消费条件，创新消费场景。 众需要、供给不足的领域，使供给更好适应需求。（2）坚持惠民生和促消费、投资于物和投资于人紧密结合。①投资于物，改善基础设施、设备等物质条件。②投资于人，把资金资源用于教育、医疗、就业培训等，既改善民生、增强消费能力，也提高劳动者素质和服务供给能力。两者都属于投资的着力方向，“投资于人”不能简单等同于“消费”。（3）国内大循环怎样畅通。构建新发展格局要以国内大循环为主体、国内国际双循环相互促进，关键在于经济循环的畅通无阻。以养老为例，老人需要康复服务，社区据此建设康复站、配置设备（投资于物），同时培训康复师（投资于人）。设备有人用、服务供得上，居民愿意就近消费，新的需求又带动服务机构扩大投资。这就是以新需求引领新供给，以新供给创造新需求。"},{"id":"苏一-3-26","source":"苏一六套卷 第3套","qno":26,"type":"多选","subject":"毛中特","stem":"从闽宁协作等实践起步，东西部协作已走过30 年。进入常态化帮扶阶段，东西部地区在产业上优势互补，在人员和技术上加强双向交流，协作领域不断拓展。常态化做好东西部协作工作，有利于","options":{"A":"推动东西部地区实现互利共赢、共同发展","B":"不断增强区域发展协调性","C":"扎实推进乡村全面振兴","D":"推动全体人民共同富裕迈出坚实步伐"},"answer":"ABCD","analysis":"习近平总书记指出，要完善东西部协作机制，推动产业互补、人员互动、技术互学，实现互利共赢、共同发展。题干中的产业优势互补和人员、技术双向交流，有利于东西部地区共享发展机遇，A 正确。常态化协作促进人才、技术等要素跨区域流动，帮助欠发达地区补齐发展短板，不断增强区域发展协调性，B 正确。产业帮扶和人才交流有利于培育乡村特色产业、增强乡村发展能力，扎实推进乡村全面振兴，C 正确。通过协作拓宽就业增收渠道、巩固拓展脱贫攻坚成果，有利于推动全体人民共同富裕迈出坚实步伐，D正确。ABCD 正确。","distractors":"","extra":"习近平总书记相关讲话①协作方式：推动东西部“产业互补、人员互动、技术互学、观念互通、作风互鉴”②发展要求：“发挥各地区比较优势，促进各类要素合理流动和高效集聚”；“实现互利共赢、共同发展”【《手册》第93 页】③常态化帮扶与共同富裕：各级党委和政府要认真落实常态化帮扶责任，坚决守牢不发生规模性返贫致贫底线，扎实推进乡村全面振兴，不断增强区域发展协调性，推动全体人民共同富裕迈出坚实步伐。常态化帮扶的对象与政策【详见：第2 套，第32 题】。史纲（10—13 单选；27—29 多选）"},{"id":"苏一-3-27","source":"苏一六套卷 第3套","qno":27,"type":"多选","subject":"史纲","stem":"中国早期马克思主义者的队伍中，李大钊、陈独秀属于先驱者和擎旗人，毛泽东等五四运动的左翼骨干则是其主体部分。1919 年9 月、11 月，李大钊发表《我的马克思主义观》一文，比较系统地介绍了马克思主义理论，在当时思想界产生重大影响，标志着马克思主义在中国进入比较系统的传播阶段。关于李大钊的历史贡献，下列选项说法正确的有","options":{"A":"李大钊率先在中国举起马克思主义旗帜","B":"发起组建北京大学马克思学说研究会","C":"领导建立上海共产主义小组，开展建党筹备","D":"李大钊在《新青年》上发表了《我的马克思主义观》"},"answer":"ABD","analysis":"①李大钊率先在中国举起马克思主义旗帜。1919 年，他在《新青年》发表《我的马克思主义观》，比较系统地介绍了马克思主义理论，在当时思想界产生重大影响，标志着马克思主义在中国进入比较系统的传播阶段。②1920 年3 月，李大钊在北京大学组织成立马克思学说研究会。这是中国最早学习和研究马克思主义的团体，也为建党作了重要准备。因此ABD 正确。","distractors":"C 选项，1920 年5 月，陈独秀发起组织马克思主义研究会，探讨社会主义学说和中国社会改造问题。8 月，共产党早期组织在上海《新青年》编辑部成立，陈独秀任书记。同年10 月，李大钊等在北京成立共产党早期组织。因此，该项混淆了陈独秀与李大钊的建党活动。","extra":"（1）李大钊与马克思主义早期传播 【《手册》第129 考点2；第130 页考点4】时间 事件及意义李大钊发表《法俄革命之比较观》《庶民的胜利》《Bolshevism 的胜利》等，宣传1918 年十月革命，率先在中国举起马克思主义旗帜。《新青年》分两期刊载《我的马克思主义观》，比较系统地介绍马克思主义理论。标1919 年9 月、11 月志着马克思主义在中国进入比较系统的传播阶段。李大钊在北京大学组织成立马克思学说研究会。这是中国最早学习和研究马克思主义1920 年3 月的团体，也为建党作了重要准备8 月，陈独秀等在上海建立共产党早期组织。10 月，李大钊等在北京建立共产党早期1920 年8 月、10 月组织。研究会以学习宣传理论为主，共产党早期组织则直接开展建党筹备。（2）中国早期马克思主义思想运动早期马克思主义者的队伍：早期队伍 ①新文化运动的精神领袖。如李大钊、陈独秀（先驱者和擎旗人）②五四爱国运动的左翼骨干。如毛泽东、周恩来（主体部分）③一部分原中国同盟会会员、辛亥革命时期的活动家。其代表为董必武等早期马克思主义思想运动的特点：①重视对马克思主义基本理论的学习，明确地同第二国际的社会民主主义划清界限。中国早期马克思主义思想运动一开始就坚持了马克思主义的革命原则和正确方特点 向②注意从中国的实际出发，学习、运用马克思主义。中国早期马克思主义者已在实际上初步形成了马克思主义应当与中国具体实际相结合的思想③开始提出知识分子应当同劳动群众相结合的思想"},{"id":"苏一-3-28","source":"苏一六套卷 第3套","qno":28,"type":"多选","subject":"史纲","stem":"毛泽东在中共七大预备会议上指出：“我们要向中央基准看齐，向大会基准看齐。看齐是原则，有偏差是实际生活，有了偏差，就喊看齐。”中共七大之所以能够成为“团结的大会，胜利的大会”，是因为在大会召开前，中国共产党","options":{"A":"通过延安整风运动端正了思想路线","B":"通过《关于若干历史问题的决议》，使全党对中国革命基本问题的认识达到一致","C":"制定了建立新民主主义国家的政治路线","D":"提出“两个务必”的重要思想，加强党的作风建设"},"answer":"AB","analysis":"题干限定的是中共七大召开前，党为大会的团结和胜利所作的准备，不能把七大本身或七大以后形成的成果选入。①1942 年2 月，毛泽东先后作了《整顿党的作风》和《反对党八股》的讲演，整风运动在全党范围普遍展开。在整风运动中，全党党员认真学习马克思主义著作和党的整风运动文献，开展批评与自我批评，端正了思想路线。②1944年5 月21 日至1945 年4 月20 日，中共扩大的六届七中全会在延安召开。会议原则通过了《关于若干历史问题的决议》，对建党以后特别是党的六届四中全会至遵义会议前这一段党的历史及其经验教训进行了总结，对党的若干重大历史问题作出结论。《决议》使全党特别是党的高级干部对中国革命基本问题的认识达到了一致，增强了全党团结，为党的七大胜利召开创造了充分条件，有力促进了中国革命事业发展。至此，整风运动胜利结束。AB 正确。","distractors":"C 选项，中共七大制定了党的政治路线，题干要求大会召开前已经完成的准备。D 选项，“两个务必”是毛泽东在1949 年党的七届二中全会上提出的，不是中共七大召开前的内容。","extra":"从六届六中全会到七届二中全会六届六中全会 抗战进入新阶段，党内在如何坚持统一战线中的独立自主等问题上存在分歧。毛泽（1938 年9—11 月，延 东作《论新阶段》的政治报告，明确提出马克思主义的中国化命题。全会基本纠正安） 了王明的右倾错误，进一步巩固了毛泽东在全党的领导地位。【《手册》第141 页】①背景。延安整风已经展开，全党需要总结历史上的经验教训，特别是对六届四中全会至遵义会议前的路线问题形成一致认识，为召开七大作准备。六届七中全会 ②重点。1945 年4 月20 日，扩大的六届七中全会原则通过《关于若干历史问题的（1944 年5 月—1945 年4 决议》。这是党的第一个历史决议。月，延安） ③意义。使全党特别是党的高级干部对中国革命基本问题的认识达到了一致，增强了全党团结，为党的七大胜利召开创造了充分条件。标志着整风运动胜利结束。【《手册》第142 页】①背景。抗日战争胜利在望，中国面临两种前途、两种命运的抉择。延安整风和第一个历史决议为七大奠定了思想基础。②报告和路线。毛泽东作《论联合政府》的政治报告。大会制定党的政治路线，强调放手发动群众、壮大人民力量，在党的领导下打败日本侵略者、解放全国人民、中共七大 建立一个新民主主义的中国；制定新民主主义国家在政治、经济、文化方面的纲（1945 年4 月23 日—6 领。月11 日，延安） ③作风和党章。概括理论和实践相结合、和人民群众紧密联系、自我批评三大作风。刘少奇作《关于修改党章的报告》。大会把毛泽东思想确立为党的指导思想并写入党章，这是七大的历史性贡献。④意义。标志着党在政治上思想上组织上走向成熟。七大以“团结的大会，胜利的大会”载入党的史册。【《手册》第142—143 页】①背景。三大战役取得胜利，夺取全国胜利、由革命战争转向建设新中国的任务提到全党面前。②工作重心。提出迅速夺取全国胜利的方针，提出党的工作重心必须由乡村转移到城市。3 月25 日，中共中央进驻北平香山，标志着中国革命重心从农村转向城市。七届二中全会③政策和方向。规定全国胜利后党在政治、经济、外交方面应当采取的基本政策，（1949 年3 月，河北西柏指出中国由农业国转变为工业国、由新民主主义社会转变为社会主义社会的发展方坡）向。④“两个务必”。务必使同志们继续地保持谦虚、谨慎、不骄、不躁的作风，务必使同志们继续地保持艰苦奋斗的作风。全会为党夺取全国胜利和建设新中国作了政治上、思想上的准备。【《手册》第148 页】"},{"id":"苏一-3-29","source":"苏一六套卷 第3套","qno":29,"type":"多选","subject":"史纲","stem":"1978 年，安徽凤阳小岗村农民尝试包干到户，实行“保证国家的，留足集体的，剩下都是自己的”的办法，取得明显成效。在党中央的支持和推动下，以包产到户、包干到户为主要形式的家庭联产承包责任制逐步推广，农村面貌发生深刻变化。这项改革","options":{"A":"属于社会主义集体经济的生产责任制","B":"通过改变农村土地的集体所有制调动农民积极性","C":"突破了经营管理过于集中和分配中的平均主义等弊端","D":"为以扩大企业自主权为主要内容的城市经济体制改革提供了经验"},"answer":"ACD","analysis":"①1982 年，中共中央发出“一号文件”，指出包产到户、包干到户等各种责任制，都是社会主义集体经济的生产责任制。在中央的支持和推动下，以包产到户、包干到户为主要形式的家庭联产承包责任制迅速推广开来。②党的十一届三中全会前，我国农村存在经营管理过于集中和分配中的平均主义等弊端，严重挫伤了农民的生产积极性，农业发展和农民生活改善比较缓慢。题干中的“保证国家的，留足集体的，剩下都是自己的”，把农民的生产成果与其自身收益联系起来，有利于克服分配中的平均主义。包产到户、包干到户则突破了经营管理过于集中的弊端，调动了农民的生产积极性。③在借鉴农村改革经验的基础上，以扩大企业自主权为主要内容的城市经济体制改革逐步在全国推开。ACD正确。","distractors":"B 选项，家庭联产承包责任制改变的是农村土地的经营方式，没有改变土地的集体所有制性质。改革只是实现所有权和经营权分离，没有改变农村土地集体所有制，土地依旧归集体所有，不是私有。","extra":"（1）家庭承包经营与城乡改革的推进【《手册》第154—155 页】①所有制：坚持农村土地集体所有。②经营和分配：以包产到户、包干到户为主要形式，克服经营管理过于集中和分配上的平均主义。③改革进程：农村先行。1984 年十二届三中全会召开，会后，经济体制改革以城市为重点全面展开。（2）1956 年至今的土地政策【《手册》第212-213 页】①实行人民公社体制（“三级所有、队为基础”和“政社合一”）社会主义建设初步探索②土地、生产资料归公社统一调配，经营管理高度集中农村改革开放：（1）家庭联产承包责任制①安徽凤阳小岗村首创家庭联产承包责任制，开启了全国农村改革的先河②1982 年，中共中央发出“一号文件”，指出包产到户、包干到户等各种责任制，都是社会主义集体经济的生产责任制（“一号文件”是中国共产党历史上第一个关于农村工作的文件）③在中央的支持和推动下，以包产到户、包干到户为主要形式的家庭联产承包责任制迅速推广开来。家庭联产承包责任制的实质：在坚持土地集体所有的前提下，把改革开放后土地承包给农户，实现土地所有权和经营权分离，打破人民公社体制下单一集体统一经营的传统模式（2）三权分置①是指实行所有权、承包权、经营权分置并行②是农村基本经营制度的自我完善，是继家庭联产承包责任制后农村改革又一重大制度创新③农村基本经营制度是乡村振兴的制度基础。新形势下深化农村改革，主线仍然是处理好农民和土地的关系。坚持党的农村政策，首要的就是坚持农村基本经营制度思法（14 单选；30—31 多选）"},{"id":"苏一-3-30","source":"苏一六套卷 第3套","qno":30,"type":"多选","subject":"思修","stem":"从社区里的助老扶幼到应急救援中的互帮互助，志愿者用实际行动帮助他人，也带动更多人参与公共生活。志愿服务","options":{"A":"是培育和弘扬社会主义核心价值观的重要载体","B":"以奉献、友爱、互助、进步为基本精神","C":"以互助精神为志愿服务精神的精髓","D":"为大学生参与社会实践、成长成才提供了重要舞台"},"answer":"ABD","analysis":"志愿服务精神包括奉献、友爱、互助、进步。参与志愿服务既有助于培育和弘扬社会主义核心价值观，也为大学生成长成才提供实践机会。ABD 正确。","distractors":"C 错误，互助是志愿服务精神的内容之一，奉献精神才是其精髓。","extra":"志愿服务的精神与实践意义【《手册》第168 页】①精神：奉献、友爱、互助、进步。②精髓：奉献精神。③对社会：是培育和弘扬社会主义核心价值观的重要载体。④对个人：为大学生参与社会实践、成长成才提供了重要舞台。社会价值和自我价值的关系【详见：第2 套，第30题】。"},{"id":"苏一-3-31","source":"苏一六套卷 第3套","qno":31,"type":"多选","subject":"思修","stem":"我国立法坚持党的领导，坚持人民主体地位，深入了解民情、反映民意、集中民智，努力使每一项立法都符合宪法精神、反映人民意愿。我国社会主义法律","options":{"A":"具有科学性和先进性","B":"体现了党的主张和人民意志的统一","C":"主要反映不同社会群体的具体利益","D":"是中国特色社会主义建设的重要保障"},"answer":"ABD","analysis":"我国社会主义法律体现了党的主张和人民意志的统一。它具有科学性和先进性，是中国特色社会主义建设的重要保障。ABD 正确。","distractors":"C 错误，我国社会主义法律反映的是“全体人民的共同利益”，而不是不同社会群体的具体利益。","extra":"我国社会主义法律的本质特征【《手册》第169 页】①意志：体现了党的主张和人民意志的统一。②性质：具有科学性和先进性。立法要尊重客观规律，反映人民意愿。③作用：是中国特色社会主义建设的重要保障。国内时政（15 单选；32 多选）"},{"id":"苏一-3-32","source":"苏一六套卷 第3套","qno":32,"type":"多选","subject":"时政","stem":"2026 年7 月8 日，习近平总书记在国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会上指出，人工智能、量子科技、生命科学等领域重大原创成果不断涌现，嫦娥六号实现人类首次月球背面采样返回，创新药物实现从模仿、跟进开发到首创的跨越。同时，我国科技发展中还存在一些领域原始创新能力不足等问题。这充分表明","options":{"A":"我国正从全球科技参与者、贡献者向开拓者、引领者加速转变","B":"我国科技强国建设关键攻坚期的任务圆满完成","C":"我国成为创新力上升最快的国家之一","D":"我国必须加快推进高水平科技自立自强"},"answer":"ACD","analysis":"习近平总书记在讲话中指出，我国正从全球科技参与者、贡献者向开拓者、引领者加速转变，成为创新力上升最快的国家之一，AC 正确。同时，一些领域原始创新能力仍有不足，需要进一步提升自主创新能力，加快推进高水平科技自立自强，D 正确。ACD正确。","distractors":"B 错误，讲话明确指出，“‘十五五’时期是科技强国建设的关键攻坚期”，因此关键攻坚期的任务尚未完成。","extra":"科技强国建设的现状、阶段和目标时间 对应判断当前 ①我国正从全球科技参与者、贡献者向开拓者、引领者加速转变，成为创新力上升最（2026 年7 月8 日大 快的国家之一。②重大原创成果不断涌现，部分领域原始创新能力不足，仍须加快推会对形势的判断） 进高水平科技自立自强。“十五五”时期科技强国建设的关键攻坚期。“攻坚”说明这一时期要集中力量突破难题。（2026—2030 年）到2035 年 建成科技强国。科技强国建设有明确的目标年份；“加速转变”描述的是当前进程。国际时政（16 单选；33 多选）"},{"id":"苏一-3-33","source":"苏一六套卷 第3套","qno":33,"type":"多选","subject":"时政","stem":"2026 年9 月1 日上午，国家主席习近平在比什凯克出席上海合作组织成员国元首理事会第二十六次会议。习近平指出，25 年后的今天，世界百年变局加速演进，对话和对抗、共赢和零和、多边和单边激烈博弈，战争阴霾并未远去。站在关乎人类前途命运的十字路口，上海合作组织应该勇担历史责任，主动引领历史航向。习近平就此提出的主张包括","options":{"A":"坚持发展优先，开创共同繁荣的前景","B":"坚持安全为要，营造普遍安全的环境","C":"坚持以人为本，厚植世代友好的根基","D":"坚持对话协商，完善公平有序的治理"},"answer":"ABCD","analysis":"习近平主席在上海合作组织成员国元首理事会第二十六次会议上指出，上海合作组织应该勇担历史责任，主动引领历史航向，并提出四点主张：第一，坚持发展优先，开创共同繁荣的前景；第二，坚持安全为要，营造普遍安全的环境；第三，坚持以人为本，厚植世代友好的根基；第四，坚持对话协商，完善公平有序的治理。ABCD 正确。","distractors":"","extra":"习近平主席在讲话中总结上海合作组织的发展历程（1）最重大的发展成就是一步步成为世界上幅员最广、人口最多、发展潜力巨大的新型区域合作组织；（2）最宝贵的精神财富是开创性提出和始终遵循互信、互利、平等、协商、尊重多样文明、谋求共同发展的“上海精神”；（3）最重要的合作经验是找到不结盟、不对抗、不针对第三方的正确共处之道，推动地区国家携手建设共同家园"},{"id":"苏一-4-1","source":"苏一六套卷 第4套","qno":1,"type":"单选","subject":"马原","stem":"习近平总书记在加强基础研究座谈会上强调，要坚持“四个面向”战略导向，明确基础研究的主攻方向和重点领域。面向世界科技前沿、面向经济主战场、面向国家重大需求、面向人民生命健康，为科学研究确立了重要方向。这表明","options":{"A":"科学理论能够指导实践活动","B":"实践为认识的发展提供必要的工具和手段","C":"实践的需要推动科学发现和理论创新","D":"认识的真理性需要通过实践加以检验"},"answer":"C","analysis":"实践是认识发展的动力，实践的需要推动认识的产生和发展，推动科学发现、技术发明以及思想进步和理论创新。社会实践不断提出新的问题和任务，要求人们探索并形成新的认识。题干中的“四个面向”把经济建设、国家发展、人民生命健康等方面的需要作为确立基础研究方向的重要依据，体现了实践需要为科学研究提出任务、指明方向，推动科学发现和理论创新。C 正确。","distractors":"A 选项，认识对实践具有反作用，科学理论能够指导实践，促进实践的发展。该项强调从认识到实践的作用，材料强调的是实践需要推动科学研究，与题意不相符合。B 选项，实践的发展能够提供新的工具和手段，帮助人们突破认识条件的限制，深化对客观世界的认识。材料没有说明研究仪器、技术手段等条件的提供，而是说明研究任务和方向的确立，与题意不相符合。D 选项，实践是检验认识真理性的唯一标准，认识是否符合客观实际要通过实践检验。材料没有呈现对已有认识进行检验的过程，与题意不相符合。","extra":"实践对认识的决定作用 【《手册》第15 页】（1）实践决定认识的四个方面实践 认识人类能动地改造世界的社会性的含义 主体在实践基础上对客体的能动反映物质活动①认识的内容是在实践活动的基础上产生和发展的②直接经验：一切真知都是从直接经验发源的实践是认识的来源③间接经验：一个人的多数知识还是来自间接经验，是从书本和传授中得来的（间接经验归根到底也来自实践，来自别人的实践）①实践的需要推动认识的产生和发展，推动人类的科学发现和技术发明，推决定作实践是认识发展的 动人类的思想进步和理论创新用的表动力 ②实践为认识的发展提供了手段和条件（比如，人可以制造和使用工具日益 现深化对客观世界的认识）实践是认识的目的 认识的最终目的是为实践服务，指导实践，以满足人们生活和生产的需要实践是检验认识真认识是否具有真理性，既不能从认识本身得到证实，也不能从认识对象中得理性的唯一标准【详到回答，只有在实践中才能得到验证见：第1 套，第18 题】"},{"id":"苏一-4-2","source":"苏一六套卷 第4套","qno":2,"type":"单选","subject":"马原","stem":"恩格斯指出：“在历史上出现的一切社会关系和国家关系，一切宗教制度和法律制度，一切理论观点，只有理解了每一个与之相应的时代的物质生活条件，并且从这些物质条件中被引申出来的时候，才能理解。”这一论断表明① 社会意识依赖于社会物质生活条件② 任何社会意识都具有相对独立性③ 社会政治法律制度受生产方式制约④ 意识形态对经济基础具有反作用","options":{"A":"①②","B":"③④","C":"①③","D":"②③"},"answer":"C","analysis":"社会存在决定社会意识，社会意识是社会存在的反映，社会物质生活条件是社会意识内容的客观来源。恩格斯要求从相应时代的物质生活条件出发理解理论观点和宗教制度，说明这些精神现象依赖于社会物质生活条件，①正确。物质生产方式是社会存在和发展的基础及决定力量，制约着经济生活、政治生活和精神生活等全部社会生活。理解国家关系和法律制度，同样需要从相应时代的物质生活条件及其生产方式出发，说明社会政治法律制度受生产方式制约，③正确。因此，C 正确。","distractors":"②选项，社会意识在从根本上受到社会存在决定的同时，具有自身特有的发展形式和发展规律，表现为不完全同步性、历史继承性以及能动的反作用等。引文强调社会意识对物质生活条件的依赖，没有说明这种相对独立性，与题意不相符合。④选项，意识形态属于观念上层建筑，能够通过人的实践活动对经济基础产生反作用。引文要求从物质条件理解思想和制度，没有说明意识形态如何反作用于经济基础，与题意不相符合。","extra":"社会存在与社会意识的辩证关系【《手册》第22—24 页】有关系 社会存在决定社会意识，社会意识是社会存在的反映：（决定、 ①社会存在是社会意识内容的客观来源。社会意识是社会物质生活过程及其条件的主观反映反映） （社会意识根源于社会存在）②社会意识是人们进行社会物质交往的产物③随着社会存在的发展，社会意识也相应地或迟或早地变化和发展，但不管怎样变化和发展，其根源总是深藏于经济事实当中社会意识既依赖于社会存在，又有其相对独立性。社会意识的相对独立性是指，社会意识在从有区别 根本上受到社会存在决定的同时，还具有自身特有的发展形式和发展规律。主要表现：（相对 ①社会意识与社会存在发展具有不完全同步性和不平衡性独立性） ②社会意识内部各种形式之间存在相互影响且各自具有历史继承性③社会意识对社会存在具有能动的反作用，这是社会意识相对独立性的突出表现政治法律思想属于观念上层建筑，政治法律制度属于政治上层建筑。经济基础与上层建筑的关系【详见：第2 套，第19 题】。"},{"id":"苏一-4-3","source":"苏一六套卷 第4套","qno":3,"type":"单选","subject":"马原","stem":"马克思在分析商品经济时指出：“独立的手工业者耗费自己的劳动生产商品，但其劳动是否被社会承认，取决于商品能否顺利售出。”这表明，商品的使用价值和价值的矛盾、生产商品的具体劳动和抽象劳动的矛盾，根源于","options":{"A":"商品与货币的矛盾","B":"私人劳动和社会劳动的矛盾","C":"简单劳动和复杂劳动的矛盾","D":"剩余劳动和必要劳动的矛盾"},"answer":"B","analysis":"私人劳动和社会劳动的矛盾构成私有制商品经济的基本矛盾，贯穿商品经济发展过程的始终，决定着商品经济的各种内在矛盾及其发展趋势。独立手工业者生产商品的劳动具有私人性质，但其产品是为了满足社会需要，其劳动又具有社会性质。私人劳动能否转化为社会劳动，只有通过商品交换才能实现。交换是解决私人劳动和社会劳动之间矛盾的唯一途径。商品“跳跃成功”是指能把商品顺利卖出去，将商品换成货币，让私人劳动被社会承认，变成社会劳动；商品“跳跃失败”的后果是商品卖不出去，生产者的劳动白干了，私人劳动无法得到社会认可，商品占有者就会遭受损失。因此，商品的使用价值和价值的矛盾、生产商品的具体劳动和抽象劳动的矛盾，都根源于私人劳动和社会劳动的矛盾。B 正确。【拓展】在商品交换过程中，生产商品使用价值的具体劳动是不能直接进行量的比较的，只有将具体劳动还原为抽象劳动，也就是从具体劳动中抽象出无差别的一般人类劳动，才能进行量的比较。而具体劳动能否还原为抽象劳动，在根本上取决于私人劳动和社会劳动能否实现统一。如果私人劳动生产的产品为社会所接受，则这种私人劳动就会被承认并转化为社会劳动，它作为具体劳动的有用性质就会为社会所承认，因而可以还原为抽象劳动，这意味着商品的价值得到了实现，商品的使用价值和价值之间的矛盾也得到了解决。这说明，私人劳动和社会劳动的矛盾是商品经济其他一切矛盾的基础。","distractors":"","extra":"（1）为什么“私人劳动和社会劳动的矛盾”是商品经济的基本矛盾？【《手册》第34 页】独立手工业者生产商品的劳动具有私人性质，但其产品是为了满足社会需要，其劳动又具有私人劳动如何 社会性质。私人劳动能否转化为社会劳动，只有通过商品交换才能实现。交换是解决私人劳转化为社会劳 动和社会劳动之间矛盾的唯一途径。①商品“跳跃成功”是指能把商品顺利卖出去，将商品动 换成货币，让私人劳动被社会承认，变成社会劳动。②商品“跳跃失败”的后果是商品卖不出去，生产者的劳动白干了，私人劳动无法得到社会认可，商品占有者就会遭受损失。具体劳动如何 在商品交换过程中，生产商品使用价值的具体劳动是不能直接进行量的比较的，只有将具体还原为抽象劳 劳动还原为抽象劳动，也就是从具体劳动中抽象出无差别的一般人类劳动，才能进行量的比动 较。而具体劳动能否还原为抽象劳动，在根本上取决于私人劳动和社会劳动能否实现统一。如果私人劳动生产的产品为社会所接受，则这种私人劳动就会被承认并转化为社会劳动，它价值和使用价作为具体劳动的有用性质就会为社会所承认，因而可以还原为抽象劳动，这意味着商品的价值的矛盾值得到了实现，商品的使用价值和价值之间的矛盾也得到了解决。商品的使用价值和价值的矛盾、生产商品的具体劳动和抽象劳动的矛盾，根源于私人劳动和结论社会劳动的矛盾。私人劳动和社会劳动的矛盾是商品经济的基本矛盾。（2）同一劳动、同一商品的两面 【《手册》第30—34 页】从哪里看 成对的概念 联系生产者独立决定生产什么，产品却要满足别人的需要。交换使私人劳动的社会性质 私人劳动、社会劳动劳动得到社会承认。具体劳动创造使用价值，抽象劳动形成商品价值。这是同一劳动的两个方面。①具体劳动：转移生产资料的价值（即不变资本）生产商品的劳动 具体劳动、抽象劳动②抽象劳动：创造/再生产劳动力自身价值（即可变资本）和剩余价值（劳动的二重性和不变资本/可变资本有关联，可以放在一起理解）从哪里看 成对的概念 联系使用价值是价值的物质承担者。产品要对别人有用，生产者才有可劳动的产品 使用价值、价值能通过交换实现其价值。（3）XX 的矛盾私有制基础上，商品经济的基本矛盾 私人劳动和社会劳动的矛盾生产社会化和生产资料资本主义私人占有之间的矛盾资本主义的基本矛盾【《手册》第42 页考点12】社会基本矛盾（所有社会形态） 生产力和生产关系、经济基础和上层建筑的矛盾"},{"id":"苏一-4-4","source":"苏一六套卷 第4套","qno":4,"type":"单选","subject":"马原","stem":"列宁指出：“改造小农，改造他们的整个心理和习惯，这件事需要花几代人的时间。”经济文化相对落后的国家在取得社会主义革命胜利后，仍需改造小农经济，建立、巩固和完善社会主义公有制，并发展社会主义民主政治、加强执政党建设。这些任务的艰巨性说明，社会主义建设的长期性受到","options":{"A":"生产力发展状况的制约","B":"经济基础和上层建筑发展状况的制约","C":"国际环境的严峻挑战","D":"马克思主义执政党对社会主义建设规律认识程度的制约"},"answer":"B","analysis":"建立、巩固和完善社会主义公有制，属于经济基础建设的任务；发展社会主义民主政治、健全社会主义法制、加强执政党建设，属于上层建筑建设的任务。这些任务都需要长期努力，说明社会主义建设的长期性受到经济基础和上层建筑发展状况的制约，B 正确。","distractors":"A 侧重生产力发展水平，C 侧重外部环境，均不是材料着重说明的内容。D 强调对社会主义建设规律的认识程度，题干中的“加强执政党建设”并不等同于对建设规律的认识，不能据此选择D。","extra":"（1）社会主义建设具有长期性。取得政权后，仍须逐步发展生产力、创造社会主义的物质基础。建设长期性的原因【详见：第3 套，第4 题】。（2）社会主义发展道路多样性的原因【详见：第2 套，第4 题】"},{"id":"苏一-4-5","source":"苏一六套卷 第4套","qno":5,"type":"单选","subject":"毛中特","stem":"社会主义改造基本完成后，如何认识和处理社会主义社会的矛盾，成为中国共产党面临的重要课题。1957 年，毛泽东发表《关于正确处理人民内部矛盾的问题》，系统阐述了社会主义社会矛盾的学说，其中提出的重要思想有①把正确处理人民内部矛盾作为国家政治生活的主题②人民内部矛盾是我国社会的主要矛盾③社会主义社会的矛盾可以通过社会主义制度本身得到解决④确立了调动一切积极因素为社会主义事业服务的基本方针","options":{"A":"①②","B":"①③","C":"②③","D":"③④"},"answer":"B","analysis":"①毛泽东强调，关于正确处理人民内部矛盾的问题是社会主义国家政治生活的主题。这一论断的根本着眼点，在于调动一切积极因素，团结一切可以团结的力量，把全党的注意力转到社会主义建设上来，①正确。②社会主义社会的基本矛盾是在生产关系和生产力基本适应、上层建筑和经济基础基本适应条件下的矛盾，是在人民根本利益一致基础上的矛盾。因此，它不是对抗性的矛盾，而是非对抗性的矛盾。社会主义社会的基本矛盾具有非对抗性，可以通过社会主义制度本身不断得到解决。因此①③正确，选B。","distractors":"对于②，“人民内部矛盾”是按矛盾性质划分的类别，不能直接替代社会主要矛盾的具体内容。党的八大指出，国内主要矛盾是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾。对于④，调动一切积极因素为社会主义事业服务的基本方针，是1956 年《论十大关系》确定的，不是本题所指1957 年这篇报告确立的。","extra":"（1）社会主义社会的基本矛盾与两类不同性质的矛盾【《手册》第66—67 页】党在八大前后，特别是毛泽东在1957 年2 月所作的《关于正确处理人民内部矛盾的问题》的报告，提出系统论述了社会主义社会矛盾的理论。矛盾是普遍存在的，社会主义社会同样充满着矛盾①社会主义社会的基本矛盾：生产关系和生产力之间的矛盾，上层建筑和经济基础之间的矛盾基本矛盾 ②特点是又相适应又相矛盾，相适应的一面是基本方面。它们是非对抗性的矛盾，可以经过社会主义制度本身的自我调整和完善，不断地得到解决。两类不同性 敌我矛盾侧重分清敌我，用专政的方法解决；人民内部矛盾侧重分清是非，用民主的方法解决。质的矛盾 1957 年提出，正确处理人民内部矛盾是社会主义国家政治生活的主题。①政治思想领域：团结—批评—团结；②物质利益、分配方面：统筹兼顾、适当安排；人民内部矛③人民群众和政府机关：坚持民主集中制，克服官僚主义，加强思想教育；盾的处理方④科学文化领域：百花齐放、百家争鸣针⑤共产党和民主党派：长期共存、互相监督；⑥民族之间：民族平等、团结互助。（2）1956 年《论十大关系》的基本方针【详见：第1 套，第22 题】【《手册》第66 页】（3）1956 年9 月，党的八大提出，国内主要矛盾：已经是人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾"},{"id":"苏一-4-6","source":"苏一六套卷 第4套","qno":6,"type":"单选","subject":"毛中特","stem":"新世纪以来，我国经济和社会发展呈现出一系列新的阶段性特征，但是，这些新的阶段性特征的出现并没有改变我国仍处于社会主义初级阶段这一基本事实。这表明，社会主义初级阶段是","options":{"A":"科学社会主义基本原则与时代精神相结合的过程","B":"长期性与阶段性统一的动态发展过程","C":"先进社会制度与落后社会生产的矛盾运动过程","D":"社会性质与发展程度的有机统一过程"},"answer":"B","analysis":"社会主义初级阶段是一个相当长的历史阶段，但长期性不等于一成不变，初级阶段自身在其发展过程中又呈现出不同的阶段性特征。新世纪以来我国经济社会发展出现一系列新的阶段性特征，但我国仍处于社会主义初级阶段这一基本事实没有改变，正说明社会主义初级阶段是长期性与阶段性统一的动态发展过程。B 正确。","distractors":"A 选项，题干没有讨论科学社会主义基本原则与时代精神的结合。C 选项，侧重社会制度与社会生产之间的关系，不能解释题干中“阶段性特征变化”与“基本事实不变”的关系。D 选项，社会性质与发展程度的统一，说明我国已经是社会主义社会、但仍处于初级阶段；但题干重点考查的则是初级阶段发展过程中的长期性与阶段性。","extra":"（1）社会主义初级阶段的两层含义【《手册》第70 页：考点3】判断 分别回答什么我国社会已经是社会主义社会 社会性质。必须坚持社会主义而不能离开社会主义。我国的社会主义社会还处在初级阶段 发展程度。必须从这个实际出发，不能超越这个阶段。（2）社会主义初级阶段是长期性与阶段性统一的动态发展过程。1987 年党的十三大系统阐述社会主义初级阶段理论，明确概括党在社会主义初级阶段的基本路线。【详见：第3 套，第6 题】（3）基本国情与政策依据。①邓小平第一次把社会主义初级阶段作为事关全局的基本国情加以把握。②社会主义初级阶段是制定路线方针政策的出发点和根本依据。观察一个时期的新任务，要看阶段性特征；判断制定路线方针政策的根本依据，要看基本国情。"},{"id":"苏一-4-7","source":"苏一六套卷 第4套","qno":7,"type":"单选","subject":"毛中特","stem":"沿着古代丝绸之路，中国的丝绸、瓷器和造纸术、印刷术等传向世界，域外的天文、历法、医药、乐舞等知识技艺也逐渐传入中国。明末，徐光启主张“欲求超胜，必须会通”，与利玛窦合译《几何原本》，吸收借鉴西方数学知识。这些实践主要体现了中华文明具有突出的","options":{"A":"连续性","B":"创新性","C":"统一性","D":"包容性"},"answer":"D","analysis":"中华文明具有突出的包容性，在同其他文明的交流互鉴中兼收并蓄、博采众长。题干中，古代丝绸之路推动中外知识技艺双向传播，徐光启与利玛窦合译《几何原本》、吸收借鉴西方数学知识，都体现了中华文明以开放胸怀吸收外来文明有益成果的包容性。D 正确。","distractors":"A 选项强调中华文明绵延不断，B 选项强调中华文明革故鼎新，C 选项强调中华文明多元一体、团结凝聚。题干侧重中外交流互鉴和吸收外来文明有益成果，ABC 均不符合题意。","extra":"中华文明的五个突出特性【《手册》第102 页】特性 决定了什么连续性 从根本上决定了中华民族必然走自己的路①从根本上决定了中华民族守正不守旧、尊古不复古的进取精神创新性②决定了中华民族不惧新挑战、勇于接受新事物的无畏品格①从根本上决定了中华民族各民族文化融为一体、即使遭遇重大挫折也牢固凝聚②决定了国土不可分、国家不可乱、民族不可散、文明不可断的共同信念统一性③决定了国家统一永远是中国核心利益的核心④决定了一个坚强统一的国家是各族人民的命运所系①从根本上决定了中华民族交往交流交融的历史取向包容性 ②决定了中国各宗教信仰多元并存的和谐格局③决定了中华文化对世界文明兼收并蓄的开放胸怀①从根本上决定了中国始终是世界和平的建设者、全球发展的贡献者、国际秩序的维护者和平性 ②决定了中国不断追求文明交流互鉴而不搞文化霸权③决定了中国不会把自己的价值观念与政治体制强加于人④决定了中国坚持合作、不搞对抗，决不搞“党同伐异”的小圈子（助记：传得久是连续，能出新是创新，多民族一体是统一，吸收外来成果是包容，平等交流是和平）辨析：包容性和和平性都可能出现“文明交流”，强调吸收外来文明成果，看包容性；强调平等相处、不搞文化霸权，看和平性。"},{"id":"苏一-4-8","source":"苏一六套卷 第4套","qno":8,"type":"单选","subject":"毛中特","stem":"共同富裕是中国特色社会主义的本质要求。扎实推进共同富裕，既要通过高质量发展把社会财富的“蛋糕”做大，也要通过合理的制度安排把“蛋糕”分好。促进共同富裕的基础性制度是","options":{"A":"社会保障制度","B":"分配制度","C":"基本公共服务制度","D":"社会救助制度"},"answer":"B","analysis":"题干中，把“蛋糕”做大，是通过高质量发展创造更多社会财富，为共同富裕奠定物质基础。把“蛋糕”分好，是通过合理的分配制度安排，让发展成果更多更公平惠及全体人民。党的二十大报告指出：“分配制度是促进共同富裕的基础性制度。”为此，要坚持按劳分配为主体、多种分配方式并存，构建初次分配、再分配、第三次分配协调配套的制度体系。B 正确，ACD 不符合题意。","distractors":"","extra":"共同富裕与分配制度【《手册》第89、103 页】（1）发展和分配。共同富裕是中国特色社会主义的本质要求。高质量发展为共同富裕奠定物质基础；收入分配是民生之源，是改善民生、实现发展成果由人民共享最重要最直接的方式；分配制度是促进共同富裕的基础性制度。共同富裕是全体人民共同富裕，是人民群众物质生活和精神生活都富裕，不是同步、同时、所有地区同水平的富裕。（助记：发展看财富怎么来，分配看成果怎么分）（2）三次分配。【详见：第3 套，第7 题】；社会保障的作用【详见：第4 套，第24 题】。（3）“两个同步”：推动居民收入增长和经济增长同步、劳动报酬提高和劳动生产率提高同步。前者看居民收入与经济增长，后者看劳动者报酬与劳动生产率。"},{"id":"苏一-4-9","source":"苏一六套卷 第4套","qno":9,"type":"单选","subject":"毛中特","stem":"2026 年3 月，十四届全国人大四次会议通过《中华人民共和国民族团结进步促进法》，为新时代促进民族团结进步提供法治保障。我国是统一的多民族国家，各民族休戚与共、荣辱与共、生死与共、命运与共。民族团结之本是","options":{"A":"民族区域自治制度","B":"中华民族共同体意识","C":"各民族共同繁荣发展","D":"民族平等原则"},"answer":"B","analysis":"《中华人民共和国民族团结进步促进法》第六条明确指出：“中华民族共同体意识是民族团结之本。”题干中的休戚与共、荣辱与共、生死与共、命运与共，体现了各民族同属中华民族共同体。B 正确。","distractors":"A 选项，属于我国的基本政治制度；C 选项，对应民族工作的重要目标；D 选项，对应各民族一律平等。题干考查的是民族团结之本，ACD 均不符合题意。","extra":"中华民族共同体意识与民族工作主线【《手册》第98—99 页】（1）固定搭配：民族团结是我国各族人民的生命线；中华民族共同体意识是①国家统一之基，②民族团结之本，③精神力量之魂。铸牢中华民族共同体意识是新时代党的民族工作的主线，也是民族地区各项工作的主线。（2）四个与共：铸牢中华民族共同体意识，就是要引导各族人民牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念。（助记：认同同一个国家，统一才有根基。认同同属一个民族共同体，团结才有根本。大家有共同认同，精神上才能凝聚起来）（3）民族文化与《中华人民共和国民族团结进步促进法》的重要意义【详见：第1 套，第24 题】。基本政治制度——民族区域自治制度（1）民族区域自治是在国家统一领导下，各少数民族聚居的地方实行区域自治，设立自治机关，行使自治权。（2）民族区域自治制度是中国特色解决民族问题的正确道路的重要内容和制度保障。（3）坚持和完善民族区域自治制度，要坚持统一和自治相结合、民族因素和区域因素相结合，促进各民族共同团结奋斗、共同繁荣发展。（4）民族自治地方的自治机关是自治区、自治州、自治县的人民代表大会和人民政府。"},{"id":"苏一-4-10","source":"苏一六套卷 第4套","qno":10,"type":"单选","subject":"史纲","stem":"19 世纪60 年代到90 年代，洋务派以“自强”“求富”为目标，兴办近代企业，建立新式海陆军，创办新式学堂，派遣留学生。洋务运动历时30 多年，虽然办起了一批企业，建立了海军，却没有使中国富强起来。洋务运动具有封建性，其指导思想是“中学为体，西学为用”，企图以吸取西方近代生产技术为手段，来达到维护和巩固中国封建统治的目的，这就决定了它必然失败的命运。洋务运动失败的标志是","options":{"A":"清政府提前撤回留美幼童","B":"洋务派经营多年的北洋海军全军覆没","C":"中日《马关条约》的签订","D":"帝国主义列强掀起瓜分中国的狂潮"},"answer":"B","analysis":"洋务运动历时30 多年，虽然办起了一批企业，建立了海军，却没有使中国富强起来。甲午战争一役，洋务派经营多年的北洋海军全军覆没，标志着以“自强”“求富”为目标的洋务运动的失败。北洋海军是洋务派多年经营的重要军事成果，其在甲午战争中全军覆没，表明洋务运动未能实现“自强”的目标。B 正确。","distractors":"A 选项，清政府提前撤回留美幼童，是洋务运动教育实践受挫的表现，不是洋务运动失败的标志。C 选项，《马关条约》签订是北洋海军覆灭带来的后果，并非洋务运动失败标志。D 选项，甲午战争以后，帝国主义列强掀起瓜分中国的狂潮，是民族危机加深的表现，不是洋务运动失败的标志。","extra":"（1）洋务运动 【《手册》第122 页：考点2】19 世纪60 年代至90 年代。以“自强”兴办近代军事工业，以“求富”兴办近代民用企业，同主要目的 时筹建海军、兴办新式学堂、派遣留学生。指导思想是中学为体，西学为用，目的是维护封建统治失败标志 甲午战争一役，北洋海军全军覆没，标志着洋务运动的失败①洋务运动具有封建性失败原因 ②洋务运动对列强具有依赖性③洋务企业的管理具有腐朽性洋务运动具有封建性，体现在：洋务运动的指导思想是“中学为体，西学为用”,企图以吸取西具体体现 方近代生产技术为手段，来达到维护和巩固中国封建统治的目的，这就决定了它必然失败的命运。因为新的生产力是同封建主义的生产关系及其上层建筑不相容的洋务派是封建地主阶级的代表（发展封建主义）。因此，洋务派兴办洋务新政，主要是为了维护总结封建统治，并不是要使中国朝着独立的资本主义方向发展（2）同一场战争的不同标志。①北洋海军全军覆没，标志着洋务运动的失败。②1895 年《马关条约》签订，台湾等地被割占，民族危机进一步加深。③从民族意识看，甲午战争后，中国人民的民族意识开始普遍觉醒。（3）中日甲午战争对中国的影响主要有：【《手册》第120 页：考点6】①德、俄、英、法、日等国于1898 年至1899 年竞相租借港湾和划分势力范围，掀起了瓜分中国的狂潮②台湾、澎湖列岛被日本侵占③中日甲午战争以后，中国人民的民族意识开始普遍觉醒④北洋海军全军覆没，标志着洋务运动的失败⑤甲午战争后，义和团从秘密反清转向公开反对列强"},{"id":"苏一-4-11","source":"苏一六套卷 第4套","qno":11,"type":"单选","subject":"史纲","stem":"大革命失败后，中国共产党开始独立领导革命战争、创建人民军队。1927 年9 月9 日，毛泽东等领导的湘赣边界秋收起义爆发。起义军公开打出了“工农革命军”的旗帜，在攻打中心城市长沙受挫后，毛泽东果断改变计划，决定向敌人控制比较薄弱的农村转移。9月29 日，毛泽东领导起义军在江西永新县三湾村进行了著名的三湾改编。这次改编成为建设无产阶级领导的新型人民军队的重要开端，主要是因为它","options":{"A":"确定了土地革命和武装起义的方针","B":"从组织上确立了党对军队的领导","C":"确立了思想建党、政治建军原则","D":"在全党范围内确立实事求是的马克思主义思想路线"},"answer":"B","analysis":"1927 年9 月29 日，毛泽东领导起义军在江西永新县三湾村进行了著名的三湾改编，创造性地将支部建在连上，成立各级士兵委员会，实行民主制度，在政治上官兵平等，从组织上确立了党对军队的领导。三湾改编是建设无产阶级领导的新型人民军队的重要开端。B 正确。","distractors":"A 选项，确定土地革命和武装起义方针的是1927 年8 月召开的八七会议。C 选项，确立思想建党、政治建军原则的是1929 年12 月召开的古田会议。D 选项，延安整风运动（1941-1945 年）使实事求是的思想路线在全党范围确立起来。","extra":"（1）人民军队建设的几个“开端”【《手册》第134—135 页】时间 事件与历史地位南昌起义打响武装反抗国民党反动派的第一枪，是党独立领导革命战争、创建人民军队1927 年8 月1 日和武装夺取政权的开端。湘赣边界秋收起义公开打出工农革命军的旗帜。进攻长沙受挫后，毛泽东决定向农村转1927 年9 月移。①三湾改编把支部建在连上，成立各级士兵委员会，实行民主制度，政治上官兵平等。1927 年9 月29 日 从组织上确立了党对军队的领导。②三湾改编是建设无产阶级领导的新型人民军队的重要开端1929 年12 月 古田会议确立思想建党、政治建军原则。【详见：第3 套，第11 题】【《手册》第135 页】（2）秋收起义部队向农村转移途中，三湾改编把党的支部建在连上，解决党怎样在基层部队扎根的问题。两年后，古田会议面对农村环境和党、军队成员以农民为主要成分的实际，明确用无产阶级思想进行军队和党的建设。前者抓组织，后者抓思想建党、政治建军。古田会议【详见：第3 套，第11 题】。"},{"id":"苏一-4-12","source":"苏一六套卷 第4套","qno":12,"type":"单选","subject":"史纲","stem":"1934 年10 月至1936 年10 月，红军第一、第二、第四方面军和红二十五军进行了伟大的长征。长征途中，各路红军先后到达陕甘地区，为中国革命保存和锻炼了骨干力量。红军长征胜利结束的标志是","options":{"A":"中央红军到达陕北吴起镇","B":"红一方面军同红十五军团会合","C":"中央红军主力结束了二万五千里的行程","D":"三大主力红军在甘肃会宁、将台堡会师"},"answer":"D","analysis":"1935 年10 月，陕甘支队到达陕北吴起镇，11 月初在甘泉地区同红十五军团会合，标志着中央红军主力的长征胜利结束。1936 年10 月，红四方面军同红一方面军在甘肃会宁会合，红二方面军又同红一方面军在甘肃隆德将台堡会合。至此，三大主力红军的长征胜利结束。D 正确。","distractors":"ABC 选项，1935 年10 月19 日，北上红军（红一方面军）到达陕北吴起镇；11月初，在甘泉地区同在陕甘根据地的红十五军团会合，中国共产党所领导的革命力量有了新的落脚点和战略基地。至此，中央红军主力行程二万五千里、纵横11 个省的长征胜利结束。这只是中央红军主力的长征结束，当时其他主力红军（红二、四方面军）尚未完成长征。","extra":"【《手册》第136—137 页：考点4、5】（1）长征胜利90 周年：两年、两地、两个主语时间与地点 谁和谁会合 历史地位1935 年10—11 中央红军到达陕北吴起镇，随后同红十五军 中央红军主力结束二万五千里长征，革命月，吴起镇、甘泉 团会合。 力量有了新的落脚点和战略基地。1936 年10 月，会 红四方面军同红一方面军在会宁会合，红二 三大主力红军会师，标志着红军长征胜利宁、将台堡 方面军又同红一方面军在将台堡会师。 结束。（2）遵义会议集中解决军事问题和组织问题。长征途中重大转折【详见：第1 套，第11 题】；长征胜利的历史意义【详见：第2 套，第28 题】。"},{"id":"苏一-4-13","source":"苏一六套卷 第4套","qno":13,"type":"单选","subject":"史纲","stem":"1992 年初，邓小平南方谈话从理论上深刻回答了长期困扰和束缚人们思想的许多重大问题，把改革开放和现代化建设推向新阶段。同年，江泽民根据南方谈话精神，明确提出使用“社会主义市场经济体制”这一提法，为党的十四大召开作了重要的思想理论准备。1992 年10 月，中国共产党第十四次全国代表大会在北京召开。这次会议","options":{"A":"明确市场在资源配置中起决定性作用","B":"突破把计划经济同商品经济对立起来的观点","C":"把完善农村家庭联产承包责任制作为经济体制改革的中心环节","D":"确定建立社会主义市场经济体制的改革目标"},"answer":"D","analysis":"1992 年初，邓小平发表南方谈话，明确指出，计划和市场都是经济手段，不是社会主义与资本主义的本质区别，从根本上解除了把计划经济和市场经济看作属于社会基本制度范畴的思想束缚。1992 年10 月，中国共产党第十四次全国代表大会在北京召开。大会明确我国经济体制改革的目标是建立社会主义市场经济体制，要求更好地发挥计划和市场两种手段的长处，使市场在国家宏观调控下对资源配置起基础性作用。D 正确。","distractors":"A 选项，2013 年召开的党的十八届三中全会提出，使市场在资源配置中起决定性作用和更好发挥政府作用。BC 选项，1984 年党的十二届三中全会通过的《中共中央关于经济体制改革的决定》，突破把计划经济同商品经济对立起来的观点，提出“所有权同经营权是可以适当分开的”。这是党中央在计划与市场关系问题上取得的新认识。会后，经济体制改革以城市为重点全面展开。改革的中心环节是增强全民所有制企业的活力。【拓展】以邓小平南方谈话和党的十四大为标志，改革开放和社会主义现代化建设事业进入从计划经济体制向社会主义市场经济体制转变的新阶段，由此打开了中国经济、政治、文化发展的崭新局面。","extra":"社会主义市场经济体制的三个节点【《手册》第155、216 页】①1992 年南方谈话：明确计划和市场都是经济手段，标志着社会主义市场经济理论的形成。②1992 年党的十四大：确立改革目标，即建立社会主义市场经济体制。③1993 年十四届三中全会：进一步勾画基本框架。完整演进【详见：第1 套，第6 题】。"},{"id":"苏一-4-14","source":"苏一六套卷 第4套","qno":14,"type":"单选","subject":"思修","stem":"孔子称赞颜回虽“一箪食，一瓢饮，在陋巷”，却“不改其乐”。孟子以“富贵不能淫，贫贱不能移，威武不能屈”阐明何为大丈夫。从颜回的安贫乐道到孟子笔下的大丈夫，贯穿其中的传统美德是","options":{"A":"注重整体利益，强调责任奉献","B":"推崇仁爱原则，注重以和为贵","C":"追求精神境界，向往理想人格","D":"强调道德修养，注重道德践履"},"answer":"C","analysis":"两则材料共同描绘了值得追求的人格境界。颜回在清贫中安守其志，孟子笔下的大丈夫在富贵、贫贱、威势面前仍坚持道义。C 正确。","distractors":"A 选项，侧重个人对整体的责任；B 选项，侧重待人处世的原则；D 选项，侧重省察、慎独等修身实践。ABD 均不符合题意。","extra":"中华传统美德的五组表达【《手册》第166 页】基本精神 言行线索注重整体利益，公义胜私欲是根本要求。“国而忘家，公而忘私”“以公灭私，民其允怀”。强调责任奉献推崇仁爱原则，“己欲立而立人，己欲达而达人”“仁者自爱”。注重以和为贵注重人伦关系，“五教”“五伦”“仁、义、礼、智、信”“忠、孝、节、义”。重视道德义务追求精神境界，“明于庶物，察于人伦”“先天下之忧而忧，后天下之乐而乐”。向往理想人格强调道德修养， “见贤思齐焉，见不贤而内自省也”“善养吾浩然之气”“察色修身”“以身戴注重道德践履 行”。"},{"id":"苏一-4-15","source":"苏一六套卷 第4套","qno":15,"type":"单选","subject":"时政","stem":"2026 年4 月10 日上午，中共中央总书记习近平在北京会见了郑丽文主席率领的中国国民党访问团。大陆和台湾同属一个中国，中国是中华民族的共同家园。两岸同胞要守护好、建设好这个共同家园，根本在于","options":{"A":"坚持“九二共识”、反对“台独”","B":"让两岸同胞过上更美好的生活","C":"坚定对中华民族、中华文化、伟大祖国的认同","D":"传承弘扬中华文化"},"answer":"A","analysis":"习近平总书记指出，大陆和台湾同属一个中国，中国是中华民族的共同家园。两岸同胞要守护好、建设好这个共同家园，根本在于坚持“九二共识”、反对“台独”，核心是认同两岸同属一个中国；发展两岸关系的目标，是要让两岸同胞过上更美好的生活。A 正确，BCD 不符合题意。","distractors":"","extra":"两岸关系发展的四点意见①坚持以正确认同促进心灵契合。坚定对中华民族、中华文化、伟大祖国的认同。②坚持以和平发展守护共同家园。两岸同胞要守护好、建设好这个共同家园，根本在于坚持“九二共识”、反对“台独”，核心是认同两岸同属一个中国。③坚持以交流融合增进民生福祉。发展两岸关系的目标，是要让两岸同胞过上更美好的生活。④坚持以团结奋斗实现中华民族伟大复兴。我们坚信，会有越来越多台湾同胞正确认识大陆社会制度和发展道路，深刻认识到台湾的发展前途在于强大祖国、台湾同胞的利益福祉系于中华民族伟大复兴。（助记：认同让心更近，和平守住家园，交流让日子更好，奋斗走向复兴）"},{"id":"苏一-4-16","source":"苏一六套卷 第4套","qno":16,"type":"单选","subject":"时政","stem":"2026 年10 月23 日，国家主席习近平向2026 全球治理论坛（雄安）致信，他指出，当前，世界百年变局加速演进，和平赤字、发展赤字、安全赤字、治理赤字有增无减。我提出全球治理倡议，旨在推动构建更加公正合理的全球治理体系，建设一个更加美好的世界。2026 全球治理论坛（雄安）的主题为","options":{"A":"以共商促共享，以善治促善智","B":"践行全球治理倡议，构建人类命运共同体","C":"多边主义：更多交流、更多包容、更多合作","D":"重建信心与合作：百年变局与改革完善全球治理二、多项选择题：17～33 小题，每小题2 分，共34 分。下列每题给出的四个选项中，至少有两个选项是符合题目要求的。"},"answer":"D","analysis":"2026 全球治理论坛（雄安）的主题为“重建信心与合作：百年变局与改革完善全球治理”。D 正确，ABC 不符合题意。二、多项选择题：17～33 小题，每小题2 分，共34 分。下列每题给出的四个选项中，至少有两个选项是符合题目要求的。","distractors":"","extra":"论坛主题、倡议宗旨、全球治理观①本届论坛主题：重建信心与合作：百年变局与改革完善全球治理。②全球治理倡议旨在：推动构建更加公正合理的全球治理体系，建设一个更加美好的世界。③全球治理倡议的五项核心理念是奉行主权平等（首要前提）、遵守国际法治（根本保障）、践行多边主义（基本路径）、倡导以人为本（价值取向）、注重行动导向（实践原则）。【《手册》第114 页】④全球治理观。共商共建共享。致信提到的“四个赤字”依次为和平赤字、发展赤字、安全赤字、治理赤字。（助记：谁都能平等参与是主权平等，按什么规则办是国际法治，大家怎么一起办是多边主义，办事为了谁是以人为本，怎么把事办成是行动导向）全球治理与联合国的关系【详见：第3 套，第16 题】"},{"id":"苏一-4-17","source":"苏一六套卷 第4套","qno":17,"type":"多选","subject":"马原","stem":"冬性小麦需要经历一段时间的持续低温，才能获得开花的能力。研究发现，低温通过调节植株体内相关基因的表达，增强促进开花的作用并抑制阻碍开花的作用。完成这一过程后，植株还需在后续条件适宜时才能开花。春性小麦则不需要经历这一低温过程。这些现象表明","options":{"A":"外部条件的作用需要通过事物内部矛盾的运动才能实现","B":"外部条件的变化决定着事物发展的基本趋势","C":"矛盾的特殊性是事物对相同外部条件作出不同反应的内在根据","D":"事物之间的联系及其作用随具体条件的变化而变化"},"answer":"ACD","analysis":"事物的内部矛盾是事物发展的根据，外部矛盾是事物发展的条件，外因必须通过内因起作用。低温通过调节植株内部相关基因的表达，增强促进开花的作用、抑制阻碍开花的作用，说明外部条件通过事物内部的矛盾运动发挥作用，A 正确。矛盾具有特殊性，不同事物的内部矛盾各有特点，构成它们区别于其他事物的内在根据。冬性小麦与春性小麦对低温的不同需求，说明不同的内部特点使其对相同外部条件作出不同反应，C 正确。联系具有条件性，条件对事物发展具有支持或制约作用。冬性小麦经历低温后仍需后续条件适宜才能开花，说明一种条件的作用不能脱离其他具体条件，联系及其作用会随条件变化而变化，D 正确。","distractors":"B 错误，事物发展的根本原因在于内部矛盾，内部矛盾决定事物发展的基本趋势。外部条件能够加速或延缓发展，影响发展的具体过程，但必须通过内部矛盾发挥作用。低温的作用依赖小麦自身的内部特点，不能把外部条件的变化说成决定基本趋势的力量。","extra":"（1）内因、外因【《手册》第9 页：考点2——苏一说】①内因（内部矛盾）是事物发展的根本原因，是事物发展的根据，决定事物发展的基本趋势②外因（外部矛盾）是事物发展的条件，影响（加速或延缓）事物的发展，外因必须通过内因起作用（2）矛盾特殊性的三种情形【《手册》第9—10 页】①不同事物的矛盾各有特点。②同一事物的矛盾在不同发展过程和发展阶段各有不同特点。③构成事物的诸多矛盾以及每一矛盾的不同方面各有不同的性质、地位和作用。方法论是具体问题具体分析。（3）矛盾的普遍性与特殊性①矛盾的普遍性（即共性、一般）是无条件的、绝对的特点②矛盾的特殊性（个性、个别）是有条件的、相对的任何现实存在的事物的矛盾都是共性和个性的有机统一：①共性寓于个性之中，没有离开个性的共性，也没有离开共性的个性辩证统一②矛盾的共性和个性的道理是关于事物矛盾问题的精髓，是正确理解矛盾学说的关键③人的认识的一般规律就是由认识个别上升到一般，再由一般到个别的辩证发展过程（4）联系的四个特性：【详见：第1 套，第17 题】【《手册》第7—8 页】"},{"id":"苏一-4-18","source":"苏一六套卷 第4套","qno":18,"type":"多选","subject":"马原","stem":"郑板桥记述画竹的过程：清晨看竹，烟光、日影、露气浮动于竹叶之间，胸中遂有画意。他说：“其实胸中之竹，并不是眼中之竹也。”及至磨墨展纸、落笔作画，“手中之竹又不是胸中之竹也”。这一艺术创作过程表明","options":{"A":"观念的东西不外是移入人的头脑并在人的头脑中改造过的物质的东西而已","B":"主体与客体的关系根本上是认识与被认识的关系","C":"艺术创作能够通过实践使观念的东西转化为现实的东西","D":"艺术构思具有把观念形象变成现实作品的直接现实性"},"answer":"AC","analysis":"意识是客观世界的主观映象，是客观内容和主观形式的统一。“胸中之竹”来源于现实中竹子的形态及其光影，又经过画家的感受、选择和构思，并非对“眼中之竹”的机械复制，体现了艺术形象的客观内容与主观形式的统一，A 正确。实践具有直接现实性，能够把观念的存在变为现实的存在。画家通过磨墨展纸、落笔作画，使头脑中的构思成为现实的绘画作品，体现了观念的东西通过实践转化为现实的东西，C 正确。","distractors":"B 错误，主体与客体之间包括实践关系、认识关系和价值关系，其中最根本的是实践关系。认识关系是在实践基础上形成和发展的，不能用认识与被认识的关系代替最根本的实践关系。D 错误，艺术构思属于意识活动，只能形成观念中的形象，不具有直接现实性。把构思转化为现实作品，需要作画等实践活动，不能把实践的特点归于艺术构思本身。","extra":"（1）意识的创造性【《手册》第6、14—15 页】两次转化 考点①意识是人脑的机能和属性，是客观世界的主观映象，是客观内容和主观形式的统一。人能够通过实践在观念中创造现实中尚不存在的形象。观念的东西不外是移入人的头脑并在人的头脑中改造过的物质的东西而已现实对象→观念形象——这是马克思的原话，意思是：人的意识是来自于客观世界的，并且是经过大脑加工改造过的。②无论意识正确与否都可以在物质世界找到其“原型”实践具有直接现实性，能把观念的存在变为现实的存在。观念形象→现实作品艺术创作属于科学文化实践。（2）实践的直接现实性实践的三个基本特征是客观实在性、自觉能动性、社会历史性。①实践的主体和客体相互作用的关系包括：实践关系、认识关系、价值关系。其中实践关系最根本。②实践的主体和客体正是依靠中介系统才能够相互作用。③人类一切实践活动的结果都是主体客体化的结果 【详见：第3 套，第17 题】。（3）实践的三种基本实践类型①物质生产实践：最基本的实践活动②社会政治实践：主要指人们的政治活动③科学文化实践：是创造精神文化产品的实践活动，重要形式有科学、艺术、教育等活动三种基本类型 （注：精神文化的生产不是一个纯粹的意识过程。比如，教育者的教学活动并不是纯粹的意识活动）【注意】后两类在物质生产实践基础上产生和发展，受物质生产实践的制约。画家在心里构图属于意识活动，动笔作画使画纸发生了现实变化，属于科学文化实践。①虚拟实践，主要活跃于网络世界，具有交互性、开放性、间接性等特点新的实践形式②虚拟实践是实践活动的派生形式，同时又对现实的实践活动产生重大影响"},{"id":"苏一-4-19","source":"苏一六套卷 第4套","qno":19,"type":"多选","subject":"马原","stem":"邓小平在评价毛泽东的历史贡献时指出：“没有毛主席，至少我们中国人民还要在黑暗中摸索更长的时间。”他同时强调，毛泽东把马克思列宁主义的原理同中国革命的实际结合起来，指出了中国夺取革命胜利的道路。关于历史人物，下列说法正确的有","options":{"A":"历史人物的出现是合规律性与合目的性的统一","B":"历史人物有时能够对个别历史事件的结局起决定作用","C":"历史人物能够影响历史发展的具体进程但不能改变其基本方向","D":"历史人物是社会历史的创造主体"},"answer":"BC","analysis":"历史人物是一定历史事件的主要倡导者、组织领导者，或者思想理论、科学文化的重要代表人物。他们能够对历史发展产生深刻影响，有时甚至能够决定个别历史事件的结局。毛泽东把马克思列宁主义基本原理同中国革命实际相结合，指出夺取革命胜利的道路，体现了杰出人物对解决重大历史任务的重要作用，B 正确。历史人物的作用受社会历史条件和社会发展客观规律的制约，能够影响具体历史进程，却不能改变历史发展的基本方向。“还要在黑暗中摸索更长的时间”肯定了毛泽东对革命进程的重大影响，并不意味着历史的基本方向由个人决定，C 正确。","distractors":"A 错误，任何历史人物的出现都体现了必然性与偶然性的统一。历史任务和时代条件规定了人物出现的社会需要，具体由谁担当又具有偶然性。“合规律性与合目的性的统一”是关于人的成功实践的规定，不能替代历史人物出现中的必然性与偶然性。D 错误，人民群众是社会历史的主体，是历史的创造者。肯定历史人物的重大作用，不能否定人民群众在创造历史中的决定作用，也不能以少数历史人物取代人民群众的主体地位。","extra":"【《手册》第28—29 页】（1）个人在社会历史中的作用个人在历史上的作用存在差别。有的人作用大些，可称为“历史人物”。有的人作用小些，可称为“普通个人”。①历史人物是一定历史事件的主要倡导者、组织领导者或思想理论、科学文化的重要代表人物。历史人物②杰出人物是历史人物中对推动历史发展作出重要贡献或起重要作用的人③新的历史任务往往是由具有进步意义的历史人物首先发现或提出来的④无产阶级的领袖人物，所提出的思想能够成为社会变革的先导不管什么样的历史人物，在历史上发挥什么样的作用，都要受到社会发展客观规律的制约。历史作用人物有时能够决定个别历史事件的结局，不能决定和改变历史发展的总进程和总方向①任何历史人物的出现都体现了必然性与偶然性的统一。时代需要有人担当某项任务，具体由谁担当又具有偶然性。②历史人物的作用性质取决于他们的思想、行为是否符合社会发展规律，是否符合人民群众的意评价愿③评价历史人物要坚持历史分析方法和阶级分析方法。评价时，把人物放回他所处的时代，考察当时的社会条件、他所代表的阶级利益以及实际发挥的作用。（2）人民群众在社会历史发展过程中，人民群众起着决定性的作用。体现在：①人民群众是社会物质财富的创造者决定作用②人民群众是社会精神财富的创造者③人民群众是社会变革的决定力量①人民群众创造历史的作用同社会基本矛盾运动推动社会前进的过程相一致依据 ②人民群众的总体意愿和行动代表了历史发展的方向，人民群众的社会实践最终决定历史发展的结局人民群众创造历史的活动受到一定社会历史条件的制约：①经济条件对于人民群众创造历史的活动有着首要的、决定性的影响制约条件②政治条件对人民群众创造历史的活动也具有直接的影响③精神文化条件也是制约人民群众创造历史活动的重要因素"},{"id":"苏一-4-20","source":"苏一六套卷 第4套","qno":20,"type":"多选","subject":"马原","stem":"一家面粉厂生产的面粉，一部分卖给食品厂加工面包，另一部分卖给居民用于家庭消费。面粉厂按价值售出产品并收回货款，却因买不到足够的小麦而难以维持原有的生产规模。由此可见","options":{"A":"产品的实物形态决定其所属的生产部类","B":"同一种产品可以因最终用途不同而分别属于生产资料和消费资料","C":"面粉厂耗费的资本已在价值上得到补偿","D":"面粉厂的生产受阻发生在实物补偿环节"},"answer":"BCD","analysis":"社会再生产的核心问题是社会总产品的实现，即价值补偿和实物补偿。①价值补偿，即生产的商品卖得出去、生产中所耗费的资本在价值上得到补偿。②实物补偿，即实际生产过程中所耗费的生产资料和消费资料得到实物的替换，也就是说企业能购买到原材料。题干中，面粉厂按价值售出产品并收回货款，说明商品卖出去了，其耗费的资本已在价值上得到补偿；但买不到足够的小麦，说明其生产受阻发生在实物补偿环节。CD 正确。社会总产品按最终用途可分为生产资料和消费资料。面粉卖给食品厂用于生产面包，属于生产资料；卖给居民用于家庭消费，属于消费资料。B 正确。","distractors":"A 错误，产品所属的生产部类不是由其实物形态本身决定的，而是由产品的最终用途决定的。【拓展】①社会再生产的核心问题是社会总产品的实现问题，即社会总产品的价值补偿和实物补偿问题。②社会再生产的顺利进行，要求生产中所耗费的资本在价值上得到补偿，同时还要求实际生产过程中所耗费的生产资料和消费资料得到实物的替换，否则社会再生产就会停顿，人类社会的生存和发展就会受到威胁。③社会总产品在实物上得到替换，在价值上实现补偿，客观上就要求两大部类内部各个产业部门之间和两大部类之间保持一定的比例关系。④由生产资料的私有制和雇佣劳动制度所决定，两大部类的生产都是在价值规律和剩余价值规律的作用下自发进行的，具有严重的盲目性，这就导致了两大部类生产在规模上和结构上经常处于失衡状态。这种失衡和脱节经常表现为生产过剩，以至于社会总产品的实现，即实物替换和价值补偿难以顺利进行，最严重的就是引发经济危机。","extra":"（1）社会再生产的核心问题【《手册》第40 页】比较 划分依据与内容依据产品的最终用途。①第Ⅰ部类生产生产资料，进入生产消费。②第Ⅱ部类生产消（1）两大部类费资料，进入个人消费。社会再生产的核心问题：社会总产品的实现问题（即价值补偿和实物补偿问题）（2）两种补偿 ①价值补偿：商品卖得出去，生产中所耗费的资本得到价值补偿。②实物补偿：生产过程中所耗费的生产资料和消费资料得到实物的替换。①社会总产品必须同时实现两种补偿。②两大部类之间、两大部类内部各产业部门之（3）实现条件间必须保持合理的比例关系。"},{"id":"苏一-4-21","source":"苏一六套卷 第4套","qno":21,"type":"多选","subject":"马原","stem":"第二次世界大战后，资本主义国家普遍加强对经济的干预。20 世纪70 年代起，随着经济陷入滞胀和新自由主义思潮泛滥，西方国家又普遍强化市场调节、弱化政府干预。在这一过程中，资本主义经济危机呈现出新的特点，主要表现为","options":{"A":"周期性危机与结构性危机交织","B":"财政严重债务化，债务危机频繁爆发","C":"经济高度金融化，虚拟经济与实体经济严重脱节","D":"危机的根源由生产领域的基本矛盾转为流通领域的金融失调"},"answer":"ABC","analysis":"资本主义经济危机的新特点包括：去工业化和产业空心化日趋严重，产业竞争力下降；经济高度金融化，虚拟经济与实体经济严重脱节；财政严重债务化，债务危机频繁爆发；两极分化和社会对立加剧；经济增长乏力，发展活力不足，周期性危机与结构性危机交织；金融危机频发，全球经济屡受打击。ABC 正确。","distractors":"D 选项，资本主义经济危机的根源始终是生产领域的资本主义基本矛盾，金融失调只是危机的新表现形式，根源并未发生转移。","extra":"（1）经济危机的六个新特点 【《手册》第47 页】①去工业化和产业空心化日趋严重，产业竞争力下降。②经济高度金融化，虚拟经济与实体经济严重脱节。③财政严重债务化，债务危机频繁爆发。④两极分化和社会对立加剧。⑤经济增长乏力，周期性危机与结构性危机交织在一起。⑥金融危机频发，全球经济屡受打击。（2）资本主义的基本矛盾与经济危机【《手册》第43 页】①危机的本质特征是生产相对过剩；根源是资本主义的基本矛盾，即生产社会化和生产资料资本主义私人占有之间的矛盾②从根源到周期区分 应背判断危机的可能性 经济危机的抽象的一般的可能性，首先是由货币作为流通手段和支付手段引起的。基本矛盾的两种 ①生产无限扩大的趋势与劳动人民有支付能力的需求相对缩小的矛盾。表现 ②单个企业内部生产的有组织性和整个社会生产的无政府状态之间的矛盾。资本主义基本矛盾运动的阶段性决定经济危机的周期性。社会资本再生产经历危机、萧周期性条、复苏、高涨四个阶段。毛中特（5—6 单选；22 多选）"},{"id":"苏一-4-22","source":"苏一六套卷 第4套","qno":22,"type":"多选","subject":"毛中特","stem":"毛泽东在谈到农业合作化问题时指出：“我们现在不但正在进行关于社会制度方面的由私有制到公有制的革命，而且正在进行技术方面的由手工业生产到大规模现代化机器生产的革命，而这两种革命是结合在一起的。”这里强调“两种革命是结合在一起的”，表明我国向社会主义过渡需要","options":{"A":"使所有制改造的实际步骤与促进工业化的要求相适应","B":"通过发展现代工业，为推进社会主义改造提供物质条件","C":"以完成生产技术改造作为变革生产资料所有制的前提","D":"通过变革生产关系，为发展社会生产力创造条件"},"answer":"ABD","analysis":"我国社会主义改造的第一条重要历史经验是坚持社会主义工业化建设与社会主义改造同时并举。体现在：①社会主义改造就是变革不适应工业化发展要求的生产关系，是围绕着社会主义工业化建设这个中心任务进行的。在改造过程中，党和政府所采取的实际步骤，总是力求使之与促进工业化进程和经济发展的要求相适应，而不允许对生产力造成破坏。②“一化”即社会主义工业化，“三改”即对个体农业、手工业和资本主义工商业的社会主义改造。其中，“一化”是“主体”，“三改”是“两翼”，两者相辅相成、相互促进。题干通过发展现代工业（即社会主义工业化）、推进技术改造，为所有制改造（三大改造）提供物质条件。③社会主义革命的目的是为了解放生产力。引导个体农民、个体手工业者走集体化的道路，改造私人资本主义工商业，这些属于变革生产关系，目的都是为了适应社会主义工业化建设的要求，更好地发展生产力。ABD 正确。","distractors":"C 选项，我国社会主义改造的历史经验，是要坚持社会主义工业化建设与社会主义改造同时并举，而不是先完成技术改造，再变革所有制（生产关系）。","extra":"（1）过渡时期总路线【《手册》第62-63 页：考点2】题干中的“两种革命”，是指生产资料私有制的社会主义改造（即三大改造，属于生产关系变革）与社会主义工业化（属于生产力发展）。“两种革命结合在一起”，体现了变革生产关系与发展生产力的有机统一过渡时期总路线的主要内容：一化三改（即一体两翼）①主体是实现国家的社会主义工业化，重在发展生产力。主要内容②两翼是对农业、手工业和资本主义工商业的社会主义改造，重在变革生产关系③特点：社会主义建设和社会主义改造同时并举（2）社会主义改造的三条历史经验【《手册》第65 页：考点4】①坚持社会主义工业化建设与社会主义改造同时并举。②采取积极引导、逐步过渡方式。③用和平方法进行改造。（3）改造的对象与路径。【《手册》第63-64 页：考点3】①农业：互助组→初级农业生产合作社→高级农业生产合作社。②手工业：手工业供销小组→手工业供销合作社→手工业生产合作社。③资本主义工商业：通过国家资本主义实现过渡，对资本家占有的生产资料实行和平赎买。（4）改造时间与标志。从中华人民共和国成立到社会主义改造基本完成，是我国从新民主主义到社会主义的过渡时期。1953 年提出过渡时期总路线。1956 年底，社会主义改造基本完成，标志着社会主义基本制度在中国确立。这里的“完成”指三大改造，社会主义工业化建设仍要继续。【《手册》第63、151-152 页】新思想（7—9 单选；23—26 多选）"},{"id":"苏一-4-23","source":"苏一六套卷 第4套","qno":23,"type":"多选","subject":"毛中特","stem":"我国不断丰富人大代表联系人民群众的内容和形式。十四届全国人大四次会议期间，全国人大代表提出的建议中，66.08%是在专题调研、视察、代表小组活动和座谈、走访基础上形成的。丰富人大代表联系群众的内容和形式，有利于","options":{"A":"保障人民群众直接行使国家权力","B":"完善人大的民主民意表达平台和载体","C":"不断扩大人民有序政治参与","D":"健全吸纳民意、汇集民智的工作机制"},"answer":"BCD","analysis":"通过座谈、走访等方式听取群众意见，有利于完善人大的民主民意表达平台和载体，B 正确。代表联系群众为人民表达诉求、提出建议提供了制度化渠道，有利于不断扩大人民有序政治参与，C 正确。代表将调研、走访收集的意见转化为建议，有利于让群众意见进入人大工作过程，健全吸纳民意、汇集民智的工作机制，D 正确。BCD 正确。","distractors":"A 错误，我国宪法规定，人民行使国家权力的机关是全国人民代表大会和地方各级人民代表大会；人民通过各级人民代表大会行使国家权力，而非“直接行使”。","extra":"人大代表、人民代表大会与人民【《手册》第97 页】主体 行为及其性质国家的一切权力属于人民。人民行使国家权力的机关是全国人民代表大会和地方各级人民代人民表大会。代表人民的利益和意志，听取和反映人民的意见和要求，受人民监督。代表依法参加审议、人大代表表决，提出议案和建议。人民代表大会 各级人大是国家权力机关。人大代表依法提出建议，人民代表大会依法集体行使职权。直接选举的范围。县、乡两级人大代表由选民直接选举（包括不设区的市、市辖区等相应层级）；设区的市、自治州、省级人大代表和全国人大代表由下一级人大依法选举。人大和政协的性质、职能及对应制度【详见：第3 套，第24 题】。（助记：居民向代表提意见是政治参与；选民亲自投票选县级人大代表是直接选举；人大依法集体作出决定，是行使国家权力）"},{"id":"苏一-4-24","source":"苏一六套卷 第4套","qno":24,"type":"多选","subject":"毛中特","stem":"就业一头连着经济发展，一头连着千家万户。“十五五”时期，我国加强产业和就业协同，挖掘新产业、新业态就业潜力，完善职业技能培训和就业服务，为劳动者拓宽就业渠道。实施就业优先战略，把就业摆在经济社会发展优先位置，有利于","options":{"A":"不断扩大就业容量","B":"发挥收入分配调节器的作用","C":"创造和增加收入","D":"改善人民生活品质"},"answer":"ACD","analysis":"就业是最基本的民生，是劳动者获得收入、改善生活的重要途径。①实施就业优先战略，加强产业和就业协同，挖掘新产业、新业态就业潜力，有利于开发更多就业岗位，不断扩大就业容量，A 正确。②完善职业技能培训和就业服务，促进劳动者实现就业、提高就业质量，有利于劳动者通过劳动创造和增加收入，C 正确。③就业关系千家万户的生活，稳定就业、增加收入，有利于增强家庭生活保障能力，改善人民生活品质，D 正确。","distractors":"B 选项，“收入分配调节器”是对社会保障作用的概括。社会保障通过再分配和互助共济，调节不同群体之间的收入分配关系。题干强调的是实施就业优先战略，通过扩大就业、促进劳动者就业增收改善民生，不能将社会保障的这一作用直接套用于就业优先战略。","extra":"就业与社会保障的不同作用【《手册》第103—104 页】（1）就业是最基本的民生、最大的民生工程、民心工程、根基工程：方针是劳动者自主就业、市场调节就业、政府促进就业和鼓励创业（助记：劳动者自己主动找工作，对应“自主就业”；市场把求职者和岗位匹配起来，对应“调节就业”；政府提供就业服务、支持创业，对应“促进就业和鼓励创业”）。【详见：第2 套，第9 题】（3）社会保障发挥民生保障安全网、收入分配调节器、经济运行减震器作用。（助记：上岗领工资对应就业增收。失业时领保险金体现社会保障的安全网作用；给符合条件的困难家庭发低保，补助基本生活，体现收入分配调节器的作用；经济有波动时稳住居民的基本生活和消费水平，体现了减震器作用）"},{"id":"苏一-4-25","source":"苏一六套卷 第4套","qno":25,"type":"多选","subject":"毛中特","stem":"《美丽中国建设“十五五”规划》对绿色工厂建设、货物运输结构调整和绿色产品推广作出部署。企业改进工艺，让消费者有了更多节能低碳产品可选；越来越多消费者愿意购买这类产品，又促使企业加快技术改造。这表明","options":{"A":"绿色转型涉及经济社会发展方方面面，是一个系统工程","B":"绿色生产方式和生活方式相互促进、互为支撑","C":"生物多样性是人类赖以生存和发展的基础","D":"绿色转型是建设美丽中国的必由之路"},"answer":"ABD","analysis":"绿色工厂建设、运输结构调整和绿色产品推广分别涉及生产、流通和消费，体现了绿色转型涉及经济社会发展方方面面，是一个系统工程，A 正确。企业改进工艺为消费者提供更多绿色产品，消费需求又推动企业加快技术改造，体现了绿色生产方式和生活方式相互促进、互为支撑，B 正确。《美丽中国建设“十五五”规划》把生产、运输和消费领域的绿色转型统筹推进，体现了绿色转型是建设美丽中国的必由之路，D 正确。ABD 正确。","distractors":"C 选项，题干围绕生产生活方式绿色转型展开，未涉及物种、遗传资源和生态系统多样性的保护，不符合题意。","extra":"从绿色生产到绿色生活【《手册》第106 页】（1）全面绿色转型是一个系统工程。①生产端，改进工艺、推进清洁生产，减少单位产品的资源消耗。②流通端，调整运输结构，降低物流环节排放。③消费端，优先购买绿色产品，节约使用并做好回收利用。（2）供需双向作用。生产一端提供买得到、用得起的绿色产品；消费一端形成持续需求，使企业愿意继续投入绿色技术。绿色生产方式和生活方式相互促进、互为支撑。（3）能源绿色低碳转型是实现碳达峰碳中和的关键【详见：第3 套，第9 题】。"},{"id":"苏一-4-26","source":"苏一六套卷 第4套","qno":26,"type":"多选","subject":"毛中特","stem":"一台工业设备的竞争力，不仅取决于生产制造，还同前端的研发设计、后续的运行维护密切相关。从提供单一产品到提供“产品＋服务”解决方案，制造企业正在延伸价值链。“十五五”规划纲要提出保持制造业合理比重，国务院同时部署推进服务业扩能提质。上述部署表明，建设现代化产业体系要","options":{"A":"坚持把发展经济的着力点放在实体经济上","B":"推进生产性服务业向专业化和价值链高端延伸","C":"构建以先进制造业为骨干的现代化产业体系","D":"推动先进制造业和现代服务业深度融合"},"answer":"ABCD","analysis":"题干把保持制造业合理比重与推动服务业扩能提质结合起来，体现了把发展经济的着力点放在实体经济上，A 正确。研发设计、运行维护等环节进入制造企业提供的解决方案，体现了生产性服务业向专业化和价值链高端延伸，B 正确。“十五五”规划纲要把保持制造业合理比重与构建以先进制造业为骨干的现代化产业体系统筹部署，体现了先进制造业在现代化产业体系中的骨干地位，C 正确。从提供单一产品到提供“产品＋服务”解决方案，体现了先进制造业和现代服务业深度融合，D 正确。ABCD 正确。","distractors":"","extra":"实体经济、先进制造业、现代服务业与数字经济【《手册》第91—92 页】对象 固定搭配实体经济 发展经济的着力点。研发、设计、维护等服务可以直接为实体生产服务。先进制造业 现代化产业体系的骨干。推动先进制造业与现代服务业深度融合。现代服务业 现代化产业体系的重要支撑生产性服务业 向专业化和价值链高端延伸。比如研发设计、工业软件、检测认证。促进生活性服务业高品质多样化便利化发展。比如养老、家政、文旅等直接服务居民生活性服务业生活的行业。①是稳增长促转型的重要引擎；②已成为我国经济高质量发展的新引擎；③正在成为新一轮国际竞争的重点领域；④正在成为重组全球要素资源、重塑全球经济结构、改数字经济变全球竞争格局的关键力量；⑤数字经济健康发展有利于推动构建新发展格局、推动建设现代化经济体系、推动构筑国家竞争新优势传统产业怎样改造升级【详见：第1 套，第23 题】。史纲（10—13 单选；27—29 多选）"},{"id":"苏一-4-27","source":"苏一六套卷 第4套","qno":27,"type":"多选","subject":"史纲","stem":"毛泽东率领起义军到井冈山后，全力进行湘赣边界党、军队和政权的建设。1927 年11月，成立边界第一个红色政权——茶陵县工农兵政府。1928 年2 月中旬，打破江西国民党军队对井冈山地区的进攻。至此，井冈山根据地初步建立起来。井冈山革命根据地的建立","options":{"A":"开启了独立领导革命战争和创建人民军队的历程","B":"开辟出了农村包围城市、武装夺取政权的正确道路","C":"点燃了工农武装割据的星星之火","D":"确立了马克思主义建党建军原则"},"answer":"BC","analysis":"井冈山根据地的建立，点燃了工农武装割据的星星之火，为中国革命开辟出了农村包围城市、武装夺取政权这样一条前人没有走过的正确道路。大革命失败后，中国共产党人正是沿着这条独特的道路，引导中国革命走向复兴并逐步赢得胜利的。BC 正确。","distractors":"A 选项，1927 年8 月1 日的南昌起义，打响了武装反抗国民党反动派的第一枪，是中国共产党独立领导革命战争、创建人民军队和武装夺取政权的开端。D 选项，1929 年12 月召开的古田会议，确立了马克思主义建党建军原则，创造性地解决了在农村环境中、在党组织和军队以农民为主要成分的条件下，如何保持党的无产阶级先锋队性质和建设党领导的新型人民军队的重大问题。","extra":"井冈山：根据地建设与道路理论【《手册》第134—135 页】（1）1927 年10 月，向井冈山进军。秋收起义部队转向敌人力量薄弱的农村。11 月，成立湘赣边界第一个红色政权——茶陵县工农兵政府。（2）1928 年2 月，井冈山根据地初步建立起来。井冈山根据地的建立：点燃了工农武装割据的星星之火，为中国革命开辟出了农村包围城市、武装夺取政权这样一条前人没有走过的正确道路。4 月，朱德、陈毅率领的部队与毛泽东领导的部队在井冈山会师。（3）从实践到理论。井冈山根据地把土地革命、武装斗争和根据地建设结合起来，毛泽东在总结实践经验的基础上逐步阐明中国革命道路。四篇著作及各自贡献【详见：第1 套，第28 题】。"},{"id":"苏一-4-28","source":"苏一六套卷 第4套","qno":28,"type":"多选","subject":"史纲","stem":"1935 年12 月，中共中央在陕北瓦窑堡召开政治局扩大会议，批评了党内长期存在的“左”倾冒险主义、关门主义错误倾向，推动党的政策发生重大转变。这次会议是党在土地革命战争时期向抗日战争过渡阶段的一次关键会议，其历史成就包括","options":{"A":"及时提出了抗日民族统一战线的新政策","B":"将“工农共和国”口号改为“人民共和国”","C":"科学阐明了党的马克思主义思想路线","D":"系统阐明抗日战争的持久战方针"},"answer":"AB","analysis":"华北事变后，中日民族矛盾进一步激化。1935 年12 月，中共中央在陕北瓦窑堡召开政治局扩大会议，提出党的基本策略任务是建立广泛的抗日民族统一战线，将“工农共和国”口号改为“人民共和国”，批评了党内长期存在的“左”倾冒险主义、关门主义错误倾向。瓦窑堡会议制定了抗日民族统一战线的新政策，使中国共产党在新的历史时期即将到来时掌握了政治主动权。AB 正确。","distractors":"C 选项，1937 年夏，毛泽东在抗日军政大学讲授《实践论》《矛盾论》，从马克思主义认识论的高度，总结中国共产党的历史经验，揭露和批评党内的主观主义尤其是教条主义错误，深入论证马克思列宁主义基本原理同中国具体实际相结合的原则，科学阐明了党的马克思主义思想路线。D 选项，1938 年5 月至6 月间，毛泽东发表《论持久战》的讲演，系统地阐明了持久战方针。","extra":"抗日民族统一战线：提出、形成与独立自主（1）三个时间点。【《手册》第138 页考点1】华北事变后，瓦窑堡会议批评“左”倾关门主义，提出建立抗日民族统一战线的策略方针，1935 年12 月将“工农共和国”改为“人民共和国”1936 年12 月 西安事变和平解决成为时局转换的枢纽，十年内战的局面由此结束国民党中央通讯社发表中共中央为公布国共合作宣言，蒋介石随后发表实际上承认中国共产1937 年9 月党合法地位的谈话，以国共两党第二次合作为基础的抗日民族统一战线正式形成（2）统一战线中的独立自主。①保持党在思想上、政治上、组织上的独立性。②坚持党对人民军队的绝对领导。③对国民党采取又团结又斗争的方针。洛川会议的全面抗战路线【手册：第140-141 考点5】。（3）会议与著作对照。【手册：第137 考点5、第139 页考点3】。瓦窑堡会议提出策略方针。同月，毛泽东作《论反对日本帝国主义的策略》的报告，阐明党1935 年12 月的抗日民族统一战线新政策，系统说明党的政治策略问题。《实践论》《矛盾论》阐明党的马克思主义思想路线。从马克思主义认识论的高度，揭露和1937 年夏 批评党内的主观主义尤其是教条主义错误，深入论证马克思列宁主义基本原理同中国具体实际相结合的原则。毛泽东发表《论持久战》，系统阐明持久战方针。总结全民族抗战10 个月来的经验：（1）批驳了“亡国论”“速胜论”等错误观点，系统地阐明了持久战方针（2）抗日战争只能是持久战，最后的胜利将是属于中国的①日本是强国，中国是弱国，强国弱国的对比，决定了抗日战争只能是持久战1938 年②日本发动的是退步的、野蛮的侵略战争，在国际上失道寡助；中国进行的是进步的、正义的反侵略战争，在国际上得道多助（3）强调“兵民是胜利之本”。战胜日本的侵略必须进行人民战争（4）科学预见了抗日战争将经过三个阶段：战略防御、战略相持（最关键阶段）、战略反攻"},{"id":"苏一-4-29","source":"苏一六套卷 第4套","qno":29,"type":"多选","subject":"史纲","stem":"1956 年9 月，中国共产党第八次全国代表大会在北京举行。这是中国共产党在全国执政以后召开的第一次全国代表大会。会上，毛泽东致开幕词，刘少奇作政治报告，周恩来作关于发展国民经济第二个五年计划建议的报告，邓小平作关于修改党章的报告。大会在经济、政治和党的建设方面提出的重要主张有","options":{"A":"坚持既反保守又反冒进的经济建设方针","B":"肯定“三个主体、三个补充”的思想","C":"提出扩大社会主义民主，健全社会主义法制","D":"提出实行统筹兼顾、适当安排的方针"},"answer":"ABC","analysis":"①在经济建设上，八大坚持党中央提出的既反保守又反冒进，即在综合平衡中稳步前进的经济建设方针。大会肯定“三个主体，三个补充”思想，即以国家经营和集体经营、计划生产、国家市场三者为主体，以个体经营、自由生产、自由市场三者为补充。这是在理论上突破苏联计划经济模式，探索经济体制改革的重要尝试。大会提出在三个五年计划或者再多一点的时间内，在我国建成一个基本完整的工业体系的战略设想，为全国人民描绘了社会主义发展的宏伟蓝图。②在政治建设上，八大提出要扩大社会主义民主、健全社会主义法制，使党和政府的活动做到“有法可依”和“有法必依”。③在党的建设上，八大通过的新党章是中国共产党在全国执政以后制定的第一部党章。新党章根据执政党的特点，提出了全面开展社会主义建设的任务，对贯彻党的民主集中制的根本原则作出了许多新规定。ABC 正确。","distractors":"D 选项，“统筹兼顾、适当安排”是毛泽东在1957 年《关于正确处理人民内部矛盾的问题》中提出的具体方针，是针对物质利益、分配方面的人民内部矛盾的方针，并非本题所问的1956 年党的八大的主张。","extra":"中共八大【《手册》第152 页】【详见：第1 套，第29 题】。思法（14 单选；30—31 多选）"},{"id":"苏一-4-30","source":"苏一六套卷 第4套","qno":30,"type":"多选","subject":"思修","stem":"习近平总书记在庆祝中国共产党成立105 周年大会上的讲话中指出，我们党牢记马克思主义政党的性质宗旨和奋斗目标，大力弘扬伟大建党精神，历经磨难斗志弥坚，千锤百炼更加坚强。在长期奋斗中，中国共产党形成了以伟大建党精神为源头的精神谱系。这一精神谱系","options":{"A":"是中国共产党领导人民在团结奋斗中共同创造的","B":"集中体现了党的坚定信念、根本宗旨、优良作风","C":"凝聚着中国共产党人艰苦奋斗、牺牲奉献、开拓进取的伟大品格","D":"极大丰富了中国精神的内涵，鼓舞和激励中国人民攻坚克难"},"answer":"ABCD","analysis":"以伟大建党精神为源头的中国共产党人精神谱系，是中国共产党领导人民在团结奋斗中共同创造的，集中体现了党的坚定信念、根本宗旨、优良作风，凝聚着中国共产党人艰苦奋斗、牺牲奉献、开拓进取的伟大品格，极大丰富了中国精神的内涵，鼓舞和激励中国人民攻坚克难。ABCD 正确。","distractors":"","extra":"伟大建党精神、中国共产党人的精神谱系与中国精神【《手册》第161-162 页】（1）伟大建党精神是中国共产党的精神之源。四组内容是①坚持真理、坚守理想；②践行初心、担当使命；③不怕牺牲、英勇斗争；④对党忠诚、不负人民。（2）中国共产党人的精神谱系以伟大建党精神为源头。井冈山精神、长征精神、延安精神等是在不同时期的具体体现。（3）中国精神包括以爱国主义为核心的民族精神、以改革创新为核心的时代精神。伟大创造精神、伟大奋斗精神、伟大团结精神、伟大梦想精神，是中华民族精神的重要体现。（4）四个伟大精神：①伟大创造精神：发明创造、科技、文化、工程 ②伟大奋斗精神：开发建设③伟大团结精神：团结、多民族 ④伟大梦想精神：神话故事"},{"id":"苏一-4-31","source":"苏一六套卷 第4套","qno":31,"type":"多选","subject":"思修","stem":"一起涉及多方利益的纠纷引发社会关注。各方对事实经过、责任承担和解决方案存在分歧，网络上也出现了不同评价。面对这类纠纷，运用法治思维分析和解决问题，应当","options":{"A":"以公正、平等、民主、人权等法治理念为价值指引","B":"以法律原则和法律规则为规范依据","C":"以法律手段和法律方法为依托解决纠纷","D":"以社会公众对个案的评价作为认定案件事实的依据"},"answer":"ABC","analysis":"法治思维是一种正当性思维、规范思维、逻辑思维和科学思维。以公正、平等、民主、人权等法治理念为价值指引，体现其正当性。以法律原则和法律规则指导行为，体现其规范性。运用法律手段和法律方法分析问题、解决纠纷，体现其逻辑性。ABC 正确。","distractors":"D 错误，认定案件事实应当以依法查证属实的证据为依据，社会公众对个案的评价不能代替证据证明案件事实。","extra":"法治思维的四层内涵与五项基本内容【《手册》第172 页】（1）四层内涵：四层内涵 判断依据四层内涵 判断依据正当性思维 以法治价值和法治精神为指导，蕴含公正、平等、民主、人权等法治理念。规范思维 以法律原则和法律规则为依据指导行为。逻辑思维 以法律手段与法律方法为依托分析问题、处理问题、解决纠纷。科学思维 符合规律、尊重事实。（2）五项基本内容是法律至上 ①法律的普遍适用；②法律的优先适用；③法律的不可违反①含义：指国家机关的权力必须受到法律的规制和约束权力制约②包括：权力由法定、有权必有责、用权受监督、违法受追究①权利公平（助记：大家平等享有基本权利，权利也受到平等保护）公平正义 ②机会公平（助记：大家有相同的发展机会和发展前景——学习、就业等）③规则公平（助记：同样的事按同样的规则办，谁也没有特权）④救济公平（助记：权利受损后，人人都能依法寻求救济）①宪法保障是权利保障的前提和基础②立法保障是权利保障的重要条件权利保障③行政保障是权利保障的关键环节④司法保障是权利保障的最后防线①合法性（助记：程序合乎法律的规定）②中立性（助记：平等地对待双方当事人）程序正当 ③参与性（助记：当事人有机会表达自己的利益诉求和意见主张）④公开性（助记：依法公开）⑤时限性（助记：在法定期限内办理）权力制约的四项要求【详见：第1 套，第31 题】；权利保障的四个环节【详见：第2 套，第14 题】。国内时政（15 单选；32 多选）"},{"id":"苏一-4-32","source":"苏一六套卷 第4套","qno":32,"type":"多选","subject":"时政","stem":"2026 年7 月10 日，长征十号乙运载火箭在海南商业航天发射场发射升空，成功将卫星送入预定轨道，火箭一级在海上回收平台成功回收，首次发射回收任务取得圆满成功。关于此次发射回收任务取得的突破及其意义，下列表述正确的有","options":{"A":"我国首次成功实施运载火箭一级可控回收","B":"全球首次实现运载火箭海上网系回收","C":"我国重复使用火箭技术取得重大突破","D":"为加快提升我国进出空间能力奠定坚实基础"},"answer":"ABCD","analysis":"此次任务是我国首次成功实施运载火箭一级可控回收，也是全球首次实现运载火箭海上网系回收，标志着我国重复使用火箭技术取得重大突破；将为加快提升我国进出空间能力奠定坚实基础。ABCD 正确。","distractors":"","extra":"火箭回收的对象、方式与意义关键词 内容成功实施运载火箭一子级可控回收。卫星入轨执行任务，回收的是承担上升段部分推我国首次力任务的一子级。全球首次 实现运载火箭海上网系回收。“海上”和“网系”共同限定此次突破。标志着我国重复使用火箭技术取得重大突破，将为加快提升我国进出空间能力奠定坚技术意义 实基础。可控回收使火箭关键部件返回，为检测、维护和重复使用创造条件。此次完成了发射和回收；同一子级再次执行飞行任务才称得上复飞。国际时政（16 单选；33 多选）"},{"id":"苏一-4-33","source":"苏一六套卷 第4套","qno":33,"type":"多选","subject":"时政","stem":"2026 年3 月30 日，世界数据组织成立大会在北京举行。习近平主席在致世界数据组织成立大会的贺信中指出，智能时代数据的作用日益显现，世界数据组织为深化数据国际合作、完善全球数据治理提供了有益平台。该组织的宗旨包括","options":{"A":"弥合数据鸿沟","B":"释放数据价值","C":"统一数据标准","D":"繁荣数字经济"},"answer":"ABD","analysis":"习近平主席在向世界数据组织成立致贺信时指出，当今世界正在加速迈入智能时代，数据的基础资源作用和创新引擎作用日渐显现。世界数据组织以“弥合数据鸿沟、释放数据价值、繁荣数字经济”为宗旨，为深化数据国际合作、完善全球数据治理提供了有益平台。ABD 正确，C 不符合题意。","distractors":"","extra":"世界数据组织：宗旨、大会主题、数据作用①组织宗旨：弥合数据鸿沟、释放数据价值、繁荣数字经济（助记：用得上、用得好、带动发展）。②成立大会主题：“共建数据合作平台·共享数字发展机遇”。③数据的双重作用：数据的基础资源作用和创新引擎作用日渐显现。④组织的作用：为深化数据国际合作、完善全球数据治理提供了有益平台。⑤该组织会员：包括全球数据领域相关企业、高校、智库、国际组织、金融机构等。"},{"id":"苏一-5-1","source":"苏一六套卷 第5套","qno":1,"type":"单选","subject":"马原","stem":"2026 年3 月5 日，习近平总书记在参加十四届全国人大四次会议江苏代表团审议时强调：“江苏要在增强经济韧性上持续用力。”落实这一要求，面对外部环境的不确定性，既要充分估计困难、提前准备应对措施，防止风险突破承受限度，又要积极创造条件，争取更好的发展结果。这种工作方法突出体现的思维方式是","options":{"A":"历史思维","B":"底线思维","C":"创新思维","D":"战略思维"},"answer":"B","analysis":"底线思维是在认识世界和改造世界的过程中，根据需要和客观条件，划清并坚守底线，尽力化解风险，避免最坏结果，同时争取实现最大期望值的一种积极思维。充分估计困难、提前准备应对措施、防止风险突破承受限度，体现了对底线和最坏情形的预判；积极创造条件、争取更好的发展结果，体现了在守住底线的基础上争取主动。因此，题干突出体现的是底线思维。B 正确。","distractors":"A 选项，历史思维是以史为鉴、知古鉴今，善于运用历史眼光认识发展规律、指导现实工作的思维。材料没有通过历史经验指导当前工作的内容，与题意不相符合。C选项，创新思维强调突破常规、超越陈规，因时制宜地开拓创新。材料突出风险预判和底线防守，没有突出对既有思路的突破，与题意不相符合。D 选项，战略思维强调整体性、全局性、长期性，善于统揽全局、把握总体趋势和方向。材料的着重点是避免最坏结果并争取最好结果，与题意不相符合。","extra":"六种思维能力【《手册》第14 页】思维能力 抓住哪个动作辩证思维 发现矛盾、分析矛盾、解决矛盾，把握本质、遵循规律、指导实践。历史思维 以史为鉴、知古鉴今，把历史、现实、未来贯通起来。系统思维 从事物相互联系的各个方面及其结构和功能进行系统思考。【详见：第1 套，第17 题】战略思维 强调整体性、全局性、长期性，把握发展的总体趋势和方向。底线思维 根据需要和客观条件划清并坚守底线，尽力化解风险，避免最坏结果，同时争取实现最大期望值创新思维 突破常规、超越陈规，因时制宜、知难而进、开拓创新。"},{"id":"苏一-5-2","source":"苏一六套卷 第5套","qno":2,"type":"单选","subject":"马原","stem":"《庄子·养生主》记述，庖丁解牛经过长期练习，熟悉了牛体的结构，能够“依乎天理”“因其固然”，顺着筋骨间的空隙运刀。遇到筋骨交错之处，他仍保持谨慎，放慢动作。庖丁顺着牛体结构运刀而能游刃有余，表明","options":{"A":"人对一定问题的判断愈是自由，这个判断的内容所具有的必然性就愈大","B":"人们能够改变客观规律发生作用的条件","C":"感性经验的积累能够自发实现向理性认识的飞跃","D":"意识能够在实践之前形成对活动结果的预期"},"answer":"A","analysis":"自由是对必然的认识和对客观世界的改造。必然性即规律性，是自由的根据和限度；人们只有认识客观必然性，并在实践中按规律办事，才能获得行动的自由。庖丁通过长期练习熟悉牛体结构，按照筋骨间的空隙运刀，并在复杂部位保持谨慎，把对客观结构的认识运用于实际操作，从而做到游刃有余，说明他对牛体结构及解牛规律认识得越深刻，行动就越自由。A 正确。","distractors":"B 说法本身正确，规律具有客观性，人不能改变客观规律本身，但可以改变规律发生作用的条件，但题干强调的是庖丁认识并利用规律，而非改变规律发生作用的条件。C 错误，感性认识向理性认识的飞跃需要经过思考加工，不能自发完成。D 说法正确，意识具有目的性和计划性，能够在实践之前形成对活动结果的预期。但材料没有着重说明活动结果的预先设想。","extra":"【《手册》第21—22 页】①必然性即规律性。自由是对必然的认识和对客观世界的改造。必然性是自由的根据和限度。庖丁能选择运刀路线，是因为筋骨的位置有规律可循。②自由有两个条件。认识条件：认识客观事物的规律。实践条件：把这种认识运用于实践，具备相应必然与自由的手段和能力。知道筋骨在哪里，还要能把刀准确地运到那里。③认识和利用规律的边界。可以改变规律发生作用的条件，不能改变规律本身。【详见：第1 套，第1题】①认识世界和改造世界是人类创造历史的两种基本活动认识世界和 ②认识世界和改造世界统一的基础是实践改造世界 ③主观和客观的矛盾是人类认识和实践活动中的基本矛盾，也是人类认识世界和改造世界的根本动力④认识世界的目的是改造世界"},{"id":"苏一-5-3","source":"苏一六套卷 第5套","qno":3,"type":"单选","subject":"马原","stem":"在自由竞争条件下，资本在不同生产部门之间的转移推动利润率趋于平均化。进入垄断阶段后，垄断资本家却有可能长期获得大大超过平均利润的高额利润。其主要原因在于，垄断组织","options":{"A":"提高了资本的有机构成","B":"加快了资本的周转速度","C":"阻碍了资本在各部门之间的自由转移","D":"扩大了用于积累的剩余价值规模"},"answer":"C","analysis":"垄断资本的实质在于获取垄断利润，垄断利润是垄断资本家凭借其在社会生产和流通中的垄断地位而获得的超过平均利润的高额利润。垄断利润的形成，关键在于垄断组织在经济生活中起了决定性作用，从而阻碍了资本在各部门之间的自由转移，限制了利润平均化的趋势，这样一来，垄断资本家有可能长期获得大大超过平均利润的垄断利润。C正确。","distractors":"A 选项，资本有机构成反映资本技术构成与价值构成的关系，不能说明垄断地位如何阻碍利润平均化。B 选项，加快周转有利于资本增殖，不能说明垄断企业何以长期占有高额利润。D 选项，用于积累的剩余价值规模扩大是资本积累的表现，不能说明垄断资本为什么能够获得超过平均利润的高额利润。","extra":"（1）垄断利润与垄断价格【《手册》第44—45 页】垄断利润是垄断资本家凭借其在社会生产和流通中的垄断地位而获得的超过平均利润的高额利润。垄断利含义 润的形成，关键在于垄断组织在经济生活中起了决定性作用，从而阻碍了资本在各部门之间的自由转移，限制了利润平均化的趋势，这样一来垄断资本家有可能长期获得大大超过平均利润的垄断利润归根到底来自无产阶级和其他劳动人民创造的剩余价值①加强对本国劳动人民的剥削。来源 ②通过垄断高价和垄断低价获得其他企业特别是非垄断企业的一部分利润。③通过对其他国家劳动人民的剥削和掠夺获取利润。④通过国家政权进行有利于垄断资本的再分配。垄断利润主要是通过垄断组织制定的垄断价格来实现的实现方①垄断价格=成本价格（c+v）+ 平均利润+ 垄断利润式②出售商品时规定垄断高价，购买非垄断企业的原材料等生产资料时规定垄断低价①垄断价格的产生没有否定价值规律。因为从全社会看，商品的价格总额仍然等于商品的价值总额价值规 ②垄断价格是价值规律在垄断资本主义阶段作用的具体表现律 ③垄断条件下，价值规律的表现形式是，商品的价格围绕垄断价格自发波动④垄断价格改变价值的分配，不能创造新的价值（2）垄断不能消除竞争的原因【详见：第1 套，第21 题】"},{"id":"苏一-5-4","source":"苏一六套卷 第5套","qno":4,"type":"单选","subject":"马原","stem":"列宁晚年在总结社会主义建设经验时，对小农经济占优势的国家如何建设社会主义进行了深入思考。在无产阶级掌握国家政权和国家经济命脉的条件下，如何引导广大农民走向社会主义，是其中的重要问题。针对这一问题，列宁提出的构想是","options":{"A":"用合作社的形式将农民引向社会主义道路","B":"通过余粮收集制集中农民的剩余产品","C":"以优先发展重工业为中心建立社会主义大工业","D":"通过银行和大工业国有化确立社会主义经济基础"},"answer":"A","analysis":"列宁晚年在领导苏维埃俄国社会主义建设的过程中，提出了建设社会主义的新构想。其中，针对如何引导农民走向社会主义的问题，列宁提出，在无产阶级掌握国家政权和国家经济命脉的条件下，可以通过合作社的形式把农民引向社会主义道路。A 正确。","distractors":"B 选项，余粮收集制是战时共产主义政策的主要内容，不是列宁晚年针对这一问题提出的构想。C 选项，优先发展重工业、建立社会主义大工业，是苏联模式形成过程中实行的工业化方针，不是针对农民问题提出的措施。D 选项，银行和大工业国有化属于进一步巩固苏维埃政权时期的措施，解决的是国家掌握经济命脉的问题，不是题干所问的农民组织形式。","extra":"从战时共产主义政策到建设社会主义的新构想 【《手册》第50 页】（1）战时共产主义时期（外国武装干涉和国内战争时期）。战时共产主义政策的主要特征：余粮收集制和取消商品货币关系（2）新经济政策时期：1921 年3 月，俄共（布）十大决定向新经济政策过渡。主要特征是发展商品经济。以粮食税制取代余粮收集制，允许私人自由贸易，恢复商品货币关系，允许私人小工业企业发展，采取一些国家资本主义的形式发展生产。（3）新经济政策时期，列宁对建设社会主义的新构想。①把建设社会主义作为一个长期探索、不断实践的过程。②把大力发展生产力、提高劳动生产率放在首要地位。③在多种经济成分并存的条件下，利用商品、货币和市场发展经济。④利用资本主义建设社会主义。"},{"id":"苏一-5-5","source":"苏一六套卷 第5套","qno":5,"type":"单选","subject":"毛中特","stem":"毛泽东指出：“农民问题，就成了中国革命的基本问题，农民的力量，是中国革命的主要力量。”在半殖民地半封建的中国，广大农民深受封建地主阶级的压迫和剥削，只有解决农民的土地问题，才能充分发动和组织农民参加革命。由此决定了新民主主义革命的主要内容是","options":{"A":"没收封建地主阶级的土地归农民所有","B":"没收官僚资本归新民主主义国家所有","C":"推翻帝国主义、封建主义和官僚资本主义的统治","D":"处理好土地革命、武装斗争、农村革命根据地建设三者之间的关系"},"answer":"A","analysis":"新民主主义的经济纲领指出，没收封建地主阶级的土地归农民所有，是新民主主义革命的主要内容。要改变中国贫穷落后的面貌，必须废除封建地主土地所有制，进行土地革命，以扫除封建的剥削关系，解放农村生产力。题干强调解决农民土地问题、发动农民参加革命，因此应对应土地革命的内容。A 正确。","distractors":"B 选项，没收官僚资本归新民主主义国家所有，是新民主主义革命的题中应有之义（属于经济纲领内容，但不是“主要内容”）。C 选项，反映的是新民主主义革命的对象——帝国主义、封建主义、官僚资本主义（即三座大山）。D 选项，处理好土地革命、武装斗争、农村革命根据地建设三者之间的关系，是农村包围城市、武装夺取政权道路理论的内容。","extra":"（1）新民主主义的经济纲领【《手册》第59—60 页】没收地主土地 没收封建地主阶级的土地归农民所有，是新民主主义革命的主要内容。没收官僚资本归新民主主义国家所有，是新民主主义革命的题中应有之义，包含着新民主主义没收官僚资本革命和社会主义革命的双重性质。保护民族工商 保护民族工商业，是新民主主义经济纲领中极具特色的一项内容，由中国落后的生产力和新民业 主主义革命的性质所决定。（2）总路线与基本纲领的形成【详见：第2 套，第5 题】"},{"id":"苏一-5-6","source":"苏一六套卷 第5套","qno":6,"type":"单选","subject":"毛中特","stem":"1992 年，邓小平在南方谈话中明确指出：“计划多一点还是市场多一点，不是社会主义与资本主义的本质区别。计划经济不等于社会主义，资本主义也有计划；市场经济不等于资本主义，社会主义也有市场。计划和市场都是经济手段。”这一精辟论述","options":{"A":"明确了我国经济体制改革的目标是建立社会主义市场经济体制","B":"第一次比较系统地论述了我国社会主义初级阶段理论","C":"勾画了建立社会主义市场经济体制的蓝图和基本框架","D":"标志着邓小平的社会主义市场经济理论的形成"},"answer":"D","analysis":"1992 年，邓小平在南方谈话中的精辟论述，从理论上突破了计划经济和市场经济是制度属性的观念，从根本上解除了把计划经济和市场经济看做属于社会基本制度范畴的思想束缚，标志着邓小平的社会主义市场经济理论的形成。这也为党的十四大明确把建立社会主义市场经济体制作为我国经济体制改革的目标奠定了理论基础。D 正确。","distractors":"A 选项，党的十四大明确把建立社会主义市场经济体制作为我国经济体制改革的目标。B 选项，党的十三大第一次比较系统地论述了我国社会主义初级阶段理论。C 选项，党的十四届三中全会通过《中共中央关于建立社会主义市场经济体制若干问题的决定》，勾画了建立社会主义市场经济体制的蓝图和基本框架。","extra":"南方谈话突破了哪一层思想束缚【《手册》第71、155 页】1992 年，邓小平在南方谈话中明确指出：“计划多一点还是市场多一点，不是社会主义与资本主义的本质区别。计划经济不等于社会主义，资本主义也有计划；市场经济不等于资本主义，社会主义也有市场。计划和市场都是经济手段”提出①计划经济和市场经济不是划分社会制度的标志。②计划和市场都是经济手段，对经济活动的调节各有优劣，社会主义实行市场经济是要把两者优势结合起来。③市场经济作为资源配置手段本身不具有制度属性，可以和不同的社会制度结合，从而表现出不同的性质①从理论上突破了计划经济和市场经济是制度属性的观念重要性②从根本上解除了把计划经济和市场经济看做属于社会基本制度范畴的思想束缚（这一精辟③标志着邓小平的社会主义市场经济理论的形成论述）④为党的十四大明确把建立社会主义市场经济体制作为我国经济体制改革的目标奠定了理论基础（2）理论形成、目标确立、框架勾画。①1992 年南方谈话——社会主义市场经济理论形成。②1992 年党的十四大——改革目标确立。③1993 年十四届三中全会——基本框架勾画。理论形成过程【详见：第1 套，第6 题】，改革目标【详见：第4 套，第13 题】。"},{"id":"苏一-5-7","source":"苏一六套卷 第5套","qno":7,"type":"单选","subject":"毛中特","stem":"党的领导是全面的、系统的、整体的。各地区各部门谋划和推进工作，要自觉从党和国家事业全局出发，既立足自身职责，又加强协同配合，防止各行其是。维护党中央权威和集中统一领导的根本要求是","options":{"A":"贯彻落实党中央重大决策部署","B":"科学有效地把权力关进制度笼子","C":"清醒坚定地推进反腐败斗争","D":"不断提高监督执纪执法质效"},"answer":"A","analysis":"习近平强调，贯彻落实党中央重大决策部署，是维护党中央权威和集中统一领导的根本要求，也是党和人民事业不断发展进步的重要历史经验。A 正确，BCD 不符合题意。","distractors":"","extra":"党的领导与党的自我革命【《手册》第82 页】（1）党的领导是全面的、系统的、整体的。全面，覆盖各领域各方面；系统，各级各类组织依照职责发挥作用；整体，各项工作围绕党和国家事业全局协调推进。（2）维护党中央权威和集中统一领导①党中央集中统一领导是党的领导的最高原则，是党保持团结统一和强大战斗力、不断取得胜利的关键所在②党中央的权威首先体现在党的理论和路线方针政策能够不折不扣得到贯彻执行③维护党中央权威和集中统一领导最关键的是坚决维护习近平同志党中央的核心、全党的核心地位④维护党中央权威和集中统一领导，同坚持党的民主集中制是完全一致的（3）“两个维护”：坚决维护习近平总书记党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导。（4）党的自我革命重在治权，把权力关进制度笼子是新时代全面从严治党的一项重要任务。党的二十届五中全会相关内容【详见：第1 套，第15 题】"},{"id":"苏一-5-8","source":"苏一六套卷 第5套","qno":8,"type":"单选","subject":"毛中特","stem":"科技型企业从研发到成果转化，需要不同阶段的资金支持；小微企业和涉农经营主体的发展，也需要更加便捷、适配的金融服务。我国持续做好科技金融、绿色金融、普惠金融、养老金融、数字金融“五篇大文章”，引导金融资源投向重大战略、重点领域和薄弱环节。这些部署表明，金融工作的根本宗旨是","options":{"A":"以人民为中心","B":"金融服务实体经济","C":"防控风险","D":"深化金融供给侧结构性改革"},"answer":"B","analysis":"习近平总书记明确指出，要“坚持把金融服务实体经济作为根本宗旨”。题干中，为科技型企业、小微企业和涉农经营主体提供适配的金融服务，引导金融资源投向重大战略、重点领域和薄弱环节，体现了金融立足实体经济发展需要、提升服务质效的要求。B正确。","distractors":"A 选项，对应金融工作的价值取向；C 选项，对应金融工作的永恒主题，D 选项，对应推进金融高质量发展的主线。题干考查金融工作的根本宗旨，ACD 均不符合题意。","extra":"金融工作的固定搭配与金融五篇大文章（大力推动构建新发展格局）设问 对应表述价值取向 以人民为中心金融服务实体经济（实体经济是金融的根基，金融是实体经济的血脉，为实体经济服根本宗旨务是金融的天职）【《手册》第91 页】永恒主题 防控风险主线 深化金融供给侧结构性改革底线 不发生系统性金融风险金融“五篇大文章：①科技金融（服务科技创新）；②绿色金融（支持绿色低碳转型）；③普惠金融（提高小微企业、“三农”等获得金融服务的便利程度）；④养老金融（服务养老需求）；⑤数字金融（运用数字技术改善金融服务）。"},{"id":"苏一-5-9","source":"苏一六套卷 第5套","qno":9,"type":"单选","subject":"毛中特","stem":"实行“一国两制”，既要坚守“一国”之本，又要发挥“两制”之利。香港、澳门回归祖国后的实践表明，只有把“一国”的底线守得更牢，“两制”的优势才能发挥得更加充分。贯彻“一国两制”方针的最高原则是","options":{"A":"保持香港、澳门长期繁荣稳定","B":"保障特别行政区依法享有高度自治权","C":"维护国家主权、安全、发展利益","D":"“爱国者治港”“爱国者治澳”"},"answer":"C","analysis":"习近平总书记指出：“维护国家主权、安全、发展利益是‘一国两制’方针的最高原则。”C 正确，ABD 不符合题意。","distractors":"","extra":"“一国两制”与香港维护国家安全的实践【《手册》第111 页】（1）“一国”和“两制”的关系：①“一国”是实行“两制”的前提和基础；②“两制”从属和派生于“一国”，并统一于“一国”之内。“一国”之内的“两制”并非等量齐观、比肩并列，国家的主体必须实行社会主义制度。（2）坚持中央全面管治权和保障特别行政区高度自治权相统一：①全面管治权是授权特别行政区高度自治的前提和基础；②高度自治权是中央行使全面管治权的体现；③它们之间是源与流、本与末的关系；④高度自治不是完全自治，也不是分权，而是中央授予的地方事务管理权。（3）坚定落实“爱国者治港”“爱国者治澳”原则。这是事关国家主权、安全、发展利益，事关香港、澳门长期繁荣稳定的根本原则，是保证香港、澳门长治久安的必然要求。（4）坚持依法治港治澳：①宪法和基本法共同构成特别行政区的宪制基础；②宪法和基本法共同构成、共同实施，是“一国两制”下特别行政区制度的本质属性和基本特征。（5）2026 年发布的《“一国两制”下香港维护国家安全的实践》白皮书指出，香港维护国家安全的实践，本质上是坚持和发展“一国两制”事业的实践，是保护750 万香港居民的基本人权、尊严和福祉的实践，是促进世界和平与发展的实践。①安全是国家生存发展的前提，是社会稳定的基础，是人民福祉的保障。保证国家安全是头等大事②中央政府对香港特别行政区有关的国家安全事务负有根本责任（维护国家安全是中央事权），香港特别行政区负有维护国家安全的宪制责任（6）六大基本经验：①坚持中央政府根本责任和特别行政区宪制责任相统一；②坚持把特别行政区管治权牢牢掌握在爱国者手中（把政治安全摆在首位）；③坚持尊重和保障人权；④坚持在法治轨道上维护安全；⑤坚持统筹发展和安全；⑥坚持在开放中维护安全（“一国两制”下香港维护国家安全，塑造的是开放型安全）"},{"id":"苏一-5-10","source":"苏一六套卷 第5套","qno":10,"type":"单选","subject":"史纲","stem":"孙中山在总结辛亥革命失败的教训时指出：“非袁氏兵力之强，实同党人心之涣。”当时，同盟会内部的组织比较松懈，派系纷杂，甚至有人主张“革命军起，革命党消”，有的还另建党派，自立山头。这反映了资产阶级革命派的一个重要弱点是","options":{"A":"没有建立全国性的资产阶级革命政党","B":"没有制定资产阶级民主革命纲领","C":"不能建立坚强的革命政党作为领导核心","D":"不能充分发动和依靠人民群众"},"answer":"C","analysis":"题干材料中的“同党人心之涣”以及同盟会内部组织松懈、派系纷杂等问题，说明资产阶级革命派内部缺乏严密的组织和统一的领导，不能建立坚强的革命政党作为领导核心。C 正确。","distractors":"A 选项，1905 年成立的中国同盟会，是近代中国第一个领导资产阶级革命的全国性政党。革命派的问题不是没有建立政党，而是不能建立坚强的革命政党作为领导核心。B 选项，孙中山提出的三民主义是比较完整的资产阶级民主革命纲领，同盟会也以此为政治纲领，不能说革命派没有制定纲领。D 选项，不能充分发动和依靠人民群众也是资产阶级革命派的弱点，但材料反映的是革命政党组织松懈、领导核心不坚强的问题。【拓展】这场革命之所以失败，从主观方面来说，在于它的领导者资产阶级革命派本身存在着许多弱点和错误。主要是：第一，没有提出彻底的反帝反封建的革命纲领。第二，不能充分发动和依靠人民群众。第三，不能建立坚强的革命政党，作为团结一切革命力量的强有力的核心。资产阶级革命派的这些弱点、错误，根源于中国民族资产阶级的软弱性和妥协性。正因为如此，辛亥革命仅仅赶跑了一个皇帝，却没有能够改变封建主义和军阀官僚政治的统治基础，无法完成反帝反封建的任务。","extra":"【《手册》第126—127 页】（1）辛亥革命的成果与历史局限【详见：第2 套，第10 题】（2）失败的原因根本原因 在帝国主义时代，在半殖民地半封建的中国，资本主义的建国方案是行不通的在于它的领导者资产阶级革命派本身存在着许多弱点和错误。革命派自身的弱点①没有提出彻底的反帝反封建的革命纲领。已有三民主义纲领，“不彻底”和“没有纲领”含义不同。主观原因②不能充分发动和依靠人民群众。③不能建立坚强的革命政党，作为团结一切革命力量的强有力的核心。（资产阶级革命派的这些弱点、错误，根源于中国民族资产阶级的软弱性和妥协性）"},{"id":"苏一-5-11","source":"苏一六套卷 第5套","qno":11,"type":"单选","subject":"史纲","stem":"1927 年9 月，毛泽东领导湘赣边界秋收起义。起义受挫后，毛泽东根据敌我力量对比和革命形势，及时调整起义部队的行动部署。10 月，起义部队抵达井冈山地区，开始创建革命根据地。这一战略调整在中国革命发展进程中的重要意义是","options":{"A":"确定了土地革命和武装起义的方针","B":"打响了武装反抗国民党反动派的第一枪","C":"从组织上确立了党对人民军队的领导","D":"开始了从进攻大城市向农村进军的转变"},"answer":"D","analysis":"9 月9 日，毛泽东等领导的湘赣边界秋收起义爆发。起义军公开打出了“工农革命军”的旗帜，在攻打中心城市长沙受挫后，毛泽东果断改变计划，决定向敌人控制比较薄弱的农村转移。10 月7 日，起义部队抵达江西省宁冈县茅坪，开始了创建井冈山农村革命根据地的斗争。从进攻大城市转到向农村进军，这是中国人民革命史上具有决定意义的新起点。题干中的“调整起义部队的行动部署”与“抵达井冈山地区，开始创建革命根据地”，体现了革命进军方向由城市转向农村。D 正确。","distractors":"A 选项，土地革命和武装起义的方针是八七会议（1927 年8 月7 日）确立的。B 选项，1927 年8 月1 日，南昌起义打响了武装反抗国民党反动派的第一枪。C 选项，1927 年9 月29 日，毛泽东领导起义军在江西永新县三湾村进行了著名的三湾改编，从组织上确立了党对军队的领导。三湾改编是建设无产阶级领导的新型人民军队的重要开端。","extra":"1927 年：政治方针、军队建设与革命道路【《手册》第134—135 页】①8 月1 日，南昌起义，打响武装反抗国民党反动派的第一枪。②8 月7 日，八七会议，确定土地革命和武装起义的方针。③9 月，湘赣边界秋收起义，公开打出工农革命军旗帜；起义受挫后，开始从进攻大城市向农村进军。④9 月29 日，三湾改编，把支部建在连上。⑤10 月7 日，起义部队开始了创建井冈山农村革命根据地的斗争，开始创建农村革命根据地。三湾改编与党对军队的领导【详见：第4 套，第11 题】；井冈山革命根据地的意义【详见：第4 套，第27 题】。"},{"id":"苏一-5-12","source":"苏一六套卷 第5套","qno":12,"type":"单选","subject":"史纲","stem":"1936 年12 月，张学良、杨虎城实行“兵谏”，提出停止内战、一致抗日等主张。中国共产党以中华民族团结抗日大局为重，积极促成事变和平解决。西安事变的和平解决成为时局转换的枢纽，标志着","options":{"A":"十年内战局面基本结束，国内和平初步实现","B":"中国人民抗日救亡运动新高潮的到来","C":"以国共两党第二次合作为基础的抗日民族统一战线正式形成","D":"中国进入全民族抗战阶段"},"answer":"A","analysis":"西安事变发生后，党中央以中华民族团结抗日大局为重，独立自主确定了用和平方式解决西安事变的方针。周恩来与张学良、杨虎城共同努力，经过谈判，迫使蒋介石作出“停止剿共，联红抗日”的承诺。西安事变的和平解决成为时局转换的枢纽，十年内战局面基本结束，国内和平初步实现。A 正确。","distractors":"B 选项，1935 年的一二·九运动，促进了中华民族觉醒，标志着中国人民抗日救亡运动新高潮的到来。C 选项，1937 年9 月22 日，国民党中央通讯社发表《中共中央为公布国共合作宣言》；23 日，蒋介石发表实际上承认共产党合法地位的谈话，标志着以国共两党第二次合作为基础的抗日民族统一战线正式形成。D 选项，1937 年卢沟桥事变（七七事变）爆发后，当地中国驻军奋起抵抗，中国由此进入全民族抗战阶段。","extra":"（1）四个标志按时间区分【《手册》第137—138 页】时间 事件 标志或影响1935 年12 月 一二·九运动 中国人民抗日救亡运动新高潮的到来。十年内战的局面基本结束，国内和平初步实现，为建立抗1936 年12 月 西安事变和平解决日民族统一战线准备了必要前提。1937 年7 月 卢沟桥事变 中国进入全民族抗战阶段。国共合作宣言发表，蒋介石发表实1937 年9 月 以第二次国共合作为基础的抗日民族统一战线正式形成。际上承认共产党合法地位的谈话（2）瓦窑堡会议的方针与口号【详见：第4 套，第28 题】"},{"id":"苏一-5-13","source":"苏一六套卷 第5套","qno":13,"type":"单选","subject":"史纲","stem":"1946 年1 月10 日，政治协商会议在重庆开幕，出席会议的有国民党、共产党、民主同盟、青年党和无党派人士代表共38 人。以周恩来为首的中共代表团与民主同盟等民主党派和无党派人士的代表密切合作，同国民党当局认真协商，推动政协会议达成政府组织案、国民大会案、和平建国纲领、军事问题案、宪法草案案五项协议。对政协的上述协议，共产党表示赞同并决心严格履行，这是因为它有利于","options":{"A":"奠定中国共产党领导的多党合作和政治协商制度的基础","B":"冲破蒋介石的独裁统治和实行民主政治、和平建国","C":"从根本上摧毁封建制度的根基","D":"改变国共两党军事力量对比"},"answer":"B","analysis":"1946 年1 月10 日，国共双方下达停战令。同一天，政治协商会议在重庆开幕。以周恩来为首的中共代表团与民主同盟等民主党派和无党派人士的代表密切合作，同国民党当局认真协商，推动政协会议达成五项协议。政协会议协议，还不是新民主主义性质的，但它有利于冲破蒋介石的独裁统治和实行民主政治，有利于和平建国，因而在相当程度上有利于人民。因此，中国共产党表示赞同政协协议，并准备严格履行。B 正确。","distractors":"A 选项，这是1948 年“五一口号”的意义。C 选项，土地制度改革，是中国共产党领导广大农民从根本上摧毁封建制度根基的社会大变革，并非政协协议的作用。D 选项，政协协议是政治层面的协商成果，不会改变国共两党的军事力量对比，当时国民党在军事上仍占据明显优势。【拓展】①1948 年4 月30 日，中共中央在纪念五一国际劳动节的口号中提出：“各民主党派、各人民团体、各社会贤达迅速召开政治协商会议，讨论并实现召集人民代表大会，成立民主联合政府。”这个号召得到各民主党派和社会各界的热烈响应，揭开了中国共产党同各党派、各团体、各族各界人士协商建国的序幕，奠定了中国共产党领导的多党合作和政治协商制度的基础。②1949 年中国人民政治协商会议第一届全体会议的召开，标志着中国共产党领导的多党合作和政治协商制度正式确立。","extra":"从重庆政协到新政协（1）重庆谈判与重庆政治协商会议【《手册》第144—145 页】①毛泽东赴重庆谈判：1945 年10 月10 日，双方签署《政府与中共代表会谈纪要》（双十协重庆谈判 定），确认和平建国的基本方针，同意“长期合作，坚决避免内战”②毛泽东赴重庆谈判的目的是：争取和平民主①1946 年1 月10 日，政治协商会议在重庆开幕，出席会议的有国民党、共产党、民主同盟、青年政治协商 党和无党派人士代表共38 人。②中共推动政协会议达成政府组织案、国民大会案、和平建国纲会议 领、军事问题案、宪法草案案五项协议。③政协会议协议，还不是新民主主义性质的，但它有利于冲破蒋介石的独裁统治和实行民主政治，有利于和平建国，因而在相当程度上有利于人民（2）1948 年“五一口号”及各民主党派的响应，奠定了中国共产党领导的多党合作和政治协商制度的基础。此后各民主党派的《对时局的意见》及毛泽东的谈话【详见：第1 套，第13 题】。【《手册》第147 页】（3）1949 年9 月，中国人民政治协商会议第一届全体会议召开，标志着中国共产党领导的多党合作和政治协商制度正式确立。《共同纲领》的基础与作用【详见：第3 套，第13 题】。【《手册》第148 页】"},{"id":"苏一-5-14","source":"苏一六套卷 第5套","qno":14,"type":"单选","subject":"思修","stem":"建设中国特色社会主义法治体系，既要使已经制定的法律得到有效实施，也要加强对权力运行的制约和监督。其中，以规范和约束公权力运行为重点的是","options":{"A":"完备的法律规范体系","B":"高效的法治实施体系","C":"有力的法治保障体系","D":"严密的法治监督体系"},"answer":"D","analysis":"法治监督体系以规范和约束公权力的运行为重点。建设严密的法治监督体系是加强对权力运行制约和监督的迫切要求。D 正确。","distractors":"A 选项，完备的法律规范体系是中国特色社会主义法治体系的前提；B 选项，高效的法治实施体系是建设中国特色社会主义法治体系的重点；C 选项，有力的法治保障体系是全面依法治国的重要依托。ABC 均不符合题意。","extra":"中国特色社会主义法治体系的五个组成部分【《手册》第171 页】组成部分 地位与作用完备的法律规范体系 中国特色社会主义法治体系的前提高效的法治实施体系 建设中国特色社会主义法治体系的重点严密的法治监督体系 宪法法律有效实施的重要保障，加强对权力运行制约和监督的迫切要求有力的法治保障体系 全面依法治国的重要依托组成部分 地位与作用中国特色社会主义法治体系的本质要求和重要内容完善的党内法规体系 （把党内法规体系纳入中国特色社会主义法治体系，是我国法治区别于其他国家法治的鲜明特征）三组固定搭配：①建设中国特色社会主义法治体系是全面依法治国的总抓手②法治政府建设是全面依法治国的重点任务和主体工程③法治体系是国家治理体系的骨干工程辨析：法律体系强调各法律部门构成的统一整体；法治体系还包括法律怎样实施、受到怎样的监督、靠什么保障。（2016 年30 题考过）"},{"id":"苏一-5-15","source":"苏一六套卷 第5套","qno":15,"type":"单选","subject":"时政","stem":"2026 年10 月21 日，中共中央办公厅、国务院办公厅《关于推动科技创新和产业创新深度融合的意见》对外发布。意见要求，深入实施创新驱动发展战略，重点在于","options":{"A":"促进科技成果转化应用","B":"增加高质量科技供给","C":"强化企业科技创新主体地位","D":"构建企业主导、各主体协同的产学研融通创新体系"},"answer":"D","analysis":"《关于推动科技创新和产业创新深度融合的意见》要求，深入实施创新驱动发展战略，以发展新质生产力、建设现代化产业体系为目标，以构建企业主导、各主体协同的产学研融通创新体系为重点，形成科技创新和产业创新互融共促新格局。D 正确，ABC 均不符合题意。","distractors":"","extra":"《关于推动科技创新和产业创新深度融合的意见》的目标和重点定位 对应内容目标 发展新质生产力、建设现代化产业体系。重点 构建企业主导、各主体协同的产学研融通创新体系。企业提出生产需求，高校、科研院所参与攻关。关于科技创新和产业创新深度融合的固定搭配【详见：第1 套，第7 题】"},{"id":"苏一-5-16","source":"苏一六套卷 第5套","qno":16,"type":"单选","subject":"时政","stem":"2026 年是《中朝友好合作互助条约》签订65 周年。2026 年6 月8 日，中共中央总书记、国家主席习近平在平壤锦绣山迎宾馆同朝鲜劳动党总书记、国务委员长金正恩举行会谈。习近平总书记指出，中朝关系的最大优势是","options":{"A":"社会主义共同理想","B":"最高领导人战略引领","C":"命运与共的传统友谊","D":"高水平战略协作二、多项选择题：17～33 小题，每小题2 分，共34 分。下列每题给出的四个选项中，至少有两个选项是符合题目要求的。"},"answer":"B","analysis":"习近平总书记在同金正恩举行会谈时指出：“最高领导人战略引领是中朝关系的最大优势。”B 正确，ACD 不符合题意。二、多项选择题：17～33 小题，每小题2 分，共34 分。下列每题给出的四个选项中，至少有两个选项是符合题目要求的。","distractors":"","extra":"2026 年6 月平壤会谈与署名文章：中朝关系四组搭配设问 对应表述设问 对应表述最大优势 最高领导人战略引领（会谈报道用语）；“最高层战略引领”（署名文章用语）鲜明底色 社会主义共同理想深厚根基 命运与共的传统友谊时代内涵 高水平战略协作"},{"id":"苏一-5-17","source":"苏一六套卷 第5套","qno":17,"type":"多选","subject":"马原","stem":"研究人员在贝努小行星返回样品中发现了核糖和葡萄糖，此前还在这些样品中检测到氨基酸等有机分子。通过采集和分析地外样品，人们对太阳系中有机物分布及其演化的认识不断拓展。这些发现从一个侧面说明","options":{"A":"物质世界的存在范围随着人类认识的发展而扩大","B":"世界的物质统一性不排斥具体物质形态的差异","C":"世界上只有尚未认识之物，没有不可认识之物","D":"物质结构理论的更新意味着哲学物质范畴的改变"},"answer":"BC","analysis":"世界的统一性在于它的物质性，这种统一是多样性的统一，而不是单一、无差别的统一。地球与小行星的具体环境、物质形态存在差异，但地外样品中同样存在多种有机分子，从一个侧面说明具体物质形态的差异并不否定世界的物质统一性，B 正确。辩证唯物主义坚持可知论，认为思维能够正确认识存在，世界上只有尚未认识的事物，没有不可认识的事物。人们通过采集和分析地外样品，不断拓展对太阳系有机物分布及其演化的认识，说明认识条件的限制并不意味着对象不可认识，C 正确。","distractors":"A 错误，物质世界是客观存在的，不依赖人的认识而存在。随着科学研究发展而扩展的是人类认识所达到的范围，不能把认识范围的扩展等同于物质世界存在范围的扩大。D 错误，哲学物质范畴概括各种具体物质形态共同的客观实在性，物质结构理论研究具体的物质形态及其结构。具体科学认识的更新，不会否定物质的客观实在性，不能据此认为哲学物质范畴随之改变。","extra":"世界的物质统一性与可知性【《手册》第4、7 页】（1）统一于什么。①世界是统一的，即世界的本原只有一个。②世界的统一性在于它的物质性。③世界的物质统一性是多样性的统一。物质的唯一特性是客观实在性，运动是物质的根本属性。（2）从哪里体现。①自然界是物质的。②人类社会本质上是生产实践基础上形成的物质体系。③人的意识统一于物质。意识是客观世界的主观映象，意识本身具有主观性。【详见：第1 套，第19 题】（3）两个哲学问题。先问“物质与意识何者为第一性”，区分唯物主义和唯心主义；再问“思维能否认识存在”，区分可知论和不可知论。发现有机分子支持可知性，一次发现并不意味着认识已经穷尽。（4）关于物质的客观实在性：【《手册》第4、183 页】哪些概念是 物质的存在不依赖于人的意识。科学发现拓展了人的认识范围，物质世界的存在范围不取决于人客观的 是否认识它。不能改变 规律及其客观性不能改变。人不能创造、改变、消灭、摆脱规律，可以认识、利用规律。①规律发挥作用的条件可以改变。在尊重规律的前提下，才可以改变可以改变②物质的性质和结构、状态可以改变，但是需要尊重规律，不能任意改变"},{"id":"苏一-5-18","source":"苏一六套卷 第5套","qno":18,"type":"多选","subject":"马原","stem":"《吕氏春秋·本味》论烹调，讲究调味的“先后多少”，要求做到“熟而不烂”“酸而不酷”“辛而不烈”。烹调既要根据食材的特性掌握火候和调味分量，使食物由生变熟，又要避免加热或调味过度，以获得适宜的口感。这些要求蕴含的哲学道理有","options":{"A":"保持事物质的稳定性需要把量变控制在一定范围内","B":"质变是事物由低级向高级发展的基本标志","C":"实践中既要促成必要的质变也要防止不利的质变","D":"任何成功的实践都是真理尺度和价值尺度的统一"},"answer":"ACD","analysis":"度是保持事物质的稳定性的数量界限，超出度的范围，事物就会发生质变。要保持适宜的食物状态，就应控制加热程度和调味分量，做到“熟而不烂”“酸而不酷”“辛而不烈”，体现了保持质的稳定性需要把量变控制在一定范围内，A 正确。量变达到一定程度会引起质变，实践中应根据目的和条件把握这一过程。使食物由生变熟，需要促成必要的质变；避免过度加热等破坏适宜状态，又需要防止不利的质变，C 正确。任何成功的实践都是真理尺度和价值尺度的统一。依据食材特性掌握火候和调味分量，体现遵循客观规律的真理尺度；获得适宜口感、满足人的需要，体现价值尺度，D 正确。","distractors":"B 错误，质变是事物根本性质的变化，是由一种质态向另一种质态的飞跃，并不必然意味着由低级向高级发展。发展是前进的、上升的运动，其实质是新事物的产生和旧事物的灭亡。把所有质变都视为上升发展，混淆了质变与发展的区别。","extra":"度、量变质变与成功实践的两个尺度（1）度与关节点。度是保持事物质的稳定性的数量界限；度的两端叫关节点或临界点。区分量变和质变的根本标志是变化是否超出度的范围。度是一个范围，关节点是这个范围的界限。【《手册》第11—12 页】（2）量变和质变的辩证关系。①量变是质变的必要准备。②质变是量变的必然结果。③量变和质变相互渗透。总的量变中有阶段性和局部性的部分质变，质变中也有旧质在量上的收缩和新质在量上的扩张。④量变质变规律体现了事物发展的渐进性和飞跃性的统一。要保持原有性质，就坚持适度；需要改变性质，就在量的积累达到条件时促成质变。（3）实践的两种尺度。真理尺度要求遵循事物的本质和规律，价值尺度体现主体的需要和目的。【《手册》第21页】①价值尺度必须以真理为前提辩证统一②人类自身需要的内在尺度，推动着人们不断发现新的真理任何实践活动都是在这两种尺度共同制约下进行的：方法论 ①任何成功的实践都是真理尺度和价值尺度的统一②任何成功的实践都是合规律性和合目的性的统一①实践是客观规律性与主观能动性统一的基础实践的“桥②人的实践活动是合规律性和合目的性的统一梁”作用③人的实践活动要遵循真理尺度与价值尺度的统一④实践是认识世界和改造世界统一的基础"},{"id":"苏一-5-19","source":"苏
