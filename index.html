一六套卷 第5套","qno":19,"type":"多选","subject":"马原","stem":"良渚先民依托当地自然条件发展稻作农业，并修筑水利工程保障生产和生活。美洲的玛雅人以玉米种植为重要的生产活动，留下了与玉米有关的神话叙事和艺术作品。从稻作遗存、水利系统到玉米神形象，这些文明印记体现的哲学道理有","options":{"A":"物质生产活动及生产方式是人类社会赖以存在和发展的基础","B":"自然地理环境决定着不同地区文明的发展样态","C":"文明多样性是社会历史存在和发展的前提","D":"不同文明体现着各自独特的生产和生活方式"},"answer":"AD","analysis":"物质生产活动及生产方式是人类社会赖以存在和发展的基础，是人类其他一切活动的首要前提。良渚先民发展稻作农业、修筑水利工程，玛雅人从事玉米种植，这些生产活动为其生活和文化发展提供了物质基础，A 正确。每一种文明都在特定的自然环境、历史背景和民族传统中生长，体现着独特的生产、生活和交往方式。稻作遗存、水利系统以及玉米神形象等文明印记，分别反映了不同地区人们的生产生活及由此形成的文化特色，D 正确。","distractors":"B 错误，自然地理环境是人类社会生存和发展的必要条件，是生产和生活的自然基础，但不能脱离社会生产而发挥作用，更不能成为决定文明发展样态的力量。不同文明的形成还同生产方式、历史条件等相联系，不能归结为地理环境的决定作用。C 错误，现实的人及其活动是社会历史存在和发展的前提。文明多样性是人们在不同条件下长期实践形成的结果，不能用它替代现实的人及其活动的前提地位。","extra":"（1）社会历史的前提、必要条件和决定力量【《手册》第22—23 页】主语 对应判断现实的人及其活动 社会历史存在和发展的前提。【《手册》第28 页】【详见：第3 套，第2 题】自然地理环境、 都是社会存在和发展的必要条件。人口因素 地理环境提供生活和生产的自然基础，其作用受社会生产发展状况制约。生产力和生产关系的统一，是社会历史发展的决定力量。物质生产方式物质生产是人类其他一切活动的首要前提。（2）玉米种植为玛雅人提供食物，玉米形象又进入神话和艺术，体现社会存在决定社会意识。【详见：第4 套，第2题】"},{"id":"苏一-5-20","source":"苏一六套卷 第5套","qno":20,"type":"多选","subject":"马原","stem":"随着自动化、智能化技术的发展，一些资本主义企业将越来越多的生产操作交由机器完成，直接操作机器的工人减少，参与生产的科研、设计、技术和管理人员增加。生产过程日益成为不同岗位劳动者分工协作的过程，每个劳动力所推动的生产资料数量也不断增加。这表明","options":{"A":"自动化设备只转移自身价值而不创造新价值","B":"自动化设备已经成为剩余价值的主要来源","C":"率先使用机器人的个别企业其资本技术构成会提高","D":"机器的资本主义应用可以成为生产相对剩余价值的手段"},"answer":"ACD","analysis":"资本主义条件下的生产自动化，只是意味着剩余价值生产所使用的生产工具更加先进。自动化设备在本质上仍然属于不变资本，只能将自身价值转移到新产品中，不能创造新价值。资本的技术构成是由生产的技术水平所决定的生产资料和劳动力之间的数量比例。个别企业率先使用机器人，使每个劳动力所推动的生产资料数量增加，其资本技术构成会随之提高。机器的使用能够提高劳动生产率；当劳动生产率普遍提高并引起劳动力价值下降时，必要劳动时间缩短、剩余劳动时间相对延长。因此，机器的资本主义应用可以成为生产相对剩余价值的手段。ACD 正确。","distractors":"B 错误，剩余价值是由雇佣工人的剩余劳动创造的。机器人、自动化设备等属于不变资本，只转移自身价值，不能成为剩余价值的来源。","extra":"（1）自动化生产中的价值来源【《手册》第38 页】①生产由科研、设计、技术、操作等岗位的劳动者分工协作完成。②机器人和自动化生产线属于不变资本，只转移原有价值。雇佣工人的剩余劳动仍然是剩余价值的唯一源泉。【详见：第1 套，第3 题】（2）（2）资本构成的三种含义【《手册》第39 页】概念 判断依据资本技术构成 从物质形态看，生产资料和劳动力之间的比例。每名工人推动更多设备，说明技术构成提高资本价值构成 从价值形态看，不变资本和可变资本之间的比例。资本有机构成 由技术构成决定并反映技术构成变化的资本价值构成，通常用c∶v 表示。（3）超额剩余价值与相对剩余价值【《手册》第37—38 页】①个别企业率先提高生产率，商品个别价值低于社会价值，可取得超额剩余价值。②技术普及并使生活资料价值下降，劳动力价值随之下降，必要劳动时间缩短，才构成生产相对剩余价值的条件。【详见：第2 套，第20 题】"},{"id":"苏一-5-21","source":"苏一六套卷 第5套","qno":21,"type":"多选","subject":"马原","stem":"进入21 世纪以来，资本主义生产方式的新变化推动资本积累方式从一般产业资本积累向国际金融垄断资本积累转变，国际金融资本的垄断成为当代资本主义最突出、最鲜明、最主要的特征。国际金融垄断资本主义影响日益显现，主要表现为","options":{"A":"金融垄断寡头化","B":"金融垄断国际化","C":"经济虚拟化、产业空心化","D":"资本占有主体分散化"},"answer":"ABC","analysis":"国际金融垄断资本主义影响日益显现，主要表现为：一是金融垄断寡头化，垄断体系推动财富向少数金融寡头和金融寡头利益集团积聚；二是金融垄断国际化，超巨型跨国公司控制国际产业链、贸易链和优势产业，成为垄断世界市场的关键力量；三是经济虚拟化、产业空心化，实体经济和虚拟经济相分离。ABC 正确。","distractors":"D 选项，国际金融垄断资本的发展使财富逐步向少数金融寡头及其利益集团积聚，体现的是资本控制的集中，而非资本占有主体分散化。【拓展】当代资本主义变化的新特征：第一，科技创新加速资本主义生产方式变化。一是产业结构的调整。二是生产组织和劳动形式的变化。三是新经济形态的出现。第二，国际金融垄断资本主义影响日益显现。一是金融垄断寡头化。二是金融垄断国际化。三是经济虚拟化、产业空心化。第三，社会阶级层级结构呈现复杂性、多样化。第四，发达资本主义国家凭借经济、科技、文化传播等超级优势，在世界范围内推行霸权主义和强权政治。","extra":"（1）金融资本的形成与金融寡头的统治方式【详见：第3 套，第21 题】（2）当代资本主义变化的新特征【《手册》第48 页】一是产业结构的调整。形成了以去工业化、经济虚拟化、金融化为主要特征的产业结①科技创新加速资本主构模式。二是生产组织和劳动形式的变化。数据成为一种新的生产要素。三是新经济义生产方式变化形态的出现。数字经济、智能经济、共享经济等已成为近年来全球经济发展的新形态国际金融资本的垄断是当代资本主义最突出、最鲜明、最主要的特征。一是金融垄断寡头化，回答财富和控制权向谁集中②国际金融垄断资本主 二是金融垄断国际化，回答控制范围如何跨越国界义影响日益显现 三是经济虚拟化、产业空心化，回答经济结构发生什么变化。若设问改成“经济危机的新特点”，要回到危机六点【详见：第4 套，第21 题，手册第47页】③社会阶级层级结构呈现复杂性、多样化④发达资本主义国家凭借经济、科技、文化传播等超级优势，在世界范围内推行霸权主义和强权政治毛中特（5—6 单选；22 多选）"},{"id":"苏一-5-22","source":"苏一六套卷 第5套","qno":22,"type":"多选","subject":"毛中特","stem":"中国革命、建设和改革的实践证明，要运用马克思主义指导实践，必须实现马克思主义中国化，马克思主义之所以能够中国化的原因在于","options":{"A":"马克思主义理论的内在要求","B":"马克思主义与中华民族优秀文化具有相融性","C":"中国革命、建设和改革的实践需要马克思主义指导","D":"马克思主义为中国革命、建设和改革提供了现实的发展模式"},"answer":"ABC","analysis":"①推进马克思主义中国化时代化，是马克思主义理论本身发展的内在要求。作为洞察时代、引领时代的科学理论，马克思主义只有正确运用于实践并在实践中不断发展才能体现其科学性，彰显其强大力量。②马克思主义与中华民族优秀文化具有相融性，能够同中华优秀传统文化相结合。要坚定历史自信、文化自信，坚持古为今用、推陈出新，把马克思主义思想精髓同中华优秀传统文化精华贯通起来、同人民群众日用而不觉的共同价值观念融通起来。③推进马克思主义中国化时代化，是解决中国实际问题的客观需要。马克思主义要在中国发挥指导作用，就必须中国化时代化。只有与中国国情相结合、与时代发展同进步，马克思主义才能真正解决中国的实际问题。ABC 正确。","distractors":"D 选项，马克思主义提供的是科学的立场、观点和方法，不是现成的现实发展模式。中国革命、建设和改革的具体道路，需要结合中国实际探索，不能直接套用。","extra":"【《手册》第53—54 页】（1）马克思主义中国化时代化的提出：1938 年，毛泽东在党的六届六中全会上作了《论新阶段》的报告，标志着“马克思主义中国化”这一命题的正式提出。推进马克思主义中国化时代化的必然性：①是马克思主义理论本身发展的内在要求。②是解决中国实际问题的客观需要。③马克思主义与中华民族优秀文化具有相融性。【注意区分】“一脉相承”与“相融”：①毛泽东思想、中国特色社会主义理论体系与马克思主义是一脉相承又与时俱进的关系②中华民族优秀文化与马克思主义不是一脉相承，而是相融的关系，二者具有相融性（2）马克思主义中国化时代化的内涵①解决中国问题。运用马克思主义的立场、观点、方法，研究和回答中国革命、建设、改革中的实际问三层 ②创造新的理论成果。总结和提炼中国实践经验，使之上升为理论，丰富和发展马克思主义，赋予马克意思 思主义以新的时代内涵③赋予鲜明中国特色。用中国人民喜闻乐见的民族语言阐述马克思主义理论。（3）“两个结合”：把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合。【详见：第2套，第25 题】（4）马克思主义中国化时代化的理论成果及其关系内在关系 马克思主义中国化时代化的理论成果是一脉相承又与时俱进的关系：毛泽东思想和中国特色社会主义理论体系：①都是马克思列宁主义在中国的运用和发展②都以独创性的理论成果丰富和发展了马克思主义的理论宝库③都是党和国家必须长期坚持的指导思想共同点④都是全国各族人民团结奋斗的共同思想基础⑤都具有实事求是的理论精髓⑥都贯穿实事求是、群众路线、独立自主的立场观点方法⑦都科学回答了时代提出的重大理论和实践课题新思想（7—9 单选；23—26 多选）"},{"id":"苏一-5-23","source":"苏一六套卷 第5套","qno":23,"type":"多选","subject":"毛中特","stem":"2026 年9 月，全国先进制造业大会在北京召开，会上学习传达了习近平总书记就发展先进制造业作出的重要指示。党的十八大以来，我国先进制造业不断发展壮大，制造强国建设迈出坚实步伐。新征程上，坚持智能化、绿色化、融合化方向，持续做大做强先进制造业，有利于","options":{"A":"提升产业链自主可控水平","B":"推动产业链各环节实现自主供给","C":"巩固壮大实体经济根基","D":"为推进中国式现代化提供有力支撑"},"answer":"ACD","analysis":"持续做大做强先进制造业，有利于增强关键环节的技术和供给保障能力，提升产业链自主可控水平，A 正确。先进制造业是现代化产业体系的骨干，做大做强先进制造业有利于巩固壮大实体经济根基，C 正确。先进制造业发展壮大，有利于夯实中国式现代化的物质技术基础，为推进中国式现代化提供有力支撑，D 正确。ACD 正确。","distractors":"B 错误，提升产业链自主可控水平，并不是各环节都实现自主供给，而是指对产业链的关键环节具备较强的把控力。","extra":"现代化产业体系：着力点、骨干和发展方向【《手册》第91—92 页】①着力点：坚持把发展经济的着力点放在实体经济上。②骨干：建设以先进制造业为骨干的现代化产业体系。③发展方向：智能化、绿色化、融合化。先进制造业的骨干作用、传统制造业的基底作用【详见：第1 套，第23 题】；先进制造业和现代服务业【详见：第4 套，第26 题】。"},{"id":"苏一-5-24","source":"苏一六套卷 第5套","qno":24,"type":"多选","subject":"毛中特","stem":"一台家电更新换代，一头连着百姓生活，一头连着企业生产。2026 年，我国继续实施消费品以旧换新政策，对冰箱、洗衣机、空调等家电换新给予补贴，让更多绿色、智能产品进入居民家庭。实施消费品以旧换新政策有利于","options":{"A":"推动消费持续扩大","B":"带动优质供给增长","C":"促进经济社会绿色转型","D":"增加居民财产性收入"},"answer":"ABC","analysis":"家电以旧换新补贴降低了居民购买新家电的实际支出，有助于释放更新换代需求，推动消费持续扩大，A 正确。绿色、智能家电需求增加，会引导企业改进产品、扩大优质供给，B 正确。2026 年家电换新补贴支持一级能效或水效产品，有利于推广节能节水家电，减少家庭用能用水，并带动绿色产品供给，促进经济社会绿色转型，C 正确。ABC 正确。","distractors":"D 错误，居民财产性收入主要来自利息、红利、房屋租金等资产收益，家电换新补贴的直接作用是降低居民的购置成本，而不是“增加居民财产性收入”。","extra":"消费与供给的双向作用（构建新发展格局）【《手册》第91 页】以新需求引领新供给，以新供给创造新需求，促进消费和投资、供给和需求良性互动。①需求牵引供给。家庭购买节能家电的需求增加，企业更愿意开发高能效产品。②供给创造需求。新产品更省电、更好用，又能带动新的消费。③以新需求引领新供给，以新供给创造新需求，促进消费和投资、供给和需求良性互动，增强国内大循环内生动力和可靠性。消费与投资的作用、国内大循环怎样畅通【详见：第3 套，第25 题】。③补贴和财产性收入的区别。补贴：一台家电标价3000 元，假设补贴300 元，居民实际支出2700 元，这300 元减轻购置负担——“少花钱”；财产性收入：把房屋出租获得的租金就属于利用财产取得的收益——“获得钱”。绿色生产与绿色生活怎样相互促进【详见：第4 套，第25 题】。"},{"id":"苏一-5-25","source":"苏一六套卷 第5套","qno":25,"type":"多选","subject":"毛中特","stem":"2016 年，习近平总书记提出“共抓大保护，不搞大开发”的明确要求。十年来，长江经济带优良水质比例从67%提升到96.5%，地区生产总值翻了一番多、占全国比重从42.2%提升到47.3%。生态环境改善与经济发展取得的成效表明","options":{"A":"高质量发展和高水平保护是相辅相成、相得益彰的","B":"高水平保护是高质量发展的重要支撑","C":"长江经济带已经实现发展方式绿色转型","D":"改善生态环境就是发展生产力"},"answer":"ABD","analysis":"长江经济带在水质改善的同时实现经济增长，体现了高质量发展和高水平保护相辅相成、相得益彰，A 正确。持续改善水生态环境，为长江经济带的绿色发展创造了有利条件，体现了高水平保护是高质量发展的重要支撑，B 正确。良好生态环境能够增强经济社会发展的潜力和后劲，长江经济带的发展成效体现了改善生态环境就是发展生产力，D正确。ABD 正确。","distractors":"C 错误，当前长江流域生态环境保护和高质量发展仍处于由量变到质变的关键时期，下一步还要加快推动沿江传统产业绿色转型，并非已经实现发展方式绿色转型。","extra":"高质量发展与高水平保护（绿水青山就是金山银山）【《手册》第105—106 页】（1）保护支撑发展。良好的生态环境为经济发展提供资源环境承载力；保护生态环境就是保护生产力，改善生态环境就是发展生产力。（2）发展支撑保护。高质量发展提供资金、技术和治理能力，帮助企业减少污染、提高资源利用效率。（3）长江经济带发展的要求：习近平总书记强调，要“坚持共抓大保护、不搞大开发，坚持生态优先、绿色发展，以科技创新为引领，统筹推进生态环境保护和经济社会发展，加强政策协同和工作协同”。（4）生态产品价值实现：例如，经过核算、核证的林业碳汇可以通过交易取得收益。生态优势转化为发展优势，需要制度安排和保护、经营等具体实践。（5）绿水青山就是金山银山①生态环境问题归根到底是经济发展方式和生活方式问题②绿水青山就是金山银山，这是重要的发展理念，也是推进现代化建设的重大原则重要性③这一理念阐明了经济发展与生态环境保护之间的关系，揭示了保护生态环境就是保护生产力、改善生态环境就是发展生产力的道理，指明了实现发展和保护协同共生的新路径①生态环境保护和经济发展是辩证统一、相辅相成的关系。要坚持在发展中保护、在保护中发展内容 ②绿水青山既是自然财富、生态财富，又是社会财富、经济财富③处理好绿水青山和金山银山的关系，关键在人，关键在思路"},{"id":"苏一-5-26","source":"苏一六套卷 第5套","qno":26,"type":"多选","subject":"毛中特","stem":"防灾减灾救灾关系人民安危和国家安全。习近平总书记强调，要将安全韧性要求贯穿国土空间规划及各类建设规划之中，合理提高重要城市和灾害多发地区关键基础设施设防标准。统筹做好综合救援、过渡安置和恢复重建工作，切实维护人民群众生命财产安全和社会稳定。树立和践行正确政绩观，坚决纠正重发展轻安全等倾向。这表明","options":{"A":"防灾减灾救灾必须坚持预防为主","B":"维护国家安全必须坚持以人民安全为宗旨","C":"做好防灾减灾救灾工作必须坚持系统观念","D":"把发展和安全统一起来，共同谋划、一体部署、相互促进"},"answer":"ABCD","analysis":"把安全韧性要求贯穿各类规划，提高关键基础设施设防标准，体现了从源头降低灾害风险、坚持预防为主，A 正确。切实维护人民群众生命财产安全，体现了总体国家安全观以人民安全为宗旨，B 正确。统筹综合救援、过渡安置和恢复重建，体现了从整体上把握防灾减灾救灾各环节、坚持系统观念，C 正确。把安全要求贯穿国土空间规划和各类建设规划，并纠正重发展轻安全的倾向，体现了发展和安全共同谋划、一体部署、相互促进，D 正确。ABCD 正确。","distractors":"","extra":"总体国家安全观、发展与安全【《手册》第108—109 页】（1）总体国家安全观的固定搭配【详见：第3 套，第8 题】（2）【时政】习近平总书记关于提高防灾减灾救灾能力的讲话①推动灾害治理向事前预防转型②提升大灾巨灾应对处置能力③强化科技支撑和法治保障④夯实防灾减灾救灾基层基础。基层是抵御自然灾害的第一线⑤认真抓好责任落实（3）发展和安全：发展和安全是一体之两翼、驱动之双轮，必须同步推进①发展解决的是动力问题，是推动国家和民族赓续绵延的根本支撑关系 ②发展具有基础性、根本性，是解决安全问题的总钥匙，发展就是最大的安全③安全解决的是保障问题，是确保国家和民族行稳致远的坚强柱石④安全是发展的条件和保障，没有国家安全，发展只能是“镜花水月”，取得的成果也可能毁于一旦底线 以新安全格局保障新发展格局。牢牢守住安全发展这条底线是构建新发展格局的重要前提和保障史纲（10—13 单选；27—29 多选）"},{"id":"苏一-5-27","source":"苏一六套卷 第5套","qno":27,"type":"多选","subject":"史纲","stem":"1936 年10 月，红四、红二方面军先后同红一方面军会合，标志着三大主力红军的长征胜利结束。习近平在纪念中国工农红军长征胜利90 周年大会上指出，红军长征“胜利实现北上抗日的战略转移，成功开创了中国革命新局面”。长征的胜利","options":{"A":"宣告了国民党反动派消灭中国共产党和红军的图谋彻底失败","B":"保存和锻炼了革命的骨干力量，使党有了新的落脚点和战略基地","C":"铸就了伟大的长征精神，极大地促进了党在政治上和思想上的成熟","D":"为党领导人民开展抗日救亡斗争创造了重要条件"},"answer":"ABCD","analysis":"①长征宣告了国民党反动派消灭中国共产党和红军的图谋彻底失败，宣告了中国共产党和红军肩负着民族希望胜利实现了北上抗日的战略转移，实现了中国共产党和中国革命事业从挫折走向胜利的伟大转折，为党领导人民开展抗日救亡斗争创造了重要条件。②中央红军到达陕北并同红十五军团会合，中国共产党所领导的革命力量有了新的落脚点和战略基地。长征使革命力量在极端艰难的条件下得到保存和锻炼，为继续开展革命斗争保留了骨干。③长征的胜利，极大地促进了党在政治上和思想上的成熟。中国共产党进一步认识到，只有把马克思主义基本原理同中国革命具体实际结合起来，独立自主解决中国革命的重大问题，才能把革命事业引向胜利。④长征铸就了伟大的长征精神，为中国革命不断从胜利走向胜利提供了强大精神动力。ABCD 正确。","distractors":"","extra":"长征胜利与长征精神（1）1936 年10 月，红四、红二方面军先后同红一方面军会合，三大主力会师，标志着长征胜利结束。【《手册》第136—137 页】会师过程【详见：第4 套，第12 题】，长征胜利的历史意义【详见：第2 套，第28 题】。（2）长征精神的五层内容。①把全国人民和中华民族的根本利益看得高于一切，坚定革命理想和信念，坚信正义事业必然胜利。②为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲。③坚持独立自主、实事求是，一切从实际出发。④顾全大局、严守纪律、紧密团结。⑤紧紧依靠人民群众，同人民群众生死相依、患难与共、艰苦奋斗。（习近平《在纪念红军长征胜利80 周年大会上的讲话》）"},{"id":"苏一-5-28","source":"苏一六套卷 第5套","qno":28,"type":"多选","subject":"史纲","stem":"抗日民主根据地是认真贯彻和实现全面抗战路线、争取胜利的坚强阵地。1941 年5 月，中共中央批准颁布的《陕甘宁边区施政纲领》，全面体现了中国共产党关于根据地建设的基本方针。根据地政治民主、政府廉洁、民族团结、经济发展，同国民党统治区形成鲜明对照。“中国的希望在延安”成为许多民主人士的共同感受。抗日民主根据地建设的主要举措有","options":{"A":"实行“三三制”原则和民主集中制","B":"创办干部学校、专门学校和延安自然科学院","C":"实行工农兵代表大会制度","D":"开展大生产运动，厉行精兵简政"},"answer":"ABD","analysis":"①在政权建设上：根据地政权是共产党领导的抗日民族统一战线性质的政权，在工作人员分配上实行“三三制”原则，即共产党员、党外进步人士和中间派各占1/3。抗日民主政权普遍采取民主集中制，各级抗日民主政权机构的领导人都经过人民选举产生。②在经济建设上，停止实行没收地主土地的政策，普遍实行减租减息政策，以减轻农民所受的封建剥削；同时实行交租交息，以利于联合地主阶级抗日。毛泽东提出了“发展经济，保障供给”的经济工作和财政工作总方针，发出了“自己动手，丰衣足食”的号召，领导根据地军民开展了大生产运动。同时，抗日民主政权还厉行精兵简政等，为坚持抗战、争取胜利奠定了物质基础。③文化建设与干部教育上，中国人民抗日军事政治大学、鲁迅艺术学院、马列学院等一批干部学校和专门学校创办起来。1940 年创办了延安自然科学院。全民族抗战开始后，在中国共产党推动和影响下，文化界各抗敌协会相继成立，成为文化界广泛的抗日民族统一战线建立的重要标志。","distractors":"C 选项，工农兵代表大会制度是土地革命战争时期革命根据地实行的政权组织形式，不是抗日民主根据地实行的制度。【拓展】1931 年中华苏维埃共和国实行工农兵代表大会制度，各级苏维埃政府广泛吸收工农群众代表参加政权管理，行使当家作主的权利。","extra":"（1）抗日民主根据地建设的三个方面【《手册》第141—142 页】①加强政权建设，是抗日根据地建设的首要的、根本的任务②根据地政权的性质：共产党领导的抗日民族统一战线性质的政权③在工作人员分配上实行“三三制”原则，即共产党员、党外进步人政权建设 士和中间派各占1/3④抗日民主政权普遍采取民主集中制，各级抗日民主政权机构的领导人都经过人民选举产生⑤抗日民主政权努力发扬政治民主，保障人民民主自由权利⑥实行各民族平等团结、共同抗日的基本政策，在少数民族聚居地区试行民族区域自治①停止实行没收地主土地的政策，普遍实行减租减息政策，以减轻农民所受的封建剥削；同时实行交租交息，以利于联合地主阶级抗日经济建设 ②毛泽东提出了“发展经济，保障供给”的经济工作和财政工作总方针③发出了“自己动手，丰衣足食”的号召，领导根据地军民开展了大生产运动（为克服根据地面临的严重困难，抗日民主政权还厉行精兵简政，减轻财政和人民负担）①中国人民抗日军事政治大学、鲁迅艺术学院、马列学院等一批干部学校和专门学校创办起来。文化建设哲学社会科学和自然科学研究也得到重视，1940 年创办了延安自然科学院与干部教②全民族抗战开始后，在中国共产党推动和影响下，文化界各抗敌协会相继成立，成为文化界广育泛的抗日民族统一战线建立的重要标志（2）各时期土地政策的变化【详见：第3 套，第12 题】【《手册》第212 页】"},{"id":"苏一-5-29","source":"苏一六套卷 第5套","qno":29,"type":"多选","subject":"史纲","stem":"1978 年12 月18 日至22 日，党的十一届三中全会在北京召开。全会决定从1979 年1月起把全党的工作重心转移到社会主义现代化建设上来。全会作出实行改革开放的历史性决策，是基于对党和国家前途命运的深刻把握，是基于对社会主义革命和建设实践的深刻总结，是基于对时代潮流的深刻洞察，是基于对人民群众期盼和需要的深刻体悟。这次全会","options":{"A":"标志着中国共产党开始了在思想、政治、组织等领域的全面拨乱反正","B":"实现了改革由局部探索、破冰突围到系统集成、全面深化的转变","C":"开启了我国改革开放和社会主义现代化建设新时期","D":"提出“所有权同经营权是可以适当分开的”"},"answer":"AC","analysis":"1978 年12 月，党的十一届三中全会在北京召开。①全会冲破长期“左”的错误的严重束缚，彻底否定“两个凡是”的错误方针，重新确立党的实事求是的思想路线。②停止使用“以阶级斗争为纲”的口号，决定把全党工作的着重点转移到社会主义现代化建设上来，作出实行改革开放的历史性决策。③全会的胜利召开，标志着中国共产党重新确立了马克思主义的思想路线、政治路线、组织路线，开启了我国改革开放和社会主义现代化建设新时期，实现了历史性的伟大转折。④全会开始了在思想、政治、组织等领域的全面拨乱反正。AC 正确。","distractors":"B 选项，2013 年召开的党的十八届三中全会，是继党的十一届三中全会之后，又一次具有划时代意义的重要会议，实现了改革由局部探索、破冰突围到系统集成、全面深化的转变。D 选项，1984 年10 月，党的十二届三中全会通过《中共中央关于经济体制改革的决定》，突破把计划经济同商品经济对立起来的观点，指出我国社会主义经济是在公有制基础上的有计划的商品经济，提出“所有权同经营权是可以适当分开的”。会后，经济体制改革以城市为重点全面展开。","extra":"三个“三中全会”与改革进程【《手册》第153—155 页、216 页】①全会否定“两个凡是”，重新确立实事求是的思想路线；停止使用“以阶级斗争为纲”的口号，把工作重点转移到社会主义现代化建设上来，作出改革开放的历史性决策1978 年12 月， ②结束了粉碎“四人帮”后党和国家工作徘徊中前进的局面十一届三中全会 ③标志着中国共产党重新确立了马克思主义的思想路线、政治路线、组织路线④开启了我国改革开放和社会主义现代化建设新时期⑤会议形成了以邓小平同志为核心的党的中央领导集体①全会通过了《中共中央关于经济体制改革的决定》②提出了社会主义经济是在公有制基础上的有计划的商品经济，提出“所有权同经营权1984 年10 月，是可以适当分开的”，突破把计划经济同商品经济对立起来的观点。十二届三中全会③会后，经济体制改革以城市为重点全面展开。改革的中心环节是增强全民所有制企业的活力①全会审议通过《中共中央关于全面深化改革若干重大问题的决定》，对全面深化改革作出系统部署②全会明确全面深化改革的总目标是“完善和发展中国特色社会主义制度，推进国家治2013 年11 月，理体系和治理能力现代化”十八届三中全会③提出“使市场在资源配置中起决定性作用和更好发挥政府作用”等新观点新论断④实现了改革由局部探索、破冰突围到系统集成、全面深化的转变，开创了我国改革开放新局面【《手册》第217 页】思法（14 单选；30—31 多选）"},{"id":"苏一-5-30","source":"苏一六套卷 第5套","qno":30,"type":"多选","subject":"思修","stem":"公共生活是人们在公共空间里发生相互联系、相互影响的共同生活。公共生活的领域越扩大，参与的人越多，对公共秩序的要求也就越高。有序的公共生活是","options":{"A":"社会生产活动的重要基础","B":"提高社会成员生活质量的基本保障","C":"网络空间道德建设的基础","D":"社会文明的重要标志"},"answer":"ABD","analysis":"有序的公共生活是社会生产活动的重要基础、提高社会成员生活质量的基本保障和社会文明的重要标志。良好的公共秩序为生产协作和日常生活提供稳定条件，也体现着社会的文明程度。ABD 正确。","distractors":"C 错误，网络行为主体的文明自律是网络空间道德建设的基础。","extra":"社会公德【《手册》第167 页】公共生活的特征 ①活动范围的广泛性；②活动内容的开放性；③交往对象的复杂性；④活动方式的多样性维护公共秩序的意 有序的公共生活是：①社会生产活动的重要基础；②提高社会成员生活质量的基本保障；义 ③社会文明的重要标志（1）含义：指在社会交往和公共生活中应该遵守的行为准则，是维护公共利益、公共秩序、社会和谐稳定的起码的道德要求，涵盖了人与人、人与社会、人与自然之间的关系（2）社会公德的主要内容：公共生活中的道德①文明礼貌：调整和规范人际关系的行为准则规范②助人为乐（社会公德）③爱护公物：既显示出个人的道德修养水平，也是社会文明水平的重要标志④保护环境⑤遵纪守法：全体公民都必须遵循的基本行为准则，是维护公共生活秩序的重要条件①网络生活中的道德要求，是人们在网络生活中为了维护正常的网络公共秩序需要共同遵网络生活中的道德守的基本道德准则，是社会公德在网络空间的运用和扩展要求②基本要求：正确使用网络工具；加强网络文明自律；营造良好网络道德环境"},{"id":"苏一-5-31","source":"苏一六套卷 第5套","qno":31,"type":"多选","subject":"思修","stem":"国家工作人员就职时依照法律规定公开进行宪法宣誓，体现了宪法在国家政治和社会生活中的重要地位。我国宪法","options":{"A":"是国家各项制度和法律法规的总依据","B":"具体规定了各部门法调整社会关系的全部规则","C":"规定了国家的根本制度","D":"具有最高的法律地位、法律权威、法律效力"},"answer":"ACD","analysis":"宪法是国家的根本法，规定了国家的根本制度。它是国家各项制度和法律法规的总依据，具有最高的法律地位、法律权威、法律效力。ACD 正确。","distractors":"B 错误，宪法为部门法提供根本依据，各部门法在相应领域作出具体规定。","extra":"维护宪法权威【《手册》第172 页】（1）我国宪法的地位：①我国宪法是国家的根本法，是党和人民意志的集中体现；②是国家各项制度和法律法规的总依据，具有最高的法律地位、法律权威、法律效力；③规定了国家的根本制度；④是实现国家认同、凝聚社会共识、促进个人发展的基本准则，是维系一个国家、一个民族凝聚力的根本纽带。（2）我国宪法的基本原则。①党的领导原则；②人民当家作主原则；③尊重和保障人权原则；④社会主义法治原则；⑤民主集中制原则。（3）加强宪法实施和监督：①加强宪法实施：坚持依宪执政；坚持依法立法；坚持严格执法。②完善宪法监督：健全人大工作机制、宪法解释机制、备案审查机制、合宪性审查机制。国内时政（15 单选；32 多选）"},{"id":"苏一-5-32","source":"苏一六套卷 第5套","qno":32,"type":"多选","subject":"时政","stem":"用中长期规划指导经济社会发展，是我们党治国理政的一种重要方式。2026 年3 月12日，《中华人民共和国国家发展规划法》公布施行，对国家发展规划的定位和功能作出明确规定。关于国家发展规划，下列表述正确的有","options":{"A":"是社会主义现代化战略在规划期内的阶段性部署和安排","B":"是规划期内经济社会发展的蓝图和行动纲领","C":"是其他各级各类规划的总遵循","D":"是各类经营主体安排生产经营活动的统一计划"},"answer":"ABC","analysis":"国家发展规划法第四条明确规定，国家发展规划是社会主义现代化战略在规划期内的阶段性部署和安排，是规划期内经济社会发展的蓝图和行动纲领，是其他各级各类规划的总遵循。ABC 正确。","distractors":"D 选项，国家发展规划对经营主体的生产经营活动发挥引导作用，经营主体依法自主安排生产经营活动。","extra":"2026 年国家发展规划法：国家发展规划的定位《中华人民共和国国家发展规划法》第四条①对现代化战略：社会主义现代化战略在规划期内的阶段性部署和安排。②对经济社会发展：规划期内经济社会发展的蓝图和行动纲领。③对政府履职：政府履行经济调节、市场监管、社会管理、公共服务、生态环境保护等职能的重要依据。④对其他规划：其他各级各类规划的总遵循。国家发展规划阐明国家战略意图、明确政府工作重点、引导规范社会主体行为。国际时政（16 单选；33 多选）"},{"id":"苏一-5-33","source":"苏一六套卷 第5套","qno":33,"type":"多选","subject":"时政","stem":"2026 年9 月25 日，全球发展倡议5 周年高级别对话会在纽约联合国总部举行。习近平主席在贺信中指出，发展是人类社会的永恒主题，也是实现人民幸福的关键所在。5 年前在联合国大会上提出全球发展倡议，就是为了","options":{"A":"推动国际发展合作","B":"加强国际人文交流合作","C":"重振全球发展事业","D":"助力加快落实联合国2030 年可持续发展议程"},"answer":"ACD","analysis":"习近平指出，发展是人类社会的永恒主题，也是实现人民幸福的关键所在。5 年前，我在联合国大会上提出全球发展倡议，就是为了推动国际发展合作，重振全球发展事业，助力加快落实联合国2030 年可持续发展议程。ACD 正确，B 不符合题意。","distractors":"","extra":"全球发展倡议五周年（1）目的：2021 年在联合国大会提出，2026 年9 月25 日在五周年高级别对话会贺信中重申：①推动国际发展合作，②重振全球发展事业，③助力加快落实联合国2030 年可持续发展议程。（2）核心理念与原则（六个坚持）：①坚持发展优先；②坚持以人民为中心③坚持普惠包容；④坚持创新驱动；⑤坚持人与自然和谐共生；⑥坚持行动导向。（3）王毅在全球发展倡议5 周年高级别会议上的致辞中提到：短短5 年，倡议已经从中国主张转化为国际共识，从目标对接拓展到丰富实践，赢得国际社会广泛赞誉和积极参与。"},{"id":"苏一-6-1","source":"苏一六套卷 第6套","qno":1,"type":"单选","subject":"马原","stem":"丝绸、茶叶、瓷器等历史经典产业积淀着世代相传的生产技艺。我国推动这些产业开展核心技艺记录和工序复原，利用人工智能解析传统工艺原理，改进生产控制和质量追溯，并通过窑炉节能改造、清洁能源替代等方式改善生产条件。这些举措体现的哲学道理是","options":{"A":"量变是质变的必要准备","B":"矛盾的普遍性寓于特殊性之中","C":"辩证否定是联系和发展的环节","D":"社会意识具有相对独立性"},"answer":"C","analysis":"辩证否定是包含肯定的否定，其实质是“扬弃”，即既克服又保留。否定是新旧事物联系的环节，新事物吸收、保留旧事物中的积极因素；否定也是发展的环节，推动事物克服旧的局限而向前发展。记录核心技艺、复原传统工序，体现对已有积极成果的保留；利用人工智能改进生产控制、开展窑炉节能改造等，体现对原有局限的克服和发展。既继承又改造，体现辩证否定是联系和发展的环节。C 正确。","distractors":"A 选项，量变是质变的必要准备，没有量的积累就不会发生质变。材料着重说明继承与改造相结合，没有呈现量的积累达到一定程度引起质变的过程，与题意不相符合。B 选项，矛盾的普遍性寓于特殊性之中，并通过特殊性表现出来，反映的是共性与个性的关系。材料着重说明对传统技艺的保留与改进，没有着重说明共性通过个性表现，与题意不相符合。D 选项，社会意识具有相对独立性，包括历史继承性、不同形式的相互影响以及对社会存在的反作用等。题干主要说明对产业和技艺既继承又改造的实践做法，单以社会意识的相对独立性不能完整说明这些举措之间的关系，与题意不相符合。","extra":"（1）辩证否定观 【《手册》第11 页】①否定是事物的自我否定，根源在事物内部矛盾。②否定是发展的环节，也是新旧事物联系的环节。③实质是扬弃，即既克服又保留。只讲照搬或全盘抛弃，都割裂了联系与发展。（2）量变与质变的辩证关系【详见：第5 套，第18 题】"},{"id":"苏一-6-2","source":"苏一六套卷 第6套","qno":2,"type":"单选","subject":"马原","stem":"宋濂在《送东阳马生序》中回忆求学经历：“家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。”为解求学之惑，他又“从乡之先达执经叩问”，向前辈学者请教，最终“卒获有所闻”。宋濂的求学经历表明","options":{"A":"间接经验是个人获得知识的重要途径","B":"直接经验是认识世界和改造世界的根本动力","C":"个人知识的积累主要依靠直接经验的增加","D":"间接经验只有转化为个人直接经验才具有真理性"},"answer":"A","analysis":"实践是认识的唯一来源，直接经验和间接经验是个人获得认识的两种途径。直接经验来自亲身实践，间接经验来自对前人、他人认识成果的学习，其最终来源仍然是实践。个人的时间和活动范围有限，不可能事事亲历，大量知识需要通过书本和传授获得。宋濂借书抄录、向前辈学者请教，都是通过学习已有认识成果获得间接经验，说明间接经验是个人获得知识的重要途径。A 正确。","distractors":"B 错误，主观和客观的矛盾是人类认识和实践活动中的基本矛盾，是认识世界和改造世界的根本动力。直接经验是个人亲身实践所获得的认识，属于认识成果，不能代替这一根本动力。C 错误，个人的多数知识来自间接经验，是从书本和传授中获得的。强调实践是认识的来源，并不意味着每个人的知识积累都主要依靠亲身实践，不能混淆认识的来源与个人获得认识的途径。D 错误，认识是否具有真理性取决于是否正确反映客观事物及其规律，检验标准是实践，而不是是否转化为某一个人的直接经验。经过他人实践检验的正确认识，不会因个人尚未亲身经历而失去真理性。","extra":"认识的来源、途径与检验认识的来源 实践是认识的唯一来源。【《手册》第15—16 页】直接经验来自亲身实践，间接经验通过读书、请教等途径获得。间接经验归根到底也获得认识的途径来源于实践。检验真理的标准 实践是检验真理的唯一标准。【详见：第1 套，第18 题】"},{"id":"苏一-6-3","source":"苏一六套卷 第6套","qno":3,"type":"单选","subject":"马原","stem":"某资本家投资100 万元创办企业从事生产，其中固定资本60 万元，用于购买机器设备等；流动资本40 万元，用于购买原材料和劳动力等（其中购买劳动力支付了10 万元）。一轮生产结束后，该企业的总资本达到了120 万元。那么，该企业的剩余价值率为","options":{"A":"20%","B":"50%","C":"100%","D":"200%"},"answer":"D","analysis":"题干中资本家投资的100 万元是指全部预付资本，即c+v=100 万元。其中，只有用于购买劳动力的资本属于可变资本，只有这部分资本能够创造剩余价值，实现价值增殖。购买劳动力的资本是10 万元，即v=10 万元。一轮生产之后，总资本达到120 万元，增加的20 万元就是资本家剥削到的剩余价值，即m=20 万元。剩余价值率为剩余价值与可变资本的比值，根据公式：m´=m/v，所以m´=20/10=200%。D 正确。","distractors":"","extra":"（1）分清分子与分母【《手册》第36—38 页】全部预付资本为100 万元，其中可变资本为10 万元。生产后总资本为120 万元，剩余价值为20 万元。①剩余价值率＝剩余价值÷可变资本＝20÷10＝200%。②利润率＝剩余价值÷全部预付资本＝20÷100＝20%。（2）计算中常用的量【《手册》第195 页】公式 字母含义不变资本 c 资本家购买机器、设备、原材料的钱可变资本 v 资本家支付给工人的工资全部预付资本 c+v 全部预付资本＝不变资本＋可变资本。剩余价值 m 雇佣工人的剩余劳动创造并被资本家无偿占有的价值。利润 p 利润用p 表示（在数值上：p=m）剩余价值率 m´=m/v 剩余价值/可变资本利润率 p´= m/（c+v） 剩余价值/全部预付资本"},{"id":"苏一-6-4","source":"苏一六套卷 第6套","qno":4,"type":"单选","subject":"马原","stem":"在资本主义经济中，一家企业可以用历年积累的剩余价值增设工厂，也可以通过兼并把其他企业的工厂置于自己的控制之下。两种方式都能扩大个别资本的规模。关于这两种方式的表述，正确的有①前一种方式体现了资本积累基础上的资本积聚②资本积聚与资本集中是剩余价值资本化的两种方式③后一种方式通过重新组合现有资本实现资本集中④资本集中使社会资本总额随个别资本规模的扩大而增加","options":{"A":"①②","B":"①③","C":"②④","D":"③④"},"answer":"B","analysis":"资本主义生产的唯一动机和直接目的就是追求剩余价值。为了达到这一目的，资本家便尽可能改进技术，提高劳动生产率，加快资本积累，通过资本积聚和资本集中扩大生产规模。①资本积聚（依靠自身积累）是指个别资本通过剩余价值的资本化来增大资本的总量。资本积累是资本积聚的基础，资本积聚是资本积累的直接结果，资本积累越多，资本积聚的规模就越大，个别资本总额就越大。②资本集中（通过外部实现的快速扩张。比如，与其他资本合并）是指个别资本通过结合而形成较大的资本，只是原有社会资本的重新组合与重新分配，不会增加全社会的资本总量。题干中，企业用历年积累的剩余价值增设工厂，体现了资本积累基础上的资本积聚。企业通过兼并把其他企业的工厂置于自己的控制之下，体现的是资本集中。因此，B 正确。","distractors":"②错误，剩余价值资本化就是资本积累，资本积聚以资本积累为基础；资本集中只是现有资本的重新组合，不属于剩余价值资本化。④错误，资本集中能够迅速扩大个别资本的规模，但不会增加社会资本总额。","extra":"（1）资本积累、积聚与集中【《手册》第39 页】资本积累就是剩余价值的资本化。积聚和集中都能扩大个别资本规模。（依靠自身积累）是指个别资本通过剩余价值的资本化来增大资本的总量。资本积聚 资本积累是资本积聚的基础，资本积聚是资本积累的直接结果资本积累越多，资本积聚的规模就越大，个别资本总额就越大（通过外部实现的快速扩张。比如，与其他资本合并）是指个别资本通过结合而形成较大的资本集中资本，只是原有社会资本的重新组合与重新分配，不会增加全社会的资本总量（2）资本积累【《手册》第39 页】剩余价值是资本积累的源泉，资本积累是资本主义扩大再生产的源泉。把剩余价值转化为资本，或者说，剩余价值的资本化。资本积累就是依靠剥削工人所创造含义的剩余价值而实现的，没有剩余价值，就不可能有资本积累资本积累的后果：①是社会财富占有两极分化的重要原因后果 ②是资本主义失业现象产生的根源③导致资本有机构成提高④造成大批工人失业，形成相对过剩人口（劳动力供给＞资本需要）历史趋势 资本积累的历史趋势是资本主义制度的必然灭亡和社会主义制度的必然胜利在资本有机构成提高的情况下，由于可变资本的相对量的减少，资本对劳动力的需求相对直接影响减少，其结果就是不可避免地造成大批工人失业，形成相对过剩人口①含义：劳动力供给超过了资本的需要。相对是由于他们不为资本价值增殖所需要相对过剩人口 ②经常性的庞大失业人口的存在，是资本主义的痼疾。资产阶级政府通过各种干预措施能在一定程度上缓解失业，但不可能彻底消灭失业"},{"id":"苏一-6-5","source":"苏一六套卷 第6套","qno":5,"type":"单选","subject":"毛中特","stem":"毛泽东在分析中国革命道路时指出：“在资本主义国家，城市在实质上形式上都统制了乡村，城市之头一断，乡村之四肢就不能生存。”但在中国，却可以组织“长期的广大的战争”，逐步发展革命力量，最后夺取城市。造成这种差异的根本原因是","options":{"A":"近代中国广大农村具有较好的革命群众基础","B":"近代中国社会政治经济发展极端不平衡","C":"中国共产党掌握了相当力量的正式红军","D":"全国革命形势始终处于不断高涨之中"},"answer":"B","analysis":"近代中国是多个帝国主义间接统治的经济落后的半殖民地国家，社会政治经济发展极端不平衡，四分五裂，军阀割据，存在不少的统治薄弱环节，为党在农村开展革命斗争、建设革命根据地提供了缝隙和可能。题干比较的是中国与资本主义国家革命道路的差异。中国反动统治存在薄弱环节，使革命力量能够在农村保存、发展并开展长期斗争，其根本原因就在于社会政治经济发展的极端不平衡。B 正确。","distractors":"A 选项，属于农村革命根据地能够存在和发展的群众条件。C 选项，相当力量正式红军的存在，为农村革命根据地的创立、巩固和发展提供了坚强后盾。二者都不是题干所问的根本原因。D 选项，“全国革命形势的继续向前发展”，并非“始终处于不断高涨之中”，且这一条件也不是根本原因。【拓展】①近代中国的广大农村深受多重压迫和剥削，人民革命愿望强烈，经历过大革命的洗礼，革命的群众基础好（条件之一，但不是根本原因）②全国革命形势的继续向前发展，为在农村建设革命根据地提供了客观条件③相当力量正式红军的存在，为农村革命根据地的创立、巩固和发展提供了坚强后盾④党的领导的有力量及其政策的不错误，为农村革命根据地建设和发展提供了重要的主观条件","extra":"新民主主义革命道路形成的必然性【详见：第1 套，第28 题】①根本原因：近代中国社会政治经济发展极端不平衡，反动统治存在薄弱环节。②其他条件：广大农村有较好的群众基础，全国革命形势继续向前发展，相当力量正式红军的存在提供坚强后盾，党的有力领导和正确政策提供重要主观条件。【详见：第2 套，第11 题】"},{"id":"苏一-6-6","source":"苏一六套卷 第6套","qno":6,"type":"单选","subject":"毛中特","stem":"1992 年，邓小平在南方谈话中指出，改革开放迈不开步子，不敢闯，说来说去就是怕资本主义的东西多了，走了资本主义道路。他强调，判断改革和各方面工作的是非得失，应该主要看是否有利于发展社会主义社会的生产力，是否有利于增强社会主义国家的综合国力，是否有利于提高人民的生活水平。邓小平提出这一判断标准，主要是为了","options":{"A":"明确社会主义初级阶段是制定路线方针政策的根本依据","B":"破除抽象谈论姓“社”姓“资”的思维定势，推动改革开放","C":"揭示社会主义的根本任务是解放和发展社会生产力","D":"说明共同富裕是中国特色社会主义的根本原则"},"answer":"B","analysis":"坚持解放思想、实事求是，坚持以“三个有利于”作为检验一切工作是非得失的根本标准，破除了在改革开放进程中离开发展生产力抽象谈论姓“社”姓“资”的思维定势，把我国的改革开放和现代化建设推进到一个新的阶段。题干先指出改革开放“不敢闯”的思想障碍，再提出“三个有利于”标准，说明这一标准是要引导人们从改革的实际效果出发作判断，解除思想束缚，推动改革开放。B 正确。","distractors":"A 选项，回答的是制定路线方针政策要从什么实际出发，未针对题干中“不敢闯”的思想障碍。C 选项，发展生产力是“三个有利于”标准中首要的、最根本的一条，但本题问的是提出整个判断标准的主要目的。D 选项，说明的是共同富裕的地位，不是这一判断标准所要直接解决的问题。","extra":"（1）1992 年南方谈话 【《手册》第71 页】①是否有利于发展社会主义社会的生产力。②是否有利于增强社会主义国家的综合国力。③是否有利于提高人民的生活水平。计划与市场的论述【详见：第5 套，第6 题】。（2）解放思想、实事求是与改革实践【《手册》第69—70 页】①坚持解放思想、实事求是，有力推动和保证了拨乱反正的进行②坚持解放思想、实事求是，破除了僵化的社会主义模式观念，坚持走自己的路③坚持解放思想、实事求是，一切从社会主义初级阶段的实际出发④坚持解放思想、实事求是，坚持以“三个有利于”作为检验一切工作是非得失的根本标准，破除了在改革开放进程中离开发展生产力抽象谈论姓“社”姓“资”的思维定势，把我国的改革开放和现代化建设推进到一个新的阶段。"},{"id":"苏一-6-7","source":"苏一六套卷 第6套","qno":7,"type":"单选","subject":"毛中特","stem":"城市发展进入以存量提质增效为主的阶段，既要补齐设施短板，也要让已有空间更好适应居民生活需要。城市现代化建设的重要抓手是","options":{"A":"促进大中小城市和小城镇协调发展","B":"高质量推进城市更新","C":"推进农业转移人口市民化","D":"促进城乡融合发展"},"answer":"B","analysis":"习近平总书记指出：“高质量推进城市更新是城市现代化建设的重要抓手。”题干强调城市发展转向存量提质增效，补齐设施短板、盘活利用已有空间，体现了通过城市更新完善城市功能、满足居民生活需要。B 正确，ACD 不符合题意。","distractors":"","extra":"城市工作相关的固定搭配【《手册》第93 页】（1）目标：建设创新、宜居、美丽、韧性、文明、智慧的现代化人民城市（助记：建成什么样——有创新、住得舒心、环境美、扛得住风险、大家守公德、办事更智能）（2）主题：推动城市高质量发展（助记：发展往哪走——让城市发展质量更高）（3）主线：坚持城市内涵式发展（助记：走哪条路——练内功，把已有的空间用好，把欠缺的公共服务补上）（4）重要抓手：推进城市更新（助记：从哪下手——从城市更新下手，比如改造老小区、补齐养老托育设施）（5）底线：城市安全（助记：什么必须守住——城市再发展，房屋、燃气等安全也得守住）（6）出发点和落脚点：实现人民群众对美好生活向往（为了谁——开工前看群众需要什么，建成后看群众生活有没有变好）（7）阶段变化：我国城镇化正从快速增长期转向稳定发展期，城市发展正从大规模增量扩张阶段转向存量提质增效为主的阶段（助记：两个转向——城镇化从“快”转“稳”，城市发展从“建得多”转向“把已有的建得更好、用得更好”）"},{"id":"苏一-6-8","source":"苏一六套卷 第6套","qno":8,"type":"单选","subject":"毛中特","stem":"中国共产党作为百年大党，如何永葆先进性和纯洁性、永葆青春活力，如何实现长期执政，是必须回答好、解决好的一个根本性问题。在加强党的建设实践中，中国共产党的独特创造是","options":{"A":"开展树立和践行正确政绩观学习教育","B":"严格干部教育培养、选拔任用、管理监督","C":"找到“让人民来监督政府”和“自我革命”两个跳出治乱兴衰历史周期率的答案","D":"确立民主集中制这一马克思主义政党的根本组织原则"},"answer":"C","analysis":"党的二十届五中全会指出，在革命、建设、改革中先后把党的建设作为伟大工程、新的伟大工程，党的十八大以来深入推进新时代党的建设新的伟大工程，找到“让人民来监督政府”和“自我革命”两个跳出治乱兴衰历史周期率的答案，这是中国共产党的独特创造，永载马克思主义政党建设史册。C 正确，ABD 不符合题意。","distractors":"A 选项是一项具体学习教育，B 选项涉及干部队伍建设，D 选项涉及党的根本组织原则。题干考查的是党为跳出治乱兴衰历史周期率作出的独特创造，ABD 均不符合题意。","extra":"人民监督与自我革命【《手册》第116 页】（1）第一个答案：让人民来监督政府（助记：通过人民监督促使政府改进工作）（2）第二个答案：自我革命（助记：党主动发现和解决自身存在的问题）①勇于自我革命，是中国共产党区别于其他政党的显著标志，也是我们党最大的优势、最鲜明的品格②实现伟大自我革命的重要途径：自我净化、自我完善、自我革新、自我提高党的二十届五中全会内容（关于持之以恒推进全面从严治党的固定搭配）【详见：第1 套，第15 题】。"},{"id":"苏一-6-9","source":"苏一六套卷 第6套","qno":9,"type":"单选","subject":"毛中特","stem":"面对世界经济复苏乏力、外部需求波动加剧等挑战，我国必须充分挖掘超大规模市场潜力，增强经济发展的内生动力，以国内循环的稳定性对冲国际循环的不确定性。加快构建新发展格局，必须坚持的战略基点是","options":{"A":"扩大内需","B":"深化供给侧结构性改革","C":"畅通国民经济循环","D":"实现高水平的自立自强"},"answer":"A","analysis":"习近平总书记指出，做强国内大循环，要“坚持扩大内需这个战略基点”。题干强调在外部需求波动加剧的情况下，充分挖掘国内市场潜力，增强经济发展的内生动力。扩大内需有利于使生产、分配、流通、消费各环节更多依托国内市场实现良性循环。A 正确。","distractors":"B 选项，深化供给侧结构性改革是推动高质量发展的主线、大力推动构建新发展格局的主线。C 选项，经济循环的畅通无阻是构建新发展格局的关键。D 选项，实现高水平的自立自强是构建新发展格局最本质的特征。题干考查的是加快构建新发展格局的战略基点，BCD 均不符合题意。","extra":"构建新发展格局的四组搭配【《手册》第91 页】设问 对应判断战略基点 扩大内需主线 深化供给侧结构性改革关键 经济循环畅通无阻最本质的特征 实现高水平的自立自强国内大循环为主体、国内国际双循环相互促进。全国统一大市场的基本要求【详见：第2 套，第7 题】；扩大内需与新发展格局【详见：第3 套，第25 题】。"},{"id":"苏一-6-10","source":"苏一六套卷 第6套","qno":10,"type":"单选","subject":"史纲","stem":"维新派虽然突破洋务派“中体西用”思想的局限，主张用君主立宪制取代君主专制制度，但未能成功地建立起资本主义的君主立宪制度。戊戌维新运动的失败，主要是由于维新派自身的局限以及以慈禧太后为首的强大的守旧势力的反对。维新派在思想上“虽然提倡学习西学，却仍要打着孔子的旗号，借古代圣贤之名‘托古改制’”。这种既提倡学习西学，又借助传统权威推行变法的做法，反映了维新派的局限性是","options":{"A":"没有建立严密的组织","B":"不敢否定封建主义","C":"对帝国主义抱有幻想","D":"惧怕人民群众"},"answer":"B","analysis":"维新派本身的局限性突出地表现在三个方面：不敢否定封建主义、对帝国主义抱有幻想、惧怕人民群众。维新派不敢否定封建主义表现在：他们在政治上，不敢根本否定封建君主制度，只是幻想依靠光绪皇帝“以君权雷厉风行”，通过和平、合法的手段，实现自上而下的改良，让资产阶级和开明士绅的代表参加政权，逐步实现君主立宪。在经济上，他们虽然要求发展民族资本主义，却未触及封建主义的经济基础——封建土地所有制。在思想上，他们虽然提倡学习西学，却仍要打着孔子的旗号，借古代圣贤之名“托古改制”。题干材料是维新派在思想上不敢否定封建主义的表现。B 正确。","distractors":"","extra":"（1）维新派的局限性【《手册》第123 页】三个角度分别记：①对封建主义，不敢否定封建主义；②对外，对帝国主义抱有幻想；③对内，惧怕人民群众。材料如果写借皇权推变法、借孔子讲改制，重点看第一层。（2）维新派不敢否定封建主义的表现：①政治上，不敢根本否定封建君主制度，幻想依靠光绪皇帝逐步实现君主立宪②经济上，未触及封建主义的经济基础，即封建土地所有制③思想上，虽然提倡学习西学，却仍打着孔子的旗号（说明没有彻底否定中学）（3）维新派与守旧派的论战主张 兴民权、设议院、实行君主立宪（1）论战内容：①要不要变法②要不要兴民权、设议院，实行君主立宪维新派与守③要不要废八股、改科举和兴西学旧派的论战（2）意义：这场论战实质上是资产阶级思想与封建主义思想在中国的第一次正面交锋①进一步开阔了新型知识分子的眼界，解放了人们长期受到束缚的思想②西方资产阶级社会政治学说在中国得到进一步的传播，戊戌变法运动的帷幕随之拉开"},{"id":"苏一-6-11","source":"苏一六套卷 第6套","qno":11,"type":"单选","subject":"史纲","stem":"1919 年，李大钊在《再论问题与主义》中指出：“一个社会主义者，为使他的主义在世界上发生一些影响，必须要研究怎么可以把他的理想尽量应用于环绕着他的实境。”他还强调，社会问题“必须有一个根本解决，才有把一个一个的具体问题都解决了的希望”。这些认识表明，中国早期马克思主义者①注意从中国的实际出发学习、运用马克思主义②主张以解决一个一个的具体问题代替社会的根本改造③已在实际上初步形成马克思主义应当与中国具体实际相结合的思想④明确提出马克思主义与中国实际相结合的命题","options":{"A":"①②","B":"①③","C":"②③","D":"③④"},"answer":"B","analysis":"李大钊既肯定马克思主义具有普遍意义，又强调马克思主义是一定时代和社会环境的产物，不能脱离中国的具体环境机械照搬。这表明，中国早期马克思主义者在学习和传播马克思主义的过程中，已经注意从中国实际出发，学习和运用马克思主义理论，实际上初步形成了马克思主义应当与中国具体实际相结合的思想。题干中“把他的理想尽量应用于环绕着他的实境”，强调把理论运用于具体环境，对应①。主张社会问题必须有“根本解决”，并注意把社会主义理想与中国实际相联系，说明当时已初步形成马克思主义应当与中国具体实际相结合的思想，对应③。因此B 正确。","distractors":"对于②，题干强调只有从根本上改造社会，才有解决一个个具体问题的希望，并不是用具体问题的解决代替社会的根本改造，该项颠倒了二者的关系。对于④，早期马克思主义者只是初步形成了结合实际的思想倾向，并未明确提出这一完整命题。1938 年，毛泽东在党的六届六中全会上，才明确提出“马克思主义的中国化”这个命题。","extra":"从早期认识到科学命题①1919 年，李大钊在《再论问题与主义》中强调把理想应用于实际，社会问题需要根本解决。②1938 年，毛泽东在六届六中全会上正式提出马克思主义中国化的命题。【《手册》第53 页】李大钊传播马克思主义的主要文章【详见：第3 套，第27 题】。"},{"id":"苏一-6-12","source":"苏一六套卷 第6套","qno":12,"type":"单选","subject":"史纲","stem":"遵义会议以后，党的路线已走上马克思主义的正确轨道，但对曾经给党的事业造成严重危害的主观主义、教条主义，还没有来得及从思想上进行认真清理。为提高广大党员的思想理论水平，中国共产党开展了延安整风运动。这场运动最主要的任务是","options":{"A":"反对宗派主义以整顿党风","B":"反对主观主义以整顿学风","C":"反对党八股以整顿文风","D":"反对官僚主义以整顿作风"},"answer":"B","analysis":"毛泽东指出，所谓学风，不只是学校的学风，而且是领导机关、全体干部、全体党员的思想方法问题，是对待马克思列宁主义的态度问题，是全党同志的工作态度问题。延安整风运动以反对主观主义整顿学风为最主要的任务。克服主观主义，必须发扬理论联系实际的马克思主义学风，坚持一切从实际出发、实事求是。B 正确。","distractors":"AC 选项，反对宗派主义以整顿党风，反对党八股以整顿文风，也是整风运动的内容，但不是最主要的任务。D 选项，反对官僚主义不是延安整风的内容，这是新中国成立后党内整风的内容。","extra":"延安整风的三项任务【《手册》第142 页】学风 反对主观主义以整顿学风。反对主观主义是最主要的任务。党风 反对宗派主义以整顿党风。文风 反对党八股以整顿文风。整风过程及胜利结束的标志【详见：第2 套，第12 题】。"},{"id":"苏一-6-13","source":"苏一六套卷 第6套","qno":13,"type":"单选","subject":"史纲","stem":"1956 年社会主义改造基本完成。随着中国建立了社会主义基本政治制度，社会主义基本经济制度也建立起来。社会主义基本制度的确立，标志着","options":{"A":"我国开始进入全面建设社会主义的历史阶段","B":"半殖民地半封建社会的结束","C":"马克思主义同中国实际“第二次结合”的完成","D":"中国实现了由农业国向工业国的转变"},"answer":"A","analysis":"1956 年，生产资料所有制的社会主义改造基本完成，社会主义基本制度在中国确立，我国开始进入全面建设社会主义的历史阶段。A 正确。","distractors":"B 选项，1949 年中华人民共和国的成立，标志着半殖民地半封建社会的结束。C 选项，马克思主义同中国实际“第二次结合”是1956 年提出的探索任务，是探索的开端而非完成。D 选项，“一五”计划的实施（从1953 年开始）为我国工业化奠定了初步基础，但1956 年远未实现由农业国向工业国的转变，工业化是需要长期推进的历史任务。【拓展】（1）1949 年，中华人民共和国的成立：①标志着半殖民地半封建社会的结束，新民主主义革命取得基本胜利②标志着中国进入新民主主义社会，开始进行社会主义革命③标志着中国共产党的地位发生了根本性的变化（2）1956 年，社会主义基本制度的确立：标志着中国进入了社会主义社会","extra":"（1）三个制度节点①1949 年，新中国成立，中国进入新民主主义社会。②1954 年，一届全国人大一次会议通过新中国第一部宪法。【《手册》第148 页】③1956 年，社会主义改造基本完成，社会主义基本制度确立。【《手册》第152 页】（2）重要标志①标志着半殖民地半封建社会的结束，新民主主义革命取得基本胜利1949 年，中华人民共和国的成立 ②标志着中国进入新民主主义社会，开始进行社会主义革命③标志着中国共产党的地位发生了根本性的变化1956 年，社会主义改造基本完成 标志着社会主义基本制度在中国确立①标志着中国进入了社会主义社会/社会主义初级阶段1956 年，社会主义基本制度的确立 ②标志着进入开始全面建设社会主义的历史阶段③标志着我国完成了从新民主主义向社会主义的过渡（3）重大意义①是中国历史上最深刻最伟大的社会变革②为当代中国一切发展进步奠定了制度基础③为中国特色社会主义制度的创新和发展提供了重要前提④极大地提高了工人阶级和广大劳动人民的积极性、创造性，极大地促进了我国社会生产1956 年，社会力的发展，初步显示了社会主义的优越性主义基本制度的⑤使广大劳动人民真正成为国家的主人，这是中国几千年来阶级关系的最根本变革确立⑥实现了中华民族由近代不断衰落到根本扭转命运、持续走向繁荣富强的伟大飞跃⑦使占世界人口1/4 的东方大国进入了社会主义社会，这是世界社会主义发展史上又一个历史性的伟大胜利⑧再次证明了马克思列宁主义的真理性，丰富和发展了科学社会主义理论（4 个彻底、2 个实现）①彻底结束了旧中国半殖民地半封建社会的历史②彻底结束了极少数剥削者统治广大劳动人民的历史1949 年，新民 ③彻底结束了旧中国一盘散沙的局面主主义革命的胜 ④彻底废除了列强强加给中国的不平等条约和帝国主义在中国的一切特权利，中华人民共 ⑤实现了中国从几千年封建专制政治向人民民主的伟大飞跃和国的成立 ⑥实现了中国高度统一和各民族空前团结⑦中国人从此站立起来了，中华民族发展进步从此开启了新纪元⑧中国人民从此成为国家、社会和自己命运的主人⑨是具有世界意义的大胜利，是马克思列宁主义在中国的胜利，是毛泽东思想的胜利"},{"id":"苏一-6-14","source":"苏一六套卷 第6套","qno":14,"type":"单选","subject":"思修","stem":"我国民法典规定，以非法拘禁等方式剥夺、限制他人的行动自由，受害人有权依法请求行为人承担民事责任。上述规定所保护的是自然人的","options":{"A":"生命权","B":"健康权","C":"人身自由权","D":"人格尊严权"},"answer":"C","analysis":"人身自由权包括人的行动自由不受非法限制和剥夺。材料中的“非法拘禁”“限制行动自由”直接指向人身自由权。C 正确。","distractors":"A 选项，生命权侧重对生命安全的保护；B 选项，健康权侧重对身心健康的保护；D 选项，人格尊严权侧重对人格尊严的保护。ABD 均不符合题意。","extra":"从行为识别人身权利【《手册》第173 页】人身权利 内容①生命权是人最基本、最原始的权利，具有神圣性与不可转让性，不可非法剥夺，享有生命权是人享有其他各项权利的前提。生命健康权②健康权是在公民享有生命权的前提下，确保自身肉体健全和精神健全、不受任何伤害的权利人身自由是人们一切行动和生活的前提条件，包括人的身体不受拘束，人的行动自人身自由权由、人身自由不受非法限制和剥夺等人格尊严权 包括姓名权、肖像权、名誉权、荣誉权、隐私权等住宅安全权 也称住宅不受侵犯权，即公民居住、生活、休息的场所不受非法侵入或搜查的权利即公民通过书信、电报、传真、电话及其他通信手段，根据自己的意愿进行通信，不通信自由权受他人干涉的权利注意：同一行为可能涉及多项权利，按材料直接强调的侵害判断。"},{"id":"苏一-6-15","source":"苏一六套卷 第6套","qno":15,"type":"单选","subject":"时政","stem":"中国共产党第二十届中央委员会第五次全体会议，于2026 年10 月26 日至29 日在北京举行。全会审议通过了《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》。全会提出，持之以恒推进全面从严治党的统领是","options":{"A":"党的思想建设","B":"党的组织建设","C":"党的纪律建设","D":"党的政治建设"},"answer":"D","analysis":"全会指出，持之以恒推进全面从严治党，必须“以党的政治建设为统领”。D 正确，ABC 不符合题意。","distractors":"","extra":"党的建设的固定搭配（全面从严治党）【《手册》第115 页】①党的政治建设是党的根本性建设把党的政治建设②保证全党服从中央，维护党中央权威和集中统一领导，是党的政治建设的首要任务摆在首位③持之以恒推进全面从严治党遵循的原则之一：坚持以党的政治建设为统领思想建设是党的加强思想教育和理论武装，是党内政治生活的首要任务基础性建设贯彻新时代党的严密党的组织体系是重点，建设高素质专业化干部队伍是关键组织路线①作风问题核心是党同人民群众的关系问题以严的基调强化②加强纪律建设是全面从严治党的治本之策，纪律严明是加强和规范党内政治生活的正风肃纪内在要求和重要保证①党内法规是全面从严治党的重要制度支撑把制度建设贯穿到党的②党内监督是永葆党的肌体健康的生命之源，在党和国家各种监督形式中是最根本各项建设之中的、第一位的党的二十届五中全会内容（关于持之以恒推进全面从严治党的固定搭配）【详见：第1 套，第15 题】。国有企业党建与改革①国有企业是中国特色社会主义的重要物质基础和政治基础，是我们党执政兴国的重要支柱和依靠力量。【《手册》第89 页】②坚持党的领导、加强党的建设，是国有企业的“根”和“魂”。国有企业改革【详见：第3 套，第23 题】。"},{"id":"苏一-6-16","source":"苏一六套卷 第6套","qno":16,"type":"单选","subject":"时政","stem":"2026 年5 月20 日上午，国家主席习近平在北京人民大会堂同来华进行国事访问的俄罗斯总统普京举行会谈。习近平指出，今年是中俄战略协作伙伴关系建立30 周年和《中俄睦邻友好合作条约》签署25 周年。中俄关系最鲜明的特征是","options":{"A":"政治互信","B":"互利合作","C":"民心相通","D":"国际协作二、多项选择题：17～33 小题，每小题2 分，共34 分。下列每题给出的四个选项中，至少有两个选项是符合题目要求的。"},"answer":"A","analysis":"习近平指出，政治互信是中俄关系最鲜明的特征，也是《中俄睦邻友好合作条约》的宗旨和根本原则。A 正确，BCD 不符合题意。二、多项选择题：17～33 小题，每小题2 分，共34 分。下列每题给出的四个选项中，至少有两个选项是符合题目要求的。","distractors":"","extra":"中俄关系与会谈（1）两个周年：中俄1996 年建立战略协作伙伴关系，2026 年是30 周年2001 年签署《中俄睦邻友好合作条约》，2026 年是25 周年（2）部分成果文件①请两国元首签署并发表的文件：《中华人民共和国和俄罗斯联邦关于进一步加强全面战略协作、深化睦邻友好合作的联合声明》②双方共同发表的文件：《中华人民共和国和俄罗斯联邦关于倡导世界多极化和新型国际关系的联合声明》（3）双方要顺应和平、发展、合作、共赢的时代潮流，推动中俄关系实现更高质量发展：①筑牢更高质量政治互信，坚定彼此战略支持。②赋能更高质量互利合作，携手推进各自发展振兴。③推进更高质量民心相通，厚植两国世代友好根基。今明两年举办两国第十个国家级主题年——“中俄教育年”。④开展更高质量国际协作，改革完善全球治理。（4）中国同俄罗斯的关系：2019 年提升为中俄新时代全面战略协作伙伴关系。"},{"id":"苏一-6-17","source":"苏一六套卷 第6套","qno":17,"type":"多选","subject":"马原","stem":"魏格纳根据大陆轮廓、古生物分布等证据提出大陆漂移学说，却未能充分解释大陆为何能够移动。后来，海底探测发现的大洋中脊、海底磁性条带等现象，为海底扩张和板块构造理论提供了证据。通过对这些资料的比较研究，人们认识到，大陆随其所在板块运动，海洋底部也处于不断生成和消减的过程中。这一过程表明，人们对地壳运动的认识","options":{"A":"随着观测手段的改进而获得进一步发展的条件","B":"随着运动机制得到充分解释才开始具有真理性","C":"通过对感性材料的思维加工深化对运动机制的理解","D":"随着实践的发展而不断得到检验和修正"},"answer":"ACD","analysis":"实践的发展为认识提供手段和条件，工具的改进能够扩展人的认识能力。海底探测发现大洋中脊、海底磁性条带等，为进一步认识地壳运动提供了新的资料和条件，A 正确。感性认识有待于发展和深化为理性认识，这一飞跃需要对感性材料进行思考和加工。人们比较研究观测资料，进一步解释大陆随板块运动以及洋底生成、消减的机制，说明通过思维加工能够深化对事物内部联系和规律的认识，C 正确。实践是检验认识真理性的唯一标准，认识在实践、认识、再实践、再认识的过程中不断发展。后续探测和研究既检验了已有认识，也促使人们修正其局限、完善理论解释，D 正确。","distractors":"B 错误，真理是对客观事物及其规律的正确反映，任何具体的真理性认识都具有一定的条件和限度。未能充分解释大陆运动机制，说明当时的认识尚不完善，并不意味着其中关于大陆能够移动的正确认识没有真理性。不能把认识的深化和完善，当作此前认识“才开始”具有真理性的条件。","extra":"实践与认识的发展【《手册》第17 页】①观测手段进步，提供新的感性材料。②对材料进行思维加工，深化对运动机制的认识。认识的两次飞跃【详见：第4 套，第18 题】。③实践发展使已有认识得到检验和修正。实践检验标准的确定性与不确定性【详见：第1 套，第18 题】。"},{"id":"苏一-6-18","source":"苏一六套卷 第6套","qno":18,"type":"多选","subject":"马原","stem":"秸秆含有多种作物所需养分，可以还田培肥，也可以加工成饲料或用作燃料。选择利用方式，需要了解秸秆的属性，并结合当地的生产生活需要：种植地区可以还田培肥，畜牧业发达地区可以加工成饲料，有供热需求的地方可以利用秸秆供暖、烘干粮食。这些做法表明","options":{"A":"客体的价值随着主体对其评价的改变而改变","B":"同一客体可以在满足主体不同需要时呈现多维价值","C":"价值评价以客观事物自身的属性为认识对象","D":"客体的潜在价值能够通过实践转化为现实价值"},"answer":"BD","analysis":"价值是反映主体和客体之间意义关系的哲学范畴，具有多维性。同一客体相对于主体的不同需要，可以产生不同的价值。秸秆用于还田培肥、加工饲料或供热，分别满足不同的生产生活需要，说明同一客体可以呈现多维价值，B 正确。价值关系的形成依赖于主体的创造，客体的潜在价值需要通过实践转化为现实价值。秸秆虽具有相应属性，但要实际满足培肥、饲养或供热需要，还须经过还田、加工、利用等实践活动，说明实践能够实现潜在价值向现实价值的转化，D 正确。","distractors":"A 错误，价值是一种客观存在，独立于人们对它的认识和评价。评价能够反映价值，也可能错误地反映价值，但不能仅凭评价改变客体的实际价值。秸秆利用价值的实现依赖其属性、主体需要以及实际利用活动，并非评价一改变，价值就随之改变。C 错误，价值评价以主客体之间的价值关系为认识对象，评价客体对于主体需要的意义，而不是只认识客观事物自身的属性。了解秸秆属性是评价的必要依据，还必须联系当地的实际需要，才能判断何种用途具有相应价值。","extra":"（1）价值的特性与价值评价【详见：第2 套，第18 题】（2）价值的多维性与实现【《手册》第20—21 页】①价值以客体属性和主体需要为条件。②同一客体的不同属性可以满足多种需要，表现为价值的多维性。③主体通过实践把潜在价值转化为现实价值，再对实际价值作出评价。注意，事物的价值不会自动实现/自然显露。价值要从潜在价值转化为现实价值，必须通过人的实践活动，不能自动实现。（3）知识性认识与价值评价的认【《手册》第21 页】"},{"id":"苏一-6-19","source":"苏一六套卷 第6套","qno":19,"type":"多选","subject":"马原","stem":"针对俄国经济文化落后、不具备实行社会主义条件的论调，列宁在《论我国革命》中指出：“我们为什么不能首先用革命手段取得达到这个一定水平的前提，然后在工农政权和苏维埃制度的基础上赶上别国人民呢？”他强调，俄国特殊历史条件下发展顺序的变化，并不改变世界历史发展的总的路线。这表明","options":{"A":"社会形态更替的统一性不意味着各国发展道路完全相同","B":"对社会历史发展道路的考察应当坚持具体问题具体分析","C":"历史主体对发展道路的选择以一定社会历史条件为基础","D":"历史发展道路的差异源于各民族对社会形态的自由选择"},"answer":"ABC","analysis":"社会形态更替具有统一性和多样性。统一性表现为社会历史发展的一般过程和规律，多样性表现为各国具体道路、顺序和形式的差异。俄国在特殊条件下采取不同的发展顺序，并不改变世界历史发展的总的路线，说明统一性不意味着各国发展道路完全相同，A 正确。矛盾的特殊性要求坚持具体问题具体分析。判断俄国能否采取相应革命道路，应当考察俄国自身的具体历史条件，而不能机械套用其他国家的顺序，B 正确。社会发展的必然性为人们的历史选择提供基础、范围和可能性空间，历史选择不能脱离一定的社会历史条件。列宁的论述把俄国特殊条件同革命后创造发展条件联系起来，体现了历史主体选择以客观条件为基础，C 正确。","distractors":"D 错误，社会历史发展具有客观规律，人们对发展道路的选择受到一定社会历史条件的制约。各国道路的差异体现了社会发展必然性与人们历史选择性的统一，不能归结为各民族脱离客观条件、任意选择社会形态。承认历史选择性，不等于承认不受规律和条件约束的自由选择。","extra":"（1）社会形态更替的特点：【《手册》第26 页】①统一性与多样性。人类社会发展具有一般规律，不同国家和民族的发展道路、进程和具体形式各具特点。②必然性（客观规律性）+ 人们的历史选择性（主观能动性，历史主体可以选择具体道路，选择受生产力水平、历史传统等客观条件制约）（2）社会主义道路多样性的原因【详见：第2 套，第4 题】。"},{"id":"苏一-6-20","source":"苏一六套卷 第6套","qno":20,"type":"多选","subject":"马原","stem":"在资本主义经济中，危机爆发后，生产下降，供求矛盾得到暂时缓和。随着经济复苏和高涨，危机又会发生。关于资本主义经济危机的周期性，下列说法正确的有","options":{"A":"造成相对过剩的制度原因是生产资料的资本主义私有制","B":"经济危机的周期性是由社会资本再生产的周期性特点决定的","C":"从一次危机开始到另一次危机爆发构成一个再生产周期","D":"复苏阶段是资本主义再生产周期的基本阶段"},"answer":"AC","analysis":"①资本主义经济危机的本质特征是生产相对过剩。造成这种相对过剩的制度原因，是生产资料的资本主义私有制，其根本原因是生产社会化和生产资料资本主义私人占有之间的基本矛盾。②资本主义经济危机具有周期性，这是由资本主义基本矛盾运动的阶段性决定的。资本主义基本矛盾有时趋于缓和，有时趋于激化；当矛盾尖锐化时，经济危机就会爆发。危机过后，生产下降、供求矛盾暂时缓和，但资本主义基本矛盾并未消除，随着经济恢复和发展，危机又会重新爆发。从一次危机开始到另一次危机爆发，构成资本主义再生产的一个周期。只要存在资本主义制度，经济危机就是不可避免的。AC 正确。","distractors":"B 错误，资本主义基本矛盾运动的阶段性决定了资本主义经济危机具有周期性。资本主义经济危机周期性爆发的特点，使社会资本再生产也呈现出周期性的特点。D 错误，资本主义再生产周期一般包括危机、萧条、复苏和高涨四个阶段，其中危机阶段是周期的基本阶段和必经阶段。【拓展】关于逻辑：A（资本主义基本矛盾运动的阶段性）→决定了B（资本主义经济危机具有周期性）→决定了C（社会资本再生产也呈现出周期性的特点）【图示】","extra":"（1）经济危机的根源与周期 【《手册》第43 页】根源是资本主义的基本矛盾，即生产社会化与生产资料资本主义私人占有之间的矛盾生产相对过剩是资本主义经济危机的本质特征本质特征生产过剩是相对于劳动人民有支付能力的需求而言的①经济危机的抽象的一般的可能性：首先是由货币作为流通手段和支付手段引起的②资本主义经济危机爆发的根本原因：资本主义的基本矛盾。这一基本矛盾表现在：原因第一，生产无限扩大的趋势与劳动人民有支付能力的需求相对缩小的矛盾第二，单个企业内部生产的有组织性和整个社会生产的无政府状态之间的矛盾①资本主义经济危机具有周期性，这是由资本主义基本矛盾运动的阶段性决定的②经济危机周期性爆发的特点，使社会资本再生产也呈现出周期性特点特点③社会资本再生产包括四个阶段：危机、萧条、复苏、高涨（其中，危机是必经阶段和基本阶段）①经济危机只能得到暂时缓解，而资本主义基本矛盾无法根除结论 ②只要存在资本主义制度，经济危机就是不可避免的③经济危机实际上是资本主义条件下以强制的方式解决社会再生产的实现问题的途径（2）周期性的因果关系：资本主义基本矛盾运动的阶段性决定经济危机的周期性，经济危机的周期性使社会资本再生产呈现周期性。一个周期通常经历危机、萧条、复苏、高涨四个阶段，其中危机是基本阶段。经济危机的新特点【详见：第4 套，第21 题】。"},{"id":"苏一-6-21","source":"苏一六套卷 第6套","qno":21,"type":"多选","subject":"马原","stem":"垄断资本在国内建立垄断统治后，并不满足于已有的市场和投资领域，而是通过跨国公司开展国际性的生产、销售和金融活动，将其势力扩展到国外。推动垄断资本向世界范围扩展的主要经济动因有","options":{"A":"将国内过剩资本输出以谋求高额利润","B":"争夺商品销售市场","C":"确保原材料和能源的可靠来源","D":"实现充分就业和国际收支平衡"},"answer":"ABC","analysis":"垄断资本在国内建立了垄断统治后，必然要把其统治势力扩展到国外，建立国际垄断统治。垄断资本向世界范围扩展的主要经济动因是：首先，将国内过剩的资本输出，以便在国外谋求高额利润；其次，将部分非要害的技术转移到国外，以取得在别国的垄断优势，攫取高额垄断利润；再次，争夺商品销售市场；最后，确保原材料和能源的可靠来源。这些经济上的动因与垄断资本主义在政治上、文化上、外交上的利益紧密联系在一起，交织发挥作用，共同促进了垄断资本向世界范围的扩展。ABC 正确。","distractors":"D 选项，实现充分就业、维持国际收支平衡，是主权国家政府宏观调控的政策目标，并非垄断资本对外扩张的经济动因。垄断资本的对外扩张以追逐利润为核心，不以社会就业、国家收支平衡为目标。【拓展】垄断资本向世界范围扩展的基本形式有三种：第一种是借贷资本输出，即由资本主义国家的政府、银行、企业把资本贷给其他国家的政府、银行、企业。第二种是生产资本输出，即在国外直接投资，独立创办企业，与国外资本合营，或者收购国外已有的企业等。第三种是商品资本输出，即把商品卖到世界各地，不断扩大市场，获取高额利润。","extra":"垄断资本向世界范围扩展 【《手册》第46 页】（1）四个经济动因：资本投向哪里、哪些技术外移、商品卖到哪里、原料从哪里来。①将国内过剩的资本输出，以便在国外谋求高额利润②将部分非要害的技术转移到国外，以取得在别国的垄断优势，攫取高额垄断利润③争夺商品销售市场④确保原材料和能源的可靠来源（2）扩展的三种基本形式：借贷资本输出、生产资本输出、商品资本输出（3）实现形式：垄断资本向世界范围的扩展是通过跨国公司这一国际垄断组织实现的。跨国公司在国际范围组织生产经营，能把投资、供销、金融活动联系起来。毛中特（5—6 单选；22 多选）"},{"id":"苏一-6-22","source":"苏一六套卷 第6套","qno":22,"type":"多选","subject":"毛中特","stem":"以邓小平同志为主要代表的中国共产党人，实现伟大历史转折，吹响改革开放号角，开辟中国特色社会主义道路，创立邓小平理论。邓小平理论","options":{"A":"和马克思主义理论一脉相承","B":"其精髓是解放思想、实事求是","C":"深刻回答了什么是社会主义、怎样建设社会主义这一根本问题","D":"首次提出马克思主义同中国实际进行“第二次结合”的任务"},"answer":"ABC","analysis":"①邓小平理论是马克思列宁主义基本原理同当代中国实际和时代特征相结合的产物，是对马克思列宁主义、毛泽东思想的继承和发展，是全党全国人民集体智慧的结晶。因此，邓小平理论和马克思列宁主义、毛泽东思想一脉相承。②解放思想、实事求是是邓小平理论的精髓。③邓小平理论坚持马克思列宁主义、毛泽东思想的基本原理，坚持辩证唯物主义和历史唯物主义的立场观点方法，坚持马克思主义的思想路线，围绕什么是社会主义、怎样建设社会主义的问题，系统回答了在中国这样经济文化比较落后的东方大国建设、巩固和发展社会主义的一系列基本问题，用一系列独创性的思想、观点，继承、丰富和发展了马克思列宁主义、毛泽东思想。ABC 正确。","distractors":"D 选项，1956 年，毛泽东提出马克思主义同中国实际进行“第二次结合”的任务，不是邓小平理论首次提出的。","extra":"（1）理论主题、精髓与确立 【《手册》第69 页】①根本问题：什么是社会主义、怎样建设社会主义。②精髓：解放思想、实事求是。③1992 年南方谈话推进理论成熟；④1997 年十五大把邓小平理论确立为党的指导思想。（2）邓小平理论：①是马克思列宁主义、毛泽东思想的继承和发展（即一脉相承）②是中国特色社会主义理论体系的开篇之作③是改革开放和社会主义现代化建设的科学指南④深刻回答了什么是社会主义、怎样建设社会主义这一根本问题（3）社会主义本质的完整概括 【详见：第2 套，第6 题】。（4）两次结合①第一次结合：马克思主义与中国新民主主义革命结合，形成了毛泽东思想（已完成）②第二次结合：马克思主义与中国的社会主义建设结合，探索中国社会主义建设道路（提出但未完成）新思想（7—9 单选；23—26 多选）"},{"id":"苏一-6-23","source":"苏一六套卷 第6套","qno":23,"type":"多选","subject":"毛中特","stem":"随着人口流动和学龄人口结构变化，不同地区、不同学段的教育需求出现差异。“十五五”规划纲要提出，加强校长、教师区域内统筹调配、交流轮岗，有序推进小班化教学，办好必要的乡村小规模学校。这些安排既回应人口变化，也兼顾不同地区儿童的入学需要，有利于","options":{"A":"推进义务教育优质均衡发展","B":"为每个孩子平等接受教育创造条件","C":"发挥高等教育在建设教育强国中的龙头作用","D":"让教育改革发展成果更多更公平惠及全体人民"},"answer":"ABD","analysis":"“十五五”规划纲要把教师统筹调配、交流轮岗和办好乡村小规模学校纳入相关部署，有利于优化教育资源配置、缩小校际差距，推进义务教育优质均衡发展，A 正确。根据人口变化调配教育资源、保留必要的乡村学校，有利于兼顾不同地区儿童的入学需要，为每个孩子平等接受教育创造条件，B 正确。城乡儿童都能更便利地获得优质教育资源，有利于让教育改革发展成果更多更公平惠及全体人民，D 正确。ABD 正确。","distractors":"C 选项，属于高等教育的定位表述，但题干是围绕推进义务教育优质均衡发展展开的，并未涉及发挥高等教育的龙头作用，不符合题意。","extra":"教育强国建设相关固定搭配【《手册》第94—95 页】（1）基点在基础教育（义务教育优质均衡既看儿童能否就近入学，也看不同学校能否提供优质教育。轮岗主要改善师资配置，保留必要的乡村小规模学校主要回应入学需要）（2）龙头是高等教育（高等教育承担高层次人才培养和科研创新任务）（3）教育的根本任务：立德树人。（4）人民满意是发展教育的根本尺度。（5）建设高质量教育体系，办好人民满意的教育，根本在于深化教育综合改革（6）建设教育强国，必须牢牢把握教育的政治属性（首位属性）、人民属性、战略属性（7）建设教育强国的主要目标：到2027 年，教育强国建设取得重要阶段性成效；到2035 年，建成教育强国（8）【时政】基础教育工作的要求：①落实健康第一教育理念②牢牢守住教育公平底线③推动学校、家庭、社会同向发力"},{"id":"苏一-6-24","source":"苏一六套卷 第6套","qno":24,"type":"多选","subject":"毛中特","stem":"健康中国建设关系人民生活质量和国家长远发展。习近平总书记强调，“要把保障人民健康融入各项政策”。从规划制定、政策设计到项目论证、工程建设，都要考虑对人民健康的影响。我国坚定实施健康优先发展战略，主要是因为","options":{"A":"人民健康是推动经济社会发展的根本力量","B":"卫生与健康事业具有全局性、基础性作用","C":"人民健康是民族昌盛和国家富强的重要标志","D":"人民健康是促进人的全面发展的必然要求"},"answer":"BCD","analysis":"题干把健康影响纳入规划制定、政策设计和工程建设，体现了卫生与健康事业具有全局性、基础性作用，B 正确。人民健康关系国家长远发展，是民族昌盛和国家富强的重要标志，C 正确。健康关系人的身心发展与生活质量，人民健康是促进人的全面发展的必然要求，D 正确。BCD 正确。","distractors":"A 错误，生产力是人类利用自然、改造自然的能力，是推动经济社会发展的根本力量。","extra":"健康中国建设【《手册》第104 页】（1）人民健康是社会文明进步的基础，是民族昌盛和国家富强的重要标志，是促进人的全面发展的必然要求（2）人民健康是社会主义现代化的重要标志（3）卫生健康事业在经济社会发展中处于基础性地位，拥有健康的人民意味着拥有更强大的综合国力和可持续发展能力（4）【时政】2026 年全国卫生与健康大会①人民健康是民族昌盛和国家强盛的重要标志②推动建成世界上规模最大的医疗服务体系、传统医药体系、疾病防控体系、医疗保障体系，卫生与健康事业取得历史性成就、实现全方位进步③我们要建成的健康中国，是均衡普惠、优质高效的健康中国，应当具有强大的健康管理能力、疾病防控能力、医疗服务能力、医保支撑能力、医药创新能力、人才培养能力（六种能力）④卫生与健康事业具有全局性、基础性作用，必须坚定实施健康优先发展战略⑤预防是最经济最有效的健康策略⑥全面提高医疗服务水平是建成健康中国的一项重点任务⑦改革是卫生与健康事业发展的强大动力，要坚持把推进医疗、医保、医药协同发展和治理作为医药卫生体制改革的主攻方向"},{"id":"苏一-6-25","source":"苏一六套卷 第6套","qno":25,"type":"多选","subject":"毛中特","stem":"江河湖泊是自然生态系统的重要组成部分，也是经济社会发展的重要依托。我国深入推进长江、黄河等大江大河和重要湖泊保护治理，以流域为单元，统筹江河源头至河口、水域和陆域的全域保护，推进山水林田湖草沙一体化保护和系统治理。加强江河保护治理，有利于","options":{"A":"筑牢国家生态安全基础","B":"维护生物多样性和生态系统稳定性","C":"提升适应气候变化能力","D":"促进经济发展与生态保护协调统一"},"answer":"ABCD","analysis":"以流域为单元统筹源头至河口、水域和陆域的全域保护，有利于增强流域生态功能，筑牢国家生态安全基础，A 正确。推进山水林田湖草沙一体化保护和系统治理，有利于保护物种生境、维护生物多样性和生态系统稳定性，B 正确。统筹水灾害、水资源、水生态和水环境治理，有利于增强流域应对极端暴雨、洪水等灾害的韧性，提升适应气候变化能力，C 正确。加强流域生态保护，同时保障生产生活用水、发挥江河综合功能，有利于促进经济发展与生态保护协调统一，D 正确。ABCD 正确。","distractors":"","extra":"以流域为单元的系统治理【《手册》第107 页】（1）治理单元和任务。《关于全面推进江河保护治理的意见》提出，“以流域为单元，统筹推进水灾害、水资源、水生态、水环境治理”。（2）生态保护范围。《意见》要求统筹江河从源头到河口、水域与陆域的全域保护。干流和主要支流构成生态保护带的骨架，湖泊、水库、湿地是其中的节点。（3）全流域管理。《意见》要求强化流域统一规划、统一治理、统一调度，并将流域管理与区域管理、统一管理与分级管理分别结合起来。比如，流域内的骨干水工程实行联合调度，统筹防洪、生态、供水等多种需求。高质量发展与高水平保护、长江治理与发展【详见：第5 套，第25 题】。"},{"id":"苏一-6-26","source":"苏一六套卷 第6套","qno":26,"type":"多选","subject":"毛中特","stem":"“十五五”开局之年，我国统筹推进水网、新型电网、算力网、新一代通信网、城市地下管网、物流网“六张网”规划建设，促进各类基础设施集成融合、协同运行。推进“六张网”建设的重要作用体现在","options":{"A":"深入挖掘内需潜力","B":"消除区域经济发展的不平衡性","C":"推动供需协同、联动升级","D":"加快建设现代化产业体系"},"answer":"ACD","analysis":"推进“六张网”建设，兼顾传统基础设施补短板和新型基础设施布局，有利于带动有效投资、深入挖掘内需潜力，A 正确。基础设施网络相互衔接，有利于提高供给与需求的适配性，推动供需协同、联动升级，C 正确。完善物流、能源、通信和算力等基础设施，有利于为产业协作和转型升级提供支撑，加快建设现代化产业体系，D 正确。ACD 正确。","distractors":"B 属于绝对化表述，推进“六张网”建设有利于优化基础设施布局，促进资源要素流动，缩小区域发展差距，但不能消除区域经济发展的不平衡性。","extra":"“六张网”的建设任务与经济作用（1）六张网：①水网：统筹解决水灾害、水资源、水生态、水环境问题；②新型电网：把越来越多的新能源稳定接入大电网，让绿色电力发得出、送得走、用得稳；③算力网：把全国各地的计算资源连成一张网，可以像拧开水龙头一样，随时随地按需获取算力；④新一代通信网：从6G 到卫星互联网，将实现空天地海一体化；⑤城市地下管网：从“看不见”到“管得住”，燃气、供排水、供热更有保障；⑥物流网：让分散的通道和枢纽连成网，打通货畅其流的“最后一公里”。（2）工作重点：①加强统筹协调，强化跨部门跨领域协调调度。②强化投融资支持。③深化政银企协作。④加强要素保障。（3）扩大内需、促进供需良性互动【《手册》第90—91 页】①总体意义：“六张网”建设既能够稳投资、扩内需，更是增动能、提效益、惠民生、保安全的大事，关系当前和长远发展。②从当前和长远两个角度理解：包括“六张网”在内的重大基础设施建设，当前可以扩大投资、稳定增长，长远可以推动供需协同、联动升级，为产业发展、百姓生活和安全保障提供支撑。投资于物与投资于人【详见：第3 套，第25 题】；消费与供给的双向作用【详见：第5 套，第24 题】。史纲（10—13 单选；27—29 多选）"},{"id":"苏一-6-27","source":"苏一六套卷 第6套","qno":27,"type":"多选","subject":"史纲","stem":"孙中山先生是伟大的民族英雄、伟大的爱国主义者、中国民主革命的伟大先驱，一生以革命为己任，立志救国救民，为中华民族作出了彪炳史册的贡献。孙中山先生的伟大表现在","options":{"A":"领导了辛亥革命","B":"发动了以推翻北洋军阀统治为目标的北伐战争","C":"重新解释三民主义并提出了联俄、联共、扶助农工三大政策","D":"坚定维护民主共和制度和国家完整统一"},"answer":"ACD","analysis":"孙中山是中国民主革命的伟大先驱。他领导辛亥革命，推翻清王朝统治，结束了中国延续两千多年的封建君主专制制度。辛亥革命失败后，他继续为维护民主共和制度和国家完整统一而斗争。晚年，孙中山推动国民党改组，重新解释三民主义，确立联俄、联共、扶助农工三大革命政策，促成第一次国共合作。ACD 正确。","distractors":"B 选项，孙中山提出反对北洋军阀统治，推动国共合作，为国民革命和北伐战争创造了条件。但是，孙中山于1925 年3 月逝世，北伐战争于1926 年7 月正式开始，因而不能说孙中山发动了北伐战争。","extra":"（1）从辛亥革命到第一次国共合作①1905 年成立中国同盟会。②1911 年辛亥革命，1912 年中华民国临时政府成立。③1924 年国民党一大召开，第一次国共合作正式形成。④1925 年孙中山逝世；1926 年国民革命军出师北伐。区分为北伐创造条件与直接发动北伐。（2）孙中山诞辰160 周年：辛亥革命【《手册》第124—126 页】（3）第一次国共合作的形成【《手册》第132 页】1924 年1 月，国民党一大由孙中山主持在广州举行：（1）主要内容：①大会通过的宣言对三民主义作出了新的解释②确认了共产党员以个人身份加入国民党的原则③事实上确认了联俄、联共、扶助农工的三大革命政策④大会的成功召开，标志着第一次国共合作的正式形成国民党一大（2）新三民主义：①民族主义：突出了反对帝国主义的内容②民权主义：强调了民主权利应“为一般平民所共有”③民生主义：把民生主义概括为“平均地权”和“节制资本”两大原则（后来又提出“耕者有其田”的主张）（3）国共合作的政治基础：新三民主义的政纲同中国共产党在民主革命阶段的纲领基本一致"},{"id":"苏一-6-28","source":"苏一六套卷 第6套","qno":28,"type":"多选","subject":"史纲","stem":"1950 年10 月，中国人民志愿军跨过鸭绿江，同朝鲜人民和军队一道，经过艰苦卓绝的战斗，迫使侵略者于1953 年7 月27 日在停战协定上签字。关于抗美援朝战争及其伟大胜利，下列说法正确的有","options":{"A":"是为了保家卫国、维护和平而进行的正义之战","B":"打破了美军不可战胜的神话","C":"是中国人民站起来后屹立于世界东方的宣言书","D":"赢得了近代以来中华民族反抗外敌入侵的第一次完全胜利"},"answer":"ABC","analysis":"①1950 年10 月初，美国把战火烧到中朝边境，中共中央毅然作出派遣中国人民志愿军入朝作战，抗美援朝、保家卫国的历史性决策。这场战争既是保家卫国之战，也是维护和平与正义之战。②抗美援朝战争，是在交战双方力量极其悬殊条件下进行的一场现代化战争。当时，中美两国国力相差巨大。在这样极为艰难的情况下，中国人民志愿军同朝鲜军民密切配合，创造了威武雄壮的战争伟业。抗美援朝战争，打破了美军不可战胜的神话，迫使不可一世的侵略者于1953 年7 月27 日在停战协定上签字。抗美援朝战争的伟大胜利，是中国人民站起来后屹立于世界东方的宣言书，是中华民族走向伟大复兴的重要里程碑。ABC 正确。","distractors":"D 选项，取得近代以来反抗外敌入侵的第一次完全胜利，是1945 年抗日战争胜利的历史意义。抗美援朝战争发生在新中国成立之后。","extra":"抗日战争胜利与抗美援朝战争胜利①1945 年，抗日战争胜利，是近代以来中国人民反抗外敌入侵取得的第一次完全胜利。【《手册》第143—144 页】②1950 年10 月，中国人民志愿军赴朝作战；1953 年7 月27 日，朝鲜停战协定签字。抗美援朝战争伟大胜利，是中国人民站起来后屹立于世界东方的宣言书。【《手册》第150 页】（1）从根本上改变了旧中国“跪倒在地上办外交”的局面（2）提出了“另起炉灶”“打扫干净屋子再请客”“一边倒”的外交方针巩固民族独 （3）1953 年7 月，抗美援朝战争胜利的意义：立，维护国 ①打破了美国军队不可战胜的神话家主权和安 ②是中国人民站起来后屹立于世界东方的宣言书全 ③打出了国威军威，打出了中国人民的精气神，捍卫了新中国安全④极大促进了国防和军队现代化，有力推动世界和平与人类进步事业⑤锻造了伟大的抗美援朝精神，是中华民族走向伟大复兴的重要里程碑"},{"id":"苏一-6-29","source":"苏一六套卷 第6套","qno":29,"type":"多选","subject":"史纲","stem":"1956 年4 月25 日，毛泽东在中央政治局扩大会议上作《论十大关系》的讲话；5 月2日又向最高国务会议作报告。报告提出要把国内外一切积极因素调动起来，为社会主义事业服务。同时总结我国社会主义建设的初步经验，并借鉴苏联建设的经验教训，论述了十个问题即十大关系，为中共八大的召开作了理论准备。后来，毛泽东回顾说，前几年照抄外国的经验，“从一九五六年提出十大关系起，开始找到自己的一条适合中国的路线”。关于《论十大关系》，下列说法正确的有","options":{"A":"论述了重工业和轻工业、农业的关系","B":"制定了《1956—1967 年科学技术发展远景规划纲要》","C":"标志着党探索中国社会主义建设道路的良好开端","D":"提出了“一边倒”的外交方针"},"answer":"AC","analysis":"1956 年5 月，毛泽东作《论十大关系》的报告，围绕调动一切积极因素为社会主义事业服务的基本方针，总结我国社会主义建设的初步经验，并借鉴苏联建设的经验教训，论述了十个问题即十大关系。①《论十大关系》前五条主要讨论经济问题，从经济工作的各个方面来调动各种积极因素。前三条讲重工业和轻工业、农业的关系，沿海工业和内地工业的关系，经济建设和国防建设的关系。这里涉及的实际上是开辟一条与苏联有所不同的中国工业化道路。第四、第五条讲国家、生产单位和生产者个人的关系，中央和地方的关系，并开始涉及经济体制的改革，提出要充分调动各方面的积极性，在巩固中央统一领导的前提下扩大地方权力。②《论十大关系》后五条主要讨论政治关系，提出在共产党和民主党派的关系上实行“长期共存，互相监督”的方针。③《论十大关系》是以毛泽东为主要代表的中国共产党人开始探索适合中国国情的社会主义建设道路的标志，它在新的历史条件下从经济方面和政治方面提出了新的指导方针，为中共八大的召开作了理论准备。AC 正确。","distractors":"B 选项，这属于发展科学技术的规划工作。1956 年1 月，中共中央召开关于知识分子问题的会议，周恩来代表党中央作《关于知识分子问题的报告》。国务院成立科学规划委员会，编制《1956—1967 年科学技术发展远景规划纲要》。D 选项，“一边倒”是新中国成立初期提出的外交方针，指新中国站在社会主义和世界和平民主阵营一边。","extra":"（1）1956 年建设道路探索 【《手册》第152、66—67 页】①1956 年，毛泽东以苏为鉴，在《论十大关系》中提出调动一切积极因素为社会主义事业服务的基本方针，标志着党探索中国社会主义建设道路的良好开端。【详见：第1 套，第22 题】②同年9 月，中共八大分析国内主要矛盾；年底，社会主义改造基本完成。1957 年，《关于正确处理人民内部矛盾的问题》进一步阐述社会主义社会矛盾。思法（14 单选；30—31 多选）"},{"id":"苏一-6-30","source":"苏一六套卷 第6套","qno":30,"type":"多选","subject":"思修","stem":"2026 年5 月，中央宣传部、全国妇联发布2026 年“最美家庭”。入选家庭中，有的扎根乡村，带领乡亲共同致富；有的营造书香之家，带动邻里形成好学之风。这些家庭的事迹表明","options":{"A":"家庭的前途命运同国家和民族的前途命运紧密相连","B":"家风是社会风气的重要组成部分","C":"家庭美德是调节社会公共生活的基本行为准则","D":"优良家风能够发挥示范带动作用"},"answer":"ABD","analysis":"家风是社会风气的重要组成部分。扎根乡村、带动乡亲致富，体现家庭的前途命运同国家和民族的前途命运紧密相连。书香之家带动邻里好学，体现优良家风的示范作用。ABD 正确。","distractors":"C 错误，调节社会交往和公共生活的行为准则是社会公德，家庭美德主要调整家庭成员之间的关系。","extra":"家庭美德【《手册》第167 页】①家庭的前途命运同国家和民族的前途命运紧密相连注重家庭、家教、家风 ②家庭教育中最重要的是品德教育，是如何做人的教育③家风是社会风气的重要组成部分①尊老爱幼；②男女平等；③夫妻和睦（夫妻关系是家庭关系的核心）；④勤俭主要内容持家；⑤邻里互助社会公德内容【详见：第5 套，第30 题】。"},{"id":"苏一-6-31","source":"苏一六套卷 第6套","qno":31,"type":"多选","subject":"思修","stem":"长征途中，红军与沿途群众同甘共苦，留下了“半条被子”等感人故事。这些故事生动展现了中国共产党人和人民军队的革命道德风貌。关于中国革命道德的形成和发展，下列表述正确的有","options":{"A":"中国革命道德是对中华传统美德的延续和发展","B":"中国革命道德是在中国共产党领导的革命、建设和改革实践中形成和发展的","C":"中国革命道德是马克思主义同中国革命、建设和改革的伟大实践相结合的产物","D":"中国革命道德是中华传统美德自发演进的结果"},"answer":"ABC","analysis":"中国革命道德是马克思主义同中国革命、建设和改革的伟大实践相结合的产物。中国革命道德继承和发展了中华传统美德，中国共产党领导的革命、建设和改革实践为其形成和发展提供了现实基础，ABC 正确。","distractors":"D 错误，中华传统美德为中国革命道德提供了丰富的思想道德资源，但将二者的联系说成“自发演进”，忽略了马克思主义的指导作用和中国共产党领导的革命实践。","extra":"发扬中国革命道德【《手册》第166 页】①中国革命道德是对中华传统美德的延续和发展②中国革命道德是指中国共产党人、人民军队、一切先进分子和人民群众在中国革命、建含义设、改革中所形成的优秀道德，是马克思主义与中国革命、建设、改革的伟大实践相结合的产物，是中华民族极其宝贵的道德财富①为实现社会主义和共产主义的理想而奋斗（坚持社会主义和共产主义理想信念是革命道德的灵魂）②全心全意为人民服务（贯穿中国革命道德始终的一根红线）主要内容③始终把革命利益放在首位④树立社会新风，建立新型人际关系⑤修身自律，保持节操（践履中国革命道德的重要环节）①有利于加强和巩固社会主义和共产主义的理想信念②有利于培育和践行社会主义核心价值观当代价值③有利于引导人们树立正确的道德观④有利于培育良好的社会道德风尚国内时政（15 单选；32 多选）"},{"id":"苏一-6-32","source":"苏一六套卷 第6套","qno":32,"type":"多选","subject":"时政","stem":"香港特别行政区政府于2026 年9 月16 日公布《香港特别行政区经济和社会发展第一个五年规划（2026—2030 年）》。在国家“十五五”规划开局之年，香港特区首次制定五年规划。这一规划是","options":{"A":"特区政府坚持和完善行政主导、提升治理效能的重大举措","B":"主动对接国家发展战略、更好融入和服务国家发展大局的谋划需要","C":"香港回归祖国以来首份覆盖经济社会全领域的系统性中长期发展蓝图","D":"凝聚社会共识、团结各界力量，推动香港由治及兴、实现高质量发展的行动纲领"},"answer":"ABCD","analysis":"在国家“十五五”规划开局之年，香港特别行政区首次制定五年规划。这是特区政府坚持和完善行政主导、提升治理效能的重大举措；是主动对接国家发展战略、更好融入和服务国家发展大局的谋划需要；也是凝聚社会共识、团结各界力量，推动香港由治及兴、实现高质量发展的行动纲领；是香港回归祖国以来首份覆盖经济社会全领域的系统性中长期发展蓝图。ABCD 正确。","distractors":"","extra":"香港首个五年规划的四层定位①治理举措：坚持和完善行政主导，提升治理效能。②国家战略：主动对接国家发展战略，更好融入和服务国家发展大局。③规划地位：香港回归祖国以来首份覆盖经济社会全领域的系统性中长期发展蓝图。④行动纲领：凝聚社会共识，推动香港由治及兴、实现高质量发展。“一国两制”与香港维护国家安全的实践【详见：第5 套，第9 题】。国际时政（16 单选；33 多选）"},{"id":"苏一-6-33","source":"苏一六套卷 第6套","qno":33,"type":"多选","subject":"时政","stem":"2026 年4 月14 日，国家主席习近平在北京会见阿联酋阿布扎比王储哈立德。双方围绕当前中东和海湾地区形势交换了意见。习近平强调了中方劝和促谈的原则立场，重申将继续为此发挥建设性作用。习近平主席就维护和促进中东和平稳定提出的主张有","options":{"A":"坚持和平共处原则","B":"坚持国家主权原则","C":"坚持国际法治原则","D":"坚持统筹发展和安全"},"answer":"ABCD","analysis":"习近平主席会见阿联酋阿布扎比王储哈立德时，就维护和促进中东和平稳定提出4 点主张：一是坚持和平共处原则；二是坚持国家主权原则；三是坚持国际法治原则；四是坚持统筹发展和安全。ABCD 正确。","distractors":"","extra":"（1）会见阿联酋阿布扎比王储：维护和促进中东和平稳定的四点主张主张 对应表述坚持和平共处原则 推动构建共同、综合、合作、可持续的中东和海湾地区安全架构中东海湾国家主权、安全和领土完整应当得到切实尊重，各国人员、设施、机构安全坚持国家主权原则应当得到切实维护要坚定维护以联合国为核心的国际体系、以国际法为基础的国际秩序、以联合国宪章坚持国际法治原则宗旨和原则为基础的国际关系基本准则坚持统筹发展和安全 中方愿同中东海湾国家分享中国式现代化机遇，厚植地区发展和安全土壤（2）中埃会谈：中埃关系与中东地区共同安全中埃关系70 年的鲜明特征①站在中埃建交70 周年重要节点上，习近平主席指出，70 年风雨兼程，培育并见证了中埃两国关系“平等互信、友好互鉴、和衷共济、合作共赢”的鲜明特征。②这样的鲜明特征：从两国关系的深厚底蕴中来；指引中埃命运共同体建设不断走深走实；彰显超越双边关系范畴的时代价值。促进中东地区共同安全的四点倡议①激发地区共同安全的内生动力。②推进地区共同安全的综合治理。③筑牢地区共同安全的发展根基。④增强地区共同安全的国际协同。"}];
const LS_KEY = 'politics_bank_state_v1';

// ---------- 状态 ----------
let state = {};
try{ state = JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ state = {}; }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function rec(id){ return state[id] || (state[id] = {status:'', attempts:0, correct:0, note:''}); }

let current = []; // 当前展示题目 id 列表

// ---------- 工具 ----------
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function subjectPool(subj){ return BANK.filter(q=>(!subj||q.subject===subj)); }

// 权重分：错题/高频 ↑ 优先；已掌握降权
function weight(q){
  const r = rec(q.id);
  if(r.status==='×') return 5;
  if(r.status==='↑') return 4;
  if(r.status==='√') return 1;
  return 2;
}
function pick(pool, n){
  const weighted = pool.map(q=>({q,w:weight(q)})).sort((a,b)=>b.w-a.w || Math.random()-0.5);
  // 高权重优先但保留随机：按权重分层抽取
  const res=[]; const used=new Set();
  const sorted = shuffle(pool).sort((a,b)=>weight(b)-weight(a));
  for(const q of sorted){ if(res.length<n) res.push(q); }
  return res;
}

// 套卷学科配额（单选/多选）
const QUOTA_SINGLE = {'马原':4,'毛中特':5,'史纲':4,'思修':1,'时政':2};
const QUOTA_MULTI  = {'马原':5,'毛中特':5,'史纲':3,'思修':2,'时政':2};

function genExam(subj){
  const pool = subjectPool(subj);
  const singles = pool.filter(q=>q.type==='单选');
  const multis  = pool.filter(q=>q.type==='多选');
  const out=[];
  for(const [s,n] of Object.entries(QUOTA_SINGLE)){
    out.push(...pick(singles.filter(q=>q.subject===s), n));
  }
  for(const [s,n] of Object.entries(QUOTA_MULTI)){
    out.push(...pick(multis.filter(q=>q.subject===s), n));
  }
  // 重新编号
  return out;
}

function topicList(subj, kw){
  let pool = subjectPool(subj);
  if(kw){
    kw=kw.toLowerCase();
    pool=pool.filter(q=>(q.stem+q.analysis+q.extra).toLowerCase().includes(kw));
  }
  return shuffle(pool);
}

function wrongList(){
  return BANK.filter(q=>rec(q.id).status==='×'||rec(q.id).status==='↑');
}

// ---------- 渲染 ----------
function render(){
  const mode=document.getElementById('mode').value;
  const subj=document.getElementById('subject').value;
  const kw=document.getElementById('search').value.trim();
  let list;
  if(mode==='exam') list=genExam(subj);
  else if(mode==='wrong') list=wrongList();
  else list=topicList(subj,kw);
  current=list.map(q=>q.id);
  renderList(list);
  renderStats();
}

function renderList(list){
  const box=document.getElementById('list');
  if(!list.length){ box.innerHTML='<div class="empty">暂无符合条件的题目</div>'; return; }
  box.innerHTML=list.map((q,i)=>cardHTML(q,i+1)).join('');
  bindCards(list);
}

function cardHTML(q, idx){
  const r=rec(q.id);
  const opts=Object.entries(q.options).map(([k,v])=>`
    <div class="opt" data-q="${q.id}" data-k="${k}">
      <span class="k">${k}.</span><span>${esc(v)}</span>
    </div>`).join('');
  return `
  <div class="qcard" data-id="${q.id}">
    <div class="qhead">
      <span class="qno">${idx}.</span>
      <span class="tag subj">${q.subject}</span>
      <span class="tag">${q.type}</span>
      <span class="tag src">${esc(q.source)}</span>
      <span class="weight">
        <button class="small ${r.status==='√'?'on-ok':''}" data-w="√">√ 掌握</button>
        <button class="small ${r.status==='×'?'on-bad':''}" data-w="×">× 薄弱</button>
        <button class="small ${r.status==='↑'?'on-up':''}" data-w="↑ 高频</button>
      </span>
    </div>
    <div class="qstem">${esc(q.stem)}</div>
    <div class="opts">${opts}</div>
    <div class="act">
      <button class="small" data-action="submit">提交判分</button>
      <button class="ghost small" data-action="toggle">解析</button>
      <span class="hint">答案 ${r.attempts?('已答'+r.attempts+'次'):'未答'}</span>
    </div>
    <div class="analysis" data-analysis>
      <div class="answer-line secret">正确答案：${esc(q.answer)}</div>
      <div class="a-block"><h4>解析</h4><div class="dist secret">${esc(q.analysis)||'—'}</div></div>
      ${q.distractors?`<div class="a-block pit"><h4>干扰项拆解</h4><div class="dist secret">${esc(q.distractors)}</div></div>`:''}
      ${q.extra?`<div class="a-block"><h4>考点串联 / 速背拓展</h4><div class="extra secret">${esc(q.extra)}</div></div>`:''}
      <div class="a-block">
        <h4>我的笔记</h4>
        <textarea class="note-area" data-note placeholder="写口诀、易错提醒…">${esc(r.note)}</textarea>
      </div>
    </div>
  </div>`;
}

function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- 交互 ----------
function bindCards(list){
  const box=document.getElementById('list');
  box.querySelectorAll('.opt').forEach(el=>{
    el.onclick=()=>{
      const card=el.closest('.qcard');
      const qid=card.dataset.id;
      const type=BANK.find(q=>q.id===qid).type;
      if(type==='多选'){ el.classList.toggle('sel'); }
      else{ card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); el.classList.add('sel'); }
    };
  });
  box.querySelectorAll('[data-action]').forEach(btn=>{
    btn.onclick=()=>{
      const card=btn.closest('.qcard'); const qid=card.dataset.id;
      const q=BANK.find(x=>x.id===qid);
      if(btn.dataset.action==='toggle'){
        card.querySelector('[data-analysis]').classList.toggle('open');
      }else if(btn.dataset.action==='submit'){
        grade(card,q);
      }
    };
  });
  box.querySelectorAll('.weight button').forEach(btn=>{
    btn.onclick=()=>{
      const card=btn.closest('.qcard'); const qid=card.dataset.id; const r=rec(qid);
      const w=btn.dataset.w;
      r.status = r.status===w ? '' : w;
      save(); render();
    };
  });
  box.querySelectorAll('[data-note]').forEach(ta=>{
    ta.oninput=()=>{ const r=rec(ta.closest('.qcard').dataset.id); r.note=ta.value; save(); };
  });
}

function grade(card,q){
  const sel=[...card.querySelectorAll('.opt.sel')].map(o=>o.dataset.k).sort().join('');
  const correct=q.answer.split('').sort().join('');
  const r=rec(q.id); r.attempts++;
  const ok = sel===correct;
  if(ok){ r.correct++; r.status = r.status==='×'? r.status : '√'; }
  else{ r.status='×'; }
  save();
  // 标色
  card.querySelectorAll('.opt').forEach(o=>{
    const k=o.dataset.k;
    if(q.answer.includes(k)) o.classList.add('correct');
    else if(o.classList.contains('sel')) o.classList.add('wrong');
  });
  card.querySelector('[data-analysis]').classList.add('open');
  renderStats();
}

function renderStats(){
  const total=BANK.length;
  const answered=Object.values(state).filter(r=>r.attempts>0).length;
  const wrong=Object.values(state).filter(r=>r.status==='×').length;
  const up=Object.values(state).filter(r=>r.status==='↑').length;
  const corr=Object.values(state).reduce((s,r)=>s+r.correct,0);
  const att=Object.values(state).reduce((s,r)=>s+r.attempts,0);
  const rate=att?Math.round(corr/att*100):0;
  document.getElementById('stats').innerHTML=
    `题库 <b>${total}</b> 题 · 已练 <b>${answered}</b> · 正确率 <b>${rate}%</b> · 薄弱 <b>${wrong}</b> · 高频标记 <b>${up}</b>`;
  document.getElementById('meta').textContent=`共 ${total} 题`;
}

// ---------- 导出 ----------
document.getElementById('export').onclick=()=>{
  const list=BANK.filter(q=>current.includes(q.id));
  const txt=list.map((q,i)=>{
    const r=rec(q.id);
    let o=Object.entries(q.options).map(([k,v])=>`${k}. ${v}`).join('\n');
    return `${i+1}. [${q.subject}/${q.type}] ${q.stem}\n${o}\n答案：${q.answer}\n解析：${q.analysis}\n干扰项：${q.distractors||'—'}\n拓展：${q.extra||'—'}\n笔记：${r.note||'—'}`;
  }).join('\n\n'+'—'.repeat(30)+'\n\n');
  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='考研政治刷题.txt'; a.click();
};

// ---------- 事件 ----------
document.getElementById('gen').onclick=render;
document.getElementById('mode').onchange=render;
document.getElementById('subject').onchange=render;
document.getElementById('search').oninput=()=>{ if(document.getElementById('mode').value==='topic') render(); };
document.getElementById('mask').onchange=e=>{
  document.body.classList.toggle('mask-hide', e.target.checked);
};

render();
</script>
