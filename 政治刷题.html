<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>政治刷题 · 记忆训练场</title>
<meta name="theme-color" content="#f4f0e6">
<style>:root{
  --fs:19px;
  --bg:#f4f0e6; --bg2:#ebe5d6; --card:#fffdf7; --ink:#2c352e; --ink2:#5d6a5f; --ink3:#8d978c;
  --line:#e2dccb; --accent:#4f7d5f; --accent2:#3c6650; --accent-bg:#e6efe2;
  --ok:#4a7d5c; --ok-bg:#e8f1e6; --no:#a9574c; --no-bg:#f8e9e5; --shadow:0 2px 10px rgba(70,80,60,.06);
}
[data-theme="dark"]{
  --bg:#15191a; --bg2:#1c2223; --card:#1e2524; --ink:#d7dfd5; --ink2:#a3b0a6; --ink3:#7d8b81;
  --line:#2c3532; --accent:#79b08c; --accent2:#8fc49f; --accent-bg:#22312a;
  --ok:#6fae82; --ok-bg:#1d2c24; --no:#d08074; --no-bg:#2e211f; --shadow:0 2px 12px rgba(0,0,0,.3);
}
[data-theme="sepia"]{
  --bg:#e9efe3; --bg2:#dfe8d8; --card:#f8faf4; --ink:#2c3a2e; --ink2:#55665a; --ink3:#7f9081;
  --line:#d3dfcd; --accent:#47764f; --accent2:#39643f;
  --ok:#3f7a51; --ok-bg:#e4f0e2; --no:#a4584c; --no-bg:#f6eae5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:var(--fs); line-height:1.85; letter-spacing:.2px;
  -webkit-font-smoothing:antialiased;
  padding-bottom:78px;
  transition:background .25s,color .25s;
}
#view{max-width:760px;margin:0 auto;padding:0 18px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input{font-family:inherit}
.page{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 底部导航 ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;justify-content:space-around;
  background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 14px;border-radius:12px;color:var(--ink3);font-size:13px}
.tab i{font-style:normal;font-size:19px;line-height:1.2;opacity:.75}
.tab.on{color:var(--accent);background:var(--accent-bg)}
.tab.on i{opacity:1}

/* ---------- 首页 ---------- */
.hero{padding:26px 0 8px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start}
.h-date{margin:0;font-size:12px;color:var(--ink3);letter-spacing:2px}
.h-title{margin:2px 0 0;font-size:26px;font-weight:600;letter-spacing:.5px}
.icon-btn{font-size:20px;color:var(--ink2);padding:6px}
.ring-wrap{display:flex;align-items:center;gap:26px;margin:22px 0 6px}
.ring{
  width:132px;height:132px;border-radius:50%;flex:0 0 auto;
  background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--bg2) 0);
  display:grid;place-items:center;position:relative;
}
.ring::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card)}
.ring-in{position:relative;z-index:1;text-align:center;line-height:1.2}
.ring-in b{display:block;font-size:32px;font-weight:600;letter-spacing:-.5px}
.ring-in small{font-size:11px;color:var(--ink3)}
.hero-stat{display:flex;flex-direction:column;gap:14px}
.hero-stat b{font-size:21px;font-weight:600;display:block;line-height:1.2}
.hero-stat small{font-size:11px;color:var(--ink3)}
.quote{margin:10px 0 0;font-size:13px;color:var(--ink3);font-style:italic}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 4px}
.big-btn{
  display:flex;align-items:flex-start;gap:10px;text-align:left;
  background:var(--card);border-radius:16px;padding:16px 14px;
  border:1px solid var(--line);box-shadow:var(--shadow);transition:.18s;
}
.big-btn:active{transform:scale(.98)}
.big-btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.big-btn.primary small{color:rgba(255,255,255,.8)}
.bb-ico{font-size:18px;opacity:.8;line-height:1.4}
.big-btn b{display:block;font-size:16px;font-weight:600;line-height:1.35}
.big-btn small{display:block;font-size:11px;color:var(--ink3);line-height:1.5;margin-top:2px}

.sec{margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.sec-h h2{margin:0;font-size:15px;font-weight:600;letter-spacing:1px}
.hint{font-size:11px;color:var(--ink3)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sub-chip{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;
  align-items:center;gap:0 8px;padding:12px 13px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;text-align:left;transition:.15s}
.sub-chip:active{transform:scale(.98)}
.sub-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c);grid-row:1}
.sub-chip b{font-size:14px;font-weight:600}
.sub-chip small{font-size:11px;color:var(--ink3);grid-column:3;grid-row:1}
.sub-chip .bar{grid-column:2/4;grid-row:2;height:3px;background:var(--bg2);border-radius:3px;overflow:hidden;margin-top:5px}
.sub-chip .bar em{display:block;height:100%;background:var(--c);border-radius:3px}

.mini-list{display:flex;flex-direction:column;gap:8px}
.mini{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;
  padding:13px 15px;background:var(--card);border:1px solid var(--line);border-radius:13px;text-align:left}
.mini b{font-size:14.5px;font-weight:600}
.mini small{grid-column:1;font-size:11px;color:var(--ink3);line-height:1.5}
.mini i{grid-column:2;grid-row:1/3;font-style:normal;font-size:11px;color:var(--accent);white-space:nowrap}

.daily-card{display:block;width:100%;text-align:left;background:var(--card);border:1px dashed var(--line);
  border-radius:14px;padding:15px 16px}
.daily-card p{margin:0;font-size:14px;line-height:1.75;color:var(--ink2)}
.daily-card span{display:inline-block;margin-top:8px;font-size:12px;color:var(--accent)}

/* ---------- 刷题 ---------- */
.quiz-page{padding-top:18px}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.q-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600}
.pill.ghost{background:var(--bg2);color:var(--ink2)}
.q-src{font-size:11px;color:var(--ink3)}
.q-count{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.q-count small{font-size:10px}
.q-stem{font-size:calc(var(--fs) + 1px);line-height:1.9;margin:12px 0 6px;letter-spacing:.3px}
.q-tip{font-size:11px;color:var(--ink3);margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:12px;align-items:flex-start;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:13px 14px;line-height:1.7;font-size:var(--fs);transition:.15s;
}
.opt:active{transform:scale(.99)}
.opt .tag{
  flex:0 0 26px;height:26px;border-radius:8px;background:var(--bg2);color:var(--ink2);
  font-size:12px;font-weight:600;display:grid;place-items:center;margin-top:2px;
}
.opt.sel{border-color:var(--accent);background:var(--accent-bg)}
.opt.sel .tag{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .tag{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt.wrong .tag{background:var(--no);color:#fff}
.q-actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 6px}
.act{padding:11px 18px;border-radius:12px;font-size:14px;background:var(--card);border:1px solid var(--line)}
.act.primary{background:var(--accent);color:#fff;border-color:transparent;flex:1;font-weight:600}
.act.ghost{color:var(--ink2);font-size:12.5px;padding:10px 13px}
.act.ghost.on{color:var(--accent);border-color:var(--accent)}
.act.danger{color:var(--no);width:100%;margin-top:8px}
.act.wide{width:100%;margin-bottom:8px}

.res{margin-top:16px;border-radius:16px;padding:16px;background:var(--card);border:1px solid var(--line);animation:fade .2s}
.res.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.res.no{background:var(--no-bg);border-color:color-mix(in srgb,var(--no) 30%,transparent)}
.res-h{font-size:15px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.res.ok .res-h{color:var(--ok)} .res.no .res-h{color:var(--no)}
.ans-line{font-size:12px;font-weight:400;color:var(--ink2)}
.res-ans{font-size:14px;line-height:1.8;margin-bottom:6px;color:var(--ink)}
.res-ans b{color:var(--accent2)}
.fold{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.fold summary{font-size:12.5px;color:var(--ink2);cursor:pointer;list-style:none;font-weight:600}
.fold summary::before{content:"▸ ";color:var(--accent)}
.fold[open] summary::before{content:"▾ "}
.fold p{font-size:13.5px;line-height:1.9;color:var(--ink2);margin:8px 0 0;text-align:justify}

/* ---------- 完成页 ---------- */
.done-page{padding-top:44px;text-align:center}
.done-ico{font-size:44px;margin-bottom:8px}
.done-page h1{font-size:22px;margin:0 0 6px}
.done-sub{font-size:12px;color:var(--ink3);margin:0 0 20px}
.done-nums{display:flex;justify-content:center;gap:30px;margin:22px 0}
.done-nums b{display:block;font-size:26px;font-weight:600}
.done-nums small{font-size:11px;color:var(--ink3)}

/* ---------- 列表 ---------- */
.seg{display:flex;gap:4px;background:var(--bg2);border-radius:12px;padding:4px;margin:18px 0 14px}
.seg-b{flex:1;padding:8px;border-radius:9px;font-size:12.5px;color:var(--ink2)}
.seg-b.on{background:var(--card);color:var(--accent);font-weight:600;box-shadow:var(--shadow)}
.seg.small{flex:0 0 auto}
.seg.small .seg-b{padding:5px 12px;font-size:12px}
.list-actions{display:flex;gap:8px;margin-bottom:12px}
.qlist{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.qrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;
  background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;text-align:left}
.qr-sub{font-size:11px;font-weight:600;white-space:nowrap}
.qr-stem{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qr-tag{font-size:10px;color:var(--ink3);white-space:nowrap}
.empty{font-size:12.5px;color:var(--ink3);text-align:center;padding:30px 0}

/* ---------- 闪卡 ---------- */
.flash-page{padding-top:18px}
.flash{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 20px;min-height:250px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow);cursor:pointer}
.flash.back{animation:flip .25s ease}
@keyframes flip{from{transform:rotateX(12deg);opacity:.6}to{transform:none;opacity:1}}
.flash-tag{font-size:11px;color:var(--accent);letter-spacing:1px;margin-bottom:10px}
.flash-body{font-size:calc(var(--fs) + 1px);line-height:1.9;color:var(--ink)}
.flash-hint{margin-top:18px;font-size:11px;color:var(--ink3)}
.fl-opt{margin:6px 0;font-size:15px;line-height:1.7}
.fl-opt b{color:var(--accent);margin-right:8px}
.flash-ext{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;line-height:1.85;color:var(--ink2);max-height:230px;overflow:auto}
.srs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.srs-b{padding:10px 4px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:12.5px}
.srs-b small{display:block;font-size:10px;color:var(--ink3)}

/* ---------- 判断 ---------- */
.jd-text{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px;font-size:calc(var(--fs) + 1px);line-height:1.9;margin:12px 0 16px;text-align:justify}
.jd-btns{margin-top:0}
.jd-btns .big-btn{justify-content:center;text-align:center;display:block}

/* ---------- 统计 ---------- */
.stat-top{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0 6px;text-align:center}
.stat-top b{display:block;font-size:20px;font-weight:600}
.stat-top small{font-size:10px;color:var(--ink3);line-height:1.4}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.hcell{text-align:center}
.hcell i{display:block;height:26px;border-radius:5px;background:color-mix(in srgb,var(--accent) calc(var(--o)*100%),var(--bg2))}
.hcell small{font-size:8px;color:var(--ink3)}
.sub-row{display:grid;grid-template-columns:52px 1fr 48px 36px;align-items:center;gap:8px;margin:9px 0}
.sr-name{font-size:12.5px;font-weight:600}
.sr-bar{height:6px;background:var(--bg2);border-radius:4px;overflow:hidden}
.sr-bar i{display:block;height:100%;border-radius:4px}
.sr-num{font-size:10.5px;color:var(--ink3);text-align:right}
.sr-acc{font-size:10.5px;color:var(--ink2);text-align:right}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;outline:none}
.inp:focus{border-color:var(--accent)}

/* ---------- 设置 ---------- */
.pg-title{font-size:22px;margin:26px 0 14px}
.set-group{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:6px 16px;margin-bottom:14px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row label{font-size:14px}
.set-row input[type=range]{flex:1;max-width:180px;accent-color:var(--accent)}
.switch{width:46px;height:26px;border-radius:14px;background:var(--bg2);position:relative;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--card);transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}
.switch.on::after{left:23px}
.set-note{font-size:12.5px;color:var(--ink2);line-height:1.8;margin:12px 0}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 18px;border-radius:20px;font-size:13px;z-index:99;animation:fade .2s;transition:.3s}
.toast.out{opacity:0;transform:translate(-50%,8px)}

.set-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.set-chip{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 10px;text-align:left;display:flex;justify-content:space-between;align-items:center}
.set-chip b{font-size:13px;font-weight:600}
.set-chip small{font-size:10px;color:var(--ink3)}
.set-chip.x{border-style:dashed}
.tip-p{color:var(--ink2)}
.q-right{display:flex;align-items:center;gap:8px}
.pomo{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--bg2);color:var(--ink2);font-variant-numeric:tabular-nums}
.err-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.err-tags span{font-size:11px;color:var(--ink3)}
.etag{font-size:11px;padding:4px 9px;border-radius:16px;background:var(--bg2);color:var(--ink2)}
.etag.on{background:var(--accent);color:#fff}
.qr-stem{min-width:0}
.seg.small .seg-b{padding:5px 8px;font-size:11px;white-space:nowrap}
.due-tag{font-style:normal;font-size:10px;color:var(--accent);background:var(--accent-bg);padding:1px 6px;border-radius:10px;margin-left:6px}
.note{width:100%;min-height:70px;margin-top:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.7;resize:vertical;outline:none}
.note:focus{border-color:var(--accent)}
.note-box summary::before{content:"✎ "}
.note-box[open] summary::before{content:"✎ "}
.act[disabled]{opacity:.4}

/* ---------- 考点高亮块 ---------- */
.ext-box{margin-top:12px;background:var(--accent-bg);border-left:3px solid var(--accent);border-radius:10px;padding:10px 13px}
.ext-k{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:1px;margin-bottom:3px}
.ext-box p{margin:0;font-size:13px;line-height:1.9;color:var(--ink);text-align:justify}

/* ---------- 复习页学科筛 ---------- */
.sub-filter{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.fchip{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);color:var(--ink2);background:var(--card)}
.fchip.on{background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--card));border-color:var(--c,var(--accent));color:var(--c,var(--accent));font-weight:600}

/* ---------- 底部导航留白（避免遮住最后一行） ---------- */
.page{padding-bottom:16px}
.qrow{min-height:40px}

/* ---------- 考点速查 ---------- */
.pg-title{font-size:22px;font-weight:600;margin:22px 0 4px;letter-spacing:.5px}
.scope-chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 10px}
.extlist{display:flex;flex-direction:column;gap:9px}
.ext-item{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:11px 13px;cursor:pointer}
.ei-h{display:flex;align-items:center;gap:8px;font-size:11.5px;margin-bottom:5px}
.ei-h b{color:var(--accent);font-size:13px}
.ei-h i{font-style:normal;color:var(--ink3);margin-left:auto;font-size:10.5px}
.ext-item p{margin:0;font-size:13px;line-height:1.85;color:var(--ink);text-align:justify}

/* ---------- 进度条 ---------- */
.q-prog{height:3px;background:var(--bg2);border-radius:3px;margin:10px 0 14px;overflow:hidden}
.q-prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
</style>
</head>
<body>
<div id="view"></div>
<nav class="tabbar">
  <button class="tab" data-v="home"><i>⌂</i>首页</button>
  <button class="tab" data-v="quiz"><i>✎</i>刷题</button>
  <button class="tab" data-v="cards"><i>▤</i>闪卡</button>
  <button class="tab" data-v="wrong"><i>✗</i>错题</button>

</nav>
<script>window.BANK=[{"id": "x1-1", "set": 1, "num": 1, "src": "肖八（一套）", "book": "肖八", "sub": "马原", "type": "single", "stem": "“竹外桃花三两枝，春江水暖鸭先知。”苏轼这句优美的诗句描绘了春回大地、万物复苏之间的关系，竹林、桃花、江水、鸭子等诸多事物共同构成了一幅春天的画卷。从唯物辩证法的角度看，这一诗句蕴含的哲理是", "opts": {"A": "世界是一个普遍联系的有机整体", "B": "任何两个事物之间都存在着因果关系", "C": "事物之间的联系都是人们感知之后才形成的", "D": "多样的事物之间存在着普遍的、无条件的联系"}, "ans": "A", "ana": "联系具有普遍性，整个世界是相互联系的统一整体，竹林、桃花、江水、鸭子在春日图景中相互关联，A正确。B错：只有引起与被引起的联系才是因果关系；C错：联系是客观的，不以人的感知为条件；D错：联系是有条件的，不存在无条件的普遍联系。", "dis": "", "ext": "普遍联系；因果关系的判定（引起与被引起）；联系的条件性。", "year": 2026}, {"id": "x1-2", "set": 1, "num": 2, "src": "肖八（一套）", "book": "肖八", "sub": "马原", "type": "single", "stem": "夏日炎炎，海南三亚崖州湾，田间的南繁季已结束，而“数据田”里的育种仍在进行。走进海南大学南繁学院基因组与大数据育种实验室，不见培养皿与种苗圃，只有运转不息的机房。人工智能（AI）生物信息科学家智能体与大模型，能在虚拟农田里“算”出作物长什么样，帮育种科研人员节省时间。田间南繁，须守农时。每年9月到次年5月，北方的育种科研人员如候鸟南下海南岛南部，利用充足光热资源开展种子加代繁育，压缩育种周期。选种、种植、收获，重复6到7轮、花上8到10年，才能找出性状稳定、表现优良的品种。而工作人员将积累的作物基因数据“喂”给AI，让它预测作物未来的样子，提前淘汰掉不合格品种，精准锁定最具潜力、最能适应环境变化的“种子选手”。在一定条件下，相关技术能帮育种人员节约近一半时间。从“数据田”育出“种子选手”表明", "opts": {"A": "虚拟预测可以完全代替田间试验", "B": "人工智能已经成为独立的认识主体", "C": "数据已成为整个世界的最基本构成力量", "D": "科技创新能够延伸人的认识器官、变革认识方式"}, "ans": "D", "ana": "人工智能是人的意识能动性的特殊表现，是人的本质力量的对象化，能延伸人的认识器官、变革认识方式，D正确。A错：虚拟预测不能完全代替田间试验，实践是检验真理的唯一标准；B错：人工智能是认识工具，人是认识主体；C错：世界的最基本构成是物质而非数据。", "dis": "", "ext": "人工智能的实质（意识工具而非主体）；实践是检验认识真理性的唯一标准。", "year": 2026}, {"id": "x1-3", "set": 1, "num": 3, "src": "肖八（一套）", "book": "肖八", "sub": "马原", "type": "single", "stem": "在资本主义商品生产条件下，单个资本家改进技术、改善管理的主观动机是", "opts": {"A": "增加必要劳动时间", "B": "降低资本有机构成", "C": "追求超额剩余价值", "D": "获取相对剩余价值"}, "ans": "C", "ana": "单个资本家改进技术、改善管理的主观动机是追求超额剩余价值（C）；其客观后果是全社会劳动生产率普遍提高，生活资料价值下降、必要劳动时间缩短，整个资本家阶级获得相对剩余价值。A、D错；B错：资本有机构成呈提高趋势，这是资本本性决定的。", "dis": "", "ext": "超额剩余价值与相对剩余价值的关系：个别→超额，社会→相对。", "year": 2026}, {"id": "x1-4", "set": 1, "num": 4, "src": "肖八（一套）", "book": "肖八", "sub": "马原", "type": "single", "stem": "金融寡头是指操纵国民经济命脉，并在实际上控制国家政权的少数垄断资本家或垄断资本家集团。金融寡头在经济领域中的统治主要是通过“参与制”实现的。所谓参与制是指金融寡头", "opts": {"A": "通过把自己的代理人送进政府或议会来为其垄断统治服务", "B": "通过建立政策咨询机 全首要＝自然保护地；体系以国家公园为主体、自然保护区为基础、自然公园为补充。", "year": 2026}, {"id": "x1-9", "set": 1, "num": 9, "src": "肖八（一套）", "book": "肖八", "sub": "新思想", "type": "single", "stem": "我国国土广袤、地理复杂、气候多样，自然灾害易发多发。当前，我国防灾减灾救灾工作面临不少新情况新问题。要站在统筹高质量发展和高水平安全的战略高度，充分认识做好防灾减灾救灾工作的极端重要性，不断提高防范应对各类自然灾害的能力和水平，切实维护人民群众生命财产安全和社会稳定，确保中国式现代化行稳致远。降低灾害风险，减轻灾害损失，要推动灾害治理", "opts": {"A": "向事前预防转型", "B": "向科技支撑转型", "C": "从单一管理为主转向分散管理为主", "D": "从政府监督为主转向市场监督为主"}, "ans": "A", "ana": "推动灾害治理向事前预防转型，A正确。重在事前预防：源头管控、隐患排查、工程治理、重点防控，压降存量风险、遏制新增风险。", "dis": "", "ext": "防灾减灾：向事前预防转型（源头管控＋隐患排查＋工程治理）。", "year": 2026}, {"id": "x1-10", "set": 1, "num": 10, "src": "肖八（一套）", "book": "肖八", "sub": "史纲", "type": "single", "stem": "从1840年鸦片战争以来，资本—帝国主义列强发动了一次又一次的侵华战争。帝国主义侵略中国的最终目的，是要", "opts": {"A": "迫使中国采用资产阶级的生产方式", "B": "从文化和宗教上同化中国", "C": "将中国变为人侵亚洲的跳板和桥头堡", "D": "瓜分中国、灭亡中国"}, "ans": "D", "ana": "帝国主义侵略中国的最终目的是瓜分中国、灭亡中国，D正确。A错：不是让中国成为独立资本主义国家，而是纳入资本主义世界体系成为附庸；B错：文化渗透是手段不是最终目的；C错：19世纪70—80年代列强从侵占周边发展到蚕食边疆。", "dis": "", "ext": "近代列强侵华的根本目的：变中国为殖民地半殖民地，而非发展资本主义。", "year": 2026}, {"id": "x1-11", "set": 1, "num": 11, "src": "肖八（一套）", "book": "肖八", "sub": "史纲", "type": "single", "stem": "近代中国的社会性质和主要矛盾，决定了中国革命仍然是资产阶级民主革命。但中国资产阶级民主革命不同于一般的资产阶级民主革命，经历了从旧民主主义革命向新民主主义革命的转变，具有鲜明的时代特征。标志着中国资产阶级民主革命的时代背景发生了根本转换的历史事件是", "opts": {"A": "辛亥革命的爆发", "B": "中国共产党成立", "C": "俄国十月革命", "D": "护法运动的失败"}, "ans": "C", "ana": "俄国十月革命是具有划时代意义的世界历史事件，以此为标志，中国资产阶级民主革命的时代背景发生根本转换，C正确。从鸦片战争到辛亥革命属于旧民主主义革命范畴。", "dis": "", "ext": "十月革命→中国革命由旧民主主义转向新民主主义（时代背景根本转换）。", "year": 2026}, {"id": "x1-12", "set": 1, "num": 12, "src": "肖八（一套）", "book": "肖八", "sub": "史纲", "type": "single", "stem": "1947年6月底，根据中共中央的决策和部署，刘伯承、邓小平率领的晋冀鲁豫野战军主力，实施中央突破，千里跃进大别山。随后，陈毅、粟裕指挥的华东野战军主力为东路，挺进苏鲁豫皖地区。陈赓、谢富治指挥的晋冀鲁豫野战军一部为西路，挺进豫西。三路大军相互策应，机动歼敌，这标志着", "opts": {"A": "蒋介石20年反革命统治由发展到消灭的转折点", "B": "人民解放战争战略进攻的序幕由此揭开", "C": "人民解放军在数量上已经超过国民党军队", "D": "100多年来帝国主义在中国的统治由发展到消灭的转折点"}, "ans": "B", "ana": "三路大军相互策应、机动歼敌，人民解放战争战略进攻的序幕由此揭开，B正确。1947年12月杨家沟会议毛泽东才指出：这是蒋介石20年反革命统治由发展到消灭的转折点，是100多年来帝国主义在中国统治由发展到消灭的转折点（A、D）。C错：此时解放军数量尚未超过国民党军。", "dis": "", "ext": "1947年6月三路大军＝战略进攻序幕；1947年12月杨家沟会议＝转折点判断。", "year": 2026}, {"id": "x1-13", "set": 1, "num": 13, "src": "肖八（一套）", "book": "肖八", "sub": "史纲", "type": "single", "stem": "1984年10月，党的十二届三中全会通过《中共中央关于经济体制改革的决定》。会后，经济体制改革以城市为重点全面展开。改革的中心环节是", "opts": {"A": "完善家庭联产承包责任制", "B": "全面推进价格改革", "C": "确认私营经济的法律地位", "D": "增强全民所有制企业的活力"}, "ans": "D", "ana": "党的十二届三中全会《决定》突破把计划经济同商品经济对立起来的观点，提出我国社会主义经济是在公有制基础上的有计划的商品经济；突破把全民所有同国家机构直接经营企业混为一谈的传统观念，提出所有权同经营权可以适当分开，D正确（中心环节是增强企业活力）。", "dis": "", "ext": "1984年《决定》：有计划的商品经济；所有权与经营权适当分开；中心环节＝增强企业活力。", "year": 2026}, {"id": "x1-14", "set": 1, "num": 14, "src": "肖八（一套）", "book": "肖八", "sub": "思法", "type": "single", "stem": "相传清朝康熙年间，时任文华殿大学士兼礼部尚书的张英，收到了一封来自桐城老家的家书，信中说家人与邻居吴家发生土地纠纷，请他相助。张英在家书中写道：“一纸书来只为墙，让他三尺又何妨？”张家人收到回信，主动让出三尺；吴家人深受感动，也退让三尺。六尺巷的故事由此传为佳话。六尺巷的古老智慧体现的中华民族的传统美德是", "opts": {"A": "注重人伦关系，重视道德义务", "B": "推崇仁爱原则，注重以和为贵", "C": "追求精神境界，向往理想人格", "D": "重视整体利益，强调责任奉献"}, "ans": "B", "ana": "六尺巷故事体现先人化解矛盾的历史智慧，作为弘扬中华优秀传统文化的教育场所，发挥中华民族讲求礼让、以和为贵传统美德的作用，B正确（推崇仁爱原则，注重以和为贵）。", "dis": "", "ext": "六尺巷＝礼让、以和为贵、化解矛盾的治理智慧。", "year": 2026}, {"id": "x1-15", "set": 1, "num": 15, "src": "肖八（一套）", "book": "肖八", "sub": "时政", "type": "single", "stem": "2026年7月8日，习近平总书记出席国家科学技术奖励大会、中国科学院第二十二次院士大会和中国工程院第十八次院士大会、中国科学技术协会第十一次全国代表大会，为国家最高科学技术奖获得者颁奖并发表重要讲话。习近平总书记强调，以高水平科技自立自强引领发展新质生产力的关键是", "opts": {"A": "推动科技创新和产业创新深度融合", "B": "大力培养优秀青年科技人才", "C": "提高科技创新投入效能", "D": "用好科技评价指挥棒"}, "ans": "A", "ana": "习近平总书记强调，推动科技创新和产业创新深度融合，是以高水平科技自立自强引领发展新质生产力的关键，A正确。", "dis": "", "ext": "关键＝科技创新和产业创新深度融合。", "year": 2026}, {"id": "x1-16", "set": 1, "num": 16, "src": "肖八（一套）", "book": "肖八", "sub": "时政", "type": "single", "stem": "2026年5月，国家主席习近平同美国总统特朗普在北京举行历史性会晤，共同确立了构建中美建设性战略稳定关系的两国关系新定位。构建中美建设性战略稳定关系，必须扣好的“第一粒纽扣”是", "opts": {"A": "密切元首外交", "B": "发展经贸关系", "C": "树立正确的战略认知", "D": "扩大民间人文交流"}, "ans": "C", "ana": "构建中美建设性战略稳定关系，树立正确的战略认知是必须扣好的“第一粒纽扣”，C正确；方向是合作为主、竞争有度、分歧可控、和平可期。", "dis": "", "ext": "中美关系新定位：第一粒纽扣＝正确的战略认知。", "year": 2026}, {"id": "x1-17", "set": 1, "num": 17, "src": "肖八（一套）", "book": "肖八", "sub": "马原", "type": "multi", "stem": "“把发电站建在太空，让清洁能源照亮地球！”——这一曾经只出现在科幻作品里的大胆构想，如今正加速走向现实。随着全球能源转型深入推进，航天发射成本持续下降，空间太阳能电站这一“未来能源”构想，已成为世界主要科技强国竞相布局的新高地。中国正稳步推进空间太阳能电站“逐日工程”，计划于2030年前后开展兆瓦级在轨试验。这项技术之所以吸引全球目光，在于它拥有传统能源难以企及的优势，被视为解决人类能源困境的终极方案之一。把太阳能电站“搬上天”说明人的实践活动", "opts": {"A": "能够在自然界打上人类的印记", "B": "随着一定社会历史条件的变化而变化", "C": "可以把人脑中的一切观念都变为现实的存在", "D": "是实现自由过程中的一种本能的、被动的适应性活动"}, "ans": "AB", "ana": "人的实践能改变自然物形态面貌，在自然界打上人类印记，A正确；实践具有社会历史性，随社会历史条件变化而变化，B正确。C错：不是人脑中的一切观念都能变为现实；D错：人的实践是有意识有目的的活动，非本能的被动适应。", "dis": "", "ext": "实践的特点：客观物质性、社会历史性、能动性、直接现实性。", "year": 2026}, {"id": "x1-18", "set": 1, "num": 18, "src": "肖八（一套）", "book": "肖八", "sub": "马原", "type": "multi", "stem": "马克思和恩格斯在《德意志意识形态》中写道：“人们每次都不是在他们关于人的理想所决定和所容许的范围之内，而是在现有的生产力所决定和所容许的范围之内取得自由的。”这句话说明", "opts": {"A": "认识必然和争取自由，二者不可兼得", "B": "自由是绝对的，也是相对的", "C": "自由是具体的、历史的", "D": "人不能摆脱必然性的制约，必然是自由的限度"}, "ans": "CD", "ana": "自由是对必然的认识和对客观世界的改造，人不能摆脱必然性制约，必然是自由的根据也是自由的限度，D正确；自由是具体的、历史的，不存在绝对自由，C正确、B错误；认识必然和争取自由是统一过程，A错误。", "dis": "", "ext": "自由与必然：必然是自由的前提和限度；自由是具体的、历史的。", "year": 2026}, {"id": "x1-19", "set": 1, "num": 19, "src": "肖八（一套）", "book": "肖八", "sub": "马原", "type": "multi", "stem": "随着利润转化为平均利润，价值也就转化为生产价格。生产价格是商品价值的转化形式，是生产成本与平均利润之和。从价值到生产价格的转化", "opts": {"A": "并没有改变价值规律作用的形式", "B": "是随着资本主义大工业的出现和发展而完成的", "C": "反映了从小商品生产到资本主义商品生产的历史发展过程", "D": "消除了资本家之间在瓜分剩余价值上的利害冲突"}, "ans": "BC", "ana": "价值转化为生产价格后，价值规律作用的形式发生变化：商品以生产价格为基础交换，市场价格以生产价格为中心，B正确；这一转化随资本主义大工业出现发展而完成，反映从小商品生产到资本主义商品生产的历史过程，C正确。A错：规律作用形式变了；D错：资本家在瓜分剩余价值上仍有利益冲突。", "dis": "", "ext": "生产价格＝成本价格＋平均利润；价值规律作用形式改变而非被否定。", "year": 2026}, {"id": "x1-20", "set": 1, "num": 20, "src": "肖八（一套）", "book": "肖八", "sub": "马原", "type": "multi", "stem": "垄断利润主要是通过垄断组织制定的垄断价格来实现的。垄断组织操纵价格带来的结果是抑制了市场上价格的自由波动，垄断价格一定时期内背离生产价格和价值。但是，垄断价格的产生没有否定价值规律，这是因为，从全社会看", "opts": {"A": "整个社会商品的价值仍然是由生产它们的社会必要劳动时间决定的", "B": "垄断低价低于原材料生产价格的部分和垄断高价高于出售商品生产价格的部分能够相抵", "C": "垄断价格既不能增加也不能减少整个社会所生产的价值总量", "D": "商品的价格总额仍然等于商品的价值总额"}, "ans": "ACD", "ana": "从全社会看，商品价值仍由社会必要劳动时间决定，垄断价格既不能增加也不能减少社会价值总量，只是对价值和剩余价值作有利于垄断资本的再分配，商品价格总额仍等于价值总额，A、C、D正确。B错：垄断高价与垄断低价是两种形式，不存在数额相抵问题。", "dis": "", "ext": "垄断价格不否定价值规律：总量不变，只是再分配。", "year": 2026}, {"id": "x1-21", "set": 1, "num": 21, "src": "肖八（一套）", "book": "肖八", "sub": "马原", "type": "multi", "stem": "1921年3月，俄共（布）召开十大，毅然决定从战时共产主义政策过渡到实行新经济政策。这一决定表明，列宁的社会主义建设思想发生了重大转变，对俄国这样一个小农经济占优势的国家如何走向社会主义又有了新的认识。新经济政策的主要内容有", "opts": {"A": "用粮食税制取代余粮收集制", "B": "允许私人自由贸易，恢复商品货币关系", "C": "允许私人小工业企业发展", "D": "采取一些国家资本主义的形式来发展生产"}, "ans": "ABCD", "ana": "新经济政策主要内容：用粮食税取代余粮收集制、允许私人自由贸易恢复商品货币关系、允许私人小工业企业发展、采取一些国家资本主义形式发展生产，ABCD全选。", "dis": "", "ext": "新经济政策四项：粮食税、自由贸易、私人小工业、国家资本主义。", "year": 2026}, {"id": "x1-22", "set": 1, "num": 22, "src": "肖八（一套）", "book": "肖八", "sub": "毛中特", "type": "multi", "stem": "从中华人民共和国成立到社会主义改造基本完成，是我国从新民主主义到社会主义的过渡时期。这一时期，我国社会的性质是新民主主义社会。新民主主义社会不是一个独立的社会形态，而是由新民主主义向社会主义转变的过渡性社会形态。新民主主义社会要继续向前发展，就要", "opts": {"A": "不断扩大国营经济", "B": "逐步将资本主义经济和个体经济改变为社会主义经济", "C": "使合作社经济逐步成为我国的经济基础", "D": "彻底废除列强强加给中国的不平等条约和帝国主义在中国的一切特权"}, "ans": "AB", "ana": "新民主主义社会五种经济成分中，半社会主义性质的合作社经济是个体经济向社会主义集体经济过渡的形式，国家资本主义经济是私人资本主义向国营经济过渡的形式；主要经济成分是社会主义经济、个体经济、资本主义经济。要继续发展就要不断扩大国营经济，逐步将资本主义经济和个体经济改变为社会主义经济，A、B正确，C错（不是使合作社经济成为基础）。D是新中国成立时已完成的任务，错。", "dis": "", "ext": "五种经济成分；两种过渡形式（合作社、国家资本主义）。", "year": 2026}, {"id": "x1-23", "set": 1, "num": 23, "src": "肖八（一套）", "book": "肖八", "sub": "新思想", "type": "multi", "stem": "党的十八大以来，习近平总书记对文化在经济社会发展中的关键作用作出深邃思考和科学擘画，提出一系列重大创新观点，作出全方位战略部署。习近平总书记在参加十四届全国人大三次会议江苏代表团审议时明确提出“以文化赋能经济社会发展”的重大命题。这一重大命题的提出和丰富发展，反映了我们党对文化与经济社会发展关系的规律性认识不断深化。文化之所以能够赋能经济社会发展，是因为文化", "opts": {"A": "涵育社会主体的创新意识，能够激活并释放创造潜能", "B": "蕴含丰厚创新资源，能够为高质量发展注入创造活力", "C": "营造创新生态，能够为高质量发展提供创造环境", "D": "是一种深层次的精神力量，能够引领经济社会高质量发展的方向"}, "ans": "ABCD", "ana": "文化是深层次精神力量，能引领高质量发展方向；培育共同价值基础、明确价值取向；滋养新发展理念、提供方法论指引；提升社会文明程度和治理效能、营造良好社会环境；是创新创造的精神源泉，涵育创新意识、蕴含创新资源、营造创新生态，A、B、C、D全选。", "dis": "", "ext": "文化赋能的四条路径：价值引领、理念滋养、环境营造、创新激活。", "year": 2026}, { ", "stem": "经过多年实践，中国中车探索出一条以能力迁移和系统协同为特征的“第二曲线”培育路径。这套产业培育体系充分利用了技术同源、产业共链等优势。比如，风电机组可以看成“立起来的高铁”。原因在于，风力发电的过程与高铁电制动的过程和原理是一样的。从利用800千瓦“铁路机车交流电机”试验平台，匹配完成了660千瓦“风力发电机”的出厂试验和型式试验，到移植“高原机车”的设计与运维经验，研发出“高海拔风机”，中国中车迅速在风电装备领域崭露头角。将高铁领域积累的可靠性设计体系、工程化经验、精密制造技术以及质量保障能力移植到风电产业，中国中车快速突破风电整机核心技术，向市场提供高性能、长寿命的高质量风电装备。这套产业培育体系蕴含的哲学道理是", "opts": {"A": "规律起作用的范围是可以任意改变的", "B": "矛盾的普遍性和特殊性相互联结", "C": "间接经验比直接经验更可靠", "D": "正确的理论是真理与价值统一的基础"}, "ans": "B", "ana": "高铁技术能移植到风电机组，正是利用矛盾的普遍性与特殊性“互相联结”的关系——共性寓于个性之中，B正确。A错：规律起作用的范围不能任意改变；C错：间接经验与直接经验不存在谁更可靠；D错：实践才是真理与价值统一的基础。", "dis": "", "ext": "共性寓于个性；技术迁移的哲学依据。", "year": 2026}, {"id": "x3-2", "set": 3, "num": 2, "src": "肖八（三套）", "book": "肖八", "sub": "马原", "type": "single", "stem": "当今中国正处于实现中华民族伟大复兴的关键期，比以往更需要以先进理念统一思想、以科学理论汇聚力量。马克思指出：“理论只要说服人，就能掌握群众；而理论只要彻底，就能说服人。”这里的“彻底”是指", "opts": {"A": "抓住事物的根本", "B": "具备形式上的逻辑性", "C": "内容上包罗万象", "D": "具有直接现实性"}, "ans": "A", "ana": "理论“彻底”是指抓住事物的根本，A正确。真理不在于内容包罗万象或形式合乎逻辑，而在于正确反映客观事物及其规律；理论属认识范畴，不具有直接现实性。", "dis": "", "ext": "“彻底”＝抓住根本（马克思《黑格尔法哲学批判》导言）。", "year": 2026}, {"id": "x3-3", "set": 3, "num": 3, "src": "肖八（三套）", "book": "肖八", "sub": "马原", "type": "single", "stem": "根据资本在剩余价值生产中所起的不同作用，可以将资本划分为不变资本与可变资本。可变资本的价值", "opts": {"A": "在多次生产过程中逐渐转移到新产品中", "B": "是雇佣工人剩余劳动的凝结", "C": "由工人的劳动再生产出来", "D": "全部被资本家以利润的形式无偿占有"}, "ans": "C", "ana": "可变资本是购买劳动力的部分，其价值不是被转移到新产品中，而是由工人的劳动再生产出来的，C正确。A是生产资料（不变资本）的价值转移；B、D描述的是剩余价值。", "dis": "", "ext": "可变资本价值由工人劳动再生产；不变资本价值靠转移。", "year": 2026}, {"id": "x3-4", "set": 3, "num": 4, "src": "肖八（三套）", "book": "肖八", "sub": "马原", "type": "single", "stem": "经济危机实际上是资本主义条件下以强制的方式解决社会再生产的实现问题的途径。资本主义经济危机具有周期性，这是由", "opts": {"A": "社会资本再生产的周期性决定的", "B": "资本有机构成不断降低的一般趋势决定的", "C": "资本主义基本矛盾运动的阶段性决定的", "D": "货币作为价值尺度和流通手段决定的"}, "ans": "C", "ana": "资本主义经济危机具有周期性，由资本主义基本矛盾运动的阶段性决定，C正确。A把因果颠倒；B资本有机构成是提高趋势；D只是危机的抽象可能性。", "dis": "", "ext": "危机周期性的根源：基本矛盾运动的阶段性。", "year": 2026}, {"id": "x3-5", "set": 3, "num": 5, "src": "肖八（三套）", "book": "肖八", "sub": "毛中特", "type": "single", "stem": " 想正式提出五周年之际，中共中央宣传部、中央全面依法治国委员会办公室组织对2021年出版的《习近平法治思想学习纲要》进行修订，编写了《习近平法治思想学习纲要（2025年版）》，将习近平法治思想核心要义之一的“坚持在法治轨道上推进国家治理体系和治理能力现代化”发展为“坚持在法治轨道上全面建设社会主义现代化国家”，这一变化", "opts": {"A": "明确了全面依法治国的时代使命", "B": "彰显了法治在推进中国式现代化中的基础性、全局性、保障性地位和作用", "C": "标志着我们党对中国式现代化规律与社会主义法治建设规律的认识更加深化", "D": "意味着全面建设社会主义现代化国家成为全面推进依法治国的总目标"}, "ans": "ABC", "ana": "全面依法治国是国家治理的一场深刻革命，关系党执政兴国、人民幸福安康、党和国家长治久安（A），要发挥法治固根本、稳预期、利长远的保障作用（B、C）。", "dis": "", "ext": "法治三“利”：固根本、稳预期、利长远。", "year": 2026}, {"id": "x3-32", "set": 3, "num": 32, "src": "肖八（三套）", "book": "肖八", "sub": "时政", "type": "multi", "stem": "2026年9月16日，平陆运河正式通航。“广西货不走广西港”成为历史，“近海不达海”千年困局被打破。平陆运河", "opts": {"A": "是新中国成立以来第一条国家层面统筹建设的通江达海运河", "B": "是西部陆海新通道骨干工程和加快建设交通强国的标志性工程", "C": "使西南地区新添运距最短、最经济、最便捷的出海通道", "D": "在中国和东盟之间架设了一条货物双向流动的“超级通道”"}, "ans": "ABCD", "ana": "平陆运河：新中国成立以来第一条国家层面统筹建设的通江达海运河，打破“近海不达海”千年困局，为西南地区添最短最近最便的出海通道（A），是西部陆海新通道骨干工程和交通强国标志性工程（B），建成后打通南北纵向水脉、推动陆海内外联动与东西双向互济（C），并在中国与东盟之间架起“超级通道”（D），全选。", "dis": "", "ext": "平陆运河＝西部陆海新通道骨干＋面向东盟超级通道。", "year": 2026}, {"id": "x3-33", "set": 3, "num": 33, "src": "肖八（三套）", "book": "肖八", "sub": "时政", "type": "multi", "stem": "2026年7月16日，成立世界人工智能合作组织协定签署仪式在上海举行。世界人工智能合作组织", "opts": {"A": "是联合国的专门机构并遵循《联合国宪章》宗旨", "B": "是全球首个人工智能政府间国际组织", "C": "旨在促进入工智能国际合作和全球治理", "D": "旨在确保人工智能朝着有益、安全、公平方向健康有序发展"}, "ans": "BCD", "ana": "世界人工智能合作组织是独立的政府间国际组织（B），遵循《联合国宪章》宗旨（D），全球首个AI政府间国际组织、总部设在上海（C）。A错：它遵循联合国宪章，但不是联合国专门机构。", "dis": "", "ext": "AI合作组织：总部上海、首个AI政府间组织。", "year": 2026}, {"id": "x4-1", "set": 4, "num": 1, "src": "肖八（四套）", "book": "肖八", "sub": "马原", "type": "single", "stem": "在深邃的海底世界，章鱼是当之无愧的“伪装大师”。当它游过珊瑚礁时，皮肤几乎在瞬间就能从米色变得灰褐，质感也从光滑变得粗糙，与周围岩石的纹理和色彩“完美融合”。人工材料能否像章鱼一样，拥有魔术般的“变装”能力？《自然》杂志发表了一项新成果，受章鱼、乌贼等头足类动物启发，科研团队开发出一种新型聚合物材料，首次实现在单一器件上对表面视觉纹理和结构色彩的独立、动态调控。这项技术有望为动态伪装、自适应显示、智能建筑以及互动艺术等领域，提供全新的解决方案。模仿章鱼开发具有“变装”能力的材料，这表明", "opts": {"A": "自然界与人类社会相互依存、互为前提", "B": "世界的现存形式可以满足人的一切需要", "C": "自然界运行的固有规律也是人类社会的发展规律", "D": "自然界与人类社会是交叉重叠和相互作用的"}, "ans": "D", "ana": "自然界与人类社会交叉重叠、相互作用：在自然界中有“人化自然”，在社会中有自然物质和自然力的运用。科研人员开发新型材料的机理源自自然界，应用后又反作用于自然界，使自在自然不断转化为人化自然，D正确。", "dis": "", "ext": "人与自然：自在自然→人化自然。", "year": 2026}, {"id": "x4-2", "set": 4, "num": 2, "src": "肖八（四套）", "book": "肖八", "sub": "马原", "type": "single", "stem": "2026年4月28日召开的中央政治局会议指出，加强水网、新型电网、算力网、新一代通信网、城市地下管网、物流网（“六张网”）等规划建设；7月30日召开的中央政治局会议进一步强调，扎实推进“六张网”规划建设。如果把整个现代化产业体系比作一个顶天立地的巨人，传统产业、新兴产业和未来产业就是巨人的“筋骨”，“六张网”则是贯通全身的“脉络”。有了它们，要素才能自由流动，国内大循环与国内国际双循环才能真正畅通无阻。“六张网”把中国经济连成一个充满活力的有机整体，这表明", "opts": {"A": "事物之间的联系离不开人的参与", "B": "事物的普遍联系是通过中介来实现的", "C": "网络是世界普遍联系的基础", "D": "任何事物之间都存在着本质联系"}, "ans": "B", "ana": "世界的普遍联系是通过“中介”实现的，所谓中介即事物相互联系的媒介、环节或桥梁，B正确。A错：联系具有客观性，不以人的意志为转移；C错：世界的物质统一性是普遍联系的基础；D错：联系是多样的，不是只有“直接联系”。", "dis": "", "ext": "联系的中介性（这是易混点：中介≠直接）。", "year": 2026}, {"id": "x4-3", "set": 4, "num": 3, "src": "肖八（四套）", "book": "肖八", "sub": "马原", "type": "single", "stem": "像任何商品一样，劳动力商品也具有价值和使用价值。但是，劳动力是特殊的商品，它的价值和使用价值具有不同于普通商品的特点。由于劳动力价值的构成包含历史和道德的因素，在不同的国家或在同一国家的不同历史时期，劳动力价值的最低界限是有区别的。一旦劳动力价值降低到这个最低界限以下，劳动力就只能在萎缩的状态下维持。劳动力价值的最低界限是由", "opts": {"A": "资本家主观的剥削意愿决定的", "B": "劳动者的最低劳动强度决定的", "C": "资本循环中能够维持生产的不变资本的价值决定的", "D": "生活上不可缺少的生活资料的价值决定的"}, "ans": "D", "ana": "劳动力价值由生产、发展、维持和延续劳动力所必需的生活必需品的价值决定，包括三部分：维持劳动者本人生存所需生活资料价值、维持劳动者家属生存所需生活资料价值、劳动者接受教育和训练所支出的费用，D正确。", "dis": "", "ext": "劳动力价值三部分（本人＋家属＋教育培训）。", "year": 2026}, {"id": "x4-11", "set": 4, "num": 11, "src": "肖八（四套）", "book": "肖八", "sub": "史纲", "type": "single", "stem": "在中国早期马克思主义者的队伍中，李大钊是代表人物。1919年8月，李大钊在《再论问题与主义》一文中指出：“一个社会主义者，为使他的主义在世界上发生一些影响，必须要研究怎么可以把他的理想尽量应用于环绕着他的实境。”在《我的马克思主义观》一文中，他一方面肯定马克思主义是“世界改造原动的学说”，具有普遍意义；另一方面又指出，“马氏的学说，实在是一个时代的产物”，“我们不可不考虑我们的环境‘就那样整个拿来，应用于我们生存的社会”。这说明，中国早期马克思主义者", "opts": {"A": "开始认识到必须把改造国民性置于优先地位", "B": "已在实际上初步形成了马克思主义应当与中国具体实际相结合的思想", "C": "仍然在马克思主义与社会民主主义等流派中进行反复比较", "D": "明确提出马克思主义时代化的任务"}, "ans": "B", "ana": "中国早期马克思主义思想运动的特点：重视马克思主义基本理论学习，明确同第二国际社会民主主义划清界限（B）；注意从中国实际出发学习运用马克思主义（李大钊《我的马克思主义观》）；开始提出知识分子应当同劳动群众相结合的思想。A错：五四以前的新文化运动倡导者已把改造国民性置于优先地位；C错；D错：“马克思主义中国化”命题由毛泽东在六届六中全会提出。", "dis": "", "ext": "早期马克思主义运动三特点；中国化命题出自六届六中全会。", "year": 2026}, {"id": "x4-12", "set": 4, "num": 12, "src": "肖八（四套）", "book": "肖八", "sub": "史纲", "type": "single", "stem": "1945年4月23日至6月11日，中国共产党第七次全国代表大会在延安举行。中共七大制定了新民主主义国家在政治、经济、文化方面的纲领，并提出了", "opts": {"A": "完整的新民主主义革命的总路线", "B": "实现“四个现代化”的宏伟目标", "C": "实现中国工业化的宏伟任务", "D": "“马克思主义的中国化”的命题"}, "ans": "C", "ana": "中共七大制定新民主主义国家政治、经济、文化纲领，提出实现中国工业化的宏伟任务，并首次在党的文件上明确提出“生产力标准”——一切政党的政策及其实践，归根到底看它对于中国人民生产力发展是否有帮助，C正确。", "dis": "", "ext": "七大首次提出“生产力标准”。", "year": 2026}, {"id": "x4-13", "set": 4, "num": 13, "src": "肖八（四套）", "book": "肖八", "sub": "史纲", "type": "single", "stem": "1979年3月30日，邓小平在党的理论工作务虚会上发表《坚持四项基本原则》的讲话。他指出：坚持社会主义道路，坚持人民民主专政，坚持共产党的领导，坚持马克思列宁主义、毛泽东思想这四项基本原则，“是实现四个现代化的根本前提”。“如果动摇了这四项基本原则中的任何一项，那就动摇了整个社会主义事业，整个现代化建设事业。”他还提出一个重要思想：“现在搞建设，也要适合中国情况，走出一条中国式的现代化道路。”这表明", "opts": {"A": "中国共产党所领导的改革开放从一开始就具有明确的社会主义方向", "B": "中国式现代化只能基于自身国情，不能借鉴他国经验", "C": "“中国特色社会主义”从此成为我们党的全部理论和实践创新的主题", "D": "马克思主义同中国实际“第二次结合”任务的正式提出"}, "ans": "A", "ana": "邓小平《坚持四项基本原则》的讲话郑重表明，党所领导的改革开放从一开始就具有明确的社会主义方向，A正确。B错：不能照搬别国经验与模式；C错：“建设有中国特色的社会主义”是十二大开幕词提出；D错：“第二次结合”是1956年毛泽东提出。", "dis": "", "ext": "四项基本原则＝改革开放的社会主义方向保证。", "year": 2026}, {"id": "x4-14", "set": 4, "num": 14, "src": "肖八（四套）", "book": "肖八", "sub": "思法", "type": "single", "stem": "中国革命道德是指中国共产党人、人民军队、一切先进分子和人民群众在中国革命、建设、改革中所形成的优秀道德，是马克思主义与中国革命、建设、改革的伟大实践相结合的产物，是中华民族极其宝贵的道德财富。中国革命道德的灵魂是", "opts": {"A": "坚持社会主义和共产主义理想信念", "B": "全心全意为人民服务", "C": "始终把革命利益放在首位", "D": "修身自律、保持节操"}, "ans": "A", "ana": "社会主义和共产主义理想信念是革命道德的“灵魂”，A正确。全心全意为人民服务是贯穿中国革命道德始终的一根红线。", "dis": "", "ext": "革命道德的灵魂＝理想信念；红线＝为人民服务。", "year": 2026}, {"id": "x4-15", "set": 4, "num": 15, "src": "肖八（四套）", "book": "肖八", "sub": "时政", "type": "single", "stem": "2026年10月9日，《中共中央 国务院关于发展新质生产力的意见》公开发布。《意见》提出发展新质生产力要坚持创新主导、改革为要、因地制宜、先立后破。坚持创新主导，就是要把创新作为发展新质生产力的", "opts": {"A": "逻辑起点", "B": "关键一招", "C": "实践准则", "D": "方法路径"}, "ans": "A", "ana": "坚持创新主导，就是把创新作为发展新质生产力的逻辑起点，A正确。改革为要＝关键一招；因地制宜＝实践准则；先立后破＝方法路径。", "dis": "", "ext": "新质生产力“四个坚持”各自对应。", "year": 2026}, {"id": "x4-16", "set": 4, "num": 16, "src": "肖八（四套）", "book": "肖八", "sub": "时政", "type": "single", "stem": "2026年6月，中国国务院新闻办公室发布《构建更加公正合理的全球治理体系：中国的理念、倡议与行动》白皮书。白皮书强调，中国提出全球治理倡议，旨在推动构建更加公正合理的全球治理体系。落实全球治理倡议，最关键的是", "opts": {"A": "坚定维护联合国的权威和地位", "B": "大国展现责任担当", "C": "各国团结合作", "D": "弥补和平与发展赤字"}, "ans": "B", "ana": "落实全球治理倡议：最根本的是坚定维护联合国权威和地位（B），最关键的是大国展现责任担当，最需要的是各国团结合作，最紧迫的是弥补和平与发展赤字。", "dis": "", "ext": "全球治理倡议“四个最”。", "year": 2026}, {"id": "x4-17", "set": 4, "num": 17, "src": "肖八（四套）", "book": "肖八", "sub": "马原", "type": "multi", "stem": "习近平总书记指出，科技突破的程度，很大程度上决定未来产业发展的速度、广度、深度。要充分发挥新型举国体制优势，坚持“产业出题、科技答题”，加大重点领域关键核心技术攻关力度，加强基础研究战略性、前瞻性、体系化布局，加快科技成果转化应用。“产业出题、科技答题”从一个侧面说明", "opts": {"A": "实践是认识发展的动力", "B": "认识是实践的源头活水", "C": "认识与实践具有完全同步性", "D": "认识世界是为了改造世界"}, "ans": "AD", "ana": "实践是认识发展的动力，需要的推动使认识不断产生发展（A）；认识世界的目的是改造世界（D）。B错：实践是认识的来源与源头活水，不是“目的”；C错：具体认识过程可与实践不完全同步（预测、假说可超前）。", "dis": "", "ext": "实践＝动力＋目的（不是来源的同义重复）。", "year": 2026}, {"id": "x4-18", "set": 4, "num": 18, "src": "肖八（四套）", "book": "肖八", "sub": "马原", "type": "multi", "stem": "2026年初，一款嘴巴缝反了的“哭哭马”毛绒玩偶悄然走红，成为许多消费者争相入手的“心头好”。这匹小马没有复杂的功能，却以憨态可掬、略带委屈的形象，精准触动人们心中柔软的一角，引发情感共鸣和消费热潮。从“缝制失误品”变身全网追捧的“情绪搭子”，这一现象看似偶然，实则折射出悦己消费蓬勃兴起，彰显其作为新型消费的强劲增长势头。从“缝制失误品”变身全网追捧的“情绪搭子”表明", "opts": {"A": "事物的矛盾运动是一个动态的过程，次要矛盾也可以对事物发展起决定作用", "B": "偶然性是必然性的表现形式，个别产品走红背后有消费趋势的必然性", "C": "价值评价结果与主体直接相关，不同消费者对同一商品的感受和评价可能不同", "D": "形式对内容具有决定作用，要积极利用合适的形式去促进内容的发展"}, "ans": "BC", "ana": "必然总伴随并表现为偶然，“缝制失误品”意外走红背后是悦己消费兴起的必然，B正确；不同主体需要存在差异甚至对立，导致评价差异甚至对立，C正确。A错（主要矛盾定义无误但不符合材料）；D错：内容对形式起决定作用。", "dis": "", "ext": "必然通过偶然表现；评价主体差异→评价结果差异。", "year": 2026}, {"id": "x4-19", "set": 4, "num": 19, "src": "肖八（四套）", "book": "肖八", "sub": "马原", "type": "multi", "stem": "资本是在运动中增殖的，必须不断地、周而复始地循环，才能不断地带来剩余价值。这种周而复始、不断反复着的资本循环，叫作资本的周转。影响资本周转快慢的因素有许多，关键的因素有", "opts": {"A": "资本周转的时间", "B": "所用资本和所费资本之间的差额", "C": "生产资本的固定资本和流动资本的构成", "D": "资本家预付资本的大小"}, "ans": "AC", "ana": "加速资本周转的两个关键因素：资本周转时间的长短（A）、生产资本中固定资本与流动资本的构成（C）。", "dis": "", "ext": "资本周转快慢两个关键：周转时间＋固定/流动构成比例。", "year": 2026}, {"id": "x4-20", "set": 4, "num": 20, "src": "肖八（四套）", "book": "肖八", "sub": "马原", "type": "multi", "stem": "垄断资本在国内建立了垄断统治后，必然要把其统治势力扩展到国外，建立国际垄断统治。垄断资本向世界范围扩展的基本形式有", "opts": {"A": "技术资本输出", "B": "借贷资本输出", "C": "生产资本输出", "D": "商品资本输出"}, "ans": "BCD", "ana": "垄断资本向世界范围扩展的基本形式有三种：借贷资本输出、生产资本输出、商品资本输出（B、C、D）。A错（私人资本输出/国家资本输出只是按主体分类，不是“基本形式”）。", "dis": "", "ext": "资本输出三形式：借贷、生产、商品。", "year": 2026}, {"id": "x4-21", "set": 4, "num": 21, "src": "肖八（四套）", "book": "肖八", "sub": "马原", "type": "multi", "stem": "马克思、恩格斯关于未来社会的预测，是在科学地批判和剖析资本主义社会的过程中作出的。马克思、恩格斯对资本主义批判的高明之处在于", "opts": {"A": "不是只看到资本主义社会的弊端，而是进一步揭示出弊端的根源和资本主义发展中自我否定的力量", "B": "发现资本主义的矛盾运动中孕育着的新社会因素，并以此对未来社会特点作出预见", "C": "既从资本主义社会中寻找灵感，更从社会主义社会的建设与发展中寻找启示", "D": "先指出未来社会的一般特征，再对各种细节作具体描绘"}, "ans": "AB", "ana": "马克思、恩格斯批判资本主义的高明在于不停留于弊端，而是揭示弊端根源、发现资本主义自我否定的力量、从矛盾运动中预见新社会因素（A、B）。C错：马恩时代还没有社会主义社会；D错：经典作家只揭示一般特征，不作具体细节规定。", "dis": "", "ext": "预见未来社会的两条高明之处。", "year": 2026}, {"id": "x4-22", "set": 4, "num": 22, "src": "肖八（四套）", "book": "肖八", "sub": "毛中特", "type": "multi", "stem": "在一个几亿人口的大国中比较顺利地实现了如此复杂、困难和深刻的社会主义改造，不仅没有造成生产力的破坏，反而促进了工农业和整个国民经济的发展；不仅没有引起巨大的社会动荡，反而极大地加强了人民的团结，并且是在人民普遍拥护的情况下完成的。这些情况说明，我国社会主义改造的基本完成的确是一个伟大的历史性胜利。我国社会主义改造的成功经验在于", "opts": {"A": "坚持“一举过渡”", "B": "坚持社会主义工业化建设与社会主义改造同时并举", "C": "采取积极引导、逐步过渡的方式", "D": "用和平方法进行改造"}, "ans": "BCD", "ana": "社会主义改造的历史经验三条：坚持社会主义工业化建设与社会主义改造同时并举（B）；采取积极引导、逐步过渡的方式（C）；用和平方法进行改造（D）。A错：“一举过渡”是建国初的设想，后来才转向“建设和改造同时并举、逐步过渡”。", "dis": "", "ext": "三大改造三条经验。", "year": 2026}, {"id": "x4-23", "set": 4, "num": 23, "src": "肖八（四套）", "book": "肖八", "sub": "新思想", "type": "multi", "stem": "习近平新时代中国特色社会主义思想是马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合的重大成果，是坚持“两个结合”的光辉典范。“两个结合”是", "opts": {"A": "开辟和发展中国特色社会主义的必由之路", "B": "推进马克思主义中国化时代化的根本途径", "C": "我们取得成功的最大法宝", "D": "我们党坚定信仰信念、把握历史主动的根本所在"}, "ans": "ABC", "ana": "党坚定信仰信念、把握历史主动的根本所在是拥有马克思主义科学理论指导，D不符合题意（题干问的不是这个），A、B、C正确。", "dis": "", "ext": "根本所在＝马克思主义科学理论指导（这是D的定位，别混）。", "year": 2026}, {"id": "x4-24", "set": 4, "num": 24, "src": "肖八（四套）", "book": "肖八", "sub": "新思想", "type": "multi", "stem": "携程垄断案的查处是平台经济反垄断常态化监管的又一重大标志性案件，也是深入整治“内卷式”竞争，推动平台企业和平台内经营者、劳动者共赢发展的典型案例。查处携程垄断案发出了深入整治“内卷式”竞争的强烈信号，有利于", "opts": {"A": "推动我国平台经济创新和健康发展", "B": "通过法律手段禁止平台企业做大做强", "C": "疏通被垄断行为淤塞的公平竞争机制", "D": "推动行业形成“优质优价、良性竞争”的正向循环"}, "ans": "ACD", "ana": "携程垄断案查处是平台经济反垄断常态化监管的又一标志性案件：新型垄断行为首案、首次同时给予3种处罚（A）；推动行业从“价格战”转向“价值战”、形成“优质优价、良性竞争”正向循环（C）；反垄断不只是纠正平台行为，更是保护平台经济生态（D）。B错：反垄断执法的最大价值不在高额罚款，而在疏通公平竞争机制。", "dis": "", "ext": "平台反垄断＝保护生态，时机在“内卷式”竞争。", "year": 2026}, {"id": "x4-25", "set": 4, "num": 25, "src": "肖八（四套）", "book": "肖八", "sub": "新思想", "type": "multi", "stem": "坚持投资于物和投资于人紧密结合，是做好新形势下经济工作的五条规律性认识之一，实现了发展方式从“物本优先”向“物人协同”的历史性转变，是新时代推进中国式现代化的战略举措，为“十五五”时期乃至更长阶段的发展提供了根本遵循。坚持投资于物和投资于人紧密结合，是", "opts": {"A": "实现高质量发展的重要引擎，让发展动能更充沛", "B": "构建新发展格局的关键抓手，让内需更强劲", "C": "实现共同富裕的必然要求，让发展更普惠", "D": "赢得全球竞争的战略举措，让底气更充足"}, "ans": "ABCD", "ana": "坚持投资于物和投资于人紧密结合，是对我国投资理念、方向、重点的提升优化（A、B），是实现高质量发展的重要引擎（C）、构建新发展格局的关键抓手（D），全选。", "dis": "", "ext": "投资于物＋投资于人。", "year": 2026}, {"id": "x4-26", "set": 4, "num": 26, "src": "肖八（四套）", "book": "肖八", "sub": "新思想", "type": "multi", "stem": "《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》把严格贯彻执行民主集中制作为全面从严治党的重要着力点，并作出了具体部署，主要有", "opts": {"A": "坚持和加强党中央集中统一领导", "B": "提高党内民主质量", "C": "严格执行领导班子决策议事规则", "D": "规范“一把手”履职用权"}, "ans": "ABCD", "ana": "决定》把严格贯彻执行民主集中制作为全面从严治党的重要着力点，从4方面部署：坚持和加强党中央集中统一领导、提高党内民主质量、严格执行领导班子决策议事规则、规范“一把手”履职用权，全选。", "dis": "", "ext": "民主集中制4条部署。", "year": 2026}, {"id": "x4-27", "set": 4, "num": 27, "src": "肖八（四套）", "book": "肖八", "sub": "史纲", "type": "multi", "stem": "青年时代，孙中山先生目睹山河破碎、生灵涂炭，高扬反对封建专制统治的旗帜，毅然投身民主革命事业。1894年，孙中山北上京津向李鸿章上书，提出“人能尽其才，地能尽其利，物能尽其用，货能畅其流”的主张，但是李鸿章并没有重视他的意见。孙中山在北上京津的过程中，发现清政府的腐败比他原先了解的要严重得多。这时，他“积渐而知和平之手段不得不稍易以强迫”，决心以革命的方式推翻清朝的统治。这说明", "opts": {"A": "中国革命的先驱者早年也曾尝试采取和平的手段来推进中国的变革与进步", "B": "近代中国的革命从根本上说是被外国侵略者和本国封建统治者逼迫出来的", "C": "孙中山从一开始就没有寄希望于进行自上而下的改革", "D": "孙中山意识到“欲图根本之救亡”必须改造中国的国民性"}, "ans": "AB", "ana": "近代中国革命从根本上是被外国侵略者和本国封建统治者逼迫出来的（A）；孙中山早年为推进变革也曾尝试和平手段，1894年上书李鸿章（B）。C错：他后来发现和平手段不得不稍易以强迫，才转向革命；D错：新文化运动1915年兴起。", "dis": "", "ext": "孙中山：先上书（和平）→后革命。", "year": 2026}, {"id": "x4-28", "set": 4, "num": 28, "src": "肖八（四套）", "book": "肖八", "sub": "史纲", "type": "multi", "stem": "近代以来，为挽救国家危亡，中国先进分子曾历尽千辛万苦，向西方国家寻找真理。但是，中国人学习西方的努力在实践中却一再碰壁。辛亥革命的失败和北洋军阀统治的建立，更使人们陷入深深的绝望、苦闷和彷徨中。一些先进的中国知识分子决心发动一场新的启蒙运动，这个运动后来被称为新文化运动。1915年兴起的新文化运动", "opts": {"A": "动摇了封建正统思想的统治地位", "B": "促成了中国近代教育的开始", "C": "在中国社会掀起一股思想解放的潮流", "D": "为人们提供了一种有效的思想武器去认识和改造中国社会"}, "ans": "AC", "ana": "新文化运动以进化论观点和个性解放思想为武器，抨击“往圣先贤”（A），提倡新道德、新文学（白话文），动摇了封建正统思想的统治地位（C）。B错：中国近代教育的开始是洋务运动时期的新式学堂、官派留学生；D错：资产阶级民主主义不能提供有效思想武器。", "dis": "", "ext": "新文化运动两大武器：进化论＋个性解放。", "year": 2026}, {"id": "x4-29", "set": 4, "num": 29, "src": "肖八（四套）", "book": "肖八", "sub": "史纲", "type": "multi", "stem": "1956年9月15日至27日，中国共产党第八次全国代表大会在北京举行。党的八大正确分析了国内形势和主要矛盾的变化，明确提出新形势下党和人民的主要任务。党的八大通过了新党章，这是中国共产党在全国执政以后制定的第一部党章。新党章根据执政党的特点", "opts": {"A": "提出了全面开展社会主义建设的任务", "B": "对贯彻党的民主集中制的根本原则作出了许多新规定", "C": "对毛泽东思想的科学体系和活的灵魂作了概括", "D": "在党员义务方面增加“维护党的团结，巩固党的统一”“对党忠诚老实”等内容"}, "ans": "ABD", "ana": "八大党章是党在全国执政以后制定的第一部党章（A）；根据执政党特点提出全面开展社会主义建设任务（B）；对民主集中制原则作出新规定（D）。C错：毛泽东思想科学体系和活的灵魂的概括是十一届六中全会《决议》，不属于八大党章内容。", "dis": "", "ext": "八大党章＝执政后第一部党章。", "year": 2026}, {"id": "x4-30", "set": 4, "num": 30, "src": "肖八（四套）", "book": "肖八", "sub": "思法", "type": "multi", "stem": "“十五五”开局之年，在习近平总书记亲自指导、引领推动下，树立和践行正确政绩观学习教育在全党扎实深入开展。“政绩”一词，古已有之，文脉悠长，《后汉书·虞延传》中就有“历位二府，十余年无异政绩”的记载。这一理念深植于中华优秀传统文化沃土，薪火赓续、历久弥新，积淀升华为中华政治文明中独具特质的精神标识与文化基因。以下选项中体现政绩理念的有", "opts": {"A": "“以富乐民为功，以贫苦民为罪”", "B": "“为政之道，莫若至公”", "C": "“先天下之忧而忧，后天下之乐而乐”", "D": "“不作无补之功，不为无益之事”"}, "ans": "ABCD", "ana": "中华优秀传统政治文化把百姓福祉、民生实效作为施政首要之务：为政以德、民心惟本，《管子》务实精神，贾谊“以富乐民为功”，范仲淹“先天下之忧而忧”，司马光“为政之道，莫若至公”，全选。", "dis": "", "ext": "传统政绩观：以百姓福祉为首务。", "year": 2026}, {"id": "x4-31", "set": 4, "num": 31, "src": "肖八（四套）", "book": "肖八", "sub": "思法", "type": "multi", "stem": "公平正义是法治思维的基本内容之一。公平正义主要包括权利公平、机会公平、规则公平和救济公平。权利公平包括", "opts": {"A": "权利和义务对等", "B": "权利主体平等" 确政绩观学习教育的总要求"}, {"id": "x5-33", "set": 5, "num": 33, "src": "肖八（五套）", "book": "肖八", "sub": "时政", "type": "multi", "year": 2026, "stem": "2026年9月1日，国家主席习近平在比什凯克召开的“上海合作组织+”会议上发表题为《共同倡导平等有序的世界多极化实现更加公正合理的全球治理》的讲话。习近平主席以我们需要什么样的多极化破题，从根本原则、必然要求、关键路径、发展方向4个维度深入阐释平等有序世界多极化的核心要义，呼吁上合组织", "opts": {"A": "以“上合力量”驱动亚欧大陆繁荣共兴", "B": "以“上合智慧”推动全球南方发展壮大", "C": "以“上合行动”引领全球治理改革完善", "D": "以“上合方案”构建人类命运共同体"}, "ans": "ABC", "ana": "习近平主席在讲话中指出，一个更加团结、更有活力的上海合作组织完全能够为推进平等有序的世界多极化贡献更大力量。第一，以“上合力量”驱动亚欧大陆繁荣共兴。第二以“上合智慧”推动全球南方发展壮大。第三，以“上合行动”引领全球治理改革完善。A、B、C正确，D错误。", "dis": "", "ext": "习近平主席在讲话中指出，一个更加团结、更有活力的上海合作组织完全能够为推进平等有序的世界多极化贡献更大力量"}, {"id": "x6-1", "set": 6, "num": 1, "src": "肖八（六套）", "book": "肖八", "sub": "马原", "type": "single", "year": 2026, "stem": "“加快构建应用场景和生态体系”“实施新技术新产品新场景大规模应用示范行动，加大场景培育和开放力度”“推动新兴领域应用场景向民营企业开放”······在“十五五”规划纲要中，“场景”一词高频出现。场景可以理解为新技术、新产品、新业态创新性应用的具体情境。在场景中进行的是系统性验证，既有技术产品、配套基础设施的“硬验证”，也有商业模式、制度改革的“软验证”。有专家指出，没有场景，技术只是“可能有用”；有了场景，技术变成“马上有用”。通过“场景”让“可能有用”变成“马上有用”，这一做法", "opts": {"A": "揭示了可能中是否包含发展成为现实的因素和根据取决于人的主观愿望", "B": "区分了可能与现实，并指出这种转化是通过人的自觉的活动实现的", "C": "证明了“场景”是由不可能转化为可能的桥梁和媒介", "D": "表明“场景”是科技创新的源头活水和所有技术问题的总机关"}, "ans": "B", "ana": "现实与可能相互区别。现实是当下的客观存在，标志着事物的当前状况；可能是事物潜在的趋势，标志着事物的发展方向。现实与可能相互转化。一方面，现实蕴藏着未来的发展方向，会不断产生新的可能：另一方面，可能包含看发展成为现实的因素和根据，一且主客观条件成熟，可能就会转化为现实。发展就是现实与可能相互转化的过程。“可能有用”说明这种技术包含着发展成为现实的因素和根据，加快“场景”建设就是通过人的自觉活动创造条件，促使好的可能得以实现，变成“马上有用”。B正确。可能包含着发展成为现实的因素和根据是客观的，不取决于人的主观愿望，A错误。不可能是指违背必然性，没有任何根据，因而在任何时候、任何条件下都不能实现的东西。C错误。基础研究是科技创新的源头活水，是整个科学体系的源头，是所有技术问题的总机关。D错误。", "dis": "", "ext": "现实与可能相互区别"}, {"id": "x6-2", "set": 6, "num": 2, "src": "肖八（六套）", "book": "肖八", "sub": "马原", "type": "single", "year": 2026, "stem": "湖北省五峰土家族自治县，群山之间，绿树成荫，蜜蜂飞舞。五峰县地处武陵山区，当地依托山高林密、花源丰富的优势，探索推进“林药蜂”生态产业模式。“林药蜂”模式，即上层培育黄柏、五倍子等乡土树种、蜜源植物，中层套种黄精等中药材，林下放养蜜蜂，形成“林养蜂、蜂促药、药护林”的良性互动，“长期得林、中期得药、短期得蜜”，实现生态效益和经济效益的双赢，“林药蜂”模式的成功是因为人们", "opts": {"A": "利用了事物之间的普遍联系", "B": "改变了自然界的客观实在性", "C": "避免了人与自然的物质变换", "D": "创造了有利于人的自然规律"}, "ans": "A", "ana": "世界上的万事万物都处于普遍联系之中。“林药蜂”模式的成功是因为人们利用了事物之间的普遍联系。A正确。人类的实践活动能够改变自然事物的形态和面貌，在自然界打上人类的印记，使之成为人化的自然，但不能改变自然界的客观实在性。B错误。自然地理环境是人类社会生存和发展永恒的、必要的条件，是人们生活和生产的自然基础。离开一定的自然条件，人们就不可能进行生活和生产。人与自然之间的物质变换是不可避免的。马克思认为，应当合理地调节人与自然之间的物质变换，在最无愧于和最适合人类本性的条件下进行这种物质变换。C错误。规律是客观的，人既不能创造也不可能改变规律。D错误。", "dis": "", "ext": "世界上的万事万物都处于普遍联系之中"}, {"id": "x6-3", "set": 6, "num": 3, "src": "肖八（六套）", "book": "肖八", "sub": "马原", "type": "single", "year": 2026, "stem": "社会生产是连续不断地进行的，这种连续不断重复的生产就是再生产。社会再生产的核心问题是", "opts": {"A": "两大部类在总量上的比例问题", "B": "社会总产品的价值补偿和实物补偿问题", "C": "工资与剩余价值的分配问题", "D": "劳动过程和价值增殖过程的统一问题"}, "ans": "B", "ana": "社会再生产的核心问题是社会总产品的实现问题，即社会总产品的价值补偿和实物补偿问题。B正确。", "dis": "", "ext": "社会再生产的核心问题是社会总产品的实现问题，即社会总产品的价值补偿和实物补偿问题"}, {"id": "x6-4", "set": 6, "num": 4, "src": "肖八（六套）", "book": "肖八", "sub": "马原", "type": "single", "year": 2026, "stem": "第二次世界大战后，由于多种社会因素的影响，资本主义发生了一系列变化。在劳资关系方面，劳动对资本的隶属从资本主义发展初期的形式上隶属逐渐成为实质上的隶属，之所以发生这种变化，是因为", "opts": {"A": "资本家与雇佣工人的关系从“自由平等”变为人身依附", "B": "终身雇佣和职工持股等方式使得劳动者成为资本家的代理人", "C": "劳动者个人的技能不再对生产过程和结果具有决定意义", "D": "雇佣劳动者的剩余劳动不再是剩余价值的唯一源泉"}, "ans": "C", "ana": "在资本主义条件下，劳动从进入生产过程开始，就已经隶属于资本，在表面平等的交换关系背后，是资本对劳动的实际支配和控制。在资本主义发展的初期，资本家指挥下的劳动只是形式上隶属于资本，随着机器大工业生产体系的建立，生产工具使用的社会化程度提高，劳动者个人的技能不再对生产过程和结果具有决定意义，劳动对资本的隶属就成为实质上的录属。C正确。与以往的剥削制度不同，资本家与雇佣工人的关系不是完全占有，也不是人身依附，而是基于劳动者人身自由基础上的“平等”关系，剥削带有一定的隐蔽性。A错误。劳动者属于受剥削的阶级，不可能成为资本家或其代理人。而且终身雇佣和职工持股也只是让工人产生归属感，从而更加自觉地服从资本家的统治，与顾目所问的劳动对资本的实质上的隶属不相符，B错误。雇佣劳动者的剩余劳动是剩余价值的唯一源泉。即使是在生产自动化条件下，雇佣工人的剩余劳动仍然是这种剩余价值的唯一源泉。D错误。", "dis": "", "ext": "在资本主义条件下，劳动从进入生产过程开始，就已经隶属于资本，在表面平等的交换关系背后，是资本对劳动的实际支配和控制"}, {"id": "x6-5", "set": 6, "num": 5, "src": "肖八（六套）", "book": "肖八", "sub": "毛中特", "type": "single", "year": 2026, "stem": "毛泽东思想是在总结我国革命和建设正反两方面历史经验的基础上，逐步形成和发展起来的毛泽东思想初步形成的标志是提出并深入阐述", "opts": {"A": "实事求是的思想路线", "B": "新民主主义理论", "C": "农村包围城市、武装夺取政权的思想", "D": "中国革命的首要问题"}, "ans": "C", "ana": "毛泽东思想初步形成的标志是提出并深入阐述农村包围城市、武装夺取政权的思想，A正确。", "dis": "", "ext": "毛泽东思想初步形成的标志是提出并深入阐述农村包围城市、武装夺取政权的思想，（正确"}, {"id": "x6-6", "set": 6, "num": 6, "src": "肖八（六套）", "book": "肖八", "sub": "毛中特", "type": "single", "year": 2026, "stem": "邓小平指出，“我们搞改革开放，把工作重心放在经济建设上，没有丢马克思，没有丢列宁，也没有丢毛泽东。老祖宗不能丢啊！问题是要把什么叫社会主义搞清楚，把怎么样建设和发展社会主义搞清楚。\"搞清楚什么是社会主义，怎样建设社会主义，关键是要在坚持社会主义基本制度的基础上", "opts": {"A": "进一步拓展党的基本路线", "B": "进一步认清社会主义的本质", "C": "进一步健全社会主义上层建筑", "D": "进一步回答“实现什么样的发展、怎样发展”的问题"}, "ans": "B", "ana": "在中国这样一个经济文化比较落后的国家建设什么样的社会主义、怎样建设社会主义是一个首要的基本的理论问题。搞清楚什么是社会主义，怎样建设社会主义，关键是要在坚持社会主义基本制度的基础上进一步认清社会主义的本质。邓小平认真总结社会主义建设的历史经验教训，指出不能离开生产力抽象地谈论社会主义，把许多束缚生产力发展的、并不具有社会主义本质属性的东西当作“社会主义原则”加以固守，把许多在社会主义条件下有利于生产力发展的东西当作“资本主义复辟”加以反对。他根据马克思主义基本原理及社会主义建设和改革开放的实践，经过深遂思考、不探索，科学地、精辟地、创造性地揭示了社会主义本质。B正确。“实现什么样的发展、怎样发展”是科学发展观回答的问题，D不符合题意。A、C错误。", "dis": "", "ext": "在中国这样一个经济文化比较落后的国家建设什么样的社会主义、怎样建设社会主义是一个首要的基本的理论问题"}, {"id": "x6-7", "set": 6, "num": 7, "src": "肖八（六套）", "book": "肖八", "sub": "新思想", "type": "single", "year": 2026, "stem": "教育是国之大计、党之大计，建设教育强国，基点在基础教育。基础教育在国民教育体系中处于基础性、先导性地位。基础教育搞得越扎实，教育强国步伐就越稳、后劲就越足。要适应人民群众新期盼，推进基础教育扩优提质，牢牢守住底线。教育要牢牢守住的底线是", "opts": {"A": "师德师风", "B": "扩优提质", "C": "教育公平", "D": "健康第一"}, "ans": "C", "ana": "2026年7月22日，全国基础教育工作会议在北京召开。会上传达了习近平总书记重要指示。习近平总书记强调，新征程上，要以习近平新时代中国特色社会主义思想为指导，全面贯彻党的教育方针，落实立德树人根本任务，坚持不用党的创新理论铸魂育人，培养德智体美劳全面发展的社会主义建设者和接班人。要遵循教育规律，落实健康第一教育理念，提升教育教学质量，促进广大学生身心健康、成长成才。要适应人民群众新期盼，推进基础教育扩优提质，牢牢守住教育公平底线。要弘扬教育家精神，加强师德师风建设，培养造就高素质专业化教师队伍。C正确，A、B、D不符合题意。", "dis": "", "ext": "2026年7月22日，全国基础教育工作会议在北京召开"}, {"id": "x6-8", "set": 6, "num": 8, "src": "肖八（六套）", "book": "肖八", "sub": "新思想", "type": "single", "year": 2026, "stem": "民生事关人民的生存生活生计，事关民心所向、民情所系、民意所指，决定党的事业成败和国家命运兴衰。保障和改善民生的重要方针是", "opts": {"A": "坚持尽力而为量力而行", "B": "坚守底线、突出重点", "C": "完善制度引导预期", "D": "坚持人人尽责、人人享有"}, "ans": "A", "ana": "坚持尽力而为、量力而行，是保障和改善民生的重要方针。A正确。坚守底线、突出重点、完善制度、引导预期，是保障和改善民生的工作思路：坚持人人尽责、人人享有，让所有劳动者在推动发展中分享发展成果，是保障和改善民生的重要原则：解决人民群众最关心、最直接、最现实的利益问题，是保障和改善民生的重中之重。B、C、D错误。", "dis": "", "ext": "坚持尽力而为、量力而行，是保障和改善民生的重要方针"}, {"id": "x6-9", "set": 6, "num": 9, "src": "肖八（六套）", "book": "肖八", "sub": "新思想", "type": "single", "year": 2026, "stem": "习近平党建思想内涵丰富、逻辑严整、系统完备、体用贯通，形成了以“十四个坚持”为“四梁八柱”的科学体系。“十四个坚持”中的“坚持健全上下贯通、执行有力的组织体系”是", "opts": {"A": "关系党和国家事业的关键性问题", "B": "全面从严治党需要牢牢牵住的“牛鼻子", "C": "全面从严治党的治本之策", "D": "党的优势所在，力量所在"}, "ans": "D", "ana": "关于学习贯彻习近平党建思想的通知》强调，要深入学习领会习近平党建思想的科学内涵。深刻领会“坚持健全上下贯通、执行有力的组织体系”是党的优势所在、力量所在：深刻领会“坚持建设堪当民族复兴重任的高素质干部队伍”是关系党和国家事业的关键性问题；深刻领会“坚持用严明的纪律管全党治全党”是全面从严治党的治本之策：深刻领会“坚持落实管党治党政治责任”是全面从严治党需要牢牢牵住的“牛鼻子”。D正确，A、B、C不符合题意。", "dis": "", "ext": "《关于学习贯彻习近平党建思想的通知》强调，要深入学习领会习近平党建思想的科学内涵"}, {"id": "x6-10", "set": 6, "num": 10, "src": "肖八（六套）", "book": "肖八", "sub": "史纲", "type": "single", "year": 2026, "stem": "从1840年至1919年的80年间，中国人民对外来侵略进行了英勇顽强的反抗。但历次的反侵略战争，都是以中国失败、中国政府被迫签订丧权唇国的条约而告结束的。近代中国反侵略战争腰遭失败的最重要的原因是", "opts": {"A": "社会制度腐败", "B": "军事战略错误", "C": "经济技术落后", "D": "思想观念保守"}, "ans": "A", "ana": "腐败的中国半殖民地半封建的社会制度，阻碍了中国人民群众的广泛动员和抵抗，这是近代中国反侵略战争屋遭失败的最重要的原因（也是更根本的原因）。近代中国反侵略战争失败的另一个重要原因，是国家综合实力特别是经济技术的落后。A正确。", "dis": "", "ext": "腐败的中国半殖民地半封建的社会制度，阻碍了中国人民群众的广泛动员和抵抗，这是近代中国反侵略战争屋遭失败的最重要的原因（也是更根本的原因）"}, {"id": "x6-11", "set": 6, "num": 11, "src": "肖八（六套）", "book": "肖八", "sub": "史纲", "type": "single", "year": 2026, "stem": "土地革命战争时期，党从残酷的现实中认识到，没有革命的武装就无法战胜武装的反革命，就无法夺取中国革命胜利，就无法改变中国人民和中华民族的命运，必须以武装的革命反对武装的反革命。党领导举行了南昌起义、秋收起义、广州起义和其他许多地区起义。其中，秋收起义不同于南昌起义的特点有\n①以攻占敌人控制比较薄弱的农村为目标\n②公开打出了“工农革命军”的旗帆3是中国共产党独立领导的革命战争\n④不仅是军队的行动，而且有数量众多的工农武装参加", "opts": {"A": "①②", "B": "①③", "C": "②④", "D": "③④"}, "ans": "C", "ana": "1927年9月9日，毛泽东等领导的湘赣边界秋收起义爆发。起义军公开打出了“工农革命军”的旗帜，这是与南昌起义不同的（南昌起义中打的是“国民革命军”的旗帜）。②正确。秋收起义不仅是军队的行动，而且有数量众多的工农武装参加。④正确。秋收起义的自标是攻打中心城市长沙。在攻打中心城市受挫后，毛泽东果断改变计划，决定向敌人控制比较薄弱的农村转移。这一点与南昌起义是相同的。①错误。南昌起义和秋收起义都是中国共产党独立领导的革命战争。③错误。因此，本题选C。", "dis": "", "ext": "1927年9月9日，毛泽东等领导的湘赣边界秋收起义爆发"}, {"id": "x6-12", "set": 6, "num": 12, "src": "肖八（六套）", "book": "肖八", "sub": "史纲", "type": "single", "year": 2026, "stem": "中国革命的发生和胜利不是偶然的，而是有着深刻的社会根源和雄厚的群众基础。由于帝国主义、封建主义、官像资本主义的残酷压迫，中国人民走上了反帝、反封建、反官像资本主义斗争的伟大道路。在中国革命过程中，曾经被人称作“开万国未有之奇”的一种现象是", "opts": {"A": "工人阶级成为革命的领导力量", "B": "农民、城市小资产阶级群众是革命的主要力量", "C": "封建势力同外国侵略势力相勾结", "D": "随着斗争的发展，民族资产阶级也逐步向共产党靠拢"}, "ans": "D", "ana": "由于帝国主义、封建主义、官像资本主义的残酷压迫，中国人民走上了反帝、反封建、反官像资本主义斗争的伟大道路。工人、农民、城市小资产阶级群众是民主革命的主要力量。随着斗争的发展，民族资产阶级也逐步向共产党靠拢，这种现象曾经被人称作“并方国未有之奇”。（民族资产阶级属于资产阶级、剥削阶级，与无产阶级之间存在矛盾。但是由于中国的特殊国情以及中国共产党的统一战线政策，民族资产阶级也逐步向共产党靠拢，因此被称为“开万国未有之奇”）D正确。", "dis": "", "ext": "由于帝国主义、封建主义、官像资本主义的残酷压迫，中国人民走上了反帝、反封建、反官像资本主义斗争的伟大道路"}, {"id": "x6-13", "set": 6, "num": 13, "src": "肖八（六套）", "book": "肖八", "sub": "史纲", "type": "single", "year": 2026, "stem": "青青柏坡岭，派滤沱河。西柏坡纪念馆内一块写着“六条规定”的展板，记录着中国共产党人“进京赶考”前定下的规矩。“这里是立规矩的地方。”2013年7月.习近平总书记来到西柏坡时鲜明指出，“党的规矩、制度的建立和执行，有力推动了党的作风和纪律建设。”不以规矩，不能成方圆。严明党的纪律，首要的就是严明", "opts": {"A": "政治纪律", "B": "组织纪律", "C": "廉洁纪律", "D": "工作纪律"}, "ans": "A", "ana": "严明党的纪律，首要的就是严明政治纪律。党的纪律是多方面的，但政治纪律是最重要、最根本、最关键的纪律，要把深刻领悟“两个确立”的决定性意义、坚决做到“两个维护”作为首要政治纪律，把维护党中央权威和集中统一领导作为最根本的政治纪律和政治规矩。A正确，B、C、D错误。", "dis": "", "ext": "严明党的纪律，首要的就是严明政治纪律"}, {"id": "x6-14", "set": 6, "num": 14, "src": "肖八（六套）", "book": "肖八", "sub": "思法", "type": "single", "year": 2026, "stem": "中华民族在5000多年的历史进程中不仅创造出光辉灿烂、享誉世界的中华文明，也塑造出中华民族独特的精神气质和精神品格，形成了崇尚精神的优秀传统。中国古人所说的“不义而富且贵，于我如浮云”“一革食，一饮，在陋巷，人不堪其优，回也不改其乐”这两句话，表现的是中华民族崇尚精神的优秀传统中的", "opts": {"A": "对理想的不追求", "B": "对品格养成的重视", "C": "注重以和为贵", "D": "对物质生活与精神生活相互关系的独到理解"}, "ans": "D", "ana": "中华民族崇尚精神的优秀传统，首先表现为对物质生活与精神生活相互关系的独到理解。古圣先贤认为，人之所以异于禽兽，在于人有道德，有精神道求。物质生活固然为人所必需，但如果沉溺于物欲而不能自拔，则无异于禽兽。古人认为，“不义而富且贵，于我如浮云”崇尚“一革食，一饮，在陋巷，人不堪其优，回也不改其乐”的精神追求。D正确。A、B、C不符合题意。", "dis": "", "ext": "中华民族崇尚精神的优秀传统，首先表现为对物质生活与精神生活相互关系的独到理解"}, {"id": "x6-15", "set": 6, "num": 15, "src": "肖八（六套）", "book": "肖八", "sub": "时政", "type": "single", "year": 2026, "stem": "《中共中央办公厅国务院办公厅关于做好第二轮土地承包到期后再延长三十年试点工作的意见》于2026年3月18日公开发布。《意见》对第二轮土地承包到期后再延长30年试点工作作了具体部署安排。以家庭承包经营为基础、统分结合的双层经营体制，是我国农村基本经营制度，是党的农村政策的基石。维护农民土地承包经营权的关键是", "opts": {"A": "坚持集体所有制不动摇", "B": "坚持农民主体地位", "C": "坚持承包地所有权、承包权、经营权“三权分置", "D": "现有农村土地承包关系保持稳定并长久不变"}, "ans": "D", "ana": "维护农民土地承包经营权的关键，是现有农村土地承包关系保持稳定并长久不变。改革开放以来，我国农村土地进行了两轮承包。明确第二轮土地承包到期后再延长30年，从农村改革之初的第一轮土地承包算起，土地承包关系将保持稳定长达75年，既体现长久不变的政策要求，又在时间节点上  "", "ext": "价值是一种客观存在，独立于人们对它的认识和评价"}, {"id": "x6-19", "set": 6, "num": 19, "src": "肖八（六套）", "book": "肖八", "sub": "马原", "type": "multi", "year": 2026, "stem": "资本主义生产的唯一动机和直接目的就是追求剩余价值。为了达到这一目的，资本家便尽可能改进技术，提高劳动生产率，加快资本积累，通过资本积聚和资本集中扩大生产规模在生产技术水平不断提高的条件下，资本积累不断增长，必然伴随着资本的积聚和集中，使个别资本的规模日益增大。这一过程的结果是", "opts": {"A": "每个劳动力所推动的生产资料的数量大幅度增加", "B": "可变资本在资本总额中所占的比重日益下降", "C": "不可避免地造成大批工人失业，形成相对过剩人口", "D": "资产阶级政府不得不通过各种干预措施来彻底消灭失业"}, "ans": "ABC", "ana": "在生产技术水平不断提高的条件下，资本积累不断增长，必然伴随着资本的积聚和集中，使个别资本的规模日益增大。在自然形式上，每个劳动力所推动的生产资料的数量大幅度增加：在价值形式上，不变资本部分日益增多，可变资本在资本总额中所占的比重日益下降，从而资本有机构成得以不断提高。在资本有机构成提高的情况下，由于可变资本的相对量的减少.资本对劳动力的需求日益相对减少，其结果就是不可避免地造成大批工人失业，形成相对过剩人口。A、B、C正确。资产阶级政府通过各种干预措施能在一定程度上缓解失业，但不可能彻底消灭失业。D错误。", "dis": "", "ext": "在生产技术水平不断提高的条件下，资本积累不断增长，必然伴随着资本的积聚和集中，使个别资本的规模日益增大"}, {"id": "x6-20", "set": 6, "num": 20, "src": "肖八（六套）", "book": "肖八", "sub": "马原", "type": "multi", "year": 2026, "stem": "国家垄断资本主义产生后，国家通过多种形式参与私人垄断资本的再生产过程，这主要包括", "opts": {"A": "国家向私人垄断企业大量订货并为私人断企业提供有保证的国家市场", "B": "国家通过各种形式的津贴和补助，直接、间接地资助私人垄断企业", "C": "国家通过社会福利开支，提高社会购买力，为私人垄断企业创造市场条件", "D": "国家运用法律手段规范市场秩序，限制奉断，保护竞争"}, "ans": "ABC", "ana": "国家垄断资本主义的主要形式有5种。（1）国家所有并直接经营企业。（2）国家与私人共有、合营企业。（3）国家通过多种形式参与私人垄断资本的再生产过程，包括国家作为商品和劳务的采购者，向私人垄断企业大量订货，为私人垄断企业提供有保证的国家市场；国家通过各种形式的津贴和补助，直接、间接地资助私人垄断企业；国家通过社会福利开支，提高社会购买力，扩大消费需求，为私人垄断企业创造市场条件。A、B、C正确。（4）宏观调节。（5）微观规制，主要是国家运用法律手段规范市场秩序，限制垄断，保护竞争，维护社会公众的合法权益。D属于微观规制的内容，不符合题意。", "dis": "", "ext": "国家垄断资本主义的主要形式有5种"}, {"id": "x6-21", "set": 6, "num": 21, "src": "肖八（六套）", "book": "肖八", "sub": "马原", "type": "multi", "year": 2026, "stem": "1921年3月，俄共(布)召开十大，毅然决定从战时共产主义政策过渡到实行以发展商品经济为主要特征的新经济政策。这一决定表明，列宁的社会主义建设思想发生了重大转变，对在俄国这样一个小农经济占优势的国家如何走向社会主义又有了新的认识，标志着列宁正在探索一条符合俄国国情的建设社会主义的道路。新经济政策的实施", "opts": {"A": "基本上完成了“剥夺剥夺者”的任务，使无产阶级掌握了国家的经济命脉", "B": "扭转了国家的严重危机，活跃了苏维埃的城乡经济", "C": "发展了生产，大大加强了苏维埃的社会主义经济基础", "D": "改善了工人、农民和其他劳动者的物质文化生活"}, "ans": "BCD", "ana": "新经济政策的实施，扭转了国家的严重危机，活跃了苏维埃的城乡经济，发展了生产大大加强了苏维埃的社会主义经济基础，也改善了工人、农民和其他劳动者的物质文化生活。B、C、D正确。列宁领导的苏维埃俄国对社会主义道路的探索，大体上经 力上升最快的国家之一", "C": "已经进入创新型国家前列", "D": "科技工作的体制机制障碍已彻底消除"}, "ans": "AB", "ana": "2026年7月8日，习近平总书记在国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会上发表重要讲话。讲话指出，党的十八天以来，党中央把科技创新摆在现代化建设突出位置，系统壁画科技强国建设蓝图，深入推动实施创新驱动发展战略，全面深化科技体制改革，推动科技事业取得历史性成就，发生历史性变革。我国正从全球科技参与者、贡献者向开拓者、引领者加速转变，成为创新力上升最快的国家之一。讲话强调，我国科技发展中还存在一些领域原始创新能力不足、人才队伍结构不够合理、科技投人效能不高等问题，科技工作在思想认识、体制机制等方面也有一些卡点堵点。A、B正确，D错误。我国已经进入创新型国家行列，但还没有进入创新型国家前列。C错误。", "dis": "", "ext": "2026年7月8日，习近平总书记在国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会上发表重要讲话"}, {"id": "x6-25", "set": 6, "num": 25, "src": "肖八（六套）", "book": "肖八", "sub": "新思想", "type": "multi", "year": 2026, "stem": "2003年，时任英国财政大臣布朗到访中国，竞发出这样的言论：英国从中国进口了越来越多的家电、服装和其他东西，但可以用出口的一样东西来平衡，那就是英语。这是产业之扬，更是文化之痛！如今，中国文化产业呈现出新气象。实打实的数据让人震撼：中国网文海外活跃用户达2亿人，覆盖200多个国家和地区；中国网游《鸣潮》风靡世界，登顶超100个国家和地区手游排行榜：微短剧相关海外应用超300款，全球累计下载量突破4.7亿次……···从“文化逆差”的举步维艰，到“文化出海”的风生水起，中国文化产业实现了华丽转身。这个华丽转身是中国文化大发展大繁荣的真实写照，其原因在于", "opts": {"A": "经济底气托起了文化手盈", "B": "政策引领照亮了文化航向", "C": "科技赋能舒展了文化羽翼", "D": "教育普及培育了丰厚人才"}, "ans": "ABCD", "ana": "文化的大发展大繁荣，绝非无源之水、无本之木。这源头活水，便是新时代日益增强的综合国力：经济底气，托起了文化丰盈：政策引领，照亮了文化航向：科技赋能，舒展了文化羽真：教育普及，培育了丰厚人才。经济筑基，政策引领，科技赋能，人才为本，四重力量交织共振，坚定了文化自信，激发了创新活力，共同奏响了文化高质量发展的雄浑交响。A、B、C、D全选。", "dis": "", "ext": "文化的大发展大繁荣，绝非无源之水、无本之木"}, {"id": "x6-26", "set": 6, "num": 26, "src": "肖八（六套）", "book": "肖八", "sub": "新思想", "type": "multi", "year": 2026, "stem": "2026年2月4日，香港特别行政区行政长宜李家超正式对外宜布：“将领导特区政府不同政策局和部门，主动对接国家十五五规划框架，并首次制定香港的五年规划。”“香港五年规划\"迅速成为与论焦点，受到海内外广泛关注。9月16日，《香港特别行政区经济和社会发展第一个五年规划（2026-2030年）》公布。香港制定首个五年规划", "opts": {"A": "体现了全国一盘棋、集中力量办大事的制度优势", "B": "有利于提升香港特区政府和社会各界的战略、宏观和长远思维", "C": "有助于香港在融人和服务国家发展大局中实现自身更好发展", "D": "让企业在投资、布局、转型上有更加清晰的未来视野，更好融人国内国际双循环"}, "ans": "BCD", "ana": "B、C、D正确。按照“一国两制”方针，国家主体实行社会主义制度，香港特别行政区保持原有的资本主义制度和生活方式长期不变。A错误。", "dis": "", "ext": "B、C、D正确"}, {"id": "x6-27", "set": 6, "num": 27, "src": "肖八（六套）", "book": "肖八", "sub": "史纲", "type": "multi", "year": 2026, "stem": "1927年4月12日，蒋介石在上海发动反革命政变。同年7月15日，汪精卫在武汉召开“分共”会议，并在其辖区内对共产党员和革命群众实行搜捕和屠杀，国共合作全面破裂，大革命最终失败。大革命虽然失败了，但它的历史意义仍然是不可磨灭的。正是在 "id": "x7-17", "set": 7, "num": 17, "src": "肖八（七套）", "book": "肖八", "sub": "马原", "type": "multi", "year": 2026, "stem": "纳米是非常小的长度单位，1纳米等于十亿分之一米。当物质进入纳米尺度后，我们熟悉的许多材料会展现出完全不同的性质。比如纳米大小的黄金棵粒，颜色可以从红色到紫色发生变化，还表现出极强的催化活性。微观世界里，颜色不是来自金本身的金属光泽，而是量子效应与表面效应在起作用。简单来说，进入纳米世界后，材料不只是“变小了”，还拥有了新的能力。在这样的微观世界里，科学家可以操控原子和分子，设计制造具有特殊性能的新材料、新器件，这就是纳米制造。纳米尺度上物质发生的新变化表明", "opts": {"A": "世界的物质统一性是多样性的统一", "B": "事物的性质是由其所处的外部时空决定的", "C": "物质的具体形态和具体结构是可变的、相对的", "D": "认识就是在不断推翻先前的真理中不断发展的"}, "ans": "AC", "ana": "世界的物质统一性是多样性的统一。物质世界包含着不同的物质现象和物质形态、不同的物质层次和物质结构、不同的物质过程和物质活动，包含着自然界和人类社会，是一个充满多样性的多姿多彩的世界。A正确。物质的具体形态和具体结构是物质的个性，是可变的、相对的：一切具体形态和具有不同结构的物质又都是客观实在，这是不变的、绝对的。（正确。事物的性质是由主要矛盾的主要方面所决定的。B错误。相对主义片面夸大真理的相对性，否认真理的绝对性，从而导致错误做法，即借口真理是发展的而否认真理内容的客观性，认为原来的真理已经不是真理而将它丢弃或推翻。这就把真理的相对性歪曲成了主观随意性，由此走向主观真理论，陷入了不可知论和论辩论。D错误。", "dis": "", "ext": "世界的物质统一性是多样性的统一"}, {"id": "x7-18", "set": 7, "num": 18, "src": "肖八（七套）", "book": "肖八", "sub": "马原", "type": "multi", "year": 2026, "stem": "相传北宋诗文大家王安石看到南方一位诗人的两句诗：“明月当空叫，黄犬卧花心”，觉得可笑，明月怎么会叫？黄犬又怎么卧花心？他不去了解作者这样写的原委，不知道作者家乡有一种小鸟名叫“明月”，有一种昆虫名叫“黄犬”，而是想当然地改成“明月当空照，黄犬卧花荫”。这样虽然句子合乎常理，但与作者表达的原意相去甚远了。王安石的错误说明", "opts": {"A": "真理是多元的，不同主体有不同真理", "B": "矛盾具有特殊性，必须具体问题具体分析", "C": "由实践到认识的第一次飞跃比认识到实践的第二次飞跃更重要", "D": "认识主体已有的知识结构会影响认识结果"}, "ans": "BD", "ana": "认识是多元的，但真理是一元的。在同一条件下对于特定的认识客体的真理性认识只有一个，而不可能有多个。A错误。从实践到认识，认识的过程还没有完成。要实现一个完整的认识过程，还必须由认识再回到实践中去，实现认识的第二次能动飞跃。从认识到实践的飞跃，是更为重要的飞跃，意义更加重大。C错误。B、D正确。", "dis": "", "ext": "认识是多元的，但真理是一元的"}, {"id": "x7-19", "set": 7, "num": 19, "src": "肖八（七套）", "book": "肖八", "sub": "马原", "type": "multi", "year": 2026, "stem": "资本主义生产的目的是获得利润。不同生产部门的资本家之间为了得到尽可能多的利润必然展开激烈的竞争从而导致利润平均化。平均利润形成后", "opts": {"A": "商品价值就转化为生产价格", "B": "每一个部门获得的利润都等于该部门生产的剩余价值", "C": "价值规律的实现形式发生了变化", "D": "每个资本家所得利润的多少不再与他对本企业工人的剥削程度有关"}, "ans": "AC", "ana": "】利润转化为平均利润，价值也就转化为生产价格。生产价格是商品价值的转化形式，是生产成本与平均利润之和。A正确。在价值转化为生产价格的条件下，价值规律作用的开式发生了变化。商品不再以价值而是以生产价格为基础进行交换，市场价格的变动不再以价值为中心，而是以生产价格为中心。生产价格是价值的转化形式，商品按照生产价格而不是价值出售并不违背价值规律，而是价值规律的实现形式发生了变化。虽然从个别部门来看，资本家获得的平均利润与本部门工人创造的剩余价值可能不一致，但从全社会来看，整个资本家阶级获得的利润总额与雇佣工人所创造的剩余价值总额是相等的。C正确，B错误。平均利润率规律的作用表明，平均利润率是剩余价值总量与社会总资本的比率。每个资本家所得利润的多少不仅取决于他对本企业工人的剥削程度，而且取决于整个资产阶级对整个工人阶级的剥削程度。资本家之间在瓜分剩余价值上固然有一定程度的利害冲突，但在加强对工人阶级的剥削以榨取更多的剩余价值这一点上，有着共同的阶级利益。D错误（每个资本家所得利润的多少，和该资本家对本企业工人的剥削程度有关，也和整个资产阶级对整个工人阶级的剥削程度有关）。", "dis": "", "ext": "】利润转化为平均利润，价值也就转化为生产价格"}, {"id": "x7-20", "set": 7, "num": 20, "src": "肖八（七套）", "book": "肖八", "sub": "马原", "type": "multi", "year": 2026, "stem": "第二次世界大战后，资本主义国家为尽快恢复国民经济，在继续发挥市场机制主导性作用的同时，开始对经济进行全面干预。但是，从20世纪70年代起，随着资本主义经济陷入滞胀和新自由主义思潮的泛滥，西方国家普遍走上强化市场调节、弱化政府干预的道路，即", "opts": {"A": "通过国有企业私有化来提升经济竞争力", "B": "通过福利制度改革.减少政府的财政负担", "C": "通过强化贸易保护，减少贸易逆差", "D": "通过放松对经济和金融的管制，释放经济活力"}, "ans": "ABD", "ana": "从20世纪70年代起，随着资本主义经济陷入滞胀和新自由主义思潮的泛滥，西方国家普遍走上强化市场调节、弱化政府干预的道路，即通过国有企业私有化来提升经济竞争力；通过福利制度改革，减少政府的财政负担；通过放松对经济和金融的管制，释放经济活力。A、B、D正确。C错误且明显不符合题意（强化贸易保护属于政府干预的强化，与题干“强化市场调节、弱化政府干预”的要求相反）。", "dis": "", "ext": "从20世纪70年代起，随着资本主义经济陷入滞胀和新自由主义思潮的泛滥，西方国家普遍走上强化市场调节、弱化政府干预的道路，即通过国有企业私有化来提升经济竞争力；通…"}, {"id": "x7-21", "set": 7, "num": 21, "src": "肖八（七套）", "book": "肖八", "sub": "马原", "type": "multi", "year": 2026, "stem": "19世纪中叶，马克思、恩格斯把社会主义由空想变为科学。为这一飞跃奠定理论基础的是", "opts": {"A": "阶级斗争学说、", "B": "劳动价值论", "C": "唯物史观", "D": "剩余价值学说"}, "ans": "CD", "ana": "马克思、恩格斯适应社会的需要，在新的历史条件下创立和发展了唯物史观和剩余价值学说，为实现社会主义从空想到科学的飞跃奠定了坚实的理论基础。C、D正确。C、D正确。", "dis": "", "ext": "马克思、恩格斯适应社会的需要，在新的历史条件下创立和发展了唯物史观和剩余价值学说，为实现社会主义从空想到科学的飞跃奠定了坚实的理论基础"}, {"id": "x7-22", "set": 7, "num": 22, "src": "肖八（七套）", "book": "肖八", "sub": "毛中特", "type": "multi", "year": 2026, "stem": "中国共产党在各个历史时期都高度重视管党治党，勇于坚持真理、修正错误，在依靠自身力量和人民支持解决自身问题中不断强大，成为党和人民事业的坚强领导核心。在新民主主义革命时期，中国共产党把党的建设作为伟大工程，在加强自身建设中积累了丰富的经验月纳起来主要有", "opts": {"A": "必须把思想建设始终放在党的建设的首位", "B": "必须在任何时候都重视党的组织建设", "C": "必须重视党的作风建设", "D": "必须联系党的政治路线加强党的建设"}, "ans": "ABCD", "ana": "在新民主主义革命时期，中国共产党在加强自身建设中积累了丰富的经验，归纳起来主要有：第一，必须把思想建设始终放在党的建设的首位。加强党的思想建设，关键是要以无产阶级思想克服和改造各种非无产阶级思想。第二，必须在任何时候都重视党的组织建设。加强党的组织建设，根本的是要贯彻民主集中制这一根本组织原则，坚持在民主基础上的集中和在集中指导下的民主相结合，个人服从组织，少数服从多数，下级服从上级，全党服从中央。第三，必须重视党的作风建设。党在领导新民主主义革命的过程中，把党的建设作为一项“伟大的工程”，逐步形成了理论联系实际、密切联系群众、批评与自我批评相结合的三大优良作风，这是中国共产党区别于其他任何政党的显著标志。第四，必须联系党的政治路线加强党的建设。党的政治路线是党的纲领在一定历史时期的具体体现，是完成党在一定历史阶段的政治任务的总政策，为全党的团结统一奠定政治基础。加强党的建设，必须同党的政治路线紧密联系起来。A、B、C、D全选。", "dis": "", "ext": "在新民主主义革命时期，中国共产党在加强自身建设中积累了丰富的经验，归纳起来主要有：第一，必须把思想建设始终放在党的建设的首位"}, {"id": "x7-23", "set": 7, "num": 23, "src": "肖八（七套）", "book": "肖八", "sub": "新思想", "type": "multi", "year": 2026, "stem": "中国式现代化是全体人民共同富裕的现代化。这是中国式现代化区别于西方现代化的显著标志。浙江是我国高质量发展建设共同富裕示范区，在共同富裕的探路征程上不断迈出新步伐、取得新成效。浙江在共同富裕的探路征程上紧扣的主攻方向是", "opts": {"A": "缩小地区差距", "B": "缩小城乡差距", "C": "缩小收入差距", "D": "缩小工农差距"}, "ans": "ABC", "ana": "2021年5月，《中共中央国务院关于支持浙江高质量发展建设共同富裕示范区的意见》印发，赋予浙江为全国推动共同富裕提供省域范例的重大使命。“十五五”规划纲要提出，“推动人的全面发展、全体人民共同富裕迈出坚实步伐”。5年多来，浙江紧扣缩小地区、城乡、收人“三大差距”主攻方向，在共同富裕的探路征程上不断迈出新步伐、取得新成效。A、B、C正确，D错误。", "dis": "", "ext": "2021年5月，《中共中央国务院关于支持浙江高质量发展建设共同富裕示范区的意见》印发，赋予浙江为全国推动共同富裕提供省域范例的重大使命"}, {"id": "x7-24", "set": 7, "num": 24, "src": "肖八（七套）", "book": "肖八", "sub": "新思想", "type": "multi", "year": 2026, "stem": "公有制经济是全体人民的宝贵财富。坚持公有制主体地位不能动摇，国有经济主导作用不能动摇，这是我国各族人民共享发展成果的制度性保证，也是巩固党的执政地位、坚持我国社会主义制度的重要保证。国有企业是", "opts": {"A": "中国特色社会主义的重要物质基础和政治基础", "B": "我们党执政兴国的重要支柱和依靠力量", "C": "社会主义市场经济中资源配置的决定性力量", "D": "中国特色社会主义经济的“顶梁柱"}, "ans": "ABD", "ana": "在市场经济条件下，市场是资源配置的决定性力量。C错误。A、B、D正确。", "dis": "", "ext": "在市场经济条件下，市场是资源配置的决定性力量"}, {"id": "x7-25", "set": 7, "num": 25, "src": "肖八（七套）", "book": "肖八", "sub": "新思想", "type": "multi", "year": 2026, "stem": "打太极、包饺子、学汉语曾经是传播中华文化的“老三样”，而今天，网络文学、网络影视剧、网络游戏这“新三样”，正以惊人的速度走向世界，成为中国文化出海的生力军。从中华道义到水墨意境，从历史史诗到现代故事，海外观众在追剧、阅读和游戏中，不仅看到了中国的文化符号，更感受到其中的精神气质和创新活力。文化“新三样”出海有利于", "opts": {"A": "中国文化传播从“走出去”向“走进去”转变", "B": "提高国家文化软实力和中华文化影响力", "C": "为传播力、影响力的真正触达提供新路径", "D": "向世界展现真实、立体、全面的中国"}, "ans": "ABCD", "ana": "全面建设社会主义现代化国家，必须坚持中国特色社会主义文化发展道路，增强文化自信，围绕举旗帜、聚民心、育新人、兴文化、展形象建设社会主义文化强国。其中，展形象，就是要推进国际传播能力建设，讲好中国故事、传播好中国声音，向世界展现真实、立体、全面的中国，提高国家文化软实力和中华文化影响力。中国作为创意产业的发动机，源源不断地把新动能传导到世界各地，文化“新三样”出海对于中华文化的传播，塑造中国的新形象，都有非常好的支撑，也为传播力、影响力的真正触达，提供了非常好的新路径。这些产品，正成为世界读懂中国的一扇新窗口，也见证着中国文化传播从“走出去”到“走进去”的深刻转变。A.B.C、D全选。", "dis": "", "ext": "全面建设社会主义现代化国家，必须坚持中国特色社会主义文化发展道路，增强文化自信，围绕举旗帜、聚民心、育新人、兴文化、展形象建设社会主义文化强国"}, {"id": "x7-26", "set": 7, "num": 26, "src": "肖八（七套）", "book": "肖八", "sub": "新思想", "type": "multi", "year": 2026, "stem": "习近平总书记指出：“我们捍卫和平、维护安全、摄止战争的手段和选择有多种多样，但军事手段始终是保底手段。”只有以强大军事实力为后盾", "opts": {"A": "政治安全、国土安全等其他安全才能托底", "B": "国家的总体安全和人民的幸福生活才有保障", "C": "实现国家繁荣富强的主动权才能牢牢掌握在自己手中", "D": "当代中国价值观念才能走向世界"}, "ans": "ABC", "ana": "A、B、C正确。军事属于硬实力，文化、价值观念属于软实力。当代中国价值观念要走向世界，就要下大力气加强文化软实力建设，广泛传播当代中国价值观念，充分展示中华文化独特魅力。D错误。", "dis": "", "ext": "A、B、C正确"}, {"id": "x7-27", "set": 7, "num": 27, "src": "肖八（七套）", "book": "肖八", "sub": "史纲", "type": "multi", "year": 2026, "stem": "1931年11月，中华苏维埃第一次全国代表大会在江西瑞金召开。大会通过了《中华苏维埃共和国宪法大纲》以及土地法令、劳动法等，选举产生了中华苏维埃共和国中央执行委员会成立了中华苏维埃共和国临时中央政府，毛泽东当选为主席。中华苏维埃共和国", "opts": {"A": "是中国历史上第一个全国性的各个革命阶级联合专政的政权", "B": "是中国共产党在局部地区执政的重要尝试", "C": "扩大了党和红色政权的影响，一定程度上加强了对处于被分割状态的各根据地的中枢指挥作用", "D": "推动了各根据地的政权、经济、文化教育和党的自身建设，开创了土地革命战争新局面"}, "ans": "BCD", "ana": "B、C、D正确。中华苏维埃共和国实行工农兵代表大会制度，各级苏维埃政府广泛吸收工农群众代表参加政权管理，行使当家作主的权利。中华苏维埃共和国是中国历史上第一个全国性的工农民主政权，而不是各个革命阶级联合专政的政权（民族资产阶级并没有参加政权），A错误。", "dis": "", "ext": "、C、D正确"}, {"id": "x7-28", "set": 7, "num": 28, "src": "肖八（七套）", "book": "肖八", "sub": "史纲", "type": "multi", "year": 2026, "stem": "全民族抗战伊始，中共中央就提出必须在统一战线中坚持独立自主原则。为此，共产党必须保持在思想上、政治上和组织上的独立性，放手发动群众，壮大人民力量：必须坚持对人民军队的绝对领导，冲破国民党的限制和束缚，努力发展人民武装和抗日根据地：必须对国民党采取又团结又斗争、以斗争求团结的方针。这样做的目的就是", "opts": {"A": "彻底清除统一战线内部的矛盾和斗争", "B": "力争中国共产党对抗日战争的领导权", "C": "使中国共产党成为团结全民族抗战的中坚力量", "D": "跳出“其兴也勃煮，其亡也忽為”的治乱兴衰历史周期率"}, "ans": "BC", "ana": "全民族抗战伊始，中共中央就提出必须在统一战线中坚持独立自主原则。这样做的自的，就是力争中国共产党对抗日战争的领导权，使自己成为团结全民族抗战的中坚力量。这是把抗日战争引向胜利的中心一环。B、C正确。抗日民族统一战线是以国共合作为基础的。由于国共两党代表不同的阶级利益，参加抗战的目的不尽相同，实行的抗战路线不同，统一战线内部不可避免地存在着矛盾和斗争。A错误。D是关于怎样执政和执政党自身建设的问题，显然不符合题意。", "dis": "", "ext": "全民族抗战伊始，中共中央就提出必须在统一战线中坚持独立自主原则"}, {"id": "x7-29", "set": 7, "num": 29, "src": "肖八（七套）", "book": "肖八", "sub": "史纲", "type": "multi", "year": 2026, "stem": 主体。法律权利的实现必须以相应法律义务的履行为条件：法律义务的设定和履行也必须以法律权利的行使为根据。离开了法律权利，法律义务就失去了履行的价值和动力：离开了法律义务，法律权利也形同虚设。A、B、D正确。有些法律权和和法律义务具有复合性的关系，即一个行为可以同时是权利行为和义务行为，如劳动的权利和义务、接受义务教育的权利和义务等。C错误。", "dis": "", "ext": "法律权利与法律义务就像一枚硬币的两面，不可分割，相互依存"}, {"id": "x7-32", "set": 7, "num": 32, "src": "肖八（七套）", "book": "肖八", "sub": "时政", "type": "multi", "year": 2026, "stem": "习近平总书记在庆祝中国共产党成立105周年大会上的讲话中指出，中国共产党之所以能够在105年奋斗中不断铸就辉煌，历史和人民之所以选择中国共产党，根本在于我们党具有其他政党和政治力量无可比拟的优秀特质。这就是", "opts": {"A": "天志追求真理，深深植根人民", "B": "勇担历史使命，顺应发展潮流", "C": "敢于善于斗争，注重强健自身", "D": "理论联系实际，密切联系群众"}, "ans": "ABC", "ana": "中国共产党之所以能够在105年奋斗中不断铸就辉煌，历史和人民之所以选择中国共产党，根本在于我们党具有其他政党和政治力量无可比拟的优秀特质：矢志道求真理，始终把准前进方向：深深植根人民，始终拥有坚实根基；勇担历史使命，始终掌握战略主动；顺应发展潮流，始终走在时代前列：敢于善于斗争，始终保持必胜信心；注重强健自身，始终充满生机活力。（六天优秀特质）这些优秀特质，是中国共产党为什么能的关键密码。我们要结合新的实际，把党的优秀特质不断发扬光大，确保党永远不变质不变色不变味，始终具有强大创造力凝聚力战斗力。A、B、C正确。D是中国共产党三大优良作风的内容，不符合题意。", "dis": "", "ext": "中国共产党之所以能够在105年奋斗中不断铸就辉煌，历史和人民之所以选择中国共产党，根本在于我们党具有其他政党和政治力量无可比拟的优秀特质：矢志道求真理，始终把…"}, {"id": "x7-33", "set": 7, "num": 33, "src": "肖八（七套）", "book": "肖八", "sub": "时政", "type": "multi", "year": 2026, "stem": "1946年5月3日，根据日本无条件投降安排和盟军最高统帅颁布的《远东国际军事法庭宪章》，远东国际军事法庭正式开庭。这场历史性审判汇聚11国司法力量，以海量铁证和严谨法理，判定日本军国主义发动侵略战争、严重违反国际法，揭露日本侵略者在亚洲多国犯下的累果罪行，判处东条英机等25名甲级战犯绞刑、徒刑.驳斥所谓“胜利者审判”“自卫战争”事后立法”等谈论。东京审判", "opts": {"A": "是抗日战争取得完全胜利的重要标志", "B": "是《开罗盲言》《波茨坦公告》规定的实施", "C": "反映战胜国与受害者集体意志", "D": "践行《联合国宪章》的宗旨与原则"}, "ans": "BCD", "ana": "中国外交部发言人2026年5月3日就东京审判开庭80周年答记者问时指出，东京审判是《开罗宣言》《波茨坦公告》规定的实施，反映战胜国与受害者集体意志，践行《联合国宪章》的宗旨与原则，捍卫了二战胜利成果。B、C、D正确。被日本占领50年之久的台湾以及澎湖列岛重归中国主权管辖，这是抗日战争取得完全胜利的重要标志。A错误。", "dis": "", "ext": "中国外交部发言人2026年5月3日就东京审判开庭80周年答记者问时指出，东京审判是《开罗宣言》《波茨坦公告》规定的实施，反映战胜国与受害者集体意志，践行《联合…"}, {"id": "x8-1", "set": 8, "num": 1, "src": "肖八（八套）", "book": "肖八", "sub": "马原", "type": "single", "year": 2026, "stem": "谈及创新发展，人们总会想到“从0到1”的颠覆性、跃迁式创造突破。这种创新开辟新域、引领潮流，能显著推动社会进步。除此之外，在已有的“1”之上，再精进“0.01”这种徽末处的功关，同样值得重视。从0到1，解决的是“有没有”的问题：从1到1.01，解决的是“好不好”的向题。既要有拓界之创新，也应有精进之创新。“从0到1”之上的“0.01”的精进同样重要，这体现了", "opts": {"A": "在新质的基础上事物又开始新的量变", "B": "事物的发展是直线上升的永不停歇的过程", "C": "必然与偶然在一定条件下相互转化", "D": "新事物在完整继承旧事物的基础上添加新内容"}, "ans": "A", "ana": "量变和质变是相互依存、相互贯通的，量变引起质变，在新质的基础上，事物又开始新的量变，如此交替循环，构成了事物的发展过程。“从0到1”的质变完成后事物不是停止发展了，而是开始了新的量变过程。A正确。事物发展是前进性与曲折性的统一。曲折性体现在回复性上，其中有暂时的停顿甚至倒退。这表明，事物的发展不是直线式前进，而是螺旋式上升的。B错误。就新事物与旧事物的关系而言，新事物是在旧事物的“母体”中孕育成熟的，它既否定了旧事物中消极腐朽的东西，又保留了旧事物中合理的、适应新条件的因素，并添加了旧事物所不能容纳的新内容。新事物对旧事物既批判又继承，既克服其消极因素又保留其积极因素，不是完整继承旧事物。D错误。C不符合题意。", "dis": "", "ext": "量变和质变是相互依存、相互贯通的，量变引起质变，在新质的基础上，事物又开始新的量变，如此交替循环，构成了事物的发展过程"}, {"id": "x8-2", "set": 8, "num": 2, "src": "肖八（八套）", "book": "肖八", "sub": "马原", "type": "single", "year": 2026, "stem": "交往是人类实践活动的重要组成部分，对社会生活有着重要的影响。马克思、恩格斯指出某一个地域创造出来的生产力，特别是发明，在往后的发展中是否会失传，完全取决于交往扩展的情况。”对这一论断理解正确的是", "opts": {"A": "地理环境在生产力发展中起主导作用", "B": "生产力成果的保存有赖于交往的扩大", "C": "信息交往是物质交往的基础和根源", "D": "科学文化交往是人类最基本的实践活动"}, "ans": "B", "ana": "劳动者是生产过程的主体，在生产力发展中起主导作用。劳动者在生产过程中的交往是生产关系的应有之义，这种交往的改善有助于生产关系更好地服务于生产力的发展。而生产力成果的保存，也有赖于交往的扩大。B正确，A错误。交往可以划分为物质交往和精神交往。物质交往是精神交往的基础和根源，精神交往是物质交往的产物，渗透于物质交往之中。信息交往是精神交往的重要方面。C错误。物质生产实践是最基本的实践活动，构成全部社会生活的基础：社会政治实践和科学文化实践在物质生产实践基础上产生和发展，受物质生产实践的制约并对其产生能动的反作用。D错误。", "dis": "", "ext": "劳动者是生产过程的主体，在生产力发展中起主导作用"}, {"id": "x8-3", "set": 8, "num": 3, "src": "肖八（八套）", "book": "肖八", "sub": "马原", "type": "single", "year": 2026, "stem": "资本家提高对工人剥削程度的方法是多种多样的，最基本的方法有两种，即绝对剩余价值的生产和相对剩余价值的生产。绝对剩余价值的生产和相对剩余价值的生产都是依靠", "opts": {"A": "延长工作日获得的", "B": "提高劳动生产率获得的", "C": "缩短工人的必要劳动时间获得的", "D": "延长工人的剩余劳动时间获得的"}, "ans": "D", "ana": "绝对剩余价值是指在必要劳动时间不变的条件下，由于延长工作日的长度或提高劳动强度而生产的剩余价值。在必要劳动时间既定的条件下，工作日越长，剩余劳动时间越长，剩余价值率越高。相对剩余价值是指在工作日长度不变的条件下，通过缩短必要劳动时间而相对延长刺余劳动时间所生产的剩余价值。缩短必要劳动时间是通过提高全社会的劳动生产率实现的。由于社会劳动生产率的提高，降低了劳动力的价值，从而缩短了必要劳动时间，相对延长了剩余劳动时间。全社会劳动生产率的提高是资本家追逐超额剩余价值的结果。所以绝对剩余价值生产和相对剩余价值生产都是依靠延长工人的剩余劳动时间获得的，D正确。相对剩余价值生产不延长工作日，A错误。绝对刺余价值生产不依靠提高劳动生产率，也不缩短工人的必要劳动时间.BC错误。", "dis": "", "ext": "绝对剩余价值是指在必要劳动时间不变的条件下，由于延长工作日的长度或提高劳动强度而生产的剩余价值"}, {"id": "x8-4", "set": 8, "num": 4, "src": "肖八（八套）", "book": "肖八", "sub": "马原", "type": "single", "year": 2026, "stem": "经济全球化是当代世界经济
