是又相适应又相矛盾，相适应的一面是基本方面。它们是非对抗性的矛盾，可以经过社会主 义制度本身的自我调整和完善，不断地得到解决。 两类不同性 敌我矛盾侧重分清敌我，用专政的方法解决；人民内部矛盾侧重分清是非，用民主的方法解决。 质的矛盾 1957 年提出，正确处理人民内部矛盾是社会主义国家政治生活的主题。 ①政治思想领域：团结—批评—团结； ②物质利益、分配方面：统筹兼顾、适当安排； 人民内部矛 ③人民群众和政府机关：坚持民主集中制，克服官僚主义，加强思想教育； 盾的处理方 ④科学文化领域：百花齐放、百家争鸣 针 ⑤共产党和民主党派：长期共存、互相监督； ⑥民族之间：民族平等、团结互助。 （2）1956 年《论十大关系》的基本方针 【详见：第 1 套，第 22 题】【《手册》第 66 页】 （3）1956 年 9 月，党的八大提出，国内主要矛盾：已经是人民对于经济文化迅速发展的需要同当前经济文化不能 满足人民需要的状况之间的矛盾", "year": 2027}, {"id": "s4-6", "set": 4, "num": 6, "src": "苏一六套卷（四）", "book": "苏一", "sub": "毛中特", "type": "single", "stem": "新世纪以来，我国经济和社会发展呈现出一系列新的阶段性特征，但是，这些新的阶段性特征的出现并没有改变我国仍处于社会主义初级阶段这一基本事实。这表明，社会主义初级阶段是", "opts": {"A": "科学社会主义基本原则与时代精神相结合的过程", "B": "长期性与阶段性统一的动态发展过程", "C": "先进社会制度与落后社会生产的矛盾运动过程", "D": "社会性质与发展程度的有机统一过程"}, "ans": "B", "ana": "社会主义初级阶段是一个相当长的历史阶段，但长期性不等于一成不变，初级阶段自身在其发展过程中又呈现出不同的阶段性特征。新世纪以来我国经济社会发展出现一系列新的阶段性特征，但我国仍处于社会主义初级阶段这一基本事实没有改变，正说明社会主义初级阶段是长期性与阶段性统一的动态发展过程。B 正确。", "dis": "A 选项，题干没有讨论科学社会主义基本原则与时代精神的结合。C 选项，侧重社会制度与社会生产之间的关系，不能解释题干中“阶段性特征变化”与“基本事实不变”的关系。D 选项，社会性质与发展程度的统一，说明我国已经是社会主义社会、但仍处于初级阶段；但题干重点考查的则是初级阶段发展过程中的长期性与阶段性。", "ext": "（1）社会主义初级阶段的两层含义 【《手册》第 70 页：考点 3】 判断 分别回答什么 我国社会已经是社会主义社会 社会性质。必须坚持社会主义而不能离开社会主义。 我国的社会主义社会还处在初级阶段 发展程度。必须从这个实际出发，不能超越这个阶段。 （2）社会主义初级阶段是长期性与阶段性统一的动态发展过程。1987 年党的十三大系统阐述社会主义初级阶段理 论，明确概括党在社会主义初级阶段的基本路线。【详见：第 3 套，第 6 题】 （3）基本国情与政策依据。①邓小平第一次把社会主义初级阶段作为事关全局的基本国情加以把握。②社会主义 初级阶段是制定路线方针政策的出发点和根本依据。观察一个时期的新任务，要看阶段性特征；判断制定路线方 针政策的根本依据，要看基本国情。", "year": 2027}, {"id": "s4-7", "set": 4, "num": 7, "src": "苏一六套卷（四）", "book": "苏一", "sub": "新思想", "type": "single", "stem": "沿着古代丝绸之路，中国的丝绸、瓷器和造纸术、印刷术等传向世界，域外的天文、历法、医药、乐舞等知识技艺也逐渐传入中国。明末，徐光启主张“欲求超胜，必须会通”，与利玛窦合译《几何原本》，吸收借鉴西方数学知识。这些实践主要体现了中华文明具有突出的", "opts": {"A": "连续性", "B": "创新性", "C": "统一性", "D": "包容性"}, "ans": "D", "ana": "中华文明具有突出的包容性，在同其他文明的交流互鉴中兼收并蓄、博采众长。题干中，古代丝绸之路推动中外知识技艺双向传播，徐光启与利玛窦合译《几何原本》、吸收借鉴西方数学知识，都体现了中华文明以开放胸怀吸收外来文明有益成果的包容性。D 正确。", "dis": "A 选项强调中华文明绵延不断，B 选项强调中华文明革故鼎新，C 选项强调中华文明多元一体、团结凝聚。题干侧重中外交流互鉴和吸收外来文明有益成果，ABC 均不符合题意。", "ext": "中华文明的五个突出特性【《手册》第 102 页】 特性 决定了什么 连续性 从根本上决定了中华民族必然走自己的路 ①从根本上决定了中华民族守正不守旧、尊古不复古的进取精神 创新性 ②决定了中华民族不惧新挑战、勇于接受新事物的无畏品格 ①从根本上决定了中华民族各民族文化融为一体、即使遭遇重大挫折也牢固凝聚 ②决定了国土不可分、国家不可乱、民族不可散、文明不可断的共同信念 统一性 ③决定了国家统一永远是中国核心利益的核心 ④决定了一个坚强统一的国家是各族人民的命运所系 ①从根本上决定了中华民族交往交流交融的历史取向 包容性 ②决定了中国各宗教信仰多元并存的和谐格局 ③决定了中华文化对世界文明兼收并蓄的开放胸怀 ①从根本上决定了中国始终是世界和平的建设者、全球发展的贡献者、国际秩序的维 护者 和平性 ②决定了中国不断追求文明交流互鉴而不搞文化霸权 ③决定了中国不会把自己的价值观念与政治体制强加于人 ④决定了中国坚持合作、不搞对抗，决不搞“党同伐异”的小圈子 （助记：传得久是连续，能出新是创新，多民族一体是统一，吸收外来成果是包容，平等交流是和平） 辨析：包容性和和平性都可能出现“文明交流”，强调吸收外来文明成果，看包容性；强调平等相处、不搞文化 霸权，看和平性。", "year": 2027}, {"id": "s4-8", "set": 4, "num": 8, "src": "苏一六套卷（四）", "book": "苏一", "sub": "新思想", "type": "single", "stem": "共同富裕是中国特色社会主义的本质要求。扎实推进共同富裕，既要通过高质量发展把社会财富的“蛋糕”做大，也要通过合理的制度安排把“蛋糕”分好。促进共同富裕的基础性制度是", "opts": {"A": "社会保障制度", "B": "分配制度", "C": "基本公共服务制度", "D": "社会救助制度"}, "ans": "B", "ana": "题干中，把“蛋糕”做大，是通过高质量发展创造更多社会财富，为共同富裕奠定物质基础。把“蛋糕”分好，是通过合理的分配制度安排，让发展成果更多更公平惠及全体人民。党的二十大报告指出：“分配制度是促进共同富裕的基础性制度。”为此，要坚持按劳分配为主体、多种分配方式并存，构建初次分配、再分配、第三次分配协调配套的制度体系。B 正确，ACD 不符合题意。", "dis": "", "ext": "共同富裕与分配制度【《手册》第 89、103 页】 （1）发展和分配。共同富裕是中国特色社会主义的本质要求。高质量发展为共同富裕奠定物质基础；收入分配是 民生之源，是改善民生、实现发展成果由人民共享最重要最直接的方式；分配制度是促进共同富裕的基础性制 度。共同富裕是全体人民共同富裕，是人民群众物质生活和精神生活都富裕，不是同步、同时、所有地区同水平 的富裕。（助记：发展看财富怎么来，分配看成果怎么分） （2）三次分配。【详见：第 3 套，第 7 题】；社会保障的作用【详见：第 4 套，第 24 题】。 （3）“两个同步”：推动居民收入增长和经济增长同步、劳动报酬提高和劳动生产率提高同步。前者看居民收入 与经济增长，后者看劳动者报酬与劳动生产率。", "year": 2027}, {"id": "s4-9", "set": 4, "num": 9, "src": "苏一六套卷（四）", "book": "苏一", "sub": "新思想", "type": "single", "stem": "2026 年 3 月，十四届全国人大四次会议通过《中华人民共和国民族团结进步促进法》，为新时代促进民族团结进步提供法治保障。我国是统一的多民族国家，各民族休戚与共、荣辱与共、生死与共、命运与共。民族团结之本是", "opts": {"A": "民族区域自治制度", "B": "中华民族共同体意识", "C": "各民族共同繁荣发展", "D": "民族平等原则"}, "ans": "B", "ana": "《中华人民共和国民族团结进步促进法》第六条明确指出：“中华民族共同体意识是民族团结之本。”题干中的休戚与共、荣辱与共、生死与共、命运与共，体现了各民族同属中华民族共同体。B 正确。", "dis": "A 选项，属于我国的基本政治制度；C 选项，对应民族工作的重要目标；D 选项，对应各民族一律平等。题干考查的是民族团结之本，ACD 均不符合题意。", "ext": "中华民族共同体意识与民族工作主线【《手册》第 98—99 页】 （1）固定搭配：民族团结是我国各族人民的生命线；中华民族共同体意识是①国家统一之基，②民族团结之本， ③精神力量之魂。铸牢中华民族共同体意识是新时代党的民族工作的主线，也是民族地区各项工作的主线。 （2）四个与共：铸牢中华民族共同体意识，就是要引导各族人民牢固树立休戚与共、荣辱与共、生死与共、命运 与共的共同体理念。（助记：认同同一个国家，统一才有根基。认同同属一个民族共同体，团结才有根本。大家 有共同认同，精神上才能凝聚起来） （3）民族文化与《中华人民共和国民族团结进步促进法》的重要意义【详见：第 1 套，第 24 题】。 【相关考点拓展】基本政治制度——民族区域自治制度 （1）民族区域自治是在国家统一领导下，各少数民族聚居的地方实行区域自治，设立自治机关，行使自治权。 （2）民族区域自治制度是中国特色解决民族问题的正确道路的重要内容和制度保障。 （3）坚持和完善民族区域自治制度，要坚持统一和自治相结合、民族因素和区域因素相结合，促进各民族共同团 结奋斗、共同繁荣发展。 （4）民族自治地方的自治机关是自治区、自治州、自治县的人民代表大会和人民政府。", "year": 2027}, {"id": "s4-10", "set": 4, "num": 10, "src": "苏一六套卷（四）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "19 世纪 60 年代到 90 年代，洋务派以“自强”“求富”为目标，兴办近代企业，建立新式海陆军，创办新式学堂，派遣留学生。洋务运动历时 30 多年，虽然办起了一批企业，建立了海军，却没有使中国富强起来。洋务运动具有封建性，其指导思想是“中学为体，西学为用”，企图以吸取西方近代生产技术为手段，来达到维护和巩固中国封建统治的目的，这就决定了它必然失败的命运。洋务运动失败的标志是", "opts": {"A": "清政府提前撤回留美幼童", "B": "洋务派经营多年的北洋海军全军覆没", "C": "中日《马关条约》的签订", "D": "帝国主义列强掀起瓜分中国的狂潮"}, "ans": "B", "ana": "洋务运动历时 30 多年，虽然办起了一批企业，建立了海军，却没有使中国富强起来。甲午战争一役，洋务派经营多年的北洋海军全军覆没，标志着以“自强”“求富”为目标的洋务运动的失败。北洋海军是洋务派多年经营的重要军事成果，其在甲午战争中全军覆没，表明洋务运动未能实现“自强”的目标。B 正确。", "dis": "A 选项，清政府提前撤回留美幼童，是洋务运动教育实践受挫的表现，不是洋务运动失败的标志。C 选项，《马关条约》签订是北洋海军覆灭带来的后果，并非洋务运动失败标志。D 选项，甲午战争以后，帝国主义列强掀起瓜分中国的狂潮，是民族危机加深的表现，不是洋务运动失败的标志。", "ext": "（1）洋务运动 【《手册》第 122 页：考点 2】 19 世纪 60 年代至 90 年代。以“自强”兴办近代军事工业，以“求富”兴办近代民用企业，同 主要目的 时筹建海军、兴办新式学堂、派遣留学生。指导思想是中学为体，西学为用，目的是维护封建统 治 失败标志 甲午战争一役，北洋海军全军覆没，标志着洋务运动的失败 ①洋务运动具有封建性 失败原因 ②洋务运动对列强具有依赖性 ③洋务企业的管理具有腐朽性 洋务运动具有封建性，体现在：洋务运动的指导思想是“中学为体，西学为用”,企图以吸取西 具体体现 方近代生产技术为手段，来达到维护和巩固中国封建统治的目的，这就决定了它必然失败的命 运。因为新的生产力是同封建主义的生产关系及其上层建筑不相容的 洋务派是封建地主阶级的代表（发展封建主义）。因此，洋务派兴办洋务新政，主要是为了维护 总结 封建统治，并不是要使中国朝着独立的资本主义方向发展 （2）同一场战争的不同标志。 ①北洋海军全军覆没，标志着洋务运动的失败。 ②1895 年《马关条约》签订，台湾等地被割占，民族危机进一步加深。 ③从民族意识看，甲午战争后，中国人民的民族意识开始普遍觉醒。 （3）中日甲午战争对中国的影响主要有： 【《手册》第 120 页：考点 6】 ①德、俄、英、法、日等国于 1898 年至 1899 年竞相租借港湾和划分势力范围，掀起了瓜分中国的狂潮 ②台湾、澎湖列岛被日本侵占 ③中日甲午战争以后，中国人民的民族意识开始普遍觉醒 ④北洋海军全军覆没，标志着洋务运动的失败 ⑤甲午战争后，义和团从秘密反清转向公开反对列强", "year": 2027}, {"id": "s4-11", "set": 4, "num": 11, "src": "苏一六套卷（四）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "大革命失败后，中国共产党开始独立领导革命战争、创建人民军队。1927 年 9 月 9 日，毛泽东等领导的湘赣边界秋收起义爆发。起义军公开打出了“工农革命军”的旗帜，在攻打中心城市长沙受挫后，毛泽东果断改变计划，决定向敌人控制比较薄弱的农村转移。9月 29 日，毛泽东领导起义军在江西永新县三湾村进行了著名的三湾改编。这次改编成为建设无产阶级领导的新型人民军队的重要开端，主要是因为它", "opts": {"A": "确定了土地革命和武装起义的方针", "B": "从组织上确立了党对军队的领导", "C": "确立了思想建党、政治建军原则", "D": "在全党范围内确立实事求是的马克思主义思想路线"}, "ans": "B", "ana": "1927 年 9 月 29 日，毛泽东领导起义军在江西永新县三湾村进行了著名的三湾改编，创造性地将支部建在连上，成立各级士兵委员会，实行民主制度，在政治上官兵平等，从组织上确立了党对军队的领导。三湾改编是建设无产阶级领导的新型人民军队的重要开端。B 正确。", "dis": "A 选项，确定土地革命和武装起义方针的是 1927 年 8 月召开的八七会议。C 选项，确立思想建党、政治建军原则的是 1929 年 12 月召开的古田会议。D 选项，延安整风运动（1941-1945 年）使实事求是的思想路线在全党范围确立起来。", "ext": "（1）人民军队建设的几个“开端”【《手册》第 134—135 页】 时间 事件与历史地位 南昌起义打响武装反抗国民党反动派的第一枪，是党独立领导革命战争、创建人民军队 1927 年 8 月 1 日 和武装夺取政权的开端。 湘赣边界秋收起义公开打出工农革命军的旗帜。进攻长沙受挫后，毛泽东决定向农村转 1927 年 9 月 移。 ①三湾改编把支部建在连上，成立各级士兵委员会，实行民主制度，政治上官兵平等。 1927 年 9 月 29 日 从组织上确立了党对军队的领导。 ②三湾改编是建设无产阶级领导的新型人民军队的重要开端 1929 年 12 月 古田会议确立思想建党、政治建军原则。【详见：第 3 套，第 11 题】【《手册》第 135 页】 （2）秋收起义部队向农村转移途中，三湾改编把党的支部建在连上，解决党怎样在基层部队扎根的问题。两年 后，古田会议面对农村环境和党、军队成员以农民为主要成分的实际，明确用无产阶级思想进行军队和党的建 设。前者抓组织，后者抓思想建党、政治建军。古田会议【详见：第 3 套，第 11 题】。", "year": 2027}, {"id": "s4-12", "set": 4, "num": 12, "src": "苏一六套卷（四）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "1934 年 10 月至 1936 年 10 月，红军第一、第二、第四方面军和红二十五军进行了伟大的长征。长征途中，各路红军先后到达陕甘地区，为中国革命保存和锻炼了骨干力量。红军长征胜利结束的标志是", "opts": {"A": "中央红军到达陕北吴起镇", "B": "红一方面军同红十五军团会合", "C": "中央红军主力结束了二万五千里的行程", "D": "三大主力红军在甘肃会宁、将台堡会师"}, "ans": "D", "ana": "1935 年 10 月，陕甘支队到达陕北吴起镇，11 月初在甘泉地区同红十五军团会合，标志着中央红军主力的长征胜利结束。1936 年 10 月，红四方面军同红一方面军在甘肃会宁会合，红二方面军又同红一方面军在甘肃隆德将台堡会合。至此，三大主力红军的长征胜利结束。D 正确。", "dis": "ABC 选项，1935 年 10 月 19 日，北上红军（红一方面军）到达陕北吴起镇；11月初，在甘泉地区同在陕甘根据地的红十五军团会合，中国共产党所领导的革命力量有了新的落脚点和战略基地。至此，中央红军主力行程二万五千里、纵横 11 个省的长征胜利结束。这只是中央红军主力的长征结束，当时其他主力红军（红二、四方面军）尚未完成长征。", "ext": "【《手册》第 136—137 页：考点 4、5】 （1）长征胜利 90 周年：两年、两地、两个主语 时间与地点 谁和谁会合 历史地位 1935 年 10—11 中央红军到达陕北吴起镇，随后同红十五军 中央红军主力结束二万五千里长征，革命 月，吴起镇、甘泉 团会合。 力量有了新的落脚点和战略基地。 1936 年 10 月，会 红四方面军同红一方面军在会宁会合，红二 三大主力红军会师，标志着红军长征胜利 宁、将台堡 方面军又同红一方面军在将台堡会师。 结束。 （2）遵义会议集中解决军事问题和组织问题。长征途中重大转折【详见：第 1 套，第 11 题】；长征胜利的历史意义 【详见：第 2 套，第 28 题】。", "year": 2027}, {"id": "s4-13", "set": 4, "num": 13, "src": "苏一六套卷（四）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "1992 年初，邓小平南方谈话从理论上深刻回答了长期困扰和束缚人们思想的许多重大问题，把改革开放和现代化建设推向新阶段。同年，江泽民根据南方谈话精神，明确提出使用“社会主义市场经济体制”这一提法，为党的十四大召开作了重要的思想理论准备。1992 年 10 月，中国共产党第十四次全国代表大会在北京召开。这次会议", "opts": {"A": "明确市场在资源配置中起决定性作用", "B": "突破把计划经济同商品经济对立起来的观点", "C": "把完善农村家庭联产承包责任制作为经济体制改革的中心环节", "D": "确定建立社会主义市场经济体制的改革目标"}, "ans": "D", "ana": "1992 年初，邓小平发表南方谈话，明确指出，计划和市场都是经济手段，不是社会主义与资本主义的本质区别，从根本上解除了把计划经济和市场经济看作属于社会基本制度范畴的思想束缚。1992 年 10 月，中国共产党第十四次全国代表大会在北京召开。大会明确我国经济体制改革的目标是建立社会主义市场经济体制，要求更好地发挥计划和市场两种手段的长处，使市场在国家宏观调控下对资源配置起基础性作用。D 正确。", "dis": "A 选项，2013 年召开的党的十八届三中全会提出，使市场在资源配置中起决定性作用和更好发挥政府作用。BC 选项，1984 年党的十二届三中全会通过的《中共中央关于经济体制改革的决定》，突破把计划经济同商品经济对立起来的观点，提出“所有权同经营权是可以适当分开的”。这是党中央在计划与市场关系问题上取得的新认识。会后，经济体制改革以城市为重点全面展开。改革的中心环节是增强全民所有制企业的活力。【拓展】以邓小平南方谈话和党的十四大为标志，改革开放和社会主义现代化建设事业进入从计划经济体制向社会主义市场经济体制转变的新阶段，由此打开了中国经济、政治、文化发展的崭新局面。", "ext": "社会主义市场经济体制的三个节点【《手册》第 155、216 页】 ①1992 年南方谈话：明确计划和市场都是经济手段，标志着社会主义市场经济理论的形成。 ②1992 年党的十四大：确立改革目标，即建立社会主义市场经济体制。 ③1993 年十四届三中全会：进一步勾画基本框架。完整演进【详见：第 1 套，第 6 题】。", "year": 2027}, {"id": "s4-14", "set": 4, "num": 14, "src": "苏一六套卷（四）", "book": "苏一", "sub": "思法", "type": "single", "stem": "孔子称赞颜回虽“一箪食，一瓢饮，在陋巷”，却“不改其乐”。孟子以“富贵不能淫，贫贱不能移，威武不能屈”阐明何为大丈夫。从颜回的安贫乐道到孟子笔下的大丈夫，贯穿其中的传统美德是", "opts": {"A": "注重整体利益，强调责任奉献", "B": "推崇仁爱原则，注重以和为贵", "C": "追求精神境界，向往理想人格", "D": "强调道德修养，注重道德践履"}, "ans": "C", "ana": "两则材料共同描绘了值得追求的人格境界。颜回在清贫中安守其志，孟子笔下的大丈夫在富贵、贫贱、威势面前仍坚持道义。C 正确。", "dis": "A 选项，侧重个人对整体的责任；B 选项，侧重待人处世的原则；D 选项，侧重省察、慎独等修身实践。ABD 均不符合题意。", "ext": "中华传统美德的五组表达【《手册》第 166 页】 基本精神 言行线索 注重整体利益， 公义胜私欲是根本要求。“国而忘家，公而忘私”“以公灭私，民其允怀”。 强调责任奉献 推崇仁爱原则， “己欲立而立人，己欲达而达人”“仁者自爱”。 注重以和为贵 注重人伦关系， “五教”“五伦”“仁、义、礼、智、信”“忠、孝、节、义”。 重视道德义务 追求精神境界， “明于庶物，察于人伦”“先天下之忧而忧，后天下之乐而乐”。 向往理想人格 强调道德修养， “见贤思齐焉，见不贤而内自省也”“善养吾浩然之气”“察色修身”“以身戴 注重道德践履 行”。", "year": 2027}, {"id": "s4-15", "set": 4, "num": 15, "src": "苏一六套卷（四）", "book": "苏一", "sub": "时政", "type": "single", "stem": "2026 年 4 月 10 日上午，中共中央总书记习近平在北京会见了郑丽文主席率领的中国国民党访问团。大陆和台湾同属一个中国，中国是中华民族的共同家园。两岸同胞要守护好、建设好这个共同家园，根本在于", "opts": {"A": "坚持“九二共识”、反对“台独”", "B": "让两岸同胞过上更美好的生活", "C": "坚定对中华民族、中华文化、伟大祖国的认同", "D": "传承弘扬中华文化"}, "ans": "A", "ana": "习近平总书记指出，大陆和台湾同属一个中国，中国是中华民族的共同家园。两岸同胞要守护好、建设好这个共同家园，根本在于坚持“九二共识”、反对“台独”，核心是认同两岸同属一个中国；发展两岸关系的目标，是要让两岸同胞过上更美好的生活。A 正确，BCD 不符合题意。", "dis": "", "ext": "两岸关系发展的四点意见 ①坚持以正确认同促进心灵契合。坚定对中华民族、中华文化、伟大祖国的认同。 ②坚持以和平发展守护共同家园。两岸同胞要守护好、建设好这个共同家园，根本在于坚持“九二共识”、反对 “台独”，核心是认同两岸同属一个中国。 ③坚持以交流融合增进民生福祉。发展两岸关系的目标，是要让两岸同胞过上更美好的生活。 ④坚持以团结奋斗实现中华民族伟大复兴。我们坚信，会有越来越多台湾同胞正确认识大陆社会制度和发展道 路，深刻认识到台湾的发展前途在于强大祖国、台湾同胞的利益福祉系于中华民族伟大复兴。 （助记：认同让心更近，和平守住家园，交流让日子更好，奋斗走向复兴）", "year": 2027}, {"id": "s4-16", "set": 4, "num": 16, "src": "苏一六套卷（四）", "book": "苏一", "sub": "时政", "type": "single", "stem": "2026 年 10 月 23 日，国家主席习近平向 2026 全球治理论坛（雄安）致信，他指出，当前，世界百年变局加速演进，和平赤字、发展赤字、安全赤字、治理赤字有增无减。我提出全球治理倡议，旨在推动构建更加公正合理的全球治理体系，建设一个更加美好的世界。2026 全球治理论坛（雄安）的主题为", "opts": {"A": "以共商促共享，以善治促善智", "B": "践行全球治理倡议，构建人类命运共同体", "C": "多边主义：更多交流、更多包容、更多合作", "D": "重建信心与合作：百年变局与改革完善全球治理"}, "ans": "D", "ana": "2026 全球治理论坛（雄安）的主题为“重建信心与合作：百年变局与改革完善全球治理”。D 正确，ABC 不符合题意。二、多项选择题：17～33 小题，每小题 2 分，共 34 分。下列每题给出的四个选项中，至少有两个选项是符合题目要求的。", "dis": "", "ext": "论坛主题、倡议宗旨、全球治理观 ①本届论坛主题：重建信心与合作：百年变局与改革完善全球治理。 ②全球治理倡议旨在：推动构建更加公正合理的全球治理体系，建设一个更加美好的世界。 ③全球治理倡议的五项核心理念是奉行主权平等（首要前提）、遵守国际法治（根本保障）、践行多边主义（基 本路径）、倡导以人为本（价值取向）、注重行动导向（实践原则）。【《手册》第 114 页】 ④全球治理观。共商共建共享。致信提到的“四个赤字”依次为和平赤字、发展赤字、安全赤字、治理赤字。 （助记：谁都能平等参与是主权平等，按什么规则办是国际法治，大家怎么一起办是多边主义，办事为了谁是以 人为本，怎么把事办成是行动导向） 全球治理与联合国的关系【详见：第 3 套，第 16 题】", "year": 2027}, {"id": "s4-17", "set": 4, "num": 17, "src": "苏一六套卷（四）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "冬性小麦需要经历一段时间的持续低温，才能获得开花的能力。研究发现，低温通过调节植株体内相关基因的表达，增强促进开花的作用并抑制阻碍开花的作用。完成这一过程后，植株还需在后续条件适宜时才能开花。春性小麦则不需要经历这一低温过程。这些现象表明", "opts": {"A": "外部条件的作用需要通过事物内部矛盾的运动才能实现", "B": "外部条件的变化决定着事物发展的基本趋势", "C": "矛盾的特殊性是事物对相同外部条件作出不同反应的内在根据", "D": "事物之间的联系及其作用随具体条件的变化而变化"}, "ans": "ACD", "ana": "事物的内部矛盾是事物发展的根据，外部矛盾是事物发展的条件，外因必须通过内因起作用。低温通过调节植株内部相关基因的表达，增强促进开花的作用、抑制阻碍开花的作用，说明外部条件通过事物内部的矛盾运动发挥作用，A 正确。矛盾具有特殊性，不同事物的内部矛盾各有特点，构成它们区别于其他事物的内在根据。冬性小麦与春性小麦对低温的不同需求，说明不同的内部特点使其对相同外部条件作出不同反应，C 正确。联系具有条件性，条件对事物发展具有支持或制约作用。冬性小麦经历低温后仍需后续条件适宜才能开花，说明一种条件的作用不能脱离其他具体条件，联系及其作用会随条件变化而变化，D 正确。", "dis": "B 错误，事物发展的根本原因在于内部矛盾，内部矛盾决定事物发展的基本趋势。外部条件能够加速或延缓发展，影响发展的具体过程，但必须通过内部矛盾发挥作用。低温的作用依赖小麦自身的内部特点，不能把外部条件的变化说成决定基本趋势的力量。", "ext": "（1）内因、外因 【《手册》第 9 页：考点 2——苏一说】 ①内因（内部矛盾）是事物发展的根本原因，是事物发展的根据，决定事物发展的基本趋势 ②外因（外部矛盾）是事物发展的条件，影响（加速或延缓）事物的发展，外因必须通过内因起作用 （2）矛盾特殊性的三种情形 【《手册》第 9—10 页】 ①不同事物的矛盾各有特点。 ②同一事物的矛盾在不同发展过程和发展阶段各有不同特点。 ③构成事物的诸多矛盾以及每一矛盾的不同方面各有不同的性质、地位和作用。 方法论是具体问题具体分析。 （3）矛盾的普遍性与特殊性 ①矛盾的普遍性（即共性、一般）是无条件的、绝对的 特点 ②矛盾的特殊性（个性、个别）是有条件的、相对的 任何现实存在的事物的矛盾都是共性和个性的有机统一： ①共性寓于个性之中，没有离开个性的共性，也没有离开共性的个性 辩证统一 ②矛盾的共性和个性的道理是关于事物矛盾问题的精髓，是正确理解矛盾学说的关键 ③人的认识的一般规律就是由认识个别上升到一般，再由一般到个别的辩证发展过程 （4）联系的四个特性：【详见：第 1 套，第 17 题】【《手册》第 7—8 页】", "year": 2027}, {"id": "s4-18", "set": 4, "num": 18, "src": "苏一六套卷（四）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "郑板桥记述画竹的过程：清晨看竹，烟光、日影、露气浮动于竹叶之间，胸中遂有画意。他说：“其实胸中之竹，并不是眼中之竹也。”及至磨墨展纸、落笔作画，“手中之竹又不是胸中之竹也”。这一艺术创作过程表明", "opts": {"A": "观念的东西不外是移入人的头脑并在人的头脑中改造过的物质的东西而已", "B": "主体与客体的关系根本上是认识与被认识的关系", "C": "艺术创作能够通过实践使观念的东西转化为现实的东西", "D": "艺术构思具有把观念形象变成现实作品的直接现实性"}, "ans": "AC", "ana": "意识是客观世界的主观映象，是客观内容和主观形式的统一。“胸中之竹”来源于现实中竹子的形态及其光影，又经过画家的感受、选择和构思，并非对“眼中之竹”的机械复制，体现了艺术形象的客观内容与主观形式的统一，A 正确。实践具有直接现实性，能够把观念的存在变为现实的存在。画家通过磨墨展纸、落笔作画，使头脑中的构思成为现实的绘画作品，体现了观念的东西通过实践转化为现实的东西，C 正确。", "dis": "B 错误，主体与客体之间包括实践关系、认识关系和价值关系，其中最根本的是实践关系。认识关系是在实践基础上形成和发展的，不能用认识与被认识的关系代替最根本的实践关系。D 错误，艺术构思属于意识活动，只能形成观念中的形象，不具有直接现实性。把构思转化为现实作品，需要作画等实践活动，不能把实践的特点归于艺术构思本身。", "ext": "（1）意识的创造性 【《手册》第 6、14—15 页】 两次转化 考点 ①意识是人脑的机能和属性，是客观世界的主观映象，是客观内容和主观形式的统 一。人能够通过实践在观念中创造现实中尚不存在的形象。 观念的东西不外是移入人的头脑并在人的头脑中改造过的物质的东西而已 现实对象→观念形象 ——这是马克思的原话，意思是：人的意识是来自于客观世界的，并且是经过大脑加 工改造过的。 ②无论意识正确与否都可以在物质世界找到其“原型” 实践具有直接现实性，能把观念的存在变为现实的存在。 观念形象→现实作品 艺术创作属于科学文化实践。 （2）实践的直接现实性 实践的三个基本特征是客观实在性、自觉能动性、社会历史性。 ①实践的主体和客体相互作用的关系包括：实践关系、认识关系、价值关系。其中实践关系最根本。 ②实践的主体和客体正是依靠中介系统才能够相互作用。 ③人类一切实践活动的结果都是主体客体化的结果 【详见：第 3 套，第 17 题】。 （3）实践的三种基本实践类型 ①物质生产实践：最基本的实践活动 ②社会政治实践：主要指人们的政治活动 ③科学文化实践：是创造精神文化产品的实践活动，重要形式有科学、艺术、教育等活动 三种基本类型 （注：精神文化的生产不是一个纯粹的意识过程。比如，教育者的教学活动并不是纯粹的 意识活动） 【注意】后两类在物质生产实践基础上产生和发展，受物质生产实践的制约。画家在心里 构图属于意识活动，动笔作画使画纸发生了现实变化，属于科学文化实践。 ①虚拟实践，主要活跃于网络世界，具有交互性、开放性、间接性等特点 新的实践形式 ②虚拟实践是实践活动的派生形式，同时又对现实的实践活动产生重大影响", "year": 2027}, {"id": "s4-19", "set": 4, "num": 19, "src": "苏一六套卷（四）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "邓小平在评价毛泽东的历史贡献时指出：“没有毛主席，至少我们中国人民还要在黑暗中摸索更长的时间。”他同时强调，毛泽东把马克思列宁主义的原理同中国革命的实际结合起来，指出了中国夺取革命胜利的道路。关于历史人物，下列说法正确的有", "opts": {"A": "历史人物的出现是合规律性与合目的性的统一", "B": "历史人物有时能够对个别历史事件的结局起决定作用", "C": "历史人物能够影响历史发展的具体进程但不能改变其基本方向", "D": "历史人物是社会历史的创造主体"}, "ans": "BC", "ana": "历史人物是一定历史事件的主要倡导者、组织领导者，或者思想理论、科学文化的重要代表人物。他们能够对历史发展产生深刻影响，有时甚至能够决定个别历史事件的结局。毛泽东把马克思列宁主义基本原理同中国革命实际相结合，指出夺取革命胜利的道路，体现了杰出人物对解决重大历史任务的重要作用，B 正确。历史人物的作用受社会历史条件和社会发展客观规律的制约，能够影响具体历史进程，却不能改变历史发展的基本方向。“还要在黑暗中摸索更长的时间”肯定了毛泽东对革命进程的重大影响，并不意味着历史的基本方向由个人决定，C 正确。", "dis": "A 错误，任何历史人物的出现都体现了必然性与偶然性的统一。历史任务和时代条件规定了人物出现的社会需要，具体由谁担当又具有偶然性。“合规律性与合目的性的统一”是关于人的成功实践的规定，不能替代历史人物出现中的必然性与偶然性。D 错误，人民群众是社会历史的主体，是历史的创造者。肯定历史人物的重大作用，不能否定人民群众在创造历史中的决定作用，也不能以少数历史人物取代人民群众的主体地位。", "ext": "【《手册》第 28—29 页】 （1）个人在社会历史中的作用 个人在历史上的作用存在差别。有的人作用大些，可称为“历史人物”。有的人作用小些，可称 为“普通个人”。 ①历史人物是一定历史事件的主要倡导者、组织领导者或思想理论、科学文化的重要代表人物。 历史人物 ②杰出人物是历史人物中对推动历史发展作出重要贡献或起重要作用的人 ③新的历史任务往往是由具有进步意义的历史人物首先发现或提出来的 ④无产阶级的领袖人物，所提出的思想能够成为社会变革的先导 不管什么样的历史人物，在历史上发挥什么样的作用，都要受到社会发展客观规律的制约。历史 作用 人物有时能够决定个别历史事件的结局，不能决定和改变历史发展的总进程和总方向 ①任何历史人物的出现都体现了必然性与偶然性的统一。时代需要有人担当某项任务，具体由谁 担当又具有偶然性。 ②历史人物的作用性质取决于他们的思想、行为是否符合社会发展规律，是否符合人民群众的意 评价 愿 ③评价历史人物要坚持历史分析方法和阶级分析方法。评价时，把人物放回他所处的时代，考察 当时的社会条件、他所代表的阶级利益以及实际发挥的作用。 （2）人民群众 在社会历史发展过程中，人民群众起着决定性的作用。体现在： ①人民群众是社会物质财富的创造者 决定作用 ②人民群众是社会精神财富的创造者 ③人民群众是社会变革的决定力量 ①人民群众创造历史的作用同社会基本矛盾运动推动社会前进的过程相一致 依据 ②人民群众的总体意愿和行动代表了历史发展的方向，人民群众的社会实践最终决定历史发展的 结局 人民群众创造历史的活动受到一定社会历史条件的制约： ①经济条件对于人民群众创造历史的活动有着首要的、决定性的影响 制约条件 ②政治条件对人民群众创造历史的活动也具有直接的影响 ③精神文化条件也是制约人民群众创造历史活动的重要因素", "year": 2027}, {"id": "s4-20", "set": 4, "num": 20, "src": "苏一六套卷（四）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "一家面粉厂生产的面粉，一部分卖给食品厂加工面包，另一部分卖给居民用于家庭消费。面粉厂按价值售出产品并收回货款，却因买不到足够的小麦而难以维持原有的生产规模。由此可见", "opts": {"A": "产品的实物形态决定其所属的生产部类", "B": "同一种产品可以因最终用途不同而分别属于生产资料和消费资料", "C": "面粉厂耗费的资本已在价值上得到补偿", "D": "面粉厂的生产受阻发生在实物补偿环节"}, "ans": "BCD", "ana": "社会再生产的核心问题是社会总产品的实现，即价值补偿和实物补偿。①价值补偿，即生产的商品卖得出去、生产中所耗费的资本在价值上得到补偿。②实物补偿，即实际生产过程中所耗费的生产资料和消费资料得到实物的替换，也就是说企业能购买到原材料。题干中，面粉厂按价值售出产品并收回货款，说明商品卖出去了，其耗费的资本已在价值上得到补偿；但买不到足够的小麦，说明其生产受阻发生在实物补偿环节。CD 正确。社会总产品按最终用途可分为生产资料和消费资料。面粉卖给食品厂用于生产面包，属于生产资料；卖给居民用于家庭消费，属于消费资料。B 正确。", "dis": "A 错误，产品所属的生产部类不是由其实物形态本身决定的，而是由产品的最终用途决定的。【拓展】①社会再生产的核心问题是社会总产品的实现问题，即社会总产品的价值补偿和实物补偿问题。②社会再生产的顺利进行，要求生产中所耗费的资本在价值上得到补偿，同时还要求实际生产过程中所耗费的生产资料和消费资料得到实物的替换，否则社会再生产就会停顿，人类社会的生存和发展就会受到威胁。③社会总产品在实物上得到替换，在价值上实现补偿，客观上就要求两大部类内部各个产业部门之间和两大部类之间保持一定的比例关系。④由生产资料的私有制和雇佣劳动制度所决定，两大部类的生产都是在价值规律和剩余价值规律的作用下自发进行的，具有严重的盲目性，这就导致了两大部类生产在规模上和结构上经常处于失衡状态。这种失衡和脱节经常表现为生产过剩，以至于社会总产品的实现，即实物替换和价值补偿难以顺利进行，最严重的就是引发经济危机。", "ext": "（1）社会再生产的核心问题 【《手册》第 40 页】 比较 划分依据与内容 依据产品的最终用途。①第Ⅰ部类生产生产资料，进入生产消费。②第Ⅱ部类生产消 （1）两大部类 费资料，进入个人消费。 社会再生产的核心问题：社会总产品的实现问题（即价值补偿和实物补偿问题） （2）两种补偿 ①价值补偿：商品卖得出去，生产中所耗费的资本得到价值补偿。 ②实物补偿：生产过程中所耗费的生产资料和消费资料得到实物的替换。 ①社会总产品必须同时实现两种补偿。②两大部类之间、两大部类内部各产业部门之 （3）实现条件 间必须保持合理的比例关系。", "year": 2027}, {"id": "s4-21", "set": 4, "num": 21, "src": "苏一六套卷（四）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "第二次世界大战后，资本主义国家普遍加强对经济的干预。20 世纪 70 年代起，随着经济陷入滞胀和新自由主义思潮泛滥，西方国家又普遍强化市场调节、弱化政府干预。在这一过程中，资本主义经济危机呈现出新的特点，主要表现为", "opts": {"A": "周期性危机与结构性危机交织", "B": "财政严重债务化，债务危机频繁爆发", "C": "经济高度金融化，虚拟经济与实体经济严重脱节", "D": "危机的根源由生产领域的基本矛盾转为流通领域的金融失调"}, "ans": "ABC", "ana": "资本主义经济危机的新特点包括：去工业化和产业空心化日趋严重，产业竞争力下降；经济高度金融化，虚拟经济与实体经济严重脱节；财政严重债务化，债务危机频繁爆发；两极分化和社会对立加剧；经济增长乏力，发展活力不足，周期性危机与结构性危机交织；金融危机频发，全球经济屡受打击。ABC 正确。", "dis": "D 选项，资本主义经济危机的根源始终是生产领域的资本主义基本矛盾，金融失调只是危机的新表现形式，根源并未发生转移。", "ext": "（1）经济危机的六个新特点 【《手册》第 47 页】 ①去工业化和产业空心化日趋严重，产业竞争力下降。 ②经济高度金融化，虚拟经济与实体经济严重脱节。 ③财政严重债务化，债务危机频繁爆发。 ④两极分化和社会对立加剧。 ⑤经济增长乏力，周期性危机与结构性危机交织在一起。 ⑥金融危机频发，全球经济屡受打击。 （2）资本主义的基本矛盾与经济危机 【《手册》第 43 页】 ①危机的本质特征是生产相对过剩；根源是资本主义的基本矛盾，即生产社会化和生产资料资本主义私人占有之 间的矛盾 ②从根源到周期 区分 应背判断 危机的可能性 经济危机的抽象的一般的可能性，首先是由货币作为流通手段和支付手段引起的。 基本矛盾的两种 ①生产无限扩大的趋势与劳动人民有支付能力的需求相对缩小的矛盾。 表现 ②单个企业内部生产的有组织性和整个社会生产的无政府状态之间的矛盾。 资本主义基本矛盾运动的阶段性决定经济危机的周期性。社会资本再生产经历危机、萧 周期性 条、复苏、高涨四个阶段。 毛中特（5—6 单选；22 多选）", "year": 2027}, {"id": "s4-22", "set": 4, "num": 22, "src": "苏一六套卷（四）", "book": "苏一", "sub": "毛中特", "type": "multi", "stem": "毛泽东在谈到农业合作化问题时指出：“我们现在不但正在进行关于社会制度方面的由私有制到公有制的革命，而且正在进行技术方面的由手工业生产到大规模现代化机器生产的革命，而这两种革命是结合在一起的。”这里强调“两种革命是结合在一起的”，表明我国向社会主义过渡需要", "opts": {"A": "使所有制改造的实际步骤与促进工业化的要求相适应", "B": "通过发展现代工业，为推进社会主义改造提供物质条件", "C": "以完成生产技术改造作为变革生产资料所有制的前提", "D": "通过变革生产关系，为发展社会生产力创造条件"}, "ans": "ABD", "ana": "【翻译题干】题干中的“两种革命”，是指生产资料私有制的社会主义改造（即三大改造，属于生产关系变革）与社会主义工业化（属于生产力发展）。“两种革命结合在一起”，体现了变革生产关系与发展生产力的有机统一。我国社会主义改造的第一条重要历史经验是坚持社会主义工业化建设与社会主义改造同时并举。体现在：①社会主义改造就是变革不适应工业化发展要求的生产关系，是围绕着社会主义工业化建设这个中心任务进行的。在改造过程中，党和政府所采取的实际步骤，总是力求使之与促进工业化进程和经济发展的要求相适应，而不允许对生产力造成破坏。②“一化”即社会主义工业化，“三改”即对个体农业、手工业和资本主义工商业的社会主义改造。其中，“一化”是“主体”，“三改”是“两翼”，两者相辅相成、相互促进。题干通过发展现代工业（即社会主义工业化）、推进技术改造，为所有制改造（三大改造）提供物质条件。③社会主义革命的目的是为了解放生产力。引导个体农民、个体手工业者走集体化的道路，改造私人资本主义工商业，这些属于变革生产关系，目的都是为了适应社会主义工业化建设的要求，更好地发展生产力。ABD 正确。", "dis": "C 选项，我国社会主义改造的历史经验，是要坚持社会主义工业化建设与社会主义改造同时并举，而不是先完成技术改造，再变革所有制（生产关系）。", "ext": "（1）过渡时期总路线 【《手册》第 62-63 页：考点 2】 题干中的“两种革命”，是指生产资料私有制的社会主义改造（即三大改造，属于生产关系变革）与社会主义工 业化（属于生产力发展）。“两种革命结合在一起”，体现了变革生产关系与发展生产力的有机统一 过渡时期总路线的主要内容：一化三改（即一体两翼） ①主体是实现国家的社会主义工业化，重在发展生产力。 主要内容 ②两翼是对农业、手工业和资本主义工商业的社会主义改造，重在变革生产关系 ③特点：社会主义建设和社会主义改造同时并举 （2）社会主义改造的三条历史经验 【《手册》第 65 页：考点 4】 ①坚持社会主义工业化建设与社会主义改造同时并举。 ②采取积极引导、逐步过渡方式。 ③用和平方法进行改造。 （3）改造的对象与路径。【《手册》第 63-64 页：考点 3】 ①农业：互助组→初级农业生产合作社→高级农业生产合作社。 ②手工业：手工业供销小组→手工业供销合作社→手工业生产合作社。 ③资本主义工商业：通过国家资本主义实现过渡，对资本家占有的生产资料实行和平赎买。 （4）改造时间与标志。从中华人民共和国成立到社会主义改造基本完成，是我国从新民主主义到社会主义的过渡 时期。1953 年提出过渡时期总路线。1956 年底，社会主义改造基本完成，标志着社会主义基本制度在中国确立。 这里的“完成”指三大改造，社会主义工业化建设仍要继续。【《手册》第 63、151-152 页】 新思想（7—9 单选；23—26 多选）", "year": 2027}, {"id": "s4-23", "set": 4, "num": 23, "src": "苏一六套卷（四）", "book": "苏一", "sub": "新思想", "type": "multi", "stem": "我国不断丰富人大代表联系人民群众的内容和形式。十四届全国人大四次会议期间，全国人大代 重复使用火箭技术取得重大突破，将为加快提升我国进出空间能力奠定坚 技术意义 实基础。可控回收使火箭关键部件返回，为检测、维护和重复使用创造条件。此次完 成了发射和回收；同一子级再次执行飞行任务才称得上复飞。 国际时政（16 单选；33 多选）", "year": 2027}, {"id": "s4-33", "set": 4, "num": 33, "src": "苏一六套卷（四）", "book": "苏一", "sub": "时政", "type": "multi", "stem": "2026 年 3 月 30 日，世界数据组织成立大会在北京举行。习近平主席在致世界数据组织成立大会的贺信中指出，智能时代数据的作用日益显现，世界数据组织为深化数据国际合作、完善全球数据治理提供了有益平台。该组织的宗旨包括", "opts": {"A": "弥合数据鸿沟", "B": "释放数据价值", "C": "统一数据标准", "D": "繁荣数字经济"}, "ans": "ABD", "ana": "习近平主席在向世界数据组织成立致贺信时指出，当今世界正在加速迈入智能时代，数据的基础资源作用和创新引擎作用日渐显现。世界数据组织以“弥合数据鸿沟、释放数据价值、繁荣数字经济”为宗旨，为深化数据国际合作、完善全球数据治理提供了有益平台。ABD 正确，C 不符合题意。一、单项选择题：1～16 小题，每小题 1 分，共 16 分。下列每题给出的四个选项中，只有一个选项是最符合题目要求的。", "dis": "", "ext": "世界数据组织：宗旨、大会主题、数据作用 ①组织宗旨：弥合数据鸿沟、释放数据价值、繁荣数字经济（助记：用得上、用得好、带动发展）。 ②成立大会主题：“共建数据合作平台·共享数字发展机遇”。 ③数据的双重作用：数据的基础资源作用和创新引擎作用日渐显现。 ④组织的作用：为深化数据国际合作、完善全球数据治理提供了有益平台。 ⑤该组织会员：包括全球数据领域相关企业、高校、智库、国际组织、金融机构等。", "year": 2027}, {"id": "s5-1", "set": 5, "num": 1, "src": "苏一六套卷（五）", "book": "苏一", "sub": "马原", "type": "single", "stem": "2026 年 3 月 5 日，习近平总书记在参加十四届全国人大四次会议江苏代表团审议时强调：“江苏要在增强经济韧性上持续用力。”落实这一要求，面对外部环境的不确定性，既要充分估计困难、提前准备应对措施，防止风险突破承受限度，又要积极创造条件，争取更好的发展结果。这种工作方法突出体现的思维方式是", "opts": {"A": "历史思维", "B": "底线思维", "C": "创新思维", "D": "战略思维"}, "ans": "B", "ana": "底线思维是在认识世界和改造世界的过程中，根据需要和客观条件，划清并坚守底线，尽力化解风险，避免最坏结果，同时争取实现最大期望值的一种积极思维。充分估计困难、提前准备应对措施、防止风险突破承受限度，体现了对底线和最坏情形的预判；积极创造条件、争取更好的发展结果，体现了在守住底线的基础上争取主动。因此，题干突出体现的是底线思维。B 正确。", "dis": "A 选项，历史思维是以史为鉴、知古鉴今，善于运用历史眼光认识发展规律、指导现实工作的思维。材料没有通过历史经验指导当前工作的内容，与题意不相符合。C选项，创新思维强调突破常规、超越陈规，因时制宜地开拓创新。材料突出风险预判和底线防守，没有突出对既有思路的突破，与题意不相符合。D 选项，战略思维强调整体性、全局性、长期性，善于统揽全局、把握总体趋势和方向。材料的着重点是避免最坏结果并争取最好结果，与题意不相符合。", "ext": "六种思维能力 【《手册》第 14 页】 思维能力 抓住哪个动作 辩证思维 发现矛盾、分析矛盾、解决矛盾，把握本质、遵循规律、指导实践。 历史思维 以史为鉴、知古鉴今，把历史、现实、未来贯通起来。 系统思维 从事物相互联系的各个方面及其结构和功能进行系统思考。【详见：第 1 套，第 17 题】 战略思维 强调整体性、全局性、长期性，把握发展的总体趋势和方向。 底线思维 根据需要和客观条件划清并坚守底线，尽力化解风险，避免最坏结果，同时争取实现最大期望值 创新思维 突破常规、超越陈规，因时制宜、知难而进、开拓创新。", "year": 2027}, {"id": "s5-2", "set": 5, "num": 2, "src": "苏一六套卷（五）", "book": "苏一", "sub": "马原", "type": "single", "stem": "《庄子·养生主》记述，庖丁解牛经过长期练习，熟悉了牛体的结构，能够“依乎天理”“因其固然”，顺着筋骨间的空隙运刀。遇到筋骨交错之处，他仍保持谨慎，放慢动作。庖丁顺着牛体结构运刀而能游刃有余，表明", "opts": {"A": "人对一定问题的判断愈是自由，这个判断的内容所具有的必然性就愈大", "B": "人们能够改变客观规律发生作用的条件", "C": "感性经验的积累能够自发实现向理性认识的飞跃", "D": "意识能够在实践之前形成对活动结果的预期"}, "ans": "A", "ana": "自由是对必然的认识和对客观世界的改造。必然性即规律性，是自由的根据和限度；人们只有认识客观必然性，并在实践中按规律办事，才能获得行动的自由。庖丁通过长期练习熟悉牛体结构，按照筋骨间的空隙运刀，并在复杂部位保持谨慎，把对客观结构的认识运用于实际操作，从而做到游刃有余，说明他对牛体结构及解牛规律认识得越深刻，行动就越自由。A 正确。", "dis": "B 说法本身正确，规律具有客观性，人不能改变客观规律本身，但可以改变规律发生作用的条件，但题干强调的是庖丁认识并利用规律，而非改变规律发生作用的条件。C 错误，感性认识向理性认识的飞跃需要经过思考加工，不能自发完成。D 说法正确，意识具有目的性和计划性，能够在实践之前形成对活动结果的预期。但材料没有着重说明活动结果的预先设想。", "ext": "【《手册》第 21—22 页】 ①必然性即规律性。自由是对必然的认识和对客观世界的改造。必然性是自由的根据和限度。庖丁能 选择运刀路线，是因为筋骨的位置有规律可循。 ②自由有两个条件。认识条件：认识客观事物的规律。实践条件：把这种认识运用于实践，具备相应 必然与自由 的手段和能力。知道筋骨在哪里，还要能把刀准确地运到那里。 ③认识和利用规律的边界。可以改变规律发生作用的条件，不能改变规律本身。【详见：第 1 套，第 1 题】 ①认识世界和改造世界是人类创造历史的两种基本活动 认识世界和 ②认识世界和改造世界统一的基础是实践 改造世界 ③主观和客观的矛盾是人类认识和实践活动中的基本矛盾，也是人类认识世界和改造世界的根本动力 ④认识世界的目的是改造世界", "year": 2027}, {"id": "s5-3", "set": 5, "num": 3, "src": "苏一六套卷（五）", "book": "苏一", "sub": "马原", "type": "single", "stem": "在自由竞争条件下，资本在不同生产部门之间的转移推动利润率趋于平均化。进入垄断阶段后，垄断资本家却有可能长期获得大大超过平均利润的高额利润。其主要原因在于，垄断组织", "opts": {"A": "提高了资本的有机构成", "B": "加快了资本的周转速度", "C": "阻碍了资本在各部门之间的自由转移", "D": "扩大了用于积累的剩余价值规模"}, "ans": "C", "ana": "垄断资本的实质在于获取垄断利润，垄断利润是垄断资本家凭借其在社会生产和流通中的垄断地位而获得的超过平均利润的高额利润。垄断利润的形成，关键在于垄断组织在经济生活中起了决定性作用，从而阻碍了资本在各部门之间的自由转移，限制了利润平均化的趋势，这样一来，垄断资本家有可能长期获得大大超过平均利润的垄断利润。C正确。", "dis": "A 选项，资本有机构成反映资本技术构成与价值构成的关系，不能说明垄断地位如何阻碍利润平均化。B 选项，加快周转有利于资本增殖，不能说明垄断企业何以长期占有高额利润。D 选项，用于积累的剩余价值规模扩大是资本积累的表现，不能说明垄断资本为什么能够获得超过平均利润的高额利润。", "ext": "（1）垄断利润与垄断价格【《手册》第 44—45 页】 垄断利润是垄断资本家凭借其在社会生产和流通中的垄断地位而获得的超过平均利润的高额利润。垄断利 含义 润的形成，关键在于垄断组织在经济生活中起了决定性作用，从而阻碍了资本在各部门之间的自由转移， 限制了利润平均化的趋势，这样一来垄断资本家有可能长期获得大大超过平均利润的垄断利润 归根到底来自无产阶级和其他劳动人民创造的剩余价值 ①加强对本国劳动人民的剥削。 来源 ②通过垄断高价和垄断低价获得其他企业特别是非垄断企业的一部分利润。 ③通过对其他国家劳动人民的剥削和掠夺获取利润。 ④通过国家政权进行有利于垄断资本的再分配。 垄断利润主要是通过垄断组织制定的垄断价格来实现的 实现方 ①垄断价格=成本价格（c+v）+ 平均利润 + 垄断利润 式 ②出售商品时规定垄断高价，购买非垄断企业的原材料等生产资料时规定垄断低价 ①垄断价格的产生没有否定价值规律。因为从全社会看，商品的价格总额仍然等于商品的价值总额 价值规 ②垄断价格是价值规律在垄断资本主义阶段作用的具体表现 律 ③垄断条件下，价值规律的表现形式是，商品的价格围绕垄断价格自发波动 ④垄断价格改变价值的分配，不能创造新的价值 （2）垄断不能消除竞争的原因 【详见：第 1 套，第 21 题】", "year": 2027}, {"id": "s5-4", "set": 5, "num": 4, "src": "苏一六套卷（五）", "book": "苏一", "sub": "马原", "type": "single", "stem": "列宁晚年在总结社会主义建设经验时，对小农经济占优势的国家如何建设社会主义进行了深入思考。在无产阶级掌握国家政权和国家经济命脉的条件下，如何引导广大农民走向社会主义，是其中的重要问题。针对这一问题，列宁提出的构想是", "opts": {"A": "用合作社的形式将农民引向社会主义道路", "B": "通过余粮收集制集中农民的剩余产品", "C": "以优先发展重工业为中心建立社会主义大工业", "D": "通过银行和大工业国有化确立社会主义经济基础"}, "ans": "A", "ana": "列宁晚年在领导苏维埃俄国社会主义建设的过程中，提出了建设社会主义的新构想。其中，针对如何引导农民走向社会主义的问题，列宁提出，在无产阶级掌握国家政权和国家经济命脉的条件下，可以通过合作社的形式把农民引向社会主义道路。A 正确。", "dis": "B 选项，余粮收集制是战时共产主义政策的主要内容，不是列宁晚年针对这一问题提出的构想。C 选项，优先发展重工业、建立社会主义大工业，是苏联模式形成过程中实行的工业化方针，不是针对农民问题提出的措施。D 选项，银行和大工业国有化属于进一步巩固苏维埃政权时期的措施，解决的是国家掌握经济命脉的问题，不是题干所问的农民组织形式。", "ext": "从战时共产主义政策到建设社会主义的新构想 【《手册》第 50 页】 （1）战时共产主义时期（外国武装干涉和国内战争时期）。战时共产主义政策的主要特征：余粮收集制和取消商 品货币关系 （2）新经济政策时期：1921 年 3 月，俄共（布）十大决定向新经济政策过渡。主要特征是发展商品经济。以粮食 税制取代余粮收集制，允许私人自由贸易，恢复商品货币关系，允许私人小工业企业发展，采取一些国家资本主 义的形式发展生产。 （3）新经济政策时期，列宁对建设社会主义的新构想。 ①把建设社会主义作为一个长期探索、不断实践的过程。 ②把大力发展生产力、提高劳动生产率放在首要地位。 ③在多种经济成分并存的条件下，利用商品、货币和市场发展经济。 ④利用资本主义建设社会主义。", "year": 2027}, {"id": "s5-5", "set": 5, "num": 5, "src": "苏一六套卷（五）", "book": "苏一", "sub": "毛中特", "type": "single", "stem": "毛泽东指出：“农民问题，就成了中国革命的基本问题，农民的力量，是中国革命的主要力量。”在半殖民地半封建的中国，广大农民深受封建地主阶级的压迫和剥削，只有解决农民的土地问题，才能充分发动和组织农民参加革命。由此决定了新民主主义革命的主要内容是", "opts": {"A": "没收封建地主阶级的土地归农民所有", "B": "没收官僚资本归新民主主义国家所有", "C": "推翻帝国主义、封建主义和官僚资本主义的统治", "D": "处理好土地革命、武装斗争、农村革命根据地建设三者之间的关系"}, "ans": "A", "ana": "新民主主义的经济纲领指出，没收封建地主阶级的土地归农民所有，是新民主主义革命的主要内容。要改变中国贫穷落后的面貌，必须废除封建地主土地所有制，进行土地革命，以扫除封建的剥削关系，解放农村生产力。题干强调解决农民土地问题、发动农民参加革命，因此应对应土地革命的内容。A 正确。", "dis": "B 选项，没收官僚资本归新民主主义国家所有，是新民主主义革命的题中应有之义（属于经济纲领内容，但不是“主要内容”）。C 选项，反映的是新民主主义革命的对象——帝国主义、封建主义、官僚资本主义（即三座大山）。D 选项，处理好土地革命、武装斗争、农村革命根据地建设三者之间的关系，是农村包围城市、武装夺取政权道路理论的内容。", "ext": "（1）新民主主义的经济纲领【《手册》第 59—60 页】 没收地主土地 没收封建地主阶级的土地归农民所有，是新民主主义革命的主要内容。 没收官僚资本归新民主主义国家所有，是新民主主义革命的题中应有之义，包含着新民主主义 没收官僚资本 革命和社会主义革命的双重性质。 保护民族工商 保护民族工商业，是新民主主义经济纲领中极具特色的一项内容，由中国落后的生产力和新民 业 主主义革命的性质所决定。 （2）总路线与基本纲领的形成【详见：第 2 套，第 5 题】", "year": 2027}, {"id": "s5-6", "set": 5, "num": 6, "src": "苏一六套卷（五）", "book": "苏一", "sub": "毛中特", "type": "single", "stem": "1992 年，邓小平在南方谈话中明确指出：“计划多一点还是市场多一点，不是社会主义与资本主义的本质区别。计划经济不等于社会主义，资本主义也有计划；市场经济不等于资本主义，社会主义也有市场。计划和市场都是经济手段。”这一精辟论述", "opts": {"A": "明确了我国经济体制改革的目标是建立社会主义市场经济体制", "B": "第一次比较系统地论述了我国社会主义初级阶段理论", "C": "勾画了建立社会主义市场经济体制的蓝图和基本框架", "D": "标志着邓小平的社会主义市场经济理论的形成"}, "ans": "D", "ana": "1992 年，邓小平在南方谈话中的精辟论述，从理论上突破了计划经济和市场经济是制度属性的观念，从根本上解除了把计划经济和市场经济看做属于社会基本制度范畴的思想束缚，标志着邓小平的社会主义市场经济理论的形成。这也为党的十四大明确把建立社会主义市场经济体制作为我国经济体制改革的目标奠定了理论基础。D 正确。", "dis": "A 选项，党的十四大明确把建立社会主义市场经济体制作为我国经济体制改革的目标。B 选项，党的十三大第一次比较系统地论述了我国社会主义初级阶段理论。C 选项，党的十四届三中全会通过《中共中央关于建立社会主义市场经济体制若干问题的决定》，勾画了建立社会主义市场经济体制的蓝图和基本框架。", "ext": "南方谈话突破了哪一层思想束缚【《手册》第 71、155 页】 1992 年，邓小平在南方谈话中明确指出：“计划多一点还是市场多一点，不是社会主义与资本主 义的本质区别。计划经济不等于社会主义，资本主义也有计划；市场经济不等于资本主义，社会 主义也有市场。计划和市场都是经济手段” 提出 ①计划经济和市场经济不是划分社会制度的标志。②计划和市场都是经济手段，对经济活动的调 节各有优劣，社会主义实行市场经济是要把两者优势结合起来。③市场经济作为资源配置手段本 身不具有制度属性，可以和不同的社会制度结合，从而表现出不同的性质 ①从理论上突破了计划经济和市场经济是制度属性的观念 重要性 ②从根本上解除了把计划经济和市场经济看做属于社会基本制度范畴的思想束缚 （这一精辟 ③标志着邓小平的社会主义市场经济理论的形成 论述） ④为党的十四大明确把建立社会主义市场经济体制作为我国经济体制改革的目标奠定了理论基础 （2）理论形成、目标确立、框架勾画。 ①1992 年南方谈话——社会主义市场经济理论形成。②1992 年党的十四大——改革目标确立。③1993 年十四届三 中全会——基本框架勾画。理论形成过程【详见：第 1 套，第 6 题】，改革目标【详见：第 4 套，第 13 题】。", "year": 2027}, {"id": "s5-7", "set": 5, "num": 7, "src": "苏一六套卷（五）", "book": "苏一", "sub": "新思想", "type": "single", "stem": "党的领导是全面的、系统的、整体的。各地区各部门谋划和推进工作，要自觉从党和国家事业全局出发，既立足自身职责，又加强协同配合，防止各行其是。维护党中央权威和集中统一领导的根本要求是", "opts": {"A": "贯彻落实党中央重大决策部署", "B": "科学有效地把权力关进制度笼子", "C": "清醒坚定地推进反腐败斗争", "D": "不断提高监督执纪执法质效"}, "ans": "A", "ana": "习近平强调，贯彻落实党中央重大决策部署，是维护党中央权威和集中统一领导的根本要求，也是党和人民事业不断发展进步的重要历史经验。A 正确，BCD 不符合题意。", "dis": "", "ext": "党的领导与党的自我革命【《手册》第 82 页】 （1）党的领导是全面的、系统的、整体的。全面，覆盖各领域各方面；系统，各级各类组织依照职责发挥作用； 整体，各项工作围绕党和国家事业全局协调推进。 （2）维护党中央权威和集中统一领导 ①党中央集中统一领导是党的领导的最高原则，是党保持团结统一和强大战斗力、不断取得胜利的关键所在 ②党中央的权威首先体现在党的理论和路线方针政策能够不折不扣得到贯彻执行 ③维护党中央权威和集中统一领导最关键的是坚决维护习近平同志党中央的核心、全党的核心地位 ④维护党中央权威和集中统一领导，同坚持党的民主集中制是完全一致的 （3）“两个维护”：坚决维护习近平总书记党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领 导。 （4）党的自我革命重在治权，把权力关进制度笼子是新时代全面从严治党的一项重要任务。 党的二十届五中全会相关内容【详见：第 1 套，第 15 题】", "year": 2027}, {"id": "s5-8", "set": 5, "num": 8, "src": "苏一六套卷（五）", "book": "苏一", "sub": "新思想", "type": "single", "stem": "科技型企业从研发到成果转化，需要不同阶段的资金支持；小微企业和涉农经营主体的发展，也需要更加便捷、适配的金融服务。我国持续做好科技金融、绿色金融、普惠金融、养老金融、数字金融“五篇大文章”，引导金融资源投向重大战略、重点领域和薄弱环节。这些部署表明，金融工作的根本宗旨是", "opts": {"A": "以人民为中心", "B": "金融服务实体经济", "C": "防控风险", "D": "深化金融供给侧结构性改革"}, "ans": "B", "ana": "习近平总书记明确指出，要“坚持把金融服务实体经济作为根本宗旨”。题干中，为科技型企业、小微企业和涉农经营主体提供适配的金融服务，引导金融资源投向重大战略、重点领域和薄弱环节，体现了金融立足实体经济发展需要、提升服务质效的要求。B正确。", "dis": "A 选项，对应金融工作的价值取向；C 选项，对应金融工作的永恒主题，D 选项，对应推进金融高质量发展的主线。题干考查金融工作的根本宗旨，ACD 均不符合题意。", "ext": "金融工作的固定搭配与金融五篇大文章（大力推动构建新发展格局） 设问 对应表述 价值取向 以人民为中心 金融服务实体经济（实体经济是金融的根基，金融是实体经济的血脉，为实体经济服 根本宗旨 务是金融的天职）【《手册》第 91 页】 永恒主题 防控风险 主线 深化金融供给侧结构性改革 底线 不发生系统性金融风险 金融“五篇大文章：①科技金融（服务科技创新）；②绿色金融（支持绿色低碳转型）；③普惠金融（提高小微 企业、“三农”等获得金融服务的便利程度）；④养老金融（服务养老需求）；⑤数字金融（运用数字技术改善 金融服务）。", "year": 2027}, {"id": "s5-9", "set": 5, "num": 9, "src": "苏一六套卷（五）", "book": "苏一", "sub": "新思想", "type": "single", "stem": "实行“一国两制”，既要坚守“一国”之本，又要发挥“两制”之利。香港、澳门回归祖国后的实践表明，只有把“一国”的底线守得更牢，“两制”的优势才能发挥得更加充分。贯彻“一国两制”方针的最高原则是", "opts": {"A": "保持香港、澳门长期繁荣稳定", "B": "保障特别行政区依法享有高度自治权", "C": "维护国家主权、安全、发展利益", "D": "“爱国者治港”“爱国者治澳”"}, "ans": "C", "ana": "习近平总书记指出：“维护国家主权、安全、发展利益是‘一国两制’方针的最高原则。”C 正确，ABD 不符合题意。", "dis": "", "ext": "“一国两制”与香港维护国家安全的实践【《手册》第 111 页】 （1）“一国”和“两制”的关系：①“一国”是实行“两制”的前提和基础；②“两制”从属和派生于“一 国”，并统一于“一国”之内。“一国”之内的“两制”并非等量齐观、比肩并列，国家的主体必须实行社会主 义制度。 （2）坚持中央全面管治权和保障特别行政区高度自治权相统一：①全面管治权是授权特别行政区高度自治的前提 和基础；②高度自治权是中央行使全面管治权的体现；③它们之间是源与流、本与末的关系；④高度自治不是完 全自治，也不是分权，而是中央授予的地方事务管理权。 （3）坚定落实“爱国者治港”“爱国者治澳”原则。这是事关国家主权、安全、发展利益，事关香港、澳门长期 繁荣稳定的根本原则，是保证香港、澳门长治久安的必然要求。 （4）坚持依法治港治澳：①宪法和基本法共同构成特别行政区的宪制基础；②宪法和基本法共同构成、共同实施， 是“一国两制”下特别行政区制度的本质属性和基本特征。 （5） 2026 年发布的《“一国两制”下香港维护国家安全的实践》白皮书指出，香港维护国家安全的实践，本质 上是坚持和发展“一国两制”事业的实践，是保护 750 万香港居民的基本人权、尊严和福祉的实践，是促进世界 和平与发展的实践。 ①安全是国家生存发展的前提，是社会稳定的基础，是人民福祉的保障。保证国家安全是头等大事 ②中央政府对香港特别行政区有关的国家安全事务负有根本责任（维护国家安全是中央事权），香港特别行政区 负有维护国家安全的宪制责任 （6）六大基本经验：①坚持中央政府根本责任和特别行政区宪制责任相统一；②坚持把特别行政区管治权牢牢掌 握在爱国者手中（把政治安全摆在首位）；③坚持尊重和保障人权；④坚持在法治轨道上维护安全；⑤坚持统筹 发展和安全；⑥坚持在开放中维护安全（“一国两制”下香港维护国家安全，塑造的是开放型安全）", "year": 2027}, {"id": "s5-10", "set": 5, "num": 10, "src": "苏一六套卷（五）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "孙中山在总结辛亥革命失败的教训时指出：“非袁氏兵力之强，实同党人心之涣。”当时，同盟会内部的组织比较松懈，派系纷杂，甚至有人主张“革命军起，革命党消”，有的还另建党派，自立山头。这反映了资产阶级革命派的一个重要弱点是", "opts": {"A": "没有建立全国性的资产阶级革命政党", "B": "没有制定资产阶级民主革命纲领", "C": "不能建立坚强的革命政党作为领导核心", "D": "不能充分发动和依靠人民群众"}, "ans": "C", "ana": "题干材料中的“同党人心之涣”以及同盟会内部组织松懈、派系纷杂等问题，说明资产阶级革命派内部缺乏严密的组织和统一的领导，不能建立坚强的革命政党作为领导核心。C 正确。", "dis": "A 选项，1905 年成立的中国同盟会，是近代中国第一个领导资产阶级革命的全国性政党。革命派的问题不是没有建立政党，而是不能建立坚强的革命政党作为领导核心。B 选项，孙中山提出的三民主义是比较完整的资产阶级民主革命纲领，同盟会也以此为政治纲领，不能说革命派没有制定纲领。D 选项，不能充分发动和依靠人民群众也是资产阶级革命派的弱点，但材料反映的是革命政党组织松懈、领导核心不坚强的问题。【拓展】这场革命之所以失败，从主观方面来说，在于它的领导者资产阶级革命派本身存在着许多弱点和错误。主要是：第一，没有提出彻底的反帝反封建的革命纲领。第二，不能充分发动和依靠人民群众。第三，不能建立坚强的革命政党，作为团结一切革命力量的强有力的核心。资产阶级革命派的这些弱点、错误，根源于中国民族资产阶级的软弱性和妥协性。正因为如此，辛亥革命仅仅赶跑了一个皇帝，却没有能够改变封建主义和军阀官僚政治的统治基础，无法完成反帝反封建的任务。", "ext": "【《手册》第 126—127 页】 （1）辛亥革命的成果与历史局限【详见：第 2 套，第 10 题】 （2）失败的原因 根本原因 在帝国主义时代，在半殖民地半封建的中国，资本主义的建国方案是行不通的 在于它的领导者资产阶级革命派本身存在着许多弱点和错误。革命派自身的弱点 ①没有提出彻底的反帝反封建的革命纲领。已有三民主义纲领，“不彻底”和“没有纲领”含义 不同。 主观原因 ②不能充分发动和依靠人民群众。 ③不能建立坚强的革命政党，作为团结一切革命力量的强有力的核心。 （资产阶级革命派的这些弱点、错误，根源于中国民族资产阶级的软弱性和妥协性）", "year": 2027}, {"id": "s5-11", "set": 5, "num": 11, "src": "苏一六套卷（五）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "1927 年 9 月，毛泽东领导湘赣边界秋收起义。起义受挫后，毛泽东根据敌我力量对比和革命形势，及时调整起义部队的行动部署。10 月，起义部队抵达井冈山地区，开始创建革命根据地。这一战略调整在中国革命发展进程中的重要意义是", "opts": {"A": "确定了土地革命和武装起义的方针", "B": "打响了武装反抗国民党反动派的第一枪", "C": "从组织上确立了党对人民军队的领导", "D": "开始了从进攻大城市向农村进军的转变"}, "ans": "D", "ana": "9 月 9 日，毛泽东等领导的湘赣边界秋收起义爆发。起义军公开打出了“工农革命军”的旗帜，在攻打中心城市长沙受挫后，毛泽东果断改变计划，决定向敌人控制比较薄弱的农村转移。10 月 7 日，起义部队抵达江西省宁冈县茅坪，开始了创建井冈山农村革命根据地的斗争。从进攻大城市转到向农村进军，这是中国人民革命史上具有决定意义的新起点。题干中的“调整起义部队的行动部署”与“抵达井冈山地区，开始创建革命根据地”，体现了革命进军方向由城市转向农村。D 正确。", "dis": "A 选项，土地革命和武装起义的方针是八七会议（1927 年 8 月 7 日）确立的。B 选项，1927 年 8 月 1 日，南昌起义打响了武装反抗国民党反动派的第一枪。C 选项，1927 年 9 月 29 日，毛泽东领导起义军在江西永新县三湾村进行了著名的三湾改编，从组织上确立了党对军队的领导。三湾改编是建设无产阶级领导的新型人民军队的重要开端。", "ext": "1927 年：政治方针、军队建设与革命道路 【《手册》第 134—135 页】 ①8 月 1 日，南昌起义，打响武装反抗国民党反动派的第一枪。 ②8 月 7 日，八七会议，确定土地革命和武装起义的方针。 ③9 月，湘赣边界秋收起义，公开打出工农革命军旗帜；起义受挫后，开始从进攻大城市向农村进军。 ④9 月 29 日，三湾改编，把支部建在连上。 ⑤10 月 7 日，起义部队开始了创建井冈山农村革命根据地的斗争，开始创建农村革命根据地。 三湾改编与党对军队的领导【详见：第 4 套，第 11 题】；井冈山革命根据地的意义【详见：第 4 套，第 27 题】。", "year": 2027}, {"id": "s5-12", "set": 5, "num": 12, "src": "苏一六套卷（五）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "1936 年 12 月，张学良、杨虎城实行“兵谏”，提出停止内战、一致抗日等主张。中国共产党以中华民族团结抗日大局为重，积极促成事变和平解决。西安事变的和平解决成为时局转换的枢纽，标志着", "opts": {"A": "十年内战局面基本结束，国内和平初步实现", "B": "中国人民抗日救亡运动新高潮的到来", "C": "以国共两党第二次合作为基础的抗日民族统一战线正式形成", "D": "中国进入全民族抗战阶段"}, "ans": "A", "ana": "西安事变发生后，党中央以中华民族团结抗日大局为重，独立自主确定了用和平方式解决西安事变的方针。周恩来与张学良、杨虎城共同努力，经过谈判，迫使蒋介石作出“停止剿共，联红抗日”的承诺。西安事变的和平解决成为时局转换的枢纽，十年内战局面基本结束，国内和平初步实现。A 正确。", "dis": "B 选项，1935 年的一二·九运动，促进了中华民族觉醒，标志着中国人民抗日救亡运动新高潮的到来。C 选项，1937 年 9 月 22 日，国民党中央通讯社发表《中共中央为公布国共合作宣言》；23 日，蒋介石发表实际上承认共产党合法地位的谈话，标志着以国共两党第二次合作为基础的抗日民族统一战线正式形成。D 选项，1937 年卢沟桥事变（七七事变）爆发后，当地中国驻军奋起抵抗，中国由此进入全民族抗战阶段。", "ext": "（1）四个标志按时间区分 【《手册》第 137—138 页】 时间 事件 标志或影响 1935 年 12 月 一二·九运动 中国人民抗日救亡运动新高潮的到来。 十年内战的局面基本结束，国内和平初步实现，为建立抗 1936 年 12 月 西安事变和平解决 日民族统一战线准备了必要前提。 1937 年 7 月 卢沟桥事变 中国进入全民族抗战阶段。 国共合作宣言发表，蒋介石发表实 1937 年 9 月 以第二次国共合作为基础的抗日民族统一战线正式形成。 际上承认共产党合法地位的谈话 （2）瓦窑堡会议的方针与口号【详见：第 4 套，第 28 题】", "year": 2027}, {"id": "s5-13", "set": 5, "num": 13, "src": "苏一六套卷（五）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "1946 年 1 月 10 日，政治协商会议在重庆开幕，出席会议的有国民党、共产党、民主同盟、青年党和无党派人士代表共 38 人。以周恩来为首的中共代表团与民主同盟等民主党派和无党派人士的代表密切合作，同国民党当局认真协商，推动政协会议达成政府组织案、国民大会案、和平建国纲领、军事问题案、宪法草案案五项协议。对政协的上述协议，共产党表示赞同并决心严格履行，这是因为它有利于", "opts": {"A": "奠定中国共产党领导的多党合作和政治协商制度的基础", "B": "冲破蒋介石的独裁统治和实行民主政治、和平建国", "C": "从根本上摧毁封建制度的根基", "D": "改变国共两党军事力量对比"}, "ans": "B", "ana": "1946 年 1 月 10 日，国共双方下达停战令。同一天，政治协商会议在重庆开幕。以周恩来为首的中共代表团与民主同盟等民主党派和无党派人士的代表密切合作，同国民党当局认真协商，推动政协会议达成五项协议。政协会议协议 是物质的根本属性。 （2）从哪里体现。①自然界是物质的。②人类社会本质上是生产实践基础上形成的物质体系。③人的意识统一于 物质。意识是客观世界的主观映象，意识本身具有主观性。【详见：第 1 套，第 19 题】 （3）两个哲学问题。先问“物质与意识何者为第一性”，区分唯物主义和唯心主义；再问“思维能否认识存 在”，区分可知论和不可知论。发现有机分子支持可知性，一次发现并不意味着认识已经穷尽。 （4）关于物质的客观实在性：【《手册》第 4、183 页】 哪些概念是 物质的存在不依赖于人的意识。科学发现拓展了人的认识范围，物质世界的存在范围不取决于人 客观的 是否认识它。 不能改变 规律及其客观性不能改变。人不能创造、改变、消灭、摆脱规律，可以认识、利用规律。 ①规律发挥作用的条件可以改变。在尊重规律的前提下，才可以改变 可以改变 ②物质的性质和结构、状态可以改变，但是需要尊重规律，不能任意改变", "year": 2027}, {"id": "s5-18", "set": 5, "num": 18, "src": "苏一六套卷（五）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "《吕氏春秋·本味》论烹调，讲究调味的“先后多少”，要求做到“熟而不烂”“酸而不酷”“辛而不烈”。烹调既要根据食材的特性掌握火候和调味分量，使食物由生变熟，又要避免加热或调味过度，以获得适宜的口感。这些要求蕴含的哲学道理有", "opts": {"A": "保持事物质的稳定性需要把量变控制在一定范围内", "B": "质变是事物由低级向高级发展的基本标志", "C": "实践中既要促成必要的质变也要防止不利的质变", "D": "任何成功的实践都是真理尺度和价值尺度的统一"}, "ans": "ACD", "ana": "度是保持事物质的稳定性的数量界限，超出度的范围，事物就会发生质变。要保持适宜的食物状态，就应控制加热程度和调味分量，做到“熟而不烂”“酸而不酷”“辛而不烈”，体现了保持质的稳定性需要把量变控制在一定范围内，A 正确。量变达到一定程度会引起质变，实践中应根据目的和条件把握这一过程。使食物由生变熟，需要促成必要的质变；避免过度加热等破坏适宜状态，又需要防止不利的质变，C 正确。任何成功的实践都是真理尺度和价值尺度的统一。依据食材特性掌握火候和调味分量，体现遵循客观规律的真理尺度；获得适宜口感、满足人的需要，体现价值尺度，D 正确。", "dis": "B 错误，质变是事物根本性质的变化，是由一种质态向另一种质态的飞跃，并不必然意味着由低级向高级发展。发展是前进的、上升的运动，其实质是新事物的产生和旧事物的灭亡。把所有质变都视为上升发展，混淆了质变与发展的区别。", "ext": "度、量变质变与成功实践的两个尺度 （1）度与关节点。度是保持事物质的稳定性的数量界限；度的两端叫关节点或临界点。区分量变和质变的根本标 志是变化是否超出度的范围。度是一个范围，关节点是这个范围的界限。【《手册》第 11—12 页】 （2）量变和质变的辩证关系。①量变是质变的必要准备。②质变是量变的必然结果。③量变和质变相互渗透。总 的量变中有阶段性和局部性的部分质变，质变中也有旧质在量上的收缩和新质在量上的扩张。④量变质变规律体 现了事物发展的渐进性和飞跃性的统一。要保持原有性质，就坚持适度；需要改变性质，就在量的积累达到条件 时促成质变。 （3）实践的两种尺度。真理尺度要求遵循事物的本质和规律，价值尺度体现主体的需要和目的。【《手册》第 21 页】 ①价值尺度必须以真理为前提 辩证统一 ②人类自身需要的内在尺度，推动着人们不断发现新的真理 任何实践活动都是在这两种尺度共同制约下进行的： 方法论 ①任何成功的实践都是真理尺度和价值尺度的统一 ②任何成功的实践都是合规律性和合目的性的统一 ①实践是客观规律性与主观能动性统一的基础 实践的“桥 ②人的实践活动是合规律性和合目的性的统一 梁”作用 ③人的实践活动要遵循真理尺度与价值尺度的统一 ④实践是认识世界和改造世界统一的基础", "year": 2027}, {"id": "s5-19", "set": 5, "num": 19, "src": "苏一六套卷（五）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "良渚先民依托当地自然条件发展稻作农业，并修筑水利工程保障生产和生活。美洲的玛雅人以玉米种植为重要的生产活动，留下了与玉米有关的神话叙事和艺术作品。从稻作遗存、水利系统到玉米神形象，这些文明印记体现的哲学道理有", "opts": {"A": "物质生产活动及生产方式是人类社会赖以存在和发展的基础", "B": "自然地理环境决定着不同地区文明的发展样态", "C": "文明多样性是社会历史存在和发展的前提", "D": "不同文明体现着各自独特的生产和生活方式"}, "ans": "AD", "ana": "物质生产活动及生产方式是人类社会赖以存在和发展的基础，是人类其他一切活动的首要前提。良渚先民发展稻作农业、修筑水利工程，玛雅人从事玉米种植，这些生产活动为其生活和文化发展提供了物质基础，A 正确。每一种文明都在特定的自然环境、历史背景和民族传统中生长，体现着独特的生产、生活和交往方式。稻作遗存、水利系统以及玉米神形象等文明印记，分别反映了不同地区人们的生产生活及由此形成的文化特色，D 正确。", "dis": "B 错误，自然地理环境是人类社会生存和发展的必要条件，是生产和生活的自然基础，但不能脱离社会生产而发挥作用，更不能成为决定文明发展样态的力量。不同文明的形成还同生产方式、历史条件等相联系，不能归结为地理环境的决定作用。C 错误，现实的人及其活动是社会历史存在和发展的前提。文明多样性是人们在不同条件下长期实践形成的结果，不能用它替代现实的人及其活动的前提地位。", "ext": "（1）社会历史的前提、必要条件和决定力量【《手册》第 22—23 页】 主语 对应判断 现实的人及其活动 社会历史存在和发展的前提。【《手册》第 28 页】【详见：第 3 套，第 2 题】 自然地理环境、 都是社会存在和发展的必要条件。 人口因素 地理环境提供生活和生产的自然基础，其作用受社会生产发展状况制约。 生产力和生产关系的统一，是社会历史发展的决定力量。 物质生产方式 物质生产是人类其他一切活动的首要前提。 （2）玉米种植为玛雅人提供食物，玉米形象又进入神话和艺术，体现社会存在决定社会意识。【详见：第 4 套，第 2 题】", "year": 2027}, {"id": "s5-20", "set": 5, "num": 20, "src": "苏一六套卷（五）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "随着自动化、智能化技术的发展，一些资本主义企业将越来越多的生产操作交由机器完成，直接操作机器的工人减少，参与生产的科研、设计、技术和管理人员增加。生产过程日益成为不同岗位劳动者分工协作的过程，每个劳动力所推动的生产资料数量也不断增加。这表明", "opts": {"A": "自动化设备只转移自身价值而不创造新价值", "B": "自动化设备已经成为剩余价值的主要来源", "C": "率先使用机器人的个别企业其资本技术构成会提高", "D": "机器的资本主义应用可以成为生产相对剩余价值的手段"}, "ans": "ACD", "ana": "资本主义条件下的生产自动化，只是意味着剩余价值生产所使用的生产工具更加先进。自动化设备在本质上仍然属于不变资本，只能将自身价值转移到新产品中，不能创造新价值。资本的技术构成是由生产的技术水平所决定的生产资料和劳动力之间的数量比例。个别企业率先使用机器人，使每个劳动力所推动的生产资料数量增加，其资本技术构成会随之提高。机器的使用能够提高劳动生产率；当劳动生产率普遍提高并引起劳动力价值下降时，必要劳动时间缩短、剩余劳动时间相对延长。因此，机器的资本主义应用可以成为生产相对剩余价值的手段。ACD 正确。", "dis": "B 错误，剩余价值是由雇佣工人的剩余劳动创造的。机器人、自动化设备等属于不变资本，只转移自身价值，不能成为剩余价值的来源。", "ext": "（1）自动化生产中的价值来源【《手册》第 38 页】 ①生产由科研、设计、技术、操作等岗位的劳动者分工协作完成。 ②机器人和自动化生产线属于不变资本，只转移原有价值。雇佣工人的剩余劳动仍然是剩余价值的唯一源泉。【详 见：第 1 套，第 3 题】 （2）（2）资本构成的三种含义【《手册》第 39 页】 概念 判断依据 资本技术构成 从物质形态看，生产资料和劳动力之间的比例。每名工人推动更多设备，说明技术构成提高 资本价值构成 从价值形态看，不变资本和可变资本之间的比例。 资本有机构成 由技术构成决定并反映技术构成变化的资本价值构成，通常用 c∶v 表示。 （3）超额剩余价值与相对剩余价值【《手册》第 37—38 页】 ①个别企业率先提高生产率，商品个别价值低于社会价值，可取得超额剩余价值。②技术普及并使生活资料价值 下降，劳动力价值随之下降，必要劳动时间缩短，才构成生产相对剩余价值的条件。【详见：第 2 套，第 20 题】", "year": 2027}, {"id": "s5-21", "set": 5, "num": 21, "src": "苏一六套卷（五）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "进入 21 世纪以来，资本主义生产方式的新变化推动资本积累方式从一般产业资本积累向国际金融垄断资本积累转变，国际金融资本的垄断成为当代资本主义最突出、最鲜明、最主要的特征。国际金融垄断资本主义影响日益显现，主要表现为", "opts": {"A": "金融垄断寡头化", "B": "金融垄断国际化", "C": "经济虚拟化、产业空心化", "D": "资本占有主体分散化"}, "ans": "ABC", "ana": "国际金融垄断资本主义影响日益显现，主要表现为：一是金融垄断寡头化，垄断体系推动财富向少数金融寡头和金融寡头利益集团积聚；二是金融垄断国际化，超巨型跨国公司控制国际产业链、贸易链和优势产业，成为垄断世界市场的关键力量；三是经济虚拟化、产业空心化，实体经济和虚拟经济相分离。ABC 正确。", "dis": "D 选项，国际金融垄断资本的发展使财富逐步向少数金融寡头及其利益集团积聚，体现的是资本控制的集中，而非资本占有主体分散化。【拓展】当代资本主义变化的新特征：第一，科技创新加速资本主义生产方式变化。一是产业结构的调整。二是生产组织和劳动形式的变化。三是新经济形态的出现。第二，国际金融垄断资本主义影响日益显现。一是金融垄断寡头化。二是金融垄断国际化。三是经济虚拟化、产业空心化。第三，社会阶级层级结构呈现复杂性、多样化。第四，发达资本主义国家凭借经济、科技、文化传播等超级优势，在世界范围内推行霸权主义和强权政治。", "ext": "（1）金融资本的形成与金融寡头的统治方式【详见：第 3 套，第 21 题】 （2）当代资本主义变化的新特征【《手册》第 48 页】 一是产业结构的调整。形成了以去工业化、经济虚拟化、金融化为主要特征的产业结 ①科技创新加速资本主 构模式。二是生产组织和劳动形式的变化。数据成为一种新的生产要素。三是新经济 义生产方式变化 形态的出现。数字经济、智能经济、共享经济等已成为近年来全球经济发展的新形态 国际金融资本的垄断是当代资本主义最突出、最鲜明、最主要的特征。 一是金融垄断寡头化，回答财富和控制权向谁集中 ②国际金融垄断资本主 二是金融垄断国际化，回答控制范围如何跨越国界 义影响日益显现 三是经济虚拟化、产业空心化，回答经济结构发生什么变化。 若设问改成“经济危机的新特点”，要回到危机六点【详见：第 4 套，第 21 题，手册第 47 页】 ③社会阶级层级结构呈现复杂性、多样化 ④发达资本主义国家凭借经济、科技、文化传播等超级优势，在世界范围内推行霸权主义和强权政治 毛中特（5—6 单选；22 多选）", "year": 2027}, {"id": "s5-22", "set": 5, "num": 22, "src": "苏一六套卷（五）", "book": "苏一", "sub": "毛中特", "type": "multi", "stem": "中国革命、建设和改革的实践证明，要运用马克思主义指导实践，必须实现马克思主义中国化，马克思主义之所以能够中国化的原因在于", "opts": {"A": "马克思主义理论的内在要求", "B": "马克思主义与中华民族优秀文化具有相融性", "C": "中国革命、建设和改革的实践需要马克思主义指导", "D": "马克思主义为中国革命、建设和改革提供了现实的发展模式"}, "ans": "ABC", "ana": "①推进马克思主义中国化时代化，是马克思主义理论本身发展的内在要求。作为洞察时代、引领时代的科学理论，马克思主义只有正确运用于实践并在实践中不断发展才能体现其科学性，彰显其强大力量。②马克思主义与中华民族优秀文化具有相融性，能够同中华优秀传统文化相结合。要坚定历史自信、文化自信，坚持古为今用、推陈出新，把马克思主义思想精髓同中华优秀传统文化精华贯通起来、同人民群众日用而不觉的共同价值观念融通起来。③推进马克思主义中国化时代化，是解决中国实际问题的客观需要。马克思主义要在中国发挥指导作用，就必须中国化时代化。只有与中国国情相结合、与时代发展同进步，马克思主义才能真正解决中国的实际问题。ABC 正确。", "dis": "D 选项，马克思主义提供的是科学的立场、观点和方法，不是现成的现实发展模式。中国革命、建设和改革的具体道路，需要结合中国实际探索，不能直接套用。", "ext": "【《手册》第 53—54 页】 （1）马克思主义中国化时代化的提出：1938 年，毛泽东在党的六届六中全会上作了《论新阶段》的报告，标志着 “马克思主义中国化”这一命题的正式提出。推进马克思主义中国化时代化的必然性：①是马克思主义理论本身 发展的内在要求。②是解决中国实际问题的客观需要。③马克思主义与中华民族优秀文化具有相融性。 【注意区分】“一脉相承”与“相融”： ①毛泽东思想、中国特色社会主义理论体系与马克思主义是一脉相承又与时俱进的关系 ②中华民族优秀文化与马克思主义不是一脉相承，而是相融的关系，二者具有相融性 （2）马克思主义中国化时代化的内涵 ①解决中国问题。运用马克思主义的立场、观点、方法，研究和回答中国革命、建设、改革中的实际问 三层 ②创造新的理论成果。总结和提炼中国实践经验，使之上升为理论，丰富和发展马克思主义，赋予马克 意思 思主义以新的时代内涵 ③赋予鲜明中国特色。用中国人民喜闻乐见的民族语言阐述马克思主义理论。 （3）“两个结合”：把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合。【详见：第 2 套，第 25 题】 （4）马克思主义中国化时代化的理论成果及其关系 内在关系 马克思主义中国化时代化的理论成果是一脉相承又与时俱进的关系： 毛泽东思想和中国特色社会主义理论体系： ①都是马克思列宁主义在中国的运用和发展 ②都以独创性的理论成果丰富和发展了马克思主义的理论宝库 ③都是党和国家必须长期坚持的指导思想 共同点 ④都是全国各族人民团结奋斗的共同思想基础 ⑤都具有实事求是的理论精髓 ⑥都贯穿实事求是、群众路线、独立自主的立场观点方法 ⑦都科学回答了时代提出的重大理论和实践课题 新思想（7—9 单选；23—26 多选）", "year": 2027}, {"id": "s5-23", "set": 5, "num": 23, "src": "苏一六套卷（五）", "book": "苏一", "sub": "新思想", "type": "multi", "stem": "2026 年 9 月，全国先进制造业大会在北京召开，会上学习传达了习近平总书记就发展先进制造业作出的重要指示。党的十八大以来，我国先进制造业不断发展壮大，制造强国建设迈出坚实步伐。新征程上，坚持智能化、绿色化、融合化方向，持续做大做强先进制造业，有利于", "opts": {"A": "提升产业链自主可控水平", "B": "推动产业链各环节实现自主供给", "C": "巩固壮大实体经济根基", "D": "为推进中国式现代化提供有力支撑"}, "ans": "ACD", "ana": "持续做大做强先进制造业，有利于增强关键环节的技术和供给保障能力，提升产业链自主可控水平，A 正确。先进制造业是现代化产业体系的骨干，做大做强先进制造业有利于巩固壮大实体经济根基，C 正确。先进制造业发展壮大，有利于夯实中国式现代化的物质技术基础，为推进中国式现代化提供有力支撑，D 正确。ACD 正确。", "dis": "B 错误，提升产业链自主可控水平，并不是各环节都实现自主供给，而是指对产业链的关键环节具备较强的把控力。", "ext": "现代化产业体系：着力点、骨干和发展方向【《手册》第 91—92 页】 ①着力点：坚持把发展经济的着力点放在实体经济上。②骨干：建设以先进制造业为骨干的现代化产业体系。 ③发展方向：智能化、绿色化、融合化。 先进制造业的骨干作用、传统制造业的基底作用【详见：第 1 套，第 23 题】；先进制造业和现代服务业【详见：第 4 套， 第 26 题】。", "year": 2027}, {"id": "s5-24", "set": 5, "num": 24, "src": "苏一六套卷（五）", "book": "苏一", "sub": "新思想", "type": "multi", "stem": "一台家电更新换代，一头连着百姓生活，一头连着企业生产。2026 年，我国继续实施消费品以旧换新政策，对冰箱、洗衣机、空调等家电换新给予补贴，让更多绿色、智能产品进入居民家庭。实施消费品以旧换新政策有利于", "opts": {"A": "推动消费持续扩大", "B": "带动优质供给增长", "C": "促进经济社会绿色转型", "D": "增加居民财产性收入"}, "ans": "ABC", "ana": "家电以旧换新补贴降低了居民购买新家电的实际支出，有助于释放更新换代需求，推动消费持续扩大，A 正确。绿色、智能家电需求增加，会引导企业改进产品、扩大优质供给，B 正确。2026 年家电换新补贴支持一级能效或水效产品，有利于推广节能节水家电，减少家庭用能用水，并带动绿色产品供给，促进经济社会绿色转型，C 正确。ABC 正确。", "dis": "D 错误，居民财产性收入主要来自利息、红利、房屋租金等资产收益，家电换新补贴的直接作用是降低居民的购置成本，而不是“增加居民财产性收入”。", "ext": "消费与供给的双向作用（构建新发展格局）【《手 求贯穿各类规划，提高关键基础设施设防标准，体现了从源头降低灾害风险、坚持预防为主，A 正确。切实维护人民群众生命财产安全，体现了总体国家安全观以人民安全为宗旨，B 正确。统筹综合救援、过渡安置和恢复重建，体现了从整体上把握防灾减灾救灾各环节、坚持系统观念，C 正确。把安全要求贯穿国土空间规划和各类建设规划，并纠正重发展轻安全的倾向，体现了发展和安全共同谋划、一体部署、相互促进，D 正确。ABCD 正确。", "dis": "", "ext": "总体国家安全观、发展与安全【《手册》第 108—109 页】 （1）总体国家安全观的固定搭配【详见：第 3 套，第 8 题】 （2）【时政】习近平总书记关于提高防灾减灾救灾能力的讲话 ①推动灾害治理向事前预防转型 ②提升大灾巨灾应对处置能力 ③强化科技支撑和法治保障 ④夯实防灾减灾救灾基层基础。基层是抵御自然灾害的第一线 ⑤认真抓好责任落实 （3）发展和安全： 发展和安全是一体之两翼、驱动之双轮，必须同步推进 ①发展解决的是动力问题，是推动国家和民族赓续绵延的根本支撑 关系 ②发展具有基础性、根本性，是解决安全问题的总钥匙，发展就是最大的安全 ③安全解决的是保障问题，是确保国家和民族行稳致远的坚强柱石 ④安全是发展的条件和保障，没有国家安全，发展只能是“镜花水月”，取得的成果也可能毁于一旦 底线 以新安全格局保障新发展格局。牢牢守住安全发展这条底线是构建新发展格局的重要前提和保障 史纲（10—13 单选；27—29 多选）", "year": 2027}, {"id": "s5-27", "set": 5, "num": 27, "src": "苏一六套卷（五）", "book": "苏一", "sub": "史纲", "type": "multi", "stem": "1936 年 10 月，红四、红二方面军先后同红一方面军会合，标志着三大主力红军的长征胜利结束。习近平在纪念中国工农红军长征胜利 90 周年大会上指出，红军长征“胜利实现北上抗日的战略转移，成功开创了中国革命新局面”。长征的胜利", "opts": {"A": "宣告了国民党反动派消灭中国共产党和红军的图谋彻底失败", "B": "保存和锻炼了革命的骨干力量，使党有了新的落脚点和战略基地", "C": "铸就了伟大的长征精神，极大地促进了党在政治上和思想上的成熟", "D": "为党领导人民开展抗日救亡斗争创造了重要条件"}, "ans": "ABCD", "ana": "①长征宣告了国民党反动派消灭中国共产党和红军的图谋彻底失败，宣告了中国共产党和红军肩负着民族希望胜利实现了北上抗日的战略转移，实现了中国共产党和中国革命事业从挫折走向胜利的伟大转折，为党领导人民开展抗日救亡斗争创造了重要条件。②中央红军到达陕北并同红十五军团会合，中国共产党所领导的革命力量有了新的落脚点和战略基地。长征使革命力量在极端艰难的条件下得到保存和锻炼，为继续开展革命斗争保留了骨干。③长征的胜利，极大地促进了党在政治上和思想上的成熟。中国共产党进一步认识到，只有把马克思主义基本原理同中国革命具体实际结合起来，独立自主解决中国革命的重大问题，才能把革命事业引向胜利。④长征铸就了伟大的长征精神，为中国革命不断从胜利走向胜利提供了强大精神动力。ABCD 正确。", "dis": "", "ext": "长征胜利与长征精神 （1）1936 年 10 月，红四、红二方面军先后同红一方面军会合，三大主力会师，标志着长征胜利结束。【《手册》 第 136—137 页】会师过程【详见：第 4 套，第 12 题】，长征胜利的历史意义【详见：第 2 套，第 28 题】。 （2）长征精神的五层内容。①把全国人民和中华民族的根本利益看得高于一切，坚定革命理想和信念，坚信正义 事业必然胜利。②为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲。③坚持独立自主、实事求是，一切从 实际出发。④顾全大局、严守纪律、紧密团结。⑤紧紧依靠人民群众，同人民群众生死相依、患难与共、艰苦奋 斗。（习近平《在纪念红军长征胜利 80 周年大会上的讲话》）", "year": 2027}, {"id": "s5-28", "set": 5, "num": 28, "src": "苏一六套卷（五）", "book": "苏一", "sub": "史纲", "type": "multi", "stem": "抗日民主根据地是认真贯彻和实现全面抗战路线、争取胜利的坚强阵地。1941 年 5 月，中共中央批准颁布的《陕甘宁边区施政纲领》，全面体现了中国共产党关于根据地建设的基本方针。根据地政治民主、政府廉洁、民族团结、经济发展，同国民党统治区形成鲜明对照。“中国的希望在延安”成为许多民主人士的共同感受 "A": "是国家各项制度和法律法规的总依据", "B": "具体规定了各部门法调整社会关系的全部规则", "C": "规定了国家的根本制度", "D": "具有最高的法律地位、法律权威、法律效力"}, "ans": "ACD", "ana": "宪法是国家的根本法，规定了国家的根本制度。它是国家各项制度和法律法规的总依据，具有最高的法律地位、法律权威、法律效力。ACD 正确。", "dis": "B 错误，宪法为部门法提供根本依据，各部门法在相应领域作出具体规定。", "ext": "维护宪法权威【《手册》第 172 页】 （1）我国宪法的地位：①我国宪法是国家的根本法，是党和人民意志的集中体现；②是国家各项制度和法律法规 的总依据，具有最高的法律地位、法律权威、法律效力；③规定了国家的根本制度；④是实现国家认同、凝聚社 会共识、促进个人发展的基本准则，是维系一个国家、一个民族凝聚力的根本纽带。 （2）我国宪法的基本原则。①党的领导原则；②人民当家作主原则；③尊重和保障人权原则；④社会主义法治原 则；⑤民主集中制原则。 （3）加强宪法实施和监督：①加强宪法实施：坚持依宪执政；坚持依法立法；坚持严格执法。②完善宪法监督： 健全人大工作机制、宪法解释机制、备案审查机制、合宪性审查机制。 国内时政（15 单选；32 多选）", "year": 2027}, {"id": "s5-32", "set": 5, "num": 32, "src": "苏一六套卷（五）", "book": "苏一", "sub": "时政", "type": "multi", "stem": "用中长期规划指导经济社会发展，是我们党治国理政的一种重要方式。2026 年 3 月 12日，《中华人民共和国国家发展规划法》公布施行，对国家发展规划的定位和功能作出明确规定。关于国家发展规划，下列表述正确的有", "opts": {"A": "是社会主义现代化战略在规划期内的阶段性部署和安排", "B": "是规划期内经济社会发展的蓝图和行动纲领", "C": "是其他各级各类规划的总遵循", "D": "是各类经营主体安排生产经营活动的统一计划"}, "ans": "ABC", "ana": "国家发展规划法第四条明确规定，国家发展规划是社会主义现代化战略在规划期内的阶段性部署和安排，是规划期内经济社会发展的蓝图和行动纲领，是其他各级各类规划的总遵循。ABC 正确。", "dis": "D 选项，国家发展规划对经营主体的生产经营活动发挥引导作用，经营主体依法自主安排生产经营活动。", "ext": "2026 年国家发展规划法：国家发展规划的定位 《中华人民共和国国家发展规划法》第四条 ①对现代化战略：社会主义现代化战略在规划期内的阶段性部署和安排。 ②对经济社会发展：规划期内经济社会发展的蓝图和行动纲领。 ③对政府履职：政府履行经济调节、市场监管、社会管理、公共服务、生态环境保护等职能的重要依据。 ④对其他规划：其他各级各类规划的总遵循。国家发展规划阐明国家战略意图、明确政府工作重点、引导规范社 会主体行为。 国际时政（16 单选；33 多选）", "year": 2027}, {"id": "s5-33", "set": 5, "num": 33, "src": "苏一六套卷（五）", "book": "苏一", "sub": "时政", "type": "multi", "stem": "2026 年 9 月 25 日，全球发展倡议 5 周年高级别对话会在纽约联合国总部举行。习近平主席在贺信中指出，发展是人类社会的永恒主题，也是实现人民幸福的关键所在。5 年前在联合国大会上提出全球发展倡议，就是为了", "opts": {"A": "推动国际发展合作", "B": "加强国际人文交流合作", "C": "重振全球发展事业", "D": "助力加快落实联合国 2030 年可持续发展议程"}, "ans": "ACD", "ana": "习近平指出，发展是人类社会的永恒主题，也是实现人民幸福的关键所在。5 年前，我在联合国大会上提出全球发展倡议，就是为了推动国际发展合作，重振全球发展事业，助力加快落实联合国 2030 年可持续发展议程。ACD 正确，B 不符合题意。一、单项选择题：1～16 小题，每小题 1 分，共 16 分。下列每题给出的四个选项中，只有一个选项是最符合题目要求的。", "dis": "", "ext": "全球发展倡议五周年 （1）目的：2021 年在联合国大会提出，2026 年 9 月 25 日在五周年高级别对话会贺信中重申：①推动国际发展合 作，②重振全球发展事业，③助力加快落实联合国 2030 年可持续发展议程。 （2）核心理念与原则（六个坚持）：①坚持发展优先；②坚持以人民为中心③坚持普惠包容；④坚持创新驱动； ⑤坚持人与自然和谐共生；⑥坚持行动导向。 （3）王毅在全球发展倡议 5 周年高级别会议上的致辞中提到：短短 5 年，倡议已经从中国主张转化为国际共识， 从目标对接拓展到丰富实践，赢得国际社会广泛赞誉和积极参与。", "year": 2027}, {"id": "s6-1", "set": 6, "num": 1, "src": "苏一六套卷（六）", "book": "苏一", "sub": "马原", "type": "single", "stem": "丝绸、茶叶、瓷器等历史经典产业积淀着世代相传的生产技艺。我国推动这些产业开展核心技艺记录和工序复原，利用人工智能解析传统工艺原理，改进生产控制和质量追溯，并通过窑炉节能改造、清洁能源替代等方式改善生产条件。这些举措体现的哲学道理是", "opts": {"A": "量变是质变的必要准备", "B": "矛盾的普遍性寓于特殊性之中", "C": "辩证否定是联系和发展的环节", "D": "社会意识具有相对独立性"}, "ans": "C", "ana": "辩证否定是包含肯定的否定，其实质是“扬弃”，即既克服又保留。否定是新旧事物联系的环节，新事物吸收、保留旧事物中的积极因素；否定也是发展的环节，推动事物克服旧的局限而向前发展。记录核心技艺、复原传统工序，体现对已有积极成果的保留；利用人工智能改进生产控制、开展窑炉节能改造等，体现对原有局限的克服和发展。既继承又改造，体现辩证否定是联系和发展的环节。C 正确。", "dis": "A 选项，量变是质变的必要准备，没有量的积累就不会发生质变。材料着重说明继承与改造相结合，没有呈现量的积累达到一定程度引起质变的过程，与题意不相符合。B 选项，矛盾的普遍性寓于特殊性之中，并通过特殊性表现出来，反映的是共性与个性的关系。材料着重说明对传统技艺的保留与改进，没有着重说明共性通过个性表现，与题意不相符合。D 选项，社会意识具有相对独立性，包括历史继承性、不同形式的相互影响以及对社会存在的反作用等。题干主要说明对产业和技艺既继承又改造的实践做法，单以社会意识的相对独立性不能完整说明这些举措之间的关系，与题意不相符合。", "ext": "（1）辩证否定观 【《手册》第 11 页】 ①否定是事物的自我否定，根源在事物内部矛盾。②否定是发展的环节，也是新旧事物联系的环节。③实质是扬 弃，即既克服又保留。只讲照搬或全盘抛弃，都割裂了联系与发展。 （2）量变与质变的辩证关系【详见：第 5 套，第 18 题】", "year": 2027}, {"id": "s6-2", "set": 6, "num": 2, "src": "苏一六套卷（六）", "book": "苏一", "sub": "马原", "type": "single", "stem": "宋濂在《送东阳马生序》中回忆求学经历：“家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。”为解求学之惑，他又“从乡之先达执经叩问”，向前辈学者请教，最终“卒获有所闻”。宋濂的求学经历表明", "opts": {"A": "间接经验是个人获得知识的重要途径", "B": "直接经验是认识世界和改造世界的根本动力", "C": "个人知识的积累主要依靠直接经验的增加", "D": "间接经验只有转化为个人直接经验才具有真理性"}, "ans": "A", "ana": "实践是认识的唯一来源，直接经验和间接经验是个人获得认识的两种途径。直接经验来自亲身实践，间接经验来自对前人、他人认识成果的学习，其最终来源仍然是实践。个人的时间和活动范围有限，不可能事事亲历，大量知识需要通过书本和传授获得。宋濂借书抄录、向前辈学者请教，都是通过学习已有认识成果获得间接经验，说明间接经验是个人获得知识的重要途径。A 正确。", "dis": "B 错误，主观和客观的矛盾是人类认识和实践活动中的基本矛盾，是认识世界和改造世界的根本动力。直接经验是个人亲身实践所获得的认识，属于认识成果，不能代替这一根本动力。C 错误，个人的多数知识来自间接经验，是从书本和传授中获得的。强调实践是认识的来源，并不意味着每个人的知识积累都主要依靠亲身实践，不能混淆认识的来源与个人获得认识的途径。D 错误，认识是否具有真理性取决于是否正确反映客观事物及其规律，检验标准是实践，而不是是否转化为某一个人的直接经验。经过他人实践检验的正确认识，不会因个人尚未亲身经历而失去真理性。", "ext": "认识的来源、途径与检验 认识的来源 实践是认识的唯一来源。【《手册》第 15—16 页】 直接经验来自亲身实践，间接经验通过读书、请教等途径获得。间接经验归根到底也 获得认识的途径 来源于实践。 检验真理的标准 实践是检验真理的唯一标准。【详见：第 1 套，第 18 题】", "year": 2027}, {"id": "s6-3", "set": 6, "num": 3, "src": "苏一六套卷（六）", "book": "苏一", "sub": "马原", "type": "single", "stem": "某资本家投资 100 万元创办企业从事生产，其中固定资本 60 万元，用于购买机器设备等；流动资本 40 万元，用于购买原材料和劳动力等（其中购买劳动力支付了 10 万元）。一轮生产结束后，该企业的总资本达到了 120 万元。那么，该企业的剩余价值率为", "opts": {"A": "20%", "B": "50%", "C": "100%", "D": "200%"}, "ans": "D", "ana": "题干中资本家投资的 100 万元是指全部预付资本，即 c+v=100 万元。其中，只有用于购买劳动力的资本属于可变资本，只有这部分资本能够创造剩余价值，实现价值增殖。购买劳动力的资本是 10 万元，即 v=10 万元。一轮生产之后，总资本达到 120 万元，增加的 20 万元就是资本家剥削到的剩余价值，即 m=20 万元。剩余价值率为剩余价值与可变资本的比值，根据公式：m´=m/v，所以 m´=20/10=200%。D 正确。", "dis": "", "ext": "（1）分清分子与分母【《手册》第 36—38 页】 全部预付资本为 100 万元，其中可变资本为 10 万元。生产后总资本为 120 万元，剩余价值为 20 万元。 ①剩余价值率＝剩余价值÷可变资本＝20÷10＝200%。 ②利润率＝剩余价值÷全部预付资本＝20÷100＝20%。 （2）计算中常用的量【《手册》第 195 页】 公式 字母含义 不变资本 c 资本家购买机器、设备、原材料的钱 可变资本 v 资本家支付给工人的工资 全部预付资本 c+v 全部预付资本＝不变资本＋可变资本。 剩余价值 m 雇佣工人的剩余劳动创造并被资本家无偿占有的价值。 利润 p 利润用 p 表示（在数值上：p=m） 剩余价值率 m´=m/v 剩余价值/可变资本 利润率 p´= m/（c+v） 剩余价值/全部预付资本", "year": 2027}, {"id": "s6-4", "set": 6, "num": 4, "src": "苏一六套卷（六）", "book": "苏一", "sub": "马原", "type": "single", "stem": "在资本主义经济中，一家企业可以用历年积累的剩余价值增设工厂，也可以通过兼并把其他企业的工厂置于自己的控制之下。两种方式都能扩大个别资本的规模。关于这两种方式的表述，正确的有①前一种方式体现了资本积累基础上的资本积聚②资本积聚与资本集中是剩余价值资本化的两种方式③后一种方式通过重新组合现有资本实现资本集中④资本集中使社会资本总额随个别资本规模的扩大而增加", "opts": {"A": "①②", "B": "①③", "C": "②④", "D": "③④"}, "ans": "B", "ana": "资本主义生产的唯一动机和直接目的就是追求剩余价值。为了达到这一目的，资本家便尽可能改进技术，提高劳动生产率，加快资本积累，通过资本积聚和资本集中扩大生产规模。①资本积聚（依靠自身积累）是指个别资本通过剩余价值的资本化来增大资本的总量。资本积累是资本积聚的基础，资本积聚是资本积累的直接结果，资本积累越多，资本积聚的规模就越大，个别资本总额就越大。②资本集中（通过外部实现的快速扩张。比如，与其他资本合并）是指个别资本通过结合而形成较大的资本，只是原有社会资本的重新组合与重新分配，不会增加全社会的资本总量。题干中，企业用历年积累的剩余价值增设工厂，体现了资本积累基础上的资本积聚。企业通过兼并把其他企业的工厂置于自己的控制之下，体现的是资本集中。因此，B 正确。", "dis": "②错误，剩余价值资本化就是资本积累，资本积聚以资本积累为基础；资本集中只是现有资本的重新组合，不属于剩余价值资本化。④错误，资本集中能够迅速扩大个别资本的规模，但不会增加社会资本总额。", "ext": "（1）资本积累、积聚与集中 【《手册》第 39 页】 资本积累就是剩余价值的资本化。积聚和集中都能扩大个别资本规模。 （依靠自身积累）是指个别资本通过剩余价值的资本化来增大资本的总量。 资本积聚 资本积累是资本积聚的基础，资本积聚是资本积累的直接结果 资本积累越多，资本积聚的规模就越大，个别资本总额就越大 （通过外部实现的快速扩张。比如，与其他资本合并）是指个别资本通过结合而形成较大的 资本集中 资本，只是原有社会资本的重新组合与重新分配，不会增加全社会的资本总量 （2）资本积累【《手册》第 39 页】 剩余价值是资本积累的源泉，资本积累是资本主义扩大再生产的源泉。 把剩余价值转化为资本，或者说，剩余价值的资本化。资本积累就是依靠剥削工人所创造 含义 的剩余价值而实现的，没有剩余价值，就不可能有资本积累 资本积累的后果： ①是社会财富占有两极分化的重要原因 后果 ②是资本主义失业现象产生的根源 ③导致资本有机构成提高 ④造成大批工人失业，形成相对过剩人口 （劳动力供给 ＞资本需要） 历史趋势 资本积累的历史趋势是资本主义制度的必然灭亡和社会主义制度的必然胜利 在资本有机构成提高的情况下，由于可变资本的相对量的减少，资本对劳动力的需求相对 直接影响 减少，其结果就是不可避免地造成大批工人失业，形成相对过剩人口 ①含义：劳动力供给超过了资本的需要。相对是由于他们不为资本价值增殖所需要 相对过剩人口 ②经常性的庞大失业人口的存在，是资本主义的痼疾。资产阶级政府通过各种干预措施能 在一定程度上缓解失业，但不可能彻底消灭失业", "year": 2027}, {"id": "s6-5", "set": 6, "num": 5, "src": "苏一六套卷（六）", "book": "苏一", "sub": "毛中特", "type": "single", "stem": "毛泽东在分析中国革命道路时指出：“在资本主义国家，城市在实质上形式上都统制了乡村，城市之头一断，乡村之四肢就不能生存。”但在中国，却可以组织“长期的广大的战争”，逐步发展革命力量，最后夺取城市。造成这种差异的根本原因是", "opts": {"A": "近代中国广大农村具有较好的革命群众基础", "B": "近代中国社会政治经济发展极端不平衡", "C": "中国共产党掌握了相当力量的正式红军", "D": "全国革命形势始终处于不断高涨之中"}, "ans": "B", "ana": "近代中国是多个帝国主义间接统治的经济落后的半殖民地国家，社会政治经济发展极端不平衡，四分五裂，军阀割据，存在不少的统治薄弱环节，为党在农村开展革命斗争、建设革命根据地提供了缝隙和可能。题干比较的是中国与资本主义国家革命道路的差异。中国反动统治存在薄弱环节，使革命力量能够在农村保存、发展并开展长期斗争，其根本原因就在于社会政治经济发展的极端不平衡。B 正确。", "dis": "A 选项，属于农村革命根据地能够存在和发展的群众条件。C 选项，相当力量正式红军的存在，为农村革命根据地的创立、巩固和发展提供了坚强后盾。二者都不是题干所问的根本原因。D 选项，“全国革命形势的继续向前发展”，并非“始终处于不断高涨之中”，且这一条件也不是根本原因。【拓展】①近代中国的广大农村深受多重压迫和剥削，人民革命愿望强烈，经历过大革命的洗礼，革命的群众基础好（条件之一，但不是根本原因）②全国革命形势的继续向前发展，为在农村建设革命根据地提供了客观条件③相当力量正式红军的存在，为农村革命根据地的创立、巩固和发展提供了坚强后盾④党的领导的有力量及其政策的不错误，为农村革命根据地建设和发展提供了重要的主观条件", "ext": "新民主主义革命道路形成的必然性【详见：第 1 套，第 28 题】 ①根本原因：近代中国社会政治经济发展极端不平衡，反动统治存在薄弱环节。 ②其他条件：广大农村有较好的群众基础，全国革命形势继续向前发展，相当力量正式红军的存在提供坚强后 盾，党的有力领导和正确政策提供重要主观条件。【详见：第 2 套，第 11 题】", "year": 2027}, {"id": "s6-6", "set": 6, "num": 6, "src": "苏一六套卷（六）", "book": "苏一", "sub": "毛中特", "type": "single", "stem": "1992 年，邓小平在南方谈话中指出，改革开放迈不开步子，不敢闯，说来说去就是怕资本主义的东西多了，走了资本主义道路。他强调，判断改革和各方面工作的是非得失，应该主要看是否有利于发展社会主义社会的生产力，是否有利于增强社会主义国家的综合国力，是否有利于提高人民的生活水平。邓小平提出这一判断标准，主要是为了", "opts": {"A": "明确社会主义初级阶段是制定路线方针政策的根本依据", "B": "破除抽象谈论姓“社”姓“资”的思维定势，推动改革开放", "C": "揭示社会主义的根本任务是解放和发展社会生产力", "D": "说明共同富裕是中国特色社会主义的根本原则"}, "ans": "B", "ana": "坚持解放思想、实事求是，坚持以“三个有利于”作为检验一切工作是非得失的根本标准，破除了在改革开放进程中离开发展生产力抽象谈论姓“社”姓“资”的思维定势，把我国的改革开放和现代化建设推进到一个新的阶段。题干先指出改革开放“不敢闯”的思想障碍，再提出“三个有利于”标准，说明这一标准是要引导人们从改革的实际效果出发作判断，解除思想束缚，推动改革开放。B 正确。", "dis": "A 选项，回答的是制定路线方针政策要从什么实际出发，未针对题干中“不敢闯”的思想障碍。C 选项，发展生产力是“三个有利于”标准中首要的、最根本的一条，但本题问的是提出整个判断标准的主要目的。D 选项，说明的是共同富裕的地位，不是这一判断标准所要直接解决的问题。", "ext": "（1）1992 年南方谈话 【《手册》第 71 页】 ①是否有利于发展社会主义社会的生产力。②是否有利于增强社会主义国家的综合国力。③是否有利于提高人民 的生活水平。 计划与市场的论述【详见：第 5 套，第 6 题】。 （2）解放思想、实事求是与改革实践【《手册》第 69—70 页】 ①坚持解放思想、实事求是，有力推动和保证了拨乱反正的进行 ②坚持解放思想、实事求是，破除了僵化的社会主义模式观念，坚持走自己的路 ③坚持解放思想、实事求是，一切从社会主义初级阶段的实际出发 ④坚持解放思想、实事求是，坚持以“三个有利于”作为检验一切工作是非得失的根本标准，破除了在改革开放 进程中离开发展生产力抽象谈论姓“社”姓“资”的思维定势，把我国的改革开放和现代化建设推进到一个新的 阶段。", "year": 2027}, {"id": "s6-7", "set": 6, "num": 7, "src": "苏一六套卷（六）", "book": "苏一", "sub": "新思想", "type": "single", "stem": "城市发展进入以存量提质增效为主的阶段，既要补齐设施短板，也要让已有空间更好适应居民生活需要。城市现代化建设的重要抓手是", "opts": {"A": "促进大中小城市和小城镇协调发展", "B": "高质量推进城市更新", "C": "推进农业转移人口市民化", "D": "促进城乡融合发展"}, "ans": "B", "ana": "习近平总书记指出：“高质量推进城市更新是城市现代化建设的重要抓手。”题干强调城市发展转向存量提质增效，补齐设施短板、盘活利用已有空间，体现了通过城市更新完善城市功能、满足居民生活需要。B 正确，ACD 不符合题意。", "dis": "", "ext": "城市工作相关的固定搭配【《手册》第 93 页】 （1）目标：建设创新、宜居、美丽、韧性、文明、智慧的现代化人民城市（助记：建成什么样——有创新、住得 舒心、环境美、扛得住风险、大家守公德、办事更智能） （2）主题：推动城市高质量发展（助记：发展往哪走——让城市发展质量更高） （3）主线：坚持城市内涵式发展（助记：走哪条路——练内功，把已有的空间用好，把欠缺的公共服务补上） （4）重要抓手：推进城市更新（助记：从哪下手——从城市更新下手，比如改造老小区、补齐养老托育设施） （5）底线：城市安全（助记：什么必须守住——城市再发展，房屋、燃气等安全也得守住） （6）出发点和落脚点：实现人民群众对美好生活向往（为了谁——开工前看群众需要什么，建成后看群众生活有 没有变好） （7）阶段变化：我国城镇化正从快速增长期转向稳定发展期，城市发展正从大规模增量扩张阶段转向存量提质增 效为主的阶段（助记：两个转向——城镇化从“快”转“稳”，城市发展从“建得多”转向“把已有的建得更好、 用得更好”）", "year": 2027}, {"id": "s6-8", "set": 6, "num": 8, "src": "苏一六套卷（六）", "book": "苏一", "sub": "新思想", "type": "single", "stem": "中国共产党作为百年大党，如何永葆先进性和纯洁性、永葆青春活力，如何实现长期执政，是必须回答好、解决好的一个根本性问题。在加强党的建设实践中，中国共产党的独特创造是", "opts": {"A": "开展树立和践行正确政绩观学习教育", "B": "严格干部教育培养、选拔任用、管理监督", "C": "找到“让人民来监督政府”和“自我革命”两个跳出治乱兴衰历史周期率的答案", "D": "确立民主集中制这一马克思主义政党的根本组织原则"}, "ans": "C", "ana": "党的二十届五中全会指出，在革命、建设、改革中先后把党的建设作为伟大工程、新的伟大工程，党的十八大以来深入推进新时代党的建设新的伟大工程，找到“让人民来监督政府”和“自我革命”两个跳出治乱兴衰历史周期率的答案，这是中国共产党的独特创造，永载马克思主义政党建设史册。C 正确，ABD 不符合题意。", "dis": "A 选项是一项具体学习教育，B 选项涉及干部队伍建设，D 选项涉及党的根本组织原则。题干考查的是党为跳出治乱兴衰历史周期率作出的独特创造，ABD 均不符合题意。", "ext": "人民监督与自我革命【《手册》第 116 页】 （1）第一个答案：让人民来监督政府（助记：通过人民监督促使政府改进工作） （2）第二个答案：自我革命（助记：党主动发现和解决自身存在的问题） ①勇于自我革命，是中国共产党区别于其他政党的显著标志，也是我们党最大的优势、最鲜明的品格 ②实现伟大自我革命的重要途径：自我净化、自我完善、自我革新、自我提高 党的二十届五中全会内容（关于持之以恒推进全面从严治党的固定搭配）【详见：第 1 套，第 15 题】。", "year": 2027}, {"id": "s6-9", "set": 6, "num": 9, "src": "苏一六套卷（六）", "book": "苏一", "sub": "新思想", "type": "single", "stem": "面对世界经济复苏乏力、外部需求波动加剧等挑战，我国必须充分挖掘超大规模市场潜力，增强经济发展的内生动力，以国内循环的稳定性对冲国际循环的不确定性。加快构建新发展格局，必须坚持的战略基点是", "opts": {"A": "扩大内需", "B": "深化供给侧结构性改革", "C": "畅通国民经济循环", "D": "实现高水平的自立自强"}, "ans": "A", "ana": "习近平总书记指出，做强国内大循环，要“坚持扩大内需这个战略基点”。题干强调在外部需求波动加剧的情况下，充分挖掘国内市场潜力，增强经济发展的内生动力。扩大内需有利于使生产、分配、流通、消费各环节更多依托国内市场实现良性循环。A 正确。", "dis": "B 选项，深化供给侧结构性改革是推动高质量发展的主线、大力推动构建新发展格局的主线。C 选项，经济循环的畅通无阻是构建新发展格局的关键。D 选项，实现高水平的自立自强是构建新发展格局最本质的特征。题干考查的是加快构建新发展格局的战略基点，BCD 均不符合题意。", "ext": "构建新发展格局的四组搭配【《手册》第 91 页】 设问 对应判断 战略基点 扩大内需 主线 深化供给侧结构性改革 关键 经济循环畅通无阻 最本质的特征 实现高水平的自立自强 国内大循环为主体、国内国际双循环相互促进。全国统一大市场的基本要求【详见：第 2 套，第 7 题】；扩大内需与新 发展格局【详见：第 3 套，第 25 题】。", "year": 2027}, {"id": "s6-10", "set": 6, "num": 10, "src": "苏一六套卷（六）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "维新派虽然突破洋务派“中体西用”思想的局限，主张用君主立宪制取代君主专制制度，但未能成功地建立起资本主义的君主立宪制度。戊戌维新运动的失败，主要是由于维新派自身的局限以及以慈禧太后为首的强大的守旧势力的反对。维新派在思想上“虽然提倡学习西学，却仍要打着孔子的旗号，借古代圣贤之名‘托古改制’”。这种既提倡学习西学，又借助传统权威推行变法的做法，反映了维新派的局限性是", "opts": {"A": "没有建立严密的组织", "B": "不敢否定封建主义", "C": "对帝国主义抱有幻想", "D": "惧怕人民群众"}, "ans": "B", "ana": "维新派本身的局限性突出地表现在三个方面：不敢否定封建主义、对帝国主义抱有幻想、惧怕人民群众。维新派不敢否定封建主义表现在：他们在政治上，不敢根本否定封建君主制度，只是幻想依靠光绪皇帝“以君权雷厉风行”，通过和平、合法的手段，实现自上而下的改良，让资产阶级和开明士绅的代表参加政权，逐步实现君主立宪。在经济上，他们虽然要求发展民族资本主义，却未触及封建主义的经济基础——封建土地所有制。在思想上，他们虽然提倡学习西学，却仍要打着孔子的旗号，借古代圣贤之名“托古改制”。题干材料是维新派在思想上不敢否定封建主义的表现。B 正确。", "dis": "", "ext": "（1）维新派的局限性 【《手册》第 123 页】 三个角度分别记：①对封建主义，不敢否定封建主义；②对外，对帝国主义抱有幻想；③对内，惧怕人民群众。 材料如果写借皇权推变法、借孔子讲改制，重点看第一层。 （2）维新派不敢否定封建主义的表现： ①政治上，不敢根本否定封建君主制度，幻想依靠光绪皇帝逐步实现君主立宪 ②经济上，未触及封建主义的经济基础，即封建土地所有制 ③思想上，虽然提倡学习西学，却仍打着孔子的旗号（说明没有彻底否定中学） （3）维新派与守旧派的论战 主张 兴民权、设议院、实行君主立宪 （1）论战内容： ①要不要变法 ②要不要兴民权、设议院，实行君主立宪 维新派与守 ③要不要废八股、改科举和兴西学 旧派的论战 （2）意义：这场论战实质上是资产阶级思想与封建主义思想在中国的第一次正面交锋 ①进一步开阔了新型知识分子的眼界，解放了人们长期受到束缚的思想 ②西方资产阶级社会政治学说在中国得到进一步的传播，戊戌变法运动的帷幕随之拉开", "year": 2027}, {"id": "s6-11", "set": 6, "num": 11, "src": "苏一六套卷（六）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "1919 年，李大钊在《再论问题与主义》中指出：“一个社会主义者，为使他的主义在世界上发生一些影响，必须要研究怎么可以把他的理想尽量应用于环绕着他的实境。”他还强调，社会问题“必须有一个根本解决，才有把一个一个的具体问题都解决了的希望”。这些认识表明，中国早期马克思主义者①注意从中国的实际出发学习、运用马克思主义②主张以解决一个一个的具体问题代替社会的根本改造③已在实际上初步形成马克思主义应当与中国具体实际相结合的思想④明确提出马克思主义与中国实际相结合的命题", "opts": {"A": "①②", "B": "①③", "C": "②③", "D": "③④"}, "ans": "B", "ana": "李大钊既肯定马克思主义具有普遍意义，又强调马克思主义是一定时代和社会环境的产物，不能脱离中国的具体环境机械照搬。这表明，中国早期马克思主义者在学习和传播马克思主义的过程中，已经注意从中国实际出发，学习和运用马克思主义理论，实际上初步形成了马克思主义应当与中国具体实际相结合的思想。题干中“把他的理想尽量应用于环绕着他的实境”，强调把理论运用于具体环境，对应①。主张社会问题必须有“根本解决”，并注意把社会主义理想与中国实际相联系，说明当时已初步形成马克思主义应当与中国具体实际相结合的思想，对应③。因此 B 正确。", "dis": "对于②，题干强调只有从根本上改造社会，才有解决一个个具体问题的希望，并不是用具体问题的解决代替社会的根本改造，该项颠倒了二者的关系。对于④，早期马克思主义者只是初步形成了结合实际的思想倾向，并未明确提出这一完整命题。1938 年，毛泽东在党的六届六中全会上，才明确提出“马克思主义的中国化”这个命题。", "ext": "从早期认识到科学命题 ①1919 年，李大钊在《再论问题与主义》中强调把理想应用于实际，社会问题需要根本解决。 ②1938 年，毛泽东在六届六中全会上正式提出马克思主义中国化的命题。【《手册》第 53 页】 李大钊传播马克思主义的主要文章【详见：第 3 套，第 27 题】。", "year": 2027}, {"id": "s6-12", "set": 6, "num": 12, "src": "苏一六套卷（六）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "遵义会议以后，党的路线已走上马克思主义的正确轨道，但对曾经给党的事业造成严重危害的主观主义、教条主义，还没有来得及从思想上进行认真清理。为提高广大党员的思想理论水平，中国共产党开展了延安整风运动。这场运动最主要的任务是", "opts": {"A": "反对宗派主义以整顿党风", "B": "反对主观主义以整顿学风", "C": "反对党八股以整顿文风", "D": "反对官僚主义以整顿作风"}, "ans": "B", "ana": "毛泽东指出，所谓学风，不只是学校的学风，而且是领导机关、全体干部、全体党员的思想方法问题，是对待马克思列宁主义的态度问题，是全党同志的工作态度问题。延安整风运动以反对主观主义整顿学风为最主要的任务。克服主观主义，必须发扬理论联系实际的马克思主义学风，坚持一切从实际出发、实事求是。B 正确。", "dis": "AC 选项，反对宗派主义以整顿党风，反对党八股以整顿文风，也是整风运动的内容，但不是最主要的任务。D 选项，反对官僚主义不是延安整风的内容，这是新中国成立后党内整风的内容。", "ext": "延安整风的三项任务【《手册》第 142 页】 学风 反对主观主义以整顿学风。反对主观主义是最主要的任务。 党风 反对宗派主义以整顿党风。 文风 反对党八股以整顿文风。整风过程及胜利结束的标志【详见：第 2 套，第 12 题】。", "year": 2027}, {"id": "s6-13", "set": 6, "num": 13, "src": "苏一六套卷（六）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "1956 年社会主义改造基本完成。随着中国建立了社会主义基本政治制度，社会主义基本经济制度也建立起来。社会主义基本制度的确立，标志着", "opts": {"A": "我国开始进入全面建设社会主义的历史阶段", "B": "半殖民地半封建社会的结束", "C": "马克思主义同中国实际“第二次结合”的完成", "D": "中国实现了由农业国向工业国的转变"}, "ans": "A", "ana": "1956 年，生产资料所有制的社会主义改造基本完成，社会主义基本制度在中国确立，我国开始进入全面建设社会主义的历史阶段。A 正确。", "dis": "B 选项，1949 年中华人民共和国的成立，标志着半殖民地半封建社会的结束。C 选项，马克思主义同中国实际“第二次结合”是 1956 年提出的探索任务，是探索的开端而非完成。D 选项，“一五”计划的实施（从 1953 年开始）为我国工业化奠定了初步基础，但 1956 年远未实现由农业国向工业国的转变，工业化是需要长期推进的历史任务。【拓展】（1）1949 年，中华人民共和国的成立：①标志着半殖民地半封建社会的结束，新民主主义革命取得基本胜利②标志着中国进入新民主主义社会，开始进行社会主义革命③标志着中国共产党的地位发生了根本性的变化（2）1956 年，社会主义基本制度的确立：标志着中国进入了社会主义社会", "ext": "（1）三个制度节点 ①1949 年，新中国成立，中国进入新民主主义社会。 ②1954 年，一届全国人大一次会议通过新中国第一部宪法。【《手册》第 148 页】 ③1956 年，社会主义改造基本完成，社会主义基本制度确立。【《手册》第 152 页】 （2）重要标志 ①标志着半殖民地半封建社会的结束，新民主主义革命取得基本胜利 1949 年，中华人民共和国的成立 ②标志着中国进入新民主主义社会，开始进行社会主义革命 ③标志着中国共产党的地位发生了根本性的变化 1956 年，社会主义改造基本完成 标志着社会主义基本制度在中国确立 ①标志着中国进入了社会主义社会/社会主义初级阶段 1956 年，社会主义基本制度的确立 ②标志着进入开始全面建设社会主义的历史阶段 ③标志着我国完成了从新民主主义向社会主义的过渡 （3）重大意义 ①是中国历史上最深刻最伟大的社会变革 ②为当代中国一切发展进步奠定了制度基础 ③为中国特色社会主义制度的创新和发展提供了重要前提 ④极大地提高了工人阶级和广大劳动人民的积极性、创造性，极大地促进了我国社会生产 1956 年，社会 力的发展，初步显示了社会主义的优越性 主义基本制度的 ⑤使广大劳动人民真正成为国家的主人，这是中国几千年来阶级关系的最根本变革 确立 ⑥实现了中华民族由近代不断衰落到根本扭转命运、持续走向繁荣富强的伟大飞跃 ⑦使占世界人口 1/4 的东方大国进入了社会主义社会，这是世界社会主义发展史上又一个 历史性的伟大胜利 ⑧再次证明了马克思列宁主义的真理性，丰富和发展了科学社会主义理论 （4 个彻底、2 个实现） ①彻底结束了旧中国半殖民地半封建社会的历史 ②彻底结束了极少数剥削者统治广大劳动人民的历史 1949 年，新民 ③彻底结束了旧中国一盘散沙的局面 主主义革命的胜 ④彻底废除了列强强加给中国的不平等条约和帝国主义在中国的一切特权 利，中华人民共 ⑤实现了中国从几千年封建专制政治向人民民主的伟大飞跃 和国的成立 ⑥实现了中国高度统一和各民族空前团结 ⑦中国人从此站立起来了，中华民族发展进步从此开启了新纪元 ⑧中国人民从此成为国家、社会和自己命运的主人 ⑨是具有世界意义的大胜利，是马克思列宁主义在中国的胜利，是毛泽东思想的胜利", "year": 2027}, {"id": "s6-14", "set": 6, "num": 14, "src": "苏一六套卷（六）", "book": "苏一", "sub": "思法", "type": "single", "stem": "我国民法典规定，以非法拘禁等方式剥夺、限制他人的行动自由，受害人有权依法请求行为人承担民事责任。上述规定所保护的是自然人的", "opts": {"A": "生命权", "B": "健康权", "C": "人身自由权", "D": "人格尊严权"}, "ans": "C", "ana": "人身自由权包括人的行动自由不受非法限制和剥夺。材料中的“非法拘禁”“限制行动自由”直接指向人身自由权。C 正确。", "dis": "A 选项，生命权侧重对生命安全的保护；B 选项，健康权侧重对身心健康的保护；D 选项，人格尊严权侧重对人格尊严的保护。ABD 均 应和平、发展、合作、共赢的时代潮流，推动中俄关系实现更高质量发展： ①筑牢更高质量政治互信，坚定彼此战略支持。 ②赋能更高质量互利合作，携手推进各自发展振兴。 ③推进更高质量民心相通，厚植两国世代友好根基。今明两年举办两国第十个国家级主题年——“中俄教育年”。 ④开展更高质量国际协作，改革完善全球治理。 （4）中国同俄罗斯的关系：2019 年提升为中俄新时代全面战略协作伙伴关系。", "year": 2027}, {"id": "s6-17", "set": 6, "num": 17, "src": "苏一六套卷（六）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "魏格纳根据大陆轮廓、古生物分布等证据提出大陆漂移学说，却未能充分解释大陆为何能够移动。后来，海底探测发现的大洋中脊、海底磁性条带等现象，为海底扩张和板块构造理论提供了证据。通过对这些资料的比较研究，人们认识到，大陆随其所在板块运动，海洋底部也处于不断生成和消减的过程中。这一过程表明，人们对地壳运动的认识", "opts": {"A": "随着观测手段的改进而获得进一步发展的条件", "B": "随着运动机制得到充分解释才开始具有真理性", "C": "通过对感性材料的思维加工深化对运动机制的理解", "D": "随着实践的发展而不断得到检验和修正"}, "ans": "ACD", "ana": "实践的发展为认识提供手段和条件，工具的改进能够扩展人的认识能力。海底探测发现大洋中脊、海底磁性条带等，为进一步认识地壳运动提供了新的资料和条件，A 正确。感性认识有待于发展和深化为理性认识，这一飞跃需要对感性材料进行思考和加工。人们比较研究观测资料，进一步解释大陆随板块运动以及洋底生成、消减的机制，说明通过思维加工能够深化对事物内部联系和规律的认识，C 正确。实践是检验认识真理性的唯一标准，认识在实践、认识、再实践、再认识的过程中不断发展。后续探测和研究既检验了已有认识，也促使人们修正其局限、完善理论解释，D 正确。", "dis": "B 错误，真理是对客观事物及其规律的正确反映，任何具体的真理性认识都具有一定的条件和限度。未能充分解释大陆运动机制，说明当时的认识尚不完善，并不意味着其中关于大陆能够移动的正确认识没有真理性。不能把认识的深化和完善，当作此前认识“才开始”具有真理性的条件。", "ext": "实践与认识的发展【《手册》第 17 页】 ①观测手段进步，提供新的感性材料。 ②对材料进行思维加工，深化对运动机制的认识。认识的两次飞跃【详见：第 4 套，第 18 题】。 ③实践发展使已有认识得到检验和修正。实践检验标准的确定性与不确定性【详见：第 1 套，第 18 题】。", "year": 2027}, {"id": "s6-18", "set": 6, "num": 18, "src": "苏一六套卷（六）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "秸秆含有多种作物所需养分，可以还田培肥，也可以加工成饲料或用作燃料。选择利用方式，需要了解秸秆的属性，并结合当地的生产生活需要：种植地区可以还田培肥，畜牧业发达地区可以加工成饲料，有供热需求的地方可以利用秸秆供暖、烘干粮食。这些做法表明", "opts": {"A": "客体的价值随着主体对其评价的改变而改变", "B": "同一客体可以在满足主体不同需要时呈现多维价值", "C": "价值评价以客观事物自身的属性为认识对象", "D": "客体的潜在价值能够通过实践转化为现实价值"}, "ans": "BD", "ana": "价值是反映主体和客体之间意义关系的哲学范畴，具有多维性。同一客体相对于主体的不同需要，可以产生不同的价值。秸秆用于还田培肥、加工饲料或供热，分别满足不同的生产生活需要，说明同一客体可以呈现多维价值，B 正确。价值关系的形成依赖于主体的创造，客体的潜在价值需要通过实践转化为现实价值。秸秆虽具有相应属性，但要实际满足培肥、饲养或供热需要，还须经过还田、加工、利用等实践活动，说明实践能够实现潜在价值向现实价值的转化，D 正确。", "dis": "A 错误，价值是一种客观存在，独立于人们对它的认识和评价。评价能够反映价值，也可能错误地反映价值，但不能仅凭评价改变客体的实际价值。秸秆利用价值的实现依赖其属性、主体需要以及实际利用活动，并非评价一改变，价值就随之改变。C 错误，价值评价以主客体之间的价值关系为认识对象，评价客体对于主体需要的意义，而不是只认识客观事物自身的属性。了解秸秆属性是评价的必要依据，还必须联系当地的实际需要，才能判断何种用途具有相应价值。", "ext": "（1）价值的特性与价值评价【详见：第 2 套，第 18 题】 （2）价值的多维性与实现【《手册》第 20—21 页】 ①价值以客体属性和主体需要为条件。 ②同一客体的不同属性可以满足多种需要，表现为价值的多维性。 ③主体通过实践把潜在价值转化为现实价值，再对实际价值作出评价。注意，事物的价值不会自动实现/自然显露。 价值要从潜在价值转化为现实价值，必须通过人的实践活动，不能自动实现。 （3）知识性认识与价值评价的认 【《手册》第 21 页】", "year": 2027}, {"id": "s6-19", "set": 6, "num": 19, "src": "苏一六套卷（六）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "针对俄国经济文化落后、不具备实行社会主义条件的论调，列宁在《论我国革命》中指出：“我们为什么不能首先用革命手段取得达到这个一定水平的前提，然后在工农政权和苏维埃制度的基础上赶上别国人民呢？”他强调，俄国特殊历史条件下发展顺序的变化，并不改变世界历史发展的总的路线。这表明", "opts": {"A": "社会形态更替的统一性不意味着各国发展道路完全相同", "B": "对社会历史发展道路的考察应当坚持具体问题具体分析", "C": "历史主体对发展道路的选择以一定社会历史条件为基础", "D": "历史发展道路的差异源于各民族对社会形态的自由选择"}, "ans": "ABC", "ana": "社会形态更替具有统一性和多样性。统一性表现为社会历史发展的一般过程和规律，多样性表现为各国具体道路、顺序和形式的差异。俄国在特殊条件下采取不同的发展顺序，并不改变世界历史发展的总的路线，说明统一性不意味着各国发展道路完全相同，A 正确。矛盾的特殊性要求坚持具体问题具体分析。判断俄国能否采取相应革命道路，应当考察俄国自身的具体历史条件，而不能机械套用其他国家的顺序，B 正确。社会发展的必然性为人们的历史选择提供基础、范围和可能性空间，历史选择不能脱离一定的社会历史条件。列宁的论述把俄国特殊条件同革命后创造发展条件联系起来，体现了历史主体选择以客观条件为基础，C 正确。", "dis": "D 错误，社会历史发展具有客观规律，人们对发展道路的选择受到一定社会历史条件的制约。各国道路的差异体现了社会发展必然性与人们历史选择性的统一，不能归结为各民族脱离客观条件、任意选择社会形态。承认历史选择性，不等于承认不受规律和条件约束的自由选择。", "ext": "（1）社会形态更替的特点：【《手册》第 26 页】 ①统一性与多样性。人类社会发展具有一般规律，不同国家和民族的发展道路、进程和具体形式各具特点。 ②必然性（客观规律性）+ 人们的历史选择性（主观能动性，历史主体可以选择具体道路，选择受生产力水平、 历史传统等客观条件制约） （2）社会主义道路多样性的原因 【详见：第 2 套，第 4 题】。", "year": 2027}, {"id": "s6-20", "set": 6, "num": 20, "src": "苏一六套卷（六）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "在资本主义经济中，危机爆发后，生产下降，供求矛盾得到暂时缓和。随着经济复苏和高涨，危机又会发生。关于资本主义经济危机的周期性，下列说法正确的有", "opts": {"A": "造成相对过剩的制度原因是生产资料的资本主义私有制", "B": "经济危机的周期性是由社会资本再生产的周期性特点决定的", "C": "从一次危机开始到另一次危机爆发构成一个再生产周期", "D": "复苏阶段是资本主义再生产周期的基本阶段"}, "ans": "AC", "ana": "①资本主义经济危机的本质特征是生产相对过剩。造成这种相对过剩的制度原因，是生产资料的资本主义私有制，其根本原因是生产社会化和生产资料资本主义私人占有之间的基本矛盾。②资本主义经济危机具有周期性，这是由资本主义基本矛盾运动的阶段性决定的。资本主义基本矛盾有时趋于缓和，有时趋于激化；当矛盾尖锐化时，经济危机就会爆发。危机过后，生产下降、供求矛盾暂时缓和，但资本主义基本矛盾并未消除，随着经济恢复和发展，危机又会重新爆发。从一次危机开始到另一次危机爆发，构成资本主义再生产的一个周期。只要存在资本主义制度，经济危机就是不可避免的。AC 正确。", "dis": "B 错误，资本主义基本矛盾运动的阶段性决定了资本主义经济危机具有周期性。资本主义经济危机周期性爆发的特点，使社会资本再生产也呈现出周期性的特点。D 错误，资本主义再生产周期一般包括危机、萧条、复苏和高涨四个阶段，其中危机阶段是周期的基本阶段和必经阶段。【拓展】关于逻辑：A（资本主义基本矛盾运动的阶段性）→决定了 B（资本主义经济危机具有周期性）→决定了 C（社会资本再生产也呈现出周期性的特点）【图示】", "ext": "（1）经济危机的根源与周期 【《手册》第 43 页】 根源是资本主义的基本矛盾，即生产社会化与生产资料资本主义私人占有之间的矛盾 生产相对过剩是资本主义经济危机的本质特征 本质特征 生产过剩是相对于劳动人民有支付能力的需求而言的 ①经济危机的抽象的一般的可能性：首先是由货币作为流通手段和支付手段引起的 ②资本主义经济危机爆发的根本原因：资本主义的基本矛盾。这一基本矛盾表现在： 原因 第一，生产无限扩大的趋势与劳动人民有支付能力的需求相对缩小的矛盾 第二，单个企业内部生产的有组织性和整个社会生产的无政府状态之间的矛盾 ①资本主义经济危机具有周期性，这是由资本主义基本矛盾运动的阶段性决定的 ②经济危机周期性爆发的特点，使社会资本再生产也呈现出周期性特点 特点 ③社会资本再生产包括四个阶段：危机、萧条、复苏、高涨 （其中，危机是必经阶段和基本阶段） ①经济危机只能得到暂时缓解，而资本主义基本矛盾无法根除 结论 ②只要存在资本主义制度，经济危机就是不可避免的 ③经济危机实际上是资本主义条件下以强制的方式解决社会再生产的实现问题的途径 （2）周期性的因果关系：资本主义基本矛盾运动的阶段性决定经济危机的周期性，经济危机的周期性使社会资本 再生产呈现周期性。 一个周期通常经历危机、萧条、复苏、高涨四个阶段，其中危机是基本阶段。经济危机的新特点【详见：第 4 套，第 21 题】。", "year": 2027}, {"id": "s6-21", "set": 6, "num": 21, "src": "苏一六套卷（六）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "垄断资本在国内建立垄断统治后，并不满足于已有的市场和投资领域，而是通过跨国公司开展国际性的生产、销售和金融活动，将其势力扩展到国外。推动垄断资本向世界范围扩展的主要经济动因有", "opts": {"A": "将国内过剩资本输出以谋求高额利润", "B": "争夺商品销售市场", "C": "确保原材料和能源的可靠来源", "D": "实现充分就业和国际收支平衡"}, "ans": "ABC", "ana": "垄断资本在国内建立了垄断统治后，必然要把其统治势力扩展到国外，建立国际垄断统治。垄断资本向世界范围扩展的主要经济动因是：首先，将国内过剩的资本输出，以便在国外谋求高额利润；其次，将部分非要害的技术转移到国外，以取得在别国的垄断优势，攫取高额垄断利润；再次，争夺商品销售市场；最后，确保原材料和能源的可靠来源。这些经济上的动因与垄断资本主义在政治上、文化上、外交上的利益紧密联系在一起，交织发挥作用，共同促进了垄断资本向世界范围的扩展。ABC 正确。", "dis": "D 选项，实现充分就业、维持国际收支平衡，是主权国家政府宏观调控的政策目标，并非垄断资本对外扩张的经济动因。垄断资本的对外扩张以追逐利润为核心，不以社会就业、国家收支平衡为目标。【拓展】垄断资本向世界范围扩展的基本形式有三种：第一种是借贷资本输出，即由资本主义国家的政府、银行、企业把资本贷给其他国家的政府、银行、企业。第二种是生产资本输出，即在国外直接投资，独立创办企业，与国外资本合营，或者收购国外已有的企业等。第三种是商品资本输出，即把商品卖到世界各地，不断扩大市场，获取高额利润。", "ext": "垄断资本向世界范围扩展 【《手册》第 46 页】 （1）四个经济动因：资本投向哪里、哪些技术外移、商品卖到哪里、原料从哪里来。 ①将国内过剩的资本输出，以便在国外谋求高额利润 ②将部分非要害的技术转移到国外，以取得在别国的垄断优势，攫取高额垄断利润 ③争夺商品销售市场 ④确保原材料和能源的可靠来源 （2）扩展的三种基本形式：借贷资本输出、生产资本输出、商品资本输出 （3）实现形式：垄断资本向世界范围的扩展是通过跨国公司这一国际垄断组织实现的。跨国公司在国际范围组织 生产经营，能把投资、供销、金融活动联系起来。 毛中特（5—6 单选；22 多选）", "year": 2027}, {"id": "s6-22", "set": 6, "num": 22, "src": "苏一六套卷（六）", "book": "苏一", "sub": "毛中特", "type": "multi", "stem": "以邓小平同志为主要代表的中国共产党人，实现伟大历史转折，吹响改革开放号角，开辟中国特色社会主义道路，创立邓小平理论。邓小平理论", "opts": {"A": "和马克思主义理论一脉相承", "B": "其精髓是解放思想、实事求是", "C": "深刻回答了什么是社会主义、怎样建设社会主义这一根本问题", "D": "首次提出马克思主义同中国实际进行“第二次结合”的任务"}, "ans": "ABC", "ana": "①邓小平理论是马克思列宁主义基本原理同当代中国实际和时代特征相结合的产物，是对马克思列宁主义、毛泽东思想的继承和发展，是全党全国人民集体智慧的结晶。因此，邓小平理论和马克思列宁主义、毛泽东思想一脉相承。②解放思想、实事求是是邓小平理论的精髓。③邓小平理论坚持马克思列宁主义、毛泽东思想的基本原理，坚持辩证唯物主义和历史唯物主义的立场观点方法，坚持马克思主义的思想路线，围绕什么是社会主义、怎样建设社会主义的问题，系统回答了在中国这样经济文化比较落后的东方大国建设、巩固和发展社会主义的一系列基本问题，用一系列独创性的思想、观点，继承、丰富和发展了马克思列宁主义、毛泽东思想。ABC 正确。", "dis": "D 选项，1956 年，毛泽东提出马克思主义同中国实际进行“第二次结合”的任务，不是邓小平理论首次提出的。", "ext": "（1）理论主题、精髓与确立 【《手册》第 69 页】 ①根本问题：什么是社会主义、怎样建设社会主义。 ②精髓：解放思想、实事求是。 ③1992 年南方谈话推进理论成熟； ④1997 年十五大把邓小平理论确立为党的指导思想。 （2）邓小平理论： ①是马克思列宁主义、毛泽东思想的继承和发展（即一脉相承） ②是中国特色社会主义理论体系的开篇之作 ③是改革开放和社会主义现代化建设的科学指南 ④深刻回答了什么是社会主义、怎样建设社会主义这一根本问题 （3）社会主义本质的完整概括 【详见：第 2 套，第 6 题】。 （4）两次结合 ①第一次结合：马克思主义与中国新民主主义革命结合，形成了毛泽东思想（已完成） ②第二次结合：马克思主义与中国的社会主义建设结合，探索中国社会主义建设道路（提出但未完成） 新思想（7—9 单选；23—26 多选）", "year": 2027}, {"id": "s6-23", "set": 6, "num": 23, "src": "苏一六套卷（六）", "book": "苏一", "sub": "新思想", "type": "multi", "stem": "随着人口流动和学龄人口结构变化，不同地区、不同学段的教育需求出现差异。“十五五”规划纲要提出，加强校长、教师区域内统筹调配、交流轮岗，有序推进小班化教学，办好必要的乡村小规模学校。这些安排既回应人口变化，也兼顾不同地区儿童的入学需要，有利于", "opts": {"A": "推进义务教育优质均衡发展", "B": "为每个孩子平等接受教育创造条件", "C": "发挥高等教育在建设教育强国中的龙头作用", "D": "让教育改革发展成果更多更公平惠及全体人民"}, "ans": "ABD", "ana": "“十五五”规划纲要把教师统筹调配、交流轮岗和办好乡村小规模学校纳入相关部署，有利于优化教育资源配置、缩小校际差距，推进义务教育优质均衡发展，A 正确。根据人口变化调配教育资源、保留必要的乡村学校，有利于兼顾不同地区儿童的入学需要，为每个孩子平等接受教育创造条件，B 正确。城乡儿童都能更便利地获得优质教育资源，有利于让教育改革发展成果更多更公平惠及全体人民，D 正确。ABD 正确。", "dis": "C 选项，属于高等教育的定位表述，但题干是围绕推进义务教育优质均衡发展展开的，并未涉及发挥高等教育的龙头作用，不符合题意。", "ext": "教育强国建设相关固定搭配【《手册》第 94—95 页】 （1）基点在基础教育（义务教育优质均衡既看儿童能否就近入学，也看不同学校能否提供优质教育。轮岗主要改 善师资配置，保留必要的乡村小规模学校主要回应入学需要） （2）龙头是高等教育（高等教育承担高层次人才培养和科研创新任务） （3）教育的根本任务：立德树人。 （4）人民满意是发展教育的根本尺度。 （5）建设高质量教育体系，办好人民满意的教育，根本在于深化教育综合改革 （6）建设教育强国，必须牢牢把握教育的政治属性（首位属性）、人民属性、战略属性 （7）建设教育强国的主要目标：到 2027 年，教育强国建设取得重要阶段性成效；到 2035 年，建成教育强国 （8）【时政】基础教育工作的要求： ①落实健康第一教育理念 ②牢牢守住教育公平底线 ③推动学校、家庭、社会同向发力", "year": 2027}, {"id": "s6-24", "set": 6, "num": 24, "src": "苏一六套卷（六）", "book": "苏一", "sub": "新思想", "type": "multi", "stem": "健康中国建设关系人民生活质量和国家长远发展。习近平总书记强调，“要把保障人民健康融入各项政策”。从规划制定、政策设计到项目论证、工程建设，都要考虑对人民健康的影响。我国坚定实施健康优先发展战略，主要是因为", "opts": {"A": "人民健康是推动经济社会发展的根本力量", "B": "卫生与健康事业具有全局性、基础性作用", "C": "人民健康是民族昌盛和国家富强的重要标志", "D": "人民健康是促进人的全面发展的必然要求"}, "ans": "BCD", "ana": "题干把健康影响纳入规划制定、政策设计和工程建设，体现了卫生与健康事业具有全局性、基础性作用，B 正确。人民健康关系国家长远发展，是民族昌盛和国家富强的重要标志，C 正确。健康关系人的身心发展与生活质量，人民健康是促进人的全面发展的必然要求，D 正确。BCD 正确。", "dis": "A 错误，生产力是人类利用自然、改造自然的能力，是推动经济社会发展的根本力量。", "ext": "健康中国建设【《手册》第 104 页】 （1）人民健康是社会文明进步的基础，是民族昌盛和国家富强的重要标志，是促进人的全面发展的必然要求 （2）人民健康是社会主义现代化的重要标志 （3）卫生健康事业在经济社会发展中处于基础性地位，拥有健康的人民意味着拥有更强大的综合国力和可持续发 展能力 （4）【时政】2026 年全国卫生与健康大会 ①人民健康是民族昌盛和国家强盛的重要标志 ②推动建成世界上规模最大的医疗服务体系、传统医药体系、疾病防控体系、医疗保障体系，卫生与健康事业取 得历史性成就、实现全方位进步 ③我们要建成的健康中国，是均衡普惠、优质高效的健康中国，应当具有强大的健康管理能力、疾病防控能力、 医疗服务能力、医保支撑能力、医药创新能力、人才培养能力（六种能力） ④卫生与健康事业具有全局性、基础性作用，必须坚定实施健康优先发展战略 ⑤预防是最经济最有效的健康策略 ⑥全面提高医疗服务水平是建成健康中国的一项重点任务 ⑦改革是卫生与健康事业发展的强大动力，要坚持把推进医疗、医保、医药协同发展和治理作为医药卫生体制改 革的主攻方向", "year": 2027}, {"id": "s6-25", "set": 6, "num": 25, "src": "苏一六套卷（六）", "book": "苏一", "sub": "新思想", "type": "multi", "stem": "江河湖泊是自然生态系统的重要组成部分，也是经济社会发展的重要依托。我国深入推进长江、黄河等大江大河和重要湖泊保护治理，以流域为单元，统筹江河源头至河口、水域和陆域的全域保护，推进山水林田湖草沙一体化保护和系统治理。加强江河保护治理，有利于", "opts": {"A": "筑牢国家生态安全基础", "B": "维护生物多样性和生态系统稳定性", "C": "提升适应气候变化能力", "D": "促进经济发展与生态保护协调统一"}, "ans": "ABCD", "ana": "以流域为单元统筹源头至河口、水域和陆域的全域保护，有利于增强流域生态功能，筑牢国家生态安全基础，A 正确。推进山水林田湖草沙一体化保护和系统治理，有利于保护物种生境、维护生物多样性和生态系统稳定性，B 正确。统筹水灾害、水资源、水生态和水环境治理，有利于增强流域应对极端暴雨、洪水等灾害的韧性，提升适应气候变化能力，C 正确。加强流域生态保护，同时保障生产生活用水、发挥江河综合功能，有利于促进经济发展与生态保护协调统一，D 正确。ABCD 正确。", "dis": "", "ext": "以流域为单元的系统治理【《手册》第 107 页】 （1）治理单元和任务。《关于全面推进江河保护治理的意见》提出，“以流域为单元，统筹推进水灾害、水资源、 水生态、水环境治理”。 （2）生态保护范围。《意见》要求统筹江河从源头到河口、水域与陆域的全域保护。干流和主要支流构成生态保 护带的骨架，湖泊、水库、湿地是其中的节点。 （3）全流域管理。《意见》要求强化流域统一规划、统一治理、统一调度，并将流域管理与区域管理、统一管理 与分级管理分别结合起来。比如，流域内的骨干水工程实行联合调度，统筹防洪、生态、供水等多种需求。 高质量发展与高水平保护、长江治理与发展【详见：第 5 套，第 25 题】。", "year": 2027}, {"id": "s6-26", "set": 6, "num": 26, "src": "苏一六套卷（六）", "book": "苏一", "sub": "新思想", "type": "multi", "stem": "“十五五”开局之年，我国统筹推进水网、新型电网、算力网、新一代通信网、城市地下管网、物流网“六张网”规划建设，促进各类基础设施集成融合、协同运行。推进“六张网”建设的重要作用体现在", "opts": {"A": "深入挖掘内需潜力", "B": "消除区域经济发展的不平衡性", "C": "推动供需协同、联动升级", "D": "加快建设现代化产业体系"}, "ans": "ACD", "ana": "推进“六张网”建设，兼顾传统基础设施补短板和新型基础设施布局，有利于带动有效投资、深入挖掘内需潜力，A 正确。基础设施网络相互衔接，有利于提高供给与需求的适配性，推动供需协同、联动升级，C 正确。完善物流、能源、通信和算力等基础设施，有利于为产业协作和转型升级提供支撑，加快建设现代化产业体系，D 正确。ACD 正确。", "dis": "B 属于绝对化表述，推进“六张网”建设有利于优化基础设施布局，促进资源要素流动，缩小区域发展差距，但不能消除区域经济发展的不平衡性。", "ext": "“六张网”的建设任务与经济作用 （1）六张网： ①水网：统筹解决水灾害、水资源、水生态、水环境问题； ②新型电网：把越来越多的新能源稳定接入大电网，让绿色电力发得出、送得走、用得稳； ③算力网：把全国各地的计算资源连成一张网，可以像拧开水龙头一样，随时随地按需获取算力； ④新一代通信网：从 6G 到卫星互联网，将实现空天地海一体化； ⑤城市地下管网：从“看不见”到“管得住”，燃气、供排水、供热更有保障； ⑥物流网：让分散的通道和枢纽连成网，打通货畅其流的“最后一公里”。 （2）工作重点： ①加强统筹协调，强化跨部门跨领域协调调度。 ②强化投融资支持。 ③深化政银企协作。 ④加强要素保障。 （3）扩大内需、促进供需良性互动【《手册》第 90—91 页】 ①总体意义：“六张网”建设既能够稳投资、扩内需，更是增动能、提效益、惠民生、保安全的大事，关系当前 和长远发展。 ②从当前和长远两个角度理解：包括“六张网”在内的重大基础设施建设，当前可以扩大投资、稳定增长，长远 可以推动供需协同、联动升级，为产业发展、百姓生活和安全保障提供支撑。 投资于物与投资于人【详见：第 3 套，第 25 题】；消费与供给的双向作用【详见：第 5 套，第 24 题】。 史纲（10—13 单选；27—29 多选）", "year": 2027}, {"id": "s6-27", "set": 6, "num": 27, "src": "苏一六套卷（六）", "book": "苏一", "sub": "史纲", "type": "multi", "stem": "孙中山先生是伟大的民族英雄、伟大的爱国主义者、中国民主革命的伟大先驱，一生以革命为己任，立志救国救民，为中华民族作出了彪炳史册的贡献。孙中山先生的伟大表现在", "opts": {"A": "领导了辛亥革命", "B": "发动了以推翻北洋军阀统治为目标的北伐战争", "C": "重新解释三民主义并提出了联俄、联共、扶助农工三大政策", "D": "坚定维护民主共和制度和国家完整统一"}, "ans": "ACD", "ana": "孙中山是中国民主革命的伟大先驱。他领导辛亥革命，推翻清王朝统治，结束了中国延续两千多年的封建君主专制制度。辛亥革命失败后，他继续为维护民主共和制度和国家完整统一而斗争。晚年，孙中山推动国民党改组，重新解释三民主义，确立联俄、联共、扶助农工三大革命政策，促成第一次国共合作。ACD 正确。", "dis": "B 选项，孙中山提出反对北洋军阀统治，推动国共合作，为国民革命和北伐战争创造了条件。但是，孙中山于 1925 年 3 月逝世，北伐战争于 1926 年 7 月正式开始，因而不能说孙中山发动了北伐战争。", "ext": "（1）从辛亥革命到第一次国共合作 ①1905 年成立中国同盟会。 ②1911 年辛亥革命，1912 年中华民国临时政府成立。 ③1924 年国民党一大召开，第一次国共合作正式形成。 ④1925 年孙中山逝世；1926 年国民革命军出师北伐。区分为北伐创造条件与直接发动北伐。 （2）孙中山诞辰 160 周年：辛亥革命【《手册》第 124—126 页】 （3）第一次国共合作的形成【《手册》第 132 页】 1924 年 1 月，国民党一大由孙中山主持在广州举行： （1）主要内容： ①大会通过的宣言对三民主义作出了新的解释 ②确认了共产党员以个人身份加入国民党的原则 ③事实上确认了联俄、联共、扶助农工的三大革命政策 ④大会的成功召开，标志着第一次国共合作的正式形成 国民党一大 （2）新三民主义： ①民族主义：突出了反对帝国主义的内容 ②民权主义：强调了民主权利应“为一般平民所共有” ③民生主义：把民生主义概括为“平均地权”和“节制资本”两大原则（后来又提出“耕者 有其田”的主张） （3）国共合作的政治基础：新三民主义的政纲同中国共产党在民主革命阶段的纲领基本一致", "year": 2027}, {"id": "s6-28", "set": 6, "num": 28, "src": "苏一六套卷（六）", "book": "苏一", "sub": "史纲", "type": "multi", "stem": "1950 年 10 月，中国人民志愿军跨过鸭绿江，同朝鲜人民和军队一道，经过艰苦卓绝的战斗，迫使侵略者于 1953 年 7 月 27 日在停战协定上签字。关于抗美援朝战争及其伟大胜利，下列说法正确的有", "opts": {"A": "是为了保家卫国、维护和平而进行的正义之战", "B": "打破了美军不可战胜的神话", "C": "是中国人民站起来后屹立于世界东方的宣言书", "D": "赢得了近代以来中华民族反抗外敌入侵的第一次完全胜利"}, "ans": "ABC", "ana": "① 1950 年 10 月初，美国把战火烧到中朝边境，中共中央毅然作出派遣中国人民志愿军入朝作战，抗美援朝、保家卫国的历史性决策。这场战争既是保家卫国之战，也是维护和平与正义之战。②抗美援朝战争，是在交战双方力量极其悬殊条件下进行的一场现代化战争。当时，中美两国国力相差巨大。在这样极为艰难的情况下，中国人民志愿军同朝鲜军民密切配合，创造了威武雄壮的战争伟业。抗美援朝战争，打破了美军不可战胜的神话，迫使不可一世的侵略者于 1953 年 7 月 27 日在停战协定上签字。抗美援朝战争的伟大胜利，是中国人民站起来后屹立于世界东方的宣言书，是中华民族走向伟大复兴的重要里程碑。ABC 正确。", "dis": "D 选项，取得近代以来反抗外敌入侵的第一次完全胜利，是 1945 年抗日战争胜利的历史意义。抗美援朝战争发生在新中国成立之后。", "ext": "抗日战争胜利与抗美援朝战争胜利 ①1945 年，抗日战争胜利，是近代以来中国人民反抗外敌入侵取得的第一次完全胜利。【《手册》第 143—144 页】 ②1950 年 10 月，中国人民志愿军赴朝作战；1953 年 7 月 27 日，朝鲜停战协定签字。抗美援朝战争伟大胜利，是 中国人民站起来后屹立于世界东方的宣言书。【《手册》第 150 页】 （1）从根本上改变了旧中国“跪倒在地上办外交”的局面 （2）提出了“另起炉灶”“打扫干净屋子再请客”“一边倒”的外交方针 巩固民族独 （3）1953 年 7 月，抗美援朝战争胜利的意义： 立，维护国 ①打破了美国军队不可战胜的神话 家主权和安 ②是中国人民站起来后屹立于世界东方的宣言书 全 ③打出了国威军威，打出了中国人民的精气神，捍卫了新中国安全 ④极大促进了国防和军队现代化，有力推动世界和平与人类进步事业 ⑤锻造了伟大的抗美援朝精神，是中华民族走向伟大复兴的重要里程碑", "year": 2027}, {"id": "s6-29", "set": 6, "num": 29, "src": "苏一六套卷（六）", "book": "苏一", "sub": "史纲", "type": "multi", "stem": "1956 年 4 月 25 日，毛泽东在中央政治局扩大会议上作《论十大关系》的讲话；5 月 2日又向最高国务会议作报告。报告提出要把国内外一切积极因素调动起来，为社会主义事业服务。同时总结我国社会主义建设的初步经验，并借鉴苏联建设的经验教训，论述了十个问题即十大关系，为中共八大的召开作了理论准备。后来，毛泽东回顾说，前几年照抄外国的经验，“从一九五六年提出十大关系起，开始找到自己的一条适合中国的路线”。关于《论十大关系》，下列说法正确的有", "opts": {"A": "论述了重工业和轻工业、农业的关系", "B": "制定了《1956—1967 年科学技术发展远景规划纲要》", "C": "标志着党探索中国社会主义建设道路的良好开端", "D": "提出了“一边倒”的外交方针"}, "ans": "AC", "ana": "1956 年 5 月，毛泽东作《论十大关系》的报告，围绕调动一切积极因素为社会主义事业服务的基本方针，总结我国社会主义建设的初步经验，并借鉴苏联建设的经验教训，论述了十个问题即十大关系。①《论十大关系》前五条主要讨论经济问题，从经济工作的各个方面来调动各种积极因素。前三条讲重工业和轻工业、农业的关系，沿海工业和内地工业的关系，经济建设和国防建设的关系。这里涉及的实际上是开辟一条与苏联有所不同的中国工业化道路。第四、第五条讲国家、生产单位和生产者个人的关系，中央和地方的关系，并开始涉及经济体制的改革，提出要充分调动 <script>/* 考研政治 · 记忆训练场 */
const KEY = 'ky_pol_v2';
const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const TODAY = () => ymd(new Date());

const DEF = {
  rec: {},            // id -> {n, r, w, last, ivl, ease, due, fav, wrong}
  cards: {},          // id -> {due, ease, seen}
  set: { theme: 'light', font: 19, shuffle: true, sound: true, goal: 40, pomo: 25 },
  hist: {},           // date -> {n, r}
  last: null,         // 上次刷到哪
  streak: { date: '', n: 0 },
  total: 0,
  err: {},
  notes: {}
};
let S = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEF));
    const o = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(DEF)), o, { set: Object.assign({}, DEF.set, o.set || {}) });
  } catch (e) { return JSON.parse(JSON.stringify(DEF)); }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- 工具 ---------- */
const $ = (s, p) => (p || document).querySelector(s);
const el = (s) => { const t = document.createElement('template'); t.innerHTML = s.trim(); return t.content.firstChild; };
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const pad = (n) => String(n).padStart(2, '0');
function shuffle(a, seed) {
  const arr = a.slice();
  let s = seed || Math.random() * 1e9;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
function hash(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 1e9; return h; }

let AC = null;
function beep(ok) {
  if (!S.set.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type = 'sine';
    o.frequency.value = ok ? 720 : 240;
    g.gain.setValueAtTime(0.06, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 0.18);
    o.start(); o.stop(AC.currentTime + 0.19);
    if (ok) { const o2 = AC.createOscillator(), g2 = AC.createGain(); o2.connect(g2); g2.connect(AC.destination); o2.type = 'sine'; o2.frequency.value = 1080; g2.gain.setValueAtTime(0.04, AC.currentTime + 0.09); g2.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 0.3); o2.start(AC.currentTime + 0.09); o2.stop(AC.currentTime + 0.3); }
  } catch (e) {}
}
function speak(text) {
  try {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[A-D]\s?正确/g, '').slice(0, 400));
    u.lang = 'zh-CN'; u.rate = 1.05; speechSynthesis.speak(u);
  } catch (e) {}
}
