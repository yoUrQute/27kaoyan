const SUB_ORDER = ['马原', '毛中特', '新思想', '史纲', '思法', '时政'];
const SUB_COLOR = { 马原: '#6b7f9e', 毛中特: '#a0714f', 新思想: '#4f7d5f', 史纲: '#8a6d3b', 思法: '#8b5f8f', 时政: '#5b7c8d' };

function rec(id) {
  if (!S.rec[id]) S.rec[id] = { n: 0, r: 0, w: 0, last: '', ivl: 0, ease: 2.5, due: '', fav: false, wrong: false };
  return S.rec[id];
}
function dueCards() {
  const t = TODAY();
  return BANK.filter(q => { const c = S.cards[q.id]; return c && c.due <= t; });
}
function wrongList() { return BANK.filter(q => S.rec[q.id] && S.rec[q.id].wrong); }
function favList() { return BANK.filter(q => S.rec[q.id] && S.rec[q.id].fav); }

/* 判断题：把解析里逐项的“X 对 / X 错 + 理由”抽成单句判断 */
function buildJudge() {
  const out = [];
  const seen = new Set();
  // 逆向题（问“错误在于”“不属于”的）答案是错的说法，抽出来练判断会教错，整题跳过
  const neg = q => /错(误)?在于|错(误)?的是|不正确的是|说法犯错|不属于|不包括|没有体现|不能说明/.test(q.stem);
  const push = (q, k, right, why) => {
    const id = q.id + '-' + k;
    if (seen.has(id)) return;
    const t = q.opts[k];
    if (!t || t.length < 6) return;
    seen.add(id);
    let w = (why || '').replace(/\s+/g, '');
    if (w.length < 10) w = right ? '这是本题的正确表述，解析里和它说的是一回事。' : '解析里点了这一项是错的。';
    out.push({ id, q, text: t, right, why: w });
  };
  // “A、B 正确”“C 错：……”这类逐项点评，是判断题最好的原料
  const pick = (q, text) => {
    if (!text || text.length < 20 || neg(q)) return;
    const re = /([A-D](?:、[A-D])*)\s*(错误|错|正确|对)\s*(?:[了]?)?[，,、：:]\s*([^。；]{0,110})/g;
    let m;
    while ((m = re.exec(text)) !== null) {
      const keys = m[1].split('、');
      const right = m[2] === '正确' || m[2] === '对';
      const why = m[3].trim();
      keys.forEach(k => push(q, k, right, why));
    }
  };
  BANK.forEach(q => pick(q, q.dis));
  BANK.forEach(q => pick(q, q.ana));
  // 正确句：只从解析里挑“明确讲过这个选项”的句子，找不到就不收，宁可少也不背错
  const win = t => { const a = []; for (let i = 0; i + 8 <= t.length; i += 2) a.push(t.slice(i, i + 8)); return a; };
  BANK.forEach(q => {
    if (!q.ana || neg(q)) return;
    const sents = q.ana.split(/[。；]/).filter(x => x.length > 10);
    q.ans.split('').forEach(k => {
      if (seen.has(q.id + '-' + k)) return;
      const t = q.opts[k];
      if (!t || t.length < 8) return;
      const hits = win(t).filter(w => sents.some(x => x.includes(w)));
      if (hits.length < 2) return;
      let line = (sents.find(x => hits.some(w => x.includes(w))) || '').trim();
      // 句子后半截若开始点评别的选项，就掐掉，免得把别人的错误理由算到这句头上
      line = line.replace(/[，,]\s*[A-D][A-D、]*\s*(错|不)/, '').trim();
      if (line.length < 12) line = '这是本题的正确表述，解析里和它说的是一回事。';
      seen.add(q.id + '-' + k);
      out.push({ id: q.id + '-' + k, q, text: t, right: true, why: line });
    });
  });
  return out;
}
const JUDGE = buildJudge();

/* ---------- 番茄钟 ---------- */
let POMO = { left: (S.set.pomo || 25) * 60, on: false, id: null };
function fmtT(s) { return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
function syncPomo() { const e = document.querySelector('.pomo'); if (e) e.textContent = (POMO.on ? '⏸ ' : '⏱ ') + fmtT(POMO.left); }
function tickPomo() {
  POMO.left--;
  if (POMO.left <= 0) {
    clearInterval(POMO.id); POMO.on = false; POMO.left = (S.set.pomo || 25) * 60;
    beep(true); toast('专注结束，起来走两步');
  }
  syncPomo();
}
function togglePomo() {
  if (POMO.on) { clearInterval(POMO.id); POMO.on = false; }
  else { POMO.on = true; POMO.id = setInterval(tickPomo, 1000); }
  syncPomo();
}

/* ---------- 视图状态 ---------- */
const V = { view: 'home', quiz: null, card: null, judge: null, flash: null };

/* ---------- 渲染入口 ---------- */
function render(keep) {
  document.documentElement.dataset.theme = S.set.theme;
  document.documentElement.style.setProperty('--fs', S.set.font + 'px');
  const sy = window.scrollY;
  const main = $('#view');
  const map = { home: viewHome, quiz: viewQuiz, cards: viewFlash, judge: viewJudge, review: viewReview, stats: viewStats, settings: viewSettings, extsheet: viewExtSheet };
  main.innerHTML = '';
  main.appendChild((map[V.view] || viewHome)());
  // tab 高亮
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === V.view));
  if (keep) window.scrollTo({ top: sy }); else window.scrollTo({ top: 0 });
  syncPomo();
}

/* ---------- 刷题 ---------- */
function makeQueue(list, name) {
  return { list: list.map(q => q.id), name, idx: 0, ok: 0, bad: 0, mode: 'practice' };
}
function qById(id) { return BANK.find(q => q.id === id); }

function viewQuiz() {
  if (!V.quiz) { V.quiz = makeQueue(BANK, '全部题库'); }
  const Q = V.quiz;
  if (Q.idx >= Q.list.length) return quizDone(Q);
  const q = qById(Q.list[Q.idx]);
  if (!q) { Q.idx++; return viewQuiz(); }
  const r = rec(q.id);
  const seed = S.set.shuffle ? hash(q.id + (Q.round || '')) : 12345;
  const order = S.set.shuffle ? shuffle(['A', 'B', 'C', 'D'], seed) : ['A', 'B', 'C', 'D'];
  const picked = Q.picked || new Set();
  const judged = Q.judged;
  Q.order = order;
  const marks = S.set.shuffle ? '①②③④' : 'ABCD';

  const optsHtml = order.map((k, i) => {
    const txt = q.opts[k];
    let cls = 'opt';
    if (judged) {
      if (q.ans.includes(k)) cls += ' right';
      else if (picked.has(k)) cls += ' wrong';
    } else if (picked.has(k)) cls += ' sel';
    return `<button class="${cls}" data-opt="${k}" ${judged ? 'disabled' : ''}>
      <span class="tag">${marks[i]}</span><span class="txt">${esc(txt)}</span></button>`;
  }).join('');

  const w = el(`<div class="page quiz-page">
    <div class="q-head">
      <div class="q-meta"><span class="pill" style="background:${SUB_COLOR[q.sub]}22;color:${SUB_COLOR[q.sub]}">${q.sub}</span>
        <span class="pill ghost">${q.type === 'single' ? '单选' : '多选'}</span>
        <span class="q-src">${q.src} 第${q.num}题</span></div>
      <div class="q-right"><button class="pomo" data-act="pomo">⏱ ${fmtT(POMO.left)}</button><span class="q-count">${Q.idx + 1}<small>/${Q.list.length}</small></span></div>
    </div>
    <div class="q-prog"><i style="width:${Math.round((Q.idx + (judged ? 1 : 0)) / Q.list.length * 100)}%"></i></div>
    <div class="q-stem">${esc(q.stem)}</div>
    <div class="q-tip">${q.type === 'multi' ? '选出所有正确项，再点提交' : '点选项即判定'}${S.set.shuffle ? ' · 选项已打乱，按 ① ② ③ ④ 认位置' : ''}</div>
    <div class="opts">${optsHtml}</div>
    <div class="q-actions">
      ${q.type === 'multi' && !judged ? `<button class="act primary" data-act="submit">提交</button>` : ''}
      ${judged ? `<button class="act primary" data-act="next">${Q.idx + 1 >= Q.list.length ? '完成' : '下一题 →'}</button>` : ''}
      <button class="act ghost" data-act="prev" ${Q.idx === 0 ? 'disabled' : ''}>← 上一题</button>
      <button class="act ghost" data-act="skip">跳过</button>
      <button class="act ghost ${r.fav ? 'on' : ''}" data-act="fav">${r.fav ? '★ 已收藏' : '☆ 收藏'}</button>
      <button class="act ghost" data-act="read">🔊</button>
    </div>
    ${judged ? resBlock(q, picked) : ''}
  </div>`);
  return w;
}

function resBlock(q, picked) {
  const ok = [...picked].sort().join('') === q.ans.split('').sort().join('');
  const rightTxt = q.ans.split('').map((k, i) => `<b>${k}</b>.${esc(q.opts[k])}`).join(' ');
  return `<div class="res ${ok ? 'ok' : 'no'}">
    <div class="res-h">${ok ? '✓ 对了' : '✗ 再想想'} <span class="ans-line">原卷答案 ${q.ans}${S.set.shuffle ? '（字母是原卷标号，屏幕上已打乱，按内容认）' : ''}</span></div>
    <div class="res-ans">${rightTxt}</div>
    ${q.ana ? `<details open class="fold"><summary>解析</summary><p>${esc(q.ana)}</p></details>` : `<details class="fold"><summary>说明</summary><p class="tip-p">这题的解析还没录进文字，先记住正确答案是 ${q.ans}。</p></details>`}
    ${q.ext ? `<div class="ext-box"><span class="ext-k">🎯 考点</span><p>${esc(q.ext)}</p></div>` : ''}
    ${q.dis ? `<details class="fold"><summary>干扰项为什么错</summary><p>${esc(q.dis)}</p></details>` : ''}
    <details class="fold note-box"><summary>我的笔记</summary>
      <textarea class="note" data-note="${q.id}" placeholder="用自己的话写一句：这题考什么、我为什么错">${esc(S.notes[q.id] || '')}</textarea>
    </details>
    ${!ok ? `<div class="err-tags"><span>错在哪：</span>${['知识没记住', '概念混淆', '看漏限定词', '材料没读懂'].map(t => `<button class="etag ${(S.err[q.id] === t) ? 'on' : ''}" data-err="${t}">${t}</button>`).join('')}</div>` : ''}
  </div>`;
}

function quizDone(Q) {
  const acc = Q.ok + Q.bad ? Math.round(Q.ok / (Q.ok + Q.bad) * 100) : 0;
  return el(`<div class="page done-page">
    <div class="done-ico">🏁</div>
    <h1>这一轮刷完了</h1>
    <p class="done-sub">${Q.name} · 共 ${Q.list.length} 题</p>
    <div class="done-nums"><div><b>${Q.ok}</b><small>答对</small></div><div><b>${Q.bad}</b><small>答错</small></div><div><b>${acc}%</b><small>正确率</small></div></div>
    <div class="grid2">
      <button class="big-btn primary" data-act="restart-quiz"><b>再刷一轮</b><small>错题优先</small></button>
      <button class="big-btn" data-act="wrong"><b>去看错题</b><small>${wrongList().length} 道待消化</small></button>
    </div>
    <div class="grid2" style="margin-top:8px">
      <button class="big-btn" data-act="extsheet"><b>考点串一遍</b><small>把刚做完的考点扫读</small></button>
      <button class="big-btn" data-act="flash"><b>翻闪卡</b><small>趁热再记一次</small></button>
    </div>
    <p class="quote">“${['先把不会的补上，一步一步往前走。', '错题不是耻辱，是地图。', '能讲清楚才算吃透。'][Math.floor(Math.random() * 3)]}”</p>
  </div>`);
}

/* ---------- 复习队列 / 错题本 ---------- */
function reviewBase(tab) {
  return tab === 'wrong' ? wrongList() : tab === 'fav' ? favList() : BANK.filter(q => { const r = S.rec[q.id]; return r && r.n > 0 && !r.wrong && !r.fav; });
}
function viewReview() {
  const tab = V.reviewTab || 'wrong';
  const sub = V.reviewSub || '全部';
  const all = reviewBase(tab);
  const list = sub === '全部' ? all : all.filter(q => q.sub === sub);
  const w = el(`<div class="page">
    <div class="seg">
      <button class="seg-b ${tab === 'wrong' ? 'on' : ''}" data-act="rt" data-t="wrong">错题 ${wrongList().length}</button>
      <button class="seg-b ${tab === 'fav' ? 'on' : ''}" data-act="rt" data-t="fav">收藏 ${favList().length}</button>
      <button class="seg-b ${tab === 'done' ? 'on' : ''}" data-act="rt" data-t="done">已做</button>
    </div>
    <div class="chips sub-filter">
      <button class="fchip ${sub === '全部' ? 'on' : ''}" data-act="rf" data-s="全部">全部 ${all.length}</button>
      ${SUB_ORDER.map(s => {
        const n = all.filter(q => q.sub === s).length;

    <div class="list-actions">
      <button class="act primary" data-act="review-start" data-t="${tab}" ${list.length ? '' : 'disabled'}>${list.length ? '按顺序重做这 ' + list.length + ' 题' : '这里还没题'}</button>
      <button class="act ghost" data-act="review-shuffle" data-t="${tab}" ${list.length ? '' : 'disabled'}>乱序来一遍</button>
    </div>
    <div class="qlist">${list.map(q => {
      const r = S.rec[q.id] || {};
      return `<button class="qrow" data-act="open-q" data-id="${q.id}">
        <span class="qr-sub" style="color:${SUB_COLOR[q.sub]}">${q.sub}</span>
        <span class="qr-stem">${esc(q.stem.slice(0, 46))}…</span>
        <span class="qr-tag">${r.n ? '答' + r.n + '错' + (r.w || 0) : '未做'}</span>
      </button>`;
    }).join('') || '<p class="empty">这里还空着，去刷几道题吧。</p>'}</div>
  </div>`);

}

/* ---------- 闪卡 ---------- */
function viewFlash() {
  if (!V.flash) {
    const due = dueCards();
    const rest = BANK.filter(q => !S.cards[q.id] || S.cards[q.id].due > TODAY());
    V.flash = { list: due.map(q => q.id).concat(rest.map(q => q.id)), idx: 0, front: true, seed: 0, dueN: due.length };
  }
  const F = V.flash;
  if (F.idx >= F.list.length) return el(`<div class="page done-page"><div class="done-ico">🗂</div><h1>这一叠看完了</h1><p class="done-sub">休息一下，明天再来一遍。</p><div class="grid2"><button class="big-btn primary" data-act="flash-reset"><b>再看一轮</b></button><button class="big-btn" data-act="home"><b>回首页</b></button></div></div>`);
  const q = qById(F.list[F.idx]);
  const c = S.cards[q.id] || { due: TODAY(), ease: 2.5, seen: 0 };
  const w = el(`<div class="page flash-page">
    <div class="q-head"><div class="q-meta"><span class="pill" style="background:${SUB_COLOR[q.sub]}22;color:${SUB_COLOR[q.sub]}">${q.sub}</span><span class="q-src">${q.src} 第${q.num}题</span></div>
      <div class="q-count">${F.idx + 1}<small>/${F.list.length}</small>${F.dueN ? `<em class="due-tag">到期 ${F.dueN}</em>` : ''}</div></div>
    ${F.front ? `<div class="flash" data-act="flip">
        <div class="flash-tag">回想一下：这题的正确方向是？</div>
        <div class="flash-body">${esc(q.stem)}</div>
        <div class="flash-hint">点卡片看答案与考点</div>
      </div>` : `<div class="flash back" data-act="flip">
        <div class="flash-tag">正确答案 ${q.ans}</div>
        <div class="flash-body">${q.ans.split('').map(k => `<div class="fl-opt"><b>${k}</b> ${esc(q.opts[k])}</div>`).join('')}</div>
        ${(q.ext || q.ana) ? `<div class="flash-ext"><b>考点：</b>${esc((q.ext || q.ana).slice(0, 520))}</div>` : ''}
      </div>

}

/* ---------- 判断正误 ---------- */
function viewJudge() {
  if (!V.judge) V.judge = { list: shuffle(JUDGE).map(x => x.id), idx: 0, ok: 0, bad: 0 };
  const J = V.judge;
  if (J.idx >= J.list.length) return el(`<div class="page done-page"><div class="done-ico">⚖︎</div><h1>判断练完了</h1><div class="done-nums"><div><b>${J.ok}</b><small>判断对</small></div><div><b>${J.bad}</b><small>判断错</small></div></div><button class="big-btn primary" data-act="judge-again"><b>再来一轮</b></button></div>`);
  const item = JUDGE.find(x => x.id === J.list[J.idx]);
  const done = J.done;
  const w = el(`<div class="page">
    <div class="q-head"><div class="q-meta"><span class="pill" style="background:${SUB_COLOR[item.q.sub]}22;color:${SUB_COLOR[item.q.sub]}">${item.q.sub}</span><span class="pill ghost">判断正误</span></div><div class="q-count">${J.idx + 1}<small>/${J.list.length}</small></div></div>
    <p class="q-tip">这句话对不对？</p>
    <div class="jd-text">${esc(item.text)}</div>
    ${done === undefined || done === null ? `<div class="grid2 jd-btns"><button class="big-btn" data-judge="1"><b>✓ 对</b></button><button class="big-btn" data-judge="0"><b>✗ 错</b></button></div>` :
      `<div class="res ${done === (item.right ? 'y' : 'n') ? 'ok' : 'no'}"><div class="res-h">${done === (item.right ? 'y' : 'n') ? '✓ 判断正确' : '✗ 判断失误'} · 这句是${item.right ? '对的' : '错的'}</div>
        <div class="res-ans"><b>理由（取自原题解析对这个选项的说明）：</b>${esc(item.why)}</div>

  </div>`);
  return w;
}

/* ---------- 统计 ---------- */
function viewStats() {
  const today = S.hist[TODAY()] || { n: 0, r: 0 };
  const subs = SUB_ORDER.map(s => {
    const arr = BANK.filter(q => q.sub === s);
    const done = arr.filter(q => S.rec[q.id] && S.rec[q.id].n > 0);
    const right = done.reduce((a, q) => a + S.rec[q.id].r, 0), tot = done.reduce((a, q) => a + S.rec[q.id].n, 0);
    return { s, done: done.length, tot: arr.length, acc: tot ? Math.round(right / tot * 100) : 0 };
  });
  const days = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const k = ymd(d); days.push({ k, v: (S.hist[k] || {}).n || 0 }); }
  const maxd = Math.max(1, ...days.map(x => x.v));
  const totalN = Object.values(S.rec).reduce((a, r) => a + r.n, 0);
  const totalR = Object.values(S.rec).reduce((a, r) => a + r.r, 0);
  const w = el(`<div class="page">
    <div class="stat-top"><div><b>${totalN}</b><small>累计作答</small></div><div><b>${totalN ? Math.round(totalR / totalN * 100) : 0}%</b><small>总正确率</small></div><div><b>${Object.keys(S.rec).length}</b><small>已碰过</small></div><div><b>${wrongList().length}</b><small>错题</small></div></div>
    <div class="sec"><div class="sec-h"><h2>最近 14 天</h2></div><div class="heat">${days.map(d => `<div class="hcell" style="--o:${d.v / maxd}" title="${d.k} ${d.v}题"><i></i><small>${d.k.slice(8)}</small></div>`).join('')}</div></div>
    <div class="sec"><div class="sec-h"><h2>学科掌握度</h2><span class="hint">灰条=刷过的比例</span></div>
      ${subs.map(x => `<div class="sub-row"><span class="sr-name" style="color:${SUB_COLOR[x.s]}">${x.s}</span><div class="sr-bar"><i style="width:${x.tot ? x.done / x.tot * 100 : 0}%;background:${SUB_COLOR[x.s]}"></i></div><span class="sr-num">${x.done}/${x.tot}</span><span class="sr-acc">${x.acc}%</span></div>`).join('')}
    </div>
    <div class="sec"><div class="sec-h"><h2>错因分布</h2><span class="hint">越集中越该专项补</span></div>
      ${(() => { const E = { '知识没记住': 0, '概念混淆': 0, '看漏限定词': 0, '材料没读懂': 0 }; Object.values(S.err).forEach(v => { if (E[v] !== undefined) E[v]++; }); const tot = Object.values(E).reduce((a, b) => a + b, 0) || 1; return Object.entries(E).map(([k, v]) => `<div class="sub-row"><span class="sr-name" style="width:76px;color:var(--ink2)">${k}</span><div class="sr-bar"><i style="width:${v / tot * 100}%;background:var(--accent)"></i></div><span class="sr-num">${v}</span></div>`).join(''); })()}
    </div>
    <div class="sec"><div class="sec-h"><h2>搜索题目</h2></div>
      <input class="inp" id="search" placeholder="输入关键词，如 剩余价值、遵义会议" />
      <div class="qlist" id="sres"></div>
    </div>
  </div>`);
  setTimeout(() => {
    const inp = $('#search');
    if (!inp) return;
    inp.addEventListener('input', () => {
      const k = inp.value.trim(); const box = $('#sres');
      if (!k) { box.innerHTML = ''; return; }
      const res = BANK.filter(q => (q.stem + q.ana + (q.ext || '') + Object.values(q.opts).join('')).includes(k)).slice(0, 20);
      box.innerHTML = res.map(q => `<button class="qrow" data-act="open-q" data-id="${q.id}"><span class="qr-sub" style="color:${SUB_COLOR[q.sub]}">${q.sub}</span><span class="qr-stem">${esc(q.stem.slice(0, 40))}…</span></button>`).join('') || '<p class="empty">没找到</p>';
      box.querySelectorAll('[data-act="open-q"]').forEach(b => b.onclick = () => openQuestion(b.dataset.id));
    });
  }, 0);
  return w;
}

/* ---------- 交互 ---------- */
function openQuestion(id) {
  V.quiz = makeQueue([id], '单题精看');
  V.quiz.idx = 0;
  V.view = 'quiz'; render();
}

function startQuiz(list, name) {
  V.quiz = makeQueue(list, name);
  V.view = 'quiz'; render();
}

function judgeAnswer(ok) {
  const Q = V.quiz; if (!Q) return;
  const q = qById(Q.list[Q.idx]); if (!q) return;
  const today = TODAY();
  S.hist[today] = S.hist[today] || { n: 0, r: 0 };
  S.hist[today].n++; if (ok) S.hist[today].r++;
  S.total++;
  if (S.streak.date !== today) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    const ys = ymd(y);
    S.streak.n = (S.streak.date === ys) ? (S.streak.n + 1) : 1;
    S.streak.date = today;
  }
  const r = rec(q.id);
  r.n++; r.last = today;
  if (ok) {
    r.r++;
    if (r.wrong) { r.w2 = (r.w2 || 0) + 1; if (r.w2 >= 2) r.wrong = false; }
    r.ivl = r.ivl ? Math.min(60, r.ivl * 2) : 1;
  } else {
    r.w++; r.wrong = true; r.w2 = 0; r.ivl = 1;
    // 卡也提前
    S.cards[q.id] = Object.assign({ ease: 2.5, seen: 0 }, S.cards[q.id], { due: today });
  }
  const nd = new Date(); nd.setDate(nd.getDate() + (r.ivl || 1));
  r.due = ymd(nd);
  // 闪卡进度同步
  if (!S.cards[q.id]) S.cards[q.id] = { due: TODAY(), ease: 2.5, seen: 0 };
  S.cards[q.id].seen = (S.cards[q.id].seen || 0) + 1;
  S.last = q.id;
  save();
  beep(ok);
}

function submitMulti() {
  const Q = V.quiz; const q = qById(Q.list[Q.idx]);
  if (!Q.picked || Q.picked.size === 0) { toast('先选至少一个'); return; }
  Q.judged = true;
  const ok = [...Q.picked].sort().join('') === q.ans.split('').sort().join('');
  ok ? Q.ok++ : Q.bad++;
  Q.combo = ok ? (Q.combo || 0) + 1 : 0;
  if (ok && Q.combo >= 3 && Q.combo % 3 === 0) toast('连对 ' + Q.combo + ' 题，稳住');
  judgeAnswer(ok); render(true);
  setTimeout(() => { const r = document.querySelector('.res'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 90);
}

function pick(k) {
  const Q = V.quiz; const q = qById(Q.list[Q.idx]);
  if (Q.judged) return;
  if (q.type === 'single') {
    Q.picked = new Set([k]); Q.judged = true;
    const ok = k === q.ans;
    ok ? Q.ok++ : Q.bad++;
  Q.combo = ok ? (Q.combo || 0) + 1 : 0;
  if (ok && Q.combo >= 3 && Q.combo % 3 === 0) toast('连对 ' + Q.combo + ' 题，稳住');
    judgeAnswer(ok); render(true);
    setTimeout(() => { const r = document.querySelector('.res'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 90);
  } else {
    Q.picked = Q.picked || new Set();
    Q.picked.has(k) ? Q.picked.delete(k) : Q.picked.add(k);
    render();
  }
}

function nextQ() {
  const Q = V.quiz;
  if (Q.idx + 1 >= Q.list.length) { Q.idx++; render(); return; }
  Q.idx++; Q.picked = new Set(); Q.judged = false; Q.round = (Q.round || '') + 'x';
  S.last = Q.list[Q.idx]; save(); render();
}

function toast(msg) {
  const t = el(`<div class="toast">${esc(msg)}</div>`);
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('out'), 1500);
  setTimeout(() => t.remove(), 2100);
}

document.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (tab) {
    const v = tab.dataset.v;
    if (v === 'home') V.view = 'home';
    else if (v === 'quiz') { if (!V.quiz) V.quiz = makeQueue(BANK, '全部题库'); V.view = 'quiz'; }
    else if (v === 'cards') { if (!V.flash) V.flash = null; V.view = 'cards'; }
    else if (v === 'wrong') { V.reviewTab = 'wrong'; V.view = 'review'; }
    else if (v === 'stats') V.view = 'stats';
    render(); return;
  }
  const b = e.target.closest('[data-act]');
  const ob = e.target.closest('[data-opt]');
  const jb = e.target.closest('[data-judge]');
  const sb = e.target.closest('[data-srs]');
  const setb = e.target.closest('[data-set]:not([data-act]):not([type=range])');
  const tg = e.target.closest('[data-toggle]');

  const pm = e.target.closest('[data-act="pomo"]');
  if (pm) { togglePomo(); return; }
  const eb = e.target.closest('[data-err]');
  if (eb) { S.err[qById(V.quiz.list[V.quiz.idx]).id] = eb.dataset.err; save(); render(true); toast('记下了，复盘时对着看'); return; }
  if (ob) { pick(ob.dataset.opt); return; }
  if (jb) {
    const J = V.judge; const item = JUDGE.find(x => x.id === J.list[J.idx]);
    const val = jb.dataset.judge === '1';
    J.done = val ? 'y' : 'n';   // 用字符串分“答对”和“答错”，别用 false 当“已作答”

    (val === item.right) ? J.ok++ : J.bad++;
    const r = rec(item.q.id); r.n++; r.last = TODAY();
    const today = TODAY(); S.hist[today] = S.hist[today] || { n: 0, r: 0 }; S.hist[today].n++;
    if (val === item.right) { S.hist[today].r++; r.r++; } else { r.w++; r.wrong = true; }
    save(); beep(val === item.right); render(); return;
  }
  if (sb) {
    const F = V.flash; const q = qById(F.list[F.idx]);
    const c = S.cards[q.id] || { ease: 2.5, seen: 0 };
    const add = { again: 0, hard: 2, good: 4, easy: 7 }[sb.dataset.srs];
    const d = new Date(); d.setDate(d.getDate() + add);
    S.cards[q.id] = Object.assign(c, { due: ymd(d), ease: Math.max(1.3, (c.ease || 2.5) + (sb.dataset.srs === 'easy' ? .15 : sb.dataset.srs === 'again' ? -.2 : 0)), seen: (c.seen || 0) + 1 });
    S.hist[TODAY()] = S.hist[TODAY()] || { n: 0, r: 0 };
    if (add) S.hist[TODAY()].n++, S.hist[TODAY()].r++;
    save(); F.idx++; F.front = true; render(); return;
  }
  if (setb) {
    const k = setb.dataset.set, v = setb.dataset.v;
    if (v === undefined) return;              // 滑块没有 data-v，别把 undefined 写进设置
    S.set[k] = (k === 'font' || k === 'goal') ? Number(v) : v; save(); render(); return;
  }
  if (tg) { const k = tg.dataset.toggle; S.set[k] = !S.set[k]; save(); render(); return; }

  if (!b) {
    // 闪卡翻面
    if (e.target.closest('.flash')) { V.flash.front = !V.flash.front; render(); }
    return;
  }
  const a = b.dataset.act;
  switch (a) {
    case 'settings': V.view = 'settings'; render(); break;
    case 'home': V.view = 'home'; render(); break;
    case 'start-daily': {
      const arr = BANK.filter(q => { const r = S.rec[q.id]; return !r || !r.n; });
      startQuiz(arr.length ? arr : BANK, arr.length ? '未做过的题' : '全部题库');
      break;
    }
    case 'sub': startQuiz(BANK.filter(q => q.sub === b.dataset.sub), b.dataset.sub); break;
    case 'set': startQuiz(BANK.filter(q => q.book === b.dataset.book && q.set === Number(b.dataset.set)), b.dataset.book + ' 第' + b.dataset.set + '套'); break;
    case 'judge': V.judge = null; V.view = 'judge'; render(); break;
    case 'flash': V.flash = null; V.view = 'cards'; render(); break;
    case 'wrong': V.reviewTab = 'wrong'; V.view = 'review'; render(); break;
    case 'stats': V.view = 'stats'; render(); break;
    case 'extsheet': if (!V.ext) V.ext = { b: '肖八', s: 1 }; V.view = 'extsheet'; render(); break;
    case 'ext-scope': V.ext = { b: b.dataset.book, s: Number(b.dataset.set) }; render(true); break;
    case 'review-queue': {
      const due = dueCards();
      if (due.length) { V.flash = { list: due.map(q => q.id), idx: 0, front: true, seed: 0 }; V.view = 'cards'; }
      else { toast('今天没有到期卡片，去刷题吧'); }
      render(); break;
    }
    case 'daily-q': openQuestion(b.dataset.id); break;
    case 'submit': submitMulti(); break;
    case 'next': nextQ(); break;
    case 'prev': { const Q2 = V.quiz; if (Q2.idx > 0) { Q2.idx--; Q2.picked = new Set(); Q2.judged = false; render(); } break; }
    case 'skip': nextQ(); break;
    case 'fav': { const r = rec(qById(V.quiz.list[V.quiz.idx]).id); r.fav = !r.fav; save(); render(); break; }
    case 'read': { const q = qById(V.quiz.list[V.quiz.idx]); speak(q.stem + '。选项：' + Object.entries(q.opts).map(([k, v]) => k + '，' + v).join('。')); break; }
    case 'flip': V.flash.front = !V.flash.front; render(); break;
    case 'flash-skip': V.flash.idx++; V.flash.front = true; render(); break;
    case 'flash-reset': V.flash.idx = 0; V.flash.front = true; render(); break;
    case 'judge-again': V.judge = { list: shuffle(JUDGE).map(x => x.id), idx: 0, ok: 0, bad: 0 }; render(); break;
    case 'judge-next': V.judge.idx++; V.judge.done = null; render(); break;
    case 'rt': V.reviewTab = b.dataset.t; V.reviewSub = '全部'; render(); break;
    case 'rf': V.reviewSub = b.dataset.s; render(true); break;
    case 'review-start': {
      const t = b.dataset.t, sub = V.reviewSub || '全部';
      const list = reviewBase(t).filter(q => sub === '全部' || q.sub === sub);
      if (!list.length) { toast('这里没有题'); break; }
      startQuiz(list, t === 'wrong' ? '错题重做' : t === 'fav' ? '收藏重做' : '已做重做'); break;
    }
    case 'review-shuffle': {
      const t = b.dataset.t, sub = V.reviewSub || '全部';
      const list = reviewBase(t).filter(q => sub === '全部' || q.sub === sub);
      if (!list.length) { toast('这里没有题'); break; }
      startQuiz(shuffle(list), '乱序重做'); break;
    }
    case 'restart-quiz': {
      const Q = V.quiz;
      const wrongs = Q.list.map(qById).filter(q => S.rec[q.id] && S.rec[q.id].wrong);
      startQuiz(wrongs.length ? wrongs.concat(shuffle(Q.list.map(qById).filter(q => !S.rec[q.id] || !S.rec[q.id].wrong))) : shuffle(Q.list.map(qById)), '再刷一轮');
      break;
    }
    case 'open-q': openQuestion(b.dataset.id); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a2 = document.createElement('a'); a2.href = url; a2.download = '政治刷题记录-' + TODAY() + '.json'; a2.click();
      break;
    }
    case 'import': {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json';
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = () => { try { const o = JSON.parse(rd.result); S = Object.assign(S, o); save(); toast('导入成功'); render(); } catch (e) { toast('文件不对'); } };
        rd.readAsText(f);
      };
      inp.click(); break;
    }
    case 'reset': {
      if (confirm('清空所有学习记录？不可恢复。')) { localStorage.removeItem(KEY); S = JSON.parse(JSON.stringify(DEF)); render(); }
      break;
    }
  }
});

document.addEventListener('input', (e) => {
  const nt = e.target.closest('[data-note]');
  if (nt) { S.notes[nt.dataset.note] = nt.value; save(); return; }
  const t = e.target.closest('[data-set]');
  if (t && t.type === 'range') {
    const k = t.dataset.set;
    S.set[k] = Number(t.value);
    if (k === 'font') document.documentElement.style.setProperty('--fs', t.value + 'px');
    if (k === 'pomo' && !POMO.on) { POMO.left = Number(t.value) * 60; syncPomo(); }
    save();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const Q = V.quiz;
  if (V.view === 'quiz' && Q) {
    const k = e.key.toUpperCase();
    const ord = Q.order || ['A', 'B', 'C', 'D'];
    if ('1234'.includes(k) && !Q.judged) { pick(ord[Number(k) - 1]); return; }
    if ('ABCD'.includes(k) && !Q.judged) { pick(ord['ABCD'.indexOf(k)]); return; }
    if (e.key === 'Enter') {
      if (Q.judged) nextQ();
      else if (qById(Q.list[Q.idx]).type === 'multi') submitMulti();
      return;
    }
  }
  if (e.key === ' ' && V.view === 'cards') { e.preventDefault(); V.flash.front = !V.flash.front; render(); }
});

/* 初始 */
render();
</script>
</body>
</html>
