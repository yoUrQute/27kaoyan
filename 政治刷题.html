神专题研讨班上指出：“正确政绩观要求我们坚持从实际出发、按规律办事，通过科学决策和实干苦干，创造经得起实践和历史检验、真正造福人民、得到群众公认的业绩。”这一要求体现的哲学道理是", "opts": {"A": "自然规律与社会规律具有相同的实现方式", "B": "尊重客观规律与发挥主观能动性是辩证统一的", "C": "社会规律只有被人们认识后才能发挥作用", "D": "客观条件的制约程度取决于主观能动性的发挥程度"}, "ans": "B", "ana": "尊重客观规律是正确发挥主观能动性的前提，只有充分发挥主观能动性，才能正确认识和利用客观规律，实践是二者统一的基础。题干要求“从实际出发、按规律办事”，强调政绩创造必须以客观实际和规律为依据；要求科学决策、实干苦干，强调人在认识和利用规律的过程中要积极发挥主观能动性。二者相结合，体现了尊重客观规律与发挥主观能动性的辩证统一。B 正确。", "dis": "A 错误，自然规律与社会规律都具有客观性，但实现方式不同。自然规律通过自然界的自发运动实现，社会规律通过人的有意识的活动实现，不能将二者的实现方式等同。C 错误，社会规律不以人的意志为转移，其存在和发生作用不以人们是否认识它为条件；认识规律有助于人们自觉利用规律，并不是规律发生作用的前提。D 错误，正确发挥主观能动性要依赖一定的物质条件和物质手段，人的活动受客观条件制约，不能反过来把客观条件的制约程度归结为主观能动性的发挥程度。", "ext": "规律与人的能动性【《手册》第 6 页】 （1）正确发挥主观能动性的前提和途径是什么？ ①尊重客观规律是正确发挥主观能动性的前提。（从实际出发） ②只有充分发挥主观能动性，才能正确认识和利用客观规律。（人不能摆脱、消灭、改造规律本身，但可以 改变规律发挥作用的条件。） ③实践是客观规律性与主观能动性统一的基础。（实践是正确发挥人的主观能动性的根本途径） ④正确发挥人的主观能动性，还要依赖于一定的物质条件和物质手段。 （2）自然规律与社会规律怎样实现？ 共同点 都具有客观性，都具有重复性。 自然规律 自发的、无意识的，没有人的参与（如潮起潮落、太阳东升西落）。 社会规律 自觉的、有意识的，需要人来推动（推动≠改变规律）。", "year": 2027}, {"id": "s1-2", "set": 1, "num": 2, "src": "苏一六套卷（一）", "book": "苏一", "sub": "马原", "type": "single", "stem": "海市蜃楼发生时，远处的山峰、楼宇等景物可能显现在近处地面或空中，而影像显现的位置并不存在这些景物。这种景象也能被相机记录下来。研究发现，不同空气层的密度差异改变了光线的传播路径，使远处景物形成位置偏移的影像。上述现象表明，假象是", "opts": {"A": "从反面歪曲地表现本质的客观现象", "B": "由感官失真造成的主观错觉", "C": "尚未被认识的事物的内在本质", "D": "与事物本质相分离的外部表现"}, "ans": "A", "ana": "现象是事物的外部联系和表面特征，本质是事物的内在联系和根本性质。现象包括真象和假象，二者都是客观的，都表现事物的本质；真象从正面表现本质，假象从反面歪曲地表现本质。海市蜃楼的影像位置与景物的实际位置不同，但这种影像能够被相机记录，其形成也有空气密度差异和光线传播的客观依据。因此，它不是凭空产生的主观感受，而是以歪曲形式表现事物本质的客观现象。A 正确。", "dis": "B 错误，假象属于客观现象，错觉属于主体对客观事物的错误感知，二者不能混同。影像所在位置没有实际景物，并不意味着影像只是感官失真造成的主观错觉。C 错误，本质是事物的内在联系，假象则是本质的一种外在表现；“尚未被认识”不构成区分本质与假象的标准。D 错误，本质与现象相互依存，任何现象都从一定方面表现本质。假象只是表现本质的方式发生了歪曲，并没有与本质相分离。", "ext": "本质、真象、假象与错觉【《手册》第 12 页】 本质与现象 ①本质决定现象，现象一定表现本质。 ②感性认识→现象（真象和假象）；理性认识→本质 真象与假象 ①真象和假象都是客观的现象，都表现事物的本质。 ②真象从正面表现本质，假象从反面歪曲地、颠倒地表现本质。 假象与错觉 错觉是主观的，假象是客观的现象。", "year": 2027}, {"id": "s1-3", "set": 1, "num": 3, "src": "苏一六套卷（一）", "book": "苏一", "sub": "马原", "type": "single", "stem": "马克思说：“纺纱机就是纺棉花的机器。只有在一定关系下，它才成为资本。脱离了这种关系，它就不是资本了。”这里讲的“只有在一定关系下”是指", "opts": {"A": "只有当纺纱机存在于资本主义社会时", "B": "只有当纺纱机直接为资本家创造剩余价值时", "C": "只有当纺纱机用作资本主义生产的手段时", "D": "只有当纺纱机归私人所有时"}, "ans": "C", "ana": "资本是能够带来剩余价值的价值。资本家用纺纱机作为生产资料组织雇佣劳动并占有剩余价值时，这台机器才具有资本的社会属性，C 正确。", "dis": "A 选项，只交代了机器所处的社会环境，与题意不符。B 错误，机器的价值通过具体劳动转移到产品中，剩余价值是由雇佣工人的剩余劳动创造的。机器属于不变资本，本身不会创造价值，只能转移价值。D 错误，个体劳动者也可以私有机器并用它为自己生产。", "ext": "资本在剩余价值生产中的作用 （1）机器在什么条件下成为资本？【《手册》第 35 页】 ①资本是能够带来剩余价值的价值。 ②资本不是物，而是属于一定历史社会形态的生产关系。 ③剩余价值是由雇佣工人的剩余劳动创造的。 （2）不变资本与可变资本怎样区分？【《手册》第 36 页】 根据资本在剩余价值生产中所起的不同作用，可以将资本划分为不变资本与可变资本。 比较角度 不变资本（c） 可变资本（v） 存在形态 以生产资料形态存在的资本。 用来购买劳动力的那部分资本。 价值如何进入产 ①生产资料的价值通过工人的具体劳动被转 ①可变资本的价值是由工人的劳动（抽象劳 品 移到新产品中（注意是转移）。 动）再生产出来。 ②只转移自己的价值量，不发生增殖。 ②不是转移，而是再生产。 还会怎样问 ①转移的价值量不会大于它原有的价值量。 抽象劳动：创造价值，创造劳动力自身的价 ②有的是一次性转移，如原材料和燃料（流 值（可变资本）和剩余价值。 动资本）；有的是多次转移，如机器、厂房 等（固定资本）。 （3）固定资本：不变资本中多次转移部分；流动资本：所有可变资本+不变资本中一次性转移部分 （4）划分意义与剩余价值率【《手册》第 37 页】 ①剩余价值既不是由全部资本创造的，也不是由不变资本创造的。 ②剩余价值是由可变资本雇佣的劳动者创造的。 ③雇佣劳动者的剩余劳动是剩余价值的唯一源泉。 ④剩余价值率（m′）＝剩余价值／可变资本＝剩余劳动时间／必要劳动时间。", "year": 2027}, {"id": "s1-4", "set": 1, "num": 4, "src": "苏一六套卷（一）", "book": "苏一", "sub": "马原", "type": "single", "stem": "马克思在《法兰西内战》中指出：“公社的真正秘密就在于：它实质上是工人阶级的政府，是生产者阶级同占有者阶级斗争的产物，是终于发现的可以使劳动在经济上获得解放的政治形式。”马克思所评价的巴黎公社革命", "opts": {"A": "初步确立了马克思主义在工人运动中的指导地位", "B": "是无产阶级夺取政权的第一次伟大尝试", "C": "实现了社会主义从理想到现实的伟大飞跃", "D": "标志着科学社会主义的公开问世"}, "ans": "B", "ana": "巴黎公社是无产阶级夺取政权的第一次伟大尝试。马克思所说的“工人阶级的政府”和“可以使劳动在经济上获得解放的政治形式”，揭示了巴黎公社的阶级性质和历史意义。B 正确。", "dis": "A 选项，第一国际的成立初步确立了马克思主义在工人运动中的指导地位。C选项，十月革命实现了社会主义从理想到现实的伟大飞跃。D 选项，1848 年《共产党宣言》的发表标志着科学社会主义的公开问世。", "ext": "社会主义从空想到科学、从理想到现实【《手册》第 49—50 页】 科学社会主义创立 ①创立和发展了唯物史观和剩余价值学说，为实现社会主义从空想到科学的飞跃奠 定了坚实的理论基础。 ②1848 年 2 月，《共产党宣言》的发表标志着：马克思主义（即科学社会主义） 的公开问世。 1864 年｜第一国际 ①促进了马克思主义的传播及其与国际工人运动的结合。 ②初步确立了马克思主义在工人运动中的指导地位。 1871 年｜巴黎公社怎样防 ①规定所有公职人员无论职位高低，实行全面的选举制和撤换制。 止公仆变主人？ ②取消高薪制，规定任何工作人员年薪不得超过熟练工人的工薪水平。 列宁｜“一国胜利论” ①经济和政治发展的不平衡是资本主义的绝对规律。 ②社会主义可能首先在少数甚至在单独一个资本主义国家内获得胜利。 1917 年｜十月革命 十月革命实现了社会主义从理想到现实的伟大飞跃，开辟了人类历史的新纪元。", "year": 2027}, {"id": "s1-5", "set": 1, "num": 5, "src": "苏一六套卷（一）", "book": "苏一", "sub": "毛中特", "type": "single", "stem": "毛泽东在《要团结一切可以团结的力量》中指出：“中国的经验，有好的也有不好的，有成功的也有失败的。即使是好的经验，也不一定同别的国家的具体情况相适合。”这一论述对坚持实事求是的启示是", "opts": {"A": "把成功经验上升为理论，是制定正确路线的基本前提", "B": "以本国基本国情为立足点，确定经验借鉴的具体方式", "C": "以各国革命道路的共同性，说明具体政策的适用范围", "D": "推动马克思主义同中华优秀传统文化相结合"}, "ans": "B", "ana": "坚持实事求是，就要清醒认识和正确把握我国基本国情。我们一切路线、方针、政策的制定都应坚持从我国基本国情出发，牢牢立足基本国情这个最大实际，充分体现这个基本国情的必然要求。题干强调，即使是成功的经验，也未必适合别国的具体情况，说明经验能否借鉴、怎样借鉴，要以本国的实际情况为依据。成功经验不能脱离具体国情直接照搬。B 正确。", "dis": "A 选项，制定正确路线要从实际出发，不能把“成功经验上升为理论”作为基本前提。C 选项，各国革命道路的共同性不能代替对具体国情的分析，具体政策是否适用仍要看实际条件。D 选项，题干讨论的是经验借鉴与具体国情的关系，没有涉及同中华优秀传统文化相结合。", "ext": "毛泽东思想活的灵魂：设问落在哪一点？【《手册》第 55—56 页】 提出：1981 年 6 月，党的十一届六中全会通过《关于建国以来党的若干历史问题的决议》，概括了毛泽东思想活 的灵魂。 ①是毛泽东思想的基本点，是毛泽东思想的精髓。 实事求是 ②是中国共产党的思想路线。 群众路线 是我们党的生命线和根本工作路线。 独立自主 是中国共产党、中华人民共和国立党立国的重要原则（根本立足点）。 同样是“走自己的路”，强调检验经验是否适合本国，抓实事求是；强调依靠自己的力量作决定，抓独立自 主。", "year": 2027}, {"id": "s1-6", "set": 1, "num": 6, "src": "苏一六套卷（一）", "book": "苏一", "sub": "毛中特", "type": "single", "stem": "邓小平在谈到经济体制改革时指出：“我们发挥社会主义固有的特点，也采用资本主义的一些方法（是当作方法来用的），目的就是要加速发展生产力。”这里特别强调“是当作方法来用的”，意在说明", "opts": {"A": "解放和发展生产力是社会主义经济体制改革的根本目的", "B": "经济手段的运用可以使不同社会制度的性质趋于一致", "C": "经济手段的借鉴不意味着社会基本制度的改变", "D": "经济体制改革的实质是赋予经济手段以社会制度属性"}, "ans": "C", "ana": "邓小平的社会主义市场经济理论具有丰富的内涵：一是计划经济和市场经济不是划分社会制度的标志，计划经济不等于社会主义，市场经济也不等于资本主义；二是计划和市场都是经济手段，对经济活动的调节各有优劣，社会主义实行市场经济是要把两者优势结合起来；三是市场经济作为资源配置手段本身不具有制度属性，可以和不同的社会制度结合，从而表现出不同的性质。题干特别强调“是当作方法来用的”，说明借鉴的是发展生产力的方法和经济手段，并不意味着改变社会主义基本制度。C 正确。", "dis": "A 选项，说明的是改革的目的，题干所问的是为什么特别强调“当作方法来用”，重在区分经济手段与社会基本制度。B 选项，借鉴经济手段不会使不同社会制度的性质趋于一致。D 选项，改革的实质和目标是要从根本上改变束缚我国生产力发展的经济体制，建立充满生机和活力的社会主义新经济体制，并非赋予经济手段以社会制度属性。", "ext": "社会主义市场经济理论的形成与发展【《手册》第 71 页】 （1）计划、市场与社会制度 ①计划经济和市场经济不是划分社会制度的标志。 ②计划和市场都是经济手段，对经济活动的调节各有优劣，社会主义实行市场经济要把两者优势结合起来。 ③市场经济作为资源配置手段本身不具有制度属性，可以和不同的社会制度结合，从而表现出不同的性质。 （2）历程【《手册》第 71、155 页】 1982 年｜十二大 计划经济为主、市场调节为辅。 提出社会主义经济是公有制基础上的有计划的商品经济，突破把计划经济同商 1984 年｜十二届三中全会 品经济对立起来的观点。 社会主义有计划商品经济的体制，应该是计划与市场内在统一的体制。经济运 1987 年｜十三大 行机制是“国家调节市场，市场引导企业”。 明确计划和市场都是经济手段，从理论上突破把计划经济和市场经济看作制度 1992 年｜南方谈话 属性的观念。标志着邓小平的社会主义市场经济理论的形成。 （3）改革目标、体制框架与市场作用【《手册》第 73、217 页】 确定改革目标：建立社会主义市场经济体制，使市场在社会主义国家宏观调控下对 1992 年｜十四大 资源配置起基础性作用。 1993 年｜十四届三中全会 通过《关于建立社会主义市场经济体制若干问题的决定》，勾画蓝图和基本框架。 ①把发展市场经济同社会主义基本制度结合起来，写入社会主义初级阶段的基本纲 1997 年｜十五大 领。②明确公有制为主体、多种所有制经济共同发展，是我国社会主义初级阶段的 一项基本经济制度。 市场的基础性作用：十六大强调“在更大程度上”，十七大强调“从制度上更 十六大至十八大 好”，十八大强调“更大程度更广范围”。 使市场在资源配置中起决定性作用和更好发挥政府作用。 2013 年｜十八届三中全会 【详见：第 1 套，第 8 题】", "year": 2027}, {"id": "s1-7", "set": 1, "num": 7, "src": "苏一六套卷（一）", "book": "苏一", "sub": "新思想", "type": "single", "stem": "科技成果转化率不高，一直是我们面临的一个突出问题。习近平总书记强调，“要突出科技创新供给和产业需求牵引，推动产学研融通创新，打通科技加速向现实生产力转化的通道。”以高水平科技自立自强引领发展新质生产力的关键是", "opts": {"A": "提高科技创新投入效能", "B": "大力培养优秀青年科技人才", "C": "推动科技创新和产业创新深度融合", "D": "加强科技伦理和安全治理"}, "ans": "C", "ana": "习近平总书记在国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会上的讲话中指出：“第二，推动科技创新和产业创新深度融合。这是以高水平科技自立自强引领发展新质生产力的关键。”C 正确，ABD 不符合题意。", "dis": "", "ext": "从科技自立自强到产业创新：两层“关键” （1）以高水平科技自立自强引领发展新质生产力，关键是什么？推动科技创新和产业创新深度融合。【《手册》第 95 页】 （2）科技创新和产业创新怎样融合？ ①基础：增加高质量科技供给。 ②关键：强化企业科技创新主体地位。 ③途径：促进科技成果转化应用。【《手册》第 201 页】", "year": 2027}, {"id": "s1-8", "set": 1, "num": 8, "src": "苏一六套卷（一）", "book": "苏一", "sub": "新思想", "type": "single", "stem": "在科技创新领域，我国一方面完善激励创新的市场机制，引导创新资源向企业集聚；另一方面加强新技术应用监管，完善科技伦理制度规范。这表明，营造良好的创新环境，需要", "opts": {"A": "统筹科技供给和需求牵引", "B": "坚持因地制宜发展新质生产力", "C": "坚持有效市场和有为政府相结合", "D": "推动教育科技人才一体发展"}, "ans": "C", "ana": "完善激励创新的市场机制、引导创新资源向企业集聚，体现了市场对创新资源配置的作用；加强新技术应用监管、完善科技伦理制度规范，体现了政府为创新活动提供规范和保障。两方面共同体现了坚持有效市场和有为政府相结合。C 正确，ABD 不符合题意。", "dis": "", "ext": "配置资源与履行公共职能【《手册》第 89、200 页】 市场怎样起作用？ 让市场在资源配置中起决定性作用。看到价格、供求、竞争引导创新资源流动，认市场 机制。 政府怎样起作用？ 更好发挥政府作用。看到制定规则、实施监管、提供公共服务，认政府履责。", "year": 2027}, {"id": "s1-9", "set": 1, "num": 9, "src": "苏一六套卷（一）", "book": "苏一", "sub": "新思想", "type": "single", "stem": "农业农村现代化关系中国式现代化全局和成色。“十五五”时期是基本实现社会主义现代化夯实基础、全面发力的关键时期，要加快补上农业农村领域突出短板，加快建设农业强国。农业生产的重中之重是", "opts": {"A": "保障粮食等重要农产品稳定供给", "B": "一体化推进乡村生态保护修复", "C": "积极促进农民稳定增收", "D": "推动城乡要素双向流动"}, "ans": "A", "ana": "习近平总书记指出，保障粮食等重要农产品稳定供给是农业生产的重中之重。A正确，BCD 不符合题意。", "dis": "", "ext": "农业、农村、农民：先看设问的对象 ①问农业生产，先看农产品供给。农业生产的重中之重是保障粮食等重要农产品稳定供给。【《手册》第 92 页】 问保障粮食安全的关键，记藏粮于地、藏粮于技。【《手册》第 197 页】 ②问农村建设，看乡村的生活条件。题里出现村庄道路、污水治理、人居环境，落到农村建设。 ③问农民生活，看收入怎样增加。题里出现就业渠道、工资性收入，落到农民增收。", "year": 2027}, {"id": "s1-10", "set": 1, "num": 10, "src": "苏一六套卷（一）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "鸦片战争以后，由于西方列强入侵和封建统治腐败，中国逐步成为半殖民地半封建社会，国家蒙辱、人民蒙难、文明蒙尘，中华民族遭受了前所未有的劫难。从那时起，中国社会发生两个根本变化：一是独立的中国逐步变成半殖民地的中国，二是封建的中国逐步变成半封建的中国。这种半殖民地半封建社会，是近代以来中国在外国资本-帝国主义势力入侵及其与中国封建主义势力相结合条件下，逐步形成的一种", "opts": {"A": "独立于资本主义世界体系之外的社会形态", "B": "由封建社会正常过渡到资本主义社会的社会形态", "C": "从属于资本主义世界体系的畸形社会形态", "D": "以民族资本主义经济为主要形式的社会形态"}, "ans": "C", "ana": "鸦片战争以后，由于西方列强入侵和封建统治腐败，中国逐步成为半殖民地半封建社会，国家蒙辱、人民蒙难、文明蒙尘，中华民族遭受了前所未有的劫难。从那时起，中国社会发生两个根本变化：一是独立的中国逐步变成半殖民地的中国，二是封建的中国逐步变成半封建的中国。这种半殖民地半封建社会（中国的社会性质），是近代以来中国在外国资本-帝国主义势力入侵及其与中国封建主义势力相结合条件下，逐步形成的一种从属于资本主义世界体系的畸形社会形态。C 正确。", "dis": "A 选项，外国资本-帝国主义列强用武力打开中国的门户，把中国卷入世界资本主义经济体系和世界市场之中，并非“独立于资本主义世界体系之外”。B 选项，资本-帝国主义列强并不容许中国成为独立的资本主义国家。中国的经济是半殖民地半封建的经济，并非由封建社会正常过渡到资本主义社会。D 选项，中国的民族资本主义经济虽然有了某些发展，但是并没有也不可能成为中国社会经济的主要形式。", "ext": "半殖民地、半封建各从哪里看？【《手册》第 118 页】 半殖民地｜主权 看条约损害了哪些主权。割地涉及领土主权，协定关税涉及关税主权。中国已经丧失了 完全独立的地位，但仍然维持着独立国家和政府的名义，还有一定的主权。 半封建｜经济结构 看经济里旧关系和新关系各占什么地位。①列强入侵破坏了中国自然经济的基础，中国 出现了资本主义生产关系。②在中国农村中，封建生产关系在社会经济生活中依然占着 显然的优势。 （1）《南京条约》：中国开始沦为半殖民地半封建社会。 （2）《辛丑条约》：中国完全沦为半殖民地半封建社会。", "year": 2027}, {"id": "s1-11", "set": 1, "num": 11, "src": "苏一六套卷（一）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "从 1927 年 7 月大革命失败到 1935 年 1 月遵义会议召开前，“左”倾错误先后三次在党中央领导机关取得了统治地位。王明等人的“左”倾教条主义错误，其最大的恶果，就是使红军在第五次反“围剿”作战中遭到失败，不得不退出南方根据地实行战略转移——长征。遵义会议后，中央红军采取灵活机动的战略战术，四渡赤水河，巧渡金沙江，摆脱了数十万国民党军队的围追堵截，赢得了战争的主动权。随后，强渡大渡河，飞夺泸定桥，翻越人迹罕至、终年积雪的夹金山。发生这一变化的重要原因在于党", "opts": {"A": "确立了思想建党、政治建军原则", "B": "明确提出了“马克思主义的中国化”命题", "C": "坚持真理、修正错误，创造性地制定和实施符合中国革命特点的战略策略", "D": "制定了动员全民族力量争取抗战胜利的全面抗战路线"}, "ans": "C", "ana": "遵义会议是党的历史上一个生死攸关的转折点。这次会议事实上确立了毛泽东在党中央和红军的领导地位，在最危急关头挽救了党、挽救了红军、挽救了中国革命。遵义会议的鲜明特点是坚持真理、修正错误，确立党中央的正确领导，创造性地制定和实施符合中国革命特点的战略策略。题干将遵义会议前后的军事斗争状况作了对比：①此前，王明等人的“左”倾教条主义错误导致第五次反“围剿”失败；②遵义会议后，中央红军采取灵活机动的战略战术，摆脱围追堵截，赢得战争主动权。从错误指导下的失利到调整战略战术后赢得主动，体现了党坚持真理、修正错误，创造性地制定和实施符合中国革命特点的战略策略。C 正确。", "dis": "A 选项，1929 年 12 月召开的古田会议确立了思想建党、政治建军原则。B 选项，1938 年，在党的六届六中全会上，毛泽东明确提出“马克思主义的中国化”命题。D选项，1937 年 8 月，中国共产党在陕北召开了洛川会议，制定了抗日救国十大纲领，强调要打倒日本帝国主义，关键在于使已经发动的抗战成为全面的全民族抗战。A 项发生于题干所述转变之前，B、D 项发生于这一转变之后，均不能说明题干中军事指导发生的变化。", "ext": "先认会议，再顺着长征进程记转折 （1）1929 年 12 月·古田会议：在农村环境中怎样建党、建军？【《手册》第 135、214 页】 ①大会通过古田会议决议，确立了思想建党、政治建军原则。 ②决议的中心思想是用无产阶级思想进行军队和党的建设。 ③红军是一个执行革命的政治任务的武装集团，必须绝对服从共产党的领导。红军必须担负打仗、筹款和做 群众工作的任务。 ④党对军队的绝对领导，发端于南昌起义、奠基于三湾改编、定型于古田会议。 （2）1938 年 9 月至 11 月·党的六届六中全会：全国抗战时期怎样统一全党思想？【《手册》第 53、214 页】 ①毛泽东作《论新阶段》的报告，标志着“马克思主义的中国化”这一命题的正式提出。 ②全会基本纠正了王明的右倾错误。 ③进一步巩固了毛泽东在全党的领导地位。 ④统一了全党的思想和步调，推动了各项工作迅速发展。 （3）长征怎样从战略转移走向胜利？【《手册》第 136—137 页】 ①1934 年 10 月·开始长征 第五次反“围剿”失败，中央红军被迫实行战略转移。 ②1934 年 11 月 25 日至 12 月 1 日·湘江战役 中央红军突破第四道封锁线。这是中央红军长征以来最为惨 烈的一仗。湘江战役的重大损失，加深了广大干部和战士对错误军事指挥的怀疑。 ③1935 年 1 月·遵义会议 集中解决了当时具有决定意义的军事问题和组织问题。 ④1935 年 1 月至 3 月·四渡赤水 中央红军变被动为主动，粉碎了蒋介石围歼红军于川、黔、滇边境的计 划，取得了战略转移中具有决定意义的胜利。 1935 年 10 月 19 日陕甘支队抵达陕北吴起镇；11 月初，在甘泉地区同在陕甘根据地的红十 ⑤中央红军主力 五军团会合，至此，中央红军主力（红一方面军）行程二万五千里的长征胜利结束。 1936 年 10 月，红四、红二方面军先后同红一方面军在甘肃会宁、将台堡会师，标志着三 ⑥三大主力红军 大主力红军长征胜利结束。 ①极大促进了党在政治上和思想上的成熟，是中国革命转危为安的关键。 ⑦长征胜利的意义 ②实现了中国共产党和中国革命事业从挫折走向胜利的伟大转折。 （4）遵义会议【《手册》第 136、214 页】 集中解决 集中解决了当时具有决定意义的军事问题和组织问题。 坚持真理、修正错误，确立党中央的正确领导，创造性地制定和实施符合中国革命特点的战略策 鲜明特点 略。 ①事实上确立了毛泽东在党中央和红军的领导地位。 领导地位 ②开始确立了以毛泽东为主要代表的马克思主义正确路线在党中央的领导地位。 ③开始形成以毛泽东同志为核心的第一代中央领导集体。 ①是党的历史上一个生死攸关的转折点，在最危急关头挽救了党、挽救了红军、挽救了中国革命。 历史转折 ②结束了“左”倾教条主义错误在中央的统治。 ③开启了中国共产党独立自主解决中国革命实际问题的新阶段。", "year": 2027}, {"id": "s1-12", "set": 1, "num": 12, "src": "苏一六套卷（一）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "1935 年，华北事变使中日民族矛盾进一步激化，民族危机日益严重。同年 12 月，中共中央在陕北瓦窑堡召开政治局扩大会议，批评了党内长期存在的“左”倾冒险主义、关门主义错误倾向。这次会议提出党的基本策略任务是", "opts": {"A": "组织全国军事总动员和全国人民总动员", "B": "建立广泛的抗日民族统一战线", "C": "用无产阶级思想进行军队和党的建设", "D": "在农村根据地广泛开展土地革命"}, "ans": "B", "ana": "华北事变后，中日民族矛盾进一步激化。1935 年 12 月，中共中央在陕北瓦窑堡召开政治局扩大会议，提出党的基本策略任务是建立广泛的抗日民族统一战线，批评了党内长期存在的“左”倾冒险主义、关门主义错误倾向。中国共产党在新的历史时期即将到来时掌握了政治主动权。题干中的“民族危机日益严重”说明团结各方面力量共同抗日的迫切性。B 正确。", "dis": "A 选项，1937 年 8 月，洛川会议制定了抗日救国十大纲领，强调要打倒日本帝国主义，关键在于使已经发动的抗战成为全面的全民族抗战。为此，必须实行全国军事总动员、全国人民总动员。C 选项，用无产阶级思想进行军队和党的建设，是 1929 年古田会议决议的中心思想。D 选项，在农村根据地广泛开展土地革命，是土地革命战争前期的任务；瓦窑堡会议标志着党的政策向抗日民族统一战线调整。", "ext": "抗日民族统一战线：从提出策略到正式形成【《手册》第 138—139 页】 时间 事件 推进到哪一步？ 1935 年 12 月 瓦窑堡会议 华北事变后，团结哪些力量共同抗日？ ①提出党的基本策略任务是建立广泛的抗日民族统一战线。 ②批评了党内长期存在的“左”倾冒险主义、关门主义错误倾向，决 定用“人民共和国”口号代替“工农共和国”。 1936 年 12 月 西安事变和平解决 西安事变的和平解决成为：时局转换的枢纽，十年内战局面基本结 束，国内和平初步实现。 1937 年 8 月 洛川会议 全面抗战开始后，怎样动员全国力量？ ①制定了抗日救国十大纲领，强调要打倒日本帝国主义，关键在于使 已经发动的抗战成为全面的全民族抗战 ②必须实行全国军事总动员、全国人民总动员。 1937 年 9 月 第二次国共合作正 ①1937 年 9 月 22 日，国民党中央通讯社发表《中共中央为公布国共合 式形成 作宣言》。 ②1937 年 9 月 23 日，蒋介石发表实际上承认共产党合法地位的谈话。", "year": 2027}, {"id": "s1-13", "set": 1, "num": 13, "src": "苏一六套卷（一）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "中国革命的发生和胜利，有着深刻的社会根源和雄厚的群众基础。工人、农民、城市小资产阶级群众是民主革命的主要力量。随着斗争的发展，还出现了被人称作“开万国未有之奇”的现象。这一现象是指", "opts": {"A": "民族资产阶级逐步向中国共产党靠拢", "B": "工人阶级开始以独立的姿态登上政治舞台", "C": "广大农民成为人民解放战争的重要支持力量", "D": "知识分子开始走上同工农群众相结合的道路"}, "ans": "A", "ana": "中国革命的发生和胜利不是偶然的，而是有着深刻的社会根源和雄厚的群众基础。工人、农民、城市小资产阶级群众是民主革命的主要力量。在他们中间，涌现出了无数无畏的英雄和不屈的战士。随着斗争的发展，民族资产阶级也逐步向共产党靠拢，这种现象曾经被人称作“开万国未有之奇”。没有广大人民和各界人士的广泛参加和大力支持，中国革命的胜利是不可能的。A 正确。", "dis": "B 选项，中国工人阶级开始以独立的姿态登上政治舞台，发生于 1919 年五四运动期间。C 选项，解放区土地改革使广大农民的政治觉悟和组织程度空前提高，人民解放战争获得源源不断的人力、物力支援，为打败蒋介石、建立新中国奠定了深厚的群众基础。D 选项，知识分子走上同工农群众相结合的道路，是五四运动后革命知识分子的发展方向，属于革命力量的结合形式。上述内容均不是题干中“开万国未有之奇”所指的现象。", "ext": "中国共产党同民主党派的合作历程【《手册》第 147 页】 ①得到各民主党派和社会各界的热烈响应。 1948 年 4 月 30 日｜中共中央发 ②揭开了中国共产党同各党派、各团体、各族各界人士协商建国的序幕。 出“五一口号” ③奠定了中国共产党领导的多党合作和政治协商制度的基础。 ①民主党派和无党派民主人士 55 人联合发表《对时局的意见》。 1949 年 1 月｜《对时局的意见》 ②中国各民主党派和无党派民主人士公开自愿接受中国共产党的领导。 ③决心走人民革命的道路，拥护建立人民民主的新中国。 ①民主党派应“积极参政，共同建设新中国”。 1949 年春｜毛泽东同有关人士谈 ②这标志着民主党派地位的根本变化，即它们不再是旧中国反动政权下的在 话 野党，而将在中国共产党领导下，共同担负起管理国家和建设新中国的历史 重任。", "year": 2027}, {"id": "s1-14", "set": 1, "num": 14, "src": "苏一六套卷（一）", "book": "苏一", "sub": "思法", "type": "single", "stem": "无私奉献、专门利人，立足岗位、尽职尽责，诚实劳动、合法经营并获取正当的个人利益，都可以成为为人民服务的具体实践。这表明，为人民服务", "opts": {"A": "是中华传统美德的根本要求", "B": "是社会主义道德建设的基本原则", "C": "是先进性要求与广泛性要求相统一的道德要求", "D": "是社会主义职业道德中最高层次的要求"}, "ans": "C", "ana": "无私奉献、专门利人体现较高层次的道德追求，立足岗位、尽职尽责以及诚实劳动、合法经营并获取正当个人利益，也可以成为为人民服务的具体实践。这表明，为人民服务是先进性要求与广泛性要求相统一的道德要求，C 正确。", "dis": "A 选项，中华传统美德的根本要求是“公义胜私欲”，为人民服务是社会主义道德建设的核心。B 选项，社会主义道德建设的基本原则是集体主义。D 选项，社会主义职业道德中最高层次的要求是奉献社会。", "ext": "社会主义道德建设的核心与原则【《手册》第 165 页】 核心｜为人民服务 ①为人民服务是社会主义经济基础和人际关系的客观要求，是社会主义市场经济健康发 展的要求。 ②为人民服务是先进性要求和广泛性要求的统一。 ③为人民服务是社会主义道德区别和优越于其他社会形态道德的显著标志。 原则｜集体主义 ①集体主义强调国家利益、社会整体利益和个人利益的辩证统一。 ②集体主义强调国家利益、社会整体利益高于个人利益。 ③集体主义重视和保障个人的正当利益。", "year": 2027}, {"id": "s1-15", "set": 1, "num": 15, "src": "苏一六套卷（一）", "book": "苏一", "sub": "时政", "type": "single", "stem": "全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路。推进全面从严治党，要健全固本培元、凝心铸魂的教育体系，推动党员、干部把党的创新理论转化为坚定理想信念、强大精神动力和出色工作业绩。党的二十届五中全会提出，全面从严治党的根本性任务是", "opts": {"A": "正风肃纪", "B": "增强党性", "C": "从严治吏", "D": "惩治腐败"}, "ans": "B", "ana": "党的二十届五中全会提出，“增强党性是全面从严治党的根本性任务。”B 正确。", "dis": "A 项，正风肃纪是全面从严治党的有力举措。C 项，全面从严治党关键在从严治吏。D 项，保持惩治腐败高压态势是反腐败斗争的具体要求。ACD 均不符合题意。", "ext": "二十届五中全会：增强党性是全面从严治党的根本性任务。", "year": 2027}, {"id": "s1-16", "set": 1, "num": 16, "src": "苏一六套卷（一）", "book": "苏一", "sub": "时政", "type": "single", "stem": "2026 年 10 月 30 日，习近平主席在北京同德国总统施泰因迈尔举行会谈。谈及中欧关系时，习近平主席指出，中欧合作大于竞争、共识大于分歧，合作中出现的问题是发展中的问题、前进中的矛盾。中欧经贸关系的本质是", "opts": {"A": "相互尊重、互谅互让", "B": "求同存异、守正创新", "C": "平等互利、战略稳定", "D": "优势互补、互利共赢"}, "ans": "D", "ana": "习近平主席在同德国总统施泰因迈尔会谈时指出：“中欧经贸关系的本质是优势互补、互利共赢。”D 正确。", "dis": "A 选项，对应中欧彼此成就的路径，B 选项，对应中欧协同发展的关键，C 选项，对应中德双方应共同打造的合作新范式。题干考查中欧经贸关系的本质，ABC 均不符合题意。二、多项选择题：17～33 小题，每小题 2 分，共 34 分。下列每题给出的四个选项中，至少有两个选项是符合题目要求的。", "ext": "中欧经贸关系的本质＝优势互补、互利共赢。", "year": 2027}, {"id": "s1-17", "set": 1, "num": 17, "src": "苏一六套卷（一）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "赤水河流经云、贵、川三省。过去，各地保护规划、执法标准和协调机制缺乏衔接，跨省交界地带成为监管的薄弱环节。三省共同明确保护目标、原则和禁止性规定，再分别制定适合本省的保护条例，并开展联合巡护和执法。这些治理举措体现的哲学道理有", "opts": {"A": "流域各地之间的生态联系以共同保护目标的确立为前提", "B": "事物之间的客观联系是人们开展协同活动的依据", "C": "系统内部各要素的相互作用影响系统的功能", "D": "矛盾的普遍性寓于特殊性之中并通过特殊性表现出来"}, "ans": "BCD", "ana": "联系是事物内部各要素之间和事物之间相互影响、相互制约、相互作用的关系，具有客观性。赤水河流域各地的生态联系是客观存在的，三省据此开展跨区域协同保护，说明客观联系是协同活动的依据，B 正确。系统的功能与内部各要素的相互作用密切相关。过去规划、标准和机制缺乏衔接，导致监管薄弱；通过衔接保护规定、开展联合巡护和执法，可以改善系统内部的协调关系，提高流域治理效能，C 正确。矛盾的普遍性寓于特殊性之中，并通过特殊性表现出来。共同保护目标和原则通过适合各省实际的具体条例得到落实，体现了共性与个性的统一，D 正确。", "dis": "A 错误，联系是事物本身所固有的，不以人的意志为转移。流域各地之间的生态联系并不以共同保护目标的确立为前提，恰恰是这种客观联系构成了确立共同保护目标的依据。共同目标能够指导协同治理，却不能创造流域原有的生态联系。", "ext": "联系、系统、矛盾的普遍性【《手册》第 7—8 页】 客观性 事物的联系是事物本身所固有的、不以人的意志为转移的。自在事物和人为事物的联 系都具有客观性。 普遍性 ①任何事物内部的不同部分和要素之间都是相互联系的。 ②任何事物都不能孤立存在，都同其他事物处于一定的联系之中。 ③整个世界是相互联系的统一整体。世界的普遍联系是通过中介实现的。 多样性 ①世界上的事物是多样的，事物之间的联系也是复杂多样的。 ②主要方式有直接与间接联系、内部与外部联系、本质与非本质联系、必然与偶然联 系。 条件性 ①条件对事物发展和人的活动具有支持或制约作用。 ②条件是可以改变的。 ③改变和创造条件不是任意的，必须尊重事物发展的客观规律。 系统思维能力 从事物相互联系的各个方面及其结构和功能进行系统思考的能力，是全面系统地分析和 处理问题的能力。 普遍性与特殊性 ①共性寓于个性之中，没有离开个性的共性，也没有离开共性的个性。②人的认识的一 般规律就是由认识个别上升到认识一般，再由认识一般到认识个别的辩证发展过程。", "year": 2027}, {"id": "s1-18", "set": 1, "num": 18, "src": "苏一六套卷（一）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "弱等效原理认为，在相同引力条件下，物体的自由落体加速度与其质量和内部结构无关。我国科研人员利用天宫空间站上的冷原子干涉仪，比较两种同位素原子的自由落体行为，通过抑制平台运动干扰、校正系统误差等措施提高检验精度。经过长期观测，在当前精度下未发现违背这一原理的现象。这一实验表明", "opts": {"A": "科学实验能够检验理论认识是否符合客观实际", "B": "理论推演的逻辑严密性能够保证其结论与客观实际相符合", "C": "实践标准实质上决不能完全地证实或驳倒人类的任何表象", "D": "实验手段和条件的改进能够提高实践检验的能力"}, "ans": "ACD", "ana": "实践是检验真理的唯一标准。真理的本性在于主观与客观相符合，实践能够把主观认识同客观实际联系起来，并以实际结果检验认识。科研人员通过比较两种同位素原子的自由落体行为检验弱等效原理，体现了科学实验对理论认识的检验作用，A 正确。实践标准具有不确定性，即任何具体实践都受到一定主客观条件的制约，不可能一次证实或驳倒一切认识。“不能完全地证实或驳倒”不等于实践不能检验认识，而是不能把一次具体检验当作最终结论。题干中“在当前精度下”未发现违背原理的现象，说明实验结论受到现有仪器、技术等条件的限制，C 正确。实践是不断发展的，实践的发展为检验认识提供新的条件。抑制平台运动干扰、校正系统误差，提高了检验精度，体现了实验手段和条件的改进能够提高实践检验的能力，D 正确。", "dis": "B 错误，逻辑证明可以在探索真理、论证真理的过程中发挥重要的补充作用，但不能取代实践成为检验真理的标准。推演合乎逻辑，并不能单独证明其前提符合实际、适用条件已经具备，因而不能仅凭逻辑严密性保证结论与客观实际相符合。", "ext": "实践为什么是唯一标准？为什么还要反复检验？【《手册》第 20 页】 ①真理的本性在于主观和客观相符合。 ②实践具有直接现实性。 表现 确定性（绝对性、唯一性） 不确定性（相对性、条件性） ① 标准与条 实践是检验真理的唯一标准，此外再 任何实践都会受到主客观条件的制约，因而都具有 件 无别的标准。 不可能完全证实或驳倒一切认识的局限性。 ② 检验结果 凡经过实践证明了的一切认识都是客 与过程 观真理，都具有不可推翻的性质。 实践检验真理是一个过程，不是一次完成的。 （在实践已证实的范围内成立。） ③ 实践的发 对于有些认识，当前的实践不能检 展 验，但不断发展着的实践终能验证它 已被实践检验过的真理还要继续经受实践的检验。 是否具有真理性。", "year": 2027}, {"id": "s1-19", "set": 1, "num": 19, "src": "苏一六套卷（一）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "随着网络交往的发展，“不好意思”被说成“抱一丝”，“阴阳怪气”被缩写为“yygq”。人们运用谐音、缩写等方式加工已有语言材料，用以表达情绪、交流感受，有些表达还成为特定群体相互识别的符号。传统隐语、字谜中的某些表达手法，也在新的交往情境中获得了新的用途。这表明", "opts": {"A": "意识的创造性表现为对已有认识材料的加工和重组", "B": "语言符号的含义源于主体对表达形式的自主选择", "C": "社会意识的变化归根到底是社会存在变化的反映", "D": "语言的变化是推动社会意识发展的决定性因素"}, "ans": "AC", "ana": "意识具有创造性，能够对已有的表象和概念进行加工、改造和重新组合，形成新的认识。人们利用谐音、缩写加工已有语言材料，并使传统表达手法获得新的用途，体现了意识对认识材料的能动加工和重组，A 正确。社会存在决定社会意识，社会存在是社会意识内容的客观来源；随着社会存在的发展，社会意识也相应地或迟或早地变化和发展。网络交往的发展和新的群体交往需要，在语言表达及其使用方式中得到反映，说明社会意识的变化归根到底是社会存在变化的反映，C 正确。", "dis": "B 错误，意识的内容来源于客观世界，语言符号的含义形成于人的社会实践和交往之中。主体可以选择、创造表达形式，但不能据此把符号含义的来源归结为形式选择。“抱一丝”是对既有表达形式的加工，并不意味着其表达的社会生活内容由形式选择产生。D 错误，语言是思想交流的重要工具，语言变化能够影响社会意识的表达和传播，但社会意识发展的决定性因素是社会存在的发展变化，不能把语言的作用夸大为决定作用。", "ext": "从意识的本质到社会意识的相对独立性 （1）意识的起源与语言的作用【《手册》第 5、7 页】 ①意识是自然界长期发展的产物。 ②意识也是社会历史发展的产物。社会实践，特别是劳动，在意识的产生和发展中起着决定性的作用。 ③语言促进了意识的发展。语言是意识的物质外壳。想法可以用声音表达，也可以用文字记录，别人由此听 到或读到你所表达的意思。 （2）意识的本质【《手册》第 6 页】 ①意识是人脑的机能和属性，是客观世界的主观映象。 ②意识是客观内容和主观形式的统一。 ③无论意识正确与否都可以在物质世界找到其“原型”。 （3）社会存在决定社会意识，社会意识是社会存在的反映【《手册》第 23 页】 ①社会存在是社会意识内容的客观来源。 ②社会意识是人们进行社会物质交往的产物。 ③随着社会存在的发展，社会意识也相应地或早或迟地变化和发展，但不管怎样变化和发展，其根源总是深 藏于经济事实当中。 （3）社会意识相对独立性的表现 ①社会意识与社会存在发展具有不完全同步性和不平衡性。 ②社会意识内部各种形式之间存在相互影响且各自具有历史继承性。 ③社会意识对社会存在具有能动的反作用，这是社会意识相对独立性的突出表现。", "year": 2027}, {"id": "s1-20", "set": 1, "num": 20, "src": "苏一六套卷（一）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "马克思在分析商品的成本价格和利润时指出：“资本家即使低于商品的价值出售商品，也可以得到利润。”在这种情况下", "opts": {"A": "商品的售价高于其成本价格", "B": "商品的售价高于其生产价格", "C": "资本家出售该商品所获得的利润小于该商品所包含的剩余价值", "D": "商品售价的降低会使生产该商品时创造的剩余价值减少"}, "ans": "AC", "ana": "商品的价值由不变资本 c、可变资本 v 和剩余价值 m 三部分构成，即商品价值等于成本价格加剩余价值。成本价格（生产成本）为 c+v，是资本家生产商品的实际资本耗费。利润是剩余价值的转化形式，只要商品售价高于成本价格，资本家就能获得利润。题中售价低于价值却仍有利润，说明售价超过成本价格。商品中包含的剩余价值是生产过程中已经创造的定量；低于价值出售意味着只实现了一部分剩余价值，因此资本家实际获得的利润量，小于该商品生产中创造的全部剩余价值。AC 正确。", "dis": "B 错误，生产价格等于成本价格加平均利润，题干没有给出实际利润与平均利润的大小关系，不能断定售价高于生产价格。D 错误，剩余价值在生产过程由工人剩余劳动创造，售卖价格只影响剩余价值的实现程度，不会改变已经创造出来的剩余价值量。", "ext": "剩余价值、利润与商品售价 （1）剩余价值怎样取得利润的形式？【《手册》第 36、41 页】 ①剩余价值是雇佣工人创造的、被资本家无偿占有的超过劳动力价值的那部分价值。它来自雇佣工人的剩余 劳动。 ②资本家把剩余价值看作全部预付资本的产物或增加额，剩余价值便取得了利润的形态。剩余价值是利润的 本质，利润是剩余价值的转化形式。 ③剩余价值率反映资本家对工人的剥削程度。利润率＝剩余价值／全部预付资本，反映预付总资本的增殖程 度。同一笔剩余价值，计算利润率时分母更大，利润率就更低。 （2）成本价格、商品价值与生产价格【《手册》第 195 页】 成本价格 c＋v 商品的总价值 W＝c＋v＋m 生产价格 生产价格=成本价格＋平均利润 c 为耗费的不变资本价值，v 为可变资本，m 为剩余价值。 （3）为什么商品包含的剩余价值和实际得到的利润可以不同？【《手册》第 33、42 页】 价值规律的表现形式是商品的价格围绕商品的价值自发波动。利润来自剩余价值；一件商品按什么价格卖 出，影响的是这笔剩余价值实现了多少。 成本 80 元，商品价值 100 元，生产中已创造的剩余价值是 100－80＝20 元。 ①按价值卖 100 元，实际利润＝100－80＝20 元。 ②低于价值卖 90 元，实际利润＝90－80＝10 元。少实现的 10 元发生在出售环节。 本题条件为成本价格＜实际售价＜商品价值。平均利润未知，无法判断实际售价与生产价格谁高。", "year": 2027}, {"id": "s1-21", "set": 1, "num": 21, "src": "苏一六套卷（一）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "恩格斯在考察资本主义大工业时指出，同一工业部门的大生产者曾组成联盟，共同规定总产量，在成员之间分配产量，并统一规定售价。但这种联盟一遇到经济不景气往往就会瓦解。即使协议得以维持，联盟仍要面对其他企业的竞争。这表明", "opts": {"A": "垄断没有消除产生竞争的经济条件", "B": "垄断组织内部的竞争始于垄断协议的瓦解", "C": "垄断组织内部各成员之间仍然存在利益冲突", "D": "垄断组织必须通过竞争维持其垄断地位"}, "ans": "ACD", "ana": "垄断没有消除商品经济和资本主义私有制，因而没有消除产生竞争的经济条件。联盟成员争夺产量份额，说明内部利益冲突仍然存在；联盟对外争夺原料和市场，说明垄断必须通过竞争来维持。ACD 正确。", "dis": "B 错误，即使协议仍在执行，成员之间也存在产量和市场份额之争，协议瓦解并非竞争的起点。", "ext": "垄断与竞争【《手册》第 44 页】 （1）垄断为什么不能消除竞争？ ①垄断没有消除产生竞争的经济条件。 ②垄断必须通过竞争来维持。 ③社会生产是复杂多样的，任何垄断组织都不可能把包罗万象的社会生产全部包下来。 结论：垄断条件下，竞争变得更加复杂、激烈。 （2）与自由竞争相比，竞争发生了什么变化？ 自由竞争 垄断条件下的竞争 目的 获得更多的利润或超额利润，不 获取高额垄断利润，并不断巩固和扩大自己的垄断地位。 断扩大资本的积累。 手段 除了采取经济手段外，还采取非经济手段，使竞争变得更加复杂、 主要运用经济手段。 激烈。 范围 主要在经济领域（国内市场）。 竞争规模扩大，范围遍及各个领域和部门，并由国内扩展到国外。 毛中特（5—6 单选；22 多选）", "year": 2027}, {"id": "s1-22", "set": 1, "num": 22, "src": "苏一六套卷（一）", "book": "苏一", "sub": "毛中特", "type": "multi", "stem": "毛泽东在《论十大关系》中提出，要“努力把党内党外、国内国外的一切积极的因素，直接的、间接的积极因素，全部调动起来”，为社会主义建设服务。这一方针要求在社会主义建设中", "opts": {"A": "创造条件，促使消极因素向积极因素转化", "B": "消除社会矛盾，实现民族大团结", "C": "坚持中国共产党的领导，发展社会主义民主政治", "D": "统筹经济建设与政治、思想文化领域的关系，调动各方面的力量"}, "ans": "ACD", "ana": "①社会主义建设的积极因素与消极因素在一定条件下是可以互相转化的。我们的任务是创造条件，大力促使消极因素比较多、比较快地向积极因素转化，并同时尽力防止积极因素向消极因素逆转，A 正确。②调动一切积极因素为社会主义事业服务，必须坚持中国共产党的领导；调动一切积极因素为社会主义事业服务，必须发展社会主义民主政治，C 正确。③为了贯彻这一方针，报告从十个方面论述了我国社会主义建设需要重点把握的一系列重大关系，内容涉及生产力和生产关系、经济基础和上层建筑各方面。“十大关系”前五条主要讨论经济问题，着眼于调动经济领域各个方面的积极因素；后五条论述的是政治生活和思想文化生活领域如何调动各种积极因素的问题。这说明，调动积极因素既涉及经济领域，也涉及政治生活和思想文化生活领域，D 正确。", "dis": "B 错误，矛盾具有普遍性，社会主义社会同样客观存在各类社会矛盾，只能通过正确区分、合理化解来推动社会发展，不可能“消除社会矛盾”。", "ext": "《论十大关系》与社会主义建设道路的初步探索 （1）时间、背景与基本方针【《手册》第 66、152 页】 ①国内：“一五”计划的实践使我国积累了建设的初步经验。②国际：1956 年 2 月苏共二十大进一步暴露了苏联 建设中的缺点和错误，促使中国共产党人决定以苏为鉴，探索适合中国情况的社会主义建设道路。③在听取中央 有关部门工作汇报的基础上，毛泽东于 1956 年 4 月 25 日在中央政治局扩大会议上作报告，5 月 2 日在最高国务会 议上进一步阐述。基本方针是调动一切积极因素为社会主义事业服务。 （2）十大关系的三组核心考点【《手册》第 66—67 页】 前三条 ①重工业和轻工业、农业的关系。②沿海工业和内地工业的关系。③经济建设和国防 中国工业化道路 建设的关系。这实际上是在论述如何开辟一条和苏联有所不同的中国工业化道路。 ④国家、生产单位和生产者个人的关系：兼顾国家、集体和个人三方面的利益。⑤中 第四、第五条 央和地方的关系：在巩固中央统一领导的前提下扩大地方权力，发挥中央和地方两个 经济体制改革 积极性。 后五条 ⑥汉族和少数民族：民族团结。⑦党和非党：长期共存、互相监督。⑧革命和反革 政治生活和思想文化 命：区别对待。⑨是非关系：惩前毖后、治病救人。⑩中国和外国：有分析地学习外 生活 国长处。 （3）根本思想、历史地位与意义【《手册》第 66 页】 ①明确了建设社会主义必须根据本国情况走自己的道路这一根本思想。 ②标志着党探索中国社会主义建设道路的良好开端。 ③从经济方面和政治方面提出了新的指导方针，为中共八大的召开作了理论准备。 （4）社会主义建设初期的四个时间节点 1956 年 4 月、5 月 《论十大关系》：以苏为鉴，探索适合中国情况的社会主义建设道路。 中共八大：判断国内主要矛盾，提出在新的生产关系下保护和发展生产力。【详见： 1956 年 9 月 第 1 套，第 29 题】 农业、手工业和资本主义工商业的社会主义改造基本完成，标志着社会主义基本制 1956 年底 度在中国确立。【《手册》第 65、152 页】 《关于正确处理人民内部矛盾的问题》报告：系统论述社会主义社会矛盾的理论， 1957 年 2 月 区分敌我矛盾和人民内部矛盾，提出正确处理人民内部矛盾是社会主义国家政治生 活的主题。【《手册》第 66—67 页】 新思想（7—9 单选；23—26 多选）", "year": 2027}, {"id": "s1-23", "set": 1, "num": 23, "src": "苏一六套卷（一）", "book": "苏一", "sub": "新思想", "type": "multi", "stem": "发展新质生产力，需要推动产业深度转型升级。习近平总书记强调，要“改造提升传统产业，培育壮大新兴产业，布局建设未来产业，完善现代化产业体系”。在发展新质生产力、建设现代化产业体系过程中，要重视传统产业改造升级，这是因为", "opts": {"A": "传统产业在吸纳就业、保障民生、稳定经济等方面具有不可替代的作用", "B": "传统产业改造升级，也能发展新质生产力", "C": "传统产业改造升级能够为未来产业技术突破和产品开发提供应用场景", "D": "传统制造业是现代化产业体系的基底"}, "ans": "ABCD", "ana": "传统产业广泛联系就业和民生，改造升级有利于发挥其吸纳就业、保障民生和稳定经济的作用，A 正确。习近平总书记指出，传统产业改造升级也能发展新质生产力，运用先进技术改造传统工艺和生产流程，可以催生新的生产力质态，B 正确。传统产业改造中的实际生 时作出这一阐述，主要是为了", "opts": {"A": "确立实事求是思想路线在全党的指导地位", "B": "正式提出马克思主义中国化的科学命题与重大任务", "C": "系统概括新民主主义革命的总路线与基本纲领", "D": "揭示主观主义，特别是教条主义错误的思想根源"}, "ans": "D", "ana": "为了揭示主观主义，特别是教条主义错误的思想根源，1937 年，毛泽东在《实践论》和《矛盾论》等著作中，深刻阐述了理论对于实践的依赖关系，以及矛盾的普遍性和特殊性的关系，对党的思想路线作了系统的哲学论证。题干问的是毛泽东作出上述阐述的主要目的：理论依赖于实践，说明不能脱离实际照搬理论；矛盾具有特殊性，说明不能用一般原理代替对具体问题的分析。二者都指向揭示脱离实际、机械照搬理论的教条主义错误。D 正确。", "dis": "A 选项，经过延安整风和党的七大，实事求是的思想路线在全党得到了确立。B 选项，毛泽东在 1938 年党的六届六中全会上提出“马克思主义的中国化”命题。C 选项，系统概括新民主主义革命的总路线与基本纲领，是《新民主主义论》等著作的理论成果，完整的新民主主义革命总路线到 1948 年《在晋绥干部会议上的讲话》才明确提出，不是题干所述两部著作进行哲学论证的主要目的。", "ext": "【相关考点拓展】（1）实事求是思想路线的形成与重新确⽴【《⼿册》第 56、68 ⻚】 时间与⽂献 主要内容 为了揭示主观主义，特别是教条主义错误的思想根源，⽑泽东在《实践论》 1937 年《实践论》《⽭盾论》 和《⽭盾论》等著作中对党的思想路线作了系统的哲学论证。 为了统⼀全党思想，并为制定新⺠主主义⾰命的总路线奠定思想基础，⽑泽 东在延安整⻛期间⼜从思想路线的⻆度，对实事求是的科学含义作了⻢克思 延安整⻛期间 主义的界定。他指出：‘实事’就是客观存在着的⼀切事物，‘是’就是客观事物 的规律性，‘求’就是我们去研究 经过延安整⻛和党的七⼤ 实事求是的思想路线在全党得到了确⽴。 1978 年党的⼗⼀届三中全会 重新确⽴了实事求是的思想路线。 （2）新⺠主主义⾰命总路线与基本纲领【《⼿册》第 57、59—60 ⻚】 ①1939 年《中国⾰命和中国共产党》⾸次提出“新⺠主主义⾰命”的科学概念，当时 表述为⽆产阶级领导的、⼈⺠⼤众的、反帝反封建的⾰命。 总路线 ②1948 年《在晋绥⼲部会议上的讲话》完整表述总路线：⽆产阶级领导的，⼈⺠⼤ 众的，反对帝国主义、封建主义和官僚资本主义的⾰命。 第 6 ⻚ ①1940 年《新⺠主主义论》系统阐述新⺠主主义的政治、经济和⽂化。 基本纲领 ②1945 年七⼤《论联合政府》进⼀步把政治、经济和⽂化同党的基本纲领联系起 来，进⾏具体阐述，规定了党的⼀般纲领和具体纲领。 新⺠主主义的基本纲领是新⺠主主义⾰命总路线的进⼀步展开和体现。 ①政治纲领：推翻帝国主义和封建主义的统治，建⽴⼀个⽆产阶级领导的、以⼯农联盟为基础的、各⾰命阶级联合 专政（国体）的新⺠主主义的共和国。 ②经济纲领：没收封建地主阶级的⼟地归农⺠所有（主要内容），没收官僚资本归新⺠主主义国家所有（新、社两 重性），保护⺠族⼯商业（极具特⾊）。 ③⽂化纲领：⽆产阶级领导的⼈⺠⼤众的反帝反封建的⽂化，即⺠族的科学的⼤众的⽂化。", "year": 2027}, {"id": "s2-6", "set": 2, "num": 6, "src": "苏一六套卷（二）", "book": "苏一", "sub": "毛中特", "type": "single", "stem": "邓小平在思考什么是社会主义、怎样建设社会主义时，既强调解放和发展生产力，又强调消灭剥削、消除两极分化，最终达到共同富裕，从这些方面揭示社会主义的本质。这一概括把对社会主义的认识提高到新的科学水平，主要在于", "opts": {"A": "重新确立了实事求是的思想路线", "B": "摆脱了长期以来拘泥于具体模式而忽略社会主义本质的错误倾向", "C": "明确了公有制的实现形式是指资产或资本的组织形式和经营方式", "D": "明确了非公有制经济是社会主义市场经济的重要组成部分"}, "ans": "B", "ana": "邓小平关于社会主义本质的概括，反映了人民的利益和时代的要求，廓清了不合乎时代进步和社会发展规律的模糊观念，摆脱了长期以来拘泥于具体模式而忽略社会主义本质的错误倾向，把对社会主义的认识提高到新的科学水平。这对于我们在坚持社会主义基本制度的基础上推进改革，指导改革沿着合乎社会主义本质要求的方向发展，对于建设中国特色社会主义，具有重大的政治意义、理论意义和实践意义。题干既讲解放和发展生产力，又讲消灭剥削、消除两极分化、最终达到共同富裕，说明这一概括从生产力、生产关系和发展目标等方面把握社会主义，而不再拘泥于某种具体模式。B 正确。", "dis": "A 选项，说明的是思想路线的重新确立，不是社会主义本质概括的理论突破。C 选项，讨论的是公有制如何实现。D 选项，讨论的是非公有制经济的地位。二者都不是题干所问的社会主义本质概括的意义。", "ext": "（1）1992 年南⽅谈话对社会主义本质的概括 【《⼿册》第 69 ⻚】 ①搞清楚“什么是社会主义，怎样建设社会主义”，关键是要在坚持社会主义基本制度的基础上进⼀步认清社会主义 的本质 ②社会主义的本质是解放⽣产⼒，发展⽣产⼒，消灭剥削，消除两极分化，最终达到共同富裕 （2）对社会主义本质概括的意义 ①从⽣产⼒看，把解放⽣产⼒和发展⽣产⼒统⼀起来，纠正了过去关于发展⽣产⼒的⼀些错误观念。 ②从⽣产关系和发展⽬标⻆度认识和把握社会主义本质，体现了社会主义发展的价值⽬标，体现了发展⼿段和发展 ⽬的的统⼀。 ③为我们坚持和完善公有制指出了明确的⽅向 ④廓清了不合乎时代进步和社会发展规律的模糊观念 ⑤摆脱了⻓期以来拘泥于具体模式⽽忽略社会主义本质的错误倾向，把对社会主义的认识提⾼到新的科学⽔平 （3）1997 年党的⼗五⼤——社会主义初级阶段的基本经济制度【《⼿册》第 216 ⻚】 党的⼗五⼤提出党在社会主义初级阶段的基本纲领，把发展市场经济同社会主义基本制度结合起来。 ⼤会明确：公有制为主体、多种所有制经济共同发展，是我国社会主义初级阶段的⼀项基本经济制度。 ①公有资产在社会总资产中占优势，国有经济控制国⺠经济命脉，对经济发展起主导作⽤。 公有制为主体 ②公有制实现形式可以⽽且应当多样化，指公有资产或资本可以采取不同的组织形式和经营⽅ 式。 多种所有制经 ①⾮公有制经济是我国社会主义市场经济的重要组成部分。 济共同发展 ②对个体、私营等⾮公有制经济要继续⿎励、引导，使之健康发展。 社会主义市场经济理论的形成和发展【详⻅：第 1 套，第 6 题】。", "year": 2027}, {"id": "s2-7", "set": 2, "num": 7, "src": "苏一六套卷（二）", "book": "苏一", "sub": "新思想", "type": "single", "stem": "为吸引企业落户，有的地方竞相开出税费优惠、项目补贴等条件。“十五五”规划纲要提出，对招商引资中鼓励和禁止的事项列出清单，加强招商引资信息披露。上述举措充分表明，建设全国统一大市场的关键在于", "opts": {"A": "统一市场基础制度", "B": "统一政府行为尺度", "C": "统一市场监管执法", "D": "统一要素资源市场"}, "ans": "B", "ana": "统一政府行为尺度，这是建设全国统一大市场的关键所在。题干中，对招商引资中鼓励和禁止的事项列出清单，是为了明确地方政府在招商引资中哪些能干、哪些不能干。加强招商引资信息披露，有利于提高政策透明度，防止各地竞相以税费优惠、项目补贴等方式不当干预市场竞争。这些举措体现了对地方政府招商引资行为的规范。B 正确。", "dis": "A 选项，涉及产权保护、公平竞争、质量标准等市场基础制度；C 选项，涉及统一市场监管执法标准；D 选项涉及促进要素资源自由流动和高效配置。题干主要围绕“规范地方政府招商引资行为”展开，ACD 均不符合题意。", "ext": "【相关考点拓展】全国统⼀⼤市场【《⼿册》第 90 ⻚】 （1）什么是全国统⼀⼤市场？【《⼿册》第 89—90 ⻚】 建设统⼀开放、竞争有序、制度完备、治理完善的⾼标准市场体系。各地按相互衔接的规则运⾏，商品和⽣产要素 跨地区顺畅流动。（⼀套统⼀规则，破除地⽅保护，外地企业满⾜条件就能和本地企业公平竞争） （2）为什么建设全国统⼀⼤市场？【《⼿册》第 90—91 ⻚】 建设全国统⼀⼤市场，不仅是构建新发展格局、推动⾼质量发展的需要，⽽且是赢得国际竞争主动权的需要。 ⾼⽔平社会主义 各地在准⼊、公平竞争、监管执法上遵守共同规则，企业跨地区经营就有稳定预期。 市场经济体制 新发展格局 打破地⽅分割、地⽅保护，打通国内⽣产分配流通消费循环 ⾼质量发展 依托超⼤国内市场，跨区域调配⼈、技术、原料，提升资源效率、产业竞争⼒ 与国际竞争 （3）基本要求——“五统⼀、⼀开放” ①五统⼀ 统⼀市场基础制度 产权保护、市场准⼊、公平竞争等有统⼀的制度规则。 统⼀市场基础设施 交通物流设施互联互通，市场信息平台衔接共享。 统⼀政府⾏为尺度 地⽅政府招商引资、给予补贴和优惠，要遵守共同的⾏为边界。 统⼀市场监管执法 不同地区检查、处罚同类违法⾏为，适⽤统⼀的监管执法标准。 第 8 ⻚ 统⼀要素资源市场 劳动、资本、技术等要素跨地区流动，按市场规则配置。 ②⼀开放 持续扩⼤开放，实⾏对内对外开放联通，不搞封闭运⾏。", "year": 2027}, {"id": "s2-8", "set": 2, "num": 8, "src": "苏一六套卷（二）", "book": "苏一", "sub": "新思想", "type": "single", "stem": "习近平总书记指出：“文学艺术创造、哲学社会科学研究首先要搞清楚为谁创作、为谁立言的问题，这是一个根本问题。”文化工作既要回应人民群众的精神文化需求，也要自觉融入国家发展和民族复兴的事业。决定社会主义文化事业前途命运的关键是", "opts": {"A": "坚持马克思主义在意识形态领域指导地位的根本制度", "B": "坚持为人民服务、为社会主义服务的根本方向", "C": "坚持把社会效益放在首位、社会效益和经济效益相统一", "D": "坚持百花齐放、百家争鸣的方针"}, "ans": "B", "ana": "坚持为人民服务、为社会主义服务的根本方向，是决定社会主义文化事业前途命运的关键。题干强调文化工作要回答好为谁创作、为谁立言的问题，将满足人民精神文化需求与服务国家发展相统一，体现了“二为”方向。B 正确，ACD 不符合题意。", "dis": "", "ext": "【相关考点拓展】社会主义⽂化建设的⽅向与⽅针【《⼿册》第 101 ⻚】 “⼆为”⽅向 为⼈⺠服务、为社会主义服务。 百花⻬放、百家争鸣。⽂艺创作允许不同⻛格和流派⾃由发展，学术研究允许不同学派 “双百”⽅针 和观点⾃由讨论。 ①创新创造是⽂化的⽣命所在，是⽂化的本质特征 创新创造 ②创新创造是深化⽂化体制机制改⾰的中⼼环节", "year": 2027}, {"id": "s2-9", "set": 2, "num": 9, "src": "苏一六套卷（二）", "book": "苏一", "sub": "新思想", "type": "single", "stem": "就业是最基本的民生。随着产业转型升级，一些劳动者难以找到合适的工作，一些企业也难以招到适岗人才，就业难与招工难并存。“十五五”时期，促进高质量充分就业的着力点是", "opts": {"A": "强化就业优先政策", "B": "深化就业体制机制改革", "C": "实施就业优先战略", "D": "破解结构性就业矛盾"}, "ans": "D", "ana": "促进高质量充分就业，要以推动高质量发展为基础，以实施就业优先战略为引领，以强化就业优先政策为抓手，以破解结构性就业矛盾为着力点，以深化就业体制机制改革为动力，以不发生规模性失业风险为底线。题干中的“就业难与招工难并存”，反映的是劳动者的技能、专业等与岗位需求不匹配，突出体现了结构性就业矛盾。因此，促进高质量充分就业的着力点是破解结构性就业矛盾，D 正确。", "dis": "A 选项，强化就业优先政策是“抓手”；B 选项，深化就业体制机制改革是“动力”；C 选项，实施就业优先战略是“引领”。三者都是促进高质量充分就业的重要要求，但不对应设问中的“着力点”。本题应区分不同举措的具体定位，不能因为表述正确就选择。", "ext": "【相关考点拓展】促进⾼质量充分就业【《⼿册》第 104 ⻚】 （1）就业⼯作的地位、使命与主要⽭盾 ①就业是最基本的⺠⽣，事关⼈⺠群众切身利益，事关经济社会健康发展，事关国家⻓治久安。 ②新时代新征程就业⼯作的新定位、新使命是促进⾼质量充分就业。这也是“⼗五五”时期就业⼯作的⽬标。 ③就业领域的主要⽭盾是⼈⼒资源供需不匹配。有⼈找不到⼯作，同时企业招不到熟练技⼯，反映空缺岗位的要求 与劳动者技能对不上。 （2）促进⾼质量充分就业的六组搭配 基础 推动⾼质量发展 着⼒点 破解结构性就业⽭盾 引领 实施就业优先战略 动⼒ 深化就业体制机制改⾰ 抓⼿ 强化就业优先政策 底线 不发⽣规模性失业⻛险 （3）“⼗五五”时期就业五⼤发展⽬标 ①就业机会更加充分。②就业环境更加公平。③就业结构更加优化。④⼈岗匹配更加⾼效。⑤劳动关系更加和谐。", "year": 2027}, {"id": "s2-10", "set": 2, "num": 10, "src": "苏一六套卷（二）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "毛泽东在谈到辛亥革命时指出，辛亥革命有它胜利的地方，也有它失败的地方。“辛亥革命把皇帝赶跑，这不是胜利了吗？说它失败，是说辛亥革命只把一个皇帝赶跑。”毛泽东这里所说的“只把一个皇帝赶跑”是指", "opts": {"A": "没有推翻帝制", "B": "反帝反封建的革命任务没有完成", "C": "袁世凯窃夺了胜利果实", "D": "孙中山没有继续革命"}, "ans": "B", "ana": "辛亥革命推翻了清王朝的统治，结束了中国延续两千多年的封建君主专制制度，建立了资产阶级共和国，因而取得了巨大的历史功绩。但是，辛亥革命没有改变旧中国半殖民地半封建的社会性质，没有完成反帝反封建的革命任务，也没有结束中国人民的悲惨境遇。毛泽东所说的“只把一个皇帝赶跑”，正是指辛亥革命只推翻了清王朝和封建君主专制制度，却没有从根本上推翻帝国主义和封建主义的统治。B 正确。", "dis": "A 选项，辛亥革命推翻了清王朝，结束了封建君主专制制度。C 选项，袁世凯窃取辛亥革命的果实是革命失败的重要表现，但题干想强调的是反帝反封建的革命任务没有完成。D 选项，孙中山此后仍坚持反对北洋军阀统治，继续探索革命道路。", "ext": "【相关考点拓展】⾟亥⾰命 【《⼿册》第 124—126 ⻚】 （1）制度成果与历史局限 ①⾟亥⾰命推翻了清王朝的统治，结束了封建君主专制制度。《中华⺠国临时约法》确认主权属于国⺠全体，以根 本⼤法的形式废除了封建君主专制制度。 ②⾟亥⾰命：没有改变旧中国半殖⺠地半封建的社会性质和中国⼈⺠的悲惨境遇；没有完成反帝反封建的⾰命任务； 没有解决近代中国社会的主要⽭盾 （2）失败的原因 根本原因 在帝国主义时代，在半殖⺠地半封建的中国，资本主义的建国⽅案是⾏不通的 在于它的领导者资产阶级⾰命派本身存在着许多弱点和错误。⾰命派⾃身的弱点 ①没有提出彻底的反帝反封建的⾰命纲领。 主观原因 ②不能充分发动和依靠⼈⺠群众。 ③不能建⽴坚强的⾰命政党，作为团结⼀切⾰命⼒量的强有⼒的核⼼。 （资产阶级⾰命派的这些弱点、错误，根源于中国⺠族资产阶级的软弱性和妥协性）", "year": 2027}, {"id": "s2-11", "set": 2, "num": 11, "src": "苏一六套卷（二）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "大革命失败后，反革命力量大大超过了有组织的革命力量。但是，中国共产党领导的革命斗争并未被白色恐怖所扑灭。随着革命新道路的开辟，到 1930 年夏，共产党领导人民群众建立了大小十几块农村根据地，红军发展到约 7 万人。在大革命失败、白色恐怖极其严重的条件下，中国革命能够得到坚持和发展的根本原因是", "opts": {"A": "红军贯彻积极防御方针，采取灵活机动的战略战术", "B": "各农村根据地建立了统一的中央政权", "C": "中国共产党依靠农民，领导农民进行了土地制度的革命", "D": "遵义会议集中解决了当时具有决定意义的军事问题和组织问题"}, "ans": "C", "ana": "中国共产党制定了井冈山土地法、兴国土地法等土地法令，不断总结土地革命的经验，形成了正确的土地革命路线。在这一土地革命路线的指引下，根据地开展了热火朝天的“打土豪，分田地”的斗争，充分调动了广大农民发展生产和参军参战的积极性。在大革命失败、白色恐怖极其严重的条件下，中国革命之所以能够得到坚持和发展，根本原因就在于中国共产党紧紧地依靠农民，领导农民进行了土地制度的革命。C 正确。", "dis": "A 选项，积极防御方针和灵活机动的战略战术是反“围剿”战争取得胜利的重要原因，并非中国革命坚持和发展的根本原因。B 选项，统一的中央政权是革命发展到一定阶段的产物，是革命坚持发展的结果而非原因。D 选项，遵义会议召开于 1935 年，晚于大革命失败初期，时间不符。", "ext": "土地革命路线：依靠贫雇农、联合中农、限制富农、消灭地主阶级。", "year": 2027}, {"id": "s2-12", "set": 2, "num": 12, "src": "苏一六套卷（二）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "遵义会议以来，党的路线已走上马克思主义的正确轨道，但对曾经给党的事业造成严重危害的主观主义、教条主义还没有来得及从思想上进行认真清理。这就有必要集中开展一场普遍的马克思主义思想教育运动，总结和吸取经验教训，以提高广大党员的思想理论水平，增强党的凝聚力和战斗力。为此，中国共产党在全党范围内开展了一场整风运动。整风运动胜利结束的标志是", "opts": {"A": "毛泽东在六届六中全会上发表的《论新阶段》", "B": "党的六届七中全会通过的《关于若干历史问题的决议》", "C": "毛泽东在中共七大上所作的《论联合政府》", "D": "毛泽东先后作了《整顿党的作风》和《反对党八股》的讲演"}, "ans": "B", "ana": "在深入总结历史经验的基础上，1944 年 5 月 21 日至 1945 年 4 月 20 日，中共扩大的六届七中全会在延安召开。会议原则通过了《关于若干历史问题的决议》，对建党以后特别是党的六届四中全会至遵义会议前这一段党的历史及其经验教训进行了总结，对党的若干重大历史问题作出结论。《决议》使全党特别是党的高级干部对中国革命基本问题的认识达到了一致，增强了全党团结，为党的七大胜利召开创造了充分条件，有力促进了中国革命事业发展。至此，整风运动胜利结束。B 正确。", "dis": "A 选项，1938 年，毛泽东在六届六中全会上作《论新阶段》的报告，明确提出“马克思主义的中国化”命题，此时整风运动尚未开始。C 选项，《论联合政府》是 1945年，毛泽东在中共七大上所作的政治报告，七大召开时整风运动已经结束。D 选项，1942年 2 月，毛泽东先后作《整顿党的作风》和《反对党八股》的讲演，标志着整风运动在全党范围普遍展开，并非整风运动胜利结束的标志。", "ext": "【相关考点拓展】延安整⻛为什么开展、怎样展开、整什么⻛？【《⼿册》第 142 ⻚】 （1）背景：遵义会议以来，对曾经给党的事业造成严重危害的主观主义、教条主义还没有来得及从思想上进⾏认 真清理。 （2）进程与⽂献。 时间 ⽂献 进程 1941 年 《改造我们的学习》 整⻛运动⾸先在党的⾼级⼲部中进⾏。 1942 年 《整顿党的作⻛》《反对党⼋股》 整⻛运动在全党范围普遍展开。 六届七中全会，《关于若⼲历史问题 标志着整⻛运动胜利结束，为党的七⼤胜利召开创造 1945 年 4 ⽉ 的决议》 了充分条件。 （3）详细内容 ①反对主观主义以整顿学⻛（整⻛运动最主要的任务） 主要内容 ②反对宗派主义以整顿党⻛ ③反对党⼋股以整顿⽂⻛ ①主观主义的实质：理论脱离实际 主观主义 ②主观主义主要表现为：教条主义和经验主义 整⻛运动的重点是反对教条主义 1945 年 4 ⽉ 20 ⽇，六届七中全会通过了《关于若⼲历史问题的决议》： ①对建党以后特别是党的六届四中全会⾄遵义会议前党的历史进⾏了总结 胜利结束 ②使全党特别是党的⾼级⼲部对中国⾰命基本问题的认识达到了⼀致 ③增强了全党团结，为党的七⼤胜利召开创造了充分条件 ④有⼒促进了中国⾰命事业发展。⾄此，整⻛运动胜利结束 ①整⻛运动是⼀次深刻的⻢克思主义思想教育运动，也是⼀场思想解放运动 意义 ②它坚持⻢克思主义同中国实际相结合的正确⽅向，使实事求是的思想路线在全党范围确⽴起来 ③从思想根源上清算了以王明为代表的“左”倾教条主义错误 第 12 ⻚", "year": 2027}, {"id": "s2-13", "set": 2, "num": 13, "src": "苏一六套卷（二）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "1981 年 6 月，党的十一届六中全会通过《关于建国以来党的若干历史问题的决议》。《决议》既科学评价了毛泽东和毛泽东思想的历史地位，又对十一届三中全会以来逐步确立的社会主义现代化建设正确道路作出概括。这一决议的通过①使全党对中国革命基本问题的认识达到了一致②标志着党在指导思想上的拨乱反正胜利完成③使改革重点由农村转向城市④明确了社会主义改造基本完成以后我国所要解决的主要矛盾", "opts": {"A": "①②", "B": "②③", "C": "②④", "D": "③④"}, "ans": "C", "ana": "本题考查的是 1981 年《关于建国以来党的若干历史问题的决议》，应注意与1945 年《关于若干历史问题的决议》相区别。1981 年的《决议》对党的十一届三中全会以来逐步确立的适合中国情况的建设社会主义现代化强国的道路，从十个方面作了概括。其中，第一个方面就是关于新时期我国社会主义矛盾的判断。《决议》指出：社会主义改造基本完成以后，我国所要解决的主要矛盾，是人民日益增长的物质文化需要同落后的社会生产之间的矛盾。这十个方面的概括，实质上初步提出了在中国建设什么样的社会主义和怎样建设社会主义的问题。党制定《决议》，标志着党在指导思想上的拨乱反正胜利完成。因此，应选②④的组合，C 正确。", "dis": "对于①，使全党特别是党的高级干部对中国革命基本问题的认识达到了一致，是 1945 年党的六届七中全会通过的《关于若干历史问题的决议》的成果。对于③，1984年 10 月，党的十二届三中全会通过《中共中央关于经济体制改革的决定》，会后，经济体制改革以城市为重点全面展开，不是 1981 年《决议》通过的结果。", "ext": "【《⼿册》第 142、154 ⻚】 （1）1945 年与 1981 年两份历史决议 项⽬ 1945 年 1981 年 会议 六届七中全会 ⼗⼀届六中全会 ⽂件 《关于若⼲历史问题的决议》 《关于建国以来党的若⼲历史问题的决议》 使全党特别是党的⾼级⼲部对中国⾰命基 科学地评价了⽑泽东和⽑泽东思想的历史地位；标志 认识与结论 本问题的认识达到了⼀致。 着党在指导思想上的拨乱反正胜利完成。 （2）1945 年 4 ⽉ 20 ⽇，六届七中全会通过了《关于若⼲历史问题的决议》（参考上⼀题） （3）1981 年的《关于建国以来党的若⼲历史问题的决议》 ①1981 年决议对主要⽭盾的表述是“⼈⺠⽇益增⻓的物质⽂化需要同落后的社会⽣产之间的⽭盾”。 ②1956 年⼋⼤表述中的需要是“⼈⺠对于经济⽂化迅速发展的需要”【详⻅：第 1 套，第 29 题】。 1979 年 11 ⽉，邓⼩平起草《关于建国以来党的若⼲历史问题的决议》，提出三条指导原则： ①确⽴⽑泽东同志的历史地位，坚持和发展⽑泽东思想（最核⼼的⼀条） 背景 ②对建国 30 年来历史上的⼤事，要进⾏实事求是的分析，包括⼀些负责同志的功过是⾮，要作出公 正的评价 ③总结宜粗不宜细，总结过去是为了引导⼤家团结⼀致向前看 时间 1981 年 6 ⽉，党的⼗⼀届六中全会通过了这个《决议》 ①彻底否定“⽂化⼤⾰命” ②科学地评价了⽑泽东和⽑泽东思想的历史地位 ③概括了⽑泽东思想的科学体系和活的灵魂（实事求是、群众路线、独⽴⾃主） ④对党的⼗⼀届三中全会以来逐步确⽴的适合中国情况的建设社会主义现代化强国的道路，从⼗个⽅ ⾯作了概括 内容和 ⑤第⼀个⽅⾯就是关于新时期我国社会主义⽭盾的判断。《决议》指出：社会主义改造基本完成以 意义 后，我国所要解决的主要⽭盾，是⼈⺠⽇益增⻓的物质⽂化需要同落后的社会⽣产之间的⽭盾 ⑥为了解决这个主要⽭盾，党和国家⼯作的重点必须转移到以经济建设为中⼼的社会主义现代化建设 上来 ⑦这⼗个⽅⾯的概括，实质上初步提出了在中国建设什么样的社会主义和怎样建设社会主义的问题 ⑧标志着党在指导思想上的拨乱反正胜利完成", "year": 2027}, {"id": "s2-14", "set": 2, "num": 14, "src": "苏一六套卷（二）", "book": "苏一", "sub": "思法", "type": "single", "stem": "我国宪法确认公民的基本权利。为保障公民权利的实现，我国建立了由宪法保障、立法保障、行政保障和司法保障等构成的权利保障体系。其中，权利保障的关键环节是", "opts": {"A": "宪法保障", "B": "立法保障", "C": "行政保障", "D": "司法保障"}, "ans": "C", "ana": "行政保障是权利保障的关键环节。行政机关依法履行职责，将法律规定的权利保障要求落实到具体的行政管理和公共服务中，C 正确。", "dis": "A 选项，宪法保障是权利保障的前提和基础；B 选项，立法保障是权利保障的重要条件；D 选项，司法保障是权利保障的最后防线。ABD 均不符合题意。", "ext": "【相关考点拓展】权利保障的四个环节【《⼿册》第 172 ⻚】 宪法保障 权利保障的前提和基础。【宪（县）基（级）】 ⽴法保障 权利保障的重要条件。【⽴（⾥）要】 ⾏政保障 权利保障的关键环节。【⾏（兴）键（建）】 司法保障 权利保障的最后防线。【防线】 （助记：县级⾥要兴建防线）权利保障着眼于公⺠权利的实现。国家机关如何依法⽤权、接受监督【详⻅：第 1 套，第 31 题】。 第 15 ⻚", "year": 2027}, {"id": "s2-15", "set": 2, "num": 15, "src": "苏一六套卷（二）", "book": "苏一", "sub": "时政", "type": "single", "stem": "党的二十届五中全会强调，持之以恒推进全面从严治党是全党的共同政治责任，必须扭住管党治党责任制“牛鼻子”，健全各负其责、统一协调的责任体系。全会指出，全面从严治党的主体是", "opts": {"A": "党员干部", "B": "党的工作部门", "C": "党的各级组织", "D": "党的纪律检查机关"}, "ans": "C", "ana": "全会指出：“党的各级组织是全面从严治党的主体。”C 正确，ABD 不符合题意。", "dis": "", "ext": "【相关考点拓展】全⾯从严治党的主体 全⾯从严治党的主体是党的各级组织。 七条原则及根本性任务、关键、统领等搭配【详⻅：第 1 套，第 15 题】。", "year": 2027}, {"id": "s2-16", "set": 2, "num": 16, "src": "苏一六套卷（二）", "book": "苏一", "sub": "时政", "type": "single", "stem": "自 1991 年加入以来，中国一直积极、深入参与 APEC 各领域合作，为推进 APEC 合作进程发挥了重要建设性作用。2026 年 11 月，亚太经合组织第三十三次领导人非正式会议将在深圳召开，这是中国第三次担任 APEC 会议东道主。2026 年 APEC 会议的主题是", "opts": {"A": "建设亚太共同体，促进共同繁荣", "B": "共建面向未来的亚太伙伴关系", "C": "赋能、包容、增长", "D": "建设可持续的明天"}, "ans": "A", "ana": "2026 年 APEC 的办会主题为建设亚太共同体，促进共同繁荣。A 正确，BCD 不符合题意。二、多项选择题：17～33 小题，每小题 2 分，共 34 分。下列每题给出的四个选项中，至少有两个选项是符合题目要求的。", "dis": "", "ext": "【相关考点拓展】两届 APEC 会议的主题与优先合作领域 设问 2025 年韩国庆州 2026 年中国深圳 会议主题 建设可持续的明天 建设亚太共同体，促进共同繁荣 三⼤优先合作领域 联通、创新、繁荣 开放、创新、合作 ①中国加⼊ APEC：1991 年。 ②中国三次担任东道主：2001 年上海、2014 年北京、2026 年深圳。 ③APEC 的宗旨：⽀持亚太区域经济可持续增⻓和繁荣，建设活⼒和谐的亚太⼤家庭，捍卫⾃由开放的贸易和投资， 加速区域经济⼀体化进程，⿎励经济技术合作，保障⼈⺠安全，促进建设良好和可持续的商业环境。 ④2026 年 APEC“中国年”时政表述：以创新推动数字化、智能化、绿⾊化转型是 APEC 成员经济体新的增⻓点，也 是实现亚太可持续发展的必由之路。", "year": 2027}, {"id": "s2-17", "set": 2, "num": 17, "src": "苏一六套卷（二）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "习近平总书记强调，要善于“弹钢琴”，谋划一个地区、一个部门的工作要考虑整体，安排当前工作要兼顾长远，突出重点也不能忽略一般。这里所说的善于“弹钢琴”蕴含的哲学道理有", "opts": {"A": "坚持联系的观点，注重各方面的协调配合", "B": "坚持发展的观点，统筹当前工作与长远目标", "C": "坚持两点论与重点论的统一，把握矛盾主次关系", "D": "坚持辩证否定观，在克服与保留中推动事物发展"}, "ans": "ABC", "ana": "联系和发展是唯物辩证法的总观点和总特征。事物处于普遍联系之中，要求从相互联系中把握事物。谋划一个地区、一个部门的工作要考虑整体，强调各方面工作的协调配合，A 正确。事物的变化发展是一个过程，要求以发展的眼光看问题。安排当前工作要兼顾长远，强调把当前工作放到持续发展的过程中谋划，B 正确。矛盾的发展具有不平衡性，分析和解决问题要坚持两点论与重点论的统一，既全面把握矛盾，又抓住重点。突出重点而不忽略一般，体现了对矛盾主次关系的正确把握，C 正确。", "dis": "D 选项，辩证否定是包含肯定的否定，其实质是“扬弃”，即对旧事物既克服又保留。材料中的“弹钢琴”强调各方面协调、当前与长远衔接以及重点与一般兼顾，没有说明通过克服旧事物的消极因素、保留其积极因素推动发展，与题意不相符合。", "ext": "【相关考点拓展】联系、发展与⽭盾的主次关系 （1）联系的普遍性 【《⼿册》第 7—8 ⻚】 ①任何事物内部的不同部分和要素之间都是相互联系的。 ②任何事物都不能孤⽴存在，都同其他事物处于⼀定的联系之中。 ③整个世界是相互联系的统⼀整体。世界的普遍联系是通过中介实现的。联系的客观性与系统【详⻅：第 1 套，第 17 题】。 （2）发展及其实质【《⼿册》第 8 ⻚】 ①发展是事物变化中前进的、上升的运动。 ②发展的实质是新事物的产⽣和旧事物的灭亡。新事物是合乎历史前进⽅向、具有远⼤前途的东⻄。 （3）主要⽭盾与⽭盾的主要⽅⾯【《⼿册》第 10 ⻚】 地位与作⽤ 主要⽭盾 ⽭盾体系中处于⽀配地位、对事物发展起决定作⽤的⽭盾。 ⽭盾的主要⽅⾯ 在每⼀对⽭盾中，处于⽀配地位、起主导作⽤的⼀⽅。 ①事物的性质是由主要⽭盾的主要⽅⾯所决定的。 注意 ②要坚持“两点论”和“重点论”的统⼀，看问题既要全⾯地看，⼜要看主流、⼤势、发展 趋势。", "year": 2027}, {"id": "s2-18", "set": 2, "num": 18, "src": "苏一六套卷（二）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "李约《观祈雨》写道：“桑条无叶土生烟，箫管迎龙水庙前。朱门几处看歌舞，犹恐春阴咽管弦。”久旱之下，农人盼望降雨，朱门中人却担心阴雨妨碍歌舞。人们对同样的降雨产生不同的价值判断，是因为", "opts": {"A": "主体的需要和利益影响其对客体的价值评价", "B": "客体的价值由评价主体的情感倾向决定", "C": "评价差异源于客体本身不具有确定的属性", "D": "同一客体与不同主体之间可以形成不同的价值关系"}, "ans": "AD", "ana": "价值是反映主体和客体之间意义关系的哲学范畴，既离不开主体的需要，也离不开客体的特性。价值评价是主体对客体的价值及价值大小所作的评判，评价结果与评价主体直接相关，受其需要、利益等因素影响。久旱之下，农人从农业生产需要出发盼望降雨，朱门中人则从歌舞享乐的需要出发担忧阴雨，说明主体的需要和利益影响价值评价，A 正确。同样的降雨能够满足农人对农业用水的需要，却可能妨碍朱门中人的歌舞活动，说明同一客体与不同主体之间可以形成不同的价值关系，这也是评价产生差异的重要依据，D正确。", "dis": "B 错误，价值具有客观性，主体的需要和客体的存在都是客观的，客体能否满足主体需要不由主观愿望决定。情感倾向能够影响评价结果，但不能决定客体的实际价值。C 错误，价值评价的差异不等于客体没有确定的属性。降雨具有客观属性，不同主体因需要和利益不同，与降雨形成不同的价值关系，不能把评价差异归因于客体本身缺乏确定属性。", "ext": "（1）价值及其基本特性 【《⼿册》第 20 ⻚】 价值是反映主体和客体之间意义关系的哲学范畴。价值离不开主体的需要，也离不开客体的特性。 价值直接与主体相联系，始终以主体为中⼼。价值关系的形成： ①依赖于主体的存在 （没有主体，就不存在价值关系） 主体性 ②依赖于主体的创造 （使客体潜在的价值转化为现实的价值） 主客体之间的价值关系不是⼀种⾃然的现成关系，⽽是主体在实践基础上确⽴的与客体之 间的⼀种创造性关系 ①主体的需要和客体的存在都是客观的 客观性 ②客体能否满⾜主体需要，并不由⼈的主观愿望决定，⽽是由客体客观存在的性质、属性 等决定 ①每个主体的价值关系具有多样性。 多维性 ②同⼀客体相对于主体的不同需要会产⽣不同的价值。 社会历史性 主体和客体的不断变化决定了价值的社会历史性。 （2）价值评价及其特点 【《⼿册》第 21 ⻚】 价值评价是主体对客体的价值以及价值⼤⼩所作的评判或判断。 ①评价以主客体之间的价值关系为认识对象。 ②评价结果与评价主体直接相关，受主体意志的影响。 ③评价结果的正确与否依赖于对客体状况和主体需要的认识。 ④价值评价有科学与⾮科学之别。只有正确反映价值关系的评价才是正确的评价。", "year": 2027}, {"id": "s2-19", "set": 2, "num": 19, "src": "苏一六套卷（二）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "据市场监管总局公布的信息，2026 年上半年，各地市场监管部门抽查发现并督促有关政府部门废止、修改妨碍统一市场和公平竞争的违规文件 3500 余件，推动破除地方保护和市场分割。如果据此认为，经济发展归根到底取决于政策的制定，只要调整好政策，就能解决经济运行中的各种矛盾，那么这一认识的错误在于", "opts": {"A": "把上层建筑对经济基础的反作用夸大为决定作用", "B": "忽视生产力与生产关系的矛盾对经济发展的作用", "C": "承认上层建筑具有影响经济基础的相对独立性", "D": "忽视上层建筑作用的发挥受到客观经济规律的制约"}, "ans": "ABD", "ana": "经济基础决定上层建筑，上层建筑对经济基础具有反作用。政府政策能够影响经济运行，但这种影响不能取代经济基础的决定作用。认为经济发展“归根到底取决于政策的制定”，把上层建筑的反作用夸大为决定作用，A 正确。生产力和生产关系、经济基础和上层建筑的矛盾是社会基本矛盾，其中生产力和生产关系的矛盾是更为基本的矛盾。认为只要调整政策就能解决各种经济矛盾，忽视了生产力与生产关系矛盾运动的作用，B 正确。社会经济规律具有客观性，政策作用的发挥必须以客观经济条件和规律为依据，不能凭政策制定者的意愿任意改变经济运行。认为调整好政策即可解决一切经济矛盾，忽视了这种客观制约，D 正确。", "dis": "C 选项，上层建筑在受到经济基础决定的同时，具有相对独立性，能够对经济基础产生反作用。承认政策能够影响经济运行，符合经济基础与上层建筑辩证关系的原理。题目要求指出相关认识的错误，错误在于夸大政策的作用，而不在于承认其作用，与题意不相符合。", "ext": "【《⼿册》第 23—25 ⻚】 经济基础（⻣骼） 上层建筑（⾎⾁） 是指由社会⼀定发展阶段的⽣产 是建⽴在⼀定经济基础之上的意识形态以及与之相适应的制度、 含义 ⼒所决定的⽣产关系的总和 组织和设施 第 4 ⻚ ①社会的⼀定发展阶段上往往存 ①观念上层建筑（意识形态）：政治法律思想、道德、艺术、宗 在多种⽣产关系，但决定⼀个社 教、哲学 会性质的是其中占⽀配地位的⽣ ②政治上层建筑：国家政治制度、⽴法司法制度和⾏政制度，以 内容 产关系 及国家政权机构、政党、军队、警察、法庭、监狱等 ②经济体制是⽣产关系的具体实 （在整个上层建筑中，政治上层建筑居于主导地位，国家政权是 现形式 政治上层建筑的核⼼） ①经济基础决定上层建筑。经济基础的变更必然引起上层建筑的变⾰，并决定其变⾰的⽅向 辩证 ②上层建筑对经济基础具有反作⽤。集中表现在：上层建筑为⾃⼰的经济基础的形成和巩固服 统⼀ 务，确⽴或维护其在社会中的统治地位 ③经济基础和上层建筑之间的内在联系构成了上层建筑⼀定要适合经济基础状况的规律", "year": 2027}, {"id": "s2-20", "set": 2, "num": 20, "src": "苏一六套卷（二）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "棉布是工人家庭的生活必需品。某棉花生产企业率先采用新技术，使棉花的个别价值低于社会价值。后来，这项技术在棉花生产部门普及，棉花的社会价值下降，棉布的价值也随之下降。假定劳动力按价值出售，工人的工作日长度、劳动强度以及维持劳动力再生产所需生活资料的种类和数量均保持不变，其他条件不变。这表明", "opts": {"A": "维持工人原有生活水平所需生活资料的价值总量下降", "B": "工人用于补偿劳动力价值的必要劳动时间缩短", "C": "部门劳动生产率提高使工人在单位时间内创造的价值量增加", "D": "生活资料价值下降使资本家能够获得相对剩余价值"}, "ans": "ABD", "ana": "相对剩余价值是指在工作日长度不变的条件下，通过缩短必要劳动时间而相对延长剩余劳动时间所生产的剩余价值。缩短必要劳动时间，即劳动力的价值（工人的工资）降低；降低劳动力的价值，需要提高生产生活资料的部门劳动生产率。新技术在棉花生产部门普及后，部门劳动生产率提高，棉花、棉布的社会价值下降，使维持劳动力再生产所需生活资料的价值总量下降，劳动力价值随之降低。在工作日长度不变的情况下，补偿劳动力价值的必要劳动时间缩短，剩余劳动时间相对延长，资本家由此获得相对剩余价值。ABD 正确。", "dis": "C 错误，商品价值量由生产商品所耗费的社会必要劳动时间决定。部门劳动生产率提高，会使单位时间内（即一个固定的时间段内/同一劳动在同样时间内）生产的商品数量增加、单位商品的价值量（即单价）下降，但同一劳动在单位时间内创造的价值总量不变。【拓展】同一劳动在同样时间内创造的价值总量不变，因为价值量由劳动时间决定，所以同一劳动在时间不变的前提下，价值总量不变。从数学角度来理解，商品的价值总量 =单个商品价值量 × 商品数量。在价值总量不变的前提下，生产力的提高会使商品数量增加，数量增加必然导致单个商品价值量降低。", "ext": "（1）剩余价值⽣产的两种基本⽅法 【《⼿册》第 37—38 ⻚】 ⽐较 绝对剩余价值 相对剩余价值 条件 必要劳动时间不变。 ⼯作⽇⻓度不变。 延⻓⼯作⽇的⻓度或提⾼劳动强度。 缩短必要劳动时间，相对延⻓剩余劳动时 ⽣产⽅法 间。 AB 不变，延⻓ BC AC 不变，缩短 AB，相对延⻓ BC A————B————C……C´ A——B´……B—-——-C 特殊情况：AC 不变，提⾼劳动强度也属于 ①缩短必要劳动时间是通过提⾼全社会的劳 绝对剩余价值⽣产 动⽣产率实现的 ②全社会劳动⽣产率的提⾼是资本家追逐超 额剩余价值的结果 两种⽅式都是延⻓⼯⼈的剩余劳动时间 共同点 ①绝对剩余价值：如图所示（C→C´）往后延⻓剩余劳动时间 ②相对剩余价值：如图所示（B→B´）往前延⻓剩余劳动时间 （2）超额剩余价值与相对剩余价值的联系【《⼿册》第 38 ⻚】 ①个别企业率先提⾼劳动⽣产率，使商品的个别价值低于社会价值，由此获得超额剩余价值。 ②各个资本家追逐超额剩余价值，推动全社会劳动⽣产率提⾼。⽣活资料及其⽣产资料⽣产部⻔劳动⽣产率提⾼， 使⽣活资料价值下降，劳动⼒价值下降→必要劳动时间缩短→相对剩余价值增加。 （3）劳动⽣产率与价值量 【《⼿册》第 32 ⻚】 同⼀劳动在相同时间内，劳动强度等条件不变，部⻔劳动⽣产率提⾼： ①使⽤价值量增加。 ②单位商品价值量下降。 ③创造的价值总量不变。 第 5 ⻚", "year": 2027}, {"id": "s2-21", "set": 2, "num": 21, "src": "苏一六套卷（二）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "第二次世界大战后，资本主义股份公司的股东构成发生了变化。在一些公司中，企业法人以及养老基金、保险公司等机构法人逐渐取代个人或家族，成为主要持股者。随着这一变化，法人资本所有制得到发展。关于法人资本所有制的特点和性质，下列说法正确的有", "opts": {"A": "使公司资本的所有权与控制权重新趋于合一", "B": "资本占有的社会化程度提高", "C": "法人资本所有制主要存在于当代资本主义经济生活中居支配地位的巨型公司中", "D": "垄断资本的集体占有仍以资本雇佣劳动为基础"}, "ans": "ABCD", "ana": "私人股份资本所有制下，整个股份资本由职业经理人直接管理和控制，所有权与控制权不再统一。第二次世界大战后，国家资本所有制形成并发挥重要作用，法人资本所有制崛起并居主导地位。法人资本所有制发展后，企业股票高度集中于少数法人股东之手，法人股东凭借集中化的控股权参与公司治理，使公司资本的所有权与控制权重新趋于合一。资本主义生产资料所有制经过这些形式的演变，资本占有的社会化程度大大提高。法人资本所有制在性质上是一种基于资本雇佣劳动的垄断资本集体所有制，仍体现资本剥削雇佣劳动的关系。ABCD 正确。【拓展】资本主义生产资料所有制的变化：①在资本主义发展的初期：私人资本所有制是占主导地位的所有制形式②19 世纪末 20 世纪初：私人股份资本所有制成为占主导地位的所有制形式③第二次世界大战后：法人资本所有制崛起并成为居主导地位的资本所有制形式", "dis": "", "ext": "（1）资本所有制与控制权的三次对应【《⼿册》第 48 ⻚】 时期 占主导地位的形式 所有权与控制权 资本主义发展的初期 私⼈资本所有制 统⼀于资本家⾃身（⽼板⾃⼰出钱、⾃⼰管，两权合⼀） 19 世纪末 20 世纪初 私⼈股份资本所有制 不再统⼀（出钱的股东，交给职业经理⼈管理，两权分离） 第⼆次世界⼤战后 法⼈资本所有制 重新趋于合⼀（⽼板⾃⼰出钱、⾃⼰管，两权合⼀） （占主导地位 = 在整个资本主义经济体系⾥，它是最主要、起⽀配作⽤的所有制形式，决定这个阶段所有制的特 征；≠企业数量最多，≠资产总量⼀定 100%，≠到处都是它） （2）国家资本所有制：主要存在于基础设施和公共事业部⻔，在整个资本主义经济中所占的⽐重不⼤，有重要影 响，但不占主导地位（助记：国家资本是补短板的，不是经济⾥的主导形式） ⽑中特（5—6 单选； ⽑中特（5 22 多选） 单选；22", "year": 2027}, {"id": "s2-22", "set": 2, "num": 22, "src": "苏一六套卷（二）", "book": "苏一", "sub": "毛中特", "type": "multi", "stem": "在探索中国工业化道路的过程中，毛泽东强调重视农业、轻工业的发展：“更多地发展农业、轻工业，既可以更好地供给人民生活的需要，又可以增加资金积累和扩大市场。这不仅会使重工业发展得多些和快些，而且由于保障了人民生活的需要，会使它发展的基础更加巩固。”这一认识表明，走中国工业化道路应当", "opts": {"A": "把重工业作为经济建设的重点，同时充分注意发展农业和轻工业", "B": "以农业为基础，以工业为主导，以农轻重为序发展国民经济", "C": "先充分发展农业和轻工业，再集中力量发展重工业", "D": "发展工业和农业同时并举，处理好积累和消费的关系"}, "ans": "ABD", "ana": "①毛泽东指出，以工业为主导，把重工业作为我国经济建设的重点，以逐步建立独立的比较完整的基础工业体系和国防工业体系，这是维护国家独立、统一和安全，实现国家富强所必需的，是毫无疑义、必须肯定的。但同时必须充分注意发展农业和轻工业。②毛泽东提出了以农业为基础，以工业为主导，以农轻重为序发展国民经济的总方针。③发展工业必须和发展农业同时并举，工业才有原料和市场，才有可能为建立强大的重工业积累较多的资金。毛泽东多次阐述了统筹兼顾的方针，强调正确处理积累与消费的关系。题干中的“供给人民生活的需要”对应消费，“增加资金积累和扩大市场”说明农业、轻工业为重工业发展提供条件。ABD 正确。", "dis": "C 选项，毛泽东提出“以农轻重为序”，强调的是在以工业为主导  "C": "红军游击战争逐步成为中国革命的主要形式", "D": "革命根据地已经成为新民主主义共和国的完整形态"}, "ans": "ABC", "ana": "题干考查大革命失败后中国革命新道路的探索，既包括对革命道路的理论认识，也包括红军和根据地建设的实践发展。① 1929 年 9 月，中共中央给红四军前委的指示信指出：先有农村红军，后有城市政权，这是中国革命的特征，这是中国经济基础的产物。②随着革命新道路的开辟，中国革命开始走向复兴。到 1930 年夏，共产党领导人民群众建立了大小十几块农村根据地，红军发展到约 7 万人，连同地方武装共约 10 万人。红军游击战争实际上已经成为中国革命的主要形式，农村根据地成为积蓄和锻炼革命力量的主要战略阵地。③ 1931 年 11 月，成立了中华苏维埃共和国临时中央政府。中华苏维埃共和国是中国历史上第一个全国性的工农民主政权，是中国共产党在局部地区执政的重要尝试，扩大了党和红色政权的影响，一定程度上加强了对处于被分割状态的各根据地的中枢指挥作用，推动了各根据地的政权、经济、文化教育和党的自身建设，开创了土地革命战争新局面。因此 ABC 正确。", "dis": "D 选项，农村革命根据地是中国共产党领导工农群众进行政治、经济、文化和社会建设的主要阵地，是新民主主义共和国的雏形，还不是完整形态。", "ext": "（1）中华苏维埃共和国的成⽴ 【《⼿册》第 136 ⻚】 1931 年 11 ⽉，中华苏维埃第⼀次全国代表⼤会在江⻄瑞⾦召开，中华苏维埃共和国临时中央政府成⽴。 政权地位 中国历史上第⼀个全国性的⼯农⺠主政权。 执政范围 中国共产党在局部地区执政的重要尝试，扩⼤了党和红⾊政权的影响。 实⾏⼯农兵代表⼤会制度。各级苏维埃政府⼴泛吸收⼯农群众代表参加政权管理，⾏ 政权制度 使当家作主的权利。 （2）中国⾰命道路形成中的四篇著作 【详⻅：第 1 套，第 28 题】 （3）关于 BC（结合解析理解，属于知识储备） ①1929 年 9 ⽉，中共中央给红四军前委的指示信指出：先有农村红军，后有城市政权，这是中国⾰命的特征，这是 中国经济基础的产物。 ②随着⾰命新道路的开辟，中国⾰命开始⾛向复兴。到 1930 年夏，共产党领导⼈⺠群众建⽴了⼤⼩⼗⼏块农村根 据地，红军发展到约 7 万⼈，连同地⽅武装共约 10 万⼈。红军游击战争实际上已经成为中国⾰命的主要形式，农 村根据地成为积蓄和锻炼⾰命⼒量的主要战略阵地。 ③1931 年 11 ⽉，成⽴了中华苏维埃共和国临时中央政府。中华苏维埃共和国是中国历史上第⼀个全国性的⼯农⺠ 主政权，是中国共产党在局部地区执政的重要尝试，扩⼤了党和红⾊政权的影响，⼀定程度上加强了对处于被分割 状态的各根据地的中枢指挥作⽤，推动了各根据地的政权、经济、⽂化教育和党的⾃身建设，开创了⼟地⾰命战争 新局⾯。", "year": 2027}, {"id": "s2-28", "set": 2, "num": 28, "src": "苏一六套卷（二）", "book": "苏一", "sub": "史纲", "type": "multi", "stem": "习近平在纪念中国工农红军长征胜利 90 周年大会上指出：“红军长征创造了非凡的人间奇迹，铸就了伟大长征精神”。回顾长征的历史背景和发展进程，党和红军经过正反两方面经验的比较，逐步摆脱错误路线的影响，并在危急关头实现了伟大转折。符合这一论述的史实是", "opts": {"A": "第五次反“围剿”失败迫使红军长征", "B": "湘江战役的损失引发了对“左”倾错误的怀疑", "C": "遵义会议集中解决了军事和组织问题", "D": "四渡赤水、巧渡金沙江完成了北上抗日的战略转移"}, "ans": "ABC", "ana": "①王明等人的“左”倾教条主义错误，其最大的恶果，就是使红军在第五次反“围剿”作战中遭到失败，不得不退出南方根据地实行战略转移——长征。②在强渡湘江后，中央红军从长征出发时的 8.6 万人锐减到 3 万多人。严酷的事实教育了广大共产党员和红军指战员，促使他们对“左”倾错误领导产生了怀疑和不满。③ 1935 年 1 月，遵义会议集中解决了当时具有决定意义的军事和组织问题，开始确立以毛泽东同志为主要代表的马克思主义正确路线在党中央的领导地位，在最危急关头挽救了党、挽救了红军、挽救了中国革命。ABC 正确。", "dis": "D 选项，四渡赤水、巧渡金沙江使中央红军摆脱了国民党军队的围追堵截，赢得了战争的主动权，但此时尚未完成北上抗日的战略转移。1936 年 10 月，红军三大主力会师，长征胜利结束，实现了北上抗日的战略转移。【拓展】①中央红军完成北上战略转移的标志是 1935 年 10 月 的作用。人的意识活动能够影响人的情绪、意志和行为，并通过实践对客观世界产生作用。长征中坚定的理想信念支撑人们克服困难、坚持斗争，说明意识能够通过调节精神状态、增强意志和引导行动，影响实践活动的具体进程。这里强调的是信念对实际行动的调控和支撑，而不是意识直接改变客观条件。D 正确。", "dis": "A 选项，意识具有创造性，能够通过抽象思维揭示事物的本质和规律。材料着重说明理想信念支撑行为，没有着重说明人们如何认识事物的本质和规律，与题意不相符合。B 选项，意识具有目的性和计划性，人们能够在实践之前形成活动目标和对结果的预期。材料强调坚定信念对实际行动的影响，没有突出预先设计活动结果，与题意不相符合。C 错误，实践结果受到客观规律和客观条件的制约，主体的愿望只有符合客观实际并通过实践，才有可能实现。意识具有能动作用，并不能保证实践结果与主体意愿保持一致。", "ext": "（1）意识的能动作用【《手册》第 5-6 页：考点 5】 ①目的性和计划性：行动之前确定目标、拟订方案。②创造性：透过现象认识本质，还能在观念中创造新形象。 ③指导实践改造客观世界：把观念中的东西通过实践变为现实。④调控人的行为和生理活动：同样面对困难，不 同精神状态影响人的行动。 （2）意识的起源、本质 ①意识是自然界长期发展的产物 起源 ②意识也是社会历史发展的产物。社会实践，特别是劳动，在意识的产生和发展中起着决定 性的作用。语言促进了意识的发展（语言是意识的物质外壳） ①意识是人脑的机能和属性，是客观世界的主观映象 本质 ②意识是客观内容和主观形式的统一 ③无论意识正确与否都可以在物质世界找到其“原型” ①物质决定意识，意识反映物质 二者关系 ②意识是物质的产物，但又不是物质本身 （3）主观能动性和客观规律性的辩证统一 ①尊重客观规律是正确发挥主观能动性的前提 主观能动性和客观规律性 ②只有充分发挥主观能动性，才能正确认识和利用客观规律 的关系 ③实践是客观规律性与主观能动性统一的基础 ①从实际出发是正确发挥人的主观能动性的前提 正确发挥主观能动性的前 ②实践是正确发挥人的主观能动性的根本途径 提和条件 ③正确发挥人的主观能动性，还要依赖于一定的物质条件和物质手段", "year": 2027}, {"id": "s3-2", "set": 3, "num": 2, "src": "苏一六套卷（三）", "book": "苏一", "sub": "马原", "type": "single", "stem": "马克思在《关于费尔巴哈的提纲》中批评费尔巴哈撇开历史进程，假定一种抽象的、孤立的人的个体，把人的本质理解为将许多个人自然地联系起来的普遍性。这一批评针对的是", "opts": {"A": "承认不同个人具有共同的自然属性", "B": "把个人看作处于一定社会关系中的人", "C": "用抽象的共同性代替人的社会属性", "D": "把人的本质看作随社会历史条件变化而发展的"}, "ans": "C", "ana": "人的本质不是单个人所固有的抽象物，在其现实性上，它是一切社会关系的总和。人的本质属性是社会属性，应当把人放在具体的社会关系和历史条件中理解，而不能把人看作脱离历史的抽象个体。费尔巴哈撇开历史进程，把人的本质理解为许多个人所共同具有的自然的普遍性，实际上以抽象的共同性代替了现实的社会属性。马克思的批评正是针对这一问题。C 正确。", "dis": "A 选项，人具有自然属性，不同个人可以具有共同的自然特征。承认这些共同特征并没有错误，错误在于用它们代替人的社会本质，因而该项不是马克思批评的对象，与题意不相符合。B 选项，人的现实活动总是在一定社会关系中进行，把个人放在社会关系中考察，符合唯物史观理解人的基本立场，与题意不相符合。D 选项，人的社会关系随社会历史条件的变化而发展，人的本质也具有社会历史性，并非永恒不变。这符合马克思的观点，不是其批评的对象，与题意不相符合。", "ext": "人的本质与现实的社会关系 【记得复习《手册》第 28-29 页——的相关知识点】 （1）在其现实性上，人的本质是一切社会关系的总和。这里的“现实性”要求从现实的、从事社会实践的人出 发。 （2）人具有自然属性和社会属性，社会属性是人的本质属性。社会关系是具体的、历史的，人的本质也随社会关 系的变化而发展。不能凭抽象的共同人性解释不同时代、不同社会关系中的人。 （3）现实的人及其活动是社会历史存在和发展的前提。题目问“人的本质”，答“一切社会关系的总和”；问 “社会历史靠谁的活动才得以存在和发展”，答“现实的人及其活动”。", "year": 2027}, {"id": "s3-3", "set": 3, "num": 3, "src": "苏一六套卷（三）", "book": "苏一", "sub": "马原", "type": "single", "stem": "马克思从不同角度对资本进行了划分。将资本划分为不变资本和可变资本、将生产资本划分为固定资本和流动资本，其依据分别是", "opts": {"A": "价值周转方式不同、在剩余价值生产中的作用不同", "B": "在剩余价值生产中的作用不同、价值周转方式不同", "C": "在资本循环中的职能不同、在剩余价值生产中的作用不同", "D": "价值周转方式不同、在资本循环中的职能不同"}, "ans": "B", "ana": "根据资本在剩余价值生产中所起的不同作用，可以把资本区分为不变资本和可变资本。根据生产资本的不同部分在资本运动中的价值周转方式不同，可以把生产资本区分为固定资本和流动资本。因此，将资本划分为不变资本和可变资本的依据是在剩余价值生产中的作用不同；将生产资本划分为固定资本和流动资本的依据是价值周转方式不同。B正确。", "dis": "C、D 选项中的“在资本循环中的职能不同”，是把产业资本划分为货币资本、生产资本和商品资本的依据。", "ext": "（1）生产资本的两种划分【《手册》第 36—37 页】 对象 在剩余价值生产中的作用 价值周转方式 机器、厂房 不变资本，只转移已有价值 固定资本，价值分次转移 原料、燃料 不变资本，只转移已有价值 流动资本，价值一次转移 购买劳动力的资本 可变资本，活劳动创造新价值 流动资本，垫付价值在一次周转中收回 （2）资本循环【《手册》第 40 页】 阶段 职能形式 资本执行的职能 购买阶段 货币资本 购买生产资料与劳动力，为生产作准备。 生产阶段 生产资本 生产出包含剩余价值的商品，创造剩余价值。 售卖阶段 商品资本 出售商品，收回预付资本并实现剩余价值。 资本连续循环的条件：三种职能形式在空间上并存，三个阶段在时间上继起。 （3）资本周转【《手册》第 40 页】 ①周而复始、不断反复着的资本循环，就是资本周转。②影响周转速度的两个关键因素：资本周转时间、生产资 本中固定资本和流动资本的构成。③年剩余价值率＝剩余价值率×一年中可变资本的周转次数。", "year": 2027}, {"id": "s3-4", "set": 3, "num": 4, "src": "苏一六套卷（三）", "book": "苏一", "sub": "马原", "type": "single", "stem": "有人认为，俄国还不具备西欧那样的经济文化条件，因而不应当进行社会主义革命。列宁在《论我国革命》中提出，俄国可以先取得革命胜利，再“在工农政权和苏维埃制度的基础上赶上别国人民”。列宁所说的“赶上”，强调的是", "opts": {"A": "社会主义建设的长期性取决于各国历史文化传统的差异", "B": "社会主义制度的确立意味着工业化的任务已经完成", "C": "经济文化相对落后的国家须在工业化完成后取得政权", "D": "经济文化相对落后的国家需要在新制度下逐步创造社会主义的物质基础"}, "ans": "D", "ana": "经济文化相对落后的国家可以首先取得社会主义革命的胜利，而建设社会主义还需要长期发展生产力。题中“在……制度的基础上赶上”说明取得政权后仍须逐步创造社会主义建设所需的物质条件，D 正确。", "dis": "A 错误，历史文化传统的差异可以解释各国道路的多样性，不能据此决定社会主义建设过程的长期性。B 错误，社会制度的确立不会自动完成工业化任务。C 错误，俄国的实践说明经济文化相对落后的国家可以先取得政权，再在新制度下发展生产力。", "ext": "在实践中探索社会主义的发展规律 【《手册》第 51 页：考点 5】 （1）社会主义建设过程长期性的原因 ①生产力发展状况的制约。 ②经济基础和上层建筑发展状况的制约。 ③国际环境的严峻挑战。 ④马克思主义执政党对社会主义发展道路的探索和对社会主义建设规律的认识，需要一个长期的过程。 （2）社会主义发展道路多样性的原因 【详见：第 2 套，第 4 题】。", "year": 2027}, {"id": "s3-5", "set": 3, "num": 5, "src": "苏一六套卷（三）", "book": "苏一", "sub": "毛中特", "type": "single", "stem": "大革命失败后，中国共产党在探索革命新道路的过程中，逐步把党的工作重心由城市转向农村。毛泽东总结创建红军和农村革命根据地的实践经验，阐明在农村积蓄和发展革命力量、逐步夺取全国政权的道路，推动马克思主义同中国革命具体实际相结合。标志着毛泽东思想初步形成的著作包括①《中国的红色政权为什么能够存在？》②《井冈山的斗争》《星星之火，可以燎原》③《反对本本主义》《〈共产党人〉发刊词》④《实践论》《矛盾论》", "opts": {"A": "①②", "B": "①③", "C": "②③", "D": "③④"}, "ans": "A", "ana": "毛泽东在《中国的红色政权为什么能够存在？》《井冈山的斗争》《星星之火，可以燎原》《反对本本主义》等著作中，指明了中国革命的发展规律是：将党的工作重点从城市转入农村，在农村开展游击战争，进行土地革命，建立红色政权，把落后的农村变为先进的革命根据地。毛泽东提出并深入阐述的农村包围城市、武装夺取政权的思想，对红军和农村革命根据地的建立、巩固和发展发挥着根本指导作用，标志着毛泽东思想的初步形成。因此①②正确，选 A。", "dis": "对于③，《反对本本主义》属于毛泽东思想初步形成时期的代表著作，但《〈共产党人〉发刊词》属于毛泽东思想走向成熟时期的重要著作。对于④，《实践论》《矛盾论》运用马克思主义的认识论和辩证法，系统分析了党内“左”的和右的错误的思想根源，属于毛泽东思想走向成熟时期的重要著作，不是“初步形成”的标志性著作。", "ext": "毛泽东思想的初步形成与成熟 【《手册》第 55 页】 时期 代表性著作与理论成果 《中国的红色政权为什么能够存在？》《井冈山的斗争》《星星之火，可以燎原》 土地革命战争时期 《反对本本主义》。毛泽东提出并深入阐述了农村包围城市、武装夺取政权的思 想，标志着毛泽东思想的初步形成 《实践论》《矛盾论》《〈共产党人〉发刊词》《中国革命和中国共产党》《新民 遵义会议以后至抗日战争 主主义论》《改造我们的学习》《论联合政府》等。毛泽东系统阐述新民主主义革 时期 命理论，标志着毛泽东思想得到多方面展开而趋于成熟。 《在中国共产党第七届中央委员会第二次全体会议上的报告》《论人民民主专政》 解放战争时期和新中国成 《论十大关系》《关于正确处理人民内部矛盾的问题》等。毛泽东明确提出了把马 立后 克思列宁主义基本原理同中国具体实际进行“第二次结合，找出在中国怎样建设社 会主义的道路”的任务，并进行了艰辛探索", "year": 2027}, {"id": "s3-6", "set": 3, "num": 6, "src": "苏一六套卷（三）", "book": "苏一", "sub": "毛中特", "type": "single", "stem": "邓小平在《目前的形势和任务》中指出：“现代化建设的任务是多方面的，各个方面需要综合平衡，不能单打一。但是说到最后，还是要把经济建设当作中心。”从总结社会主义建设历史经验、实现工作重心转移的意义上看，确立这一中心地位意味着我们党", "opts": {"A": "重新确立了解放思想、实事求是的思想路线", "B": "明确了实现社会主义现代化的政治保证", "C": "实现了改革开放和社会主义现代化建设新时期最根本的拨乱反正", "D": "确立了社会主义初级阶段经济体制改革的目标"}, "ans": "C", "ana": "以经济建设为中心是党在改革开放和社会主义现代化建设新时期实现的最根本的拨乱反正。能否坚持以经济建设为中心，是关系到我国社会主义现代化的成败、关系到社会主义的前途和命运的大问题。邓小平指出：“离开了经济建设这个中心，就有丧失物质基础的危险。其他一切任务都要服从这个中心，围绕这个中心，决不能干扰它，冲击它。”C 正确。", "dis": "A 选项，属于思想路线方面的拨乱反正，题干强调的是工作重心转移。B 选项，坚持四项基本原则回答了解放和发展生产力的政治保证问题。D 选项，党的十四大明确把建立社会主义市场经济体制作为我国经济体制改革的目标。", "ext": "党在社会主义初级阶段的基本路线【《手册》第 70—71 页：考点 3】 （1）提出时间与重要性。1978 年党的十一届三中全会作出把党和国家工作中心转移到经济建设上来、实行改革开 放的历史性决策。1987 年党的十三大系统阐述社会主义初级阶段理论，明确概括党在社会主义初级阶段的基本路 线。党的基本路线是国家的生命线、人民的幸福线。 （2）党的十三大提出的基本路线 内容 要点 领导力量和依靠力量 中国共产党领导和团结全国各族人民。 内容 要点 一个中心、两个基本点。 ①以经济建设为中心，是兴国之要，回答社会主义的根本任务问题。 ②坚持四项基本原则，是立国之本，回答解放和发展生产力的政治保证问题。 基本途径 ③坚持改革开放，是强国之路，回答社会主义的发展动力和外部条件问题。 【注意】其中，以经济建设为中心，是党在改革开放和社会主义现代化建设新时期 实现的最根本的拨乱反正 根本立足点 自力更生，艰苦创业 十三大的表述是建设富强、民主、文明的社会主义现代化国家。现行党章的表述是 奋斗目标 建设富强、民主、文明、和谐、美丽的社会主义现代化强国。 （3）社会主义的根本任务【《手册》第 70—71 页】 ①社会主义的根本任务是发展生产力。②基本路线中的“以经济建设为中心”回答了社会主义的根本任务问题。", "year": 2027}, {"id": "s3-7", "set": 3, "num": 7, "src": "苏一六套卷（三）", "book": "苏一", "sub": "新思想", "type": "single", "stem": "共同富裕是中国特色社会主义的本质要求。促进共同富裕，必须正确处理效率和公平的关系，构建初次分配、再分配、第三次分配协调配套的制度体系，进一步优化收入分配结构。在这一制度体系中，发挥再分配的调节作用，需要采取的举措是", "opts": {"A": "健全工资合理增长机制", "B": "加大税收、社保、转移支付等的调节力度，提高精准性", "C": "健全生产要素由市场评价贡献、按贡献决定报酬的机制", "D": "引导、支持有意愿有能力的企业、社会组织和个人积极参与公益慈善事业"}, "ans": "B", "ana": "发挥再分配的调节作用，需要“加大税收、社保、转移支付等的调节力度，提高精准性”。B 正确。", "dis": "A 选项涉及工资合理增长，C 选项涉及按生产要素贡献决定报酬，两者都属于初次分配的举措。D 选项涉及公益慈善事业，属于第三次分配的举措。题干考查的是再分配的调节手段，ACD 均不符合题意。", "ext": "三次分配协调配套【《手册》第 103 页】 层次 典型方式 初次分配 劳动者取得工资，生产要素由市场评价贡献、按贡献决定报酬。 再分配 加大税收、社保、转移支付等的调节力度，提高精准性。 第三次分配 引导、支持有意愿有能力的企业、社会组织和个人积极参与公益慈善事业。 《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》提出：“推动形成橄榄型分配格局。”橄榄 型分配格局是中等收入群体占主体的分配格局，有利于人民共享改革发展成果、创造高品质生活，有利于减少社 会矛盾纠纷、促进社会和谐稳定，也有利于提振消费、扩大内需、推动经济持续健康发展。", "year": 2027}, {"id": "s3-8", "set": 3, "num": 8, "src": "苏一六套卷（三）", "book": "苏一", "sub": "新思想", "type": "single", "stem": "国家安全是中国式现代化行稳致远的重要基础。“十五五”规划纲要提出，要“坚定不移贯彻总体国家安全观，加快构建新安全格局，增强维护和塑造国家安全战略主动，走中国特色社会主义社会治理之路，确保社会生机勃勃又井然有序”。新时代中国国家安全的生命线是", "opts": {"A": "人民安全", "B": "政治安全", "C": "经济安全", "D": "社会安全"}, "ans": "B", "ana": "《“一国两制”下香港维护国家安全的实践》白皮书在“五、以高水平安全护航‘一国两制’事业高质量发展”中指出，坚持把政治安全摆在首位，是新时代中国国家安全的生命线。B 正确。", "dis": "A 选项，人民安全是总体国家安全观的宗旨。C 选项，经济安全是总体国家安全观的基础。D 选项，社会安全是国家安全体系的重点领域之一。题干考查新时代中国国家安全的生命线，ACD 均不符合题意。", "ext": "总体国家安全观的六组定位【《手册》第 108 页】 ①践行人民安全宗旨—新时代中国国家安全的根本立场。 ②坚持把政治安全摆在首位—新时代中国国家安全的生命线。 ③坚守维护国家利益准则—新时代中国国家安全的基本要求。 ④防范化解国家安全风险—新时代中国国家安全的中心任务。 ⑤推进国际共同安全—新时代中国国家安全的大国担当。 ⑥加强党对国家安全工作的绝对领导—新时代中国国家安全的根本保证。", "year": 2027}, {"id": "s3-9", "set": 3, "num": 9, "src": "苏一六套卷（三）", "book": "苏一", "sub": "新思想", "type": "single", "stem": "绿色发展正在改变人们的生产生活。在戈壁荒漠，风机和光伏板将风能、太阳能转化为电能，越来越多的绿电进入工厂和家庭；在工业生产中，清洁能源逐步替代煤炭等传统能源；在居民生活中，一些家庭告别燃煤取暖，采用热泵、地热等方式供暖，街头的新能源汽车也越来越多。这些变化表明，实现碳达峰碳中和的关键是", "opts": {"A": "健全绿色发展的保障体系", "B": "产业低碳化", "C": "能源绿色低碳转型", "D": "推进自然保护地体系建设"}, "ans": "C", "ana": "《碳达峰碳中和的中国行动》白皮书指出，能源活动是碳排放的最主要来源，能源绿色低碳转型是实现碳达峰碳中和的关键。材料中的风电光伏发展体现能源供给结构的优化，工业用能替代、清洁供暖和新能源汽车推广体现能源消费方式的转变，共同说明能源绿色低碳转型是实现碳达峰碳中和的关键。C 正确。", "dis": "", "ext": "绿色转型的两个范围【《手册》第 106 页】 ①实现碳达峰碳中和的关键落在能源绿色低碳转型，既看能源怎样生产，也看怎样消费。 ②推动经济社会发展绿色化、低碳化涉及生产生活方式的整体转变，是实现高质量发展的关键环节，是解决我国 资源环境生态问题的基础之策。双碳目标与节能降碳的固定搭配【详见：第 1 套，第 25 题】。", "year": 2027}, {"id": "s3-10", "set": 3, "num": 10, "src": "苏一六套卷（三）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "在 19 世纪末资本主义进入帝国主义阶段后，资本输出成为殖民剥削的重要形式。西方资产阶级迫使一切民族采用资产阶级的生产方式，一句话，它按照自己的面貌为自己创造出一个世界。但是，西方殖民主义势力来到中国，并不是为了使中国成为独立的资本主义国家，而是为了", "opts": {"A": "促进中国城乡商品经济的发展", "B": "使中国封建经济逐步解体并完成资本主义转型", "C": "把中国变成资本主义世界体系的附庸", "D": "破坏中国自给自足的自然经济基础"}, "ans": "C", "ana": "在 19 世纪末资本主义进入帝国主义阶段后，资本输出成为殖民剥削的重要形式。资本主义的发展逐步使人类历史成为世界历史。西方资产阶级迫使一切民族采用资产阶级的生产方式，一句话，它按照自己的面貌为自己创造出一个世界。但是，西方殖民主义势力来到东方，并不是为了使东方国家成为独立的资本主义国家，而是为了把它们纳入资本主义的世界体系，成为殖民地、半殖民地，成为自己在经济上、政治上、文化上的附庸。C 正确。", "dis": "AD 选项是外国资本主义入侵在客观上产生的经济影响，不是西方殖民主义侵略中国的目的。B 选项，外国资本主义入侵促使中国封建经济逐步解体，但没有使中国完成资本主义转型，而是使中国逐步沦为半殖民地半封建社会。", "ext": "（1）资本输出与近代中国的社会变化 ①手段：实行商品倾销和资本输出【《手册》第 119 页】。商品倾销通过销售工业品占领市场。资本输出通过向外投 资或贷款获得利润或利息，例如在华设厂、开矿，或向清政府贷款并取得附加权益。 ②目的：把中国变成资本主义世界体系的附庸。西方殖民主义势力来到东方，并不是为了使东方国家成为独立的 资本主义国家，而是为了把它们纳入资本主义的世界体系，成为殖民地、半殖民地，成为自己在经济上、政治上、 文化上的附庸 ③后果：中国自然经济的基础受到破坏，外国资本主义在华势力扩大，中国经济的依附性加深。 （2）半殖民地与半封建各从哪里判断 【详见：第 1 套，第 10 题。手册第 118 页：考点 2】。", "year": 2027}, {"id": "s3-11", "set": 3, "num": 11, "src": "苏一六套卷（三）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "1929 年 12 月，古田会议通过了毛泽东起草的决议，其中最重要的是关于纠正党内错误思想的决议案。决议阐述了加强党的思想建设的极端重要性，指明党内各种非无产阶级思想的表现、来源及纠正办法。这些规定着重解决的是", "opts": {"A": "如何在革命低潮中确定土地革命和武装起义的方针", "B": "如何在党和军队以农民为主要成分的条件下保持其政治性质", "C": "如何在长征途中解决具有决定意义的军事和组织问题", "D": "如何在民族危机加深的条件下建立抗日民族统一战线"}, "ans": "B", "ana": "古田会议决议是中国共产党和红军建设的纲领性文献，是党和人民军队建设史上的重要里程碑。古田会议确立了马克思主义建党建军原则，创造性地解决了在农村环境中、在党组织和军队以农民为主要成分的条件下，如何保持党的无产阶级先锋队性质和建设党领导的新型人民军队的重大问题。题干强调纠正各种非无产阶级思想、加强党的思想建设，所要解决的正是在党和军队以农民为主要成分的条件下，如何保持党的无产阶级先锋队性质和建设党领导的新型人民军队的问题。B 正确。", "dis": "A 选项，是 1927 年八七会议解决的问题。C 选项是 1935 年遵义会议解决的问题。D 选项是 1935 年瓦窑堡会议解决的问题。", "ext": "从大革命失败到抗日民族统一战线方针的提出 【《手册》第 134、135、136、138、214 页】 会议 为什么召开 解决了什么问题 ①彻底清算大革命后期的陈独秀右倾机会 八七会议 主义错误。②确定土地革命和武装起义的 大革命失败，革命力量遭受严重损失， （1927 年 8 月 7 日，汉 方针。③毛泽东提出“须知政权是由枪杆 党迫切需要确定新的斗争方针 口） 子中取得的”。会议给正处于思想混乱和 组织涣散中的党指明了新的出路。 确立思想建党、政治建军原则，强调红军 是执行革命政治任务的武装集团，必须绝 古田会议 在农村环境中，党员和红军战士多出身 对服从党的领导。创造性地解决了在农村 （1929 年 12 月，福建 于农民，红四军党内存在各种非无产阶 环境中、在党组织和军队以农民为主要成 上杭） 级思想 分的条件下，如何保持党的无产阶级先锋 队性质和建设党领导的新型人民军队的重 大问题 ①集中解决具有决定意义的军事问题和组 织问题。②开始确立以毛泽东同志为主要 遵义会议 第五次反“围剿”失败，长征初期红军 代表的马克思主义正确路线在党中央的领 （1935 年 1 月，贵州遵 又遭受严重损失。 导地位。③在极端危急关头挽救了党、挽 义） 救了红军、挽救了中国革命，是党的历史 上生死攸关的转折点。 ①提出建立抗日民族统一战线的策略方 瓦窑堡会议 针。②批评“左”倾关门主义，强调在统 华北事变后民族危机加深，需要解决团 （1935 年 12 月，陕北 一战线中坚持无产阶级领导权。③为迎接 结哪些力量共同抗日的问题。 瓦窑堡） 全国抗日新高潮到来作了理论和政治上的 准备。", "year": 2027}, {"id": "s3-12", "set": 3, "num": 12, "src": "苏一六套卷（三）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "1937 年卢沟桥事变爆发后，中华民族面临空前严重的民族危机，如何动员和组织全国人民争取抗战胜利，成为中国共产党面临的重大任务。同年 8 月，中共中央在陕北洛川召开政治局扩大会议，通过抗日救国十大纲领，强调打倒日本帝国主义的关键在于", "opts": {"A": "反对主观主义以整顿学风", "B": "加强根据地的政权建设", "C": "废除封建性及半封建性剥削的土地制度，实行耕者有其田", "D": "使已经发动的抗战成为全面的全民族抗战"}, "ans": "D", "ana": "全国性抗战开始后，国共两党虽然共同抗日，但实行的是两条不同的抗战路线。国民党实行片面抗战路线，主要依靠政府和军队抗战；中国共产党实行全面抗战路线，即人民战争路线。两条不同抗战路线的存在，是中国一切问题的关键。1937 年 8 月，中国共产党在陕北召开洛川会议，制定了抗日救国十大纲领，强调要打倒日本帝国主义，关键在于使已经发动的抗战成为全面的全民族抗战。为此，必须实行全国军事总动员、全国人民总动员；必须改革政治机构，给人民以充分的抗日民主权利，并适当改善工农大众生活。D 正确。", "dis": "A 选项，反对主观主义以整顿学风，是延安整风运动最主要的任务，不是洛川会议提出的内容。B 选项，加强政权建设，是抗日根据地建设的首要的、根本的任务。C选项，废除封建剥削制度、实行耕者有其田，是解放战争时期确立的土地政策。", "ext": "（1）洛川会议（1937 年 8 月）【《手册》第 139 页：考点 3】。七七事变后，全国性抗战已经开始。怎样把各阶层人民 的力量动员起来，成了迫切问题。洛川会议制定抗日救国十大纲领。强调打倒日本帝国主义，关键在于使已经发 动的抗战成为全面的全民族抗战。②实行全国军事总动员、全国人民总动员。③改革政治机构，给人民以充分的 抗日民主权利，并适当改善工农大众生活。④坚持统一战线中无产阶级的领导权，在敌后发动独立自主的山地游 击战争，在国民党统治区发动抗日群众运动。 （2）土地政策怎样随革命任务变化 【《手册》第 212 页】 时间 土地政策及变化 1928 年：《井冈山土地法》是党历史上第一个土地法。 1929 年：《兴国土地法》把“没收一切土地”改为“没收一切公共土地及地主阶级 土地革命战争时期 的土地”，保护中农利益。 （1927-1937） 1931 年：坚定地依靠贫农、雇农，联合中农，限制富农，保护中小工商业者，消灭 地主阶级。分配土地实行抽多补少、抽肥补瘦。【《手册》第 135 页】 全民族抗日战争时期 地主减租减息、农民交租交息。一方面减轻农民负担，另一方面联合地主阶级中的 （1937-1945） 抗日力量，服务于团结抗日。【《手册》第 141 页考点 6】 1946 年《五四指示》推动解放区由减租减息转向实现耕者有其田。1947 年《中国 解放战争时期（1945- 土地法大纲》明确废除封建性及半封建性剥削的土地制度，实行耕者有其田的土地 1949） 制度。【《手册》第 146 页考点 5】 《中华人民共和国土地改革法》规定废除地主阶级封建剥削的土地所有制，实行农 新中国成立初期 民的土地所有制。分得土地后归农民个人所有，农业合作化才涉及向集体所有转 变。【《手册》第 150 页考点 2】", "year": 2027}, {"id": "s3-13", "set": 3, "num": 13, "src": "苏一六套卷（三）", "book": "苏一", "sub": "史纲", "type": "single", "stem": "1949 年 10 月 1 日下午，首都北京 30 万军民在天安门广场隆重举行开国大典。开国大典之前，毛泽东主持召开中央人民政府委员会第一次会议。会议一致决议接受《中国人民政治协商会议共同纲领》为中央人民政府施政纲领。构成《中国人民政治协商会议共同纲领》的基础是①中共七届二中全会的决议②《新民主主义论》③《论人民民主专政》④《论联合政府》", "opts": {"A": "①②", "B": "①③", "C": "②③", "D": "③④"}, "ans": "B", "ana": "随着人民解放战争的胜利发展，建立新中国的任务被提上日程。1949 年 3 月召开的中共七届二中全会，规定了党在全国胜利后应当采取的基本政策，指出了新中国的发展方向。1949 年 6 月 30 日，毛泽东发表《论人民民主专政》，系统阐明人民民主专政的领导力量、阶级基础以及各阶级在国家政权中的地位，为即将成立的新中国作了政治理论准备。中共七届二中全会的决议和毛泽东的《论人民民主专政》，共同构成了《中国人民政治协商会议共同纲领》的基础。B 正确。", "dis": "对于②，《新民主主义论》发表于 1940 年，系统阐述新民主主义理论，但并非起草《共同纲领》的基础。对于④，《论联合政府》是毛泽东在 1945 年中共七大上所作的政治报告，系统阐述了中国共产党的政治主张和建立民主联合政府的要求，不是制定《共同纲领》的直接基础。", "ext": "（1）从建国准备到国家根本大法【《手册》第 148 页】 ①基础：七届二中全会的决议和《论人民民主专政》。 ②通过：1949 年 9 月，中国人民政治协商会议第一届全体会议。 ③作用：《共同纲领》在一个时期内起着新中国临时宪法的作用。 ④施政纲领：1949 年 10 月 1 日，中央人民政府委员会第一次会议决定接受《共同纲领》为施政纲领。1954 年第 一届全国人民代表大会第一次会议通过新中国第一部宪法。 （2）为新中国绘制蓝图 【《手册》第 148 页】 1949 年 3 月，中国共产党在河北省平山县西柏坡村召开中共七届二中全会： ①提出了迅速夺取全国胜利的方针 ②提出党的工作重心必须由乡村转移到城市（注意是“提出”） 中共七届二中全会 ③规定了党在全国胜利后在政治、经济、外交方面应当采取的基本政策 （1949 年 3 月） ④指出了中国由农业国转变为工业国、由新民主主义社会转变为社会主义社会的发 展方向 ⑤提出了“两个务必”的思想：务必使同志们继续地保持谦虚、谨慎、不骄、不躁 的作风；务必使同志们继续地保持艰苦奋斗的作风 1949 年 3 月 25 日，毛泽东等中央领导人与中央机关、人民解放军总部进驻北平香 历史标志 山，标志着中国革命重心从农村转向城市 1949 年 6 月，毛泽东发表了《论人民民主专政》一文： ①对新民主主义革命的基本经验作了集中概括 ②丰富和发展了马克思主义关于无产阶级领导人民革命的理论 《论人民民主专政》 ③为新中国的建立奠定了理论基础和政策基础 ④中共七届二中全会的决议和《论人民民主专政》，构成了《中国人民政治协商会 议共同纲领》的基础 完成创建新中国的任务，是由中国人民政治协商会议第一届全体会议来承担的。 1949 年 9 月 21 日，中国人民政治协商会议第一届全体会议在北平隆重开幕： ①会议通过了《中国人民政治协商会议组织法》《中华人民共和国中央人民政府组 织法》和《中国人民政治协商会议共同纲领》 人民政协与《共同纲领》 ②《中国人民政治协商会议共同纲领》成为中国人民的大宪章，在一个时期内起着 新中国临时宪法的作用 ③人民政协会议的召开，标志着中国的新型政党制度——中国共产党领导的多党合 作和政治协商制度的确立", "year": 2027}, {"id": "s3-14", "set": 3, "num": 14, "src": "苏一六套卷（三）", "book": "苏一", "sub": "思法", "type": "single", "stem": "青年马克思在谈到职业选择时写道：“如果我们选择了最能为人类而工作的职业，那么，重担就不能把我们压倒，因为这是为大家作出的牺牲；那时我们所享受的就不是可怜的、有限的、自私的乐趣，我们的幸福将属于千百万人。”这一职业追求充分体现，社会主义职业道德的最高层次要求是", "opts": {"A": "爱岗敬业", "B": "办事公道", "C": "热情服务", "D": "奉献社会"}, "ans": "D", "ana": "奉献社会是社会主义职业道德的最高层次要求。把为人类工作、为众人谋幸福作为职业追求，体现了职业劳动的社会意义。D 正确。", "dis": "A 选项，爱岗敬业强调对岗位和职责的态度；B 选项，办事公道强调公正处理职业事务；C 选项，热情服务强调对待服务对象的态度。ABC 均不符合题意。", "ext": "职业道德的主要内容【《手册》第 167 页】 ①爱岗敬业：热爱岗位、认真履职。 ②诚实守信：履约守诺。 ③办事公道：公正处理职业事务。 ④热情服务：主动服务、尊重服务对象。 ⑤奉献社会：社会主义职业道德中最高层次的要求，体现了社会主义职业道德的最高目标指向。 社会主义道德建设的核心“为人民服务”【详见：第 1 套，第 14 题】。", "year": 2027}, {"id": "s3-15", "set": 3, "num": 15, "src": "苏一六套卷（三）", "book": "苏一", "sub": "时政", "type": "single", "stem": "新一轮科技革命和产业变革加速突破，全球科技竞争更加聚焦基础前沿领域，原创性颠覆性创新的重要性日益凸显。2026 年 4 月，习近平总书记在上海指出，要进一步打牢科技强国建设根基。在整个科学体系中，居于源头地位的是", "opts": {"A": "应用开发", "B": "基础研究", "C": "中试验证", "D": "成果转化"}, "ans": "B", "ana": "习近平总书记在加强基础研究座谈会上指出：“基础研究是整个科学体系的源头，是所有技术问题的总机关，是全球科技竞争的前沿阵地。”B 正确，ACD 不符合题意。", "dis": "", "ext": "2026 年 4 月 30 日上海加强基础研究座谈会 （1）定位与要求。基础研究是整个科学体系的源头，是所有技术问题的总机关，是全球科技竞争的前沿阵地。要 以更大力度、更实举措加强基础研究，提升我国原始创新能力，进一步打牢科技强国建设根基。（2）会议围绕四 方面作出部署 方面 可以直接辨认的举措 坚持四个面向（世界科技前沿、经济主战场、国家重大需求、人民生命健康）。国家科研机 科研布局 构、高水平研究型大学发挥引领作用，企业主导产学研用深度融合。打通基础研究、应用开 发、成果转化的创新链条。 教育、科技、人才一体推进。在科研一线发现和培养人才，通过任务牵引、以老带新，大力扶 人才队伍 持青年人才。 逐步提高基础研究经费占比，形成多元化投入格局。健全符合基础研究特点的分类评价体系。 支持保障 营造开放包容、宽容失败的创新环境。加强科研诚信建设。 融入全球创新网络，对气候变化、能源环境、生命健康等共同问题开展联合攻关，积极参与全 国际合作 球科技治理。", "year": 2027}, {"id": "s3-16", "set": 3, "num": 16, "src": "苏一六套卷（三）", "book": "苏一", "sub": "时政", "type": "single", "stem": "2026 年 10 月，新中国迎来恢复联合国合法席位 55 周年。1971 年 10 月 25 日，第二十六届联合国大会以压倒性多数通过第 2758 号决议，决定恢复中华人民共和国在联合国的一切权利，承认中华人民共和国政府代表是中国在联合国的唯一合法代表。这标志着占世界人口四分之一的中国人民重返联合国舞台。于联合国而言，这一历史性事件的重大意义主要在于", "opts": {"A": "有力巩固国际社会坚持一个中国原则的格局", "B": "显著增强联合国的普遍性、代表性与权威性", "C": "中国对外交往格局豁然打开", "D": "壮大广大发展中国家维护国际公道正义的力量"}, "ans": "B", "ana": "拥有世界近 1/4 人口、代表世界进步力量的最大发展中国家重返联合国，补齐了联合国代表性上最大的一块短板，显著增强这一国际组织的普遍性、代表性与权威性，巩固联合国在全球治理体系的中心地位，开启中国与联合国携手同行的崭新篇章。B 正确。", "dis": "A 选项和 C 选项，属于对中国而言的意义；D 选项，属于对世界而言的意义；题干考查的是“于联合国而言”的意义，ACD 均不符合题意。二、多项选择题：17～33 小题，每小题 2 分，共 34 分。下列每题给出的四个选项中，至少有两个选项是符合题目要求的。", "ext": "联合国大会第 2758 号决议 （1）1971 年 10 月 25 日，第二十六届联合国大会通过第 2758 号决议，恢复中华人民共和国在联合国的一切权 利。此处考“恢复合法席位”，中国是联合国创始会员国。 （2）于联合国而言，第 2758 号决议绝非普通的席位调整，而是国际组织合法性的一次重要完善。中国重返联合 国：显著增强这一国际组织的普遍性、代表性与权威性，巩固联合国在全球治理体系的中心地位，开启中国与联 合国携手同行的崭新篇章。 【相关考点拓展】全球治理【《手册》第 114 页】 （1）中国提出全球治理倡议，旨在推动构建更加公正合理的全球治理体系。 （2）落实全球治理倡议： ①最根本的是坚定维护联合国的权威和地位 ②最关键的是大国展现责任担当 ③最需要的是各国团结合作 ④最紧迫的是弥补和平与发展赤字 （3）必须毫不动摇地维护以联合国为核心的国际体系，维护以国际法为基础的国际秩序，维护以联合国宪章宗旨 和原则为基础的国际关系基本准则 （4）习近平总书记指出，“提出构建人类命运共同体理念和四大全球倡议，一个重要考虑就是维护联合国地位和 权威”", "year": 2027}, {"id": "s3-17", "set": 3, "num": 17, "src": "苏一六套卷（三）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "面对不断变异的植物病原物，研究人员尝试借助人工智能设计新的植物免疫受体。他们利用模型预测病原蛋白结构，生成并筛选候选方案，再据此构建新的免疫受体，通过植物实验检验其识别病原蛋白、激活免疫反应的功能。人工智能在这一研究中的应用表明，它", "opts": {"A": "能够作为实践中介连接研究主体与研究对象", "B": "能够将人类的直觉思维化约为数字信号", "C": "能够在承担科研功能的过程中获得人类意识的社会属性", "D": "能够模拟和扩展人的部分认识功能"}, "ans": "AD", "ana": "实践中介是主体和客体相互作用所借助的工具、手段，以及运用、操作这些工具和手段的程序和方法。研究人员借助人工智能预测病原蛋白结构、设计免疫受体，并据此开展植物实验，人工智能作为研究工具连接了研究主体与研究对象，A 正确。人工智能是对人脑组织结构与思维运行机制的模仿，是人类智能的物化，能够模拟和扩展人的部分认识功能。模型预测结构、生成并筛选候选方案，扩展了研究人员处理信息和研究设计的能力，但仍须由研究人员组织实验、检验结果，D 正确。", "dis": "B 错误，人工智能能够获得人类意识中可以化约为数字信号的内容，但人脑中仍有无法被化约的内容。教材指出，直觉思维是瞬间完成的对事物本质特征的直接领悟，由于绕开了逻辑推理，人们往往只能描述其心理状态，而无法将其化约为数字信号。模型能够生成候选方案，不等于把人类直觉思维本身化约为数字信号。C 错误，意识是社会的产物，具有社会性；人工智能是人造机器，不可能真正具备人类的社会属性。在人的组织下承担科研功能，并不意味着人工智能因此获得人的意识及其社会属性。", "ext": "（1）实践的基本结构：主体、客体和中介 【《手册》第 14 页：考点 1】 ①实践主体是从事实践活动的人 ②实践客体是实践活动所指向的对象 ③实践中介包括各种形式的工具、手段以及运用、操作这些工具和手段的程序和方法。 ①实践的主体和客体相互作用的关系包括：实践关系（最根本的关系）、认 识关系、价值关系 三者关系 ②实践的主体和客体正是依靠中介系统才能够相互作用 ③人类一切实践活动的结果都是主体客体化的结果 （2）人工智能为什么不能取代人类智能【《手册》第 7 页】 人工智能是人的意识能动性的一种特殊表现，是人的本质力量的对象化、现实化。科研人员确定研究目的、选择 方法，人工智能作为实践中介协助处理数据。 ① 情感、信念、意志。人工智能只是对人类的理性智能的模拟和扩展，不具备情感、信念、意志等人类意识形 式。 ② 社会属性。人工智能不可能真正具备人类的社会属性。 ③ 语言的真实意义。人类的自然语言是思维的物质外壳和意识的现实形式，而人工智能难以完全具备理解自然语 言真实意义的能力。 ④ 数字信号的限度。人工智能能够获得人类意识中可以化约为数字信号的内容，但人脑中总有许多东西是无法被 化约的。比如潜意识。", "year": 2027}, {"id": "s3-18", "set": 3, "num": 18, "src": "苏一六套卷（三）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "从用手机控制单件家电，到灯光、空调等设备联动，智能家居产品为消费者提供了新的生活体验。消费者不再满足于购买一台台独立的家电，对整套家居服务的需求日益增长，又推动企业改进产品和服务，从销售单件产品转向提供整体解决方案。这一过程蕴含的哲学道理有", "opts": {"A": "矛盾双方相互依存，一方的发展以另一方的发展为条件", "B": "矛盾的主要方面和次要方面在一定条件下相互转化", "C": "矛盾双方相互依存意味着双方在事物发展中具有同等地位", "D": "矛盾双方能够在相互作用中各自得到发展"}, "ans": "AD", "ana": "矛盾的同一性是矛盾双方相互依存、相互贯通的性质和趋势。同一性是事物存在和发展的前提，一方的发展以另一方的发展为条件。智能家居产品为消费提供新的对象和方式，消费需求又为生产改进提出要求，说明生产与消费相互依存、互为发展条件，A 正确。同一性还使矛盾双方能够相互吸取有利于自身的因素，在相互作用中各自得到发展。新的产品和服务提升了消费体验，增长的整体服务需求又推动企业由销售单件产品转向提供整体解决方案，体现了双方在相互作用中得到发展，D 正确。", "dis": "B 选项，矛盾的主要方面和次要方面在一定条件下可以相互转化，即双方的支配地位与非支配地位发生改变。材料呈现的是生产与消费相互促进，没有说明二者的主次地位发生互换，与题意不相符合。C 错误，矛盾双方相互依存，不等于双方处于同等地位。矛盾发展具有不平衡性，主要方面居于支配地位，次要方面居于被支配地位，不能由相互依存推出地位相同。", "ext": "矛盾的同一性与斗争性【《手册》第 9 页】 比较 同一性 斗争性 对立面相互依存、相互贯通，在一定条件下可以 相互区别 对立面相互排斥、相互分离。 相互转化。 ①同一性是事物存在和发展的前提，一方的发展 ①促进矛盾双方力量的变化，为对立面的 作用 以另一方的发展为条件。②双方相互吸取有利于 转化、事物的质变创造条件。②是一种矛 自身的因素，各自得到发展。③规定事物转化的 盾统一体向另一种矛盾统一体过渡的决定 可能和发展的趋势。 性力量。 斗争性寓于同一性之中，同一性通过斗争性来体现。二者相结合，推动事物变化发展。 （3）在事物发展过程中，条件不同，矛盾的同一性和斗争性所处的地位会有所不同： ①在一定的条件下，矛盾的斗争性可能处于主要方面 ②在另外的条件下，矛盾的同一性可能处于主要方面 如斗争性/同一性在事物发展中始终处于主要地位（×） （4）内因和外因： ①内因（内部矛盾）是事物发展的根本原因，是事物发展的根据 ②外因（外部矛盾）是事物发展的条件，影响事物的发展，外因必须通过内因起作用 （4）矛盾双方主次地位及其方法论 【详见：第 2 套，第 17 题、手册第 10 页】。", "year": 2027}, {"id": "s3-19", "set": 3, "num": 19, "src": "苏一六套卷（三）", "book": "苏一", "sub": "马原", "type": "multi", "stem": "马克思、恩格斯在《德意志意识形态》中分析大工业的作用时指出，理论力学的发展是大工业兴起的条件之一。大工业创造了交通工具和世界市场，使各国逐渐摆脱原有的孤立状态，人们需要的满足日益依赖整个世界。与此同时，大工业发展起来的生产力又受到资本主义私有制的束缚。这一分析表明", "opts": {"A": "生产方式的发展变革是世界历史形成和发展的基础", "B": "普遍交往是世界历史的基本特征", "C": "生产关系能够对生产力的发展起阻碍作用", "D": "科学技术进步是社会形态更替的决定性力量"}, "ans": "ABC", "ana": "生产方式的发展变革是世界历史形成和发展的基础。大工业创造交通工具和世界市场，推动各国逐渐摆脱孤立状态，说明生产方式的变革推动了历史向世界历史的转变，A 正确。普遍交往是世界历史的基本特征。人们需要的满足日益依赖整个世界，体现了交往范围的扩展以及各国之间联系和依赖的加强，B 正确。生产关系对生产力具有反作用，适合生产力发展要求时起推动作用，不适合时起阻碍作用。大工业形成的生产力受到资本主义私有制束缚，说明一定的生产关系能够阻碍生产力发展，C 正确。
